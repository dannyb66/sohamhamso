# ──────────────────────────────────────────────────────────────────────────────
# Cron B — YouTube Shorts deployment (upload).
#
# Every 4h (30min offset from Cron A): pulls the oldest `approved` row with no
# YouTube id, copies the rendered artifact from R2, and uploads to @sohamhamso
# as `unlisted` with localized metadata via `scripts/youtube-upload.ts`. Single
# job, no matrix — one channel. A daily-quota pre-check inside the script
# prevents 403s; the operator flips videos public later in YouTube Studio.
#
# Required GitHub secrets:
#   YOUTUBE_OAUTH_CLIENT_ID, YOUTUBE_OAUTH_CLIENT_SECRET
#                              — OAuth client for the @sohamhamso channel
#   YT_REFRESH_TOKEN           — long-lived refresh token (scope youtube.upload)
#   R2_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL
#                              — S3-compatible R2 access (bucket sohamhamso-backups)
#
# Manual trigger: Actions tab → "YouTube upload (Cron B)" → Run workflow.
# ──────────────────────────────────────────────────────────────────────────────
name: YouTube upload (Cron B)

on:
  # HOLD (2026-06-20): scheduled shorts upload is paused while we migrate to
  # per-language YouTube channels (12 langs, one channel each). Auto-upload to
  # the single @sohamhamso channel is wrong now — restore the schedule below
  # once per-channel auth + lang→channel routing land. Render (Cron A) keeps
  # running so the 0.75-speed catalogue stays ready to publish. Manual dispatch
  # stays enabled for migration testing.
  #
  # schedule:
  #   # Every 4h, 30min offset from Cron A so renders settle before upload.
  #   - cron: '47 */4 * * *'
  workflow_dispatch:
    inputs:
      text_slug:
        description: 'Restrict upload to one text id/slug (e.g. siva-sutras)'
        required: false
        type: string
      lang:
        description: 'Restrict upload to one lang code (e.g. en, hi)'
        required: false
        type: string
      limit:
        description: 'Max uploads this run (default comes from script)'
        required: false
        type: string
      dry_run:
        description: 'Plan selected rows without uploading'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # used by the failure-notification step

# Serialize all YouTube pipeline crons: the single R2 state DB must never be
# written by two runs at once. cancel-in-progress: false lets in-flight runs
# finish so partial progress is pushed back rather than discarded.
concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    # Scheduled runs stay dormant until the repository variable is explicitly
    # enabled after OAuth and quota checks. Manual dispatch remains available.
    if: github.event_name == 'workflow_dispatch' || vars.YT_UPLOAD_SCHEDULE_ENABLED == 'true'
    # 90 min: chapter videos run to ~1 GB (8 Mbps CBR) — a slow multipart
    # stream to YouTube can take well over the old 30-min budget.
    timeout-minutes: 90
    env:
      # ── YouTube OAuth (single chokepoint reads these). ───────────────
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Per-language channel tokens (one channel per lang; code falls back to YT_REFRESH_TOKEN).
      YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      YT_REFRESH_TOKEN_TA: ${{ secrets.YT_REFRESH_TOKEN_TA }}
      YT_REFRESH_TOKEN_TE: ${{ secrets.YT_REFRESH_TOKEN_TE }}
      YT_REFRESH_TOKEN_KN: ${{ secrets.YT_REFRESH_TOKEN_KN }}
      YT_REFRESH_TOKEN_ML: ${{ secrets.YT_REFRESH_TOKEN_ML }}
      YT_REFRESH_TOKEN_BN: ${{ secrets.YT_REFRESH_TOKEN_BN }}
      YT_REFRESH_TOKEN_MR: ${{ secrets.YT_REFRESH_TOKEN_MR }}
      YT_REFRESH_TOKEN_GU: ${{ secrets.YT_REFRESH_TOKEN_GU }}
      YT_REFRESH_TOKEN_PA: ${{ secrets.YT_REFRESH_TOKEN_PA }}
      YT_REFRESH_TOKEN_OR: ${{ secrets.YT_REFRESH_TOKEN_OR }}
      YT_REFRESH_TOKEN_AS: ${{ secrets.YT_REFRESH_TOKEN_AS }}
      # ── R2 / S3-compatible storage for rendered artifacts. ───────────
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      # ── R2-synced state DB (pulled before / pushed after the run). ────
      YOUTUBE_DB_PATH: db/youtube-state.db
      # ── Manual dispatch scoping; empty on scheduled runs. ────────────
      YT_UPLOAD_TEXT_SLUG: ${{ github.event.inputs.text_slug }}
      YT_UPLOAD_LANG: ${{ github.event.inputs.lang }}
      YT_UPLOAD_LIMIT: ${{ github.event.inputs.limit }}
      YT_UPLOAD_DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # db/sohamhamso.db is no longer committed (plan item A6) — rebuild it
      # from data/corpus/*.yaml; the uploader resolves verse titles and
      # translations from the corpus DB.
      - name: Build corpus DB from YAML
        run: bun run db:ensure

      # Pull the state DB from R2 so the uploader reads/writes shared state
      # (ephemeral runners start with no DB).
      - name: Pull state DB
        run: bash scripts/youtube-state-db.sh pull

      - name: Upload batch
        run: |
          flags=()
          if [[ -n "${YT_UPLOAD_TEXT_SLUG:-}" ]]; then flags+=( "--text-slug=${YT_UPLOAD_TEXT_SLUG}" ); fi
          if [[ -n "${YT_UPLOAD_LANG:-}" ]]; then flags+=( "--lang=${YT_UPLOAD_LANG}" ); fi
          if [[ -n "${YT_UPLOAD_LIMIT:-}" ]]; then flags+=( "--limit=${YT_UPLOAD_LIMIT}" ); fi
          if [[ "${YT_UPLOAD_DRY_RUN:-false}" == "true" ]]; then flags+=( "--dry-run" ); fi
          bun scripts/youtube-upload.ts "${flags[@]}"

      # Push the mutated state DB back to R2 even on failure so partial
      # progress (e.g. rows flipped to uploading) persists.
      - name: Push state DB
        if: always()
        run: bash scripts/youtube-state-db.sh push

      # Surface failures as a GitHub Issue (precedent: turso-backup.yml).
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `YouTube upload failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `Cron B (YouTube upload) failed.`,
              ``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              ``,
              `Investigate: check the run logs, confirm the \`YOUTUBE_OAUTH_*\` / \`YT_REFRESH_TOKEN\` secrets are valid (rotate quarterly — see scripts/youtube/README.md), and that the \`R2_*\`/\`AWS_*\` secrets are set. A 403 quotaExceeded is handled gracefully (exit 0) and should not reach this step.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['youtube', 'youtube-upload-failure'],
            });
