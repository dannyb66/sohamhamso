name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch / PR. Don't queue 3 runs
# on the same branch when someone is force-pushing fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimum permissions; bump only when a step needs more.
permissions:
  contents: read

env:
  # Biome baseline. Net-new errors above this threshold fail the build.
  # Re-baselined 2026-06-08 to the current tracked-tree count (the old 94 was
  # set from .gstack/qa-reports/baseline-pass2.json, which no longer exists and
  # had drifted — the gate was failing every run). This unblocks CI without
  # masking *new* regressions. FOLLOW-UP: `biome check --write` clears ~98 of
  # these mechanically (formatting + safe lint); a cleanup PR should drive this
  # back down and lower the baseline accordingly.
  BIOME_BASELINE: 238
  # Match the production CF Pages env var so SEO tools test the live config:
  # all 12 locales indexable, full hreflang clusters, no Disallow on locale paths.
  LOCALE_URLS_LIVE: "true"

jobs:
  ci:
    name: Lint + typecheck + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: SEO build
        run: bun run seo:build

      # Early warning under Cloudflare Pages' 20,000-file deploy limit.
      # Fails above 18,000 files — see plan item A6 (SSR/CI-built DB migration).
      - name: Dist file-count guard
        run: bun scripts/check-dist-filecount.ts

      - name: SEO preflight invariants
        run: bun run seo:preflight

      - name: SEO build-time noindex sweep
        run: bun run seo:noindex-sweep

      - name: SEO hreflang closure
        run: bun run seo:hreflang-closure

      - name: SEO verify phase-0
        run: bun run seo:verify-phase0

      - name: SEO validate
        run: bun run seo:validate

      - name: Unit tests
        run: bun run test

      # Pin Playwright browser cache to the resolved @playwright/test version
      # in bun.lock — re-download only when the dep bumps.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          version=$(grep -A1 '"@playwright/test"' bun.lock | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$version" ]; then
            version="unknown"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved Playwright version: $version"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: E2E tests
        run: bun e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Biome runs last: we allow the current baseline of pre-existing lints
      # (see BIOME_BASELINE above) but FAIL on any net-new error count.
      - name: Biome (baseline-gated)
        run: |
          set -o pipefail
          output=$(bun run check 2>&1 || true)
          echo "$output"
          # Extract "Found N errors." — biome emits this near the end.
          errors=$(echo "$output" | grep -oE 'Found [0-9]+ error' | grep -oE '[0-9]+' | tail -n1)
          if [ -z "$errors" ]; then
            # No "Found N errors" line → biome ran clean (or its output format changed).
            # Either way, don't fail; let the next CI maintainer notice the format drift.
            echo "Biome reported no error-count line; assuming 0 errors."
            errors=0
          fi
          echo "Biome errors: $errors (baseline: $BIOME_BASELINE)"
          if [ "$errors" -gt "$BIOME_BASELINE" ]; then
            echo "::error::Biome introduced $((errors - BIOME_BASELINE)) net-new error(s) above baseline of $BIOME_BASELINE."
            exit 1
          fi
          echo "Biome within baseline."

  # Honesty check: the committed db/sohamhamso.db must logically match a fresh
  # ingest of data/corpus/*.yaml. Catches "YAML changed but DB not re-ingested"
  # drift. Separate job so it never eats the main job's timeout budget.
  corpus-verify:
    name: Corpus DB freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-ingest corpus into temp DB
        run: |
          bun pipeline/ingest/init-db.ts --db /tmp/corpus-verify.db
          bun pipeline/ingest/ingest.ts --db /tmp/corpus-verify.db

      # Logical comparison of the four corpus tables ingest writes. Excludes
      # created_at/updated_at (timestamps differ per ingest run) and surrogate
      # ids (AUTOINCREMENT values are not stable across fresh ingests) — FK
      # references are resolved to natural keys via joins instead.
      - name: Compare against committed db/sohamhamso.db
        run: |
          cat > /tmp/corpus-dump.sql <<'SQL'
          .mode list
          .separator '|'
          .nullvalue '<NULL>'
          SELECT 'texts', id, slug, title_sa, title_en, title_iast, author, tradition, school, era,
                 source, source_url, source_revision, license, attribution_html, parent_text_id,
                 manuscript_url, description
          FROM texts ORDER BY id;
          SELECT 'verses', text_id, book, chapter, verse_num, devanagari, slp1, iast, meter, manuscript_folio_ref
          FROM verses ORDER BY text_id, chapter, verse_num;
          SELECT 'word_glosses', v.text_id, v.chapter, v.verse_num, g.word_idx, g.word_sa, g.lemma_sa,
                 g.lemma_iast, g.gloss_lang, g.gloss_text, g.morph
          FROM word_glosses g JOIN verses v ON v.id = g.verse_id
          ORDER BY v.text_id, v.chapter, v.verse_num, g.word_idx, g.gloss_lang;
          SELECT 'translations', v.text_id, v.chapter, v.verse_num, t.lang, t.translator, t.translation_text,
                 t.source, t.license, t.status, t.ai_assisted, t.model, t.model_version, t.prompt_version,
                 t.judge_score, t.reviewer, t.reviewed_at
          FROM translations t JOIN verses v ON v.id = t.verse_id
          ORDER BY v.text_id, v.chapter, v.verse_num, t.lang, t.translator;
          SQL
          sqlite3 db/sohamhamso.db < /tmp/corpus-dump.sql > /tmp/dump-committed.txt
          sqlite3 /tmp/corpus-verify.db < /tmp/corpus-dump.sql > /tmp/dump-fresh.txt
          if ! diff -u /tmp/dump-committed.txt /tmp/dump-fresh.txt > /tmp/dump-diff.txt; then
            echo "::error::Corpus YAML changed but db/sohamhamso.db not re-ingested. Run \`bun run ingest\` and commit the DB."
            echo "First 100 lines of logical diff (committed vs fresh ingest):"
            head -n 100 /tmp/dump-diff.txt
            exit 1
          fi
          echo "db/sohamhamso.db logically matches a fresh ingest ($(wc -l < /tmp/dump-fresh.txt | tr -d ' ') rows compared)."

  youtube-rigor:
    name: YouTube pipeline rigor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect YouTube-pipeline changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            yt:
              - 'pipeline/youtube/**'
              - 'youtube/**'
              - 'scripts/youtube-*.ts'
              - 'data/youtube-config.yaml'
              - 'tests/unit/youtube/**'
              - 'tests/integration/youtube/**'
              - 'db/schema.sql'
              - '.github/workflows/ci.yml'

      - name: Setup Bun
        if: steps.filter.outputs.yt == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        if: steps.filter.outputs.yt == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.filter.outputs.yt == 'true'
        run: bun install --frozen-lockfile

      - name: Validate youtube config
        if: steps.filter.outputs.yt == 'true'
        env:
          MOCK_ALL: "true"
        run: MOCK_ALL=true bun run youtube:validate-config

      - name: Youtube unit tests
        if: steps.filter.outputs.yt == 'true'
        env:
          MOCK_ALL: "true"
        run: MOCK_ALL=true bun run youtube:test

      - name: Youtube integration (mocked e2e)
        if: steps.filter.outputs.yt == 'true'
        env:
          MOCK_ALL: "true"
        run: MOCK_ALL=true bun run youtube:integration
