# ──────────────────────────────────────────────────────────────────────────────
# Lease sweep (E4) — hourly crash recovery for stuck rows.
#
# Every hour: `scripts/youtube-lease-sweep.ts` flips rows whose
# `rendering_lease_at` / `uploading_lease_at` is older than 1h back to `failed`
# (retryable), so a crashed Cron A/B run never strands a video in `rendering`
# or `uploading` forever. SQL-only, no external secrets.
#
# Required GitHub secrets: none (operates on the repo DB).
#
# Manual trigger: Actions tab → "YouTube lease sweep" → Run workflow.
# ──────────────────────────────────────────────────────────────────────────────
name: YouTube lease sweep

on:
  schedule:
    # Hourly — leases expire at 1h, so an hourly sweep bounds recovery latency.
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # used by the failure-notification step

# Serialize all YouTube pipeline crons: the single R2 state DB must never be
# written by two runs at once. cancel-in-progress: false lets in-flight runs
# finish so partial progress is pushed back rather than discarded.
concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  lease-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ── R2 / S3-compatible storage for the synced state DB. ──────────
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      # ── R2-synced state DB (pulled before / pushed after the run). ────
      YOUTUBE_DB_PATH: db/youtube-state.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pull the state DB from R2 so the sweep reads/writes shared state
      # (ephemeral runners start with no DB).
      - name: Pull state DB
        run: bash scripts/youtube-state-db.sh pull

      - name: Sweep stale leases
        run: bun scripts/youtube-lease-sweep.ts

      # Push the mutated state DB back to R2 even on failure so partial
      # progress (rows flipped back to failed) persists.
      - name: Push state DB
        if: always()
        run: bash scripts/youtube-state-db.sh push

      # Surface failures as a GitHub Issue (precedent: turso-backup.yml).
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `YouTube lease sweep failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `Hourly lease sweep (E4) failed.`,
              ``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              ``,
              `Investigate: check the run logs. While this is down, rows can remain stuck in \`rendering\`/\`uploading\` past their 1h lease.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['youtube', 'youtube-lease-sweep-failure'],
            });
