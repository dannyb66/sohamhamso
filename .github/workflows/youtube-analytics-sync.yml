# ──────────────────────────────────────────────────────────────────────────────
# Cron E — daily YouTube analytics sync.
#
# Daily at 05:00 UTC (well clear of the upload cadence): pulls per-video
# metrics from the YouTube Analytics API v2 via `scripts/youtube-analytics-sync.ts`
# (views, averageViewDuration, averageViewPercentage, subscribersGained over a
# trailing 30-day window) and upserts the `video_analytics` table in the
# R2-synced state DB (db/youtube-state.db). Analytics uses a separate quota
# bucket from uploads, so this never competes with Cron B.
#
# METRIC HONESTY: CTR and 3s-retention are YouTube-Studio-only, and UTM link
# clicks are a site-side metric — those columns stay NULL. The script logs the
# honesty contract every run so the kill-switch readout is never misled.
#
# Requires the `yt-analytics.readonly` OAuth scope on YT_REFRESH_TOKEN. A token
# minted before the scope union fails 403 with a named fix (re-run
# `bun scripts/youtube-oauth-setup.ts`, update the YT_REFRESH_TOKEN secret).
#
# Required GitHub secrets:
#   YOUTUBE_OAUTH_CLIENT_ID, YOUTUBE_OAUTH_CLIENT_SECRET, YT_REFRESH_TOKEN
#                              — OAuth for the @sohamhamso channel
#   R2_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL
#                              — S3-compatible R2 access (state-DB pull/push)
#
# Manual trigger: Actions tab → "YouTube analytics sync (Cron E)" → Run workflow.
# ──────────────────────────────────────────────────────────────────────────────
name: YouTube analytics sync (Cron E)

on:
  schedule:
    # Daily at 05:00 UTC — well clear of the upload cadence.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Trailing metrics window in days'
        required: false
        default: '30'
      dry_run:
        description: 'Plan only — no API call, no DB writes'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # used by the failure-notification step

# Serialize all YouTube pipeline crons: the single R2 state DB must never be
# written by two runs at once. cancel-in-progress: false lets in-flight runs
# finish so partial progress is pushed back rather than discarded.
concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  analytics-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ── YouTube OAuth (single chokepoint reads these). ───────────────
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # ── R2 / S3-compatible storage for the state DB. ─────────────────
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      # ── R2-synced state DB (pulled before / pushed after the run). ────
      YOUTUBE_DB_PATH: db/youtube-state.db
      # ── Dispatch inputs surfaced as env for the syncer. ──────────────
      YT_DAYS: ${{ github.event.inputs.days }}
      YT_DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pull the state DB from R2 so the syncer reads/writes shared state
      # (ephemeral runners start with no DB).
      - name: Pull state DB
        run: bash scripts/youtube-state-db.sh pull

      - name: Analytics sync
        run: |
          flags=""
          if [[ -n "${YT_DAYS:-}" ]]; then flags="$flags --days=${YT_DAYS}"; fi
          if [[ "${YT_DRY_RUN:-}" == "true" ]]; then flags="$flags --dry-run"; fi
          echo "youtube-analytics-sync.ts $flags"
          bun scripts/youtube-analytics-sync.ts $flags

      # Push the mutated state DB back to R2 even on failure so partial
      # progress (rows already upserted) persists.
      - name: Push state DB
        if: always()
        run: bash scripts/youtube-state-db.sh push

      # Surface failures as a GitHub Issue (precedent: turso-backup.yml).
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `YouTube analytics sync failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `Cron E (YouTube analytics sync) failed.`,
              ``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              ``,
              `Investigate: check the run logs. If the log shows the 403 insufficient-scope message, the \`YT_REFRESH_TOKEN\` lacks \`yt-analytics.readonly\` — re-run \`bun scripts/youtube-oauth-setup.ts\` (scope union) and update the secret. Otherwise confirm the \`YOUTUBE_OAUTH_*\` / \`YT_REFRESH_TOKEN\` and \`R2_*\`/\`AWS_*\` secrets are valid. Analytics uses a separate quota bucket from uploads, so a failure here never blocks Cron B.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['youtube', 'youtube-analytics-failure'],
            });
