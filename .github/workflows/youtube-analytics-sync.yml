# ──────────────────────────────────────────────────────────────────────────────
# Cron E — daily YouTube analytics sync.  *** SCHEDULE INTENTIONALLY DISABLED ***
#
# This is a TODO placeholder. The real syncer (`scripts/youtube-analytics-sync.ts`)
# does not exist yet, and the YouTube Analytics API needs the
# `yt-analytics.readonly` OAuth scope, which we have not re-authed for. The
# placeholder runs `youtube-status.ts`, which reads the committed
# `db/sohamhamso.db` — that DB no longer has the youtube tables (they live only in
# the R2-synced `db/youtube-state.db`), so the placeholder errors with
# "no such table: videos" and fails daily, opening a noisy failure issue.
#
# The `schedule:` trigger below is therefore commented out so this dormant
# placeholder stops firing+failing every day. `workflow_dispatch:` is kept so it
# can still be run manually. Re-enable the schedule once BOTH the real analytics
# syncer and the `yt-analytics.readonly` re-auth are implemented. Until then, the
# daily digest cron already reports YouTube status.
#
# Daily at 05:00 UTC (WHEN ENABLED): pulls per-video view/retention/CTR metrics
# from the YouTube Analytics API and writes the `video_analytics` table. This
# feeds the Phase-2 kill-switch thresholds (CTR-to-canonical, 3s retention,
# completion, UTM link-clicks). Analytics queries use a separate quota bucket
# from uploads, so this never competes with Cron B.
#
# Required GitHub secrets:
#   YOUTUBE_OAUTH_CLIENT_ID, YOUTUBE_OAUTH_CLIENT_SECRET, YT_REFRESH_TOKEN
#                              — OAuth for the @sohamhamso channel
#
# Manual trigger: Actions tab → "YouTube analytics sync (Cron E)" → Run workflow.
# ──────────────────────────────────────────────────────────────────────────────
name: YouTube analytics sync (Cron E)

on:
  # SCHEDULE DISABLED — see top-of-file note. Re-enable once the real analytics
  # syncer + `yt-analytics.readonly` re-auth land. Manual runs still work below.
  # schedule:
  #   # Daily at 05:00 UTC — well clear of the upload cadence.
  #   - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # used by the failure-notification step

jobs:
  analytics-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ── YouTube OAuth (single chokepoint reads these). ───────────────
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TODO: replace the placeholder command below with the dedicated analytics
      # syncer (e.g. `bun scripts/youtube-analytics-sync.ts`) once that script
      # exists — it should call the YouTube Analytics API and write the
      # `video_analytics` table. youtube-status.ts --json is a no-op stand-in
      # that keeps the workflow green until then.
      - name: analytics sync
        run: bun scripts/youtube-status.ts --json

      # Surface failures as a GitHub Issue (precedent: turso-backup.yml).
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `YouTube analytics sync failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `Cron E (YouTube analytics sync) failed.`,
              ``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              ``,
              `Investigate: check the run logs and confirm the \`YOUTUBE_OAUTH_*\` / \`YT_REFRESH_TOKEN\` secrets are valid. Analytics uses a separate quota bucket from uploads, so a failure here does not block Cron B.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['youtube', 'youtube-analytics-failure'],
            });
