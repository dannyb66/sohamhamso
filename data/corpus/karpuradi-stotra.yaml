      text: ಪ್ರೇಮದಿಂದ ತಲ್ಲಣಿಸುತ್ತಾ ಕುರಂಗಾಕ್ಷಿಯರ ಸಮೂಹವು ಅವನನ್ನು ಹಿಂಬಾಲಿಸುತ್ತದೆ; ಭೂಮಿಯ ಅರಸನು ಅವನ ವಶನಾಗುತ್ತಾನೆ, ಅವನು ಕುಬೇರನ ಪ್ರತಿನಿಧಿಯಾಗುತ್ತಾನೆ; ಶತ್ರು ಮತ್ತು ಸೆರೆಮನೆಯನ್ನು ಆಟದ ಕಲೆಯಂತೆ ಎಣಿಸುತ್ತಾನೆ — ಆ ಭಕ್ತನು ಚಿರಕಾಲ ಜೀವನ್ಮುಕ್ತನಾಗಿ ಜನ್ಮಜನ್ಮಾಂತರಗಳಲ್ಲಿ ಮೆರೆಯುತ್ತಾನೆ.
