    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "If a devotee at night, naked, with loosened hair, meditating on Thee, recites Thy mantra — even amid the embraces of full-breasted, broad-hipped, youthful women — all the hosts of perfections become his servants, and he lives long on the earth as a poet."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: যদি ভক্তই ৰাতি, নগ্ন হৈ, কেশ মুকলি কৰি, তোমাক ধ্যান কৰি, পূৰ্ণ-স্তনা আৰু পৃথুল-জঘনা যুৱতীসকলৰ আলিঙ্গনত আসক্ত হৈও তোমাৰ মন্ত্ৰ জপ কৰে — তেন্তে সকলো সিদ্ধি তেওঁৰ বশীভূত হয়, আৰু তেওঁ পৃথিৱীত দীৰ্ঘকাল কবি হৈ জীয়াই থাকে।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: যদি ভক্ত রাত্রে — পীনস্তনা ও বিস্তীর্ণজঘনা যৌবনবতীগণের রতিতে আসক্ত হইয়াও — বিবস্ত্র, বিগলিতকেশে, তোমাকে ধ্যান করিয়া তোমার মন্ত্র জপ করেন, তাঁহার বশগামী হয় সমস্ত সিদ্ধি-সমূহ, এবং তিনি কবি হইয়া ভূমিতে চিরকাল জীবিত থাকেন।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: જો રાત્રે, વસ્ત્રરહિત, વિખરાયેલા કેશે, ચારે બાજુથી ભરપૂર સ્તન અને જઘનવાળી યુવતીઓ સાથે રત રહીને પણ, તારું ધ્યાન કરતો ભક્ત તારો મંત્ર જપે — તો સમસ્ત સિદ્ધિ-સમૂહ તેને વશ થાય છે, અને તે પૃથ્વી પર ચિરકાળ સુધી કવિ રૂપે જીવે છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: यदि कोई भक्त रात्रि में, वस्त्रहीन और बिखरे केशों के साथ, पीन-स्तनी और पुष्ट जघन वाली युवती के साथ रति में आसक्त होकर भी तेरा ध्यान करते हुए तेरा मन्त्र जपे, तो समस्त सिद्धि-समूह उसके वशवर्ती हो जाते हैं और वह कवि बनकर पृथ्वी पर बहुत लम्बे समय तक जीवित रहता है।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ಸುತ್ತಲೂ ಪೀನಸ್ತನ-ಜಘನವುಳ್ಳ ಯೌವನವತಿಯರ ರತಿಯಲ್ಲಿ ಆಸಕ್ತನಾದ ಭಕ್ತನು ರಾತ್ರಿಯಲ್ಲಿ ನಗ್ನನಾಗಿ, ಮುಕ್ತಕೇಶನಾಗಿ, ನಿನ್ನನ್ನು ಧ್ಯಾನಿಸುತ್ತಾ ನಿನ್ನ ಮಂತ್ರವನ್ನು ಜಪಿಸಿದರೆ, ಸಕಲ ಸಿದ್ಧಿಗಳ ಸಮೂಹಗಳು ಅವನ ವಶವಾಗುತ್ತವೆ, ಮತ್ತು ಅವನು ಕವಿಯಾಗಿ ಭೂಮಿಯ ಮೇಲೆ ಚಿರಕಾಲ ಬದುಕುತ್ತಾನೆ.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: പൂർണസ്തനങ്ങളും ഭാരമേറിയ ജഘനങ്ങളുമുള്ള യൗവനവതികളുമായി രതാസക്തനായിരുന്നുകൊണ്ടുപോലും — രാത്രിയിൽ നഗ്നനായി, അഴിച്ചിട്ട തലമുടിയോടെ, അവിടത്തെ ധ്യാനിച്ച് അവിടത്തെ മന്ത്രം ജപിക്കുന്ന ഭക്തന് സകല സിദ്ധിസമൂഹങ്ങളും വശംവദമാകുന്നു; അവൻ ഭൂമിയിൽ കവിയായി ദീർഘകാലം ജീവിക്കുന്നു.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: जर भक्त रात्री, नग्न, मुक्तकेश होऊन, तुझ्या मंत्राचा जप करतो — पीनस्तन व विशाल जघन असलेल्या तरुण स्त्रियांच्या रतिक्रीडेत आसक्त असतानाही तुझे ध्यान करत — तर सर्व सिद्धिसमूह त्याच्या वशीभूत होतात आणि तो पृथ्वीवर चिरकाल कवी म्हणून जगतो.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: or
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ହେ ମାତା — ଯଦି ଭକ୍ତ ରାତ୍ରିରେ, ନଗ୍ନ, ବିଗଳିତ-କେଶ ହୋଇ, ତୁମ୍ଭର ଧ୍ୟାନ କରୁ କରୁ, ଚାରିଆଡ଼େ ପୀନ-ସ୍ତନା ଓ ବିଶାଳ-ଜଘନା ଯୁବତୀମାନଙ୍କ ସୁରତରେ ଆସକ୍ତ ହୋଇ ତୁମ୍ଭର ମନ୍ତ୍ର ଜପ କରେ — ସମସ୍ତ ସିଦ୍ଧି-ସମୂହ ତାଙ୍କର ବଶବର୍ତ୍ତୀ ହୁଅନ୍ତି, ଏବଂ ସେ କବି ହୋଇ ପୃଥିବୀରେ ଚିରକାଳ ଜୀବନ ଯାପନ କରେ ।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: pa
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ਜੇ ਤੇਰਾ ਭਗਤ ਰਾਤ ਨੂੰ, ਨੰਗਾ, ਖੁੱਲ੍ਹੇ ਕੇਸਾਂ ਨਾਲ, ਤੇਰਾ ਧਿਆਨ ਕਰਦਾ ਹੋਇਆ, ਚੋਹੀਂ ਪਾਸੀਂ ਪੁਸ਼ਟ-ਸਤਨੀ ਅਤੇ ਪੁਸ਼ਟ-ਜਘਨ ਵਾਲੀਆਂ ਯੁਵਤੀਆਂ ਨਾਲ ਰਤੀ-ਆਸਕਤ ਹੋ ਕੇ ਤੇਰਾ ਮੰਤ੍ਰ ਜਪਦਾ ਹੈ — ਤਾਂ ਸਾਰੇ ਸਿੱਧੀਆਂ ਦੇ ਸਮੂਹ ਉਸਦੇ ਵੱਸ ਵਿੱਚ ਹੋ ਜਾਂਦੇ ਹਨ, ਅਤੇ ਉਹ ਕਵੀ ਬਣ ਕੇ ਚਿਰਕਾਲ ਤੱਕ ਧਰਤੀ ਉੱਤੇ ਜੀਉਂਦਾ ਹੈ।
