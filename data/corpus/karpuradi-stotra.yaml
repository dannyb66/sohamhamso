    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "Those who, dwelling in the world, offer Thee in worship — freely and along with hair and bone — meat of any kind: cat, camel, sheep, man, buffalo, or even goat — O Dark One, to such good men every perfection arises, unprecedented, at every step."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: 'হে অসিতে (কৃষ্ণবৰ্ণা)! যিসকল মৰ্ত্যবাসীয়ে তোমাৰ পূজাত মুক্তভাৱে — লোম আৰু হাড়ৰ সৈতে — মাংস অৰ্পণ কৰে: বিৰাল, উট, ভেড়া, মানুহ, মহিষ, বা ছাগৰো — সেই সজ্জনসকলৰ প্ৰতি পদে অপূৰ্ব সকলো সিদ্ধি উদ্ভৱ হয়।'
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে অসিতে (কৃষ্ণা)! মর্ত্যবাসী যাহারা তোমার পূজায় — স্বচ্ছন্দে, লোম ও অস্থি সহিত — মার্জার, উষ্ট্র, মেষ, নর, মহিষ অথবা ছাগের মাংস বলি অর্পণ করেন, সেই সৎ-জনের প্রতি পদে অপূর্ব সর্ব-সিদ্ধি প্রকাশিত হয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે અસિતે (કાળી)! જે મર્ત્યલોકવાસી સત્પુરુષો તારી પૂજામાં સ્વેચ્છાથી રોમ અને અસ્થિ સહિત માંસ — બિલાડી, ઊંટ, મેષ, મનુષ્ય, મહિષ કે બકરા — ગમે તેનો બલિ અર્પણ કરે છે, તેમને દરેક ડગલે અપૂર્વ સર્વ સિદ્ધિઓ પ્રાપ્ત થાય છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे असिते (श्याम वर्ण वाली)! जो लोग संसार में रहते हुए तेरी पूजा में बिल्ली, ऊँट, भेड़, मनुष्य, भैंस, अथवा बकरे का — रोम और हड्डियों सहित मांस — स्वच्छन्द रूप से बलि के रूप में अर्पित करते हैं, उन सत्पुरुषों को प्रत्येक पद पर अपूर्व सिद्धियाँ प्राप्त होती हैं।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ಓ ಅಸಿತೇ (ಕೃಷ್ಣವರ್ಣೆಯೇ) — ಲೋಮ-ಅಸ್ಥಿಗಳ ಸಹಿತ ಸ್ವೈರವಾಗಿ ಮಾಂಸವನ್ನು — ಬೆಕ್ಕು, ಒಂಟೆ, ಕುರಿ, ಮನುಷ್ಯ, ಕೋಣ, ಅಥವಾ ಆಡು — ಯಾವುದನ್ನಾದರೂ ನಿನ್ನ ಪೂಜೆಯಲ್ಲಿ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸುವ ಮರ್ತ್ಯವಾಸಿ ಸತ್ಪುರುಷರಿಗೆ ಅಪೂರ್ವವಾದ ಸರ್ವಸಿದ್ಧಿಯು ಪ್ರತಿ ಹೆಜ್ಜೆಯಲ್ಲೂ ಒದಗುತ್ತದೆ.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ഹേ അസിതേ — രോമവും അസ്ഥിയും സഹിതം, പൂച്ച, ഒട്ടകം, ആട്, മനുഷ്യൻ, പോത്ത്, അല്ലെങ്കിൽ കോലാട് — ഏതു മാംസവും അവിടത്തെ പൂജയിൽ ബലിയായി സ്വച്ഛന്ദമായി അർപ്പിക്കുന്ന, ഭൂമിയിൽ വസിക്കുന്ന സജ്ജനങ്ങൾക്ക് ഓരോ പടിയിലും അപൂർവമായ സർവസിദ്ധികളും ഉദിച്ചുവരുന്നു.
      ai_assisted: true
      status: draft
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे असिते (कृष्णवर्णिनी)! जे मर्त्यलोकात राहून तुझ्या पूजेत — केस व हाडांसह, स्वच्छंदपणे — मांजर, उंट, मेंढा, मनुष्य, महिष किंवा बकरा यांचेही मांस बली म्हणून अर्पण करतात, त्या सत्पुरुषांना पावलोपावली अपूर्व अशी सर्व सिद्धी प्राप्त होते.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: or
      translator: sohamhamso (claude-opus-4-7)
