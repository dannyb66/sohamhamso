      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: അഴിച്ചിട്ട തലമുടിയുള്ള കാളികേ, വായുടെ രണ്ടു മൂലകളിൽനിന്നും ഇരുധാരകളായി രക്തം ഒഴുകുന്ന മുഖമുള്ള ദക്ഷിണാകാളീ — അഗ്നിസ്ഥനായ ഈശന്റെ [ര-കാരം] കൂടെ ചന്ദ്രബിന്ദുവും ശോഭിക്കുന്ന ഇടത്തേക്കണ്ണും ചേർന്നുണ്ടാകുന്ന അവിടത്തെ മറ്റേ ദ്വന്ദ്വ-ബീജം ജപിക്കുന്നവർ ശത്രുക്കളെ ഹനിക്കുകയും മൂന്നുലോകത്തെയും വശത്താക്കുകയും ചെയ്യുന്നു — ഇപ്രകാരം അവിടത്തെ ത്ര്യക്ഷര-മന്ത്രം.
