    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "Earth, water, fire, wind, ether — Thou alone, O auspicious Kālī, beloved of the Mountain-Lord, art the whole. Be Thou gracious to me, and may I have no further birth in this world."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: পৃথিৱী, জল, অগ্নি, বায়ু, আকাশ — হে কালি, হে গিৰিশৰমণী (শিৱৰ প্ৰিয়া), তুমিয়েই একমাত্ৰ কল্যাণী, তুমিয়েই সকলো। তুমি মোৰ প্ৰতি প্ৰসন্না হোৱা, আৰু এই সংসাৰৰ পাছত মোৰ আৰু জন্ম নহওক।
      ai_assisted: true
      status: draft
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: পৃথিবী, জল, অগ্নি, বায়ু, আকাশ — হে কালী, হে গিরিশ-রমণী (শিবপ্রিয়া), তুমি একাই কল্যাণী এবং তুমিই সকল। তুমি প্রসন্না হও — আমার যেন আর সংসারে জন্ম না হয়।
      ai_assisted: true
      status: draft
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: પૃથ્વી, જળ, અગ્નિ, વાયુ, આકાશ — હે કલ્યાણી, હે ગિરિશ (શિવ)ની રમણી, હે કાલિ! તું એક જ સકલરૂપ છે. તું મારા પર પ્રસન્ન થા, અને આ સંસારમાં મારો ફરી જન્મ ન થાય.
      ai_assisted: true
      status: draft
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: पृथ्वी, जल, अग्नि, वायु, आकाश — हे काली, हे गिरीश-प्रिये, हे कल्याणी! तू ही अकेली यह सब कुछ है। तू मुझ पर प्रसन्न हो, और अब इस संसार में मेरा पुनर्जन्म न हो।
      ai_assisted: true
      status: draft
      model: claude-opus-4-7
