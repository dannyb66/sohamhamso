      text: হে মহেশী! হে অর্ধচন্দ্রচূড়ে, হে মহাঘোর বালক-কপালভূষিতে! তোমার অপর বীজ (ঈশান অর্থাৎ ‘হ’ — অর্ধচন্দ্র ও বামকর্ণ-যুক্ত, অর্থাৎ ‘হূং’) — এই যুগ্ম বীজ যদি মন্দবুদ্ধি মানুষও কদাচিৎ একবার জপ করে, সে বাচস্পতিকে জয় করে, দীর্ঘকাল ধন লাভ করে এবং পদ্মাক্ষী রমণীগণকে মোহিত করে।
