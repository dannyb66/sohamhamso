    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Mother with smiling face, Consort of Him who slew the god of love — they who, joining together the syllables in the prescribed order and meditating on Thy true form, recite Thy mantra, become themselves able to take any form at will, with eyes like the play of Lakṣmī upon lotus-petals."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে মাতৃ, হে স্মৰাৰিৰ পত্নী, হে স্মিতমুখী! বৰ্গৰ আদ্য বৰ্ণ অগ্নিত স্থিত, অতি ললিত চন্দ্ৰৰে যুক্ত — এনে তিনিটা, দুটা কূৰ্চ, দুটা লজ্জা-বীজ, আৰু তাৰ পাছত তলত দুটা — এনেদৰে যোজনা কৰি, তোমাৰ স্বৰূপ ধ্যান কৰি যিসকলে জপ কৰে, তেওঁলোকৰ চকু লক্ষ্মীৰ লীলাৰ পদ্মপাপৰিৰ দৰে হয়, আৰু তেওঁলোকে ইচ্ছামতে ৰূপ ধাৰণ কৰিব পৰা কামৰূপী হয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে মাতা, হে স্মিতমুখী, হে স্মরহর-মহিলা (শিবের সহধর্মিণী)! বর্গাদ্য (ক) বহ্নিসংস্থ, অতি ললিত বিধু (ঈ-সহিত), এই তিন বীজ-ত্রয়, কূর্চ-যুগ্ম (হূং-হূং), লজ্জা-দ্বন্দ্ব (হ্রীং-হ্রীং), অতঃপর তদধঃ-স্থ যুগল — এইসব যোজন করিয়া তোমার স্বরূপ ভাবনা করিয়া যাহারা জপ করেন, হে মাতা, তাঁহারা লক্ষ্মীর লীলা-কমলদলের ন্যায় চক্ষুবিশিষ্ট হইয়া কামরূপ (যথেচ্ছারূপধারী) হন।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે માતા, હે સ્મિતમુખી, હે સ્મરહર (કામદેવને ભસ્મ કરનાર શિવ)ની વધૂ! વર્ગાદ્ય (પ-વર્ગનું પ્રથમ — ‘ક’), વહ્નિસંસ્થ (‘ર’) અને અતિ-લલિત વિધુ (ચંદ્રબિંદુ) — એ ત્રણને, બે કૂર્ચ-બીજ (‘હૂં હૂં’), બે લજ્જા-બીજ (‘હ્રીં હ્રીં’) અને એમની નીચે બે અન્ય બીજો — એ બધાને ક્રમ પ્રમાણે જોડીને જે જે જન તારા સ્વરૂપનું ધ્યાન કરી જપ કરે છે, તેઓ લક્ષ્મીની લાસ્ય-લીલા સમાન કમલપત્ર-દૃષ્ટિવાળા થઈ કામરૂપ (ઇચ્છિત રૂપ ધારણ કરનારા) બને છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे माता, हे मन्द-स्मित मुख वाली, हे कामारि शिव की प्रिये! जो साधक तेरे मन्त्र के अक्षरों को विधिपूर्वक जोड़कर और तेरे स्वरूप का ध्यान करते हुए जप करते हैं, वे कमल-दलों पर लक्ष्मी की लीला-समान नेत्रों वाले और इच्छानुसार कोई भी रूप धारण करने में समर्थ (कामरूप) हो जाते हैं।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
