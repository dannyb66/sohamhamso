      text: மஹேஸியே, பிறைச்சந்திரத்தைச் சூடியவளே, மஹாகோரமான குழந்தைகளின் (மண்டையோடுகளை) ஆபரணமாய்த் தரித்தவளே! பிறைச்சந்திரத்துடனும் இடதுகாதோடும் கூடிய ஈஸானன் (என்னும் எழுத்து) எனும் உனது மற்றொரு பீஜத்தை — அதன் இரண்டடுக்கு வடிவத்தை — மந்தபுத்தியுள்ள மனிதன்கூட எப்போதாவது ஒருமுறை ஜபித்தாலும், அவன் வாக்கின் தலைவனை (ப்ருஹஸ்பதியை) வென்று, செல்வத்தையும் பெற்று, தாமரைக்கண் கொண்ட பெண்களின் கூட்டத்தை நெடுங்காலம் மயக்கி ஆட்கொள்கிறான்.
