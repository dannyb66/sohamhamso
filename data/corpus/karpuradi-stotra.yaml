    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Mother, O Kālikā, O Remover of the sins of the three worlds, O Dakṣiṇā with teeth bared — bearing in Thy upper left palm a sword and below it a severed head, and in Thy right hands the gestures of fearlessness and of granting boons — those who, having recited this Thy name, meditate on the majesty of Thy mantra, the eight perfections of the Three-Eyed One rest in their hands."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে মাতৃ, হে কালিকে, হে ত্ৰিজগতৰ পাপহাৰিণী, হে দন্তবিকশিতা দক্ষিণা! তোমাৰ ওপৰৰ বাঁও হাতত খড়্গ আৰু তলৰ বাঁও হাতত ছিন্নমুণ্ড, আৰু সোঁ হাত-যুগ্মত অভয় আৰু বৰ মুদ্ৰা — যিসকলে এই তোমাৰ নাম জপ কৰি তোমাৰ মন্ত্ৰৰ মহিমা ধ্যান কৰে, ত্ৰ্যম্বকৰ (শিৱৰ) আঠোটা সিদ্ধি তেওঁলোকৰ হাতত অৱস্থিত হয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে অম্বা, হে কালিকে, হে ত্রিজগতের পাপহারিণী, হে প্রকটিত-দন্তা দক্ষিণে! যাঁহার ঊর্ধ্ব বাম করকমলে কৃপাণ এবং নিম্নে ছিন্নমুণ্ড, এবং দক্ষিণ হস্তে অভয় ও বরমুদ্রা — যাহারা তোমার এই নাম জপ করিয়া তোমার মন্ত্রের মহিমা ধ্যান করেন, ত্র্যম্বকের (শিবের) অষ্ট সিদ্ধি তাঁহাদের করতলস্থ হয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે અંબા, હે કાલિકા, હે ત્રિજગતનાં પાપ હરનારી, હે દક્ષિણા — દાંત ઉઘાડેલા ધારણ કરનારી! ઊર્ધ્વ-વામ કરકમલમાં તું કૃપાણ ધારે છે અને નીચે છિન્ન-મુંડ; દક્ષિણ હાથોમાં અભય તથા વર-મુદ્રા ધારે છે. જે આ તારું નામ જપીને તારા મંત્રના વૈભવનું ધ્યાન કરે છે, તેમના હાથમાં ત્ર્યંબક શિવની આઠ સિદ્ધિઓ રહે છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे माँ कालिके, हे तीनों लोकों के पापों को हरने वाली, हे दाँत खोलकर दिखाने वाली दक्षिणा! तेरे ऊपरी बायें कर-कमल में कृपाण और नीचे वाले में कटा हुआ मुण्ड है, तथा दायीं ओर अभय और वर मुद्राएँ हैं। जो साधक तेरा यह नाम जपकर तेरे मन्त्र के माहात्म्य का ध्यान करते हैं, उनके हाथों में त्र्यम्बक शिव की अष्टसिद्धियाँ निवास करती हैं।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ಓ ತಾಯಿ, ಓ ಕಾಳಿಕೇ, ಓ ತ್ರಿಜಗದಘಹರೇ, ಹಲ್ಲುಗಳನ್ನು ತೋರಿಸುತ್ತಿರುವ ಓ ದಕ್ಷಿಣೇ — ಮೇಲಿನ ಎಡ ಕರಕಮಲದಲ್ಲಿ ಖಡ್ಗವನ್ನೂ, ಅದರ ಕೆಳಗೆ ಛಿನ್ನಮುಂಡವನ್ನೂ, ಬಲಗೈಗಳಲ್ಲಿ ಅಭಯ ಮತ್ತು ವರ ಮುದ್ರೆಗಳನ್ನೂ ಧರಿಸಿರುವವಳೇ — ಈ ನಿನ್ನ ನಾಮವನ್ನು ಜಪಿಸಿ, ನಿನ್ನ ಮಂತ್ರದ ವೈಭವವನ್ನು ಭಾವಿಸುವವರ ಕೈಗಳಲ್ಲಿ ತ್ರ್ಯಂಬಕನ ಎಂಟು ಸಿದ್ಧಿಗಳು ನೆಲೆಗೊಳ್ಳುತ್ತವೆ.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: അമ്മേ, കാളികേ, ത്രിലോകത്തിന്റെ പാപങ്ങൾ ഹരിക്കുന്നവളേ, ദന്തങ്ങൾ പ്രകടമാക്കിയ ദക്ഷിണാദേവീ — മേലത്തെ ഇടത്തേ കരകമലത്തിൽ വാളും അതിന്റെ താഴെ ഛിന്നശിരസ്സും, വലത്തേ കൈകളിൽ അഭയ-വരമുദ്രകളും ധരിച്ചവളേ — അവിടത്തെ ഈ നാമം ജപിച്ച് മന്ത്രമഹിമയെ ധ്യാനിക്കുന്നവരുടെ കൈകളിൽ ത്ര്യംബകന്റെ [ശിവന്റെ] അഷ്ടസിദ്ധികൾ വന്നുചേരുന്നു.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे माते, हे कालिके, हे त्रिभुवनातील पापांचे हरण करणाऱ्या, हे दात उघडे दाखवणाऱ्या दक्षिणे! वरील डाव्या करकमलात तलवार व खाली छिन्न मस्तक, उजव्या हातांत अभय व वरमुद्रा धारण करणाऱ्या — हे जे तुझे नाम जपून तुझ्या मंत्राच्या वैभवाचे ध्यान करतात, त्यांच्या हातांत त्र्यंबकाच्या (शिवाच्या) आठ सिद्धी विराजमान होतात.
      ai_assisted: true
