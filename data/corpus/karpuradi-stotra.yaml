    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "Throngs of doe-eyed women follow him, trembling with love; the king of the land is in his power, a very Kubera of wealth; his enemy he counts as if a prison were only sport — and long, liberated-while-living, that devotee prevails, birth after birth."
