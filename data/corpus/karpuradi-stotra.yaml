      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হৰিণাক্ষী ৰমণীসকলৰ সমষ্টিয়ে প্ৰেমকম্পিতা হৈ তেওঁৰ পাছে পাছে অনুসৰণ কৰে; পৃথিৱীৰ ৰজাও তেওঁৰ বশীভূত হয়, আৰু তেওঁ কুবেৰৰ প্ৰতিনিধি হৈ পৰে; শত্ৰু আৰু কাৰাগাৰক তেওঁ ক্ৰীড়াৰ এক অংশৰ দৰে গণ্য কৰে — সেই ভক্ত বহুকাল ধৰি জীৱন্মুক্ত হৈ থাকে আৰু জন্ম-জন্মান্তৰ ধৰি সিদ্ধি লাভ কৰে।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: প্রেমে তরল কুরঙ্গাক্ষী (হরিণাক্ষী) রমণীগণ তাঁহাকে অনুসরণ করেন, ক্ষোণীপতি (রাজা)ও তাঁহার বশীভূত হন, তিনি কুবেরের প্রতিনিধি (ধনে সমান) হন, শত্রু ও কারাগার তাঁহার নিকট কেবল ক্রীড়ার অংশ মাত্র — সেই ভক্ত দীর্ঘকাল জীবন্মুক্ত হইয়া জন্ম-জন্মান্তরে প্রভাবশালী হন।
