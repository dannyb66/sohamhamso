  description: |
    Karpūrādi Stotra ("Hymn beginning with the syllable Karpūra") — a
    Śākta Tantric hymn to the Goddess Dakṣiṇa-Kālī, structured around
    her twenty-two-syllable mantra. Each verse describes the esoteric
    realisation of a single syllable, encoded in a deliberately
    obscure "twilight language" (sandhyā-bhāṣā). Famously translated
    and published by John Woodroffe (Arthur Avalon) in 1922 as "Hymn
    to Kali", which serves as our reference anchor (now public domain).
    Twenty-two verses plus a closing colophon attributing the hymn to
    Mahā-Kālī herself.

chapters:
- chapter: 1
  title_sa: कर्पूरादिस्तोत्रम्
  title_iast: Karpūrādi-stotram
  title_en: Karpūrādi Stotra
  verses:
  - verse: 1
    devanagari: |
      कर्पूरं मध्यमान्त्यस्वरपरिरहितं सेन्दुवामाक्षियुक्तं
      बीजं ते मातरेतत्त्रिपुरहरवधु त्रिःकृतं ये जपन्ति ।
      तेषां गद्यानि पद्यानि च मुखकुहरादुल्लसन्त्येव वाचः
      स्वच्छन्दं ध्वान्तधाराधररुचिरुचिरे सर्वसिद्धिं गतानाम् ॥ १॥
    iast: "karpūraṃ madhyamāntyasvaraparirahitaṃ sendu-vāmākṣi-yuktaṃ / bījaṃ te mātar etat tripura-hara-vadhu triḥkṛtaṃ ye japanti / teṣāṃ gadyāni padyāni ca mukha-kuhārād ullasanty eva vācaḥ / svacchandaṃ dhvānta-dhārā-dhara-ruci-rucire sarva-siddhiṃ gatānām // 1 //"
    meter: śārdūlavikrīḍita
    word_glosses:
    - word: कर्पूरम्
      iast: karpūram
      gloss_en: camphor — i.e. the syllable Ka (first letter of the Kālī mantra)
      morph: nom. sg. n.
      gloss_as: কৰ্পূৰ — অৰ্থাৎ ‘ক’ অক্ষৰ (কালী মন্ত্ৰৰ প্ৰথম বৰ্ণ)
      gloss_bn: কর্পূর — অর্থাৎ ‘ক’ অক্ষর (কালী-মন্ত্রের প্রথম বর্ণ)
      gloss_gu: કપૂર — એટલે કે અક્ષર 'ક' (કાલી મંત્રનો પ્રથમ અક્ષર)
      gloss_hi: कर्पूर — कपूर / 'क' अक्षर (काली-मन्त्र का पहला अक्षर)
      gloss_kn: ಕರ್ಪೂರ — ಅಂದರೆ ಕ ಎಂಬ ಅಕ್ಷರ (ಕಾಲೀ ಮಂತ್ರದ ಮೊದಲ ಅಕ್ಷರ)
      gloss_ml: കർപ്പൂരം — അതായത് കാളീ-മന്ത്രത്തിലെ ആദ്യാക്ഷരം 'ക'
      gloss_mr: कापूर — म्हणजे क-अक्षर (कालीमंत्राचे पहिले अक्षर)
      gloss_or: କର୍ପୂର — ଅର୍ଥାତ୍ କାଳୀ-ମନ୍ତ୍ରର ପ୍ରଥମ ଅକ୍ଷର 'क' (Ka)
      gloss_pa: ਕਪੂਰ — ਅਰਥਾਤ ਅੱਖਰ ‘ਕ’ (ਕਾਲੀ-ਮੰਤਰ ਦਾ ਪਹਿਲਾ ਅੱਖਰ)
      gloss_ta: கர்ப்பூரம் — 'க' எழுத்து (காளீ மந்திரத்தின் முதல் எழுத்து)
      gloss_te: కర్పూరం — అనగా 'క' అక్షరం (కాళీ మంత్రం యొక్క మొదటి అక్షరం)
    - word: मध्यमान्त्यस्वर-परिरहितम्
      iast: madhyamāntya-svara-parirahitam
      gloss_en: deprived of its middle and final vowels (a, ū → none)
      morph: nom. sg. n. cpd.
      gloss_as: মধ্যম আৰু অন্তিম স্বৰ বৰ্জিত (অ, ঊ → লোপ)
      gloss_bn: যাহার মধ্যম ও অন্ত্য স্বর লুপ্ত (অ, ঊ → কিছুই নয়)
      gloss_gu: મધ્ય અને અંતિમ સ્વરો (અ, ઊ) રહિત
      gloss_hi: मध्य और अन्त्य स्वरों से रहित (अ, ऊ → लोप)
      gloss_kn: ಮಧ್ಯ ಮತ್ತು ಅಂತ್ಯ ಸ್ವರಗಳಿಂದ ರಹಿತವಾದದ್ದು (ಅ, ಊ → ಇಲ್ಲ)
      gloss_ml: മധ്യ-അന്ത്യ സ്വരങ്ങൾ (അ, ഊ) വർജ്ജിതം
      gloss_mr: मधले व अंतिम स्वर (अ, ऊ) काढून टाकलेले
      gloss_or: ଯାହାର ମଧ୍ୟ ଓ ଅନ୍ତିମ ସ୍ୱର ଲୋପ (a, ū → ଶୂନ୍ୟ)
      gloss_pa: ਆਪਣੇ ਵਿਚਕਾਰਲੇ ਤੇ ਅੰਤਲੇ ਸਵਰਾਂ ਤੋਂ ਰਹਿਤ (ਅ, ਊ → ਲੁਪਤ)
      gloss_ta: நடு மற்றும் இறுதி உயிரெழுத்துகள் (அ, ஊ) நீக்கப்பெற்றது
      gloss_te: మధ్యమ మరియు అంత్య స్వరములు తొలగించబడినది (అ, ఊ → లేదు)
    - word: स-इन्दु-वामाक्षि-युक्तम्
      iast: sendu-vāmākṣi-yuktam
      gloss_en: joined with the half-moon (anusvāra/candrabindu) and the left eye (the vowel ī) — yielding Krīṃ
      morph: nom. sg. n. cpd.
      gloss_as: অৰ্ধচন্দ্ৰ (অনুস্বাৰ/চন্দ্ৰবিন্দু) আৰু বাম চকুৰ (ঈ স্বৰ) সৈতে যুক্ত — ফলত ক্ৰীং
      gloss_bn: অর্ধচন্দ্র (অনুস্বার/চন্দ্রবিন্দু) ও বাম-নেত্র (ঈ-কার) সহিত — অর্থাৎ ‘ক্রীং’
      gloss_gu: અર્ધચંદ્ર (અનુસ્વાર/ચન્દ્રબિન્દુ) અને ડાબી આંખ (સ્વર ઈ) સાથે જોડેલું — એટલે ક્રીં
      gloss_hi: अर्धचन्द्र (अनुस्वार) और वाम-नेत्र (ई) से युक्त — अर्थात् क्रीं
      gloss_kn: ಅರ್ಧಚಂದ್ರ (ಅನುಸ್ವಾರ/ಚಂದ್ರಬಿಂದು) ಮತ್ತು ಎಡಗಣ್ಣಿನ (ಈ ಸ್ವರ) ಜೊತೆ ಕೂಡಿಸಿದ್ದು — ಕ್ರೀಂ ಆಗುತ್ತದೆ
      gloss_ml: അർദ്ധചന്ദ്രവും (അനുസ്വാരം) ഇടം കണ്ണും (ഈ-സ്വരം) ചേർന്നത് — അങ്ങനെ 'ക്രീം' രൂപപ്പെടുന്നു
      gloss_mr: अर्धचंद्र (अनुस्वार/चंद्रबिंदू) व डाव्या डोळ्याशी (ई-स्वर) युक्त — म्हणजे क्रीं
      gloss_or: ଅର୍ଦ୍ଧଚନ୍ଦ୍ର (ଅନୁସ୍ୱାର/ଚନ୍ଦ୍ରବିନ୍ଦୁ) ଓ ବାମ ଆଖି (ସ୍ୱର ī) ଯୁକ୍ତ — ଫଳରେ କ୍ରୀଂ (Krīṃ)
      gloss_pa: ਅਰਧ-ਚੰਦਰ (ਅਨੁਸ੍ਵਾਰ/ਚੰਦ੍ਰਬਿੰਦੁ) ਅਤੇ ਖੱਬੀ ਅੱਖ (ਸਵਰ ‘ਈ’) ਨਾਲ ਜੁੜਿਆ — ਜੋ ਬਣਦਾ ਹੈ ‘ਕ੍ਰੀਂ’
      gloss_ta: பிறைச்சந்திரனோடும் (அனுஸ்வாரம்/சந்திரபிந்து) இடதுகண்ணோடும் (ஈ-காரம்) கூடியது — க்ரீம்
      gloss_te: అర్ధచంద్రుడు (అనుస్వార/చంద్రబిందువు) మరియు వామనేత్రం (ఈ-కారం) తో కూడినది — 'క్రీం' గా
    - word: बीजम्
      iast: bījam
      gloss_en: seed-syllable (of the mantra)
      morph: nom. sg. n.
      gloss_as: বীজ-অক্ষৰ (মন্ত্ৰৰ)
      gloss_bn: বীজ-মন্ত্র
      gloss_gu: બીજાક્ષર (મંત્રનું)
      gloss_hi: बीज-मन्त्र
      gloss_kn: ಬೀಜಾಕ್ಷರ (ಮಂತ್ರದ)
      gloss_ml: ബീജം, ബീജാക്ഷരം (മന്ത്രത്തിന്റെ)
      gloss_mr: बीजमंत्र
