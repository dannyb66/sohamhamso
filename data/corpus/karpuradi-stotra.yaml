text:
  id: karpuradi-stotra
  slug: karpuradi-stotra
  title_sa: कर्पूरादिस्तोत्रम्
  title_en: Karpūrādi Stotra
  title_iast: Karpūrādi-stotra
  author: null
  tradition: shakta
  school: kaula
  era: "circa 8th-10th century CE"
  source: "sanskritdocuments.org (encoded by Mike Magee); reference translation: John Woodroffe (Arthur Avalon), 'Hymn to Kali: Karpūrādi-stotra' (1922), public domain"
  source_url: "https://sanskritdocuments.org/doc_devii/karpuuraadi.html"
  source_revision: "2000-08-23"
  license: CC-BY-SA
  parent_text_id: null
  manuscript_url: null
  description: |
    Karpūrādi Stotra ("Hymn beginning with the syllable Karpūra") — a
    Śākta Tantric hymn to the Goddess Dakṣiṇa-Kālī, structured around
    her twenty-two-syllable mantra. Each verse describes the esoteric
    realisation of a single syllable, encoded in a deliberately
    obscure "twilight language" (sandhyā-bhāṣā). Famously translated
    and published by John Woodroffe (Arthur Avalon) in 1922 as "Hymn
    to Kali", which serves as our reference anchor (now public domain).
    Twenty-two verses plus a closing colophon attributing the hymn to
    Mahā-Kālī herself.

chapters:
  - chapter: 1
    title_sa: कर्पूरादिस्तोत्रम्
    title_iast: Karpūrādi-stotram
    title_en: Karpūrādi Stotra
    verses:
      - verse: 1
        devanagari: |
          कर्पूरं मध्यमान्त्यस्वरपरिरहितं सेन्दुवामाक्षियुक्तं
          बीजं ते मातरेतत्त्रिपुरहरवधु त्रिःकृतं ये जपन्ति ।
          तेषां गद्यानि पद्यानि च मुखकुहरादुल्लसन्त्येव वाचः
          स्वच्छन्दं ध्वान्तधाराधररुचिरुचिरे सर्वसिद्धिं गतानाम् ॥ १॥
        iast: "karpūraṃ madhyamāntyasvaraparirahitaṃ sendu-vāmākṣi-yuktaṃ / bījaṃ te mātar etat tripura-hara-vadhu triḥkṛtaṃ ye japanti / teṣāṃ gadyāni padyāni ca mukha-kuhārād ullasanty eva vācaḥ / svacchandaṃ dhvānta-dhārā-dhara-ruci-rucire sarva-siddhiṃ gatānām // 1 //"
        meter: śārdūlavikrīḍita
        word_glosses:
          - word: कर्पूरम्
            iast: karpūram
            gloss_en: camphor (i.e. the syllable Kraṃ — first syllable of the Kālī mantra)
            morph: nom. sg. n.
          - word: बीजम्
            iast: bījam
            gloss_en: seed-syllable (of the mantra)
            morph: nom. sg. n.
          - word: मातर्
            iast: mātar
            gloss_en: O Mother
            morph: voc. sg. f.
          - word: त्रिपुरहरवधु
            iast: tripura-hara-vadhu
            gloss_en: O Spouse of the Slayer of the three cities (Śiva)
            morph: voc. sg. f. cpd.
          - word: त्रिःकृतम्
            iast: triḥ-kṛtam
            gloss_en: repeated thrice
            morph: acc. sg. n.
          - word: जपन्ति
            iast: japanti
            gloss_en: they recite (silently)
            morph: 3pl. pres. √jap
          - word: सर्वसिद्धिम्
            iast: sarva-siddhim
            gloss_en: every attainment, perfect accomplishment
            morph: acc. sg. f. cpd.
          - word: ध्वान्तधाराधर
            iast: dhvānta-dhārā-dhara
            gloss_en: dark as a rain-laden cloud
            morph: epithet cpd.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "O Mother and Spouse of the Slayer of the three cities — they who recite, three times repeated, this Thy seed-syllable (Karpūra, without its middle and final vowels, joined with the half-moon and the left eye), upon them, O Thou whose beauty is that of a rain-cloud at twilight, prose and verse flow at will from the cavern of the mouth, and all perfections come to them."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 2
        devanagari: |
          ईशानः सेन्दुवामश्रवणपरिगतो बीजमन्यन्महेशि
          द्वन्द्वं ते मन्दचेता यदि जपति जनो वारमेकं कदाचित् ।
          जित्वा वाचामधीशं धनमपि च चिरं मोहयन्नम्बुजाक्षीवृन्दं
          चन्द्रार्धचूडे प्रभवति स महाघोरबालावतंसे ॥ २॥
        iast: "īśānaḥ sendu-vāma-śravaṇa-parigato bījam anyan maheśi / dvandvaṃ te manda-cetā yadi japati jano vāram ekaṃ kadācit / jitvā vācām adhīśaṃ dhanam api ca ciraṃ mohayann ambujākṣī-vṛndaṃ / candrārdha-cūḍe prabhavati sa mahāghora-bālāvataṃse // 2 //"
        meter: śārdūlavikrīḍita
        word_glosses:
          - word: ईशानः
            iast: īśānaḥ
            gloss_en: "the syllable Hūṃ (lit. 'lord', a coded name for Ha)"
            morph: nom. sg. m.
          - word: महेशि
            iast: maheśi
            gloss_en: O great Goddess
            morph: voc. sg. f.
          - word: मन्दचेताः
            iast: manda-cetāḥ
            gloss_en: of dull or undeveloped mind
            morph: nom. sg. m. cpd.
          - word: जपति
            iast: japati
            gloss_en: recites
            morph: 3sg. pres. √jap
          - word: चन्द्रार्धचूडे
            iast: candrārdha-cūḍe
            gloss_en: O Thou with the crescent moon as crest
            morph: voc. sg. f. cpd.
          - word: महाघोरबालावतंसे
            iast: mahāghora-bālāvataṃse
            gloss_en: O Thou wearing terrible children (skulls) as ornaments
            morph: voc. sg. f. cpd.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "O Great Goddess crowned with the crescent moon and adorned with the dreadful skulls of children — should even a dull-minded man recite even once Thy second pair of seed-syllables (Īśāna joined with the half-moon and the left ear, a doubled bīja), he conquers the Lord of Speech, gains lasting wealth, and bewitches the host of lotus-eyed women."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 3
        devanagari: |
          ईशो वैश्वानरस्थः शशधरविलसद्वामनेत्रेण युक्तो
          बीजं ते द्वन्द्वमन्यद् विगलितचिकुरे कालिके ये जपन्ति ।
          द्वेष्टारं घ्नन्ति ते च त्रिभुवनमपि ते वश्यभावं नयन्ति
          सृक्कद्वन्द्वास्रधाराद्वयधरवदने दक्षिणे त्र्यक्षरेति ॥ ३॥
        iast: "īśo vaiśvānara-sthaḥ śaśadhara-vilasad-vāma-netreṇa yukto / bījaṃ te dvandvam anyad vigalita-cikure kālike ye japanti / dveṣṭāraṃ ghnanti te ca tribhuvanam api te vaśya-bhāvaṃ nayanti / sṛkka-dvandvāsra-dhārā-dvaya-dhara-vadane dakṣiṇe tryakṣareti // 3 //"
        meter: śārdūlavikrīḍita
        word_glosses:
          - word: कालिके
            iast: kālike
            gloss_en: O Kālikā
            morph: voc. sg. f.
          - word: विगलितचिकुरे
            iast: vigalita-cikure
            gloss_en: O Thou with loosened hair
            morph: voc. sg. f. cpd.
          - word: द्वेष्टारम्
            iast: dveṣṭāram
            gloss_en: enemy, hater
            morph: acc. sg. m.
          - word: त्रिभुवनम्
            iast: tribhuvanam
            gloss_en: the three worlds
            morph: acc. sg. n.
          - word: वश्यभावम्
            iast: vaśya-bhāvam
            gloss_en: into subjugation
            morph: acc. sg. m. cpd.
          - word: दक्षिणे
            iast: dakṣiṇe
            gloss_en: O Dakṣiṇā (Kālī facing south)
            morph: voc. sg. f.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "O Kālikā with loosened hair, O Dakṣiṇā whose face streams with two rivulets of blood from both corners of Thy mouth — those who recite Thy other twin seed-syllable (Īśa seated in Fire, joined with the moon-bearing left eye), they slay their enemies and bring all three worlds into subjugation; thus Thy threefold mantra."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 4
        devanagari: |
          ऊर्ध्वे वामे कृपाणं करकमलतले छिन्नमुण्डं तथाधः
          सव्ये चाभीर्वरं च त्रिजगदघहरे दक्षिणे कालिके च ।
          जप्त्वैतन्नाम ये वा तव मनुविभवं भावयन्त्येतदम्ब
          तेषामष्टौ करस्थाः प्रकटितरदने सिद्धयस्त्र्यम्बकस्य ॥ ४॥
        iast: "ūrdhve vāme kṛpāṇaṃ kara-kamala-tale chinna-muṇḍaṃ tathādhaḥ / savye cābhīr varaṃ ca trijagad-agha-hare dakṣiṇe kālike ca / japtvaitan nāma ye vā tava manu-vibhavaṃ bhāvayanty etad amba / teṣām aṣṭau karasthāḥ prakaṭita-radane siddhayas tryambakasya // 4 //"
        meter: sragdharā
        word_glosses:
          - word: कृपाणम्
            iast: kṛpāṇam
            gloss_en: sword
            morph: acc. sg. n.
          - word: छिन्नमुण्डम्
            iast: chinna-muṇḍam
            gloss_en: severed head
            morph: acc. sg. n. cpd.
          - word: अभीः
            iast: abhīḥ
            gloss_en: the gesture of fearlessness (abhaya-mudrā)
            morph: nom. sg. f.
          - word: वरम्
            iast: varam
            gloss_en: the boon-granting gesture (vara-mudrā)
            morph: acc. sg. m./n.
          - word: त्रिजगदघहरे
            iast: trijagad-agha-hare
            gloss_en: O Remover of the sins of the three worlds
            morph: voc. sg. f. cpd.
          - word: सिद्धयः
            iast: siddhayaḥ
            gloss_en: the perfections (the eight aṇimādi siddhis)
            morph: nom. pl. f.
          - word: त्र्यम्बकस्य
            iast: tryambakasya
            gloss_en: of the three-eyed Lord (Śiva)
            morph: gen. sg. m.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "O Mother, O Kālikā, O Remover of the sins of the three worlds, O Dakṣiṇā with teeth bared — bearing in Thy upper left palm a sword and below it a severed head, and in Thy right hands the gestures of fearlessness and of granting boons — those who, having recited this Thy name, meditate on the majesty of Thy mantra, the eight perfections of the Three-Eyed One rest in their hands."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 5
        devanagari: |
          वर्गाद्यं वह्निसंस्थं विधुरतिललितं तत्त्रयं कूर्चयुग्मं
          लज्जाद्वन्द्वं च पश्चात् स्मितमुखि तदधष्ठद्वयं योजयित्वा ।
          मातर्ये ये जपन्ति स्मरहरमहिले भावयन्तः स्वरूपं
          ते लक्ष्मीलास्यलीलाकमलदलदृशः कामरूपा भवन्ति ॥ ५॥
        iast: "vargādyaṃ vahni-saṃsthaṃ vidhur ati-lalitaṃ tat-trayaṃ kūrca-yugmaṃ / lajjā-dvandvaṃ ca paścāt smita-mukhi tad-adhaḥ-ṣṭha-dvayaṃ yojayitvā / mātar ye ye japanti smara-hara-mahile bhāvayantaḥ svarūpaṃ / te lakṣmī-lāsya-līlā-kamala-dala-dṛśaḥ kāma-rūpā bhavanti // 5 //"
        meter: sragdharā
        word_glosses:
          - word: मातर्
            iast: mātar
            gloss_en: O Mother
            morph: voc. sg. f.
          - word: स्मरहरमहिले
            iast: smara-hara-mahile
            gloss_en: O Consort of the Slayer of the god of love (Śiva)
            morph: voc. sg. f. cpd.
          - word: स्मितमुखि
            iast: smita-mukhi
            gloss_en: O Thou with smiling face
            morph: voc. sg. f. cpd.
          - word: स्वरूपम्
            iast: svarūpam
            gloss_en: Thy true form
            morph: acc. sg. n.
          - word: कामरूपाः
            iast: kāma-rūpāḥ
            gloss_en: able to assume any form at will
            morph: nom. pl. m. cpd.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "O Mother with smiling face, Consort of Him who slew the god of love — they who, joining together the syllables in the prescribed order and meditating on Thy true form, recite Thy mantra, become themselves able to take any form at will, with eyes like the play of Lakṣmī upon lotus-petals."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 6
        devanagari: |
          प्रत्येकं वा द्वयं वा त्रयमपि च परं बीजमत्यन्तगुह्यं
          त्वन्नाम्ना योजयित्वा सकलमपि सदा भावयन्तो जपन्ति ।
          तेषां नेत्रारविन्दे विहरति कमला वक्त्रशुभ्रांशुबिम्बे
          वाग्देवी देवि मुण्डस्रगतिशयलसत्कण्ठि पीनस्तनाढ्ये ॥ ६॥
        iast: "pratyekaṃ vā dvayaṃ vā trayam api ca paraṃ bījam atyanta-guhyaṃ / tvan-nāmnā yojayitvā sakalam api sadā bhāvayanto japanti / teṣāṃ netrāravinde viharati kamalā vaktra-śubhrāṃśu-bimbe / vāg-devī devi muṇḍa-srag-atiśaya-lasat-kaṇṭhi pīna-stanāḍhye // 6 //"
        meter: sragdharā
        word_glosses:
          - word: अत्यन्तगुह्यम्
            iast: atyanta-guhyam
            gloss_en: utterly secret
            morph: acc. sg. n. cpd.
          - word: कमला
            iast: kamalā
            gloss_en: Lakṣmī (goddess of fortune)
            morph: nom. sg. f.
          - word: वाग्देवी
            iast: vāg-devī
            gloss_en: Sarasvatī (goddess of speech)
            morph: nom. sg. f. cpd.
          - word: मुण्डस्रक्
            iast: muṇḍa-srak
            gloss_en: garland of skulls
            morph: nom. sg. f. cpd.
          - word: पीनस्तनाढ्ये
            iast: pīna-stanāḍhye
            gloss_en: O Thou rich with full breasts
            morph: voc. sg. f. cpd.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "O Goddess garlanded with skulls, full-breasted — those who recite, singly or in twos or threes, the supreme and most secret seed-syllables joined with Thy name, ever meditating on the whole, in their lotus-eyes Lakṣmī sports, and in their bright moon-faces dwells the Goddess of Speech."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 7
        devanagari: |
          गतासूनां बाहुप्रकरकृतकाञ्चीपरिलसन्नितम्बां
          दिग्वस्त्रां त्रिभुवनविधात्रीं त्रिणयनाम् ।
          श्मशानस्थे तल्पे शवहृदि महाकालसुरतप्रयुक्तां
          त्वां ध्यायन् जननि जडचेता अपि कविः ॥ ७॥
        iast: "gatāsūnāṃ bāhu-prakara-kṛta-kāñcī-parilasan-nitambāṃ / dig-vastrāṃ tribhuvana-vidhātrīṃ tri-nayanām / śmaśāna-sthe talpe śava-hṛdi mahākāla-surata-prayuktāṃ / tvāṃ dhyāyañ janani jaḍa-cetā api kaviḥ // 7 //"
        meter: śikhariṇī
        word_glosses:
          - word: दिग्वस्त्राम्
            iast: dig-vastrām
            gloss_en: clothed in the directions (i.e. naked)
            morph: acc. sg. f. cpd.
          - word: त्रिभुवनविधात्रीम्
            iast: tribhuvana-vidhātrīm
            gloss_en: ordainer of the three worlds
            morph: acc. sg. f. cpd.
          - word: श्मशानस्थे तल्पे
            iast: śmaśāna-sthe talpe
            gloss_en: on a couch set in the cremation ground
            morph: loc. sg. n.
          - word: महाकालसुरतप्रयुक्ताम्
            iast: mahākāla-surata-prayuktām
            gloss_en: engaged in love with Mahākāla (the great Time, Śiva)
            morph: acc. sg. f. cpd.
          - word: जडचेताः
            iast: jaḍa-cetāḥ
            gloss_en: of dull mind
            morph: nom. sg. m. cpd.
          - word: कविः
            iast: kaviḥ
            gloss_en: becomes a poet
            morph: nom. sg. m.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "O Mother — even a dull-minded man becomes a poet who meditates on Thee, whose hips gleam with a girdle made of the arms of the slain, who art clothed in the four directions, the ordainer of the three worlds, three-eyed, upon a couch in the cremation ground on the breast of a corpse, joined in love with Mahākāla."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 8
        devanagari: |
          शिवाभिर्घोराभिः शवनिवहमुण्डास्थिनिकरैः
          परं संकीर्णायां प्रकटितचितायां हरवधूम् ।
          प्रविष्टां सन्तुष्टामुपरिसुरतेनातियुवतीं
          सदा त्वां ध्यायन्ति क्वचिदपि च न तेषां परिभवः ॥ ८॥
        iast: "śivābhir ghorābhiḥ śava-nivaha-muṇḍāsthi-nikaraiḥ / paraṃ saṃkīrṇāyāṃ prakaṭita-citāyāṃ hara-vadhūm / praviṣṭāṃ santuṣṭām upari-suratenāti-yuvatīṃ / sadā tvāṃ dhyāyanti kvacid api ca na teṣāṃ paribhavaḥ // 8 //"
        meter: śikhariṇī
        word_glosses:
          - word: शिवाभिः
            iast: śivābhiḥ
            gloss_en: with she-jackals
            morph: inst. pl. f.
          - word: चितायाम्
            iast: citāyām
            gloss_en: on the funeral pyre
            morph: loc. sg. f.
          - word: हरवधूम्
            iast: hara-vadhūm
            gloss_en: bride of Hara (Śiva)
            morph: acc. sg. f. cpd.
          - word: अतियुवतीम्
            iast: ati-yuvatīm
            gloss_en: ever-youthful
            morph: acc. sg. f.
          - word: परिभवः
            iast: paribhavaḥ
            gloss_en: defeat, humiliation
            morph: nom. sg. m.
        translations:
          - lang: en
            translator: "sohamhamso (after Woodroffe 1922)"
            license: PD
            text: "Those who ever meditate on Thee — Bride of Hara, ever-youthful and well-pleased upon Thy lover, entered into the pyre lit upon a cremation ground thick with terrible she-jackals and heaps of skulls and bones of the slain — they meet defeat nowhere."
            ai_assisted: true
            status: published
            model: claude-opus-4-7
            prompt_version: v1-sanskrit-grounded

      - verse: 9
        devanagari: |
          वदामस्ते किं वा जननि वयमुच्चैर्जडधियो
