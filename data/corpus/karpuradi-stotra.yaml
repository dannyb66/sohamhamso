    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे खुली केशराशि वाली कालिके, हे दक्षिणे, जिसके मुख के दोनों कोनों से रक्त की दो धाराएँ बह रही हैं! जो साधक तेरे तीसरे युगल बीज को — ईश (क) को अग्नि-स्थित (र) और चन्द्रमा-सहित वाम-नेत्र (ई) से युक्त करके — जपते हैं, वे अपने शत्रुओं का नाश करते हैं और तीनों लोकों को अपने वश में कर लेते हैं। इस प्रकार तेरा त्र्यक्षर मन्त्र पूर्ण होता है।
