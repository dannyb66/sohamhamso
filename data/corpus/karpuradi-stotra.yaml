      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: પ્રેમથી કાંપતી મૃગાક્ષી સ્ત્રીઓનો સમૂહ તેની પાછળ ચાલે છે; પૃથ્વીપતિ રાજા પણ તેને વશ થાય છે; તે કુબેરનો પ્રતિનિધિ (સમકક્ષ) બને છે; શત્રુ અને કારાગાર — એ બંનેને તે ક્રીડા-કલા જેવા ગણે છે; એ ભક્ત ચિરકાળ સુધી જીવન્મુક્ત રહીને જન્મ-જન્મે સમર્થ થાય છે.
