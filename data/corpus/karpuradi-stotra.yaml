    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "He who, himself absorbed at night in the bliss of love, meditates on Thee — smiling-faced, upon the fifteen-spoked seat, upon the breast of Śiva-as-corpse, given over to the savour and grace of love with Mahākāla — that man, O Mother, becomes the Slayer of Smara himself."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে অয়ি জননী! যি ব্যক্তিয়ে ৰাতি নিজেও ৰতিৰ আনন্দত নিৰত হৈ, পঞ্চদশাৰৰ (শ্ৰীচক্ৰৰ) আসনত শৱ-শিৱৰ বুকুত স্মিতমুখা, মহাকালৰ সৈতে উচ্চৰূপে মদনৰস আৰু লাৱণ্যত নিৰতা তোমাক ধ্যান কৰে — সেই মানুহ স্বয়ং স্মৰহৰ (শিৱ) হৈ পৰে।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে জননী! ত্রি-পঞ্চ-আর (পঞ্চদশ-অর শ্রী-চক্র) পীঠে, শব-শিবের হৃদয়োপরি, স্মিত-বদনা, মহাকালের সহিত উচ্চৈঃস্বরে মদনরস-লাবণ্যে নিরতা — তোমাকে রাত্রে স্বয়ং রতানন্দে নিরত হইয়া যিনি ধ্যান করেন, হে অয়ি জননী, সেই জন স্মরহর (শিব) সমান হন।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
