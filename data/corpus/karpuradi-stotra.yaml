      text: હે મહેશી! ઈશાન (હ) જે સેન્દુ-વામશ્રવણ (અર્ધચંદ્ર અને ડાબા કાન-સ્વર) સહિત છે — એવું તારું બીજું બીજ યુગલરૂપે — જો કોઈ મંદબુદ્ધિ માણસ પણ ક્યારેક એક વાર જપે, હે અર્ધચંદ્ર-મુકુટધારિણી, હે મહાઘોર બાળકોના (કંકાલના) અવતંસથી શોભતી! તે વાચસ્પતિને જીતી લે છે, દીર્ઘકાળ સુધી ધનને પ્રાપ્ત કરે છે, અને કમલનયના સ્ત્રીઓના સમૂહને મોહિત કરી લે છે.
