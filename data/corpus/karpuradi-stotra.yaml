      text: ହେ ଅସିତେ (କୃଷ୍ଣ-ବର୍ଣ୍ଣା) — ଯେଉଁ ମର୍ତ୍ୟ-ବାସୀ ସତ୍‌-ପୁରୁଷମାନେ ତୁମ୍ଭର ପୂଜାରେ ବଳି ସ୍ୱରୂପ ଲୋମ ଓ ଅସ୍ଥି ସହିତ ସ୍ୱଚ୍ଛନ୍ଦ ଭାବେ ମାଂସ ଅର୍ପଣ କରନ୍ତି — ବିଡ଼ାଳ, ଉଷ୍ଟ୍ର, ମେଷ, ନର, ମହିଷ, କିମ୍ବା ଛାଗ-ର ମଧ୍ୟ — ସେମାନଙ୍କ ପ୍ରତ୍ୟେକ ପଦରେ ସମସ୍ତ ସିଦ୍ଧି ଅପୂର୍ବ ଭାବେ ପ୍ରକଟ ହୁଏ ।
