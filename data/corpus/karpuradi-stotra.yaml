    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Mother, this hymn, born of the unfolding of Thy mantra and called Thy True Form (svarūpa), conjoined with the rite of worship of Thy pair of lotus-feet — whoever reads it at midnight or during worship, even his disordered speech flows as the nectar-essence of poetry."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে মাতৃ! এই স্তোত্ৰ — তোমাৰ মন্ত্ৰৰ সমুদ্ধাৰণৰ পৰা জনমা, ‘স্বৰূপ’ নামেৰে খ্যাত, তোমাৰ চৰণপদ্মযুগলৰ পূজাৰ বিধিৰে যুক্ত — যিজনে অৰ্ধৰাতিত বা পূজাৰ সময়ত পঢ়ে, তেওঁৰ প্ৰলাপো কবিত্ৱ-অমৃতৰসৰ দৰে প্ৰসাৰিত হয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে মাতা! এই স্তোত্র তোমার মন্ত্রের সমুদ্ধার হইতে উদ্ভূত, ‘স্বরূপ’ নামে আখ্যাত, তোমার পাদাম্বুজ-যুগলের পূজা-বিধির সহিত যুক্ত — যিনি ইহা মধ্যরাত্রে অথবা পূজা-সময়ে পাঠ করেন, তাঁহার প্রলাপও কবিত্ব-অমৃত-রসের ন্যায় প্রবাহিত হয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે માતા! આ સ્તોત્ર, જે તારા મંત્રના ઉદ્ધારથી જન્મેલું, ‘સ્વરૂપ’ નામથી પ્રખ્યાત, અને તારા ચરણ-કમલ-યુગલની પૂજાવિધિ સાથે યુક્ત છે — જે મધ્યરાત્રિએ કે પૂજાસમયે પાઠ કરે છે, તેનો પ્રલાપ (છૂટક છૂટક બોલવું) પણ કવિતારૂપી અમૃત-રસ રૂપે વહે છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे माता, यह स्तोत्र — जो तेरे मन्त्र के उद्धार से उत्पन्न हुआ है, ‘स्वरूप’ नाम से प्रसिद्ध है, और तेरे चरण-कमल-युगल की पूजा-विधि से युक्त है — जो भी मनुष्य आधी रात को अथवा पूजा के समय इसे पढ़ता है, उसका टूटा-फूटा प्रलाप भी काव्य-अमृत-रस की धारा बनकर बहने लगता है।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ಓ ತಾಯಿ — ನಿನ್ನ ಮಂತ್ರದ ಸಮುದ್ಧಾರಣದಿಂದ ಜನಿಸಿದ, 'ಸ್ವರೂಪ' ಎಂಬ ಹೆಸರಿನ, ನಿನ್ನ ಪಾದಾಂಬುಜಯುಗಲದ ಪೂಜಾವಿಧಿಯಿಂದ ಯುಕ್ತವಾದ ಈ ಸ್ತೋತ್ರವನ್ನು ಮಧ್ಯರಾತ್ರಿಯಲ್ಲಿ ಅಥವಾ ಪೂಜಾಸಮಯದಲ್ಲಿ ಯಾರು ಪಠಿಸುತ್ತಾರೋ, ಅವನ ಪ್ರಲಾಪ ಕೂಡ ಕವಿತ್ವದ ಅಮೃತರಸವಾಗಿ ಹರಿಯುತ್ತದೆ.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: അമ്മേ — അവിടത്തെ മന്ത്രത്തിന്റെ ഉദ്ധാരണത്തിൽനിന്നുദിച്ച, സ്വരൂപമെന്നു പേരുള്ള, അവിടത്തെ പാദതാമരയുഗ്മത്തിന്റെ പൂജാവിധിയോടു ചേർന്ന ഈ സ്തോത്രം മധ്യരാത്രിയിലോ പൂജാസമയത്തോ പാരായണം ചെയ്യുന്നവന്റെ പ്രലപനംപോലും കവിത്വാമൃതരസമായി ഒഴുകുന്നു.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे माते! हे तुझ्या मंत्राच्या उद्धारातून (विवरणातून) जन्मलेले, 'स्वरूप' नावाचे, तुझ्या पादांबुजयुगलाच्या पूजाविधीने युक्त असलेले हे स्तोत्र — जो कोणी मध्यरात्री किंवा पूजेच्या वेळी पठण करतो, त्याचा बडबडलेला (निरर्थक) प्रलापदेखील कवित्वामृतरस म्हणून प्रवाहित होतो.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
