      text: କୁରଙ୍ଗ-ନେତ୍ରୀ (ହରିଣ-ଆଖି ଯୁବତୀ)ମାନଙ୍କ ବୃନ୍ଦ ପ୍ରେମରେ ବିହ୍ୱଳ ହୋଇ ତାହାର ଅନୁସରଣ କରନ୍ତି; କ୍ଷୋଣୀ-ପତି (ରାଜା) ମଧ୍ୟ ତାହାର ବଶବର୍ତ୍ତୀ, ସେ ସ୍ୱୟଂ କୁବେରର ପ୍ରତିନିଧି; ଶତ୍ରୁ ଓ କାରାଗାରକୁ ସେ କେଳି-କଳା ସଦୃଶ ତୁଚ୍ଛ ମନେ କରେ — ଚିରକାଳ ଜୀବନ୍ମୁକ୍ତ ହୋଇ, ସେହି ଭକ୍ତ ଜନ୍ମ-ଜନ୍ମାନ୍ତରେ ପ୍ରଭାବଶାଳୀ ହୁଏ ।
