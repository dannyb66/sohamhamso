    - lang: kn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ಓ ಕಾಳಿಕೇ, ಓ ಮುಕ್ತಕೇಶಿ, ಓ ದಕ್ಷಿಣಾಕಾಳಿ — ಬಾಯಿಯ ಎರಡೂ ಕೊನೆಗಳಿಂದ ಎರಡು ರಕ್ತಧಾರೆಗಳನ್ನು ಹರಿಸುತ್ತಿರುವ ಮುಖವುಳ್ಳವಳೇ — ವೈಶ್ವಾನರನಲ್ಲಿ (ಅಗ್ನಿಯಲ್ಲಿ) ನೆಲೆಸಿದ ಈಶ (ಹ್) ಎಂಬುದನ್ನು ಚಂದ್ರಯುಕ್ತವಾದ ಎಡಗಣ್ಣಿನೊಂದಿಗೆ ಸೇರಿಸಿದ ಮತ್ತೊಂದು ಜೋಡಿ ಬೀಜಾಕ್ಷರವನ್ನು ಯಾರು ಜಪಿಸುತ್ತಾರೋ, ಅವರು ಶತ್ರುಗಳನ್ನು ಸಂಹರಿಸಿ ಮೂರು ಲೋಕಗಳನ್ನು ತಮ್ಮ ವಶಕ್ಕೆ ತೆಗೆದುಕೊಳ್ಳುತ್ತಾರೆ — ಹೀಗೆ ನಿನ್ನ ತ್ರ್ಯಕ್ಷರ ಮಂತ್ರ.
