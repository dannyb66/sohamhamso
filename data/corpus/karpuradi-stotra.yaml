    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Mother, what indeed can we, the dull of intellect, presume to say of Thee? Brahmā does not know Thy supreme nature, nor Īśa, nor even Hari. Yet devotion to Thee makes even us, O Boundless One, speak. Therefore forgive what we say — for anger toward the bound creature is unbecoming."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে জননী, আমি অতি জড়বুদ্ধিৰ মানুহে তোমাৰ বিষয়ে কি ক’ম? ব্ৰহ্মাইও তোমাৰ পৰম তত্ত্ব নাজানে, ঈশেও নাজানে, হৰিয়েও নাজানে। তথাপি হে অপৰিমিতে, তোমাৰ প্ৰতি ভক্তিয়ে আমাক বাচাল কৰি তুলিছে। সেই কাৰণে এই সকলোবোৰ ক্ষমা কৰিবা — পশুৰ প্ৰতি ক্ৰোধ উচিত নহয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
