    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Kālikā with loosened hair, O Dakṣiṇā whose face streams with two rivulets of blood from both corners of Thy mouth — those who recite Thy other twin seed-syllable (Īśa seated in Fire, joined with the moon-bearing left eye), they slay their enemies and bring all three worlds into subjugation; thus Thy threefold mantra."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে কালিকে, হে কেশ মুকলি কৰি ৰখা দেৱী, হে দক্ষিণা — যাৰ মুখৰ দুই কোণৰ পৰা ৰক্তৰ দুটা ধাৰা বৈ আছে! ঈশ (‘হ’) — বৈশ্বানৰত স্থিত হৈ, চন্দ্ৰৰে দীপ্তিমান বাম নেত্ৰৰে যুক্ত — তোমাৰ এই আন এক বীজযুগল যিসকলে জপ কৰে, তেওঁলোকে শত্ৰুক বধ কৰে আৰু ত্ৰিভুৱনকো বশীভূত কৰে; এনেদৰে তোমাৰ ত্ৰ্যক্ষৰ মন্ত্ৰ।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
