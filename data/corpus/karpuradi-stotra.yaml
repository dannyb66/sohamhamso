    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "He who, at midday on a Tuesday, offers in the cremation ground his loose hair with its root and his fallen seed, and with love once utters Thy mantra — O Kālī, he ever becomes lord of the earth, mounted on an elephant, foremost among true poets."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে কালি! যিজনে ঘৰৰ সাঁৱৰ-পাত (ঝাড়ু-পাত) সম্বন্ধীয়া কেশক বীৰ্যৰে অভিষিক্ত কৰি, মঙলবাৰে দুপৰীয়া সমূলে চিতাত অৰ্পণ কৰে, আৰু প্ৰেমেৰে এবাৰ তোমাৰ মন্ত্ৰ উচ্চাৰণ কৰে — তেওঁ সদায় হাতীত আৰোহণ কৰি যোৱা পৃথিৱীপতি আৰু সৎ কবিসকলৰ মাজত শ্ৰেষ্ঠ হয়।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে কালি! যিনি গৃহে — মঙ্গলবার দিনে, মধ্যাহ্নকালে, সম্মার্জনীর (ঝাঁটার) সহিত নিজের গলিত বীর্যযুক্ত কেশকে সমূলে চিতায় অর্পণ করিয়া, প্রেমভরে একবার তোমার মন্ত্র উচ্চারণ করেন — তিনি সদা গজারূঢ় হইয়া যান, ক্ষিতিপতি ও সৎ-কবিবর হন।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે કાલિ! જે માણસ ઘરમાં, મંગળવારે, મધ્યાહ્ને, સ્ખલિત વીર્યથી ખરડાયેલા સમૂળ કેશને ચિતામાં અર્પણ કરે અને પ્રેમપૂર્વક એક વાર પણ તારો મંત્ર ઉચ્ચારે — તે ગજારૂઢ થઈ સદા પૃથ્વીનો સ્વામી અને સત્કવિઓમાં શ્રેષ્ઠ બને છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे कालि! जो साधक मंगलवार के दिन, मध्याह्न के समय, श्मशान की चिता पर अपने झड़े हुए केश सहित मूल को और स्खलित वीर्य को अर्पित कर के, प्रेम-पूर्वक एक बार भी तेरा मन्त्र उच्चारण करता है, वह सत्कवियों में अग्रगण्य होकर हाथी पर सवार पृथ्वी का स्वामी बन जाता है।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
