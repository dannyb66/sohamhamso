      text: ਹੇ ਮਹੇਸ਼ੀ! ਹੇ ਅਰਧ-ਚੰਦ੍ਰ ਨੂੰ ਮੁਕਟ ਉੱਤੇ ਧਾਰਨ ਕਰਨ ਵਾਲੀ! ਹੇ ਮਹਾਘੋਰ ਬਾਲਕਾਂ ਦੀਆਂ ਖੋਪੜੀਆਂ ਨੂੰ ਆਭੂਸ਼ਣ ਵਜੋਂ ਪਹਿਨਣ ਵਾਲੀ! ਜੇ ਮੰਦ-ਬੁੱਧੀ ਵਾਲਾ ਮਨੁੱਖ ਵੀ ਤੇਰੇ ਦੂਜੇ ਬੀਜ-ਜੋੜੇ ਨੂੰ (ਈਸ਼ਾਨ ਜੋ ਅਰਧ-ਚੰਦ੍ਰ ਅਤੇ ਖੱਬੇ ਕੰਨ ਨਾਲ ਯੁਕਤ ਹੈ, ਦੁਗਣਾ) ਕਦੇ ਇੱਕ ਵਾਰ ਵੀ ਜਪ ਲਏ — ਤਾਂ ਉਹ ਵਾਣੀ ਦੇ ਸੁਆਮੀ (ਬ੍ਰਿਹਸਪਤੀ) ਨੂੰ ਜਿੱਤ ਲੈਂਦਾ ਹੈ, ਚਿਰਕਾਲ ਤੱਕ ਧਨ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ, ਅਤੇ ਕਮਲ-ਨੈਣੀ ਇਸਤ੍ਰੀਆਂ ਦੇ ਸਮੂਹ ਨੂੰ ਮੋਹ ਲੈਂਦਾ ਹੈ।
