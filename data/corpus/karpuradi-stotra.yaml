    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Mother — even a dull-minded man becomes a poet who meditates on Thee, whose hips gleam with a girdle made of the arms of the slain, who art clothed in the four directions, the ordainer of the three worlds, three-eyed, upon a couch in the cremation ground on the breast of a corpse, joined in love with Mahākāla."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
