    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: मृग-नयनी नारियों का समूह प्रेम से विह्वल होकर उस भक्त के पीछे चलता है; पृथ्वी का राजा भी उसके वश में हो जाता है, और वह स्वयं कुबेर के समान धनी होता है; शत्रु और कारागार को वह केवल खेल का एक छोटा-सा अंश समझता है; और वह भक्त जीवन्मुक्त होकर जन्म-जन्मान्तर तक चिरकाल विजयी रहता है।
