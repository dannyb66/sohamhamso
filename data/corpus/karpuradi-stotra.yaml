  title_en: Karpūrādi Stotra
  title_iast: Karpūrādi-stotra
  author:
  tradition: shakta
  school: kaula
  era: "circa 8th-10th century CE"
  source: "sanskritdocuments.org (encoded by Mike Magee); reference translation: John Woodroffe (Arthur Avalon), 'Hymn to Kali: Karpūrādi-stotra' (1922), public domain"
