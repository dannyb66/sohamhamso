      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે કાલિકા, હે વિખરાયેલા કેશવાળી, હે દક્ષિણા — જેના વદન પરથી મુખના બંને ખૂણાઓએ રક્તધારાઓ વહે છે! ઈશ (ક) જે વૈશ્વાનરસ્થ (અગ્નિમાં, અર્થાત્ ‘ર’ સહિત) અને શશધર-યુક્ત વામનેત્ર (બિંદુ સહિત ‘ઈ’) સહિત છે — એવું તારું બીજું બીજ-યુગલ જે જપે છે, તેઓ શત્રુઓને હણે છે અને ત્રણે લોકને વશ કરી લે છે; આ રીતે તારો ત્રિ-અક્ષરી મંત્ર છે.
