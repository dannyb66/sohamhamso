    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Goddess garlanded with skulls, full-breasted — those who recite, singly or in twos or threes, the supreme and most secret seed-syllables joined with Thy name, ever meditating on the whole, in their lotus-eyes Lakṣmī sports, and in their bright moon-faces dwells the Goddess of Speech."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে দেৱী, হে মুণ্ডমালাৰে দীপ্তগ্ৰীৱা, হে পীনস্তনা! পৰম গোপন সেই বীজবোৰ — এটাকৈ, দুটাকৈ, বা তিনিটাকৈ — তোমাৰ নামৰ সৈতে যোজনা কৰি, সমস্তটো সদায় ধ্যান কৰি যিসকলে জপ কৰে, তেওঁলোকৰ পদ্মনয়নত কমলা (লক্ষ্মী) বিহাৰ কৰে আৰু উজ্জ্বল চন্দ্ৰৰ দৰে মুখমণ্ডলত বাগ্‌দেৱী (সৰস্বতী) বাস কৰে।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে দেবী, হে মুণ্ডমালা-শোভিত-কণ্ঠে, হে পীনস্তনাঢ্যে! যাহারা — একে একে, অথবা যুগলে, অথবা ত্রয়ে অথবা সকলে — তোমার অত্যন্ত গুহ্য পরম বীজসকল তোমার নামের সহিত যোজন করিয়া সদা ভাবনাপূর্বক জপ করেন, তাঁহাদের নেত্রকমলে কমলা (লক্ষ্মী) বিহার করেন এবং উজ্জ্বল চন্দ্রসম মুখবিম্বে বাগ্দেবী (সরস্বতী) বাস করেন।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે દેવી, હે મુંડમાળાથી અત્યંત શોભતા કંઠવાળી, હે પૂર્ણસ્તનધારિણી! એક એક કે બે કે ત્રણ — એ પરમ ગૂઢ બીજોને તારા નામ સાથે જોડીને જે સદા સકલનું ધ્યાન કરી જપે છે, તેમના નેત્ર-કમલમાં કમલા (લક્ષ્મી) વિહરે છે અને તેમના શુભ્ર ચંદ્ર-સમ મુખબિંબમાં વાગ્દેવી (સરસ્વતી) વસે છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे देवि, हे मुण्डमाला से सुशोभित कण्ठ वाली, हे पीन-स्तना! जो साधक तेरे परम गुह्य बीज-अक्षरों को — एक-एक करके, दो-दो करके, या तीन-तीन करके — तेरे नाम के साथ जोड़कर, सम्पूर्ण रूप का सदा ध्यान करते हुए जपते हैं, उनके कमल-नेत्रों में लक्ष्मी विहार करती हैं और उनके चन्द्रमा-समान उज्ज्वल मुख में वाग्देवी सरस्वती निवास करती हैं।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
