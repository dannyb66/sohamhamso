      license: CC-BY-SA
      text: ਹੇ ਖੁੱਲ੍ਹੇ ਕੇਸਾਂ ਵਾਲੀ ਕਾਲਿਕਾ! ਹੇ ਦਕ੍ਸ਼ਿਣਾ ਜਿਸ ਦੇ ਮੁੱਖ ਦੇ ਦੋਹਾਂ ਕੋਨਿਆਂ ਤੋਂ ਲਹੂ ਦੀਆਂ ਦੋ ਧਾਰਾਵਾਂ ਵਹਿ ਰਹੀਆਂ ਹਨ! ਜੋ ਤੇਰੇ ਦੂਜੇ ਯੁਗਮ ਬੀਜ-ਮੰਤ੍ਰ ਨੂੰ (ਵੈਸ਼੍ਵਾਨਰ-ਅਗਨੀ ਵਿੱਚ ਸਥਿਤ ਈਸ਼, ਚੰਦ੍ਰ-ਯੁਕਤ ਖੱਬੇ ਨੇਤ੍ਰ ਨਾਲ ਜੁੜਿਆ) ਜਪਦੇ ਹਨ — ਉਹ ਆਪਣੇ ਵੈਰੀਆਂ ਨੂੰ ਮਾਰ ਲੈਂਦੇ ਹਨ ਅਤੇ ਤਿੰਨਾਂ ਲੋਕਾਂ ਨੂੰ ਆਪਣੇ ਵੱਸ ਵਿੱਚ ਕਰ ਲੈਂਦੇ ਹਨ; ਇਉਂ ਤੇਰਾ ਤਿੰਨ-ਅੱਖਰੀ ਮੰਤ੍ਰ ਹੈ।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ta
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: தொங்கவிட்ட கூந்தலையுடைய காளிகையே, வாயின் இரு ஓரங்களிலும் இரு குருதி நீரோடைகளைச் சொரியும் முகத்தையுடைய தக்ஷிணையே! அக்னியில் நிலைபெற்ற, பிறைச்சந்திரம் ஒளிரும் இடதுகண்ணோடு கூடிய ஈஸன் — உனது மற்றொரு இரட்டைப் பீஜத்தை — யார் ஜபிக்கிறார்களோ, அவர்கள் பகைவரை அழித்து, மூவுலகையும் தம் வசத்தில் கொண்டுவருகின்றனர்; இதுவே உனது மூவெழுத்து மந்திரம்.
