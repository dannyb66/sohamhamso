schema_version: 1

seo:
  descriptions:
    en: "Karpūrādi Stotra: 22-verse Śākta Tantric hymn to Dakṣiṇa-Kālī unpacking her 22-syllable mantra in twilight language (sandhyā-bhāṣā)."
    hi: "कर्पूरादि स्तोत्र: दक्षिणकाली को समर्पित २२ श्लोकों का शाक्त तान्त्रिक स्तोत्र; कालीमन्त्र के २२ बीजाक्षरों का सन्ध्या-भाषा में रहस्योद्घाटन।"
    mr: "कर्पूरादि स्तोत्र: दक्षिण-कालीला समर्पित २२ श्लोकांचे शाक्त तांत्रिक स्तोत्र; कालीमंत्राच्या २२ बीजाक्षरांचे संध्या-भाषेत रहस्यदर्शन."
    bn: "কর্পূরাদি স্তোত্র: দক্ষিণ-কালীর প্রতি ২২ শ্লোকের শাক্ত তান্ত্রিক স্তোত্র; কালীমন্ত্রের ২২ বীজাক্ষরের সন্ধ্যা-ভাষায় ব্যাখ্যা."
    as: "কৰ্পূৰাদি স্তোত্ৰ: দক্ষিণ-কালীৰ প্ৰতি ২২ শ্লোকৰ শাক্ত তান্ত্ৰিক স্তোত্ৰ; কালীমন্ত্ৰৰ ২২ বীজাক্ষৰৰ সন্ধ্যা-ভাষাত ব্যাখ্যা."
    gu: "કર્પૂરાદિ સ્તોત્ર: દક્ષિણ-કાળીને સમર્પિત ૨૨ શ્લોકોનું શાક્ત તાંત્રિક સ્તોત્ર; કાળીમંત્રના ૨૨ બીજાક્ષરોનો સંધ્યા-ભાષામાં ઉદ્ઘાટન."
    pa: "ਕਰਪੂਰਾਦਿ ਸਤੋਤ੍ਰ: ਦਕ੍ਸ਼ਿਣ-ਕਾਲੀ ਨੂੰ ਸਮਰਪਿਤ ੨੨ ਸ਼ਲੋਕਾਂ ਦਾ ਸ਼ਾਕਤ ਤਾਂਤ੍ਰਿਕ ਸਤੋਤ੍ਰ; ਕਾਲੀ-ਮੰਤ੍ਰ ਦੇ ੨੨ ਬੀਜਾਖਰਾਂ ਦੀ ਸੰਧਯਾ-ਭਾਸ਼ਾ ਵਿੱਚ ਵਿਆਖਯਾ।"
    kn: "ಕರ್ಪೂರಾದಿ ಸ್ತೋತ್ರ: ದಕ್ಷಿಣ-ಕಾಳಿಗೆ ಅರ್ಪಿತ ೨೨ ಶ್ಲೋಕಗಳ ಶಾಕ್ತ ತಾಂತ್ರಿಕ ಸ್ತೋತ್ರ; ಕಾಳಿಮಂತ್ರದ ೨೨ ಬೀಜಾಕ್ಷರಗಳ ಸಂಧ್ಯಾ-ಭಾಷಾ ವಿವರಣೆ."
    ml: "കർപൂരാദി സ്തോത്രം: ദക്ഷിണ-കാളിക്ക് സമർപ്പിത 22 ശ്ലോകങ്ങളുടെ ശാക്ത താന്ത്രിക സ്തോത്രം; കാളീമന്ത്രത്തിലെ 22 ബീജാക്ഷരങ്ങളുടെ സന്ധ്യാ-ഭാഷാ വ്യാഖ്യാനം."
    or: "କର୍ପୂରାଦି ସ୍ତୋତ୍ର: ଦକ୍ଷିଣ-କାଳୀଙ୍କୁ ଉତ୍ସର୍ଗୀକୃତ ୨୨ ଶ୍ଲୋକର ଶାକ୍ତ ତାନ୍ତ୍ରିକ ସ୍ତୋତ୍ର; କାଳୀ-ମନ୍ତ୍ରର ୨୨ ବୀଜାକ୍ଷରର ସନ୍ଧ୍ୟା-ଭାଷାରେ ବ୍ୟାଖ୍ୟା."
    ta: "கர்ப்பூராதி ஸ்தோத்திரம்: தக்ஷிண-காளிக்கு அர்ப்பணிக்கப்பட்ட 22 ஶ்லோகங்களின் ஶாக்த தாந்த்ரிக ஸ்தோத்திரம்; காளி மந்திரத்தின் 22 பீஜாக்ஷரங்களின் ஸந்த்யா-பாஷை விளக்கம்."
    te: "కర్పూరాది స్తోత్రం: దక్షిణ-కాళికి అంకితమైన 22 శ్లోకాల శాక్త తాంత్రిక స్తోత్రం; కాళీ మంత్రంలోని 22 బీజాక్షరాల సంధ్యా-భాషా వ్యాఖ్యానం."
