    - lang: pa
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ਮ੍ਰਿਗ-ਨੈਣੀਆਂ ਦਾ ਸਮੂਹ ਪ੍ਰੇਮ ਨਾਲ ਕੰਬਦੀਆਂ ਉਸਦੇ ਪਿੱਛੇ ਚਲਦੀਆਂ ਹਨ; ਧਰਤੀ ਦਾ ਰਾਜਾ ਉਸਦੇ ਵੱਸ ਵਿੱਚ ਹੁੰਦਾ ਹੈ, ਅਤੇ ਉਹ ਆਪ ਕੁਬੇਰ (ਧਨ ਦੇਵਤੇ) ਦਾ ਪ੍ਰਤਿਨਿਧੀ ਹੁੰਦਾ ਹੈ; ਵੈਰੀ ਉਸਦੇ ਲਈ ਕੇਵਲ ਇੱਕ ਕੇਲ੍ਹਾ-ਖੇਲ (ਖੇਡ ਦੀ ਛਾਇਆ) ਅਤੇ ਜੇਲ੍ਹ ਜਿਹਾ ਜਾਪਦਾ ਹੈ — ਚਿਰਕਾਲ ਤੱਕ ਜੀਵਨ-ਮੁਕਤ, ਉਹ ਭਗਤ ਜਨਮ-ਜਨਮ ਪ੍ਰਭਾਵਸ਼ਾਲੀ ਰਹਿੰਦਾ ਹੈ।
