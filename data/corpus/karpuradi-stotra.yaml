    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Mother, Thou bringest forth the round of existence, Thou dost maintain it whole — earth and all — and at the hour of dissolution Thou dost withdraw it. Thus Thou art Creatrix, Lord of the three worlds, Consort of Śrī, and the Great Lord as well — Thou art all. How then shall I praise Thee?"
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে জননী, তুমিয়েই সংসাৰক প্ৰসৱ কৰা, তুমিয়েই পৃথিৱী আদি সকলোক পালন কৰা, আৰু প্ৰলয়কালত সমস্তকে সংহাৰ কৰা। সেয়ে তুমিয়েই ধাত্ৰী, তুমিয়েই ত্ৰিভুৱনপতি, তুমিয়েই শ্ৰীপতি, তুমিয়েই মহেশো — প্ৰায় সকলোৱেই তুমি। মই কেনেকৈ তোমাক স্তুতি কৰিম?
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে জননী! তুমিই সংসারকে প্রসব কর, তুমিই পালন কর, এবং প্রলয়কালে ক্ষিতি প্রভৃতি সমস্তকে সংহার কর। অতএব তুমিই ধাত্রী, তুমিই ত্রিভুবনপতি (ব্রহ্মা), তুমিই শ্রীপতি (বিষ্ণু), তুমিই মহেশ্বরও — প্রায়ত সকলই তুমি। তবে কিরূপে আমি তোমাকে স্তব করিব?
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે જનની! તું જ સંસારને જન્માવે છે, તું જ સમસ્ત પૃથ્વ્યાદિ સૃષ્ટિનું પાલન કરે છે, અને પ્રલયકાળે તેને જ સંકેલે પણ છે. તેથી તું જ ધાત્રી, તું જ ત્રિભુવનપતિ (બ્રહ્મા), તું જ શ્રીપતિ (વિષ્ણુ), તું જ મહેશ — ખરેખર તું જ સકલ છે. તો હું તારી શી સ્તુતિ કરું?
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे जननी, तू ही संसार को जन्म देती है, उसका पालन करती है, और प्रलय-काल में पृथ्वी आदि समस्त जगत् को अपने में समेट लेती है। अतः तू ही धात्री (सृष्टिकर्त्री ब्रह्मा), तू ही त्रिभुवनपति (विष्णु), तू ही श्रीपति, और तू ही महेश है — प्रायः तू ही सब कुछ है। मैं तेरी क्या स्तुति करूँ?
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
