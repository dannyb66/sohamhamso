  description: |
    Karpūrādi Stotra ("Hymn beginning with the syllable Karpūra") — a
    Śākta Tantric hymn to the Goddess Dakṣiṇa-Kālī, structured around
    her twenty-two-syllable mantra. Each verse describes the esoteric
    realisation of a single syllable, encoded in a deliberately
    obscure "twilight language" (sandhyā-bhāṣā). Famously translated
    and published by John Woodroffe (Arthur Avalon) in 1922 as "Hymn
    to Kali", which serves as our reference anchor (now public domain).
    Twenty-two verses plus a closing colophon attributing the hymn to
    Mahā-Kālī herself.

chapters:
- chapter: 1
  title_sa: कर्पूरादिस्तोत्रम्
  title_iast: Karpūrādi-stotram
  title_en: Karpūrādi Stotra
  verses:
  - verse: 1
    devanagari: |
      कर्पूरं मध्यमान्त्यस्वरपरिरहितं सेन्दुवामाक्षियुक्तं
      बीजं ते मातरेतत्त्रिपुरहरवधु त्रिःकृतं ये जपन्ति ।
      तेषां गद्यानि पद्यानि च मुखकुहरादुल्लसन्त्येव वाचः
      स्वच्छन्दं ध्वान्तधाराधररुचिरुचिरे सर्वसिद्धिं गतानाम् ॥ १॥
    iast: "karpūraṃ madhyamāntyasvaraparirahitaṃ sendu-vāmākṣi-yuktaṃ / bījaṃ te mātar etat tripura-hara-vadhu triḥkṛtaṃ ye japanti / teṣāṃ gadyāni padyāni ca mukha-kuhārād ullasanty eva vācaḥ / svacchandaṃ dhvānta-dhārā-dhara-ruci-rucire sarva-siddhiṃ gatānām // 1 //"
    meter: śārdūlavikrīḍita
    word_glosses:
    - word: कर्पूरम्
      iast: karpūram
      gloss_en: camphor (i.e. the syllable Kraṃ — first syllable of the Kālī mantra)
      morph: nom. sg. n.
    - word: बीजम्
      iast: bījam
      gloss_en: seed-syllable (of the mantra)
      morph: nom. sg. n.
    - word: मातर्
      iast: mātar
      gloss_en: O Mother
      morph: voc. sg. f.
    - word: त्रिपुरहरवधु
      iast: tripura-hara-vadhu
      gloss_en: O Spouse of the Slayer of the three cities (Śiva)
      morph: voc. sg. f. cpd.
    - word: त्रिःकृतम्
      iast: triḥ-kṛtam
      gloss_en: repeated thrice
      morph: acc. sg. n.
    - word: जपन्ति
      iast: japanti
      gloss_en: they recite (silently)
      morph: 3pl. pres. √jap
    - word: सर्वसिद्धिम्
      iast: sarva-siddhim
      gloss_en: every attainment, perfect accomplishment
      morph: acc. sg. f. cpd.
    - word: ध्वान्तधाराधर
      iast: dhvānta-dhārā-dhara
      gloss_en: dark as a rain-laden cloud
      morph: epithet cpd.
    translations:
    - lang: en
      translator: "sohamhamso (after Woodroffe 1922)"
      license: PD
      text: "O Mother and Spouse of the Slayer of the three cities — they who recite, three times repeated, this Thy seed-syllable (Karpūra, without its middle and final vowels, joined with the half-moon and the left eye), upon them, O Thou whose beauty is that of a rain-cloud at twilight, prose and verse flow at will from the cavern of the mouth, and all perfections come to them."
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে মাতৃ, হে ত্ৰিপুৰাৰিৰ পত্নী! কৰ্পূৰ (অৰ্থাৎ ‘ক’) — যাৰ মাজৰ আৰু অন্তিম স্বৰ লোপ পাইছে, যিটো অৰ্ধচন্দ্ৰ আৰু বাম চকুৰে সংযুক্ত — এই তোমাৰ বীজমন্ত্ৰ যিসকলে তিনিবাৰ জপ কৰে, হে সন্ধ্যাকালৰ ঘন মেঘৰ দৰে শ্যামল কান্তিৰে শোভিতা, তেওঁলোকৰ মুখগহ্ৱৰৰ পৰা গদ্য আৰু পদ্য স্বচ্ছন্দে নিৰ্গত হয়, আৰু তেওঁলোকে সকলো সিদ্ধি লাভ কৰে।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: হে মাতা, হে ত্রিপুরহরের বধূ! যাঁহার বীজমন্ত্র (কর্পূর — মধ্যম ও অন্ত্যস্বরহীন, অর্ধচন্দ্র ও বামনেত্র-যুক্ত, অর্থাৎ ‘ক্রীং’) তোমার ভক্তগণ ত্রিবার জপ করেন, হে মেঘবরণের ন্যায় শ্যাম-রুচিরে, তাঁহাদের মুখগহ্বর হইতে গদ্য ও পদ্য — সকল বাক্য স্বচ্ছন্দে উদ্ভাসিত হয় এবং তাঁহারা সর্বসিদ্ধি লাভ করেন।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: હે માતા, હે ત્રિપુરઘ્ન શિવની વધૂ! તારું આ બીજ — કર્પૂર (કર્પૂરમ્) જેમાંથી મધ્ય અને અંત્ય સ્વર કાઢી નાખેલા છે અને જે ઇન્દુ (અર્ધચંદ્ર) તથા વામ-અક્ષિ (ડાબી આંખ — બિંદુ) સહિત છે — એને ત્રણ વાર જે જપે છે, હે સંધ્યાકાળના વર્ષાધર મેઘ સમાન મનોહર કાંતિવાળી! તે સર્વસિદ્ધિને પામેલા જનોના મુખરૂપી ગુફામાંથી ગદ્ય અને પદ્યરૂપી વાણી સ્વચ્છંદે ઊછળે જ છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे माता, हे त्रिपुरारि शिव की वधू! जो साधक तेरे इस बीज-मन्त्र को — कर्पूर (क्रं) से मध्य और अन्त्य स्वरों को हटाकर, अर्धचन्द्र और वाम-नेत्र (बिन्दु एवं ई) से युक्त करके — तीन बार जपते हैं, हे साँझ के मेघ-समान श्यामल कान्ति वाली, उनके मुख-कुहर से गद्य और पद्य रूप में वाणी स्वच्छन्द बहती है और वे सब सिद्धियाँ प्राप्त कर लेते हैं।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ಓ ತಾಯಿ, ಓ ತ್ರಿಪುರಹರನ ಪತ್ನಿ — ಮಧ್ಯ ಮತ್ತು ಅಂತ್ಯ ಸ್ವರಗಳಿಲ್ಲದ ಕರ್ಪೂರವನ್ನು (ಕ್ರ್) ಚಂದ್ರಕಲೆ ಮತ್ತು ಎಡಗಣ್ಣಿನೊಂದಿಗೆ ಸೇರಿಸಿದ ನಿನ್ನ ಈ ಬೀಜಾಕ್ಷರವನ್ನು ಮೂರು ಬಾರಿ ಯಾರು ಜಪಿಸುತ್ತಾರೋ, ಓ ಮುಸ್ಸಂಜೆಯ ಮೋಡದಂತೆ ಶ್ಯಾಮಲ ಕಾಂತಿಯವಳೇ, ಅವರ ಬಾಯಿಯ ಗುಹೆಯಿಂದ ಗದ್ಯಪದ್ಯ ರೂಪದ ವಾಣಿಯು ಸ್ವಚ್ಛಂದವಾಗಿ ಉಲ್ಲಸಿಸುತ್ತದೆ; ಅವರಿಗೆ ಸಕಲ ಸಿದ್ಧಿಗಳೂ ಪ್ರಾಪ್ತವಾಗುತ್ತವೆ.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: അമ്മേ, ത്രിപുരാന്തകന്റെ പത്നീ — കർപ്പൂരം എന്ന അക്ഷരത്തിന്റെ മധ്യ-അന്ത്യ സ്വരങ്ങൾ നീക്കി, ചന്ദ്രബിന്ദുവും ഇടത്തേക്കണ്ണും (ഈ-കാരം) ചേർത്തുണ്ടാകുന്ന അവിടത്തെ ഈ ബീജാക്ഷരം മൂന്നുവട്ടം ജപിക്കുന്നവർക്ക്, ഹേ മേഘശ്യാമലവർണശോഭിതേ, അവരുടെ വായ്‌ഗഹ്വരത്തിൽനിന്ന് ഗദ്യപദ്യങ്ങൾ സ്വച്ഛന്ദമായി ഉദിച്ചുവരുന്നു; അവർ സർവസിദ്ധിയും പ്രാപിക്കുന്നു.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: हे माते, हे त्रिपुरारिवधू! कर्पूर (हा शब्द) ज्याच्या मधल्या व अंत्य स्वरांविना, अर्धचंद्र व डाव्या डोळ्याने (बिंदूने) युक्त असा तुझा बीजमंत्र — जे लोक तीन वेळा जपतात, त्यांच्या मुखरूपी गुहेतून गद्य व पद्य वाणी स्वच्छंदपणे प्रवाहित होते; हे संध्याकालीन मेघासारख्या सुंदर वर्णाच्या देवी, त्यांना सर्व सिद्धी प्राप्त होतात.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: or
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ହେ ମାତା, ହେ ତ୍ରିପୁରହର (ଶିବ)ଙ୍କ ପତ୍ନୀ, ଯେଉଁମାନେ କର୍ପୂର (କ୍ର)ର ମଧ୍ୟ ଓ ଅନ୍ତ୍ୟ ସ୍ୱର ବିହୀନ, ଚନ୍ଦ୍ରବିନ୍ଦୁ ଓ ବାମ ନେତ୍ର (ଈ-କାର) ସହିତ ଯୁକ୍ତ ତୁମ୍ଭର ଏହି ବୀଜମନ୍ତ୍ର ତିନି ଥର ଜପ କରନ୍ତି — ହେ ସନ୍ଧ୍ୟାକାଳର ମେଘ ସଦୃଶ ଶ୍ୟାମଳ ସୌନ୍ଦର୍ଯ୍ୟବତୀ, ସେମାନଙ୍କ ମୁଖକୁହର ରୁ ଗଦ୍ୟ ଓ ପଦ୍ୟ ସ୍ୱଚ୍ଛନ୍ଦ ରୂପେ ପ୍ରବାହିତ ହୁଏ, ଏବଂ ସେମାନେ ସର୍ବ ସିଦ୍ଧି ପ୍ରାପ୍ତ କରନ୍ତି ।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: pa
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ਹੇ ਮਾਤਾ, ਹੇ ਤ੍ਰਿਪੁਰ-ਨਾਸ਼ਕ (ਸ਼ਿਵ) ਦੀ ਪਤਨੀ! ਜੋ ਲੋਕ ਤੇਰੇ ਇਸ ਬੀਜ-ਮੰਤ੍ਰ ਨੂੰ — ਕਰਪੂਰ ਜੋ ਆਪਣੇ ਮੱਧ ਅਤੇ ਅੰਤਿਮ ਸਵਰਾਂ ਤੋਂ ਰਹਿਤ ਹੈ, ਅਰਧ-ਚੰਦ੍ਰ ਅਤੇ ਖੱਬੀ ਅੱਖ ਨਾਲ ਯੁਕਤ — ਤਿੰਨ ਵਾਰ ਜਪਦੇ ਹਨ, ਹੇ ਮੇਘ-ਘਟਾ ਵਾਂਗ ਸੋਹਣੀ ਦੇਵੀ! ਉਹਨਾਂ ਦੇ ਮੁੱਖ-ਗੁਫਾ ਵਿੱਚੋਂ ਗਦ੍ਯ ਅਤੇ ਪਦ੍ਯ ਰੂਪੀ ਬਾਣੀ ਆਪਣੇ-ਆਪ ਵਹਿੰਦੀ ਹੈ, ਅਤੇ ਉਹ ਸਾਰੀਆਂ ਸਿੱਧੀਆਂ ਪ੍ਰਾਪਤ ਕਰਦੇ ਹਨ।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: ta
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: தாயே, த்ரிபுரஹரனின் (சிவனின்) மனைவியே! நடு மற்றும் இறுதி உயிரெழுத்துக்கள் நீக்கப்பெற்று, பிறைச்சந்திரனோடும் இடதுகண்ணோடும் கூடிய உனது இந்த 'கர்ப்பூர' பீஜத்தை மூன்று முறை யார் ஜபிக்கிறார்களோ, இருண்ட மழைமேகத்தின் காந்தியோடு ஒளிரும் தாயே, அவர்களது வாயின் குகையிலிருந்து உரைநடையும் செய்யுளும் தாமே வெளிப்பட்டுப் பெருகுகின்றன; அவர்கள் அனைத்துச் சித்திகளையும் அடைகின்றனர்.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: te
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: ఓ తల్లీ, త్రిపురాంతక శివుని ప్రియురాలా! కర్పూరం (అనే పదము) నుండి దాని మధ్య మరియు అంత్య స్వరాలను తొలగించి, చంద్రబిందువుతోనూ వామనేత్రముతోనూ కూడిన నీ బీజాక్షరమును (క్రీం) ఎవరు మూడుసార్లు జపిస్తారో — ఓ మేఘశ్యామల సుందరీ, సర్వసిద్ధులను పొందిన వారి ముఖగహ్వరమునుండి గద్యపద్యవాక్కులు స్వచ్ఛందముగా వెల్లివిరుస్తాయి.
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
  - verse: 2
    devanagari: |
      ईशानः सेन्दुवामश्रवणपरिगतो बीजमन्यन्महेशि
      द्वन्द्वं ते मन्दचेता यदि जपति जनो वारमेकं कदाचित् ।
      जित्वा वाचामधीशं धनमपि च चिरं मोहयन्नम्बुजाक्षीवृन्दं
      चन्द्रार्धचूडे प्रभवति स महाघोरबालावतंसे ॥ २॥
    iast: "īśānaḥ sendu-vāma-śravaṇa-parigato bījam anyan maheśi / dvandvaṃ te manda-cetā yadi japati jano vāram ekaṃ kadācit / jitvā vācām adhīśaṃ dhanam api ca ciraṃ mohayann ambujākṣī-vṛndaṃ / candrārdha-cūḍe prabhavati sa mahāghora-bālāvataṃse // 2 //"
