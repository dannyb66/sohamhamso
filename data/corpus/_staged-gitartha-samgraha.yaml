seo:
  descriptions:
    en: "Gītārthasaṃgraha: Abhinavagupta's commentary on the Bhagavad Gītā (Kashmirian recension), a non-dual Śaiva reading of the Gītā across 18 adhyāyas."
    hi: "गीतार्थसंग्रह: भगवद्गीता (काश्मीरी पाठ) पर अभिनवगुप्त की टीका; १८ अध्यायों में गीता का अद्वैत शैव अर्थ-निरूपण।"
    mr: "गीतार्थसंग्रह: भगवद्गीतेवरील (काश्मीरी पाठ) अभिनवगुप्तांची टीका; १८ अध्यायांत गीतेचे अद्वैत शैव अर्थनिरूपण."
    bn: "গীতার্থসংগ্রহ: ভগবদ্গীতার (কাশ্মীরী পাঠ) উপর অভিনবগুপ্তের টীকা; ১৮ অধ্যায়ে গীতার অদ্বৈত শৈব অর্থব্যাখ্যা."
    as: "গীতাৰ্থসংগ্ৰহ: ভগৱদ্গীতাৰ (কাশ্মীৰী পাঠ) ওপৰত অভিনৱগুপ্তৰ টীকা; ১৮ অধ্যায়ত গীতাৰ অদ্বৈত শৈৱ অৰ্থব্যাখ্যা."
    gu: "ગીતાર્થસંગ્રહ: ભગવદ્ગીતા (કાશ્મીરી પાઠ) પર અભિનવગુપ્તની ટીકા; ૧૮ અધ્યાયોમાં ગીતાનું અદ્વૈત શૈવ અર્થઘટન."
    pa: "ਗੀਤਾਰ੍ਥਸੰਗ੍ਰਹ: ਭਗਵਦਗੀਤਾ (ਕਾਸ਼ਮੀਰੀ ਪਾਠ) ਉੱਤੇ ਅਭਿਨਵਗੁਪਤ ਦੀ ਟੀਕਾ; ੧੮ ਅਧਿਆਵਾਂ ਵਿੱਚ ਗੀਤਾ ਦੀ ਅਦਵੈਤ ਸ਼ੈਵ ਵਿਆਖਿਆ।"
    kn: "ಗೀತಾರ್ಥಸಂಗ್ರಹ: ಭಗವದ್ಗೀತೆಯ (ಕಾಶ್ಮೀರ ಪಾಠ) ಮೇಲೆ ಅಭಿನವಗುಪ್ತರ ವ್ಯಾಖ್ಯಾನ; ೧೮ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಗೀತೆಯ ಅದ್ವೈತ ಶೈವ ಅರ್ಥವಿವರಣೆ."
    ml: "ഗീതാർഥസംഗ്രഹം: ഭഗവദ്ഗീതയുടെ (കാശ്മീര പാഠം) മേലുള്ള അഭിനവഗുപ്തന്റെ വ്യാഖ്യാനം; 18 അധ്യായങ്ങളിൽ ഗീതയുടെ അദ്വൈത ശൈവ വ്യാഖ്യാനം."
    or: "ଗୀତାର୍ଥସଂଗ୍ରହ: ଭଗବଦ୍‌ଗୀତା (କାଶ୍ମୀରୀ ପାଠ) ଉପରେ ଅଭିନବଗୁପ୍ତଙ୍କ ଟୀକା; ୧୮ ଅଧ୍ୟାୟରେ ଗୀତାର ଅଦ୍ୱୈତ ଶୈବ ଅର୍ଥବ୍ୟାଖ୍ୟା."
    ta: "கீதார்த்தசங்க்ரஹ: பகவத் கீதையின் (காஷ்மீர பாடம்) மீது அபிநவகுப்தரின் உரை; 18 அத்தியாயங்களில் கீதையின் அத்வைத சைவ விளக்கம்."
    te: "గీతార్థసంగ్రహ: భగవద్గీత (కశ్మీర పాఠం) పై అభినవగుప్తుని వ్యాఖ్యానం; 18 అధ్యాయాలలో గీత యొక్క అద్వైత శైవ అర్థవివరణ."
