    iast: |-
      yajñāyetyuktam-tatsvarūpaṃ sāmānyaṃ tāvadāha
      brahmārpaṇaṃ brahmahavirbrahmāgnau brahmaṇā hutam | brahmaiva tena gantavyaṃ brahmakarmasamādhinā || 4-24 ||
      brahmaṇyarpaṇaṃ-tata eva pravṛttasya punastatraivānupraveśanaṃ yasya tat | brahma-samagraṃ viśvātmakaṃ yadetat havistat | brahmaṇi-paramabodhe praśānte'gnau | brahmaṇā-yenakenacitkarmaṇā hutaṃ-taddīptyabhivṛddhaye samarpitam itīdṛśaṃ brahmakarmaiva samādhiryasya yoginastena brahmaiva gantavyaṃ jñeyaṃ nānyatkiṃcidanyābhāvāt | yadivā tadarthena yadarthākṣepādevaṃsaṃbandhaḥ-yatkhalu brahmasvarūpeṇa yajamānena brahmāgnau brahmahavirhutaṃ brahmaṇi brahmasvabhāvadevatoddeśenārpaṇaṃ yasya tadevaṃ bhūtaṃ yadbrahmakarma tadeva samādhirātmasvarūpalābhopāyatvāt tena-brahmakarmasamādhinā nānyatphalamavāpyate apitu brahmaiveti ye yathā māṃ prapadyante-iti hi nirvāhitam | mitasvarūpī-kṛtamadātmakayajñasvabhāvā iti tādṛśaphalabhāginaḥ-ityuktam | aparimitaparipūrṇamadātmakayajñasvarūpavedinastu kathaṃ parimitaphalalavalāmpaṭyabhāgino bhaveyuriti tātparyam | ityanena | ślokena vakṣyamāṇaiśca ślokeḥ paramarahasyamupanibaddham | taccāsmābhirmitabuddhibhirapi yathābuddhi yathāgurvāmnāyaṃ ca vivṛtam | mukhasaṃpradāyakramamantareṇa naitat nabhaścitramiva cittamupārohatīti na vayamupālambhanīyāḥ | atra haviṣo'gneḥ karaṇānāṃ ca srugādīnāṃ kriyāyāśca brahmaviśeṣaṇatvamiti kaiściduktaṃ tadupekṣyameva-teṣāṃ rahasyasaṃpradāyakrame'kṣuṇatvāt || 24 ||
  - verse: 25
    devanagari: |-
      दैवमेवापरे यज्ञं योगिनः पर्युपासते । ब्रह्माग्नावपरे यज्ञं यज्ञेनैवोपजुह्वति ॥ ४-२५ ॥
      अपरे देवानि-क्रीडाशीलानि इन्द्रियाणि आश्रित्य यः स्थितो यज्ञो-निजनिजविषयगृहणलक्षणः तमेव परित उपासते-आमूलाद्विमृशन्त स्वात्मलाभं लभन्ते । अत एव ते योगिनः-सर्वावस्थासु सततमेव योगयुक्तत्वात् । नित्ययोगे ह्ययमत्र मत्वर्थीयः । एनमेव च विषयगृहणात्मकं यज्ञं यज्ञेनैव-तेनैव लक्षणेन अपरे-पूरयितुमशक्ये ब्रह्माग्नौ जुह्वति-इति कैश्चिद्याख्यातम् । मुनेस्तु पौर्वापर्याविरुद्धत्वाद्योऽर्थो हृदि स्थितस्तं प्रकाशयामः-केचिद्योगयुक्ता सन्तो दैवं-नानारूपेन्द्रादिदेवतोद्देशेनैव बाह्यद्रव्यमयं यज्ञमुपाचरन्ति । तं च क्रियमाणमेव यज्ञं कर्तव्यमिदमित्येव बुद्धा फलानपेक्षया अपरे-दुष्पूरे ब्रह्माग्नावर्पयन्ति-इति द्रव्ययज्ञा अपि परं ब्रह्म यान्ति । यतो वक्ष्यते सर्वेऽप्येते यज्ञविदः-इति । श्रुतिरपि यज्ञेन यज्ञमयजन्त देवाः-इति ॥ २५ ॥
