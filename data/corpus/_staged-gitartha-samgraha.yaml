- chapter: 16
  title_sa: षोडशोऽध्यायः
  title_iast: "ṣoḍaśo'dhyāyaḥ"
  title_en: "Sixteenth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      एतद्बुद्ध्वेत्युक्तम् । बोधश्च नाम श्रुतिमयज्ञानानन्तरं इदमित्थम्-इत्येवंभूतयुक्तिचिन्ताभावनामयज्ञानोदयेन विचारविमर्शपरामर्शादिरूपेण विजातीयन्यक्कारविरहिततद्भावनामयस्वभ्यस्ताकारविज्ञानलाब् हे सति भवति । यद्वक्ष्यते-
      विमृश्यैवमशेषेण यथेच्छसि तथा कुरु ॥ (१८ अ० । ६३ श्लो०)
      इति । तत्र श्रुतिमये ज्ञाने गुरुशास्त्रे एव प्राधान्येन प्रभवतः । युक्तिचिन्ताभावनामये तु विमर्शक्षमता असाधारणा शिष्यगुणसंपत् प्रधानभूता । अतोऽर्जुनस्यास्त्येवासौ । इत्यभिप्रायेण वक्ष्यमाणं विमृश्यैवम्-इति वाक्यं सविषयं कर्तुं परिकरबन्धयोजनाभिप्रायेणाह भगवान्गुरुः-
      श्रीभगवानुवाच
      अभयं सत्त्वसंशुद्धिर्ज्ञानयोगव्यवस्थितिः । दानं दमश्च यज्ञश्च स्वाध्यायस्तप आर्जवम् ॥ १६-१ ॥
    slp1: |-
      etadbudDvetyuktam . boDaSca nAma SrutimayajYAnAnantaraM idamitTam-ityevaMBUtayukticintABAvanAmayajYAnodayena vicAravimarSaparAmarSAdirUpeRa vijAtIyanyakkAravirahitatadBAvanAmayasvaByastAkAravijYAnalAb he sati Bavati . yadvakzyate-
      vimfSyEvamaSezeRa yaTecCasi taTA kuru .. (18 a0 . 63 Slo0)
      iti . tatra Srutimaye jYAne guruSAstre eva prADAnyena praBavataH . yukticintABAvanAmaye tu vimarSakzamatA asADAraRA SizyaguRasaMpat praDAnaBUtA . ato'rjunasyAstyevAsO . ityaBiprAyeRa vakzyamARaM vimfSyEvam-iti vAkyaM savizayaM kartuM parikarabanDayojanABiprAyeRAha BagavAnguruH-
      SrIBagavAnuvAca
      aBayaM sattvasaMSudDirjYAnayogavyavasTitiH . dAnaM damaSca yajYaSca svADyAyastapa Arjavam .. 16-1 ..
    iast: |-
      etadbuddhvetyuktam | bodhaśca nāma śrutimayajñānānantaraṃ idamittham-ityevaṃbhūtayukticintābhāvanāmayajñānodayena vicāravimarśaparāmarśādirūpeṇa vijātīyanyakkāravirahitatadbhāvanāmayasvabhyastākāravijñānalāb he sati bhavati | yadvakṣyate-
      vimṛśyaivamaśeṣeṇa yathecchasi tathā kuru || (18 a0 | 63 ślo0)
      iti | tatra śrutimaye jñāne guruśāstre eva prādhānyena prabhavataḥ | yukticintābhāvanāmaye tu vimarśakṣamatā asādhāraṇā śiṣyaguṇasaṃpat pradhānabhūtā | ato'rjunasyāstyevāsau | ityabhiprāyeṇa vakṣyamāṇaṃ vimṛśyaivam-iti vākyaṃ saviṣayaṃ kartuṃ parikarabandhayojanābhiprāyeṇāha bhagavānguruḥ-
      śrībhagavānuvāca
      abhayaṃ sattvasaṃśuddhirjñānayogavyavasthitiḥ | dānaṃ damaśca yajñaśca svādhyāyastapa ārjavam || 16-1 ||
  - verse: 2
    devanagari: |-
      अहिंसा सत्यमक्रोधस्त्यागऽसक्तिरपैशुनम् । दया भूतेष्वलौल्यं च मार्दवं ह्रीरचापलम् ॥ १६-२ ॥
    slp1: |-
      ahiMsA satyamakroDastyAga'saktirapESunam . dayA BUtezvalOlyaM ca mArdavaM hrIracApalam .. 16-2 ..
    iast: |-
      ahiṃsā satyamakrodhastyāga'saktirapaiśunam | dayā bhūteṣvalaulyaṃ ca mārdavaṃ hrīracāpalam || 16-2 ||
  - verse: 3
    devanagari: |-
      तेजः क्षमा धृतिस्तुष्टिरद्रोहो नातिमानिता । भवन्ति सम्पदं दैवीमभिजातस्य भारत ॥ १६-३ ॥
    slp1: |-
      tejaH kzamA Dftistuzwiradroho nAtimAnitA . Bavanti sampadaM dEvImaBijAtasya BArata .. 16-3 ..
    iast: |-
      tejaḥ kṣamā dhṛtistuṣṭiradroho nātimānitā | bhavanti sampadaṃ daivīmabhijātasya bhārata || 16-3 ||
  - verse: 4
    devanagari: |-
      दम्भो दर्पोऽभिमानश्च क्रोधः पारुष्यमेव च । अज्ञानं चाभिजातस्य पार्थ सम्पदमासुरीम् ॥ १६-४ ॥
    slp1: |-
      damBo darpo'BimAnaSca kroDaH pAruzyameva ca . ajYAnaM cABijAtasya pArTa sampadamAsurIm .. 16-4 ..
    iast: |-
      dambho darpo'bhimānaśca krodhaḥ pāruṣyameva ca | ajñānaṃ cābhijātasya pārtha sampadamāsurīm || 16-4 ||
  - verse: 5
    devanagari: |-
      दैवी सम्पद्विमोक्षाय निबन्धायासुरी मता । मा शुचः सम्पदं दैवीमभिजातोऽसि पाण्डव ॥ १६-५ ॥
      आसुरभागसंनिविष्टा तामसी किलाविद्या । सा प्रवृद्धया दिव्यांशग्राहिण्या विद्यया बाध्यते इति वस्तुस्वभाव एषः । त्वं च विद्यात्मानं दिव्यमंशं सात्त्विकमभिप्रपन्नः । तस्मादान्तरीं मोहलक्षणामविद्यां विहाय वाह्याविद्यात्मशत्रुहननलक्षणं शास्त्रीयव्यापारम् अनुतिष्ठ-इत्यध्यायारम्भः । तथाहि । दिव्यांशस्येमानि चिह्नानि तानि स्फुटमेवाभिलक्ष्यन्ते दमः-इन्द्रियजयः । चापलं-पूर्वापरमविमृश्य यत्करणं तदभावोऽचापलम् । तेजः-आत्मन्युत्साहग्रहणेन मितत्वापाकरणम् । दैवी संपदेषा । सा च तव विमोक्षाय-कामनापरिहारात् । अतस्त्वं शोकं मा प्रापः । यथा-भ्रात्रादीन् हत्वा सुखं कथमश्नुवीय-इति । शिष्टं स्पष्टम् ॥ ५ ॥
    slp1: |-
      dEvI sampadvimokzAya nibanDAyAsurI matA . mA SucaH sampadaM dEvImaBijAto'si pARqava .. 16-5 ..
      AsuraBAgasaMnivizwA tAmasI kilAvidyA . sA pravfdDayA divyAMSagrAhiRyA vidyayA bADyate iti vastusvaBAva ezaH . tvaM ca vidyAtmAnaM divyamaMSaM sAttvikamaBiprapannaH . tasmAdAntarIM mohalakzaRAmavidyAM vihAya vAhyAvidyAtmaSatruhananalakzaRaM SAstrIyavyApAram anutizWa-ityaDyAyAramBaH . taTAhi . divyAMSasyemAni cihnAni tAni sPuwamevABilakzyante damaH-indriyajayaH . cApalaM-pUrvAparamavimfSya yatkaraRaM tadaBAvo'cApalam . tejaH-AtmanyutsAhagrahaRena mitatvApAkaraRam . dEvI saMpadezA . sA ca tava vimokzAya-kAmanAparihArAt . atastvaM SokaM mA prApaH . yaTA-BrAtrAdIn hatvA suKaM kaTamaSnuvIya-iti . SizwaM spazwam .. 5 ..
    iast: |-
      daivī sampadvimokṣāya nibandhāyāsurī matā | mā śucaḥ sampadaṃ daivīmabhijāto'si pāṇḍava || 16-5 ||
      āsurabhāgasaṃniviṣṭā tāmasī kilāvidyā | sā pravṛddhayā divyāṃśagrāhiṇyā vidyayā bādhyate iti vastusvabhāva eṣaḥ | tvaṃ ca vidyātmānaṃ divyamaṃśaṃ sāttvikamabhiprapannaḥ | tasmādāntarīṃ mohalakṣaṇāmavidyāṃ vihāya vāhyāvidyātmaśatruhananalakṣaṇaṃ śāstrīyavyāpāram anutiṣṭha-ityadhyāyārambhaḥ | tathāhi | divyāṃśasyemāni cihnāni tāni sphuṭamevābhilakṣyante damaḥ-indriyajayaḥ | cāpalaṃ-pūrvāparamavimṛśya yatkaraṇaṃ tadabhāvo'cāpalam | tejaḥ-ātmanyutsāhagrahaṇena mitatvāpākaraṇam | daivī saṃpadeṣā | sā ca tava vimokṣāya-kāmanāparihārāt | atastvaṃ śokaṃ mā prāpaḥ | yathā-bhrātrādīn hatvā sukhaṃ kathamaśnuvīya-iti | śiṣṭaṃ spaṣṭam || 5 ||
  - verse: 6
    devanagari: |-
      द्वौ भूतसर्गौ लोकेऽस्मिन् दैव आसुर एव च । दैवो विस्तरतः प्रोक्त आसुरं पार्थ मे शृणु ॥ १६-६ ॥
    slp1: |-
      dvO BUtasargO loke'smin dEva Asura eva ca . dEvo vistarataH prokta AsuraM pArTa me SfRu .. 16-6 ..
    iast: |-
      dvau bhūtasargau loke'smin daiva āsura eva ca | daivo vistarataḥ prokta āsuraṃ pārtha me śṛṇu || 16-6 ||
  - verse: 7
    devanagari: |-
      एषा दैवी संपदुक्ता अभयमित्यादिना । आसुरीमाह
      प्रवृत्तिं च निवृत्तिं च जना न विदुरासुराः । न शौचं नापि चाचारो न सत्यं तेषु विद्यते ॥ १६-७ ॥
      प्रवृत्तिः-कुत इदमुत्पन्नमिति । निवृत्तिः-क प्रलीयते इति ॥ ७ ॥
    slp1: |-
      ezA dEvI saMpaduktA aBayamityAdinA . AsurImAha
      pravfttiM ca nivfttiM ca janA na vidurAsurAH . na SOcaM nApi cAcAro na satyaM tezu vidyate .. 16-7 ..
      pravfttiH-kuta idamutpannamiti . nivfttiH-ka pralIyate iti .. 7 ..
    iast: |-
      eṣā daivī saṃpaduktā abhayamityādinā | āsurīmāha
      pravṛttiṃ ca nivṛttiṃ ca janā na vidurāsurāḥ | na śaucaṃ nāpi cācāro na satyaṃ teṣu vidyate || 16-7 ||
      pravṛttiḥ-kuta idamutpannamiti | nivṛttiḥ-ka pralīyate iti || 7 ||
  - verse: 8
    devanagari: |-
      असत्यमप्रतिष्ठं ते जगदाहुरनीश्वरम् । अपरस्परसम्भूतमकिंचत्कमहेतुकम् ॥ १६-८ ॥
      न किंचित् दृष्टादन्यत् कार्यं विद्यते यत्रेति-अकिंचित्कम् ॥ ८ ॥
    slp1: |-
      asatyamapratizWaM te jagadAhuranISvaram . aparasparasamBUtamakiMcatkamahetukam .. 16-8 ..
      na kiMcit dfzwAdanyat kAryaM vidyate yatreti-akiMcitkam .. 8 ..
    iast: |-
      asatyamapratiṣṭhaṃ te jagadāhuranīśvaram | aparasparasambhūtamakiṃcatkamahetukam || 16-8 ||
      na kiṃcit dṛṣṭādanyat kāryaṃ vidyate yatreti-akiṃcitkam || 8 ||
  - verse: 9
    devanagari: |-
      एतां दृष्टिमवष्टभ्य नष्टात्मानोऽल्पबुद्धयः । प्रभवन्त्युग्रकर्माणः क्षयाय जगतोऽशुभाः ॥ १६-९ ॥
    slp1: |-
      etAM dfzwimavazwaBya nazwAtmAno'lpabudDayaH . praBavantyugrakarmARaH kzayAya jagato'SuBAH .. 16-9 ..
    iast: |-
      etāṃ dṛṣṭimavaṣṭabhya naṣṭātmāno'lpabuddhayaḥ | prabhavantyugrakarmāṇaḥ kṣayāya jagato'śubhāḥ || 16-9 ||
  - verse: 10
    devanagari: |-
      काममाश्रित्य दुष्पूरं दम्भमानमदान्विताः । असद्ग्रहाश्ताः (-श्तिः) क्रूराः प्रचरन्त्यशुचिव्रताः ॥ १६-१० ॥
    slp1: |-
      kAmamASritya duzpUraM damBamAnamadAnvitAH . asadgrahAStAH (-StiH) krUrAH pracarantyaSucivratAH .. 16-10 ..
    iast: |-
      kāmamāśritya duṣpūraṃ dambhamānamadānvitāḥ | asadgrahāśtāḥ (-śtiḥ) krūrāḥ pracarantyaśucivratāḥ || 16-10 ||
  - verse: 11
    devanagari: |-
      चिन्तामपरिमेयां च प्रलयान्तामुपाश्रिताः । कामोपभोगपरमा एतावदिति निश्चिताः ॥ १६-११ ॥
    slp1: |-
      cintAmaparimeyAM ca pralayAntAmupASritAH . kAmopaBogaparamA etAvaditi niScitAH .. 16-11 ..
    iast: |-
      cintāmaparimeyāṃ ca pralayāntāmupāśritāḥ | kāmopabhogaparamā etāvaditi niścitāḥ || 16-11 ||
  - verse: 12
    devanagari: |-
      आशापाशशतैर्बद्धाः कामक्रोधपरायणाः । ईहन्ते कामभोगार्थमन्यायेनार्थसञ्चयान् ॥ १६-१२ ॥
      चिन्ता तेषां प्रलयान्ता-अविरतं संसृतिप्रलयाव्युपरमात् । एतावदिति-कामोपभोग एव परं कृत्यं तन्नाशाच्च परं क्रोधः । अत एवाह कामक्रोधपरायणाः-इति ॥ १२ ॥
    slp1: |-
      ASApASaSatErbadDAH kAmakroDaparAyaRAH . Ihante kAmaBogArTamanyAyenArTasaYcayAn .. 16-12 ..
      cintA tezAM pralayAntA-avirataM saMsftipralayAvyuparamAt . etAvaditi-kAmopaBoga eva paraM kftyaM tannASAcca paraM kroDaH . ata evAha kAmakroDaparAyaRAH-iti .. 12 ..
    iast: |-
      āśāpāśaśatairbaddhāḥ kāmakrodhaparāyaṇāḥ | īhante kāmabhogārthamanyāyenārthasañcayān || 16-12 ||
      cintā teṣāṃ pralayāntā-avirataṃ saṃsṛtipralayāvyuparamāt | etāvaditi-kāmopabhoga eva paraṃ kṛtyaṃ tannāśācca paraṃ krodhaḥ | ata evāha kāmakrodhaparāyaṇāḥ-iti || 12 ||
  - verse: 13
    devanagari: |-
      इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम् । इदमस्तीदमपि मे भविष्यति पुनर्धनम् ॥ १६-१३ ॥
    slp1: |-
      idamadya mayA labDamimaM prApsye manoraTam . idamastIdamapi me Bavizyati punarDanam .. 16-13 ..
    iast: |-
      idamadya mayā labdhamimaṃ prāpsye manoratham | idamastīdamapi me bhaviṣyati punardhanam || 16-13 ||
  - verse: 14
    devanagari: |-
      असौ मया हतः शत्रुर्हनिष्ये चापरानपि । ईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान् सुखी ॥ १६-१४ ॥
    slp1: |-
      asO mayA hataH Satrurhanizye cAparAnapi . ISvaro'hamahaM BogI sidDo'haM balavAn suKI .. 16-14 ..
    iast: |-
      asau mayā hataḥ śatrurhaniṣye cāparānapi | īśvaro'hamahaṃ bhogī siddho'haṃ balavān sukhī || 16-14 ||
  - verse: 15
    devanagari: |-
      आढ्योऽभिजनवानस्मि कोऽन्योऽस्ति सदृशो मया । यक्ष्ये दास्यामि मोदिष्ये इत्यज्ञानविमोहिताः ॥ १६-१५ ॥
    slp1: |-
      AQyo'BijanavAnasmi ko'nyo'sti sadfSo mayA . yakzye dAsyAmi modizye ityajYAnavimohitAH .. 16-15 ..
    iast: |-
      āḍhyo'bhijanavānasmi ko'nyo'sti sadṛśo mayā | yakṣye dāsyāmi modiṣye ityajñānavimohitāḥ || 16-15 ||
  - verse: 16
    devanagari: |-
      अनेकचित्ता विभ्रान्ता मोहस्यैव वशं गताः । प्रसक्ताः कामभोगेषु पतन्ति निरयेऽशुचौ ॥ १६-१६ ॥
      अनेकचित्ता इति-निश्चयाभावात् । अशुचौ निरये-अवीच्यादौ जन्ममरणसन्ताने च ॥ १६ ॥
    slp1: |-
      anekacittA viBrAntA mohasyEva vaSaM gatAH . prasaktAH kAmaBogezu patanti niraye'SucO .. 16-16 ..
      anekacittA iti-niScayABAvAt . aSucO niraye-avIcyAdO janmamaraRasantAne ca .. 16 ..
    iast: |-
      anekacittā vibhrāntā mohasyaiva vaśaṃ gatāḥ | prasaktāḥ kāmabhogeṣu patanti niraye'śucau || 16-16 ||
      anekacittā iti-niścayābhāvāt | aśucau niraye-avīcyādau janmamaraṇasantāne ca || 16 ||
  - verse: 17
    devanagari: |-
      आत्मसम्भाविताः स्तब्धा धनमानमदान्विताः । यजन्ते नामयज्ञैस्ते दम्भेनाविधपूर्वकम् ॥ १६-१७ ॥
    slp1: |-
      AtmasamBAvitAH stabDA DanamAnamadAnvitAH . yajante nAmayajYEste damBenAviDapUrvakam .. 16-17 ..
    iast: |-
      ātmasambhāvitāḥ stabdhā dhanamānamadānvitāḥ | yajante nāmayajñaiste dambhenāvidhapūrvakam || 16-17 ||
  - verse: 18
    devanagari: |-
      अहङ्कारं बलं दर्पं कामं क्रोधं च संश्रिताः । मामात्मपरदेहेषु प्रद्विषन्तोऽभ्यसूयकाः ॥ १६-१८ ॥
      यज्ञैर्यजन्ते नाम-निष्फलमित्यर्थः । क्रोधेन हि सर्वं नश्यतीत्यर्थः । यद्वा । नामयज्ञैः-संज्ञामात्रेणैव ये यज्ञास्तैः । अथवा । नामार्थं-प्रसिद्ध्यर्थं ये यज्ञाः येन यज्ञयाज्ययम्-इति व्यपदेशो जायते । ते दम्भपूर्वका एव नतु फलन्ति । क्रोधादिरूषितत्वादेव लोकान्द्विषन्तो मामेव द्विषन्ति । अहं वासुदेवो हि सर्वावासः ॥ १८ ॥
    slp1: |-
      ahaNkAraM balaM darpaM kAmaM kroDaM ca saMSritAH . mAmAtmaparadehezu pradvizanto'ByasUyakAH .. 16-18 ..
      yajYEryajante nAma-nizPalamityarTaH . kroDena hi sarvaM naSyatItyarTaH . yadvA . nAmayajYEH-saMjYAmAtreREva ye yajYAstEH . aTavA . nAmArTaM-prasidDyarTaM ye yajYAH yena yajYayAjyayam-iti vyapadeSo jAyate . te damBapUrvakA eva natu Palanti . kroDAdirUzitatvAdeva lokAndvizanto mAmeva dvizanti . ahaM vAsudevo hi sarvAvAsaH .. 18 ..
    iast: |-
      ahaṅkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ ca saṃśritāḥ | māmātmaparadeheṣu pradviṣanto'bhyasūyakāḥ || 16-18 ||
      yajñairyajante nāma-niṣphalamityarthaḥ | krodhena hi sarvaṃ naśyatītyarthaḥ | yadvā | nāmayajñaiḥ-saṃjñāmātreṇaiva ye yajñāstaiḥ | athavā | nāmārthaṃ-prasiddhyarthaṃ ye yajñāḥ yena yajñayājyayam-iti vyapadeśo jāyate | te dambhapūrvakā eva natu phalanti | krodhādirūṣitatvādeva lokāndviṣanto māmeva dviṣanti | ahaṃ vāsudevo hi sarvāvāsaḥ || 18 ||
  - verse: 19
    devanagari: |-
      तानहं द्विषतः क्रूरान्संसारेषु नराधमान् । क्षिपाम्यजस्रमशुभास्वासुरीष्वेव योनिषु ॥ १६-१९ ॥
    slp1: |-
      tAnahaM dvizataH krUrAnsaMsArezu narADamAn . kzipAmyajasramaSuBAsvAsurIzveva yonizu .. 16-19 ..
    iast: |-
      tānahaṃ dviṣataḥ krūrānsaṃsāreṣu narādhamān | kṣipāmyajasramaśubhāsvāsurīṣveva yoniṣu || 16-19 ||
  - verse: 20
    devanagari: |-
      आसुरीं योनिमापन्ना मूढा जन्मनि जन्मनि । मामप्राप्यैव कौन्तेय ततो यान्त्यधमां गतिम् ॥ १६-२० ॥
      आत्मनि च द्वेषवन्तः आत्मनो ह्यहितं निरयपातहेतुमाचरन्ति । तांश्चाहं आसुरीष्वेव योनिषु क्षिपामि ॥ २० ॥
    slp1: |-
      AsurIM yonimApannA mUQA janmani janmani . mAmaprApyEva kOnteya tato yAntyaDamAM gatim .. 16-20 ..
      Atmani ca dvezavantaH Atmano hyahitaM nirayapAtahetumAcaranti . tAMScAhaM AsurIzveva yonizu kzipAmi .. 20 ..
    iast: |-
      āsurīṃ yonimāpannā mūḍhā janmani janmani | māmaprāpyaiva kaunteya tato yāntyadhamāṃ gatim || 16-20 ||
      ātmani ca dveṣavantaḥ ātmano hyahitaṃ nirayapātahetumācaranti | tāṃścāhaṃ āsurīṣveva yoniṣu kṣipāmi || 20 ||
  - verse: 21
    devanagari: |-
      त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः । कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत् ॥ १६-२१ ॥
      यतः कामादिकं त्रयं नरकस्यैव द्वारम् तस्मादेतत्त्यजेत् ॥ २१ ॥
    slp1: |-
      triviDaM narakasyedaM dvAraM nASanamAtmanaH . kAmaH kroDastaTA loBastasmAdetattrayaM tyajet .. 16-21 ..
      yataH kAmAdikaM trayaM narakasyEva dvAram tasmAdetattyajet .. 21 ..
    iast: |-
      trividhaṃ narakasyedaṃ dvāraṃ nāśanamātmanaḥ | kāmaḥ krodhastathā lobhastasmādetattrayaṃ tyajet || 16-21 ||
      yataḥ kāmādikaṃ trayaṃ narakasyaiva dvāram tasmādetattyajet || 21 ||
  - verse: 22
    devanagari: |-
      एतैर्वियुक्तः कौन्तेय तमोद्वारैस्त्रिभिर्नरः । आचरत्यात्मनः श्रेयस्ततो याति परां गतिम् ॥ १६-२२ ॥
    slp1: |-
      etErviyuktaH kOnteya tamodvArEstriBirnaraH . AcaratyAtmanaH Sreyastato yAti parAM gatim .. 16-22 ..
    iast: |-
      etairviyuktaḥ kaunteya tamodvāraistribhirnaraḥ | ācaratyātmanaḥ śreyastato yāti parāṃ gatim || 16-22 ||
  - verse: 23
    devanagari: |-
      न चैतत् पुरुषवचनमित्यनादरणीयम् अपितु अनादि शास्त्रमत्र प्रमाणम्-इत्युच्यते
      यः शास्त्रविधिमुत्सृज्य वर्तते कामकारतः । न स सिद्धिमवाप्नोति न सुखं न परां गतिम् ॥ १६-२३ ॥
    slp1: |-
      na cEtat puruzavacanamityanAdaraRIyam apitu anAdi SAstramatra pramARam-ityucyate
      yaH SAstraviDimutsfjya vartate kAmakArataH . na sa sidDimavApnoti na suKaM na parAM gatim .. 16-23 ..
    iast: |-
      na caitat puruṣavacanamityanādaraṇīyam apitu anādi śāstramatra pramāṇam-ityucyate
      yaḥ śāstravidhimutsṛjya vartate kāmakārataḥ | na sa siddhimavāpnoti na sukhaṃ na parāṃ gatim || 16-23 ||
  - verse: 24
    devanagari: |-
      तस्माच्छास्त्रं प्रमाणं ते कार्याकार्यव्यवस्थितौ । ज्ञात्वा शास्त्रविधानोक्तं कर्म कर्तुमिहार्हसि ॥ १६-२४ ॥
      शास्त्रविधिं त्यजतः स्वमनीषयैव कार्याकार्यविचारं कुर्वतः प्रत्युत नरकपातः । तस्मादात्मबुद्ध्या कार्याकार्यव्यवस्थां मा कार्षीरिति तात्पर्यम् ॥ २४ ॥
    slp1: |-
      tasmAcCAstraM pramARaM te kAryAkAryavyavasTitO . jYAtvA SAstraviDAnoktaM karma kartumihArhasi .. 16-24 ..
      SAstraviDiM tyajataH svamanIzayEva kAryAkAryavicAraM kurvataH pratyuta narakapAtaH . tasmAdAtmabudDyA kAryAkAryavyavasTAM mA kArzIriti tAtparyam .. 24 ..
    iast: |-
      tasmācchāstraṃ pramāṇaṃ te kāryākāryavyavasthitau | jñātvā śāstravidhānoktaṃ karma kartumihārhasi || 16-24 ||
      śāstravidhiṃ tyajataḥ svamanīṣayaiva kāryākāryavicāraṃ kurvataḥ pratyuta narakapātaḥ | tasmādātmabuddhyā kāryākāryavyavasthāṃ mā kārṣīriti tātparyam || 24 ||
  - verse: 1000
    devanagari: |-
      अबोधे स्वात्मबुद्ध्यैव कार्यं नैव विचारयेत् । किन्तु शास्त्रोक्तविधिना शास्त्रं बोधविवर्धनम् ॥ १६ ॥
    slp1: |-
      aboDe svAtmabudDyEva kAryaM nEva vicArayet . kintu SAstroktaviDinA SAstraM boDavivarDanam .. 16 ..
    iast: |-
      abodhe svātmabuddhyaiva kāryaṃ naiva vicārayet | kintu śāstroktavidhinā śāstraṃ bodhavivardhanam || 16 ||
- chapter: 17
  title_sa: सप्तदशोऽध्यायः
  title_iast: "saptadaśo'dhyāyaḥ"
  title_en: "Seventeenth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      अर्जुन उवाच
      ये शास्त्रविधिमुत्सृत्य वर्तन्ते श्रद्धायान्विताः । तेषां निष्ठा तु का कृष्णा सत्त्वमाहो रजस्तमः ॥ १७-१ ॥
      शास्त्रविधिमनालम्ब्य ये व्यवहारमाचरन्ति तेषां का गतिरिति प्रश्नः ॥ १ ॥
    slp1: |-
      arjuna uvAca
      ye SAstraviDimutsftya vartante SradDAyAnvitAH . tezAM nizWA tu kA kfzRA sattvamAho rajastamaH .. 17-1 ..
      SAstraviDimanAlambya ye vyavahAramAcaranti tezAM kA gatiriti praSnaH .. 1 ..
    iast: |-
      arjuna uvāca
      ye śāstravidhimutsṛtya vartante śraddhāyānvitāḥ | teṣāṃ niṣṭhā tu kā kṛṣṇā sattvamāho rajastamaḥ || 17-1 ||
      śāstravidhimanālambya ye vyavahāramācaranti teṣāṃ kā gatiriti praśnaḥ || 1 ||
  - verse: 2
    devanagari: |-
      तदत्रोत्तरं श्रद्धानुसारेण दीयते श्रीभगवता-
      श्रीभगवानुवाच
      त्रिविधा भवति श्रद्धा देहिनां सा स्वभावजा । सात्त्विकी राजसी चैव तामसी चेति ताः शृणु ॥ १७-२ ॥
      इति नान्योऽसंयतत्वात् । तस्माच्छास्त्रार्थः परित्यक्तकामक्रोध मोहेषु सफल इति तात्पर्यमस्याध्यायस्य तदेवैतत्प्रतायते स्पष्टार्थत्वाच्च न विव्रियते । किन्तु केवलं पाठविप्रतिपत्तिनिवारणायैव लिख्यते ॥ २ ॥
    slp1: |-
      tadatrottaraM SradDAnusAreRa dIyate SrIBagavatA-
      SrIBagavAnuvAca
      triviDA Bavati SradDA dehinAM sA svaBAvajA . sAttvikI rAjasI cEva tAmasI ceti tAH SfRu .. 17-2 ..
      iti nAnyo'saMyatatvAt . tasmAcCAstrArTaH parityaktakAmakroDa mohezu saPala iti tAtparyamasyADyAyasya tadevEtatpratAyate spazwArTatvAcca na vivriyate . kintu kevalaM pAWavipratipattinivAraRAyEva liKyate .. 2 ..
    iast: |-
      tadatrottaraṃ śraddhānusāreṇa dīyate śrībhagavatā-
      śrībhagavānuvāca
      trividhā bhavati śraddhā dehināṃ sā svabhāvajā | sāttvikī rājasī caiva tāmasī ceti tāḥ śṛṇu || 17-2 ||
      iti nānyo'saṃyatatvāt | tasmācchāstrārthaḥ parityaktakāmakrodha moheṣu saphala iti tātparyamasyādhyāyasya tadevaitatpratāyate spaṣṭārthatvācca na vivriyate | kintu kevalaṃ pāṭhavipratipattinivāraṇāyaiva likhyate || 2 ||
  - verse: 3
    devanagari: |-
      सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत । श्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः स एव सः ॥ १७-३ ॥
    slp1: |-
      sattvAnurUpA sarvasya SradDA Bavati BArata . SradDAmayo'yaM puruzo yo yacCradDaH sa eva saH .. 17-3 ..
    iast: |-
      sattvānurūpā sarvasya śraddhā bhavati bhārata | śraddhāmayo'yaṃ puruṣo yo yacchraddhaḥ sa eva saḥ || 17-3 ||
  - verse: 4
    devanagari: |-
      यजन्ते सात्त्विका देवान्यक्षरक्षांसि राजसाः । भूतप्रेतपिशाचांश्च यजन्ते तामसा जनाः ॥ १७-४ ॥
    slp1: |-
      yajante sAttvikA devAnyakzarakzAMsi rAjasAH . BUtapretapiSAcAMSca yajante tAmasA janAH .. 17-4 ..
    iast: |-
      yajante sāttvikā devānyakṣarakṣāṃsi rājasāḥ | bhūtapretapiśācāṃśca yajante tāmasā janāḥ || 17-4 ||
  - verse: 5
    devanagari: |-
      अशास्त्रविहितं घोरं तपस्तप्यन्ति ये जनाः । दम्भाहङ्कारसंयुक्ताः कामरागबलान्विताः ॥ १७-५ ॥
    slp1: |-
      aSAstravihitaM GoraM tapastapyanti ye janAH . damBAhaNkArasaMyuktAH kAmarAgabalAnvitAH .. 17-5 ..
    iast: |-
      aśāstravihitaṃ ghoraṃ tapastapyanti ye janāḥ | dambhāhaṅkārasaṃyuktāḥ kāmarāgabalānvitāḥ || 17-5 ||
  - verse: 6
    devanagari: |-
      कर्षयन्तः शरीरस्थं भूतग्राममचेतनम् । मां चैवान्तःशरीरस्थं तान्विद्ध्यासुरनिश्चयान् ॥ १७-६ ॥
      सत्त्वानुरूपा-इत्यत्र सत्त्वशब्दः स्वभावपर्यायः । अयं पुरुषः-आत्मा श्रद्धया अन्यव्यापारोपरिवर्तिन्या अवश्यं संबद्धः । स च तन्मय एव बोद्धव्यः । अचेतनम्-अविवेकित्वात् । मां च कर्षयन्तः-शास्त्रार्थाननुष्ठानात् । अत एव ते स्वबुद्धिविरचितां तपश्चर्यां कुर्वाणाः प्रत्युत तामसाः ॥ ६ ॥
    slp1: |-
      karzayantaH SarIrasTaM BUtagrAmamacetanam . mAM cEvAntaHSarIrasTaM tAnvidDyAsuraniScayAn .. 17-6 ..
      sattvAnurUpA-ityatra sattvaSabdaH svaBAvaparyAyaH . ayaM puruzaH-AtmA SradDayA anyavyApAroparivartinyA avaSyaM saMbadDaH . sa ca tanmaya eva bodDavyaH . acetanam-avivekitvAt . mAM ca karzayantaH-SAstrArTAnanuzWAnAt . ata eva te svabudDiviracitAM tapaScaryAM kurvARAH pratyuta tAmasAH .. 6 ..
    iast: |-
      karṣayantaḥ śarīrasthaṃ bhūtagrāmamacetanam | māṃ caivāntaḥśarīrasthaṃ tānviddhyāsuraniścayān || 17-6 ||
      sattvānurūpā-ityatra sattvaśabdaḥ svabhāvaparyāyaḥ | ayaṃ puruṣaḥ-ātmā śraddhayā anyavyāpāroparivartinyā avaśyaṃ saṃbaddhaḥ | sa ca tanmaya eva boddhavyaḥ | acetanam-avivekitvāt | māṃ ca karṣayantaḥ-śāstrārthānanuṣṭhānāt | ata eva te svabuddhiviracitāṃ tapaścaryāṃ kurvāṇāḥ pratyuta tāmasāḥ || 6 ||
  - verse: 7
    devanagari: |-
      आहारोऽपि सत्त्वादिभेदात् त्रिधा श्रद्धावत् । तथा यज्ञतपोदानानि-तदुच्यते-
      आहारस्त्वपि सर्वस्य त्रिविधो भवति प्रियः । यज्ञस्तपस्तथा दानं तेषां भेदमिमं शृणु ॥ १७-७ ॥
    slp1: |-
      AhAro'pi sattvAdiBedAt triDA SradDAvat . taTA yajYatapodAnAni-taducyate-
      AhArastvapi sarvasya triviDo Bavati priyaH . yajYastapastaTA dAnaM tezAM BedamimaM SfRu .. 17-7 ..
    iast: |-
      āhāro'pi sattvādibhedāt tridhā śraddhāvat | tathā yajñatapodānāni-taducyate-
      āhārastvapi sarvasya trividho bhavati priyaḥ | yajñastapastathā dānaṃ teṣāṃ bhedamimaṃ śṛṇu || 17-7 ||
  - verse: 8
    devanagari: |-
      आयुःसत्त्वबलारोग्यसुखप्रीतिविवर्धनाः । रस्याः स्निग्धाः स्थिरा हृद्या आहाराः सात्त्विकप्रियाः ॥ १७-८ ॥
    slp1: |-
      AyuHsattvabalArogyasuKaprItivivarDanAH . rasyAH snigDAH sTirA hfdyA AhArAH sAttvikapriyAH .. 17-8 ..
    iast: |-
      āyuḥsattvabalārogyasukhaprītivivardhanāḥ | rasyāḥ snigdhāḥ sthirā hṛdyā āhārāḥ sāttvikapriyāḥ || 17-8 ||
  - verse: 9
    devanagari: |-
      कट्वम्ललवणात्युष्णतीक्ष्णरूक्षविदाहिनः । आहारा राजसस्येष्टा दुःखशोकामयप्रदाः ॥ १७-९ ॥
    slp1: |-
      kawvamlalavaRAtyuzRatIkzRarUkzavidAhinaH . AhArA rAjasasyezwA duHKaSokAmayapradAH .. 17-9 ..
    iast: |-
      kaṭvamlalavaṇātyuṣṇatīkṣṇarūkṣavidāhinaḥ | āhārā rājasasyeṣṭā duḥkhaśokāmayapradāḥ || 17-9 ||
  - verse: 10
    devanagari: |-
      यातयामं गतरसं पूति पर्युषितं च यत् । उच्छिष्टमपि चामेध्यं भोजनं तामसप्रियम् ॥ १७-१० ॥
      यातयाममिति-याता यामा यस्य ॥ १० ॥
    slp1: |-
      yAtayAmaM gatarasaM pUti paryuzitaM ca yat . ucCizwamapi cAmeDyaM BojanaM tAmasapriyam .. 17-10 ..
      yAtayAmamiti-yAtA yAmA yasya .. 10 ..
    iast: |-
      yātayāmaṃ gatarasaṃ pūti paryuṣitaṃ ca yat | ucchiṣṭamapi cāmedhyaṃ bhojanaṃ tāmasapriyam || 17-10 ||
      yātayāmamiti-yātā yāmā yasya || 10 ||
  - verse: 11
    devanagari: |-
      अफलाकांक्षिभिर्यज्ञो विधिदृष्टो य इज्यते । यष्टव्यमित्येव मनः समाधाय स सात्त्विकः ॥ १७-११ ॥
      मनः समाधाय-निश्चयेनानुसन्धाय ॥ ११ ॥
    slp1: |-
      aPalAkAMkziBiryajYo viDidfzwo ya ijyate . yazwavyamityeva manaH samADAya sa sAttvikaH .. 17-11 ..
      manaH samADAya-niScayenAnusanDAya .. 11 ..
    iast: |-
      aphalākāṃkṣibhiryajño vidhidṛṣṭo ya ijyate | yaṣṭavyamityeva manaḥ samādhāya sa sāttvikaḥ || 17-11 ||
      manaḥ samādhāya-niścayenānusandhāya || 11 ||
  - verse: 12
    devanagari: |-
      अभिसन्धाय तु फलं दम्भार्थमपि चैव यतः । इज्यते विद्धि तं यज्ञं राजसं चलमध्रुवम् ॥ १७-१२ ॥
      दम्भार्थमपीति । दम्भो-लोको मामेवंविधं जानीयादिति ॥ १२ ॥
    slp1: |-
      aBisanDAya tu PalaM damBArTamapi cEva yataH . ijyate vidDi taM yajYaM rAjasaM calamaDruvam .. 17-12 ..
      damBArTamapIti . damBo-loko mAmevaMviDaM jAnIyAditi .. 12 ..
    iast: |-
      abhisandhāya tu phalaṃ dambhārthamapi caiva yataḥ | ijyate viddhi taṃ yajñaṃ rājasaṃ calamadhruvam || 17-12 ||
      dambhārthamapīti | dambho-loko māmevaṃvidhaṃ jānīyāditi || 12 ||
  - verse: 13
    devanagari: |-
      विधिहीनमसृष्टान्नं मन्त्रहीनमदक्षिणम् । श्रद्धाविरहितं यज्ञं तामसं परिचक्षते ॥ १७-१३ ॥
      विधिहीनमिति-शास्त्रीक्तक्रियाहीनम् । तदेवासृष्टान्नादिभिर्विशेषणैर्वितन्यते ॥ १३ ॥
    slp1: |-
      viDihInamasfzwAnnaM mantrahInamadakziRam . SradDAvirahitaM yajYaM tAmasaM paricakzate .. 17-13 ..
      viDihInamiti-SAstrIktakriyAhInam . tadevAsfzwAnnAdiBirviSezaRErvitanyate .. 13 ..
    iast: |-
      vidhihīnamasṛṣṭānnaṃ mantrahīnamadakṣiṇam | śraddhāvirahitaṃ yajñaṃ tāmasaṃ paricakṣate || 17-13 ||
      vidhihīnamiti-śāstrīktakriyāhīnam | tadevāsṛṣṭānnādibhirviśeṣaṇairvitanyate || 13 ||
  - verse: 14
    devanagari: |-
      देवद्विजगुरुप्राज्ञपूजनं शौचमार्जवम् । ब्रह्मचर्यमहिंसा च शारीरं तप उच्यते ॥ १७-१४ ॥
      आर्जवम्-ऋजुता । (अगोप्यविषया धृष्टता) ॥ १४ ॥
    slp1: |-
      devadvijaguruprAjYapUjanaM SOcamArjavam . brahmacaryamahiMsA ca SArIraM tapa ucyate .. 17-14 ..
      Arjavam-fjutA . (agopyavizayA DfzwatA) .. 14 ..
    iast: |-
      devadvijaguruprājñapūjanaṃ śaucamārjavam | brahmacaryamahiṃsā ca śārīraṃ tapa ucyate || 17-14 ||
      ārjavam-ṛjutā | (agopyaviṣayā dhṛṣṭatā) || 14 ||
  - verse: 15
    devanagari: |-
      अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत् । स्वाध्यायाभ्यसनं चैव वाङ्मयं तप उच्यते ॥ १७-१५ ॥
      सत्यमिति । अस्यैव स्वरूपनिरूपणं प्रियहितम्-इत्यनेन क्रियते । प्रियं च तत्काले हितं च कालान्तरे । ईदृशं वाक्यं सत्यमित्युच्यते नतु यथावृत्तकथनमात्रम् ॥ १५ ॥
    slp1: |-
      anudvegakaraM vAkyaM satyaM priyahitaM ca yat . svADyAyAByasanaM cEva vANmayaM tapa ucyate .. 17-15 ..
      satyamiti . asyEva svarUpanirUpaRaM priyahitam-ityanena kriyate . priyaM ca tatkAle hitaM ca kAlAntare . IdfSaM vAkyaM satyamityucyate natu yaTAvfttakaTanamAtram .. 15 ..
    iast: |-
      anudvegakaraṃ vākyaṃ satyaṃ priyahitaṃ ca yat | svādhyāyābhyasanaṃ caiva vāṅmayaṃ tapa ucyate || 17-15 ||
      satyamiti | asyaiva svarūpanirūpaṇaṃ priyahitam-ityanena kriyate | priyaṃ ca tatkāle hitaṃ ca kālāntare | īdṛśaṃ vākyaṃ satyamityucyate natu yathāvṛttakathanamātram || 15 ||
  - verse: 16
    devanagari: |-
      मनःप्रसादः सौम्यत्वं मौनमात्मविनिग्रहः । भावसंशुद्धिरित्येतत्तपो मानसमुच्यते ॥ १७-१६ ॥
      भावः-आशयः तस्य सम्यक् शुद्धिः भावसंशुद्धिः ॥ १६ ॥
    slp1: |-
      manaHprasAdaH sOmyatvaM mOnamAtmavinigrahaH . BAvasaMSudDirityetattapo mAnasamucyate .. 17-16 ..
      BAvaH-ASayaH tasya samyak SudDiH BAvasaMSudDiH .. 16 ..
    iast: |-
      manaḥprasādaḥ saumyatvaṃ maunamātmavinigrahaḥ | bhāvasaṃśuddhirityetattapo mānasamucyate || 17-16 ||
      bhāvaḥ-āśayaḥ tasya samyak śuddhiḥ bhāvasaṃśuddhiḥ || 16 ||
  - verse: 17
    devanagari: |-
      श्रद्धया परयोपेतं तपस्तत्त्रिविधम् नरैः । अफलाकांक्षिभिर्युक्तैः सात्त्विकं परिचक्षते ॥ १७-१७ ॥
    slp1: |-
      SradDayA parayopetaM tapastattriviDam narEH . aPalAkAMkziBiryuktEH sAttvikaM paricakzate .. 17-17 ..
    iast: |-
      śraddhayā parayopetaṃ tapastattrividham naraiḥ | aphalākāṃkṣibhiryuktaiḥ sāttvikaṃ paricakṣate || 17-17 ||
  - verse: 18
    devanagari: |-
      सत्कारमानपूजार्थं तपो दम्भेन चैव यत् । क्रियते तदिह प्रोक्तं राजसं चलमध्रुवम् ॥ १७-१८ ॥
    slp1: |-
      satkAramAnapUjArTaM tapo damBena cEva yat . kriyate tadiha proktaM rAjasaM calamaDruvam .. 17-18 ..
    iast: |-
      satkāramānapūjārthaṃ tapo dambhena caiva yat | kriyate tadiha proktaṃ rājasaṃ calamadhruvam || 17-18 ||
  - verse: 19
    devanagari: |-
      मूढग्राहेणात्मनो यत्पीडया क्रियते तपः । परस्योत्सादनार्थं वा तत्तामसमुदाहृतम् ॥ १७-१९ ॥
      त्रिविधेऽपि तपसि श्रद्धा । सात्त्विकस्य हि तन्मयी एव श्रद्धा । राजसस्य तु रजसि-दम्भादावेव श्रद्धा । तमोनिष्ठस्य पुनः परोत्सादनादावेव श्रद्धा । इति त्रिविधमपि तपः स्रद्धयोपेतं मुनिराह ॥ १९ ॥
    slp1: |-
      mUQagrAheRAtmano yatpIqayA kriyate tapaH . parasyotsAdanArTaM vA tattAmasamudAhftam .. 17-19 ..
      triviDe'pi tapasi SradDA . sAttvikasya hi tanmayI eva SradDA . rAjasasya tu rajasi-damBAdAveva SradDA . tamonizWasya punaH parotsAdanAdAveva SradDA . iti triviDamapi tapaH sradDayopetaM munirAha .. 19 ..
    iast: |-
      mūḍhagrāheṇātmano yatpīḍayā kriyate tapaḥ | parasyotsādanārthaṃ vā tattāmasamudāhṛtam || 17-19 ||
      trividhe'pi tapasi śraddhā | sāttvikasya hi tanmayī eva śraddhā | rājasasya tu rajasi-dambhādāveva śraddhā | tamoniṣṭhasya punaḥ parotsādanādāveva śraddhā | iti trividhamapi tapaḥ sraddhayopetaṃ munirāha || 19 ||
  - verse: 20
    devanagari: |-
      दातव्यमिति यद्दानं दीयतेऽनुपकारिणे । देशे काले च पात्रे च तद्दानं सात्त्विकं स्मृतम् ॥ १७-२० ॥
      दातव्यमिति-दद्यातिति नियोगमात्रं पालनीयमिति ॥ २० ॥
    slp1: |-
      dAtavyamiti yaddAnaM dIyate'nupakAriRe . deSe kAle ca pAtre ca taddAnaM sAttvikaM smftam .. 17-20 ..
      dAtavyamiti-dadyAtiti niyogamAtraM pAlanIyamiti .. 20 ..
    iast: |-
      dātavyamiti yaddānaṃ dīyate'nupakāriṇe | deśe kāle ca pātre ca taddānaṃ sāttvikaṃ smṛtam || 17-20 ||
      dātavyamiti-dadyātiti niyogamātraṃ pālanīyamiti || 20 ||
  - verse: 21
    devanagari: |-
      यत्तु प्रत्युपकारार्थं फलमुद्दिश्य वा पुनः । दीयते च परिक्लिष्टं तद्राजसमिति स्मृतम् ॥ १७-२१ ॥
      दोषाभिसन्धानाय परिक्लिष्टं-मितादिदोषात् ॥ २१ ॥
    slp1: |-
      yattu pratyupakArArTaM PalamuddiSya vA punaH . dIyate ca pariklizwaM tadrAjasamiti smftam .. 17-21 ..
      dozABisanDAnAya pariklizwaM-mitAdidozAt .. 21 ..
    iast: |-
      yattu pratyupakārārthaṃ phalamuddiśya vā punaḥ | dīyate ca parikliṣṭaṃ tadrājasamiti smṛtam || 17-21 ||
      doṣābhisandhānāya parikliṣṭaṃ-mitādidoṣāt || 21 ||
  - verse: 22
    devanagari: |-
      अदेशकाले यद्दानमपात्रेभ्यश्च दीयते । असत्कृतमवज्ञातं तत्तामसमुदाहृतम् ॥ १७-२२ ॥
      दानस्य चासत्करणं तत्संप्रदानाद्यसत्करणात् । एवं लौकिकानां सात्त्विकादित्रिप्रकाराशयानुसारेण क्रिया व्याख्याता ॥ २२ ॥
    slp1: |-
      adeSakAle yaddAnamapAtreByaSca dIyate . asatkftamavajYAtaM tattAmasamudAhftam .. 17-22 ..
      dAnasya cAsatkaraRaM tatsaMpradAnAdyasatkaraRAt . evaM lOkikAnAM sAttvikAditriprakArASayAnusAreRa kriyA vyAKyAtA .. 22 ..
    iast: |-
      adeśakāle yaddānamapātrebhyaśca dīyate | asatkṛtamavajñātaṃ tattāmasamudāhṛtam || 17-22 ||
      dānasya cāsatkaraṇaṃ tatsaṃpradānādyasatkaraṇāt | evaṃ laukikānāṃ sāttvikāditriprakārāśayānusāreṇa kriyā vyākhyātā || 22 ||
  - verse: 23
    devanagari: |-
      इदानीं ये गुणत्रितयसंकटोत्तीर्णधियस्ते क्रियां कथमाचरन्तीति तादृक् प्रकार उच्यते-
      ॐ तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः । ब्राह्मणास्तेन वेदाश्च यञाश्च विहिताः पुरा ॥ १७-२३ ॥
    slp1: |-
      idAnIM ye guRatritayasaMkawottIrRaDiyaste kriyAM kaTamAcarantIti tAdfk prakAra ucyate-
      AUM tatsaditi nirdeSo brahmaRastriviDaH smftaH . brAhmaRAstena vedASca yaYASca vihitAH purA .. 17-23 ..
    iast: |-
      idānīṃ ye guṇatritayasaṃkaṭottīrṇadhiyaste kriyāṃ kathamācarantīti tādṛk prakāra ucyate-
      oṃ tatsaditi nirdeśo brahmaṇastrividhaḥ smṛtaḥ | brāhmaṇāstena vedāśca yañāśca vihitāḥ purā || 17-23 ||
  - verse: 24
    devanagari: |-
      तस्मादोमित्युदाहृत्य यज्ञदानतपःक्रियाः । प्रवर्तन्ते विधानोक्ताः सततं ब्रह्मवादिनाम् ॥ १७-२४ ॥
    slp1: |-
      tasmAdomityudAhftya yajYadAnatapaHkriyAH . pravartante viDAnoktAH satataM brahmavAdinAm .. 17-24 ..
    iast: |-
      tasmādomityudāhṛtya yajñadānatapaḥkriyāḥ | pravartante vidhānoktāḥ satataṃ brahmavādinām || 17-24 ||
  - verse: 25
    devanagari: |-
      तदित्यनभिसन्धाय फलं यज्ञतपःक्रियाः । दानक्रियाश्च विविधाः क्रियन्ते मोक्षकाङ्क्षिभिः ॥ १७-२५ ॥
    slp1: |-
      tadityanaBisanDAya PalaM yajYatapaHkriyAH . dAnakriyASca viviDAH kriyante mokzakANkziBiH .. 17-25 ..
    iast: |-
      tadityanabhisandhāya phalaṃ yajñatapaḥkriyāḥ | dānakriyāśca vividhāḥ kriyante mokṣakāṅkṣibhiḥ || 17-25 ||
  - verse: 26
    devanagari: |-
      सद्भावे साधुभावे च सदित्येतत्प्रयुज्यते । प्रशस्ते कर्मणि तथा सच्छब्दः पार्थ गीयते ॥ १७-२६ ॥
    slp1: |-
      sadBAve sADuBAve ca sadityetatprayujyate . praSaste karmaRi taTA sacCabdaH pArTa gIyate .. 17-26 ..
    iast: |-
      sadbhāve sādhubhāve ca sadityetatprayujyate | praśaste karmaṇi tathā sacchabdaḥ pārtha gīyate || 17-26 ||
  - verse: 27
    devanagari: |-
      यज्ञे तपसि दाने च स्थितिः सदिति चोच्यते । कर्म चैव तदर्थीयं सदित्येवाभिधीयते ॥ १७-२७ ॥
      इति । कल्कः-बन्धकः । स्वाभाविक इति ब्राह्मणेन निष्कारणं षडङ्गं वेदादि अध्येतव्यम्-इति । प्रसह्य-शास्त्रलोकप्रसिद्धोचितया चेष्टया । भावेन-सत्त्वादिगुणत्रययोगिना चित्तेन उपहतान्येतान्येव बन्धकानि नान्यथेति तात्पर्यम् । अतो यज्ञादि यावच्छरीरभावितया कार्यमेव । तदर्थे विहितं कर्म-अर्जनादि । यदि वा-ओम्-इत्यनेन समुपशान्तसमस्तप्रपञ्चम् । तत्-इत्यनेनोद्भिद्यमानविश्वतरङ्गपरामर्शमात्रात्मकेच्छास्वात न्त्र्यस्व-भावम् । सत्-इत्यनेनेच्छास्वातन्त्र्यभरविजृम्भमाणभेदकम् पूर्णत्वेऽपि तावच्चित्रस्वभावतया भवनमिति प्रतिपाद्यते । तथा चोक्तं सद्भावे साधुभावे च इति । तेन परमं प्रशान्तं रूपं पुरस्कृत्य दित्सा-यियक्षातितप्सात्मकेच्छातरङ्गसंगतं च मध्येकृत्य दानयज्ञतपःक्रियाकरककलापपरिपूर्णं यच्चरमं वपुरिदमुल्लसितम् एतत्खलु समं त्रितयमनर्गलस्य स्वाभाविकं रूपम् इति कस्य किं कथं कुतः क्व केन फलं स्यादिति ॥ २७ ॥
    slp1: |-
      yajYe tapasi dAne ca sTitiH saditi cocyate . karma cEva tadarTIyaM sadityevABiDIyate .. 17-27 ..
      iti . kalkaH-banDakaH . svABAvika iti brAhmaRena nizkAraRaM zaqaNgaM vedAdi aDyetavyam-iti . prasahya-SAstralokaprasidDocitayA cezwayA . BAvena-sattvAdiguRatrayayoginA cittena upahatAnyetAnyeva banDakAni nAnyaTeti tAtparyam . ato yajYAdi yAvacCarIraBAvitayA kAryameva . tadarTe vihitaM karma-arjanAdi . yadi vA-om-ityanena samupaSAntasamastaprapaYcam . tat-ityanenodBidyamAnaviSvataraNgaparAmarSamAtrAtmakecCAsvAta ntryasva-BAvam . sat-ityanenecCAsvAtantryaBaravijfmBamARaBedakam pUrRatve'pi tAvaccitrasvaBAvatayA Bavanamiti pratipAdyate . taTA coktaM sadBAve sADuBAve ca iti . tena paramaM praSAntaM rUpaM puraskftya ditsA-yiyakzAtitapsAtmakecCAtaraNgasaMgataM ca maDyekftya dAnayajYatapaHkriyAkarakakalApaparipUrRaM yaccaramaM vapuridamullasitam etatKalu samaM tritayamanargalasya svABAvikaM rUpam iti kasya kiM kaTaM kutaH kva kena PalaM syAditi .. 27 ..
    iast: |-
      yajñe tapasi dāne ca sthitiḥ saditi cocyate | karma caiva tadarthīyaṃ sadityevābhidhīyate || 17-27 ||
      iti | kalkaḥ-bandhakaḥ | svābhāvika iti brāhmaṇena niṣkāraṇaṃ ṣaḍaṅgaṃ vedādi adhyetavyam-iti | prasahya-śāstralokaprasiddhocitayā ceṣṭayā | bhāvena-sattvādiguṇatrayayoginā cittena upahatānyetānyeva bandhakāni nānyatheti tātparyam | ato yajñādi yāvaccharīrabhāvitayā kāryameva | tadarthe vihitaṃ karma-arjanādi | yadi vā-om-ityanena samupaśāntasamastaprapañcam | tat-ityanenodbhidyamānaviśvataraṅgaparāmarśamātrātmakecchāsvāta ntryasva-bhāvam | sat-ityanenecchāsvātantryabharavijṛmbhamāṇabhedakam pūrṇatve'pi tāvaccitrasvabhāvatayā bhavanamiti pratipādyate | tathā coktaṃ sadbhāve sādhubhāve ca iti | tena paramaṃ praśāntaṃ rūpaṃ puraskṛtya ditsā-yiyakṣātitapsātmakecchātaraṅgasaṃgataṃ ca madhyekṛtya dānayajñatapaḥkriyākarakakalāpaparipūrṇaṃ yaccaramaṃ vapuridamullasitam etatkhalu samaṃ tritayamanargalasya svābhāvikaṃ rūpam iti kasya kiṃ kathaṃ kutaḥ kva kena phalaṃ syāditi || 27 ||
  - verse: 28
    devanagari: |-
      इदानीमश्रद्धावतः तामसं कर्म सर्वथैव निष्फलम्-कारककलापसंयोजनसमुपजनितप्रयासमात्रफलमेव इति सर्वथा अश्रद्धावता न भाव्यमित्युच्यते-
      अश्रद्धया हुतं दत्तं तपस्तप्तं कृतं च यत् । असदित्युच्यते पार्थ न च तत्प्रेत्य नो इह ॥ १७-२८ ॥
      असदिति-अप्रशस्तम् । तस्मात्प्रशस्ते कर्मणि यतमानानां सुखेनैव भवति शिवमिति शिवम् ॥ २८ ॥
    slp1: |-
      idAnImaSradDAvataH tAmasaM karma sarvaTEva nizPalam-kArakakalApasaMyojanasamupajanitaprayAsamAtraPalameva iti sarvaTA aSradDAvatA na BAvyamityucyate-
      aSradDayA hutaM dattaM tapastaptaM kftaM ca yat . asadityucyate pArTa na ca tatpretya no iha .. 17-28 ..
      asaditi-apraSastam . tasmAtpraSaste karmaRi yatamAnAnAM suKenEva Bavati Sivamiti Sivam .. 28 ..
    iast: |-
      idānīmaśraddhāvataḥ tāmasaṃ karma sarvathaiva niṣphalam-kārakakalāpasaṃyojanasamupajanitaprayāsamātraphalameva iti sarvathā aśraddhāvatā na bhāvyamityucyate-
      aśraddhayā hutaṃ dattaṃ tapastaptaṃ kṛtaṃ ca yat | asadityucyate pārtha na ca tatpretya no iha || 17-28 ||
      asaditi-apraśastam | tasmātpraśaste karmaṇi yatamānānāṃ sukhenaiva bhavati śivamiti śivam || 28 ||
  - verse: 1000
    devanagari: |-
      स एव कारकावेशः क्रिया सैवाविशेषिणी । तथापि विज्ञानवतां मोक्षार्थे पर्यवस्यति ॥ १७ ॥
    slp1: |-
      sa eva kArakAveSaH kriyA sEvAviSeziRI . taTApi vijYAnavatAM mokzArTe paryavasyati .. 17 ..
    iast: |-
      sa eva kārakāveśaḥ kriyā saivāviśeṣiṇī | tathāpi vijñānavatāṃ mokṣārthe paryavasyati || 17 ||
- chapter: 18
  title_sa: अष्टदशोऽध्यायः
  title_iast: "aṣṭadaśo'dhyāyaḥ"
  title_en: "Eighteenth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      अर्जुन उवाच
      संन्यासस्य महाबाहो तत्त्वमिच्छामि वेदितुम् । त्यागस्य च हृषीकेश पृथक्केशिनिषूदन ॥ १८-१ ॥
      पूर्वमुक्तं स त्यागी स च बुद्धिमान् इति । तथा स संन्यासी च योगी च न निरग्निः इत्यादि । अतस्त्यागिसंन्यासिनोर्द्वयोः श्रवणात् विशेषजिज्ञासोरयं प्रश्नः ॥ १ ॥
    slp1: |-
      arjuna uvAca
      saMnyAsasya mahAbAho tattvamicCAmi veditum . tyAgasya ca hfzIkeSa pfTakkeSinizUdana .. 18-1 ..
      pUrvamuktaM sa tyAgI sa ca budDimAn iti . taTA sa saMnyAsI ca yogI ca na niragniH ityAdi . atastyAgisaMnyAsinordvayoH SravaRAt viSezajijYAsorayaM praSnaH .. 1 ..
    iast: |-
      arjuna uvāca
      saṃnyāsasya mahābāho tattvamicchāmi veditum | tyāgasya ca hṛṣīkeśa pṛthakkeśiniṣūdana || 18-1 ||
      pūrvamuktaṃ sa tyāgī sa ca buddhimān iti | tathā sa saṃnyāsī ca yogī ca na niragniḥ ityādi | atastyāgisaṃnyāsinordvayoḥ śravaṇāt viśeṣajijñāsorayaṃ praśnaḥ || 1 ||
  - verse: 2
    devanagari: |-
      अत्रोत्तरं-
      श्रीभगवानुवाच
      काम्यानां कर्मणां त्यागं संन्यासं कवयो विदुः । सर्वकर्मफलत्यागं प्राहुस्त्यागं विचक्षणाः ॥ १८-२ ॥
      काम्यानि-अग्निष्टोमादीनि । सर्वकर्मेति । सर्वेषां-नित्यनैमित्तिक-कर्मणां क्रियमाणत्वेऽपि फलत्यागस्त्यागः । अत्र चाध्याये यदवशिष्टं वक्तव्यमस्ति तत्प्राक्तनैरेव तत्रभवद्भट्टभास्करादिभिर्वितत्य विमृष्टमिति किमस्माकं तद्गूढार्थप्रकाशनमात्रप्रतिज्ञानिर्वाहणसाराणां पुनरुक्तप्रदर्शनप्रयासेन ॥ २ ॥
    slp1: |-
      atrottaraM-
      SrIBagavAnuvAca
      kAmyAnAM karmaRAM tyAgaM saMnyAsaM kavayo viduH . sarvakarmaPalatyAgaM prAhustyAgaM vicakzaRAH .. 18-2 ..
      kAmyAni-agnizwomAdIni . sarvakarmeti . sarvezAM-nityanEmittika-karmaRAM kriyamARatve'pi PalatyAgastyAgaH . atra cADyAye yadavaSizwaM vaktavyamasti tatprAktanEreva tatraBavadBawwaBAskarAdiBirvitatya vimfzwamiti kimasmAkaM tadgUQArTaprakASanamAtrapratijYAnirvAhaRasArARAM punaruktapradarSanaprayAsena .. 2 ..
    iast: |-
      atrottaraṃ-
      śrībhagavānuvāca
      kāmyānāṃ karmaṇāṃ tyāgaṃ saṃnyāsaṃ kavayo viduḥ | sarvakarmaphalatyāgaṃ prāhustyāgaṃ vicakṣaṇāḥ || 18-2 ||
      kāmyāni-agniṣṭomādīni | sarvakarmeti | sarveṣāṃ-nityanaimittika-karmaṇāṃ kriyamāṇatve'pi phalatyāgastyāgaḥ | atra cādhyāye yadavaśiṣṭaṃ vaktavyamasti tatprāktanaireva tatrabhavadbhaṭṭabhāskarādibhirvitatya vimṛṣṭamiti kimasmākaṃ tadgūḍhārthaprakāśanamātrapratijñānirvāhaṇasārāṇāṃ punaruktapradarśanaprayāsena || 2 ||
  - verse: 3
    devanagari: |-
      तदत्रैव विशेषनिर्णयाय मतान्युपन्यस्यति-
      त्याज्यं दोषवदित्येके कर्म प्राहुर्मनीषिणः । यज्ञदानतपःकर्म न त्याज्यमिति चापरे ॥ १८-३ ॥
      इत्यन्यान् यज्ञादीन् हिंसादियोगिनोऽपि न त्यजेत् । शास्त्रैकशरणकार्याकार्यविभागाः पण्डिता इति मन्यन्ते ॥ ३ ॥
    slp1: |-
      tadatrEva viSezanirRayAya matAnyupanyasyati-
      tyAjyaM dozavadityeke karma prAhurmanIziRaH . yajYadAnatapaHkarma na tyAjyamiti cApare .. 18-3 ..
      ityanyAn yajYAdIn hiMsAdiyogino'pi na tyajet . SAstrEkaSaraRakAryAkAryaviBAgAH paRqitA iti manyante .. 3 ..
    iast: |-
      tadatraiva viśeṣanirṇayāya matānyupanyasyati-
      tyājyaṃ doṣavadityeke karma prāhurmanīṣiṇaḥ | yajñadānatapaḥkarma na tyājyamiti cāpare || 18-3 ||
      ityanyān yajñādīn hiṃsādiyogino'pi na tyajet | śāstraikaśaraṇakāryākāryavibhāgāḥ paṇḍitā iti manyante || 3 ||
  - verse: 4
    devanagari: |-
      निश्चयं शृणु मे तत्र त्यागे भरतसत्तम । त्यागो हि पुरुषव्याघ्र त्रिविधः सम्प्रकीर्तितः ॥ १८-४ ॥
    slp1: |-
      niScayaM SfRu me tatra tyAge Baratasattama . tyAgo hi puruzavyAGra triviDaH samprakIrtitaH .. 18-4 ..
    iast: |-
      niścayaṃ śṛṇu me tatra tyāge bharatasattama | tyāgo hi puruṣavyāghra trividhaḥ samprakīrtitaḥ || 18-4 ||
  - verse: 5
    devanagari: |-
      यज्ञदानतपःकर्म न त्याज्यं कार्यमेव तत् । यज्ञो दानं तपश्चैव पावनानि मनीषिणाम् ॥ १८-५ ॥
    slp1: |-
      yajYadAnatapaHkarma na tyAjyaM kAryameva tat . yajYo dAnaM tapaScEva pAvanAni manIziRAm .. 18-5 ..
    iast: |-
      yajñadānatapaḥkarma na tyājyaṃ kāryameva tat | yajño dānaṃ tapaścaiva pāvanāni manīṣiṇām || 18-5 ||
  - verse: 6
    devanagari: |-
      एतान्यपि च कर्माणि सङ्गं त्यक्त्वा फलानि च । कर्तव्यानीति मे पार्थ निश्चितं मतमुत्तमम् ॥ १८-६ ॥
    slp1: |-
      etAnyapi ca karmARi saNgaM tyaktvA PalAni ca . kartavyAnIti me pArTa niScitaM matamuttamam .. 18-6 ..
    iast: |-
      etānyapi ca karmāṇi saṅgaṃ tyaktvā phalāni ca | kartavyānīti me pārtha niścitaṃ matamuttamam || 18-6 ||
  - verse: 7
    devanagari: |-
      नियतस्य च संन्यासः कर्मणो नोपपद्यते । मोहात्तस्य परित्यागस्तामसः परिकीर्तितः ॥ १८-७ ॥
    slp1: |-
      niyatasya ca saMnyAsaH karmaRo nopapadyate . mohAttasya parityAgastAmasaH parikIrtitaH .. 18-7 ..
    iast: |-
      niyatasya ca saṃnyāsaḥ karmaṇo nopapadyate | mohāttasya parityāgastāmasaḥ parikīrtitaḥ || 18-7 ||
  - verse: 8
    devanagari: |-
      दुःखमित्येव यः कर्म कायक्लेशभयात् त्यजेत् । स कृत्वा राजसं त्यागं नैव त्यागफलं लभेत् ॥ १८-८ ॥
    slp1: |-
      duHKamityeva yaH karma kAyakleSaBayAt tyajet . sa kftvA rAjasaM tyAgaM nEva tyAgaPalaM laBet .. 18-8 ..
    iast: |-
      duḥkhamityeva yaḥ karma kāyakleśabhayāt tyajet | sa kṛtvā rājasaṃ tyāgaṃ naiva tyāgaphalaṃ labhet || 18-8 ||
  - verse: 9
    devanagari: |-
      कार्यमित्येव यत्कर्म नियतं क्रियतेऽर्जुन । सङ्गं त्यक्त्वा फलं चैव स त्यागः सात्त्विको मतः ॥ १८-९ ॥
    slp1: |-
      kAryamityeva yatkarma niyataM kriyate'rjuna . saNgaM tyaktvA PalaM cEva sa tyAgaH sAttviko mataH .. 18-9 ..
    iast: |-
      kāryamityeva yatkarma niyataṃ kriyate'rjuna | saṅgaṃ tyaktvā phalaṃ caiva sa tyāgaḥ sāttviko mataḥ || 18-9 ||
  - verse: 10
    devanagari: |-
      न द्वेष्ट्यकुशलं कर्म कुशले नानुषज्जते । त्यागी सत्त्वसमाविष्टो मेधावी छिन्नसंशयः ॥ १८-१० ॥
    slp1: |-
      na dvezwyakuSalaM karma kuSale nAnuzajjate . tyAgI sattvasamAvizwo meDAvI CinnasaMSayaH .. 18-10 ..
    iast: |-
      na dveṣṭyakuśalaṃ karma kuśale nānuṣajjate | tyāgī sattvasamāviṣṭo medhāvī chinnasaṃśayaḥ || 18-10 ||
  - verse: 11
    devanagari: |-
      नहि देहभृता शक्यं त्यक्तुं कर्माण्यशेषतः । यस्तु कर्मफलत्यागी स त्यागीत्यभिधीयते ॥ १८-११ ॥
      तत्र त्वयं निश्चयः-प्राग्लक्षितगुणस्वरूपवैचित्र्यात्त्यागस्यैव सत्त्वरजस्तमोमय्या चित्तवृत्त्या क्रियमाणस्य तद्विशिष्टस्वभावावभासिवस्तुस्थित्या त्यागो नाम-परब्रह्मविदां सिद्ध्यसिद्ध्यादिषु समतया रागद्वेषपरिहारेण फलप्रेप्साविरहेण कर्मणां निर्वर्तनम् । अत एवाह-राजसं तामसं च त्यागं कृत्वा न कश्चित्फलसंबन्धः इति । सात्त्विकस्य तु त्यागात् शास्त्रार्थपालनात्मकं फलम् । त्यक्तगुणग्रामग्रहस्य पुनर्मुनेः सत्यतस्त्यागवाचोयुक्तिरुपपत्तिमती ॥ ११ ॥
    slp1: |-
      nahi dehaBftA SakyaM tyaktuM karmARyaSezataH . yastu karmaPalatyAgI sa tyAgItyaBiDIyate .. 18-11 ..
      tatra tvayaM niScayaH-prAglakzitaguRasvarUpavEcitryAttyAgasyEva sattvarajastamomayyA cittavfttyA kriyamARasya tadviSizwasvaBAvAvaBAsivastusTityA tyAgo nAma-parabrahmavidAM sidDyasidDyAdizu samatayA rAgadvezaparihAreRa PalaprepsAviraheRa karmaRAM nirvartanam . ata evAha-rAjasaM tAmasaM ca tyAgaM kftvA na kaScitPalasaMbanDaH iti . sAttvikasya tu tyAgAt SAstrArTapAlanAtmakaM Palam . tyaktaguRagrAmagrahasya punarmuneH satyatastyAgavAcoyuktirupapattimatI .. 11 ..
    iast: |-
      nahi dehabhṛtā śakyaṃ tyaktuṃ karmāṇyaśeṣataḥ | yastu karmaphalatyāgī sa tyāgītyabhidhīyate || 18-11 ||
      tatra tvayaṃ niścayaḥ-prāglakṣitaguṇasvarūpavaicitryāttyāgasyaiva sattvarajastamomayyā cittavṛttyā kriyamāṇasya tadviśiṣṭasvabhāvāvabhāsivastusthityā tyāgo nāma-parabrahmavidāṃ siddhyasiddhyādiṣu samatayā rāgadveṣaparihāreṇa phalaprepsāviraheṇa karmaṇāṃ nirvartanam | ata evāha-rājasaṃ tāmasaṃ ca tyāgaṃ kṛtvā na kaścitphalasaṃbandhaḥ iti | sāttvikasya tu tyāgāt śāstrārthapālanātmakaṃ phalam | tyaktaguṇagrāmagrahasya punarmuneḥ satyatastyāgavācoyuktirupapattimatī || 11 ||
  - verse: 12
    devanagari: |-
      अनिष्टमिष्टं मिश्रं च त्रिविधं कर्मणः फलम् । भवत्यत्यागिनां प्रेत्य न तु संन्यासिनां क्वचित् ॥ १८-१२ ॥
      अत्यागिनाम्-फलमयानाम् ॥ १२ ॥
    slp1: |-
      anizwamizwaM miSraM ca triviDaM karmaRaH Palam . BavatyatyAginAM pretya na tu saMnyAsinAM kvacit .. 18-12 ..
      atyAginAm-PalamayAnAm .. 12 ..
    iast: |-
      aniṣṭamiṣṭaṃ miśraṃ ca trividhaṃ karmaṇaḥ phalam | bhavatyatyāgināṃ pretya na tu saṃnyāsināṃ kvacit || 18-12 ||
      atyāginām-phalamayānām || 12 ||
  - verse: 13
    devanagari: |-
      अधुना व्यवहारदशायामपि पञ्चस्वपि कर्महेतुषु स्थितेषु बलादेवामी अविद्यान्धाः पुमांसः स्वात्मन्येव सकलकर्तृभावभारमारोपयन्ति । अतो निजयैव धियात्मानं बध्नन्ति नतु वस्तुस्थित्या अस्य बन्धः-इत्युपदिश्यते-
      पञ्चेमानि महाबाहो कारणानि निबोध मे । साङ्ख्ये कृतान्ते प्रोक्तानि सिद्धये सर्वकर्मणाम् ॥ १८-१३ ॥
      कृतोऽन्तो निश्चयो यत्रेति कृतान्तः-सिद्धान्तः ॥ १३ ॥
    slp1: |-
      aDunA vyavahAradaSAyAmapi paYcasvapi karmahetuzu sTitezu balAdevAmI avidyAnDAH pumAMsaH svAtmanyeva sakalakartfBAvaBAramAropayanti . ato nijayEva DiyAtmAnaM baDnanti natu vastusTityA asya banDaH-ityupadiSyate-
      paYcemAni mahAbAho kAraRAni niboDa me . sANKye kftAnte proktAni sidDaye sarvakarmaRAm .. 18-13 ..
      kfto'nto niScayo yatreti kftAntaH-sidDAntaH .. 13 ..
    iast: |-
      adhunā vyavahāradaśāyāmapi pañcasvapi karmahetuṣu sthiteṣu balādevāmī avidyāndhāḥ pumāṃsaḥ svātmanyeva sakalakartṛbhāvabhāramāropayanti | ato nijayaiva dhiyātmānaṃ badhnanti natu vastusthityā asya bandhaḥ-ityupadiśyate-
      pañcemāni mahābāho kāraṇāni nibodha me | sāṅkhye kṛtānte proktāni siddhaye sarvakarmaṇām || 18-13 ||
      kṛto'nto niścayo yatreti kṛtāntaḥ-siddhāntaḥ || 13 ||
  - verse: 14
    devanagari: |-
      अधिष्ठानं तथा कर्ता करणं च पृथग्विधम् । विविधाश्च पृथक्चेष्टा दैवमेवात्र पञ्चमम् ॥ १८-१४ ॥
    slp1: |-
      aDizWAnaM taTA kartA karaRaM ca pfTagviDam . viviDASca pfTakcezwA dEvamevAtra paYcamam .. 18-14 ..
    iast: |-
      adhiṣṭhānaṃ tathā kartā karaṇaṃ ca pṛthagvidham | vividhāśca pṛthakceṣṭā daivamevātra pañcamam || 18-14 ||
  - verse: 15
    devanagari: |-
      शरीरवाङ्मनोभिर्हि यत्कर्मारभतेऽर्जुन । न्याय्यं वा विपरीतं वा पञ्चैते तस्य हेतवः ॥ १८-१५ ॥
    slp1: |-
      SarIravANmanoBirhi yatkarmAraBate'rjuna . nyAyyaM vA viparItaM vA paYcEte tasya hetavaH .. 18-15 ..
    iast: |-
      śarīravāṅmanobhirhi yatkarmārabhate'rjuna | nyāyyaṃ vā viparītaṃ vā pañcaite tasya hetavaḥ || 18-15 ||
  - verse: 16
    devanagari: |-
      तत्रैवं सति कर्तारमात्मानं केवलं तु यः । पश्यत्यकृतबुद्धित्वान्न स पश्यति दुर्मतिः ॥ १८-१६ ॥
    slp1: |-
      tatrEvaM sati kartAramAtmAnaM kevalaM tu yaH . paSyatyakftabudDitvAnna sa paSyati durmatiH .. 18-16 ..
    iast: |-
      tatraivaṃ sati kartāramātmānaṃ kevalaṃ tu yaḥ | paśyatyakṛtabuddhitvānna sa paśyati durmatiḥ || 18-16 ||
  - verse: 17
    devanagari: |-
      यस्य नाहंकृतो भावो बुद्धिर्यस्य न लिप्यते । हत्वापि स इमाꣳल्लोकान्न हन्ति न निबध्यते ॥ १८-१७ ॥
      अधिष्ठानम्-विषयः । दैवम्-प्रागर्जितं शुभाशुभम् । पञ्चैते अधिष्ठाना-दयः सामग्रीरूपतां प्राप्ताः सर्वकर्मसु हेतवः । अन्ये तु अधिष्ठीयते अनेन सर्वं कर्मेति बुद्धिगतं रजो लब्धवृत्तिकं धृतिश्रद्धासुखविविदिषाविविदिषारूपपञ्चकपरिणामिकर्मयोग शब्द-वाच्यमधिष्ठानं क्वचित्प्रयत्नशब्देनोक्तम् । कर्ता-अनुसन्धाता बुद्धिलक्षणः । करणम्-मनश्चक्षुरादि बाह्यमपि च खड्गादि । चेष्टाप्राणापानादिका । दैवशब्देन धर्माधर्मौ । ताभ्यां च बुद्धिगताः सर्वेऽपि भावा उपलक्षिताः । अन्ये त्वधिष्ठानमीश्वरं मन्यन्ते-अकृतबुद्धित्वादनिश्चितप्रज्ञतया । यः पुनरहंकारवियोगदार्ढ्येन प्रागुक्तयुक्तिशतशोधितेन कर्माणि करोति न स बन्धभाक्-कृतबुद्धित्वादित्याशयः ॥ १७ ॥
    slp1: |-
      yasya nAhaMkfto BAvo budDiryasya na lipyate . hatvApi sa imAṁllokAnna hanti na nibaDyate .. 18-17 ..
      aDizWAnam-vizayaH . dEvam-prAgarjitaM SuBASuBam . paYcEte aDizWAnA-dayaH sAmagrIrUpatAM prAptAH sarvakarmasu hetavaH . anye tu aDizWIyate anena sarvaM karmeti budDigataM rajo labDavfttikaM DftiSradDAsuKavividizAvividizArUpapaYcakapariRAmikarmayoga Sabda-vAcyamaDizWAnaM kvacitprayatnaSabdenoktam . kartA-anusanDAtA budDilakzaRaH . karaRam-manaScakzurAdi bAhyamapi ca KaqgAdi . cezwAprARApAnAdikA . dEvaSabdena DarmADarmO . tAByAM ca budDigatAH sarve'pi BAvA upalakzitAH . anye tvaDizWAnamISvaraM manyante-akftabudDitvAdaniScitaprajYatayA . yaH punarahaMkAraviyogadArQyena prAguktayuktiSataSoDitena karmARi karoti na sa banDaBAk-kftabudDitvAdityASayaH .. 17 ..
    iast: |-
      yasya nāhaṃkṛto bhāvo buddhiryasya na lipyate | hatvāpi sa imāṁllokānna hanti na nibadhyate || 18-17 ||
      adhiṣṭhānam-viṣayaḥ | daivam-prāgarjitaṃ śubhāśubham | pañcaite adhiṣṭhānā-dayaḥ sāmagrīrūpatāṃ prāptāḥ sarvakarmasu hetavaḥ | anye tu adhiṣṭhīyate anena sarvaṃ karmeti buddhigataṃ rajo labdhavṛttikaṃ dhṛtiśraddhāsukhavividiṣāvividiṣārūpapañcakapariṇāmikarmayoga śabda-vācyamadhiṣṭhānaṃ kvacitprayatnaśabdenoktam | kartā-anusandhātā buddhilakṣaṇaḥ | karaṇam-manaścakṣurādi bāhyamapi ca khaḍgādi | ceṣṭāprāṇāpānādikā | daivaśabdena dharmādharmau | tābhyāṃ ca buddhigatāḥ sarve'pi bhāvā upalakṣitāḥ | anye tvadhiṣṭhānamīśvaraṃ manyante-akṛtabuddhitvādaniścitaprajñatayā | yaḥ punarahaṃkāraviyogadārḍhyena prāguktayuktiśataśodhitena karmāṇi karoti na sa bandhabhāk-kṛtabuddhitvādityāśayaḥ || 17 ||
  - verse: 18
    devanagari: |-
      ज्ञानं ज्ञेयं परिज्ञाता त्रिविधा कर्मचोदना । करणं कर्म कर्तेति त्रिविधः कर्मसंग्रहः ॥ १८-१८ ॥
      कर्मणि चोदना-प्रवृत्तीच्छा । तत्समये येषामबोधमात्रनिष्ठत्वाज्ज्ञानज्ञेयज्ञातृश्रुतिवाच्यता तेषामेव सम्यग्ग्रहणरूपं यत्फलाभिसंधानेनात्मीयबुद्ध्या स्वीकरणम्-अहमेतद्भोक्ष्ये यतो मया कृतम्-इत्येवंरूपम् तत्समये तथा निर्वर्तनावसरे करणकर्मकर्तृशब्दामिधेयत्वमाविष्टत्वात् । अतो योगिनामावेशो नास्तीति तान्प्रति करणादिगिरां प्रसङ्गो नास्ति अपितु ज्ञानमात्रे एव तात्पर्यम् ॥ १८ ॥
    slp1: |-
      jYAnaM jYeyaM parijYAtA triviDA karmacodanA . karaRaM karma karteti triviDaH karmasaMgrahaH .. 18-18 ..
      karmaRi codanA-pravfttIcCA . tatsamaye yezAmaboDamAtranizWatvAjjYAnajYeyajYAtfSrutivAcyatA tezAmeva samyaggrahaRarUpaM yatPalABisaMDAnenAtmIyabudDyA svIkaraRam-ahametadBokzye yato mayA kftam-ityevaMrUpam tatsamaye taTA nirvartanAvasare karaRakarmakartfSabdAmiDeyatvamAvizwatvAt . ato yoginAmAveSo nAstIti tAnprati karaRAdigirAM prasaNgo nAsti apitu jYAnamAtre eva tAtparyam .. 18 ..
    iast: |-
      jñānaṃ jñeyaṃ parijñātā trividhā karmacodanā | karaṇaṃ karma karteti trividhaḥ karmasaṃgrahaḥ || 18-18 ||
      karmaṇi codanā-pravṛttīcchā | tatsamaye yeṣāmabodhamātraniṣṭhatvājjñānajñeyajñātṛśrutivācyatā teṣāmeva samyaggrahaṇarūpaṃ yatphalābhisaṃdhānenātmīyabuddhyā svīkaraṇam-ahametadbhokṣye yato mayā kṛtam-ityevaṃrūpam tatsamaye tathā nirvartanāvasare karaṇakarmakartṛśabdāmidheyatvamāviṣṭatvāt | ato yogināmāveśo nāstīti tānprati karaṇādigirāṃ prasaṅgo nāsti apitu jñānamātre eva tātparyam || 18 ||
  - verse: 19
    devanagari: |-
      अथैषां षण्णामपि संक्षेपेण गुणभेदाद्भेदं दर्शयितुमाह-
      ज्ञानं कर्म च कर्ता च त्रिधैव गुणभेदतः । प्रोच्यते गुणसङ्ख्याने यथावच्छृणु तान्यपि ॥ १८-१९ ॥
      गुणानां संख्यानं-निश्चयो यत्र तत्र सांख्यीयकृतान्ते ज्ञानादि त्रिविधमुच्यते यत्तच्छृण्विति संगतिः । ज्ञानम्-इत्यनेन ज्ञाने क्रियायां च यत्करणं तद्द्विविधमुक्तम् । एवं कर्मेति ज्ञेयं कार्यं च । ज्ञाता कर्ता चेति ॥ १९ ॥
    slp1: |-
      aTEzAM zaRRAmapi saMkzepeRa guRaBedAdBedaM darSayitumAha-
      jYAnaM karma ca kartA ca triDEva guRaBedataH . procyate guRasaNKyAne yaTAvacCfRu tAnyapi .. 18-19 ..
      guRAnAM saMKyAnaM-niScayo yatra tatra sAMKyIyakftAnte jYAnAdi triviDamucyate yattacCfRviti saMgatiH . jYAnam-ityanena jYAne kriyAyAM ca yatkaraRaM taddviviDamuktam . evaM karmeti jYeyaM kAryaM ca . jYAtA kartA ceti .. 19 ..
    iast: |-
      athaiṣāṃ ṣaṇṇāmapi saṃkṣepeṇa guṇabhedādbhedaṃ darśayitumāha-
      jñānaṃ karma ca kartā ca tridhaiva guṇabhedataḥ | procyate guṇasaṅkhyāne yathāvacchṛṇu tānyapi || 18-19 ||
      guṇānāṃ saṃkhyānaṃ-niścayo yatra tatra sāṃkhyīyakṛtānte jñānādi trividhamucyate yattacchṛṇviti saṃgatiḥ | jñānam-ityanena jñāne kriyāyāṃ ca yatkaraṇaṃ taddvividhamuktam | evaṃ karmeti jñeyaṃ kāryaṃ ca | jñātā kartā ceti || 19 ||
  - verse: 20
    devanagari: |-
      तत्र सर्वभूतेषु इत्यादिना श्लोकत्रयेण ज्ञानकरणस्य त्रैरूप्यमुक्तम् । अत एव येन-इति तृतीया । इयता च ज्ञानकरणसामान्यस्य स्वरूपमुक्तम् । नियतम् इत्यादिना श्लोकत्रयेण कर्मणो ज्ञेयकार्यरूपस्य द्वैविध्यम् । मुक्तसङ्गः इत्यादिना श्लोकत्रयेण तु कर्तुर्द्विरूपस्य संक्षेपेण स्वरूपम् । करणविशेषस्य स्वरूपभेदप्रतिपादनार्थं बुद्धेस्त्रैविध्यं निरूपितम् तद्वारेण करणान्तराणामपि त्रैविध्यमुपलक्षितम् । करणस्य त्वितिकर्तव्यतापेक्षित्वादितिकर्तव्यतायाश्च धृत्यादिपञ्चकरूपत्वेऽपि श्रद्धायाः पूर्वमुक्तत्वाद्विविदिषाविविदिषयोश्च धृतिसुखाभ्यामाक्षेपात्तयोस्त्रैविध्यं धृत्या यया इत्यनेन सुखं त्विदानीम्-इत्यनेन चोक्तम् । तदाह
      सर्वभूतेषु येनैकं भावमव्ययमीक्षते । अविभक्तं विभक्तेषु तज्ज्ञानं विद्धि सात्त्विकम् ॥ १८-२० ॥
      विभक्तेषु-देवमनुष्यादितया ॥ २० ॥
    slp1: |-
      tatra sarvaBUtezu ityAdinA SlokatrayeRa jYAnakaraRasya trErUpyamuktam . ata eva yena-iti tftIyA . iyatA ca jYAnakaraRasAmAnyasya svarUpamuktam . niyatam ityAdinA SlokatrayeRa karmaRo jYeyakAryarUpasya dvEviDyam . muktasaNgaH ityAdinA SlokatrayeRa tu karturdvirUpasya saMkzepeRa svarUpam . karaRaviSezasya svarUpaBedapratipAdanArTaM budDestrEviDyaM nirUpitam tadvAreRa karaRAntarARAmapi trEviDyamupalakzitam . karaRasya tvitikartavyatApekzitvAditikartavyatAyASca DftyAdipaYcakarUpatve'pi SradDAyAH pUrvamuktatvAdvividizAvividizayoSca DftisuKAByAmAkzepAttayostrEviDyaM DftyA yayA ityanena suKaM tvidAnIm-ityanena coktam . tadAha
      sarvaBUtezu yenEkaM BAvamavyayamIkzate . aviBaktaM viBaktezu tajjYAnaM vidDi sAttvikam .. 18-20 ..
      viBaktezu-devamanuzyAditayA .. 20 ..
    iast: |-
      tatra sarvabhūteṣu ityādinā ślokatrayeṇa jñānakaraṇasya trairūpyamuktam | ata eva yena-iti tṛtīyā | iyatā ca jñānakaraṇasāmānyasya svarūpamuktam | niyatam ityādinā ślokatrayeṇa karmaṇo jñeyakāryarūpasya dvaividhyam | muktasaṅgaḥ ityādinā ślokatrayeṇa tu karturdvirūpasya saṃkṣepeṇa svarūpam | karaṇaviśeṣasya svarūpabhedapratipādanārthaṃ buddhestraividhyaṃ nirūpitam tadvāreṇa karaṇāntarāṇāmapi traividhyamupalakṣitam | karaṇasya tvitikartavyatāpekṣitvāditikartavyatāyāśca dhṛtyādipañcakarūpatve'pi śraddhāyāḥ pūrvamuktatvādvividiṣāvividiṣayośca dhṛtisukhābhyāmākṣepāttayostraividhyaṃ dhṛtyā yayā ityanena sukhaṃ tvidānīm-ityanena coktam | tadāha
      sarvabhūteṣu yenaikaṃ bhāvamavyayamīkṣate | avibhaktaṃ vibhakteṣu tajjñānaṃ viddhi sāttvikam || 18-20 ||
      vibhakteṣu-devamanuṣyāditayā || 20 ||
  - verse: 21
    devanagari: |-
      पृथक्त्वेन तु यज्ज्ञानं नानाभावान् पृथग्विधान् । वेत्ति सर्वेषु भूतेषु तद्राजसमिति स्मृतम् ॥ १८-२१ ॥
      पृथक्त्वेन-इह मे प्रीतिरिह मे द्वेषः-इत्यादिबुद्ध्या ॥ २१ ॥
    slp1: |-
      pfTaktvena tu yajjYAnaM nAnABAvAn pfTagviDAn . vetti sarvezu BUtezu tadrAjasamiti smftam .. 18-21 ..
      pfTaktvena-iha me prItiriha me dvezaH-ityAdibudDyA .. 21 ..
    iast: |-
      pṛthaktvena tu yajjñānaṃ nānābhāvān pṛthagvidhān | vetti sarveṣu bhūteṣu tadrājasamiti smṛtam || 18-21 ||
      pṛthaktvena-iha me prītiriha me dveṣaḥ-ityādibuddhyā || 21 ||
  - verse: 22
    devanagari: |-
      यत्तु कृत्स्नवदेकस्मिनत्कार्ये सक्तमहेतुकम् । अतत्त्वार्थवदल्पं च तत्तामसमुदाहृतम् ॥ १८-२२ ॥
      अहेतुकम्-कारणमविचार्यैव अभिनिवेशावेशवशात् क्रोधरागादिग्रहणं यत्तत्तामससंज्ञम् ॥ २२ ॥
    slp1: |-
      yattu kftsnavadekasminatkArye saktamahetukam . atattvArTavadalpaM ca tattAmasamudAhftam .. 18-22 ..
      ahetukam-kAraRamavicAryEva aBiniveSAveSavaSAt kroDarAgAdigrahaRaM yattattAmasasaMjYam .. 22 ..
    iast: |-
      yattu kṛtsnavadekasminatkārye saktamahetukam | atattvārthavadalpaṃ ca tattāmasamudāhṛtam || 18-22 ||
      ahetukam-kāraṇamavicāryaiva abhiniveśāveśavaśāt krodharāgādigrahaṇaṃ yattattāmasasaṃjñam || 22 ||
  - verse: 23
    devanagari: |-
      नियतं सङ्गरहितमरागद्वेषतः कृतम् । अफलप्रेप्सुना कर्म यत्तत् सात्त्विकमुच्यते ॥ १८-२३ ॥
      नियतम्-कर्तव्यमिति ॥ २३ ॥
    slp1: |-
      niyataM saNgarahitamarAgadvezataH kftam . aPalaprepsunA karma yattat sAttvikamucyate .. 18-23 ..
      niyatam-kartavyamiti .. 23 ..
    iast: |-
      niyataṃ saṅgarahitamarāgadveṣataḥ kṛtam | aphalaprepsunā karma yattat sāttvikamucyate || 18-23 ||
      niyatam-kartavyamiti || 23 ||
  - verse: 24
    devanagari: |-
      यत्तु कामेप्सुना कर्म साहङ्कारेण वा पुनः । क्रियते क्लेशबहुलं तद्राजसमिति स्मृतम् ॥ १८-२४ ॥
      क्लेशैः-अविद्याद्यैः बहुलम्-व्याप्तम् ॥ २४ ॥
    slp1: |-
      yattu kAmepsunA karma sAhaNkAreRa vA punaH . kriyate kleSabahulaM tadrAjasamiti smftam .. 18-24 ..
      kleSEH-avidyAdyEH bahulam-vyAptam .. 24 ..
    iast: |-
      yattu kāmepsunā karma sāhaṅkāreṇa vā punaḥ | kriyate kleśabahulaṃ tadrājasamiti smṛtam || 18-24 ||
      kleśaiḥ-avidyādyaiḥ bahulam-vyāptam || 24 ||
  - verse: 25
    devanagari: |-
      अनुबन्धं क्षयं हिंसामनवेक्ष्य च पौरुषम् । मोहादारभ्यते कर्म यत्तत्तामसमुच्यते ॥ १८-२५ ॥
      मोहात्-अभिनिवेशमयात् ॥ २५ ॥
    slp1: |-
      anubanDaM kzayaM hiMsAmanavekzya ca pOruzam . mohAdAraByate karma yattattAmasamucyate .. 18-25 ..
      mohAt-aBiniveSamayAt .. 25 ..
    iast: |-
      anubandhaṃ kṣayaṃ hiṃsāmanavekṣya ca pauruṣam | mohādārabhyate karma yattattāmasamucyate || 18-25 ||
      mohāt-abhiniveśamayāt || 25 ||
  - verse: 26
    devanagari: |-
      मुक्तसङ्गोऽनहंवादी धृत्युत्साहसमन्वितः । सिद्ध्यसिद्ध्योर्निर्विकारः कर्ता सात्त्विक उच्यते ॥ १८-२६ ॥
      अहं कर्ता इति न वदन् तच्छीलस्तद्धर्मा तत्साधुकारी वा यो भवतीति-अनहंवादी-इत्यनेन णिनिना व्यवहारमात्रसंवृतिवशेन योगिनोऽपि अहं करोमि-इति वचो न निषिद्धम् ॥ २६ ॥
    slp1: |-
      muktasaNgo'nahaMvAdI DftyutsAhasamanvitaH . sidDyasidDyornirvikAraH kartA sAttvika ucyate .. 18-26 ..
      ahaM kartA iti na vadan tacCIlastadDarmA tatsADukArI vA yo BavatIti-anahaMvAdI-ityanena RininA vyavahAramAtrasaMvftivaSena yogino'pi ahaM karomi-iti vaco na nizidDam .. 26 ..
    iast: |-
      muktasaṅgo'nahaṃvādī dhṛtyutsāhasamanvitaḥ | siddhyasiddhyornirvikāraḥ kartā sāttvika ucyate || 18-26 ||
      ahaṃ kartā iti na vadan tacchīlastaddharmā tatsādhukārī vā yo bhavatīti-anahaṃvādī-ityanena ṇininā vyavahāramātrasaṃvṛtivaśena yogino'pi ahaṃ karomi-iti vaco na niṣiddham || 26 ||
  - verse: 27
    devanagari: |-
      रागी कर्मफलप्रेप्सुर्लुब्धो हिंसात्मकोऽशुचिः । हर्षशोकान्वितः कर्ता राजसः परकीर्त्यते ॥ १८-२७ ॥
      हर्षशोकान्वितः-सिद्ध्यसिद्ध्योः ॥ २७ ॥
    slp1: |-
      rAgI karmaPalaprepsurlubDo hiMsAtmako'SuciH . harzaSokAnvitaH kartA rAjasaH parakIrtyate .. 18-27 ..
      harzaSokAnvitaH-sidDyasidDyoH .. 27 ..
    iast: |-
      rāgī karmaphalaprepsurlubdho hiṃsātmako'śuciḥ | harṣaśokānvitaḥ kartā rājasaḥ parakīrtyate || 18-27 ||
      harṣaśokānvitaḥ-siddhyasiddhyoḥ || 27 ||
  - verse: 28
    devanagari: |-
      अयुक्तः प्राकृतः स्तब्धः शठो नैष्कृतिकोऽलसः । विषादी दीर्घसूत्रश्च कर्ता तामस उच्यते ॥ १८-२८ ॥
      निकृतिः-नैर्घृण्यम् ॥ २८ ॥
    slp1: |-
      ayuktaH prAkftaH stabDaH SaWo nEzkftiko'lasaH . vizAdI dIrGasUtraSca kartA tAmasa ucyate .. 18-28 ..
      nikftiH-nErGfRyam .. 28 ..
    iast: |-
      ayuktaḥ prākṛtaḥ stabdhaḥ śaṭho naiṣkṛtiko'lasaḥ | viṣādī dīrghasūtraśca kartā tāmasa ucyate || 18-28 ||
      nikṛtiḥ-nairghṛṇyam || 28 ||
  - verse: 29
    devanagari: |-
      बुद्धेर्भेदं धृतेश्चैव गुणतस्त्रिविधं शृणु । प्रोच्यमानमशेषेण पृथक्त्वेन धनञ्जय ॥ १८-२९ ॥
      बुद्धिः-निश्चयः । धृतिः-सन्तोषः । सर्वो हि सुकृतं दुष्कृतं वा कृत्वा अन्ते अवश्यं कृतं करणीयं किमन्येन-इति धियं गृह्णाति । अन्यथा क्रियाभ्यो व्युपरमे को हेतुः स्यात् । अतः सर्वस्यैव धृतिरस्तीति तात्पर्यार्थः । पदार्थस्त्वप्रसिद्धो व्याख्यायत एव ॥ २९ ॥
    slp1: |-
      budDerBedaM DfteScEva guRatastriviDaM SfRu . procyamAnamaSezeRa pfTaktvena DanaYjaya .. 18-29 ..
      budDiH-niScayaH . DftiH-santozaH . sarvo hi sukftaM duzkftaM vA kftvA ante avaSyaM kftaM karaRIyaM kimanyena-iti DiyaM gfhRAti . anyaTA kriyAByo vyuparame ko hetuH syAt . ataH sarvasyEva DftirastIti tAtparyArTaH . padArTastvaprasidDo vyAKyAyata eva .. 29 ..
    iast: |-
      buddherbhedaṃ dhṛteścaiva guṇatastrividhaṃ śṛṇu | procyamānamaśeṣeṇa pṛthaktvena dhanañjaya || 18-29 ||
      buddhiḥ-niścayaḥ | dhṛtiḥ-santoṣaḥ | sarvo hi sukṛtaṃ duṣkṛtaṃ vā kṛtvā ante avaśyaṃ kṛtaṃ karaṇīyaṃ kimanyena-iti dhiyaṃ gṛhṇāti | anyathā kriyābhyo vyuparame ko hetuḥ syāt | ataḥ sarvasyaiva dhṛtirastīti tātparyārthaḥ | padārthastvaprasiddho vyākhyāyata eva || 29 ||
  - verse: 30
    devanagari: |-
      प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये । बन्धं मोक्षं च या बुद्धिर्वेद सा पार्थ सात्वकी मता ॥ १८-३० ॥
    slp1: |-
      pravfttiM ca nivfttiM ca kAryAkArye BayABaye . banDaM mokzaM ca yA budDirveda sA pArTa sAtvakI matA .. 18-30 ..
    iast: |-
      pravṛttiṃ ca nivṛttiṃ ca kāryākārye bhayābhaye | bandhaṃ mokṣaṃ ca yā buddhirveda sā pārtha sātvakī matā || 18-30 ||
  - verse: 31
    devanagari: |-
      यया धर्ममधर्मं च कार्यं चाकार्यमेव च । अयथावत् प्रजानाति बुद्धिः सा पार्थ राजसी ॥ १८-३१ ॥
      अयथावत्-असम्यक् ॥ ३१ ॥
    slp1: |-
      yayA DarmamaDarmaM ca kAryaM cAkAryameva ca . ayaTAvat prajAnAti budDiH sA pArTa rAjasI .. 18-31 ..
      ayaTAvat-asamyak .. 31 ..
    iast: |-
      yayā dharmamadharmaṃ ca kāryaṃ cākāryameva ca | ayathāvat prajānāti buddhiḥ sā pārtha rājasī || 18-31 ||
      ayathāvat-asamyak || 31 ||
  - verse: 32
    devanagari: |-
      अधर्मं धर्ममिति या बुद्ध्यते तमसान्विता । सर्वार्थान्विपरीतांश्च बुद्धिः सा तामसी मता ॥ १८-३२ ॥
    slp1: |-
      aDarmaM Darmamiti yA budDyate tamasAnvitA . sarvArTAnviparItAMSca budDiH sA tAmasI matA .. 18-32 ..
    iast: |-
      adharmaṃ dharmamiti yā buddhyate tamasānvitā | sarvārthānviparītāṃśca buddhiḥ sā tāmasī matā || 18-32 ||
  - verse: 33
    devanagari: |-
      धृत्या मया धारयते मनःप्राणेन्द्रियक्रियाः । योगेनाव्यभिचारिण्या धृतिः सा सात्त्विकीमता ॥ १८-३३ ॥
      मनःप्राणेन्द्रियक्रियाः योगेन धारयति यता किं ममोपभोगादिभिः सर्वथैवात्मारामो भूयासम्-इति मन्वानः ॥ ३३ ॥
    slp1: |-
      DftyA mayA DArayate manaHprARendriyakriyAH . yogenAvyaBicAriRyA DftiH sA sAttvikImatA .. 18-33 ..
      manaHprARendriyakriyAH yogena DArayati yatA kiM mamopaBogAdiBiH sarvaTEvAtmArAmo BUyAsam-iti manvAnaH .. 33 ..
    iast: |-
      dhṛtyā mayā dhārayate manaḥprāṇendriyakriyāḥ | yogenāvyabhicāriṇyā dhṛtiḥ sā sāttvikīmatā || 18-33 ||
      manaḥprāṇendriyakriyāḥ yogena dhārayati yatā kiṃ mamopabhogādibhiḥ sarvathaivātmārāmo bhūyāsam-iti manvānaḥ || 33 ||
  - verse: 34
    devanagari: |-
      यया तु धर्मकामार्थान्धृत्या धारयतेऽर्जुन । प्रसङ्गेन फलाकांक्षी धृतिः सा पार्थ राजसी ॥ १८-३४ ॥
      प्रसङ्गेनेति-न तथाभिनिवेशेन ॥ ३४ ॥
    slp1: |-
      yayA tu DarmakAmArTAnDftyA DArayate'rjuna . prasaNgena PalAkAMkzI DftiH sA pArTa rAjasI .. 18-34 ..
      prasaNgeneti-na taTABiniveSena .. 34 ..
    iast: |-
      yayā tu dharmakāmārthāndhṛtyā dhārayate'rjuna | prasaṅgena phalākāṃkṣī dhṛtiḥ sā pārtha rājasī || 18-34 ||
      prasaṅgeneti-na tathābhiniveśena || 34 ||
  - verse: 35
    devanagari: |-
      यया स्वप्नं भयं शोकं विषादं मोहमेव च । न विमुञ्चति दुर्मेधा धृतिः सा तामसी मता ॥ १८-३५ ॥
      निद्राकलहादिष्वेव यया सन्तोषं बध्नाति तत्परतया-सा तामसी धृतिः ॥ ३५ ॥
    slp1: |-
      yayA svapnaM BayaM SokaM vizAdaM mohameva ca . na vimuYcati durmeDA DftiH sA tAmasI matA .. 18-35 ..
      nidrAkalahAdizveva yayA santozaM baDnAti tatparatayA-sA tAmasI DftiH .. 35 ..
    iast: |-
      yayā svapnaṃ bhayaṃ śokaṃ viṣādaṃ mohameva ca | na vimuñcati durmedhā dhṛtiḥ sā tāmasī matā || 18-35 ||
      nidrākalahādiṣveva yayā santoṣaṃ badhnāti tatparatayā-sā tāmasī dhṛtiḥ || 35 ||
  - verse: 36
    devanagari: |-
      सुखं त्विदानीं त्रिविधं शृणु मे भरतर्षभ । अभ्यासाद्रमते यत्र दुःखान्तं च निगच्छति ॥ १८-३६ ॥
    slp1: |-
      suKaM tvidAnIM triviDaM SfRu me BaratarzaBa . aByAsAdramate yatra duHKAntaM ca nigacCati .. 18-36 ..
    iast: |-
      sukhaṃ tvidānīṃ trividhaṃ śṛṇu me bharatarṣabha | abhyāsādramate yatra duḥkhāntaṃ ca nigacchati || 18-36 ||
  - verse: 37
    devanagari: |-
      यत्तदात्त्वे विषमिव परिणामेऽमृतोपमम् । तत्सुखं सात्त्विकं विद्यादात्मबुद्धिप्रसादजम् ॥ १८-३७ ॥
      इत्यादि । आत्मप्रसादाद्बुद्धिप्रसादो जायते-अन्यस्यापेक्ष्यमाणस्याभावात् ॥ ३७ ॥
    slp1: |-
      yattadAttve vizamiva pariRAme'mftopamam . tatsuKaM sAttvikaM vidyAdAtmabudDiprasAdajam .. 18-37 ..
      ityAdi . AtmaprasAdAdbudDiprasAdo jAyate-anyasyApekzyamARasyABAvAt .. 37 ..
    iast: |-
      yattadāttve viṣamiva pariṇāme'mṛtopamam | tatsukhaṃ sāttvikaṃ vidyādātmabuddhiprasādajam || 18-37 ||
      ityādi | ātmaprasādādbuddhiprasādo jāyate-anyasyāpekṣyamāṇasyābhāvāt || 37 ||
  - verse: 38
    devanagari: |-
      विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम् । परिणामे विषमिव तत् राजसमिति स्मृतम् ॥ १८-३८ ॥
      विषयेन्द्रियाणां परस्परसंयोगजं सुखम् चक्षुष इव रूपसंबन्धात् ॥ ३८ ॥
    slp1: |-
      vizayendriyasaMyogAdyattadagre'mftopamam . pariRAme vizamiva tat rAjasamiti smftam .. 18-38 ..
      vizayendriyARAM parasparasaMyogajaM suKam cakzuza iva rUpasaMbanDAt .. 38 ..
    iast: |-
      viṣayendriyasaṃyogādyattadagre'mṛtopamam | pariṇāme viṣamiva tat rājasamiti smṛtam || 18-38 ||
      viṣayendriyāṇāṃ parasparasaṃyogajaṃ sukham cakṣuṣa iva rūpasaṃbandhāt || 38 ||
  - verse: 39
    devanagari: |-
      यदग्रे चानुबन्धे च सुखं मोहनमात्मनः । निद्रालस्यप्रमादोत्थं तत्तामसमुदाहृतम् ॥ १८-३९ ॥
      निद्रातः-आलस्येन प्रमादेन पूर्वं व्याख्यातेन यत्सुखं तत्तामसम् ॥ ३९ ॥
    slp1: |-
      yadagre cAnubanDe ca suKaM mohanamAtmanaH . nidrAlasyapramAdotTaM tattAmasamudAhftam .. 18-39 ..
      nidrAtaH-Alasyena pramAdena pUrvaM vyAKyAtena yatsuKaM tattAmasam .. 39 ..
    iast: |-
      yadagre cānubandhe ca sukhaṃ mohanamātmanaḥ | nidrālasyapramādotthaṃ tattāmasamudāhṛtam || 18-39 ||
      nidrātaḥ-ālasyena pramādena pūrvaṃ vyākhyātena yatsukhaṃ tattāmasam || 39 ||
  - verse: 40
    devanagari: |-
      न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः । सत्त्वं प्रकृतिजैर्मुक्तं यदेभिः स्यात्त्रिभिर्गुणैः ॥ १८-४० ॥
    slp1: |-
      na tadasti pfTivyAM vA divi devezu vA punaH . sattvaM prakftijErmuktaM yadeBiH syAttriBirguREH .. 18-40 ..
    iast: |-
      na tadasti pṛthivyāṃ vā divi deveṣu vā punaḥ | sattvaṃ prakṛtijairmuktaṃ yadebhiḥ syāttribhirguṇaiḥ || 18-40 ||
  - verse: 41
    devanagari: |-
      एवं कर्तृकर्मकरणानां बुद्धिधृत्योः सुखस्य च सत्त्वादिभेदभिन्नानां परस्पराङ्गाङ्गिभावबाध्यबाधकत्वसमुच्चयाद्वृत्तिक्रमयौगप द्यादि-योगादपरिसंख्येयभेदत्वाद्विविधफलप्रसवसमर्थत्वम् । इत्यनेन कर्मणां प्राक् सूत्रितं गहनत्वं वितत्य सहेतुकं निर्णीतम् । सर्वे चैते देवतादिस्थावरान्ता गुणत्रयसंबन्धं नातिक्रामन्ति । उक्तं हि
      आ ब्रह्मणश्च कीटान्तं न कश्चित्तत्त्वतः सुखी । करोति विकृतीस्तास्ताः सर्व एव जिजीविषुः ॥
      इति । तत्त्वतो हि सुखं गुणातिक्रान्तमनसः नेतरस्येत्याशयः । एवमियता षण्णां प्रत्येकं त्रिस्वरूपत्वं धृत्यादीनां च प्रतिपादितम् । तन्मध्यात्सात्त्विके राशौ वर्तमानो दैवीं सम्पदं प्राप्त इह ज्ञाने योग्यः त्वं च तथाविधः-इत्यर्जुनः प्रोत्साहितः । अधुना त्विदमुच्यते-यदि तावदनया ज्ञानबुद्ध्या कर्मणि भवान्प्रवर्तते तदा स्वधर्मप्रवृत्त्या विज्ञानपूततया च न कर्मसंबन्धस्तव । अथैतन्नानुमन्यसे तदवश्यं तव प्रवृत्त्या तावद्भाव्यम् जातेरेव तथाभावे स्थितत्वात् । यतः सर्वः स्वभावनियतः कुतश्चिद्दोषात्तिरोहिततत्स्वभावः कञ्चित्काल भूत्वापि तत्तिरोधायकविगमे स्वभावं व्यक्तापन्नं लभत एव । तथाह्येवंविधो वर्णानां स्वभावः । एवमवश्यं भाविन्यां प्रवृत्तौ ततः फलविभागिता भवेत्-तदाह
      ब्राह्मणक्षत्रियविशां शूद्राणां च परन्तप । कर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः ॥ १८-४१ ॥
    slp1: |-
      evaM kartfkarmakaraRAnAM budDiDftyoH suKasya ca sattvAdiBedaBinnAnAM parasparANgANgiBAvabADyabADakatvasamuccayAdvfttikramayOgapa dyAdi-yogAdaparisaMKyeyaBedatvAdviviDaPalaprasavasamarTatvam . ityanena karmaRAM prAk sUtritaM gahanatvaM vitatya sahetukaM nirRItam . sarve cEte devatAdisTAvarAntA guRatrayasaMbanDaM nAtikrAmanti . uktaM hi
      A brahmaRaSca kIwAntaM na kaScittattvataH suKI . karoti vikftIstAstAH sarva eva jijIvizuH ..
      iti . tattvato hi suKaM guRAtikrAntamanasaH netarasyetyASayaH . evamiyatA zaRRAM pratyekaM trisvarUpatvaM DftyAdInAM ca pratipAditam . tanmaDyAtsAttvike rASO vartamAno dEvIM sampadaM prApta iha jYAne yogyaH tvaM ca taTAviDaH-ityarjunaH protsAhitaH . aDunA tvidamucyate-yadi tAvadanayA jYAnabudDyA karmaRi BavAnpravartate tadA svaDarmapravfttyA vijYAnapUtatayA ca na karmasaMbanDastava . aTEtannAnumanyase tadavaSyaM tava pravfttyA tAvadBAvyam jAtereva taTABAve sTitatvAt . yataH sarvaH svaBAvaniyataH kutaSciddozAttirohitatatsvaBAvaH kaYcitkAla BUtvApi tattiroDAyakavigame svaBAvaM vyaktApannaM laBata eva . taTAhyevaMviDo varRAnAM svaBAvaH . evamavaSyaM BAvinyAM pravfttO tataH PalaviBAgitA Bavet-tadAha
      brAhmaRakzatriyaviSAM SUdrARAM ca parantapa . karmARi praviBaktAni svaBAvapraBavErguREH .. 18-41 ..
    iast: |-
      evaṃ kartṛkarmakaraṇānāṃ buddhidhṛtyoḥ sukhasya ca sattvādibhedabhinnānāṃ parasparāṅgāṅgibhāvabādhyabādhakatvasamuccayādvṛttikramayaugapa dyādi-yogādaparisaṃkhyeyabhedatvādvividhaphalaprasavasamarthatvam | ityanena karmaṇāṃ prāk sūtritaṃ gahanatvaṃ vitatya sahetukaṃ nirṇītam | sarve caite devatādisthāvarāntā guṇatrayasaṃbandhaṃ nātikrāmanti | uktaṃ hi
      ā brahmaṇaśca kīṭāntaṃ na kaścittattvataḥ sukhī | karoti vikṛtīstāstāḥ sarva eva jijīviṣuḥ ||
      iti | tattvato hi sukhaṃ guṇātikrāntamanasaḥ netarasyetyāśayaḥ | evamiyatā ṣaṇṇāṃ pratyekaṃ trisvarūpatvaṃ dhṛtyādīnāṃ ca pratipāditam | tanmadhyātsāttvike rāśau vartamāno daivīṃ sampadaṃ prāpta iha jñāne yogyaḥ tvaṃ ca tathāvidhaḥ-ityarjunaḥ protsāhitaḥ | adhunā tvidamucyate-yadi tāvadanayā jñānabuddhyā karmaṇi bhavānpravartate tadā svadharmapravṛttyā vijñānapūtatayā ca na karmasaṃbandhastava | athaitannānumanyase tadavaśyaṃ tava pravṛttyā tāvadbhāvyam jātereva tathābhāve sthitatvāt | yataḥ sarvaḥ svabhāvaniyataḥ kutaściddoṣāttirohitatatsvabhāvaḥ kañcitkāla bhūtvāpi tattirodhāyakavigame svabhāvaṃ vyaktāpannaṃ labhata eva | tathāhyevaṃvidho varṇānāṃ svabhāvaḥ | evamavaśyaṃ bhāvinyāṃ pravṛttau tataḥ phalavibhāgitā bhavet-tadāha
      brāhmaṇakṣatriyaviśāṃ śūdrāṇāṃ ca parantapa | karmāṇi pravibhaktāni svabhāvaprabhavairguṇaiḥ || 18-41 ||
  - verse: 42
    devanagari: |-
      शमो दमस्तथाः शौचं क्षान्तिरार्जवमेव च । ज्ञानं विज्ञानमास्तिक्यं ब्राह्मं कर्म स्वभावजम् ॥ १८-४२ ॥
    slp1: |-
      Samo damastaTAH SOcaM kzAntirArjavameva ca . jYAnaM vijYAnamAstikyaM brAhmaM karma svaBAvajam .. 18-42 ..
    iast: |-
      śamo damastathāḥ śaucaṃ kṣāntirārjavameva ca | jñānaṃ vijñānamāstikyaṃ brāhmaṃ karma svabhāvajam || 18-42 ||
  - verse: 43
    devanagari: |-
      शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम् । दानमीश्वरभावश्च क्षात्रं कर्म स्वभावजम् ॥ १८-४३ ॥
    slp1: |-
      SOryaM tejo DftirdAkzyaM yudDe cApyapalAyanam . dAnamISvaraBAvaSca kzAtraM karma svaBAvajam .. 18-43 ..
    iast: |-
      śauryaṃ tejo dhṛtirdākṣyaṃ yuddhe cāpyapalāyanam | dānamīśvarabhāvaśca kṣātraṃ karma svabhāvajam || 18-43 ||
  - verse: 44
    devanagari: |-
      कृषिगोरक्ष्यवाणिज्यं वैश्यकर्म स्वभावजम् । पयुत्थानात्मकं कर्म शूद्रस्यापि स्वभावजम् ॥ १८-४४ ॥
    slp1: |-
      kfzigorakzyavARijyaM vESyakarma svaBAvajam . payutTAnAtmakaM karma SUdrasyApi svaBAvajam .. 18-44 ..
    iast: |-
      kṛṣigorakṣyavāṇijyaṃ vaiśyakarma svabhāvajam | payutthānātmakaṃ karma śūdrasyāpi svabhāvajam || 18-44 ||
  - verse: 45
    devanagari: |-
      स्वे स्वे कर्मण्यभिरतः संसिद्धिं लभते नरः । स्वकर्मनिरतः सिद्धिं यथा विन्दति तच्छृणु ॥ १८-४५ ॥
    slp1: |-
      sve sve karmaRyaBirataH saMsidDiM laBate naraH . svakarmanirataH sidDiM yaTA vindati tacCfRu .. 18-45 ..
    iast: |-
      sve sve karmaṇyabhirataḥ saṃsiddhiṃ labhate naraḥ | svakarmanirataḥ siddhiṃ yathā vindati tacchṛṇu || 18-45 ||
  - verse: 46
    devanagari: |-
      यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम् । स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः ॥ १८-४६ ॥
    slp1: |-
      yataH pravfttirBUtAnAM yena sarvamidaM tatam . svakarmaRA tamaByarcya sidDiM vindati mAnavaH .. 18-46 ..
    iast: |-
      yataḥ pravṛttirbhūtānāṃ yena sarvamidaṃ tatam | svakarmaṇā tamabhyarcya siddhiṃ vindati mānavaḥ || 18-46 ||
  - verse: 47
    devanagari: |-
      श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् । स्वभावनियतं कर्म कुर्वन्नाप्नोति किल्विषम् ॥ १८-४७ ॥
    slp1: |-
      SreyAnsvaDarmo viguRaH paraDarmAtsvanuzWitAt . svaBAvaniyataM karma kurvannApnoti kilvizam .. 18-47 ..
    iast: |-
      śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt | svabhāvaniyataṃ karma kurvannāpnoti kilviṣam || 18-47 ||
  - verse: 48
    devanagari: |-
      सहजं कर्म कौन्तेय सदोषमपि न त्यजेत् । सर्वारम्भा हि दोषेण धूमेनाऽग्निरिवावृताः ॥ १८-४८ ॥
    slp1: |-
      sahajaM karma kOnteya sadozamapi na tyajet . sarvAramBA hi dozeRa DUmenA'gnirivAvftAH .. 18-48 ..
    iast: |-
      sahajaṃ karma kaunteya sadoṣamapi na tyajet | sarvārambhā hi doṣeṇa dhūmenā'gnirivāvṛtāḥ || 18-48 ||
  - verse: 49
    devanagari: |-
      असक्तबुद्धिः सर्वत्र जितात्मा विगतस्पृहः । नैष्कर्म्यसिद्धिं परमां संन्यासेनाधिगच्छति ॥ १८-४९ ॥
    slp1: |-
      asaktabudDiH sarvatra jitAtmA vigataspfhaH . nEzkarmyasidDiM paramAM saMnyAsenADigacCati .. 18-49 ..
    iast: |-
      asaktabuddhiḥ sarvatra jitātmā vigataspṛhaḥ | naiṣkarmyasiddhiṃ paramāṃ saṃnyāsenādhigacchati || 18-49 ||
  - verse: 50
    devanagari: |-
