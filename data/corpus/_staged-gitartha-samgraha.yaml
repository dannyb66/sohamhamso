    iast: |-
      daivamevāpare yajñaṃ yoginaḥ paryupāsate | brahmāgnāvapare yajñaṃ yajñenaivopajuhvati || 4-25 ||
      apare devāni-krīḍāśīlāni indriyāṇi āśritya yaḥ sthito yajño-nijanijaviṣayagṛhaṇalakṣaṇaḥ tameva parita upāsate-āmūlādvimṛśanta svātmalābhaṃ labhante | ata eva te yoginaḥ-sarvāvasthāsu satatameva yogayuktatvāt | nityayoge hyayamatra matvarthīyaḥ | enameva ca viṣayagṛhaṇātmakaṃ yajñaṃ yajñenaiva-tenaiva lakṣaṇena apare-pūrayitumaśakye brahmāgnau juhvati-iti kaiścidyākhyātam | munestu paurvāparyāviruddhatvādyo'rtho hṛdi sthitastaṃ prakāśayāmaḥ-kecidyogayuktā santo daivaṃ-nānārūpendrādidevatoddeśenaiva bāhyadravyamayaṃ yajñamupācaranti | taṃ ca kriyamāṇameva yajñaṃ kartavyamidamityeva buddhā phalānapekṣayā apare-duṣpūre brahmāgnāvarpayanti-iti dravyayajñā api paraṃ brahma yānti | yato vakṣyate sarve'pyete yajñavidaḥ-iti | śrutirapi yajñena yajñamayajanta devāḥ-iti || 25 ||
