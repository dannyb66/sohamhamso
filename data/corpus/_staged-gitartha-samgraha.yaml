    devanagari: |-
      यया तु धर्मकामार्थान्धृत्या धारयतेऽर्जुन । प्रसङ्गेन फलाकांक्षी धृतिः सा पार्थ राजसी ॥ १८-३४ ॥
    slp1: |-
      yayA tu DarmakAmArTAnDftyA DArayate'rjuna . prasaNgena PalAkAMkzI DftiH sA pArTa rAjasI .. 18-34 ..
    iast: |-
      yayā tu dharmakāmārthāndhṛtyā dhārayate'rjuna | prasaṅgena phalākāṃkṣī dhṛtiḥ sā pārtha rājasī || 18-34 ||
  - verse_num: 35
    devanagari: |-
      यया स्वप्नं भयं शोकं विषादं मोहमेव च । न विमुञ्चति दुर्मेधा धृतिः सा तामसी मता ॥ १८-३५ ॥
    slp1: |-
      yayA svapnaM BayaM SokaM vizAdaM mohameva ca . na vimuYcati durmeDA DftiH sA tAmasI matA .. 18-35 ..
    iast: |-
      yayā svapnaṃ bhayaṃ śokaṃ viṣādaṃ mohameva ca | na vimuñcati durmedhā dhṛtiḥ sā tāmasī matā || 18-35 ||
  - verse_num: 36
    devanagari: |-
      सुखं त्विदानीं त्रिविधं शृणु मे भरतर्षभ । अभ्यासाद्रमते यत्र दुःखान्तं च निगच्छति ॥ १८-३६ ॥
    slp1: |-
      suKaM tvidAnIM triviDaM SfRu me BaratarzaBa . aByAsAdramate yatra duHKAntaM ca nigacCati .. 18-36 ..
    iast: |-
      sukhaṃ tvidānīṃ trividhaṃ śṛṇu me bharatarṣabha | abhyāsādramate yatra duḥkhāntaṃ ca nigacchati || 18-36 ||
  - verse_num: 37
    devanagari: |-
      यत्तदात्त्वे विषमिव परिणामेऽमृतोपमम् । तत्सुखं सात्त्विकं विद्यादात्मबुद्धिप्रसादजम् ॥ १८-३७ ॥
    slp1: |-
      yattadAttve vizamiva pariRAme'mftopamam . tatsuKaM sAttvikaM vidyAdAtmabudDiprasAdajam .. 18-37 ..
    iast: |-
      yattadāttve viṣamiva pariṇāme'mṛtopamam | tatsukhaṃ sāttvikaṃ vidyādātmabuddhiprasādajam || 18-37 ||
  - verse_num: 38
    devanagari: |-
      विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम् । परिणामे विषमिव तत् राजसमिति स्मृतम् ॥ १८-३८ ॥
    slp1: |-
      vizayendriyasaMyogAdyattadagre'mftopamam . pariRAme vizamiva tat rAjasamiti smftam .. 18-38 ..
    iast: |-
      viṣayendriyasaṃyogādyattadagre'mṛtopamam | pariṇāme viṣamiva tat rājasamiti smṛtam || 18-38 ||
  - verse_num: 39
    devanagari: |-
      यदग्रे चानुबन्धे च सुखं मोहनमात्मनः । निद्रालस्यप्रमादोत्थं तत्तामसमुदाहृतम् ॥ १८-३९ ॥
    slp1: |-
      yadagre cAnubanDe ca suKaM mohanamAtmanaH . nidrAlasyapramAdotTaM tattAmasamudAhftam .. 18-39 ..
    iast: |-
      yadagre cānubandhe ca sukhaṃ mohanamātmanaḥ | nidrālasyapramādotthaṃ tattāmasamudāhṛtam || 18-39 ||
  - verse_num: 40
    devanagari: |-
      न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः । सत्त्वं प्रकृतिजैर्मुक्तं यदेभिः स्यात्त्रिभिर्गुणैः ॥ १८-४० ॥
    slp1: |-
      na tadasti pfTivyAM vA divi devezu vA punaH . sattvaM prakftijErmuktaM yadeBiH syAttriBirguREH .. 18-40 ..
    iast: |-
      na tadasti pṛthivyāṃ vā divi deveṣu vā punaḥ | sattvaṃ prakṛtijairmuktaṃ yadebhiḥ syāttribhirguṇaiḥ || 18-40 ||
  - verse_num: 41
    devanagari: |-
      ब्राह्मणक्षत्रियविशां शूद्राणां च परन्तप । कर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः ॥ १८-४१ ॥
    slp1: |-
      brAhmaRakzatriyaviSAM SUdrARAM ca parantapa . karmARi praviBaktAni svaBAvapraBavErguREH .. 18-41 ..
    iast: |-
      brāhmaṇakṣatriyaviśāṃ śūdrāṇāṃ ca parantapa | karmāṇi pravibhaktāni svabhāvaprabhavairguṇaiḥ || 18-41 ||
  - verse_num: 42
    devanagari: |-
      शमो दमस्तथाः शौचं क्षान्तिरार्जवमेव च । ज्ञानं विज्ञानमास्तिक्यं ब्राह्मं कर्म स्वभावजम् ॥ १८-४२ ॥
    slp1: |-
      Samo damastaTAH SOcaM kzAntirArjavameva ca . jYAnaM vijYAnamAstikyaM brAhmaM karma svaBAvajam .. 18-42 ..
    iast: |-
      śamo damastathāḥ śaucaṃ kṣāntirārjavameva ca | jñānaṃ vijñānamāstikyaṃ brāhmaṃ karma svabhāvajam || 18-42 ||
  - verse_num: 43
    devanagari: |-
      शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम् । दानमीश्वरभावश्च क्षात्रं कर्म स्वभावजम् ॥ १८-४३ ॥
    slp1: |-
      SOryaM tejo DftirdAkzyaM yudDe cApyapalAyanam . dAnamISvaraBAvaSca kzAtraM karma svaBAvajam .. 18-43 ..
    iast: |-
      śauryaṃ tejo dhṛtirdākṣyaṃ yuddhe cāpyapalāyanam | dānamīśvarabhāvaśca kṣātraṃ karma svabhāvajam || 18-43 ||
  - verse_num: 44
    devanagari: |-
      कृषिगोरक्ष्यवाणिज्यं वैश्यकर्म स्वभावजम् । पयुत्थानात्मकं कर्म शूद्रस्यापि स्वभावजम् ॥ १८-४४ ॥
    slp1: |-
      kfzigorakzyavARijyaM vESyakarma svaBAvajam . payutTAnAtmakaM karma SUdrasyApi svaBAvajam .. 18-44 ..
    iast: |-
      kṛṣigorakṣyavāṇijyaṃ vaiśyakarma svabhāvajam | payutthānātmakaṃ karma śūdrasyāpi svabhāvajam || 18-44 ||
  - verse_num: 45
    devanagari: |-
      स्वे स्वे कर्मण्यभिरतः संसिद्धिं लभते नरः । स्वकर्मनिरतः सिद्धिं यथा विन्दति तच्छृणु ॥ १८-४५ ॥
    slp1: |-
      sve sve karmaRyaBirataH saMsidDiM laBate naraH . svakarmanirataH sidDiM yaTA vindati tacCfRu .. 18-45 ..
    iast: |-
      sve sve karmaṇyabhirataḥ saṃsiddhiṃ labhate naraḥ | svakarmanirataḥ siddhiṃ yathā vindati tacchṛṇu || 18-45 ||
  - verse_num: 46
    devanagari: |-
      यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम् । स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः ॥ १८-४६ ॥
    slp1: |-
      yataH pravfttirBUtAnAM yena sarvamidaM tatam . svakarmaRA tamaByarcya sidDiM vindati mAnavaH .. 18-46 ..
    iast: |-
      yataḥ pravṛttirbhūtānāṃ yena sarvamidaṃ tatam | svakarmaṇā tamabhyarcya siddhiṃ vindati mānavaḥ || 18-46 ||
  - verse_num: 47
    devanagari: |-
      श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् । स्वभावनियतं कर्म कुर्वन्नाप्नोति किल्विषम् ॥ १८-४७ ॥
    slp1: |-
      SreyAnsvaDarmo viguRaH paraDarmAtsvanuzWitAt . svaBAvaniyataM karma kurvannApnoti kilvizam .. 18-47 ..
    iast: |-
      śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt | svabhāvaniyataṃ karma kurvannāpnoti kilviṣam || 18-47 ||
  - verse_num: 48
    devanagari: |-
      सहजं कर्म कौन्तेय सदोषमपि न त्यजेत् । सर्वारम्भा हि दोषेण धूमेनाऽग्निरिवावृताः ॥ १८-४८ ॥
    slp1: |-
      sahajaM karma kOnteya sadozamapi na tyajet . sarvAramBA hi dozeRa DUmenA'gnirivAvftAH .. 18-48 ..
    iast: |-
      sahajaṃ karma kaunteya sadoṣamapi na tyajet | sarvārambhā hi doṣeṇa dhūmenā'gnirivāvṛtāḥ || 18-48 ||
  - verse_num: 49
    devanagari: |-
      असक्तबुद्धिः सर्वत्र जितात्मा विगतस्पृहः । नैष्कर्म्यसिद्धिं परमां संन्यासेनाधिगच्छति ॥ १८-४९ ॥
    slp1: |-
      asaktabudDiH sarvatra jitAtmA vigataspfhaH . nEzkarmyasidDiM paramAM saMnyAsenADigacCati .. 18-49 ..
    iast: |-
      asaktabuddhiḥ sarvatra jitātmā vigataspṛhaḥ | naiṣkarmyasiddhiṃ paramāṃ saṃnyāsenādhigacchati || 18-49 ||
  - verse_num: 50
    devanagari: |-
      सिद्धिं प्राप्तो यथा ब्रह्म तथाप्नोति निबोध मे । समासेने तु कौन्तेय निष्ठा ज्ञानस्य या परा ॥ १८-५० ॥
    slp1: |-
      sidDiM prApto yaTA brahma taTApnoti niboDa me . samAsene tu kOnteya nizWA jYAnasya yA parA .. 18-50 ..
    iast: |-
      siddhiṃ prāpto yathā brahma tathāpnoti nibodha me | samāsene tu kaunteya niṣṭhā jñānasya yā parā || 18-50 ||
  - verse_num: 51
    devanagari: |-
      बुद्ध्या विशुद्धया युक्तो धृत्यात्मानं नियम्य च । शब्दादीन्विषयांस्त्यक्त्वा रागद्वेषौ व्युदस्य च ॥ १८-५१ ॥
    slp1: |-
      budDyA viSudDayA yukto DftyAtmAnaM niyamya ca . SabdAdInvizayAMstyaktvA rAgadvezO vyudasya ca .. 18-51 ..
    iast: |-
      buddhyā viśuddhayā yukto dhṛtyātmānaṃ niyamya ca | śabdādīnviṣayāṃstyaktvā rāgadveṣau vyudasya ca || 18-51 ||
  - verse_num: 52
    devanagari: |-
      विविक्तसेवी लघ्वाशी यतवाक्कायमानसः । ध्यानयोगपरो नित्यं वैराग्यं समुपाश्रितः ॥ १८-५२ ॥
    slp1: |-
      viviktasevI laGvASI yatavAkkAyamAnasaH . DyAnayogaparo nityaM vErAgyaM samupASritaH .. 18-52 ..
    iast: |-
      viviktasevī laghvāśī yatavākkāyamānasaḥ | dhyānayogaparo nityaṃ vairāgyaṃ samupāśritaḥ || 18-52 ||
  - verse_num: 53
    devanagari: |-
      अहङ्कारं बलं दर्पं कामं क्रोधं परिग्रहम् । विमुच्य निर्ममः शान्तो ब्रह्मभूयाय कल्पते ॥ १८-५३ ॥
    slp1: |-
      ahaNkAraM balaM darpaM kAmaM kroDaM parigraham . vimucya nirmamaH SAnto brahmaBUyAya kalpate .. 18-53 ..
    iast: |-
      ahaṅkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ parigraham | vimucya nirmamaḥ śānto brahmabhūyāya kalpate || 18-53 ||
  - verse_num: 54
    devanagari: |-
      ब्रह्मभूतः प्रसन्नात्मा न शोचति न हृष्यति । समः सर्वेषु भूतेषु मद्भक्तिं लभते पराम् ॥ १८-५४ ॥
    slp1: |-
      brahmaBUtaH prasannAtmA na Socati na hfzyati . samaH sarvezu BUtezu madBaktiM laBate parAm .. 18-54 ..
    iast: |-
      brahmabhūtaḥ prasannātmā na śocati na hṛṣyati | samaḥ sarveṣu bhūteṣu madbhaktiṃ labhate parām || 18-54 ||
  - verse_num: 55
    devanagari: |-
      भक्त्या मामभिजानाति योऽहं यश्चास्मि तत्त्वतः । ततो मां तत्त्वतो ज्ञात्वा विशते तदनन्तरम् ॥ १८-५५ ॥
    slp1: |-
      BaktyA mAmaBijAnAti yo'haM yaScAsmi tattvataH . tato mAM tattvato jYAtvA viSate tadanantaram .. 18-55 ..
    iast: |-
      bhaktyā māmabhijānāti yo'haṃ yaścāsmi tattvataḥ | tato māṃ tattvato jñātvā viśate tadanantaram || 18-55 ||
  - verse_num: 56
    devanagari: |-
      सर्वकर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः । मत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम् ॥ १८-५६ ॥
    slp1: |-
      sarvakarmARyapi sadA kurvARo madvyapASrayaH . matprasAdAdavApnoti SASvataM padamavyayam .. 18-56 ..
    iast: |-
      sarvakarmāṇyapi sadā kurvāṇo madvyapāśrayaḥ | matprasādādavāpnoti śāśvataṃ padamavyayam || 18-56 ||
  - verse_num: 57
    devanagari: |-
      चेतसा सर्वकर्माणि मयि संन्यस्य भारत । बुद्धियोगं समाश्रित्य मच्चित्तः सततं भव ॥ १८-५७ ॥
    slp1: |-
      cetasA sarvakarmARi mayi saMnyasya BArata . budDiyogaM samASritya maccittaH satataM Bava .. 18-57 ..
    iast: |-
      cetasā sarvakarmāṇi mayi saṃnyasya bhārata | buddhiyogaṃ samāśritya maccittaḥ satataṃ bhava || 18-57 ||
  - verse_num: 58
    devanagari: |-
      मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि । अथ चेत्त्वमहङ्कारां न मोक्ष्यसि विनंक्ष्यसि ॥ १८-५८ ॥
    slp1: |-
      maccittaH sarvadurgARi matprasAdAttarizyasi . aTa cettvamahaNkArAM na mokzyasi vinaMkzyasi .. 18-58 ..
    iast: |-
      maccittaḥ sarvadurgāṇi matprasādāttariṣyasi | atha cettvamahaṅkārāṃ na mokṣyasi vinaṃkṣyasi || 18-58 ||
  - verse_num: 59
    devanagari: |-
      यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे । मिथ्यैप व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति ॥ १८-५९ ॥
    slp1: |-
      yadahaNkAramASritya na yotsya iti manyase . miTyEpa vyavasAyaste prakftistvAM niyokzyati .. 18-59 ..
    iast: |-
      yadahaṅkāramāśritya na yotsya iti manyase | mithyaipa vyavasāyaste prakṛtistvāṃ niyokṣyati || 18-59 ||
  - verse_num: 60
    devanagari: |-
      स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा । कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत् ॥ १८-६० ॥
    slp1: |-
      svaBAvajena kOnteya nibadDaH svena karmaRA . kartuM necCasi yanmohAtkarizyasyavaSo'pi tat .. 18-60 ..
    iast: |-
      svabhāvajena kaunteya nibaddhaḥ svena karmaṇā | kartuṃ necchasi yanmohātkariṣyasyavaśo'pi tat || 18-60 ||
  - verse_num: 61
    devanagari: |-
      ईश्वरः सर्वभूतानां हृद्येष वसतेऽर्जुन । भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया ॥ १८-६१ ॥
    slp1: |-
      ISvaraH sarvaBUtAnAM hfdyeza vasate'rjuna . BrAmayansarvaBUtAni yantrArUQAni mAyayA .. 18-61 ..
    iast: |-
      īśvaraḥ sarvabhūtānāṃ hṛdyeṣa vasate'rjuna | bhrāmayansarvabhūtāni yantrārūḍhāni māyayā || 18-61 ||
  - verse_num: 62
    devanagari: |-
      तमेव शरणं गच्छ सर्वभावेन भारत । तत्प्रसादात्परां सिदिं स्थानं प्राप्स्यसि शाश्वतम् ॥ १८-६२ ॥
    slp1: |-
      tameva SaraRaM gacCa sarvaBAvena BArata . tatprasAdAtparAM sidiM sTAnaM prApsyasi SASvatam .. 18-62 ..
    iast: |-
      tameva śaraṇaṃ gaccha sarvabhāvena bhārata | tatprasādātparāṃ sidiṃ sthānaṃ prāpsyasi śāśvatam || 18-62 ||
  - verse_num: 63
    devanagari: |-
      इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया । विमृश्यैतदशेषेण यथेच्छसि तथा कुरु ॥ १८-६३ ॥
    slp1: |-
      iti te jYAnamAKyAtaM guhyAdguhyataraM mayA . vimfSyEtadaSezeRa yaTecCasi taTA kuru .. 18-63 ..
    iast: |-
      iti te jñānamākhyātaṃ guhyādguhyataraṃ mayā | vimṛśyaitadaśeṣeṇa yathecchasi tathā kuru || 18-63 ||
  - verse_num: 64
    devanagari: |-
      सर्वगुह्यतमं भूयः शृणु मे परमं वचः । इष्टोऽसि मे दृढमतिस्ततो वक्ष्यामि ते हितम् ॥ १८-६४ ॥
    slp1: |-
      sarvaguhyatamaM BUyaH SfRu me paramaM vacaH . izwo'si me dfQamatistato vakzyAmi te hitam .. 18-64 ..
    iast: |-
      sarvaguhyatamaṃ bhūyaḥ śṛṇu me paramaṃ vacaḥ | iṣṭo'si me dṛḍhamatistato vakṣyāmi te hitam || 18-64 ||
  - verse_num: 65
    devanagari: |-
      मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु । मामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे ॥ १८-६५ ॥
    slp1: |-
      manmanA Bava madBakto madyAjI mAM namaskuru . mAmevEzyasi satyaM te pratijAne priyo'si me .. 18-65 ..
    iast: |-
      manmanā bhava madbhakto madyājī māṃ namaskuru | māmevaiṣyasi satyaṃ te pratijāne priyo'si me || 18-65 ||
  - verse_num: 66
    devanagari: |-
      सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज । अहं त्वां सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः ॥ १८-६६ ॥
    slp1: |-
      sarvaDarmAnparityajya mAmekaM SaraRaM vraja . ahaM tvAM sarvapApeByo mokzayizyAmi mA SucaH .. 18-66 ..
    iast: |-
      sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja | ahaṃ tvāṃ sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ || 18-66 ||
  - verse_num: 67
    devanagari: |-
      इदं ते नातपस्काय नाभक्ताय कदाचन । न चाशुश्रूषवे वाच्यं न च मां योऽभ्यसूयति ॥ १८-६७ ॥
    slp1: |-
      idaM te nAtapaskAya nABaktAya kadAcana . na cASuSrUzave vAcyaM na ca mAM yo'ByasUyati .. 18-67 ..
    iast: |-
      idaṃ te nātapaskāya nābhaktāya kadācana | na cāśuśrūṣave vācyaṃ na ca māṃ yo'bhyasūyati || 18-67 ||
  - verse_num: 68
    devanagari: |-
      य इदं परमं गुह्यं मद्भक्तेष्वभिधास्यति । भक्तिं मयि परां कृत्वा मामेवैष्यत्यसंशयः ॥ १८-६८ ॥
    slp1: |-
      ya idaM paramaM guhyaM madBaktezvaBiDAsyati . BaktiM mayi parAM kftvA mAmevEzyatyasaMSayaH .. 18-68 ..
    iast: |-
      ya idaṃ paramaṃ guhyaṃ madbhakteṣvabhidhāsyati | bhaktiṃ mayi parāṃ kṛtvā māmevaiṣyatyasaṃśayaḥ || 18-68 ||
  - verse_num: 69
    devanagari: |-
      न च तस्मान्मनुष्येषु कश्चिन्मे प्रियकृत्तमः । भविता न च मे तस्मादन्यः प्रियतरो भुवि ॥ १८-६९ ॥
    slp1: |-
      na ca tasmAnmanuzyezu kaScinme priyakfttamaH . BavitA na ca me tasmAdanyaH priyataro Buvi .. 18-69 ..
    iast: |-
      na ca tasmānmanuṣyeṣu kaścinme priyakṛttamaḥ | bhavitā na ca me tasmādanyaḥ priyataro bhuvi || 18-69 ||
  - verse_num: 70
    devanagari: |-
      अध्येष्यते च य इमं धर्म्यं संवादमावयोः । ज्ञानयज्ञेन तेनाहमिष्टः स्यामिति मे मतिः ॥ १८-७० ॥
    slp1: |-
      aDyezyate ca ya imaM DarmyaM saMvAdamAvayoH . jYAnayajYena tenAhamizwaH syAmiti me matiH .. 18-70 ..
    iast: |-
      adhyeṣyate ca ya imaṃ dharmyaṃ saṃvādamāvayoḥ | jñānayajñena tenāhamiṣṭaḥ syāmiti me matiḥ || 18-70 ||
  - verse_num: 71
    devanagari: |-
      श्रद्धावाननसूयश्च शृणुयादपि यो नरः । सोऽपि मुक्तः शुभांल्लोकान्प्राप्नुयात्पुण्यकर्मणाम् ॥ १८-७१ ॥
    slp1: |-
      SradDAvAnanasUyaSca SfRuyAdapi yo naraH . so'pi muktaH SuBAMllokAnprApnuyAtpuRyakarmaRAm .. 18-71 ..
    iast: |-
      śraddhāvānanasūyaśca śṛṇuyādapi yo naraḥ | so'pi muktaḥ śubhāṃllokānprāpnuyātpuṇyakarmaṇām || 18-71 ||
  - verse_num: 72
    devanagari: |-
      कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा । कच्चिदज्ञानसम्मोहः प्रनष्टस्ते धनञ्जय ॥ १८-७२ ॥
    slp1: |-
      kaccidetacCrutaM pArTa tvayEkAgreRa cetasA . kaccidajYAnasammohaH pranazwaste DanaYjaya .. 18-72 ..
    iast: |-
      kaccidetacchrutaṃ pārtha tvayaikāgreṇa cetasā | kaccidajñānasammohaḥ pranaṣṭaste dhanañjaya || 18-72 ||
  - verse_num: 73
    devanagari: |-
      नष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाऽच्युत । स्थितोऽस्मि गतसन्देहः करिष्ये वचनं तव ॥ १८-७३ ॥
    slp1: |-
      nazwo mohaH smftirlabDA tvatprasAdAnmayA'cyuta . sTito'smi gatasandehaH karizye vacanaM tava .. 18-73 ..
    iast: |-
      naṣṭo mohaḥ smṛtirlabdhā tvatprasādānmayā'cyuta | sthito'smi gatasandehaḥ kariṣye vacanaṃ tava || 18-73 ||
  - verse_num: 74
    devanagari: |-
      इत्यहं वासुदेवस्य पार्थस्य च महात्मनः । संवादमिममश्रौषमद्भुतं रोमहर्षणम् ॥ १८-७४ ॥
    slp1: |-
      ityahaM vAsudevasya pArTasya ca mahAtmanaH . saMvAdamimamaSrOzamadButaM romaharzaRam .. 18-74 ..
    iast: |-
      ityahaṃ vāsudevasya pārthasya ca mahātmanaḥ | saṃvādamimamaśrauṣamadbhutaṃ romaharṣaṇam || 18-74 ||
  - verse_num: 75
    devanagari: |-
      व्यासप्रसादाच्छ्रुतवानेतद्गुह्यतरं महत् । योगं योगीश्वरात्कृष्णात्साक्षात्कथयतः स्वयम् ॥ १८-७५ ॥
    slp1: |-
      vyAsaprasAdAcCrutavAnetadguhyataraM mahat . yogaM yogISvarAtkfzRAtsAkzAtkaTayataH svayam .. 18-75 ..
    iast: |-
      vyāsaprasādācchrutavānetadguhyataraṃ mahat | yogaṃ yogīśvarātkṛṣṇātsākṣātkathayataḥ svayam || 18-75 ||
  - verse_num: 76
    devanagari: |-
      राजन् संस्मृत्य संस्मृत्य संवादमिममद्भुतम् । केशवार्जुनयोः पुण्यं हृष्यामि च पुनः पुनः ॥ १८-७६ ॥
    slp1: |-
      rAjan saMsmftya saMsmftya saMvAdamimamadButam . keSavArjunayoH puRyaM hfzyAmi ca punaH punaH .. 18-76 ..
    iast: |-
      rājan saṃsmṛtya saṃsmṛtya saṃvādamimamadbhutam | keśavārjunayoḥ puṇyaṃ hṛṣyāmi ca punaḥ punaḥ || 18-76 ||
  - verse_num: 77
    devanagari: |-
      तच्च संस्मृत्य संस्मृत्य रूपमत्युद्भुतं हरेः । विस्मयो मे महाराज प्रहृष्ये च पुनः पुनः ॥ १८-७७ ॥
    slp1: |-
      tacca saMsmftya saMsmftya rUpamatyudButaM hareH . vismayo me mahArAja prahfzye ca punaH punaH .. 18-77 ..
    iast: |-
      tacca saṃsmṛtya saṃsmṛtya rūpamatyudbhutaṃ hareḥ | vismayo me mahārāja prahṛṣye ca punaḥ punaḥ || 18-77 ||
  - verse_num: 78
    devanagari: |-
      यत्र योगीश्वरः कृष्णो यत्र पार्थो धनुर्धरः । तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम ॥ १८-७८ ॥
    slp1: |-
      yatra yogISvaraH kfzRo yatra pArTo DanurDaraH . tatra SrIrvijayo BUtirDruvA nItirmatirmama .. 18-78 ..
    iast: |-
      yatra yogīśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ | tatra śrīrvijayo bhūtirdhruvā nītirmatirmama || 18-78 ||
