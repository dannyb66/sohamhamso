  - verse: 30
    devanagari: |-
      अपरे नियताहाराः प्राणान् प्राणेषु जुह्वति । सर्वेऽप्येते यज्ञविदो यज्ञक्षपितकल्मषाः ॥ ४-३० ॥
      प्राणम्-उदयमानं नादं प्रणवादिमात्रालयान्तम् अपाने-अस्तं याति स्वानन्दान्तःप्रवेशात्मनि जुह्वतीति पिण्डस्थैर्यात्मा स्वाध्यायः । शिष्यात्मना च नयानयग्रहणाय केचित् अस्तं यान्तमुदीयमाने संवेश्य तदेकीकारेणापवर्गदानात् आत्मनि शिष्यात्मनि च शोधनबोधनप्रवेशनयोजनरूपे स्वाध्याययज्ञे स्वपरानन्दमये प्रतिष्ठितमनसः । अत एव पूरकः प्रथममुक्तः चरमं रेचकः । प्रथमेन च पादेन विषयभोगान्तर्मुखीकरणम् । द्वितीयेन महाविदेहधारणाक्रमाद्विषयग्रहणाय निःसरणं ध्वन्यते । अतश्च स्वाध्याययज्ञेभ्योऽन्ये ज्ञानयज्ञाः । एते एवोक्तव्यापारपरिशीलनावशपरिपूरितस्वात्मशिष्यात्ममनोरथा ः द्वेऽप्येते गती निरुध्याहारं विषयभोगात्मकं नियम्य प्राणान्-सकलचित्तवृत्त्युदयान् प्राणेषु-परनिरानन्दोल्लासेषु जुह्वति-कुम्भकप्रशान्त्यार्पयन्ति । सर्वे चैते द्रव्ययज्ञात्प्रभृति ज्ञानयज्ञान्तं यज्ञस्य तत्त्वज्ञाः तेनैव च क्षपितकल्मषाः-समूलोन्मूलितभेदवासनामयमहामोहाः ॥ ३० ॥
    slp1: |-
      apare niyatAhArAH prARAn prARezu juhvati . sarve'pyete yajYavido yajYakzapitakalmazAH .. 4-30 ..
      prARam-udayamAnaM nAdaM praRavAdimAtrAlayAntam apAne-astaM yAti svAnandAntaHpraveSAtmani juhvatIti piRqasTEryAtmA svADyAyaH . SizyAtmanA ca nayAnayagrahaRAya kecit astaM yAntamudIyamAne saMveSya tadekIkAreRApavargadAnAt Atmani SizyAtmani ca SoDanaboDanapraveSanayojanarUpe svADyAyayajYe svaparAnandamaye pratizWitamanasaH . ata eva pUrakaH praTamamuktaH caramaM recakaH . praTamena ca pAdena vizayaBogAntarmuKIkaraRam . dvitIyena mahAvidehaDAraRAkramAdvizayagrahaRAya niHsaraRaM Dvanyate . ataSca svADyAyayajYeByo'nye jYAnayajYAH . ete evoktavyApArapariSIlanAvaSaparipUritasvAtmaSizyAtmamanoraTA H dve'pyete gatI niruDyAhAraM vizayaBogAtmakaM niyamya prARAn-sakalacittavfttyudayAn prARezu-paranirAnandollAsezu juhvati-kumBakapraSAntyArpayanti . sarve cEte dravyayajYAtpraBfti jYAnayajYAntaM yajYasya tattvajYAH tenEva ca kzapitakalmazAH-samUlonmUlitaBedavAsanAmayamahAmohAH .. 30 ..
    iast: |-
      apare niyatāhārāḥ prāṇān prāṇeṣu juhvati | sarve'pyete yajñavido yajñakṣapitakalmaṣāḥ || 4-30 ||
      prāṇam-udayamānaṃ nādaṃ praṇavādimātrālayāntam apāne-astaṃ yāti svānandāntaḥpraveśātmani juhvatīti piṇḍasthairyātmā svādhyāyaḥ | śiṣyātmanā ca nayānayagrahaṇāya kecit astaṃ yāntamudīyamāne saṃveśya tadekīkāreṇāpavargadānāt ātmani śiṣyātmani ca śodhanabodhanapraveśanayojanarūpe svādhyāyayajñe svaparānandamaye pratiṣṭhitamanasaḥ | ata eva pūrakaḥ prathamamuktaḥ caramaṃ recakaḥ | prathamena ca pādena viṣayabhogāntarmukhīkaraṇam | dvitīyena mahāvidehadhāraṇākramādviṣayagrahaṇāya niḥsaraṇaṃ dhvanyate | ataśca svādhyāyayajñebhyo'nye jñānayajñāḥ | ete evoktavyāpārapariśīlanāvaśaparipūritasvātmaśiṣyātmamanorathā ḥ dve'pyete gatī nirudhyāhāraṃ viṣayabhogātmakaṃ niyamya prāṇān-sakalacittavṛttyudayān prāṇeṣu-paranirānandollāseṣu juhvati-kumbhakapraśāntyārpayanti | sarve caite dravyayajñātprabhṛti jñānayajñāntaṃ yajñasya tattvajñāḥ tenaiva ca kṣapitakalmaṣāḥ-samūlonmūlitabhedavāsanāmayamahāmohāḥ || 30 ||
  - verse: 31
    devanagari: |-
      यज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम् । नायं लोकोऽस्त्ययज्ञस्य कुतोऽन्यः कुरुसत्तम ॥ ४-३१ ॥
      यज्ञेन शिष्टम्-आहृतं यज्ञाच्च-निजकरणतर्पणरूपात् अवशिष्टं-स्वात्मविश्रान्तिरूपं परानन्दनिरानन्दात्मकममृतं भुञ्जाना अपि यथेच्छं संसृज्यन्ते ब्रह्मतयेति तदुपरम्यतेऽतिरहस्यस्फुटप्रकटनवाचालतायाः । अत्र च बहुतरो रहस्यरसोऽन्तः संलीनीकृतोऽपि निविडतरभक्तिसेवासंप्रसादितगुरुचरणप्राप्तसंप्रदायमहौ। सध-समीकृतधातूनां चर्वणादिविषयतां भूतार्थास्वादहेतुतां च प्रतिपद्यते । अत्र च व्याख्यान्तराणि टीकाकारैः प्रदर्शितानि । तान्यस्मद्गुरुपादनिरुक्तानि च स्वयमेव सचेतसः संप्रधार्यन्ताम् इति किमन्येन हन्त व्याख्यातृवचनदूषणाविनोदनेन । तदुपक्रान्तमेवोपक्रम्यते ॥ ३१ ॥
    slp1: |-
      yajYaSizwAmftaBujo yAnti brahma sanAtanam . nAyaM loko'styayajYasya kuto'nyaH kurusattama .. 4-31 ..
      yajYena Sizwam-AhftaM yajYAcca-nijakaraRatarpaRarUpAt avaSizwaM-svAtmaviSrAntirUpaM parAnandanirAnandAtmakamamftaM BuYjAnA api yaTecCaM saMsfjyante brahmatayeti taduparamyate'tirahasyasPuwaprakawanavAcAlatAyAH . atra ca bahutaro rahasyaraso'ntaH saMlInIkfto'pi niviqataraBaktisevAsaMprasAditagurucaraRaprAptasaMpradAyamahO. saDa-samIkftaDAtUnAM carvaRAdivizayatAM BUtArTAsvAdahetutAM ca pratipadyate . atra ca vyAKyAntarARi wIkAkArEH pradarSitAni . tAnyasmadgurupAdaniruktAni ca svayameva sacetasaH saMpraDAryantAm iti kimanyena hanta vyAKyAtfvacanadUzaRAvinodanena . tadupakrAntamevopakramyate .. 31 ..
    iast: |-
      yajñaśiṣṭāmṛtabhujo yānti brahma sanātanam | nāyaṃ loko'styayajñasya kuto'nyaḥ kurusattama || 4-31 ||
      yajñena śiṣṭam-āhṛtaṃ yajñācca-nijakaraṇatarpaṇarūpāt avaśiṣṭaṃ-svātmaviśrāntirūpaṃ parānandanirānandātmakamamṛtaṃ bhuñjānā api yathecchaṃ saṃsṛjyante brahmatayeti taduparamyate'tirahasyasphuṭaprakaṭanavācālatāyāḥ | atra ca bahutaro rahasyaraso'ntaḥ saṃlīnīkṛto'pi niviḍatarabhaktisevāsaṃprasāditagurucaraṇaprāptasaṃpradāyamahau. sadha-samīkṛtadhātūnāṃ carvaṇādiviṣayatāṃ bhūtārthāsvādahetutāṃ ca pratipadyate | atra ca vyākhyāntarāṇi ṭīkākāraiḥ pradarśitāni | tānyasmadgurupādaniruktāni ca svayameva sacetasaḥ saṃpradhāryantām iti kimanyena hanta vyākhyātṛvacanadūṣaṇāvinodanena | tadupakrāntamevopakramyate || 31 ||
  - verse: 32
    devanagari: |-
      एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे । कर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे ॥ ४-३२ ॥
      सर्वे चैते यज्ञाः ब्रह्मणो मुखे-द्वारे उपायत्वे कथिताः । तेषु कर्मणामनुगमोऽस्ति । एवं ज्ञात्वा त्वमपि बन्धनात् मोक्षमेष्यसि ॥ ३२ ॥
    slp1: |-
      evaM bahuviDA yajYA vitatA brahmaRo muKe . karmajAnvidDi tAnsarvAnevaM jYAtvA vimokzyase .. 4-32 ..
      sarve cEte yajYAH brahmaRo muKe-dvAre upAyatve kaTitAH . tezu karmaRAmanugamo'sti . evaM jYAtvA tvamapi banDanAt mokzamezyasi .. 32 ..
    iast: |-
      evaṃ bahuvidhā yajñā vitatā brahmaṇo mukhe | karmajānviddhi tānsarvānevaṃ jñātvā vimokṣyase || 4-32 ||
      sarve caite yajñāḥ brahmaṇo mukhe-dvāre upāyatve kathitāḥ | teṣu karmaṇāmanugamo'sti | evaṃ jñātvā tvamapi bandhanāt mokṣameṣyasi || 32 ||
  - verse: 33
    devanagari: |-
      श्रेयान्द्रव्यमयाद्यज्ञाज्ज्ञानयज्ञः परन्तप । सर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते ॥ ४-३३ ॥
      अत्र त्वयं विशेषः-द्रव्ययज्ञात्केवलाज्झानदीपितो यज्ञः श्रेष्ठः । केवलता च मयटा सूचिता । यतः सर्वं कर्म ज्ञाने निष्ठामेति ॥ ३३ ॥
    slp1: |-
      SreyAndravyamayAdyajYAjjYAnayajYaH parantapa . sarvaM karmAKilaM pArTa jYAne parisamApyate .. 4-33 ..
      atra tvayaM viSezaH-dravyayajYAtkevalAjJAnadIpito yajYaH SrezWaH . kevalatA ca mayawA sUcitA . yataH sarvaM karma jYAne nizWAmeti .. 33 ..
    iast: |-
      śreyāndravyamayādyajñājjñānayajñaḥ parantapa | sarvaṃ karmākhilaṃ pārtha jñāne parisamāpyate || 4-33 ||
      atra tvayaṃ viśeṣaḥ-dravyayajñātkevalājjhānadīpito yajñaḥ śreṣṭhaḥ | kevalatā ca mayaṭā sūcitā | yataḥ sarvaṃ karma jñāne niṣṭhāmeti || 33 ||
  - verse: 34
    devanagari: |-
      तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया । उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः ॥ ४-३४ ॥
      इति । अन्ये ज्ञानिनः पुरुषाः-इति व्याख्यायमाने भगवान्स्वयमुपदिष्टवांस्तदसत्यम्-इत्युक्तं स्यात् । एवमभिधाने च प्रयोजनमन्येऽपि लोकाः प्रणिपातादिना ज्ञानिभ्यो ज्ञानं गृह्णीयुर्न यथाकथञ्चिदिति समयप्रतिपादनम् ॥ ३४ ॥
    slp1: |-
      tadvidDi praRipAtena paripraSnena sevayA . upadekzyanti te jYAnaM jYAninastattvadarSinaH .. 4-34 ..
      iti . anye jYAninaH puruzAH-iti vyAKyAyamAne BagavAnsvayamupadizwavAMstadasatyam-ityuktaM syAt . evamaBiDAne ca prayojanamanye'pi lokAH praRipAtAdinA jYAniByo jYAnaM gfhRIyurna yaTAkaTaYciditi samayapratipAdanam .. 34 ..
    iast: |-
      tadviddhi praṇipātena paripraśnena sevayā | upadekṣyanti te jñānaṃ jñāninastattvadarśinaḥ || 4-34 ||
      iti | anye jñāninaḥ puruṣāḥ-iti vyākhyāyamāne bhagavānsvayamupadiṣṭavāṃstadasatyam-ityuktaṃ syāt | evamabhidhāne ca prayojanamanye'pi lokāḥ praṇipātādinā jñānibhyo jñānaṃ gṛhṇīyurna yathākathañciditi samayapratipādanam || 34 ||
  - verse: 35
    devanagari: |-
      यज्ज्ञात्वा न पुनर्मोहमेवं यास्यसि पाण्डव । येन भूतान्यशेषेण द्रक्ष्यस्यात्मन्यथो मयि ॥ ४-३५ ॥
      आत्मनि मयि-मत्स्वरूपतां प्राप्ते आत्मनि-इति सामानाधिकरण्यम् । अथोशब्दः पादपूरणे । आत्मन ईश्वरस्य साम्ये कोऽपि विशेष उक्तः । असाम्ये विकल्पानुपपत्तिः ॥ ३५ ॥
    slp1: |-
      yajjYAtvA na punarmohamevaM yAsyasi pARqava . yena BUtAnyaSezeRa drakzyasyAtmanyaTo mayi .. 4-35 ..
      Atmani mayi-matsvarUpatAM prApte Atmani-iti sAmAnADikaraRyam . aToSabdaH pAdapUraRe . Atmana ISvarasya sAmye ko'pi viSeza uktaH . asAmye vikalpAnupapattiH .. 35 ..
    iast: |-
      yajjñātvā na punarmohamevaṃ yāsyasi pāṇḍava | yena bhūtānyaśeṣeṇa drakṣyasyātmanyatho mayi || 4-35 ||
      ātmani mayi-matsvarūpatāṃ prāpte ātmani-iti sāmānādhikaraṇyam | athośabdaḥ pādapūraṇe | ātmana īśvarasya sāmye ko'pi viśeṣa uktaḥ | asāmye vikalpānupapattiḥ || 35 ||
  - verse: 36
    devanagari: |-
      सर्वं कर्माखिलम्-इति यदुक्तं तत्स्फुटयितुं प्रथमश्लोकेनाधर्मोऽपि नश्यति-इति वदन् सर्वं कर्म-इति द्वितीयेन संस्कारलेशोऽपि नावतिष्ठते-इति सूचयन् अखिलम्-इति व्याचष्टे अपि चेत्-इत्यादि संशयात्मनः-इत्यन्तम्-
      अपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः । सर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि ॥ ४-३६ ॥
    slp1: |-
      sarvaM karmAKilam-iti yaduktaM tatsPuwayituM praTamaSlokenADarmo'pi naSyati-iti vadan sarvaM karma-iti dvitIyena saMskAraleSo'pi nAvatizWate-iti sUcayan aKilam-iti vyAcazwe api cet-ityAdi saMSayAtmanaH-ityantam-
      api cedasi pApeByaH sarveByaH pApakfttamaH . sarvaM jYAnaplavenEva vfjinaM santarizyasi .. 4-36 ..
    iast: |-
      sarvaṃ karmākhilam-iti yaduktaṃ tatsphuṭayituṃ prathamaślokenādharmo'pi naśyati-iti vadan sarvaṃ karma-iti dvitīyena saṃskāraleśo'pi nāvatiṣṭhate-iti sūcayan akhilam-iti vyācaṣṭe api cet-ityādi saṃśayātmanaḥ-ityantam-
      api cedasi pāpebhyaḥ sarvebhyaḥ pāpakṛttamaḥ | sarvaṃ jñānaplavenaiva vṛjinaṃ santariṣyasi || 4-36 ||
  - verse: 37
    devanagari: |-
      यथैधांसि समिद्धोऽग्निर्भस्मसात् कुरुतेऽर्जुन । ज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा ॥ ४-३७ ॥
    slp1: |-
      yaTEDAMsi samidDo'gnirBasmasAt kurute'rjuna . jYAnAgniH sarvakarmARi BasmasAtkurute taTA .. 4-37 ..
    iast: |-
      yathaidhāṃsi samiddho'gnirbhasmasāt kurute'rjuna | jñānāgniḥ sarvakarmāṇi bhasmasātkurute tathā || 4-37 ||
  - verse: 38
    devanagari: |-
      नहि ज्ञानेन सदृशं पवित्रमिह विद्यते । तत्स्वयं योगसंसिद्धः कालेनात्मनि विन्दति ॥ ४-३८ ॥
    slp1: |-
      nahi jYAnena sadfSaM pavitramiha vidyate . tatsvayaM yogasaMsidDaH kAlenAtmani vindati .. 4-38 ..
    iast: |-
      nahi jñānena sadṛśaṃ pavitramiha vidyate | tatsvayaṃ yogasaṃsiddhaḥ kālenātmani vindati || 4-38 ||
  - verse: 39
    devanagari: |-
      श्रद्धावांल्लभते ज्ञानं तत्परः संयतेन्द्रियः । ज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति ॥ ४-३९ ॥
    slp1: |-
      SradDAvAMllaBate jYAnaM tatparaH saMyatendriyaH . jYAnaM labDvA parAM SAntimacireRADigacCati .. 4-39 ..
    iast: |-
      śraddhāvāṃllabhate jñānaṃ tatparaḥ saṃyatendriyaḥ | jñānaṃ labdhvā parāṃ śāntimacireṇādhigacchati || 4-39 ||
  - verse: 40
    devanagari: |-
      अज्ञश्चाश्रद्दधानश्च संशयात्मा विनश्यति । नायं लोकोऽस्ति न परो न सुखं संशयात्मनः ॥ ४-४० ॥
      समिद्धोऽभ्यासजातप्रतिपत्तिदार्ढ्यबन्धेन ज्ञानाग्रिर्भवति यथा तथा प्रयतनीयमिति । पवित्रं हि ज्ञानसमं नास्ति । अन्यस्य संवृध्द्या पवित्रत्वं न वस्तुत इत्यतिप्रसङ्गभयान्न प्रतायते । पवित्रतां चास्य स्वयं ज्ञास्यति सुप्रबुद्धतायाम् । अत्र च श्रद्धागमस्तत्परव्यापारत्वं झगित्येव आस्तिकत्वादसंशयत्वे सति उत्पद्यते । तस्मादसंशयवता गुर्वागमादृते न भाव्यं-संशयस्य सर्वनाशकत्वात् । ससंशयो हि न किंचिज्जानाति-अश्रद्दधानत्वात् । तस्मात् निःसंशयेन भाव्यमिति वाक्यार्थः ॥ ४० ॥
    slp1: |-
      ajYaScASraddaDAnaSca saMSayAtmA vinaSyati . nAyaM loko'sti na paro na suKaM saMSayAtmanaH .. 4-40 ..
      samidDo'ByAsajAtapratipattidArQyabanDena jYAnAgrirBavati yaTA taTA prayatanIyamiti . pavitraM hi jYAnasamaM nAsti . anyasya saMvfDdyA pavitratvaM na vastuta ityatiprasaNgaBayAnna pratAyate . pavitratAM cAsya svayaM jYAsyati suprabudDatAyAm . atra ca SradDAgamastatparavyApAratvaM Jagityeva AstikatvAdasaMSayatve sati utpadyate . tasmAdasaMSayavatA gurvAgamAdfte na BAvyaM-saMSayasya sarvanASakatvAt . sasaMSayo hi na kiMcijjAnAti-aSraddaDAnatvAt . tasmAt niHsaMSayena BAvyamiti vAkyArTaH .. 40 ..
    iast: |-
      ajñaścāśraddadhānaśca saṃśayātmā vinaśyati | nāyaṃ loko'sti na paro na sukhaṃ saṃśayātmanaḥ || 4-40 ||
      samiddho'bhyāsajātapratipattidārḍhyabandhena jñānāgrirbhavati yathā tathā prayatanīyamiti | pavitraṃ hi jñānasamaṃ nāsti | anyasya saṃvṛdhdyā pavitratvaṃ na vastuta ityatiprasaṅgabhayānna pratāyate | pavitratāṃ cāsya svayaṃ jñāsyati suprabuddhatāyām | atra ca śraddhāgamastatparavyāpāratvaṃ jhagityeva āstikatvādasaṃśayatve sati utpadyate | tasmādasaṃśayavatā gurvāgamādṛte na bhāvyaṃ-saṃśayasya sarvanāśakatvāt | sasaṃśayo hi na kiṃcijjānāti-aśraddadhānatvāt | tasmāt niḥsaṃśayena bhāvyamiti vākyārthaḥ || 40 ||
  - verse: 41
    devanagari: |-
      सकलाध्यायविस्फारितोऽर्थः श्लोकद्वयेन संक्षिप्यते-
      योगसंन्यस्तकर्माणं ज्ञानसञ्छिन्नसंशयम् । आत्मवन्तं न कर्माणि निबध्नन्ति धनञ्जय ॥ ४-४१ ॥
      योगेनैव कर्मणां संन्यास उपपद्यते नान्यथा इति विचारितं विचारयिष्यते च ॥ ४१ ॥
    slp1: |-
      sakalADyAyavisPArito'rTaH Slokadvayena saMkzipyate-
      yogasaMnyastakarmARaM jYAnasaYCinnasaMSayam . AtmavantaM na karmARi nibaDnanti DanaYjaya .. 4-41 ..
      yogenEva karmaRAM saMnyAsa upapadyate nAnyaTA iti vicAritaM vicArayizyate ca .. 41 ..
    iast: |-
      sakalādhyāyavisphārito'rthaḥ ślokadvayena saṃkṣipyate-
      yogasaṃnyastakarmāṇaṃ jñānasañchinnasaṃśayam | ātmavantaṃ na karmāṇi nibadhnanti dhanañjaya || 4-41 ||
      yogenaiva karmaṇāṃ saṃnyāsa upapadyate nānyathā iti vicāritaṃ vicārayiṣyate ca || 41 ||
  - verse: 42
    devanagari: |-
      यत एवम्
      तस्मादज्ञानसम्भूतं हृत्स्थं ज्ञानासिनात्मनः । छित्वैवं संशयं योगमातिष्ठोत्तिष्ठ भारत ॥ ४-४२ ॥
      संशयं छित्वा योगं-कर्मकौशलमातिष्ठ उक्तक्रमेण । ततश्च उत्तिष्ठ-त्वं स्वव्यापारं कर्तव्यतामात्रेण कुरु इति शिवम् ॥ ४२ ॥
    slp1: |-
      yata evam
      tasmAdajYAnasamBUtaM hftsTaM jYAnAsinAtmanaH . CitvEvaM saMSayaM yogamAtizWottizWa BArata .. 4-42 ..
      saMSayaM CitvA yogaM-karmakOSalamAtizWa uktakrameRa . tataSca uttizWa-tvaM svavyApAraM kartavyatAmAtreRa kuru iti Sivam .. 42 ..
    iast: |-
      yata evam
      tasmādajñānasambhūtaṃ hṛtsthaṃ jñānāsinātmanaḥ | chitvaivaṃ saṃśayaṃ yogamātiṣṭhottiṣṭha bhārata || 4-42 ||
      saṃśayaṃ chitvā yogaṃ-karmakauśalamātiṣṭha uktakrameṇa | tataśca uttiṣṭha-tvaṃ svavyāpāraṃ kartavyatāmātreṇa kuru iti śivam || 42 ||
  - verse: 1000
    devanagari: |-
      विधत्ते कर्म यत्किञ्चिदक्षेच्छामात्रपूर्वकम् । तेनैव शुभभाजः स्युस्तृप्ताः करणदेवताः ॥ ४ ॥
    slp1: |-
      viDatte karma yatkiYcidakzecCAmAtrapUrvakam . tenEva SuBaBAjaH syustfptAH karaRadevatAH .. 4 ..
    iast: |-
      vidhatte karma yatkiñcidakṣecchāmātrapūrvakam | tenaiva śubhabhājaḥ syustṛptāḥ karaṇadevatāḥ || 4 ||
- chapter: 5
  title_sa: पञ्चमोऽध्यायः
  title_iast: "pañcamo'dhyāyaḥ"
  title_en: "Fifth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      अर्जुन उवाच
      संन्यासं कर्मणां कृष्ण ! पुनर्योगं च शंससि । यच्छ्रेयानेतयोरेकस्तं मे ब्रूहि विनिश्चितम् ॥ ५-१ ॥
      संन्यासः प्रधानं पुनर्योग इति ससंशयस्य प्रश्नः ॥ १ ॥
    slp1: |-
      arjuna uvAca
      saMnyAsaM karmaRAM kfzRa ! punaryogaM ca SaMsasi . yacCreyAnetayorekastaM me brUhi viniScitam .. 5-1 ..
      saMnyAsaH praDAnaM punaryoga iti sasaMSayasya praSnaH .. 1 ..
    iast: |-
      arjuna uvāca
      saṃnyāsaṃ karmaṇāṃ kṛṣṇa ! punaryogaṃ ca śaṃsasi | yacchreyānetayorekastaṃ me brūhi viniścitam || 5-1 ||
      saṃnyāsaḥ pradhānaṃ punaryoga iti sasaṃśayasya praśnaḥ || 1 ||
  - verse: 2
    devanagari: |-
      श्रीभगवानुवाच
      संन्यासः कर्मयोगश्च निःश्रेयसकरावुभौ । तयोस्तु कर्मसंन्यासात्कर्मयोगो विशिष्यते ॥ ५-२ ॥
      संन्यासः कर्म च-नात्रैकोऽभिहितः अपितु उभौ संमिलितौ निःश्रेयसं दत्तः । योगेन विना संन्यासो न संभवतीति योगस्य विशेषः ॥ २ ॥
    slp1: |-
      SrIBagavAnuvAca
      saMnyAsaH karmayogaSca niHSreyasakarAvuBO . tayostu karmasaMnyAsAtkarmayogo viSizyate .. 5-2 ..
      saMnyAsaH karma ca-nAtrEko'BihitaH apitu uBO saMmilitO niHSreyasaM dattaH . yogena vinA saMnyAso na saMBavatIti yogasya viSezaH .. 2 ..
    iast: |-
      śrībhagavānuvāca
      saṃnyāsaḥ karmayogaśca niḥśreyasakarāvubhau | tayostu karmasaṃnyāsātkarmayogo viśiṣyate || 5-2 ||
      saṃnyāsaḥ karma ca-nātraiko'bhihitaḥ apitu ubhau saṃmilitau niḥśreyasaṃ dattaḥ | yogena vinā saṃnyāso na saṃbhavatīti yogasya viśeṣaḥ || 2 ||
  - verse: 3
    devanagari: |-
      ज्ञेयः स नित्यसंन्यासी यो न द्वेष्टि न काङ्क्षति । निर्द्वन्द्वो हि महाबाहो ! सुखं बन्धाद्विमुच्यते ॥ ५-३ ॥
      अतश्च स एव सार्वकालिकः संन्यासी येन मनसोऽभिलाषप्रद्वेषौ संन्यस्तौ यतोऽस्य द्वन्द्वेभ्यः-क्रोधमोहादिभ्यो निष्क्रान्ता धीः । स सुखं मुच्यत एव ॥ ३ ॥
    slp1: |-
      jYeyaH sa nityasaMnyAsI yo na dvezwi na kANkzati . nirdvandvo hi mahAbAho ! suKaM banDAdvimucyate .. 5-3 ..
      ataSca sa eva sArvakAlikaH saMnyAsI yena manaso'BilAzapradvezO saMnyastO yato'sya dvandveByaH-kroDamohAdiByo nizkrAntA DIH . sa suKaM mucyata eva .. 3 ..
    iast: |-
      jñeyaḥ sa nityasaṃnyāsī yo na dveṣṭi na kāṅkṣati | nirdvandvo hi mahābāho ! sukhaṃ bandhādvimucyate || 5-3 ||
      ataśca sa eva sārvakālikaḥ saṃnyāsī yena manaso'bhilāṣapradveṣau saṃnyastau yato'sya dvandvebhyaḥ-krodhamohādibhyo niṣkrāntā dhīḥ | sa sukhaṃ mucyata eva || 3 ||
  - verse: 4
    devanagari: |-
      साङ्ख्ययोगौ पृथग्बालाः प्रवदन्ति न पण्डिताः । एकमप्यास्थितः सम्यगुभयोर्विन्दते फलम् ॥ ५-४ ॥
    slp1: |-
      sANKyayogO pfTagbAlAH pravadanti na paRqitAH . ekamapyAsTitaH samyaguBayorvindate Palam .. 5-4 ..
    iast: |-
      sāṅkhyayogau pṛthagbālāḥ pravadanti na paṇḍitāḥ | ekamapyāsthitaḥ samyagubhayorvindate phalam || 5-4 ||
  - verse: 5
    devanagari: |-
      यत्साङ्ख्यैः प्राप्यते स्थानं तद्योगैरनगम्यते । एकं साङ्ख्यं च योगं च यः पश्यति स पश्यति ॥ ५-५ ॥
      इदं सांख्यम् अयं च योगः-इति न भेदः । एतौ हि नित्यसंबद्धौ । ज्ञानं न योगेन बिना । योगोऽपि न तेन विनेति । अत एकत्वमनयोः ॥ ५ ॥
    slp1: |-
      yatsANKyEH prApyate sTAnaM tadyogEranagamyate . ekaM sANKyaM ca yogaM ca yaH paSyati sa paSyati .. 5-5 ..
      idaM sAMKyam ayaM ca yogaH-iti na BedaH . etO hi nityasaMbadDO . jYAnaM na yogena binA . yogo'pi na tena vineti . ata ekatvamanayoH .. 5 ..
    iast: |-
      yatsāṅkhyaiḥ prāpyate sthānaṃ tadyogairanagamyate | ekaṃ sāṅkhyaṃ ca yogaṃ ca yaḥ paśyati sa paśyati || 5-5 ||
      idaṃ sāṃkhyam ayaṃ ca yogaḥ-iti na bhedaḥ | etau hi nityasaṃbaddhau | jñānaṃ na yogena binā | yogo'pi na tena vineti | ata ekatvamanayoḥ || 5 ||
  - verse: 6
    devanagari: |-
      संन्यासस्तु महाबाहो दुःखमाप्तुमयोगतः । योगयुक्तो मुनिर्ब्रह्म न चिरेणाधिगच्छति ॥ ५-६ ॥
      तुशब्दोऽवधारणे भिन्नक्रमः । योगरहितस्य संन्यासमाप्तुं दुःखमेव-प्राङ्गीत्या कर्मणां दुःसंन्यासत्वात् । योगिभिस्तु सुलभमेवैतत्-इत्युक्तं प्राक् ॥ ६ ॥
    slp1: |-
      saMnyAsastu mahAbAho duHKamAptumayogataH . yogayukto munirbrahma na cireRADigacCati .. 5-6 ..
      tuSabdo'vaDAraRe BinnakramaH . yogarahitasya saMnyAsamAptuM duHKameva-prANgItyA karmaRAM duHsaMnyAsatvAt . yogiBistu sulaBamevEtat-ityuktaM prAk .. 6 ..
    iast: |-
      saṃnyāsastu mahābāho duḥkhamāptumayogataḥ | yogayukto munirbrahma na cireṇādhigacchati || 5-6 ||
      tuśabdo'vadhāraṇe bhinnakramaḥ | yogarahitasya saṃnyāsamāptuṃ duḥkhameva-prāṅgītyā karmaṇāṃ duḥsaṃnyāsatvāt | yogibhistu sulabhamevaitat-ityuktaṃ prāk || 6 ||
  - verse: 7
    devanagari: |-
      योगयुक्तो विशुद्धात्मा विजितात्मा जितेन्द्रियः । सर्वभूतात्मभूतात्मा कुर्वन्नपि न लिप्यते ॥ ५-७ ॥
      सर्वभूतानामात्मभूत अत्मा यस्व स सर्वमपि कुर्वाणो न लिप्यते-करणप्रतिषेधारूढत्वात् ॥ ७ ॥
    slp1: |-
      yogayukto viSudDAtmA vijitAtmA jitendriyaH . sarvaBUtAtmaBUtAtmA kurvannapi na lipyate .. 5-7 ..
      sarvaBUtAnAmAtmaBUta atmA yasva sa sarvamapi kurvARo na lipyate-karaRapratizeDArUQatvAt .. 7 ..
    iast: |-
      yogayukto viśuddhātmā vijitātmā jitendriyaḥ | sarvabhūtātmabhūtātmā kurvannapi na lipyate || 5-7 ||
      sarvabhūtānāmātmabhūta atmā yasva sa sarvamapi kurvāṇo na lipyate-karaṇapratiṣedhārūḍhatvāt || 7 ||
  - verse: 8
    devanagari: |-
      नैव किञ्चित्करोमीति युक्तो मन्येत तत्त्ववित् । पश्यञ्शृण्वन्स्पृशञ्जिघ्रन्नश्नन्गच्छन्श्वसन्स्वपन् ॥ ५-८ ॥
    slp1: |-
      nEva kiYcitkaromIti yukto manyeta tattvavit . paSyaYSfRvanspfSaYjiGrannaSnangacCanSvasansvapan .. 5-8 ..
    iast: |-
      naiva kiñcitkaromīti yukto manyeta tattvavit | paśyañśṛṇvanspṛśañjighrannaśnangacchanśvasansvapan || 5-8 ||
  - verse: 9
    devanagari: |-
      प्रलपन्विसृजन्गृह्णन्नुन्मिषन्निमिषन्नपि । इन्द्रियाणीन्द्रियार्थेषु वर्तन्त इति धारयन् ॥ ५-९ ॥
    slp1: |-
      pralapanvisfjangfhRannunmizannimizannapi . indriyARIndriyArTezu vartanta iti DArayan .. 5-9 ..
    iast: |-
      pralapanvisṛjangṛhṇannunmiṣannimiṣannapi | indriyāṇīndriyārtheṣu vartanta iti dhārayan || 5-9 ||
  - verse: 10
    devanagari: |-
      ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः । लिप्यते न स पापेन पद्मपत्रमिवाम्भसा ॥ ५-१० ॥
      अत एव दर्शनादीनि कुर्वन्नपि असावेवं धारयति-प्रतिपत्तिदार्ढ्येन निश्चिनुते-चक्षुरादीनामिन्द्रियाणां यदि स्वविषयेषु प्रवृत्तिः मम किमायातम् नह्यन्यकृतेन परस्य लेपः-इति । तदेव ब्रह्मणि कर्मणां समर्पणम् । अत्र चिह्नमस्य गतसंगता । अतो न लिप्यते ॥ १० ॥
    slp1: |-
      brahmaRyADAya karmARi saNgaM tyaktvA karoti yaH . lipyate na sa pApena padmapatramivAmBasA .. 5-10 ..
      ata eva darSanAdIni kurvannapi asAvevaM DArayati-pratipattidArQyena niScinute-cakzurAdInAmindriyARAM yadi svavizayezu pravfttiH mama kimAyAtam nahyanyakftena parasya lepaH-iti . tadeva brahmaRi karmaRAM samarpaRam . atra cihnamasya gatasaMgatA . ato na lipyate .. 10 ..
    iast: |-
      brahmaṇyādhāya karmāṇi saṅgaṃ tyaktvā karoti yaḥ | lipyate na sa pāpena padmapatramivāmbhasā || 5-10 ||
      ata eva darśanādīni kurvannapi asāvevaṃ dhārayati-pratipattidārḍhyena niścinute-cakṣurādīnāmindriyāṇāṃ yadi svaviṣayeṣu pravṛttiḥ mama kimāyātam nahyanyakṛtena parasya lepaḥ-iti | tadeva brahmaṇi karmaṇāṃ samarpaṇam | atra cihnamasya gatasaṃgatā | ato na lipyate || 10 ||
  - verse: 11
    devanagari: |-
      कायेन मनसा बुद्ध्या केवलैरिन्द्रियैरपि । योगिनः कर्म कुर्वन्ति सङ्गं त्यक्त्वाऽऽत्मशुद्धये ॥ ५-११ ॥
      योगिनश्च केवलैः-सङ्गरहितैः परस्परानपेक्षिभिश्च कायादिभिः कुर्वन्ति कर्माणि सङ्गाभावात् ॥ ११ ॥
    slp1: |-
      kAyena manasA budDyA kevalErindriyErapi . yoginaH karma kurvanti saNgaM tyaktvA''tmaSudDaye .. 5-11 ..
      yoginaSca kevalEH-saNgarahitEH parasparAnapekziBiSca kAyAdiBiH kurvanti karmARi saNgABAvAt .. 11 ..
    iast: |-
      kāyena manasā buddhyā kevalairindriyairapi | yoginaḥ karma kurvanti saṅgaṃ tyaktvā''tmaśuddhaye || 5-11 ||
      yoginaśca kevalaiḥ-saṅgarahitaiḥ parasparānapekṣibhiśca kāyādibhiḥ kurvanti karmāṇi saṅgābhāvāt || 11 ||
  - verse: 12
    devanagari: |-
      युक्तः कर्मफलं त्यक्त्वा शान्तिमाप्नोति नैष्ठिकीम् । अयुक्तः कामकारेण फले सक्तो निबध्यते ॥ ५-१२ ॥
      नैष्ठिकीम्-अपुनरावर्तिनीम् ॥ १२ ॥
    slp1: |-
      yuktaH karmaPalaM tyaktvA SAntimApnoti nEzWikIm . ayuktaH kAmakAreRa Pale sakto nibaDyate .. 5-12 ..
      nEzWikIm-apunarAvartinIm .. 12 ..
    iast: |-
      yuktaḥ karmaphalaṃ tyaktvā śāntimāpnoti naiṣṭhikīm | ayuktaḥ kāmakāreṇa phale sakto nibadhyate || 5-12 ||
      naiṣṭhikīm-apunarāvartinīm || 12 ||
  - verse: 13
    devanagari: |-
      सर्वकर्माणि मनसा संन्यस्यास्ते सुखं वशीम् । नवद्वारे पुरे देही नैव कुर्वन्न कारयन् ॥ ५-१३ ॥
      यथा वेश्मान्तर्गतस्य पुंसो न गृहगतैर्जीर्णत्वादिभिर्योगः एवं मम चक्षुरादिच्छिद्रगवाक्षनवकालङ्कृतदेहगेहगतस्य न तद्धर्मयोगः ॥ १३ ॥
    slp1: |-
      sarvakarmARi manasA saMnyasyAste suKaM vaSIm . navadvAre pure dehI nEva kurvanna kArayan .. 5-13 ..
      yaTA veSmAntargatasya puMso na gfhagatErjIrRatvAdiBiryogaH evaM mama cakzurAdicCidragavAkzanavakAlaNkftadehagehagatasya na tadDarmayogaH .. 13 ..
    iast: |-
      sarvakarmāṇi manasā saṃnyasyāste sukhaṃ vaśīm | navadvāre pure dehī naiva kurvanna kārayan || 5-13 ||
      yathā veśmāntargatasya puṃso na gṛhagatairjīrṇatvādibhiryogaḥ evaṃ mama cakṣurādicchidragavākṣanavakālaṅkṛtadehagehagatasya na taddharmayogaḥ || 13 ||
  - verse: 14
    devanagari: |-
      न कर्तृत्वं न कर्माणि लोकस्य सृजति प्रभुः । न कर्मफलसंयोगं स्वभावस्तु प्रवर्तते ॥ ५-१४ ॥
      एष आत्मा न किंचित्कस्यचित्करोति । प्रवृत्तिस्त्वस्य स्वभावमात्रं न फलेप्सया । तथाहि । संवेदनात्मनो भगवतः प्रकाशानन्दस्वातन्त्र्यपरमार्थस्वभावस्य स्वभावमात्राक्षिप्तसमस्तसृष्टिस्थितिसंहृतिप्रबन्धस्य स्वस्वभावान्न मनागप्यपायो जातुचित् । इति न कर्त्रवस्थातिरिक्तं कर्तृत्वं किंचित् । तदभावात्कानि कर्माणि तद् सत्त्वे कस्य फलम् को वा कर्मफलसंबन्धः । कर्मात्र क्रिया । कर्मफलमपि च क्रियाफलमेव । तथाहि । दण्डचक्रपरिवर्तनादिक्रिया नान्या । न च सा घटनिष्पादिता-संविदन्तर्वर्तित्वात् । तस्माच्चेतनः स्वतन्त्रः परमेश्वर एव तथा तथा भाति इति न तद्व्यतिरिक्तं क्रियातत्फलादिकमिति सिद्धान्तः ॥ १४ ॥
    slp1: |-
      na kartftvaM na karmARi lokasya sfjati praBuH . na karmaPalasaMyogaM svaBAvastu pravartate .. 5-14 ..
      eza AtmA na kiMcitkasyacitkaroti . pravfttistvasya svaBAvamAtraM na PalepsayA . taTAhi . saMvedanAtmano BagavataH prakASAnandasvAtantryaparamArTasvaBAvasya svaBAvamAtrAkziptasamastasfzwisTitisaMhftiprabanDasya svasvaBAvAnna manAgapyapAyo jAtucit . iti na kartravasTAtiriktaM kartftvaM kiMcit . tadaBAvAtkAni karmARi tad sattve kasya Palam ko vA karmaPalasaMbanDaH . karmAtra kriyA . karmaPalamapi ca kriyAPalameva . taTAhi . daRqacakraparivartanAdikriyA nAnyA . na ca sA GawanizpAditA-saMvidantarvartitvAt . tasmAccetanaH svatantraH parameSvara eva taTA taTA BAti iti na tadvyatiriktaM kriyAtatPalAdikamiti sidDAntaH .. 14 ..
    iast: |-
      na kartṛtvaṃ na karmāṇi lokasya sṛjati prabhuḥ | na karmaphalasaṃyogaṃ svabhāvastu pravartate || 5-14 ||
      eṣa ātmā na kiṃcitkasyacitkaroti | pravṛttistvasya svabhāvamātraṃ na phalepsayā | tathāhi | saṃvedanātmano bhagavataḥ prakāśānandasvātantryaparamārthasvabhāvasya svabhāvamātrākṣiptasamastasṛṣṭisthitisaṃhṛtiprabandhasya svasvabhāvānna manāgapyapāyo jātucit | iti na kartravasthātiriktaṃ kartṛtvaṃ kiṃcit | tadabhāvātkāni karmāṇi tad sattve kasya phalam ko vā karmaphalasaṃbandhaḥ | karmātra kriyā | karmaphalamapi ca kriyāphalameva | tathāhi | daṇḍacakraparivartanādikriyā nānyā | na ca sā ghaṭaniṣpāditā-saṃvidantarvartitvāt | tasmāccetanaḥ svatantraḥ parameśvara eva tathā tathā bhāti iti na tadvyatiriktaṃ kriyātatphalādikamiti siddhāntaḥ || 14 ||
  - verse: 15
    devanagari: |-
      अत एव क्रियातत्फलयोरभावे विधिफलस्यापि नादृष्टकृतता काचित्-इत्यर्धेनाभिधायार्धान्तरेण संसारिणः प्रति तत्समर्थनं कर्तुमाह
      नादत्ते कस्यचित् पापं न चैव सुकृतं विभुः । अज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः ॥ ५-१५ ॥
      पापादीनि नैतत्कृतानि । किन्तु निजेनाज्ञानेन कृतानि शङ्कयेवामृते विषम् ॥ १५ ॥
    slp1: |-
      ata eva kriyAtatPalayoraBAve viDiPalasyApi nAdfzwakftatA kAcit-ityarDenABiDAyArDAntareRa saMsAriRaH prati tatsamarTanaM kartumAha
      nAdatte kasyacit pApaM na cEva sukftaM viBuH . ajYAnenAvftaM jYAnaM tena muhyanti jantavaH .. 5-15 ..
      pApAdIni nEtatkftAni . kintu nijenAjYAnena kftAni SaNkayevAmfte vizam .. 15 ..
    iast: |-
      ata eva kriyātatphalayorabhāve vidhiphalasyāpi nādṛṣṭakṛtatā kācit-ityardhenābhidhāyārdhāntareṇa saṃsāriṇaḥ prati tatsamarthanaṃ kartumāha
      nādatte kasyacit pāpaṃ na caiva sukṛtaṃ vibhuḥ | ajñānenāvṛtaṃ jñānaṃ tena muhyanti jantavaḥ || 5-15 ||
      pāpādīni naitatkṛtāni | kintu nijenājñānena kṛtāni śaṅkayevāmṛte viṣam || 15 ||
  - verse: 16
    devanagari: |-
      अत एव
      ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः । तेषामादित्यवज्ज्ञानं प्रकाशयति तत्परम् ॥ ५-१६ ॥
      ज्ञानेन तु अज्ञाने नाशिते ज्ञानस्य स्वप्रकाशत्वं स्वतः सिद्धम् यथा आदित्यस्य तमसि नष्टे । विनिवर्तितायां हि शङ्कायाममृतममृतकार्यं स्वयमेव करोति ॥ १६ ॥
    slp1: |-
      ata eva
      jYAnena tu tadajYAnaM yezAM nASitamAtmanaH . tezAmAdityavajjYAnaM prakASayati tatparam .. 5-16 ..
      jYAnena tu ajYAne nASite jYAnasya svaprakASatvaM svataH sidDam yaTA Adityasya tamasi nazwe . vinivartitAyAM hi SaNkAyAmamftamamftakAryaM svayameva karoti .. 16 ..
    iast: |-
      ata eva
      jñānena tu tadajñānaṃ yeṣāṃ nāśitamātmanaḥ | teṣāmādityavajjñānaṃ prakāśayati tatparam || 5-16 ||
      jñānena tu ajñāne nāśite jñānasya svaprakāśatvaṃ svataḥ siddham yathā ādityasya tamasi naṣṭe | vinivartitāyāṃ hi śaṅkāyāmamṛtamamṛtakāryaṃ svayameva karoti || 16 ||
  - verse: 17
    devanagari: |-
      तच्च तद्गतबुद्धिमनसां त्यक्तान्यव्यापाराणां घटते-इत्याशयं प्रकटयितु-माह-
      तद्बुद्धयस्तदात्मानस्तन्निष्ठास्तत्परायणाः । गच्छन्त्यपुनरावृत्तिं ज्ञाननिर्धौतकल्मषाः ॥ ५-१७ ॥
    slp1: |-
      tacca tadgatabudDimanasAM tyaktAnyavyApArARAM Gawate-ityASayaM prakawayitu-mAha-
      tadbudDayastadAtmAnastannizWAstatparAyaRAH . gacCantyapunarAvfttiM jYAnanirDOtakalmazAH .. 5-17 ..
    iast: |-
      tacca tadgatabuddhimanasāṃ tyaktānyavyāpārāṇāṃ ghaṭate-ityāśayaṃ prakaṭayitu-māha-
      tadbuddhayastadātmānastanniṣṭhāstatparāyaṇāḥ | gacchantyapunarāvṛttiṃ jñānanirdhautakalmaṣāḥ || 5-17 ||
  - verse: 18
    devanagari: |-
      स्मरन्तोऽपि मुहुस्त्वेतत्स्पृशन्तोऽपि स्वकर्मणि । सक्ता अपि न सज्जन्ति पङ्के रविकरा इव ॥ ५-१८ ॥
    slp1: |-
      smaranto'pi muhustvetatspfSanto'pi svakarmaRi . saktA api na sajjanti paNke ravikarA iva .. 5-18 ..
    iast: |-
      smaranto'pi muhustvetatspṛśanto'pi svakarmaṇi | saktā api na sajjanti paṅke ravikarā iva || 5-18 ||
  - verse: 19
    devanagari: |-
      यत एवं स्वभावस्तु प्रवर्तते इति अतो ध्वस्ताज्ञानानामित्थं स्थितिरित्याह-
      विद्याविनयसम्पन्ने ब्राह्मणे गवि हस्तिनि । शुनि चैव श्वपाके च पण्डिताः समदर्शिनः ॥ ५-१९ ॥
      इति अत्रापि भावयन्निति-ज्ञानस्यैवेयं धारोक्ता ॥ १९ ॥
    slp1: |-
      yata evaM svaBAvastu pravartate iti ato DvastAjYAnAnAmitTaM sTitirityAha-
      vidyAvinayasampanne brAhmaRe gavi hastini . Suni cEva SvapAke ca paRqitAH samadarSinaH .. 5-19 ..
      iti atrApi BAvayanniti-jYAnasyEveyaM DAroktA .. 19 ..
    iast: |-
      yata evaṃ svabhāvastu pravartate iti ato dhvastājñānānāmitthaṃ sthitirityāha-
      vidyāvinayasampanne brāhmaṇe gavi hastini | śuni caiva śvapāke ca paṇḍitāḥ samadarśinaḥ || 5-19 ||
      iti atrāpi bhāvayanniti-jñānasyaiveyaṃ dhāroktā || 19 ||
  - verse: 20
    devanagari: |-
      तस्य चेत्थं संभावनेत्याह-
      न प्रहृष्येत् प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम् । स्थिरबुद्धिरसम्मूढो ब्रह्मविद् ब्रह्मणि स्थितः ॥ ५-२० ॥
      एतस्य समदर्शिनः शत्रुमित्रादिविभागोऽपि व्यवहारमात्र एव नान्तः-ब्रह्मनिष्ठत्वात् ॥ २० ॥
    slp1: |-
      tasya cetTaM saMBAvanetyAha-
      na prahfzyet priyaM prApya nodvijetprApya cApriyam . sTirabudDirasammUQo brahmavid brahmaRi sTitaH .. 5-20 ..
      etasya samadarSinaH SatrumitrAdiviBAgo'pi vyavahAramAtra eva nAntaH-brahmanizWatvAt .. 20 ..
    iast: |-
      tasya cetthaṃ saṃbhāvanetyāha-
      na prahṛṣyet priyaṃ prāpya nodvijetprāpya cāpriyam | sthirabuddhirasammūḍho brahmavid brahmaṇi sthitaḥ || 5-20 ||
      etasya samadarśinaḥ śatrumitrādivibhāgo'pi vyavahāramātra eva nāntaḥ-brahmaniṣṭhatvāt || 20 ||
  - verse: 21
    devanagari: |-
      बाह्यस्पर्शेष्वसक्तात्मा विन्दत्यात्मनि यत्सुखम् । स ब्रह्मयोगयुक्तात्मा सुखमव्यमश्नुते ॥ ५-२१ ॥
      बाह्यस्पर्शे विषयात्मनि सक्तिर्यस्य नास्ति ॥ २१ ॥
    slp1: |-
      bAhyasparSezvasaktAtmA vindatyAtmani yatsuKam . sa brahmayogayuktAtmA suKamavyamaSnute .. 5-21 ..
      bAhyasparSe vizayAtmani saktiryasya nAsti .. 21 ..
    iast: |-
      bāhyasparśeṣvasaktātmā vindatyātmani yatsukham | sa brahmayogayuktātmā sukhamavyamaśnute || 5-21 ||
      bāhyasparśe viṣayātmani saktiryasya nāsti || 21 ||
  - verse: 22
    devanagari: |-
      स ह्येवं मन्यते-इत्याह
      ये हि संस्पर्शजा भोगा दुःखयोनय एव ते । आद्यन्तवन्तः कौन्तेय न तेषु रमते बुधः ॥ ५-२२ ॥
      स ह्येवं भावयति-बाह्यविषयजा भोगाः सर्वे दुःखकारणरूपाः तथाविधा अप्यनित्याः ॥ २२ ॥
    slp1: |-
      sa hyevaM manyate-ityAha
      ye hi saMsparSajA BogA duHKayonaya eva te . AdyantavantaH kOnteya na tezu ramate buDaH .. 5-22 ..
      sa hyevaM BAvayati-bAhyavizayajA BogAH sarve duHKakAraRarUpAH taTAviDA apyanityAH .. 22 ..
    iast: |-
      sa hyevaṃ manyate-ityāha
      ye hi saṃsparśajā bhogā duḥkhayonaya eva te | ādyantavantaḥ kaunteya na teṣu ramate budhaḥ || 5-22 ||
      sa hyevaṃ bhāvayati-bāhyaviṣayajā bhogāḥ sarve duḥkhakāraṇarūpāḥ tathāvidhā apyanityāḥ || 22 ||
  - verse: 23
    devanagari: |-
      शक्नोतीहैव यः सोढुं प्राक्शरीरविमोचनात् । कामक्रोधोद्भवं वेगं स युक्तः स सुखी मतः ॥ ५-२३ ॥
      न चैतद्दुःशकं-शरीरान्तकालं यावत् क्रोधकामजो वेगः क्षणमात्रं यदि सह्यते तदा आत्यन्तिकी सुखप्राप्तिः ॥ २३ ॥
    slp1: |-
      SaknotIhEva yaH soQuM prAkSarIravimocanAt . kAmakroDodBavaM vegaM sa yuktaH sa suKI mataH .. 5-23 ..
      na cEtadduHSakaM-SarIrAntakAlaM yAvat kroDakAmajo vegaH kzaRamAtraM yadi sahyate tadA AtyantikI suKaprAptiH .. 23 ..
    iast: |-
      śaknotīhaiva yaḥ soḍhuṃ prākśarīravimocanāt | kāmakrodhodbhavaṃ vegaṃ sa yuktaḥ sa sukhī mataḥ || 5-23 ||
      na caitadduḥśakaṃ-śarīrāntakālaṃ yāvat krodhakāmajo vegaḥ kṣaṇamātraṃ yadi sahyate tadā ātyantikī sukhaprāptiḥ || 23 ||
  - verse: 24
    devanagari: |-
      अन्तःसुखोऽन्तरारामस्तथाऽन्तर्ज्योतिरेव यः । स पार्थ परमं योगं ब्रह्मभूतोऽधिगच्छति ॥ ५-२४ ॥
      अतस्तस्यान्तरेव बाह्यानपेक्षि सुखम् तत्रैव रमते । तत्र चास्य प्रकाशः । व्यवहारे तु मूढत्वमिव । उक्तं च-जड एव विच रेदवादमतिः (प० सा० ७१) इति ॥ २४ ॥
    slp1: |-
      antaHsuKo'ntarArAmastaTA'ntarjyotireva yaH . sa pArTa paramaM yogaM brahmaBUto'DigacCati .. 5-24 ..
      atastasyAntareva bAhyAnapekzi suKam tatrEva ramate . tatra cAsya prakASaH . vyavahAre tu mUQatvamiva . uktaM ca-jaqa eva vica redavAdamatiH (pa0 sA0 71) iti .. 24 ..
    iast: |-
      antaḥsukho'ntarārāmastathā'ntarjyotireva yaḥ | sa pārtha paramaṃ yogaṃ brahmabhūto'dhigacchati || 5-24 ||
      atastasyāntareva bāhyānapekṣi sukham tatraiva ramate | tatra cāsya prakāśaḥ | vyavahāre tu mūḍhatvamiva | uktaṃ ca-jaḍa eva vica redavādamatiḥ (pa0 sā0 71) iti || 24 ||
  - verse: 25
    devanagari: |-
      लभन्ते ब्रह्मनिर्वाणमृषयः क्षीणकल्मषाः । छिन्नद्वैधा यतात्मानः सर्वभूतहिते रताः ॥ ५-२५ ॥
      एतच्च तैः प्राप्यं येषां भेदसंशयरूपौ ग्रन्थी विनष्टौ ॥ २५ ॥
    slp1: |-
      laBante brahmanirvARamfzayaH kzIRakalmazAH . CinnadvEDA yatAtmAnaH sarvaBUtahite ratAH .. 5-25 ..
      etacca tEH prApyaM yezAM BedasaMSayarUpO granTI vinazwO .. 25 ..
    iast: |-
      labhante brahmanirvāṇamṛṣayaḥ kṣīṇakalmaṣāḥ | chinnadvaidhā yatātmānaḥ sarvabhūtahite ratāḥ || 5-25 ||
      etacca taiḥ prāpyaṃ yeṣāṃ bhedasaṃśayarūpau granthī vinaṣṭau || 25 ||
  - verse: 26
    devanagari: |-
      कामक्रोधविमुक्तानां यतीनां यतचेतसाम् । अभितो ब्रह्मनिर्वाणं वर्तते विदितात्मनाम् ॥ ५-२६ ॥
      तेषां सर्वतः-सर्वास्ववस्थासु ब्रह्मसत्ता पारमार्थिकी न निरोधकालमपेक्षते ॥ २६ ॥
    slp1: |-
      kAmakroDavimuktAnAM yatInAM yatacetasAm . aBito brahmanirvARaM vartate viditAtmanAm .. 5-26 ..
      tezAM sarvataH-sarvAsvavasTAsu brahmasattA pAramArTikI na niroDakAlamapekzate .. 26 ..
    iast: |-
      kāmakrodhavimuktānāṃ yatīnāṃ yatacetasām | abhito brahmanirvāṇaṃ vartate viditātmanām || 5-26 ||
      teṣāṃ sarvataḥ-sarvāsvavasthāsu brahmasattā pāramārthikī na nirodhakālamapekṣate || 26 ||
  - verse: 27
    devanagari: |-
      स्पर्शान्कृत्वा बहिर्बाह्यांश्चक्षुश्चैवान्तरे भ्रुवोः । प्राणापानौ समौ कृत्वा नासाभ्यन्तरचारिणौ ॥ ५-२७ ॥
      बाह्यस्पर्शान् बहिःकृत्वा-अनङ्गीकृत्य भ्रुवोः-वामदक्षिणदृष्ट्योः क्रोधरागात्मिकयोरन्तरे-तद्रहितेस्थानविशेषे चक्षुरूपलक्षितानि सर्वेन्द्रियाणि विधाय प्राणापानौ-धर्माधर्मौ चित्तवृत्त्यभ्यन्तरे साम्येनावस्थाप्य नसते-कौटिल्येनासाम्येन क्रोधादिवशाद्व्यवहरति-इति नासा चित्तवृत्तिः । एतदेव बाह्ये ॥ २७ ॥
    slp1: |-
      sparSAnkftvA bahirbAhyAMScakzuScEvAntare BruvoH . prARApAnO samO kftvA nAsAByantaracAriRO .. 5-27 ..
      bAhyasparSAn bahiHkftvA-anaNgIkftya BruvoH-vAmadakziRadfzwyoH kroDarAgAtmikayorantare-tadrahitesTAnaviSeze cakzurUpalakzitAni sarvendriyARi viDAya prARApAnO-DarmADarmO cittavfttyaByantare sAmyenAvasTApya nasate-kOwilyenAsAmyena kroDAdivaSAdvyavaharati-iti nAsA cittavfttiH . etadeva bAhye .. 27 ..
    iast: |-
      sparśānkṛtvā bahirbāhyāṃścakṣuścaivāntare bhruvoḥ | prāṇāpānau samau kṛtvā nāsābhyantaracāriṇau || 5-27 ||
      bāhyasparśān bahiḥkṛtvā-anaṅgīkṛtya bhruvoḥ-vāmadakṣiṇadṛṣṭyoḥ krodharāgātmikayorantare-tadrahitesthānaviśeṣe cakṣurūpalakṣitāni sarvendriyāṇi vidhāya prāṇāpānau-dharmādharmau cittavṛttyabhyantare sāmyenāvasthāpya nasate-kauṭilyenāsāmyena krodhādivaśādvyavaharati-iti nāsā cittavṛttiḥ | etadeva bāhye || 27 ||
  - verse: 28
    devanagari: |-
      यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः । विगतेच्छाभयक्रोधो यः सदा मुक्त एव सः ॥ ५-२८ ॥
      एवंविधो योगी सर्वव्यवहारान् वर्तयन्नपि मुक्त एव ॥ २८ ॥
    slp1: |-
      yatendriyamanobudDirmunirmokzaparAyaRaH . vigatecCABayakroDo yaH sadA mukta eva saH .. 5-28 ..
      evaMviDo yogI sarvavyavahArAn vartayannapi mukta eva .. 28 ..
    iast: |-
      yatendriyamanobuddhirmunirmokṣaparāyaṇaḥ | vigatecchābhayakrodho yaḥ sadā mukta eva saḥ || 5-28 ||
      evaṃvidho yogī sarvavyavahārān vartayannapi mukta eva || 28 ||
  - verse: 29
    devanagari: |-
      भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम् । सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति ॥ ५-२९ ॥
      यज्ञफलेषु भोक्ता-त्यक्तफलत्वात् । एवं तपःसु । ईदृशं भगवत्तत्त्वं विदन् यथातथास्थितोऽपि मुच्यत इति शिवम् ॥ २९ ॥
    slp1: |-
      BoktAraM yajYatapasAM sarvalokamaheSvaram . suhfdaM sarvaBUtAnAM jYAtvA mAM SAntimfcCati .. 5-29 ..
      yajYaPalezu BoktA-tyaktaPalatvAt . evaM tapaHsu . IdfSaM BagavattattvaM vidan yaTAtaTAsTito'pi mucyata iti Sivam .. 29 ..
    iast: |-
      bhoktāraṃ yajñatapasāṃ sarvalokamaheśvaram | suhṛdaṃ sarvabhūtānāṃ jñātvā māṃ śāntimṛcchati || 5-29 ||
      yajñaphaleṣu bhoktā-tyaktaphalatvāt | evaṃ tapaḥsu | īdṛśaṃ bhagavattattvaṃ vidan yathātathāsthito'pi mucyata iti śivam || 29 ||
  - verse: 1000
    devanagari: |-
      सर्वाण्येवात्र भूतानि समत्वेनानुपस्यतः । जडवद्व्यवहारोऽपि मोक्षायैवावकल्पते ॥ ५ ॥
    slp1: |-
      sarvARyevAtra BUtAni samatvenAnupasyataH . jaqavadvyavahAro'pi mokzAyEvAvakalpate .. 5 ..
    iast: |-
      sarvāṇyevātra bhūtāni samatvenānupasyataḥ | jaḍavadvyavahāro'pi mokṣāyaivāvakalpate || 5 ||
- chapter: 6
  title_sa: षष्ठोऽध्यायः
  title_iast: "ṣaṣṭho'dhyāyaḥ"
  title_en: "Sixth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      श्रीभगवानुवाच
      अनाश्रितः कर्मफलं कार्यं कर्म करोति यः । स संन्यासी च योगी च न निरग्निर्न चाक्रियः ॥ ६-१ ॥
    slp1: |-
      SrIBagavAnuvAca
      anASritaH karmaPalaM kAryaM karma karoti yaH . sa saMnyAsI ca yogI ca na niragnirna cAkriyaH .. 6-1 ..
    iast: |-
      śrībhagavānuvāca
      anāśritaḥ karmaphalaṃ kāryaṃ karma karoti yaḥ | sa saṃnyāsī ca yogī ca na niragnirna cākriyaḥ || 6-1 ||
  - verse: 2
    devanagari: |-
      यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव । न ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन ॥ ६-२ ॥
      एवं प्राक्तनेनाध्यायगणेन साधितोऽर्थः श्लोकद्वयेन निगद्यते कार्यं-स्वजात्यादिविहितम् । संन्यासी इति योगी इति च पर्यायावेतौ । अत एवाह यं संन्यासमिति । तथा च-योगमन्तरेण संन्यासो नोपपद्यते एवं संकल्पसंन्यासं विना योगो न युज्यते । तस्मात्सततसंबद्धौ योगसंन्यासौ । न निरग्रिरित्यादिनायमर्थो ध्वन्यते-निरग्निश्च न भवति निष्क्रियश्च न भवति अथ च संन्यासी-इत्यद्भुतम् ॥ २ ॥
    slp1: |-
      yaM saMnyAsamiti prAhuryogaM taM vidDi pARqava . na hyasaMnyastasaNkalpo yogI Bavati kaScana .. 6-2 ..
      evaM prAktanenADyAyagaRena sADito'rTaH Slokadvayena nigadyate kAryaM-svajAtyAdivihitam . saMnyAsI iti yogI iti ca paryAyAvetO . ata evAha yaM saMnyAsamiti . taTA ca-yogamantareRa saMnyAso nopapadyate evaM saMkalpasaMnyAsaM vinA yogo na yujyate . tasmAtsatatasaMbadDO yogasaMnyAsO . na niragrirityAdinAyamarTo Dvanyate-niragniSca na Bavati nizkriyaSca na Bavati aTa ca saMnyAsI-ityadButam .. 2 ..
    iast: |-
      yaṃ saṃnyāsamiti prāhuryogaṃ taṃ viddhi pāṇḍava | na hyasaṃnyastasaṅkalpo yogī bhavati kaścana || 6-2 ||
      evaṃ prāktanenādhyāyagaṇena sādhito'rthaḥ ślokadvayena nigadyate kāryaṃ-svajātyādivihitam | saṃnyāsī iti yogī iti ca paryāyāvetau | ata evāha yaṃ saṃnyāsamiti | tathā ca-yogamantareṇa saṃnyāso nopapadyate evaṃ saṃkalpasaṃnyāsaṃ vinā yogo na yujyate | tasmātsatatasaṃbaddhau yogasaṃnyāsau | na niragrirityādināyamartho dhvanyate-niragniśca na bhavati niṣkriyaśca na bhavati atha ca saṃnyāsī-ityadbhutam || 2 ||
  - verse: 3
    devanagari: |-
      तद्यपि द्यूतमसिंहासनं राज्यम् इति युक्त्या च केवलस्य निष्क्रियस्य संन्यासित्वमुपपद्यते इत्युक्तम् तथापि
      आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते । योगारूढस्य तस्यैव शमः कारणमुच्यते ॥ ६-३ ॥
      मुनेः-ज्ञानवतः कर्म-करणीयं कारणं-प्रापकः । शमः-प्राप्तभूमावनुपरमः । कारणमत्र लक्षणम् ॥ ३ ॥
    slp1: |-
      tadyapi dyUtamasiMhAsanaM rAjyam iti yuktyA ca kevalasya nizkriyasya saMnyAsitvamupapadyate ityuktam taTApi
      ArurukzormuneryogaM karma kAraRamucyate . yogArUQasya tasyEva SamaH kAraRamucyate .. 6-3 ..
      muneH-jYAnavataH karma-karaRIyaM kAraRaM-prApakaH . SamaH-prAptaBUmAvanuparamaH . kAraRamatra lakzaRam .. 3 ..
    iast: |-
      tadyapi dyūtamasiṃhāsanaṃ rājyam iti yuktyā ca kevalasya niṣkriyasya saṃnyāsitvamupapadyate ityuktam tathāpi
      ārurukṣormuneryogaṃ karma kāraṇamucyate | yogārūḍhasya tasyaiva śamaḥ kāraṇamucyate || 6-3 ||
      muneḥ-jñānavataḥ karma-karaṇīyaṃ kāraṇaṃ-prāpakaḥ | śamaḥ-prāptabhūmāvanuparamaḥ | kāraṇamatra lakṣaṇam || 3 ||
  - verse: 4
    devanagari: |-
      एष एवार्थः प्रकाश्यते-
      यदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जति । सर्वसङ्कल्पसंन्यासी योगारूढस्तदोच्यते ॥ ६-४ ॥
      इन्द्रियार्थाः-विषयाः । तदर्थानि च कर्माणि-विषयार्जनादीनि ॥ ४ ॥
    slp1: |-
      eza evArTaH prakASyate-
      yadA hi nendriyArTezu na karmasvanuzajjati . sarvasaNkalpasaMnyAsI yogArUQastadocyate .. 6-4 ..
      indriyArTAH-vizayAH . tadarTAni ca karmARi-vizayArjanAdIni .. 4 ..
    iast: |-
      eṣa evārthaḥ prakāśyate-
      yadā hi nendriyārtheṣu na karmasvanuṣajjati | sarvasaṅkalpasaṃnyāsī yogārūḍhastadocyate || 6-4 ||
      indriyārthāḥ-viṣayāḥ | tadarthāni ca karmāṇi-viṣayārjanādīni || 4 ||
  - verse: 5
    devanagari: |-
      अस्यां च बुद्धाववश्यमेवावधेयमित्याह-
      उद्धरेदात्मनात्मानं नात्मानमवसादयेत् । आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः ॥ ६-५ ॥
      अत्र च नान्य उपाय अपितु आत्मैव-मन एवेत्यर्थः ॥ ५ ॥
    slp1: |-
      asyAM ca budDAvavaSyamevAvaDeyamityAha-
      udDaredAtmanAtmAnaM nAtmAnamavasAdayet . AtmEva hyAtmano banDurAtmEva ripurAtmanaH .. 6-5 ..
      atra ca nAnya upAya apitu AtmEva-mana evetyarTaH .. 5 ..
    iast: |-
      asyāṃ ca buddhāvavaśyamevāvadheyamityāha-
      uddharedātmanātmānaṃ nātmānamavasādayet | ātmaiva hyātmano bandhurātmaiva ripurātmanaḥ || 6-5 ||
      atra ca nānya upāya apitu ātmaiva-mana evetyarthaḥ || 5 ||
  - verse: 6
    devanagari: |-
      बन्धुरात्मात्मनस्तस्य येनात्मैवात्मना जितः । अजितात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत् ॥ ६-६ ॥
      जितं हि मनो मित्रं घोरतरसंसारोद्धरणं करोति । अजितं तु तीव्रनिरयपातनाच्छत्रुत्वं कुरुते ॥ ६ ॥
    slp1: |-
      banDurAtmAtmanastasya yenAtmEvAtmanA jitaH . ajitAtmanastu Satrutve vartetAtmEva Satruvat .. 6-6 ..
      jitaM hi mano mitraM GoratarasaMsArodDaraRaM karoti . ajitaM tu tIvranirayapAtanAcCatrutvaM kurute .. 6 ..
    iast: |-
      bandhurātmātmanastasya yenātmaivātmanā jitaḥ | ajitātmanastu śatrutve vartetātmaiva śatruvat || 6-6 ||
      jitaṃ hi mano mitraṃ ghoratarasaṃsāroddharaṇaṃ karoti | ajitaṃ tu tīvranirayapātanācchatrutvaṃ kurute || 6 ||
  - verse: 7
    devanagari: |-
      तत्र जितमनस इदं रूपम्-
      जितात्मनः प्रशान्तस्य परात्मसु समामतिः । शीतोष्णसुखदुःखेषु तथा मानावमानयोः ॥ ६-७ ॥
      प्रशान्तः-निरहंकारः । परेष्वात्मनि च शीतोष्णादिषु च अभेदधीः-न रागद्वेषौ ॥ ७ ॥
    slp1: |-
      tatra jitamanasa idaM rUpam-
      jitAtmanaH praSAntasya parAtmasu samAmatiH . SItozRasuKaduHKezu taTA mAnAvamAnayoH .. 6-7 ..
      praSAntaH-nirahaMkAraH . parezvAtmani ca SItozRAdizu ca aBedaDIH-na rAgadvezO .. 7 ..
    iast: |-
      tatra jitamanasa idaṃ rūpam-
      jitātmanaḥ praśāntasya parātmasu samāmatiḥ | śītoṣṇasukhaduḥkheṣu tathā mānāvamānayoḥ || 6-7 ||
      praśāntaḥ-nirahaṃkāraḥ | pareṣvātmani ca śītoṣṇādiṣu ca abhedadhīḥ-na rāgadveṣau || 7 ||
  - verse: 8
    devanagari: |-
      ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितेन्द्रियः । युक्त इत्युच्यते योगी समलोष्टाश्मकाञ्चनः ॥ ६-८ ॥
      ज्ञानम्-अभ्रान्ता बुद्धिः । विविधं ज्ञानं यत्र तद्विज्ञानं-प्राग्युक्त्युदितं कर्म ॥ ८ ॥
    slp1: |-
      jYAnavijYAnatfptAtmA kUwasTo vijitendriyaH . yukta ityucyate yogI samalozwASmakAYcanaH .. 6-8 ..
      jYAnam-aBrAntA budDiH . viviDaM jYAnaM yatra tadvijYAnaM-prAgyuktyuditaM karma .. 8 ..
    iast: |-
      jñānavijñānatṛptātmā kūṭastho vijitendriyaḥ | yukta ityucyate yogī samaloṣṭāśmakāñcanaḥ || 6-8 ||
      jñānam-abhrāntā buddhiḥ | vividhaṃ jñānaṃ yatra tadvijñānaṃ-prāgyuktyuditaṃ karma || 8 ||
  - verse: 9
    devanagari: |-
      सुहृन्मित्रार्युदासीनमध्यस्थद्वेष्यबन्धुषु । साधुष्वपि च पापेषु समबुद्धिर्विशिष्यते ॥ ६-९ ॥
      सुहृत्-यस्याकारणमेव शोभनं हृदयम् । मित्रत्वम् अन्योन्यम् । अरित्वं-परस्परम् । उदासीनः-एतदुभयरहितः । मध्यस्थः-केनचिदंशेन मित्रं केनचिच्छत्त्रुः । द्वेषार्हो द्वेष्टुमशक्यो द्वेष्यः । बन्धुः-योन्यादिसंबन्धेन । एतेषु सर्वेषु समधीः । एवं साधुषु पापेषु च । स च विशिष्यते-क्रमात्क्रमं संसारात्तरत्ति ॥ ९ ॥
    slp1: |-
      suhfnmitrAryudAsInamaDyasTadvezyabanDuzu . sADuzvapi ca pApezu samabudDirviSizyate .. 6-9 ..
      suhft-yasyAkAraRameva SoBanaM hfdayam . mitratvam anyonyam . aritvaM-parasparam . udAsInaH-etaduBayarahitaH . maDyasTaH-kenacidaMSena mitraM kenacicCattruH . dvezArho dvezwumaSakyo dvezyaH . banDuH-yonyAdisaMbanDena . etezu sarvezu samaDIH . evaM sADuzu pApezu ca . sa ca viSizyate-kramAtkramaM saMsArAttaratti .. 9 ..
    iast: |-
      suhṛnmitrāryudāsīnamadhyasthadveṣyabandhuṣu | sādhuṣvapi ca pāpeṣu samabuddhirviśiṣyate || 6-9 ||
      suhṛt-yasyākāraṇameva śobhanaṃ hṛdayam | mitratvam anyonyam | aritvaṃ-parasparam | udāsīnaḥ-etadubhayarahitaḥ | madhyasthaḥ-kenacidaṃśena mitraṃ kenacicchattruḥ | dveṣārho dveṣṭumaśakyo dveṣyaḥ | bandhuḥ-yonyādisaṃbandhena | eteṣu sarveṣu samadhīḥ | evaṃ sādhuṣu pāpeṣu ca | sa ca viśiṣyate-kramātkramaṃ saṃsārāttaratti || 9 ||
  - verse: 10
    devanagari: |-
      ईदृशैश्च बन्द्यचरणैः-
      इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः । निर्दोषं हि समं ब्रह्म तस्माद् ब्रह्मणि ते स्थिता ॥ ६-१० ॥
      इहैव-सत्यपि शरीरसंबन्धे सर्गो जितः-साम्यावस्थत्वात् । संसारस्य ह्यबन्धकत्वमेषाम् । साम्ये हि ते प्रतिष्ठिताः । साम्यं च ब्रह्म ॥ १० ॥
    slp1: |-
      IdfSESca bandyacaraREH-
      ihEva tErjitaH sargo yezAM sAmye sTitaM manaH . nirdozaM hi samaM brahma tasmAd brahmaRi te sTitA .. 6-10 ..
      ihEva-satyapi SarIrasaMbanDe sargo jitaH-sAmyAvasTatvAt . saMsArasya hyabanDakatvamezAm . sAmye hi te pratizWitAH . sAmyaM ca brahma .. 10 ..
    iast: |-
      īdṛśaiśca bandyacaraṇaiḥ-
      ihaiva tairjitaḥ sargo yeṣāṃ sāmye sthitaṃ manaḥ | nirdoṣaṃ hi samaṃ brahma tasmād brahmaṇi te sthitā || 6-10 ||
      ihaiva-satyapi śarīrasaṃbandhe sargo jitaḥ-sāmyāvasthatvāt | saṃsārasya hyabandhakatvameṣām | sāmye hi te pratiṣṭhitāḥ | sāmyaṃ ca brahma || 10 ||
  - verse: 11
    devanagari: |-
      ननु जितात्मनः-इत्युक्तं तत्कथं तज्जयः ? इत्याशङ्क्य आरुरुक्षोः कश्चिदुपायः कायसमत्वादिकश्चित्तसंयम उपदिश्यते
      योगी युञ्जीत सततमात्मानं रहसि स्थितः । एकाकी यतचित्तात्मा निराशीरपरिग्रहः ॥ ६-११ ॥
      आत्मानं चित्तं च युज्जीत-एकाग्रीकुर्यात् । सततमिति-न परिमितं कालम् । एकाकित्वादिषु सत्सु एतद्युज्यते नान्यथा ॥ ११ ॥
    slp1: |-
      nanu jitAtmanaH-ityuktaM tatkaTaM tajjayaH ? ityASaNkya ArurukzoH kaScidupAyaH kAyasamatvAdikaScittasaMyama upadiSyate
      yogI yuYjIta satatamAtmAnaM rahasi sTitaH . ekAkI yatacittAtmA nirASIraparigrahaH .. 6-11 ..
      AtmAnaM cittaM ca yujjIta-ekAgrIkuryAt . satatamiti-na parimitaM kAlam . ekAkitvAdizu satsu etadyujyate nAnyaTA .. 11 ..
    iast: |-
      nanu jitātmanaḥ-ityuktaṃ tatkathaṃ tajjayaḥ ? ityāśaṅkya ārurukṣoḥ kaścidupāyaḥ kāyasamatvādikaścittasaṃyama upadiśyate
      yogī yuñjīta satatamātmānaṃ rahasi sthitaḥ | ekākī yatacittātmā nirāśīraparigrahaḥ || 6-11 ||
      ātmānaṃ cittaṃ ca yujjīta-ekāgrīkuryāt | satatamiti-na parimitaṃ kālam | ekākitvādiṣu satsu etadyujyate nānyathā || 11 ||
  - verse: 12
    devanagari: |-
      शुचौ देशे प्रतिष्ठाप्य स्थिरमासनमात्मनः । नात्युच्छ्रितं नातिनीचं चैलाजिनकुशोत्तरम् ॥ ६-१२ ॥
    slp1: |-
      SucO deSe pratizWApya sTiramAsanamAtmanaH . nAtyucCritaM nAtinIcaM cElAjinakuSottaram .. 6-12 ..
    iast: |-
      śucau deśe pratiṣṭhāpya sthiramāsanamātmanaḥ | nātyucchritaṃ nātinīcaṃ cailājinakuśottaram || 6-12 ||
  - verse: 13
    devanagari: |-
      तत्रैकाग्रं मनः कृत्वा यतचित्तेन्द्रियक्रियः । उपविश्यासने युञ्ज्याद्योगमात्मविशुद्धये ॥ ६-१३ ॥
      आसनस्थैर्यात्कालस्थैर्ये चित्तस्थैर्यम् । चित्तक्रियाः-संकल्पात्मानः अन्याश्चेन्द्रियक्रिया येन यताः-नियमं नीताः ॥ १३ ॥
    slp1: |-
      tatrEkAgraM manaH kftvA yatacittendriyakriyaH . upaviSyAsane yuYjyAdyogamAtmaviSudDaye .. 6-13 ..
      AsanasTEryAtkAlasTErye cittasTEryam . cittakriyAH-saMkalpAtmAnaH anyAScendriyakriyA yena yatAH-niyamaM nItAH .. 13 ..
    iast: |-
      tatraikāgraṃ manaḥ kṛtvā yatacittendriyakriyaḥ | upaviśyāsane yuñjyādyogamātmaviśuddhaye || 6-13 ||
      āsanasthairyātkālasthairye cittasthairyam | cittakriyāḥ-saṃkalpātmānaḥ anyāścendriyakriyā yena yatāḥ-niyamaṃ nītāḥ || 13 ||
  - verse: 14
    devanagari: |-
      समं कायशिरोग्रीवं धारयन्नचलं स्थिरः । संपश्यन्नासिकाग्रं स्वं दिशश्चानवलोकयन् ॥ ६-१४ ॥
    slp1: |-
      samaM kAyaSirogrIvaM DArayannacalaM sTiraH . saMpaSyannAsikAgraM svaM diSaScAnavalokayan .. 6-14 ..
    iast: |-
      samaṃ kāyaśirogrīvaṃ dhārayannacalaṃ sthiraḥ | saṃpaśyannāsikāgraṃ svaṃ diśaścānavalokayan || 6-14 ||
  - verse: 15
    devanagari: |-
      प्रशान्तात्मा विगतभीर्ब्रह्मचारिव्रते स्थितः । मनः संयम्य मच्चित्तो युक्त आसीत मत्परः ॥ ६-१५ ॥
      धारयन्-यत्नेन । नासाग्रस्यावलोकने दिशामनवलोकनम् । मत्परमतया युक्त आसीतेत्यर्थः ॥ १५ ॥
    slp1: |-
      praSAntAtmA vigataBIrbrahmacArivrate sTitaH . manaH saMyamya maccitto yukta AsIta matparaH .. 6-15 ..
      DArayan-yatnena . nAsAgrasyAvalokane diSAmanavalokanam . matparamatayA yukta AsItetyarTaH .. 15 ..
    iast: |-
      praśāntātmā vigatabhīrbrahmacārivrate sthitaḥ | manaḥ saṃyamya maccitto yukta āsīta matparaḥ || 6-15 ||
      dhārayan-yatnena | nāsāgrasyāvalokane diśāmanavalokanam | matparamatayā yukta āsītetyarthaḥ || 15 ||
  - verse: 16
    devanagari: |-
      युञ्जन्नेवं सदात्मानं मद्भक्तोऽनन्यमानसः । शान्तिं निर्वाणपरमां मत्संस्थामधिगच्छति ॥ ६-१६ ॥
      एवमात्मानं युञ्जतः-समादधतः शान्तिर्जायते । यस्यां संस्थापर्यन्तकाष्ठा मत्प्राप्तियोगोऽस्तीति ॥ १६ ॥
    slp1: |-
      yuYjannevaM sadAtmAnaM madBakto'nanyamAnasaH . SAntiM nirvARaparamAM matsaMsTAmaDigacCati .. 6-16 ..
      evamAtmAnaM yuYjataH-samAdaDataH SAntirjAyate . yasyAM saMsTAparyantakAzWA matprAptiyogo'stIti .. 16 ..
    iast: |-
      yuñjannevaṃ sadātmānaṃ madbhakto'nanyamānasaḥ | śāntiṃ nirvāṇaparamāṃ matsaṃsthāmadhigacchati || 6-16 ||
      evamātmānaṃ yuñjataḥ-samādadhataḥ śāntirjāyate | yasyāṃ saṃsthāparyantakāṣṭhā matprāptiyogo'stīti || 16 ||
  - verse: 17
    devanagari: |-
      योगोऽस्ति नैवात्यशतो न चैकान्तमनश्नतः । न चातिस्वप्नशीलस्य नातिजागरतोऽर्जुन ॥ ६-१७ ॥
    slp1: |-
      yogo'sti nEvAtyaSato na cEkAntamanaSnataH . na cAtisvapnaSIlasya nAtijAgarato'rjuna .. 6-17 ..
    iast: |-
      yogo'sti naivātyaśato na caikāntamanaśnataḥ | na cātisvapnaśīlasya nātijāgarato'rjuna || 6-17 ||
  - verse: 18
    devanagari: |-
      युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु । युक्तस्वप्नावबोधस्य योगो भवति दुःखहा ॥ ६-१८ ॥
      आहारेषु-आहियमाणेषु विषयेषु । विहारः-उपभोगाय प्रवृत्तिः । तस्याश्च युक्तत्वं-नात्यन्तासक्तिः नात्यन्तपरिवर्जनम् । एवं सर्वत्र । शिष्टं स्पष्टम् । जागरतः- इत्यादि मुनेः प्रमाणत्वाद्रेदवत् । एवमन्यत्रापि ॥ १८ ॥
    slp1: |-
      yuktAhAravihArasya yuktacezwasya karmasu . yuktasvapnAvaboDasya yogo Bavati duHKahA .. 6-18 ..
      AhArezu-AhiyamARezu vizayezu . vihAraH-upaBogAya pravfttiH . tasyASca yuktatvaM-nAtyantAsaktiH nAtyantaparivarjanam . evaM sarvatra . SizwaM spazwam . jAgarataH- ityAdi muneH pramARatvAdredavat . evamanyatrApi .. 18 ..
    iast: |-
      yuktāhāravihārasya yuktaceṣṭasya karmasu | yuktasvapnāvabodhasya yogo bhavati duḥkhahā || 6-18 ||
      āhāreṣu-āhiyamāṇeṣu viṣayeṣu | vihāraḥ-upabhogāya pravṛttiḥ | tasyāśca yuktatvaṃ-nātyantāsaktiḥ nātyantaparivarjanam | evaṃ sarvatra | śiṣṭaṃ spaṣṭam | jāgarataḥ- ityādi muneḥ pramāṇatvādredavat | evamanyatrāpi || 18 ||
  - verse: 19
    devanagari: |-
      यदा विनियतं चित्तमात्मन्येवावतिष्ठते । निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा ॥ ६-१९ ॥
      अस्य च योगिनश्चिह्नम् आत्मन्येव नियतमनाः न किञ्चिदपि स्पृहयते ॥ १९ ॥
    slp1: |-
      yadA viniyataM cittamAtmanyevAvatizWate . niHspfhaH sarvakAmeByo yukta ityucyate tadA .. 6-19 ..
      asya ca yoginaScihnam Atmanyeva niyatamanAH na kiYcidapi spfhayate .. 19 ..
    iast: |-
      yadā viniyataṃ cittamātmanyevāvatiṣṭhate | niḥspṛhaḥ sarvakāmebhyo yukta ityucyate tadā || 6-19 ||
      asya ca yoginaścihnam ātmanyeva niyatamanāḥ na kiñcidapi spṛhayate || 19 ||
  - verse: 20
    devanagari: |-
      यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता । योगिनो यतचित्तस्य युञ्जतो योगमात्मनि ॥ ६-२० ॥
      यथा निवातस्थो दीपो न चलति एवं योगी । चलनमस्य विषयादीनामर्जनादयः प्रयासाः ॥ २० ॥
    slp1: |-
      yaTA dIpo nivAtasTo neNgate sopamA smftA . yogino yatacittasya yuYjato yogamAtmani .. 6-20 ..
      yaTA nivAtasTo dIpo na calati evaM yogI . calanamasya vizayAdInAmarjanAdayaH prayAsAH .. 20 ..
    iast: |-
      yathā dīpo nivātastho neṅgate sopamā smṛtā | yogino yatacittasya yuñjato yogamātmani || 6-20 ||
      yathā nivātastho dīpo na calati evaṃ yogī | calanamasya viṣayādīnāmarjanādayaḥ prayāsāḥ || 20 ||
  - verse: 21
    devanagari: |-
      इदानीं तस्य स्वस्वभावस्य ब्रह्मणो बहुतरविशेषणद्वारेण स्वरूपं निरूप्यते तीर्थान्तरकल्पितेभ्यश्च रूपेभ्यो व्यतिरेकः-
      यत्रोपरमते चित्तं निरुद्धं योगसेवनात् । यत्र चैवात्मनात्मानं पश्यन्नात्मनि तुष्यति ॥ ६-२१ ॥
    slp1: |-
      idAnIM tasya svasvaBAvasya brahmaRo bahutaraviSezaRadvAreRa svarUpaM nirUpyate tIrTAntarakalpiteByaSca rUpeByo vyatirekaH-
      yatroparamate cittaM nirudDaM yogasevanAt . yatra cEvAtmanAtmAnaM paSyannAtmani tuzyati .. 6-21 ..
    iast: |-
      idānīṃ tasya svasvabhāvasya brahmaṇo bahutaraviśeṣaṇadvāreṇa svarūpaṃ nirūpyate tīrthāntarakalpitebhyaśca rūpebhyo vyatirekaḥ-
      yatroparamate cittaṃ niruddhaṃ yogasevanāt | yatra caivātmanātmānaṃ paśyannātmani tuṣyati || 6-21 ||
  - verse: 22
    devanagari: |-
      सुखमात्यन्तिकं यत्तद् बुद्धिग्राह्यमतीन्द्रियम् । वेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः ॥ ६-२२ ॥
    slp1: |-
      suKamAtyantikaM yattad budDigrAhyamatIndriyam . vetti yatra na cEvAyaM sTitaScalati tattvataH .. 6-22 ..
    iast: |-
      sukhamātyantikaṃ yattad buddhigrāhyamatīndriyam | vetti yatra na caivāyaṃ sthitaścalati tattvataḥ || 6-22 ||
  - verse: 23
    devanagari: |-
      यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः । यस्मिन् स्थितो न दुःखेन गुरुणापि विचाल्यते ॥ ६-२३ ॥
    slp1: |-
      yaM labDvA cAparaM lABaM manyate nADikaM tataH . yasmin sTito na duHKena guruRApi vicAlyate .. 6-23 ..
    iast: |-
      yaṃ labdhvā cāparaṃ lābhaṃ manyate nādhikaṃ tataḥ | yasmin sthito na duḥkhena guruṇāpi vicālyate || 6-23 ||
  - verse: 24
    devanagari: |-
      तं विद्याद्दुःखसंयोगवियोगं योगसंज्ञितम् । स निश्चयेन योक्तव्यो योगोऽनिर्विण्नचेतसा ॥ ६-२४ ॥
      यत्र मनो निरुद्धमुपरमते स्वयमेव आत्यन्तिकं-विषयकृतकालुष्या-भावात् सुखं यत्र वेत्ति । अपरो लाभो-धनदारपुत्रादीनाम् । सन्नियोगलब्धश्च योगः । अन्यत्र सुखधीर्निवर्तते चेति वस्तुस्वभावोऽयमित्यर्थः । न विचाल्यते-विशेषेण न चाल्यते अपि तु संस्कारमात्रेणैवास्य प्रथमक्षणमात्रमेव चलनं करुणादिवशात् नतु मूढतया विनष्टो वताहं किं मया प्रतिपत्तव्यम् ! इत्यादि । दुःखसंयोगस्य वियोगो यतः । स च निश्चयेन-आस्तिकताजनितया श्रद्धया सर्वथा योक्तव्यः-अभ्यसनीयः । अनिर्विणम्-उपेयप्राप्तौ दृढतरं संसारं दुःखबहुलं प्रति निर्विणं वा चेतो यस्य ॥ २४ ॥
    slp1: |-
      taM vidyAdduHKasaMyogaviyogaM yogasaMjYitam . sa niScayena yoktavyo yogo'nirviRnacetasA .. 6-24 ..
      yatra mano nirudDamuparamate svayameva AtyantikaM-vizayakftakAluzyA-BAvAt suKaM yatra vetti . aparo lABo-DanadAraputrAdInAm . sanniyogalabDaSca yogaH . anyatra suKaDIrnivartate ceti vastusvaBAvo'yamityarTaH . na vicAlyate-viSezeRa na cAlyate api tu saMskAramAtreREvAsya praTamakzaRamAtrameva calanaM karuRAdivaSAt natu mUQatayA vinazwo vatAhaM kiM mayA pratipattavyam ! ityAdi . duHKasaMyogasya viyogo yataH . sa ca niScayena-AstikatAjanitayA SradDayA sarvaTA yoktavyaH-aByasanIyaH . anirviRam-upeyaprAptO dfQataraM saMsAraM duHKabahulaM prati nirviRaM vA ceto yasya .. 24 ..
    iast: |-
      taṃ vidyādduḥkhasaṃyogaviyogaṃ yogasaṃjñitam | sa niścayena yoktavyo yogo'nirviṇnacetasā || 6-24 ||
      yatra mano niruddhamuparamate svayameva ātyantikaṃ-viṣayakṛtakāluṣyā-bhāvāt sukhaṃ yatra vetti | aparo lābho-dhanadāraputrādīnām | sanniyogalabdhaśca yogaḥ | anyatra sukhadhīrnivartate ceti vastusvabhāvo'yamityarthaḥ | na vicālyate-viśeṣeṇa na cālyate api tu saṃskāramātreṇaivāsya prathamakṣaṇamātrameva calanaṃ karuṇādivaśāt natu mūḍhatayā vinaṣṭo vatāhaṃ kiṃ mayā pratipattavyam ! ityādi | duḥkhasaṃyogasya viyogo yataḥ | sa ca niścayena-āstikatājanitayā śraddhayā sarvathā yoktavyaḥ-abhyasanīyaḥ | anirviṇam-upeyaprāptau dṛḍhataraṃ saṃsāraṃ duḥkhabahulaṃ prati nirviṇaṃ vā ceto yasya || 24 ||
  - verse: 25
    devanagari: |-
      कामानां त्यागे उपायः सङ्कल्पत्याग इत्याह-
      सङ्कल्पप्रभवान् कामांस्त्यक्त्वा सर्वानशेषतः । मनसैवेन्द्रियग्रामं विनियम्य समन्ततः ॥ ६-२५ ॥
    slp1: |-
      kAmAnAM tyAge upAyaH saNkalpatyAga ityAha-
      saNkalpapraBavAn kAmAMstyaktvA sarvAnaSezataH . manasEvendriyagrAmaM viniyamya samantataH .. 6-25 ..
    iast: |-
      kāmānāṃ tyāge upāyaḥ saṅkalpatyāga ityāha-
      saṅkalpaprabhavān kāmāṃstyaktvā sarvānaśeṣataḥ | manasaivendriyagrāmaṃ viniyamya samantataḥ || 6-25 ||
  - verse: 26
    devanagari: |-
      शनैः शनैरुपरमेद्बुद्ध्या धृतिगृहीतया । आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत् ॥ ६-२६ ॥
      मनसैव-न व्यापारोपरमेण । धृतिं गृहीत्वा क्रमात्क्रममभिलाषदुःखं प्रतनूकृत्य । किंचिदपि-विषयाणां त्यागग्रहणादिकं न चिन्तयेत् । यत्त्वन्यैर्व्याख्यातं न किंचिदपि चिन्तयेत्-इति तदस्मभ्यं न रुचितं-शून्यवादप्रसङ्गात् ॥ २६ ॥
    slp1: |-
      SanEH SanEruparamedbudDyA DftigfhItayA . AtmasaMsTaM manaH kftvA na kiYcidapi cintayet .. 6-26 ..
      manasEva-na vyApAroparameRa . DftiM gfhItvA kramAtkramamaBilAzaduHKaM pratanUkftya . kiMcidapi-vizayARAM tyAgagrahaRAdikaM na cintayet . yattvanyErvyAKyAtaM na kiMcidapi cintayet-iti tadasmaByaM na rucitaM-SUnyavAdaprasaNgAt .. 26 ..
    iast: |-
      śanaiḥ śanairuparamedbuddhyā dhṛtigṛhītayā | ātmasaṃsthaṃ manaḥ kṛtvā na kiñcidapi cintayet || 6-26 ||
      manasaiva-na vyāpāroparameṇa | dhṛtiṃ gṛhītvā kramātkramamabhilāṣaduḥkhaṃ pratanūkṛtya | kiṃcidapi-viṣayāṇāṃ tyāgagrahaṇādikaṃ na cintayet | yattvanyairvyākhyātaṃ na kiṃcidapi cintayet-iti tadasmabhyaṃ na rucitaṃ-śūnyavādaprasaṅgāt || 26 ||
  - verse: 27
    devanagari: |-
      न च विषयव्युपरममात्रमेव प्राप्यमित्युच्यते-
      यतो यतो निश्चरति मनश्चञ्चलमस्थिरम् । ततस्ततो नियम्यैतदात्मन्येव शमं नयेत् ॥ ६-२७ ॥
      यतो यतो मनो निवर्तते तन्निवर्तनसमनन्तरमेव आत्मनि शमयेत् । अन्यथा अप्रतिष्ठं चित्तं पुनरपि विषयानेवावलम्बते ॥ २७ ॥
    slp1: |-
      na ca vizayavyuparamamAtrameva prApyamityucyate-
      yato yato niScarati manaScaYcalamasTiram . tatastato niyamyEtadAtmanyeva SamaM nayet .. 6-27 ..
      yato yato mano nivartate tannivartanasamanantarameva Atmani Samayet . anyaTA apratizWaM cittaM punarapi vizayAnevAvalambate .. 27 ..
    iast: |-
      na ca viṣayavyuparamamātrameva prāpyamityucyate-
      yato yato niścarati manaścañcalamasthiram | tatastato niyamyaitadātmanyeva śamaṃ nayet || 6-27 ||
      yato yato mano nivartate tannivartanasamanantarameva ātmani śamayet | anyathā apratiṣṭhaṃ cittaṃ punarapi viṣayānevāvalambate || 27 ||
  - verse: 28
    devanagari: |-
      प्रशान्तमनसं ह्येनं योगिनं सुखमुत्तमम् । उपैति शान्तरजसं ब्रह्मभूतमकल्मषम् ॥ ६-२८ ॥
      तत्रात्मनि शान्तचित्तं योगिनं-कर्मभूतं सुखं कर्तृभूतमुपैति ॥ २८ ॥
    slp1: |-
      praSAntamanasaM hyenaM yoginaM suKamuttamam . upEti SAntarajasaM brahmaBUtamakalmazam .. 6-28 ..
      tatrAtmani SAntacittaM yoginaM-karmaBUtaM suKaM kartfBUtamupEti .. 28 ..
    iast: |-
      praśāntamanasaṃ hyenaṃ yoginaṃ sukhamuttamam | upaiti śāntarajasaṃ brahmabhūtamakalmaṣam || 6-28 ||
      tatrātmani śāntacittaṃ yoginaṃ-karmabhūtaṃ sukhaṃ kartṛbhūtamupaiti || 28 ||
  - verse: 29
    devanagari: |-
      युञ्जन्नेवं सदात्मानं योगी नियतमानसः । सुखेन ब्रह्मसंयोगमत्यन्तमधिगच्छति ॥ ६-२९ ॥
      अनेनैव क्रमेण योगिनां सुखेन ब्रह्मावाप्तिः नतु कष्टयोगादिनेति तात्पर्यम् ॥ २९ ॥
    slp1: |-
      yuYjannevaM sadAtmAnaM yogI niyatamAnasaH . suKena brahmasaMyogamatyantamaDigacCati .. 6-29 ..
      anenEva krameRa yoginAM suKena brahmAvAptiH natu kazwayogAdineti tAtparyam .. 29 ..
    iast: |-
      yuñjannevaṃ sadātmānaṃ yogī niyatamānasaḥ | sukhena brahmasaṃyogamatyantamadhigacchati || 6-29 ||
      anenaiva krameṇa yogināṃ sukhena brahmāvāptiḥ natu kaṣṭayogādineti tātparyam || 29 ||
  - verse: 30
    devanagari: |-
      सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि । ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः ॥ ६-३० ॥
      सर्वेषु भूतेषु आत्मानं-ग्राहकरूपतयानुप्रविशन्तं भावयेत् । आत्मनि च ग्राह्यताज्ञानद्वारेण सर्वाणि भूतानि एकीकुर्यात् । अतश्च समदर्शनत्वं जायते योगश्चेति संक्षेपार्थः । विस्तरस्तु भेदवादविदारणादिप्रकरणे देवीस्तोत्रविवरणे न मयैव निर्णीतः इति तत एवावधार्यः ॥ ३० ॥
    slp1: |-
      sarvaBUtasTamAtmAnaM sarvaBUtAni cAtmani . Ikzate yogayuktAtmA sarvatra samadarSanaH .. 6-30 ..
      sarvezu BUtezu AtmAnaM-grAhakarUpatayAnupraviSantaM BAvayet . Atmani ca grAhyatAjYAnadvAreRa sarvARi BUtAni ekIkuryAt . ataSca samadarSanatvaM jAyate yogaSceti saMkzepArTaH . vistarastu BedavAdavidAraRAdiprakaraRe devIstotravivaraRe na mayEva nirRItaH iti tata evAvaDAryaH .. 30 ..
    iast: |-
      sarvabhūtasthamātmānaṃ sarvabhūtāni cātmani | īkṣate yogayuktātmā sarvatra samadarśanaḥ || 6-30 ||
      sarveṣu bhūteṣu ātmānaṃ-grāhakarūpatayānupraviśantaṃ bhāvayet | ātmani ca grāhyatājñānadvāreṇa sarvāṇi bhūtāni ekīkuryāt | ataśca samadarśanatvaṃ jāyate yogaśceti saṃkṣepārthaḥ | vistarastu bhedavādavidāraṇādiprakaraṇe devīstotravivaraṇe na mayaiva nirṇītaḥ iti tata evāvadhāryaḥ || 30 ||
  - verse: 31
    devanagari: |-
      यो मां पश्यति सर्वत्र सर्वं च मयि पश्यति । तस्याहं न प्रणश्यामि स च मे न प्रणश्यति ॥ ६-३१ ॥
      प्रणाशः-अकार्यकारित्वात् । तथाहि । परमात्मनः सर्वगतं रूपं यो न पश्यति तस्य परमात्मा पलायितः-स्वरूपप्रकटीकाराभावात् । यच्चेदं वस्तुजातं तद्भासनात्मनि परमात्मनि विनिविष्टं भवति तथाविधं यो न पश्यति स परमार्थस्वरूपात् प्रनष्टः-तद्व्यतिरेके सत्यनिर्भासात् । यस्तु सर्वगतं मां पश्यति तस्याहं न प्रनष्टः-स्वस्वरूपेण भासनात् । भायांश्च मयि पश्यति तत्तेषां भासनोपपत्तो द्रष्टृतायां परिपूर्णायां स न प्रनष्टः परमात्मनः ॥ ३१ ॥
    slp1: |-
      yo mAM paSyati sarvatra sarvaM ca mayi paSyati . tasyAhaM na praRaSyAmi sa ca me na praRaSyati .. 6-31 ..
      praRASaH-akAryakAritvAt . taTAhi . paramAtmanaH sarvagataM rUpaM yo na paSyati tasya paramAtmA palAyitaH-svarUpaprakawIkArABAvAt . yaccedaM vastujAtaM tadBAsanAtmani paramAtmani vinivizwaM Bavati taTAviDaM yo na paSyati sa paramArTasvarUpAt pranazwaH-tadvyatireke satyanirBAsAt . yastu sarvagataM mAM paSyati tasyAhaM na pranazwaH-svasvarUpeRa BAsanAt . BAyAMSca mayi paSyati tattezAM BAsanopapatto drazwftAyAM paripUrRAyAM sa na pranazwaH paramAtmanaH .. 31 ..
    iast: |-
      yo māṃ paśyati sarvatra sarvaṃ ca mayi paśyati | tasyāhaṃ na praṇaśyāmi sa ca me na praṇaśyati || 6-31 ||
      praṇāśaḥ-akāryakāritvāt | tathāhi | paramātmanaḥ sarvagataṃ rūpaṃ yo na paśyati tasya paramātmā palāyitaḥ-svarūpaprakaṭīkārābhāvāt | yaccedaṃ vastujātaṃ tadbhāsanātmani paramātmani viniviṣṭaṃ bhavati tathāvidhaṃ yo na paśyati sa paramārthasvarūpāt pranaṣṭaḥ-tadvyatireke satyanirbhāsāt | yastu sarvagataṃ māṃ paśyati tasyāhaṃ na pranaṣṭaḥ-svasvarūpeṇa bhāsanāt | bhāyāṃśca mayi paśyati tatteṣāṃ bhāsanopapatto draṣṭṛtāyāṃ paripūrṇāyāṃ sa na pranaṣṭaḥ paramātmanaḥ || 31 ||
  - verse: 32
    devanagari: |-
      सर्वभूतस्थितं यो मां भजत्येकत्वमास्थितः । सर्वथा वर्तमानोऽपि स योगी मयि वर्तते ॥ ६-३२ ॥
      यस्त्वेवं ज्ञानाविष्टः सोऽवश्यमेवैकतया भगवन्तं सर्वगतं विदन् सर्वावस्थागतोऽपि न लिप्यते ॥ ३२ ॥
    slp1: |-
      sarvaBUtasTitaM yo mAM BajatyekatvamAsTitaH . sarvaTA vartamAno'pi sa yogI mayi vartate .. 6-32 ..
      yastvevaM jYAnAvizwaH so'vaSyamevEkatayA BagavantaM sarvagataM vidan sarvAvasTAgato'pi na lipyate .. 32 ..
    iast: |-
      sarvabhūtasthitaṃ yo māṃ bhajatyekatvamāsthitaḥ | sarvathā vartamāno'pi sa yogī mayi vartate || 6-32 ||
      yastvevaṃ jñānāviṣṭaḥ so'vaśyamevaikatayā bhagavantaṃ sarvagataṃ vidan sarvāvasthāgato'pi na lipyate || 32 ||
  - verse: 33
    devanagari: |-
      आत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन । सुखं वा यदि वा दुःखं स योगी परमो मतः ॥ ६-३३ ॥
      सर्वस्य च सुखदुःखे आत्मतुल्यतया पश्यति इति स्वरूपमेतदनूदितम् न पुनरेषोऽपूर्वो विधिः ॥ ३३ ॥
    slp1: |-
      AtmOpamyena sarvatra samaM paSyati yo'rjuna . suKaM vA yadi vA duHKaM sa yogI paramo mataH .. 6-33 ..
      sarvasya ca suKaduHKe AtmatulyatayA paSyati iti svarUpametadanUditam na punarezo'pUrvo viDiH .. 33 ..
    iast: |-
      ātmaupamyena sarvatra samaṃ paśyati yo'rjuna | sukhaṃ vā yadi vā duḥkhaṃ sa yogī paramo mataḥ || 6-33 ||
      sarvasya ca sukhaduḥkhe ātmatulyatayā paśyati iti svarūpametadanūditam na punareṣo'pūrvo vidhiḥ || 33 ||
  - verse: 34
    devanagari: |-
      अर्जुन उवाच
      योऽयं योगस्त्वया प्रोक्तः साम्येन मधुसूदन ! एतस्याहं न पश्यामि चञ्चलत्वात् स्थितिं स्थिराम् ॥ ६-३४ ॥
    slp1: |-
      arjuna uvAca
      yo'yaM yogastvayA proktaH sAmyena maDusUdana ! etasyAhaM na paSyAmi caYcalatvAt sTitiM sTirAm .. 6-34 ..
    iast: |-
      arjuna uvāca
      yo'yaṃ yogastvayā proktaḥ sāmyena madhusūdana ! etasyāhaṃ na paśyāmi cañcalatvāt sthitiṃ sthirām || 6-34 ||
  - verse: 35
    devanagari: |-
      चञ्चलं हि मनः कृष्ण प्रमाथि बलवद् दृढम् । तस्याऽहं निग्रहं मन्ये वायोरिव सुदुष्करम् ॥ ६-३५ ॥
      योऽयमिति-परोक्षप्रत्यक्षवाचकाभ्यामेवं सूच्यते । भगवदभिहितानन्तरोपायपरम्परया स्फुटमपि-प्रत्यक्षनिर्दिष्टमपि ब्रह्म मनसश्चाञ्चल्यदौरात्म्यात्सुदूरे वर्तते इति परोक्षायमाणम् । प्रमथ्नाति दृष्टादृष्टे । बलवत्-शक्तम् । दृढं-दुष्टव्यापारात् वारयितुमशक्यम् ॥ ३५ ॥
    slp1: |-
      caYcalaM hi manaH kfzRa pramATi balavad dfQam . tasyA'haM nigrahaM manye vAyoriva suduzkaram .. 6-35 ..
      yo'yamiti-parokzapratyakzavAcakAByAmevaM sUcyate . BagavadaBihitAnantaropAyaparamparayA sPuwamapi-pratyakzanirdizwamapi brahma manasaScAYcalyadOrAtmyAtsudUre vartate iti parokzAyamARam . pramaTnAti dfzwAdfzwe . balavat-Saktam . dfQaM-duzwavyApArAt vArayitumaSakyam .. 35 ..
    iast: |-
      cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavad dṛḍham | tasyā'haṃ nigrahaṃ manye vāyoriva suduṣkaram || 6-35 ||
      yo'yamiti-parokṣapratyakṣavācakābhyāmevaṃ sūcyate | bhagavadabhihitānantaropāyaparamparayā sphuṭamapi-pratyakṣanirdiṣṭamapi brahma manasaścāñcalyadaurātmyātsudūre vartate iti parokṣāyamāṇam | pramathnāti dṛṣṭādṛṣṭe | balavat-śaktam | dṛḍhaṃ-duṣṭavyāpārāt vārayitumaśakyam || 35 ||
  - verse: 36
    devanagari: |-
      अत्रोत्तरं-
      श्रीभगवानुवाच
      असंशयं महाबाहो मनो दुर्निग्रहं चलम् । अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते ॥ ६-३६ ॥
      इति ॥ ३६ ॥
    slp1: |-
      atrottaraM-
      SrIBagavAnuvAca
      asaMSayaM mahAbAho mano durnigrahaM calam . aByAsena tu kOnteya vErAgyeRa ca gfhyate .. 6-36 ..
      iti .. 36 ..
    iast: |-
      atrottaraṃ-
      śrībhagavānuvāca
      asaṃśayaṃ mahābāho mano durnigrahaṃ calam | abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate || 6-36 ||
      iti || 36 ||
  - verse: 37
    devanagari: |-
      असंयतात्मनो योगो दुष्प्राप इति मे मतिः । वश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः ॥ ६-३७ ॥
      अत एषा प्रतिज्ञा-असंयतात्मनः-अविरक्तस्य न कथंचिद्योगावाप्तिः । वश्यात्मनेति-वैराग्यवता । यतमानेनेति-साभ्यासेन । उपायान्-अनेकसिद्धान्तादिशास्त्रविहितान् संश्रित्य ॥ ३७ ॥
    slp1: |-
      asaMyatAtmano yogo duzprApa iti me matiH . vaSyAtmanA tu yatatA Sakyo'vAptumupAyataH .. 6-37 ..
      ata ezA pratijYA-asaMyatAtmanaH-aviraktasya na kaTaMcidyogAvAptiH . vaSyAtmaneti-vErAgyavatA . yatamAneneti-sAByAsena . upAyAn-anekasidDAntAdiSAstravihitAn saMSritya .. 37 ..
    iast: |-
      asaṃyatātmano yogo duṣprāpa iti me matiḥ | vaśyātmanā tu yatatā śakyo'vāptumupāyataḥ || 6-37 ||
      ata eṣā pratijñā-asaṃyatātmanaḥ-aviraktasya na kathaṃcidyogāvāptiḥ | vaśyātmaneti-vairāgyavatā | yatamāneneti-sābhyāsena | upāyān-anekasiddhāntādiśāstravihitān saṃśritya || 37 ||
  - verse: 38
    devanagari: |-
      अर्जुन उवाच
      अयतः श्रद्धयोपेतो योगाच्चलितमानसः । लिप्समानः सतां मार्गं प्रमूढो ब्रह्मणः पथि ॥ ६-३८ ॥
    slp1: |-
      arjuna uvAca
      ayataH SradDayopeto yogAccalitamAnasaH . lipsamAnaH satAM mArgaM pramUQo brahmaRaH paTi .. 6-38 ..
    iast: |-
      arjuna uvāca
      ayataḥ śraddhayopeto yogāccalitamānasaḥ | lipsamānaḥ satāṃ mārgaṃ pramūḍho brahmaṇaḥ pathi || 6-38 ||
  - verse: 39
    devanagari: |-
      अनेकचित्तोविभ्रान्तो मोहस्यैव वशं गतः । अप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति ॥ ६-३९ ॥
      यदा प्राप्यापि विज्ञानं दूषितं चित्तविभ्रमात् । तदैव ध्वंसते श्रीघ्रं तूलराशिरिवानलात् इति ॥ ३९ ॥
    slp1: |-
      anekacittoviBrAnto mohasyEva vaSaM gataH . aprApya yogasaMsidDiM kAM gatiM kfzRa gacCati .. 6-39 ..
      yadA prApyApi vijYAnaM dUzitaM cittaviBramAt . tadEva DvaMsate SrIGraM tUlarASirivAnalAt iti .. 39 ..
    iast: |-
      anekacittovibhrānto mohasyaiva vaśaṃ gataḥ | aprāpya yogasaṃsiddhiṃ kāṃ gatiṃ kṛṣṇa gacchati || 6-39 ||
      yadā prāpyāpi vijñānaṃ dūṣitaṃ cittavibhramāt | tadaiva dhvaṃsate śrīghraṃ tūlarāśirivānalāt iti || 39 ||
  - verse: 40
    devanagari: |-
      कच्चिन्नोभयविभ्रंशाच्छिन्नाभ्रमिव नश्यति । अप्रतिष्ठो महाबाहो विनाशं वाधिगच्छति ॥ ६-४० ॥
    slp1: |-
      kaccinnoBayaviBraMSAcCinnABramiva naSyati . apratizWo mahAbAho vinASaM vADigacCati .. 6-40 ..
    iast: |-
      kaccinnobhayavibhraṃśācchinnābhramiva naśyati | apratiṣṭho mahābāho vināśaṃ vādhigacchati || 6-40 ||
  - verse: 41
    devanagari: |-
      एतन्मे संशयं कृष्ण च्छेत्तुमर्हस्यशेषतः । त्वदन्यः संशयस्यास्य छेत्ता न ह्युपपद्यते ॥ ६-४१ ॥
      योगस्य सम्यक् सिद्धावजातायां किं लोकान्निष्क्रान्तः सम्यक् च ब्रह्मणि न लीनः इति नश्येत् अथवा ब्रह्मण्यप्रतिष्ठत्वाद्विनश्यति परलोकबाधाय इति प्रश्नः ॥ ४१ ॥
    slp1: |-
      etanme saMSayaM kfzRa cCettumarhasyaSezataH . tvadanyaH saMSayasyAsya CettA na hyupapadyate .. 6-41 ..
      yogasya samyak sidDAvajAtAyAM kiM lokAnnizkrAntaH samyak ca brahmaRi na lInaH iti naSyet aTavA brahmaRyapratizWatvAdvinaSyati paralokabADAya iti praSnaH .. 41 ..
    iast: |-
      etanme saṃśayaṃ kṛṣṇa cchettumarhasyaśeṣataḥ | tvadanyaḥ saṃśayasyāsya chettā na hyupapadyate || 6-41 ||
      yogasya samyak siddhāvajātāyāṃ kiṃ lokānniṣkrāntaḥ samyak ca brahmaṇi na līnaḥ iti naśyet athavā brahmaṇyapratiṣṭhatvādvinaśyati paralokabādhāya iti praśnaḥ || 41 ||
  - verse: 42
    devanagari: |-
      अत्र निर्णयं-
      श्रीभगवानुवाच
      पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते । न हि कल्याणकृत् कश्चिद् दुर्गतिं जातु गच्छति ॥ ६-४२ ॥
      न तस्य योगभ्रष्टस्येह लोके परलोके वा नाशोऽस्ति-अनष्टश्रद्धत्वादिति भावः । तस्य-लोकद्वयाविनाशिनः । स हि कल्याणं भगवन्मार्गलक्षणं कृतवान् । न च तदग्निष्टोमादिवत्क्षयि ॥ ४२ ॥
    slp1: |-
      atra nirRayaM-
      SrIBagavAnuvAca
      pArTa nEveha nAmutra vinASastasya vidyate . na hi kalyARakft kaScid durgatiM jAtu gacCati .. 6-42 ..
      na tasya yogaBrazwasyeha loke paraloke vA nASo'sti-anazwaSradDatvAditi BAvaH . tasya-lokadvayAvinASinaH . sa hi kalyARaM BagavanmArgalakzaRaM kftavAn . na ca tadagnizwomAdivatkzayi .. 42 ..
    iast: |-
      atra nirṇayaṃ-
      śrībhagavānuvāca
      pārtha naiveha nāmutra vināśastasya vidyate | na hi kalyāṇakṛt kaścid durgatiṃ jātu gacchati || 6-42 ||
      na tasya yogabhraṣṭasyeha loke paraloke vā nāśo'sti-anaṣṭaśraddhatvāditi bhāvaḥ | tasya-lokadvayāvināśinaḥ | sa hi kalyāṇaṃ bhagavanmārgalakṣaṇaṃ kṛtavān | na ca tadagniṣṭomādivatkṣayi || 42 ||
  - verse: 43
    devanagari: |-
      प्राप्य पुण्यकृतांल्लोकानुषित्वा शाश्वतीः समाः । शुचीनां श्रीमतां गेहे योगभ्रष्टोऽभिजायते ॥ ६-४३ ॥
      शाश्वतस्य-विष्णोः समाः-वैष्णवानि त्रीणि वर्षाणि । शुचीनामिति-येषां भगवदंशस्पर्शि चित्तम् ॥ ४३ ॥
    slp1: |-
      prApya puRyakftAMllokAnuzitvA SASvatIH samAH . SucInAM SrImatAM gehe yogaBrazwo'BijAyate .. 6-43 ..
      SASvatasya-vizRoH samAH-vEzRavAni trIRi varzARi . SucInAmiti-yezAM BagavadaMSasparSi cittam .. 43 ..
    iast: |-
      prāpya puṇyakṛtāṃllokānuṣitvā śāśvatīḥ samāḥ | śucīnāṃ śrīmatāṃ gehe yogabhraṣṭo'bhijāyate || 6-43 ||
      śāśvatasya-viṣṇoḥ samāḥ-vaiṣṇavāni trīṇi varṣāṇi | śucīnāmiti-yeṣāṃ bhagavadaṃśasparśi cittam || 43 ||
  - verse: 44
    devanagari: |-
      अथवा योगिनामेव जायते धीमतां कुले । एतद्धि दुर्लभतरं लोके जन्म यदीदृशम् ॥ ६-४४ ॥
      यदि तु तारतम्येनास्यापवर्गेण भवितव्यं तदा योगिकुल एव जायते । एत एवाह-एतद्धि दुर्लभतरम्-इति । श्रीमतां गेहे किलावश्यमेव विघ्नाः सन्ति संसिद्धौ मोक्षात्मिकायाम् ॥ ४४ ॥
    slp1: |-
      aTavA yoginAmeva jAyate DImatAM kule . etadDi durlaBataraM loke janma yadIdfSam .. 6-44 ..
      yadi tu tAratamyenAsyApavargeRa BavitavyaM tadA yogikula eva jAyate . eta evAha-etadDi durlaBataram-iti . SrImatAM gehe kilAvaSyameva viGnAH santi saMsidDO mokzAtmikAyAm .. 44 ..
    iast: |-
      athavā yogināmeva jāyate dhīmatāṃ kule | etaddhi durlabhataraṃ loke janma yadīdṛśam || 6-44 ||
      yadi tu tāratamyenāsyāpavargeṇa bhavitavyaṃ tadā yogikula eva jāyate | eta evāha-etaddhi durlabhataram-iti | śrīmatāṃ gehe kilāvaśyameva vighnāḥ santi saṃsiddhau mokṣātmikāyām || 44 ||
  - verse: 45
    devanagari: |-
      तत्र तं बुद्धिसंयोगं लभते पौर्वदैहिकम् । ततोभूयोऽपि यतते संसिद्धौ कुरुनन्दन ॥ ६-४५ ॥
    slp1: |-
      tatra taM budDisaMyogaM laBate pOrvadEhikam . tatoBUyo'pi yatate saMsidDO kurunandana .. 6-45 ..
    iast: |-
      tatra taṃ buddhisaṃyogaṃ labhate paurvadaihikam | tatobhūyo'pi yatate saṃsiddhau kurunandana || 6-45 ||
  - verse: 46
    devanagari: |-
      पूर्वाभ्यासेन तेनैव ह्रियते ह्यवशोऽपि सन् । जिज्ञासुरपि योगस्य शब्दब्रह्मातिवर्तते ॥ ६-४६ ॥
      अवशः-परतन्त्र एव किल तेन-पूर्वाभ्यासेन बलादेव योगाभ्यासं प्रति नीयते । न चैतत् सामान्यं योगजिज्ञासामात्रेणैव हि शब्दब्रह्मातिवृत्तिः मन्त्रस्वाध्यायादिरूपं च शब्दब्रह्म अतिवर्तते-न स्वीकुरुते ॥ ४६ ॥
    slp1: |-
      pUrvAByAsena tenEva hriyate hyavaSo'pi san . jijYAsurapi yogasya SabdabrahmAtivartate .. 6-46 ..
      avaSaH-paratantra eva kila tena-pUrvAByAsena balAdeva yogAByAsaM prati nIyate . na cEtat sAmAnyaM yogajijYAsAmAtreREva hi SabdabrahmAtivfttiH mantrasvADyAyAdirUpaM ca Sabdabrahma ativartate-na svIkurute .. 46 ..
    iast: |-
      pūrvābhyāsena tenaiva hriyate hyavaśo'pi san | jijñāsurapi yogasya śabdabrahmātivartate || 6-46 ||
      avaśaḥ-paratantra eva kila tena-pūrvābhyāsena balādeva yogābhyāsaṃ prati nīyate | na caitat sāmānyaṃ yogajijñāsāmātreṇaiva hi śabdabrahmātivṛttiḥ mantrasvādhyāyādirūpaṃ ca śabdabrahma ativartate-na svīkurute || 46 ||
  - verse: 47
    devanagari: |-
      प्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्विषः । अनेकजन्मसंसिद्धस्ततो याति परां गतिम् ॥ ६-४७ ॥
      ततो-जिज्ञासानन्तरम् यत्नवान्-अभ्यासक्रमेण देहान्ते वासुदेवत्वं प्राप्नोति । न चासौ तेनैव देहेन सिद्ध इति मन्तव्यम् अपितु बहूनि जन्मानि तेन तदभ्यस्तमिति मन्तव्यम् । अत एव यस्यानन्यव्यापारतया भगवद्व्यापारानुरागित्वं स योगभ्रष्ट इति निश्चेयम् ॥ ४७ ॥
    slp1: |-
      prayatnAdyatamAnastu yogI saMSudDakilvizaH . anekajanmasaMsidDastato yAti parAM gatim .. 6-47 ..
      tato-jijYAsAnantaram yatnavAn-aByAsakrameRa dehAnte vAsudevatvaM prApnoti . na cAsO tenEva dehena sidDa iti mantavyam apitu bahUni janmAni tena tadaByastamiti mantavyam . ata eva yasyAnanyavyApAratayA BagavadvyApArAnurAgitvaM sa yogaBrazwa iti niSceyam .. 47 ..
    iast: |-
      prayatnādyatamānastu yogī saṃśuddhakilviṣaḥ | anekajanmasaṃsiddhastato yāti parāṃ gatim || 6-47 ||
      tato-jijñāsānantaram yatnavān-abhyāsakrameṇa dehānte vāsudevatvaṃ prāpnoti | na cāsau tenaiva dehena siddha iti mantavyam apitu bahūni janmāni tena tadabhyastamiti mantavyam | ata eva yasyānanyavyāpāratayā bhagavadvyāpārānurāgitvaṃ sa yogabhraṣṭa iti niśceyam || 47 ||
  - verse: 48
    devanagari: |-
      योगस्य प्राधान्यमाह-
      तपस्विभ्योऽधिको योगी ज्ञानिभ्योऽपि मतोऽधिकः । कर्मिभ्यश्चाधिको योगी तस्माद् योगी भवार्जुन ! ॥ ६-४८ ॥
      तपस्विभ्योऽधिकत्वं पूर्वमेव सूचितम् । ज्ञानिभ्योऽधिकत्वंज्ञानस्य योगफलत्वात् । कर्मिभ्य उत्कर्षः-स एव कर्माणि कर्तुं वेत्ति ॥ ४८ ॥
    slp1: |-
      yogasya prADAnyamAha-
      tapasviByo'Diko yogI jYAniByo'pi mato'DikaH . karmiByaScADiko yogI tasmAd yogI BavArjuna ! .. 6-48 ..
      tapasviByo'DikatvaM pUrvameva sUcitam . jYAniByo'DikatvaMjYAnasya yogaPalatvAt . karmiBya utkarzaH-sa eva karmARi kartuM vetti .. 48 ..
    iast: |-
      yogasya prādhānyamāha-
      tapasvibhyo'dhiko yogī jñānibhyo'pi mato'dhikaḥ | karmibhyaścādhiko yogī tasmād yogī bhavārjuna ! || 6-48 ||
      tapasvibhyo'dhikatvaṃ pūrvameva sūcitam | jñānibhyo'dhikatvaṃjñānasya yogaphalatvāt | karmibhya utkarṣaḥ-sa eva karmāṇi kartuṃ vetti || 48 ||
  - verse: 49
    devanagari: |-
      न च निरीश्वरं कष्टयोगमात्रं संसिद्धिदमित्युच्यते-
      योगिनामपि सर्वेषां मद्गतेनान्तरात्मना । श्रद्धावान् भजते यो मां स मे युक्ततमो मतः ॥ ६-४९ ॥
      सर्वयोगिमध्ये य एव मामन्तःकरणे निवेश्य भक्तिश्रद्धातत्परो गुरुचरणसेवालब्धसंप्रदायक्रमेण मामेव-नान्यत् भजतेविमृश्यते स युक्ततमः-परमेश्वरसमाविष्टः इति सेश्वरस्य ज्ञानस्य सर्वप्राधान्यमुक्तमिति शिवम् ॥ ४९ ॥
    slp1: |-
      na ca nirISvaraM kazwayogamAtraM saMsidDidamityucyate-
      yoginAmapi sarvezAM madgatenAntarAtmanA . SradDAvAn Bajate yo mAM sa me yuktatamo mataH .. 6-49 ..
      sarvayogimaDye ya eva mAmantaHkaraRe niveSya BaktiSradDAtatparo gurucaraRasevAlabDasaMpradAyakrameRa mAmeva-nAnyat BajatevimfSyate sa yuktatamaH-parameSvarasamAvizwaH iti seSvarasya jYAnasya sarvaprADAnyamuktamiti Sivam .. 49 ..
    iast: |-
      na ca nirīśvaraṃ kaṣṭayogamātraṃ saṃsiddhidamityucyate-
      yogināmapi sarveṣāṃ madgatenāntarātmanā | śraddhāvān bhajate yo māṃ sa me yuktatamo mataḥ || 6-49 ||
      sarvayogimadhye ya eva māmantaḥkaraṇe niveśya bhaktiśraddhātatparo gurucaraṇasevālabdhasaṃpradāyakrameṇa māmeva-nānyat bhajatevimṛśyate sa yuktatamaḥ-parameśvarasamāviṣṭaḥ iti seśvarasya jñānasya sarvaprādhānyamuktamiti śivam || 49 ||
  - verse: 1000
    devanagari: |-
      भगवन्नामसंप्राप्तिमात्रात्सर्वमवाप्यते । फलिताः शालयः सम्यग्वृष्टिमात्रेऽवलोकिते ॥ ६ ॥
    slp1: |-
      BagavannAmasaMprAptimAtrAtsarvamavApyate . PalitAH SAlayaH samyagvfzwimAtre'valokite .. 6 ..
    iast: |-
      bhagavannāmasaṃprāptimātrātsarvamavāpyate | phalitāḥ śālayaḥ samyagvṛṣṭimātre'valokite || 6 ||
- chapter: 7
  title_sa: सप्तमोऽध्यायः
  title_iast: "saptamo'dhyāyaḥ"
  title_en: "Seventh Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      श्रीभगवानुवाच
      मय्यासक्तमनाः पार्थ ! योगं युञ्जन्मदाश्रितः । असंशयं समग्रं मां यथा ज्ञास्यसि तच्छृणु ॥ ७-१ ॥
    slp1: |-
      SrIBagavAnuvAca
      mayyAsaktamanAH pArTa ! yogaM yuYjanmadASritaH . asaMSayaM samagraM mAM yaTA jYAsyasi tacCfRu .. 7-1 ..
    iast: |-
      śrībhagavānuvāca
      mayyāsaktamanāḥ pārtha ! yogaṃ yuñjanmadāśritaḥ | asaṃśayaṃ samagraṃ māṃ yathā jñāsyasi tacchṛṇu || 7-1 ||
  - verse: 2
    devanagari: |-
      ज्ञानं तेऽहं सविज्ञानमिदं वक्ष्याम्यशेषतः । यज्ज्ञात्वा न पूनः किंचिज्ज्ञातव्यमवशिष्यते ॥ ७-२ ॥
      ज्ञानविज्ञाने ज्ञानक्रिये एव । ततो न किंचिदवशिष्यते-सर्वस्व ज्ञेयस्य ज्ञानक्रियानिष्ठत्वात् ॥ २ ॥
    slp1: |-
      jYAnaM te'haM savijYAnamidaM vakzyAmyaSezataH . yajjYAtvA na pUnaH kiMcijjYAtavyamavaSizyate .. 7-2 ..
      jYAnavijYAne jYAnakriye eva . tato na kiMcidavaSizyate-sarvasva jYeyasya jYAnakriyAnizWatvAt .. 2 ..
    iast: |-
      jñānaṃ te'haṃ savijñānamidaṃ vakṣyāmyaśeṣataḥ | yajjñātvā na pūnaḥ kiṃcijjñātavyamavaśiṣyate || 7-2 ||
      jñānavijñāne jñānakriye eva | tato na kiṃcidavaśiṣyate-sarvasva jñeyasya jñānakriyāniṣṭhatvāt || 2 ||
  - verse: 3
    devanagari: |-
      मनुष्याणां सहस्रेषु कश्चिद्यतति सिद्धये । यततामपि सिद्धानां कश्चिन्मां वेत्ति तत्त्वतः ॥ ७-३ ॥
      अस्य च वस्तुनः सर्वो न योग्यः । इत्यनेन दुर्लभत्वात् यत्नसेव्यता-माह ॥ ३ ॥
    slp1: |-
      manuzyARAM sahasrezu kaScidyatati sidDaye . yatatAmapi sidDAnAM kaScinmAM vetti tattvataH .. 7-3 ..
      asya ca vastunaH sarvo na yogyaH . ityanena durlaBatvAt yatnasevyatA-mAha .. 3 ..
    iast: |-
      manuṣyāṇāṃ sahasreṣu kaścidyatati siddhaye | yatatāmapi siddhānāṃ kaścinmāṃ vetti tattvataḥ || 7-3 ||
      asya ca vastunaḥ sarvo na yogyaḥ | ityanena durlabhatvāt yatnasevyatā-māha || 3 ||
  - verse: 4
    devanagari: |-
      भूमिरापोऽनलो वायुः खं मनो बुद्धिरेव च । अहङ्कार इतीयं मे भिन्ना प्रकृतिरष्टधा ॥ ७-४ ॥
    slp1: |-
      BUmirApo'nalo vAyuH KaM mano budDireva ca . ahaNkAra itIyaM me BinnA prakftirazwaDA .. 7-4 ..
    iast: |-
      bhūmirāpo'nalo vāyuḥ khaṃ mano buddhireva ca | ahaṅkāra itīyaṃ me bhinnā prakṛtiraṣṭadhā || 7-4 ||
  - verse: 5
    devanagari: |-
      अपरेयमितस्त्वन्यां प्रकृतिं विद्धि मे पराम् । जीवभूतां महाबाहो ययेदं धार्यते जगत् ॥ ७-५ ॥
      इयमिति-प्रत्यक्षेण या संसारावस्थायां सर्वजनपरिदृश्यमाना । सा चैकैव सती प्रकाराष्टकेन भिद्यते इति एकप्रकृत्यारब्धत्वादेकमेव विश्वमिति प्रकृतिवादेऽप्यद्वैतं प्रदर्शितम् । सैव जीवत्वं-पुरुषत्वं प्राप्ता परा ममैव नान्यस्य च । सोभयरूपा वेद्यवेदकात्मकप्रपञ्चोपरचनविचित्रा । तत एव स्वात्मविमलमुकुरतलकलितसकलभावभूमिः स्वस्वभावात्मिका सततमव्यभिचारिणी प्रकृतिः । इदं जगत्-भूम्यादि ॥ ५ ॥
    slp1: |-
      apareyamitastvanyAM prakftiM vidDi me parAm . jIvaBUtAM mahAbAho yayedaM DAryate jagat .. 7-5 ..
      iyamiti-pratyakzeRa yA saMsArAvasTAyAM sarvajanaparidfSyamAnA . sA cEkEva satI prakArAzwakena Bidyate iti ekaprakftyArabDatvAdekameva viSvamiti prakftivAde'pyadvEtaM pradarSitam . sEva jIvatvaM-puruzatvaM prAptA parA mamEva nAnyasya ca . soBayarUpA vedyavedakAtmakaprapaYcoparacanavicitrA . tata eva svAtmavimalamukuratalakalitasakalaBAvaBUmiH svasvaBAvAtmikA satatamavyaBicAriRI prakftiH . idaM jagat-BUmyAdi .. 5 ..
    iast: |-
      apareyamitastvanyāṃ prakṛtiṃ viddhi me parām | jīvabhūtāṃ mahābāho yayedaṃ dhāryate jagat || 7-5 ||
      iyamiti-pratyakṣeṇa yā saṃsārāvasthāyāṃ sarvajanaparidṛśyamānā | sā caikaiva satī prakārāṣṭakena bhidyate iti ekaprakṛtyārabdhatvādekameva viśvamiti prakṛtivāde'pyadvaitaṃ pradarśitam | saiva jīvatvaṃ-puruṣatvaṃ prāptā parā mamaiva nānyasya ca | sobhayarūpā vedyavedakātmakaprapañcoparacanavicitrā | tata eva svātmavimalamukuratalakalitasakalabhāvabhūmiḥ svasvabhāvātmikā satatamavyabhicāriṇī prakṛtiḥ | idaṃ jagat-bhūmyādi || 5 ||
  - verse: 6
    devanagari: |-
      एतद्योनीनि भूतानि सर्वाणीत्युपधारय । अहं कृत्स्नस्य जगतः प्रभवः प्रलयस्तथा ॥ ७-६ ॥
      उपधारय-अभ्यासाहितानुभवक्रमेणात्मसमीपे कुरु । एवं च त्वमेवोपधारय-यदहं वासुदेवीभूतः सर्वस्य प्रभवः प्रलयश्च । अहम्-इत्यनेन प्रकृतिपुरुषपुरुषोत्तमेभ्योऽव्यतिरिक्तोऽपीश्वरः सर्वथा सर्वानुगतत्वेन स्थित इति सांख्ययोगयोर्नास्ति भेदवादः-इति प्रदर्शितम् ॥ ६ ॥
    slp1: |-
      etadyonIni BUtAni sarvARItyupaDAraya . ahaM kftsnasya jagataH praBavaH pralayastaTA .. 7-6 ..
      upaDAraya-aByAsAhitAnuBavakrameRAtmasamIpe kuru . evaM ca tvamevopaDAraya-yadahaM vAsudevIBUtaH sarvasya praBavaH pralayaSca . aham-ityanena prakftipuruzapuruzottameByo'vyatirikto'pISvaraH sarvaTA sarvAnugatatvena sTita iti sAMKyayogayornAsti BedavAdaH-iti pradarSitam .. 6 ..
    iast: |-
      etadyonīni bhūtāni sarvāṇītyupadhāraya | ahaṃ kṛtsnasya jagataḥ prabhavaḥ pralayastathā || 7-6 ||
      upadhāraya-abhyāsāhitānubhavakrameṇātmasamīpe kuru | evaṃ ca tvamevopadhāraya-yadahaṃ vāsudevībhūtaḥ sarvasya prabhavaḥ pralayaśca | aham-ityanena prakṛtipuruṣapuruṣottamebhyo'vyatirikto'pīśvaraḥ sarvathā sarvānugatatvena sthita iti sāṃkhyayogayornāsti bhedavādaḥ-iti pradarśitam || 6 ||
  - verse: 7
    devanagari: |-
      मत्तः परतरं नान्यत्किञ्चिदस्तु धनञ्जय । मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव ॥ ७-७ ॥
      सूत्रे मणिगणा एव-यथा तन्तुरनवध्रियमाणरूपोऽप्यन्तर्लीनतया स्थितः एवमहं सर्वत्र ॥ ७ ॥
    slp1: |-
      mattaH parataraM nAnyatkiYcidastu DanaYjaya . mayi sarvamidaM protaM sUtre maRigaRA iva .. 7-7 ..
      sUtre maRigaRA eva-yaTA tanturanavaDriyamARarUpo'pyantarlInatayA sTitaH evamahaM sarvatra .. 7 ..
    iast: |-
      mattaḥ parataraṃ nānyatkiñcidastu dhanañjaya | mayi sarvamidaṃ protaṃ sūtre maṇigaṇā iva || 7-7 ||
      sūtre maṇigaṇā eva-yathā tanturanavadhriyamāṇarūpo'pyantarlīnatayā sthitaḥ evamahaṃ sarvatra || 7 ||
  - verse: 8
    devanagari: |-
      रसोऽहमप्सु कौन्तेय प्रकाशः शशिसूर्ययोः । प्रणवः सर्ववेदेषु शब्दः खे पौरुषं नृषु ॥ ७-८ ॥
      अप्स्विति-सर्वत्रास्वाद्यमानो योऽनुद्भिन्नमधुरादिविभागः सामान्यः सोऽहम् । एवं प्रकाशः-मृदुत्वचण्डत्वादिरहितः । खे-आकाशे यः शब्द इति सर्वस्यैव शब्दस्य नभोगुणत्वादत्रावधारणम् यः केवलं गगनगुणतया ध्वनिः संयोगविभागादिसामग्र्यन्तररहितोऽवहितहृदयैर्ब्रह्मगुहागहन् अगामी योगिगणैः संवेद्योऽनाहताख्यः सकलश्रुतिग्रामानुगामी तद्भगवतस्तत्त्वम् । पौरुषं-येन तेजसा पुरुषोऽहमिति सार्वभौमं प्रतिपद्यते ॥ ८ ॥
    slp1: |-
      raso'hamapsu kOnteya prakASaH SaSisUryayoH . praRavaH sarvavedezu SabdaH Ke pOruzaM nfzu .. 7-8 ..
      apsviti-sarvatrAsvAdyamAno yo'nudBinnamaDurAdiviBAgaH sAmAnyaH so'ham . evaM prakASaH-mfdutvacaRqatvAdirahitaH . Ke-AkASe yaH Sabda iti sarvasyEva Sabdasya naBoguRatvAdatrAvaDAraRam yaH kevalaM gaganaguRatayA DvaniH saMyogaviBAgAdisAmagryantararahito'vahitahfdayErbrahmaguhAgahan agAmI yogigaREH saMvedyo'nAhatAKyaH sakalaSrutigrAmAnugAmI tadBagavatastattvam . pOruzaM-yena tejasA puruzo'hamiti sArvaBOmaM pratipadyate .. 8 ..
    iast: |-
      raso'hamapsu kaunteya prakāśaḥ śaśisūryayoḥ | praṇavaḥ sarvavedeṣu śabdaḥ khe pauruṣaṃ nṛṣu || 7-8 ||
      apsviti-sarvatrāsvādyamāno yo'nudbhinnamadhurādivibhāgaḥ sāmānyaḥ so'ham | evaṃ prakāśaḥ-mṛdutvacaṇḍatvādirahitaḥ | khe-ākāśe yaḥ śabda iti sarvasyaiva śabdasya nabhoguṇatvādatrāvadhāraṇam yaḥ kevalaṃ gaganaguṇatayā dhvaniḥ saṃyogavibhāgādisāmagryantararahito'vahitahṛdayairbrahmaguhāgahan agāmī yogigaṇaiḥ saṃvedyo'nāhatākhyaḥ sakalaśrutigrāmānugāmī tadbhagavatastattvam | pauruṣaṃ-yena tejasā puruṣo'hamiti sārvabhaumaṃ pratipadyate || 8 ||
  - verse: 9
    devanagari: |-
      पुण्यः पृथिव्यां गन्धोऽस्मि तेजश्चाऽस्मि विभावसौ । जीवनं सर्वभूतेषु तपश्चाऽस्मि तपस्विषु ॥ ७-९ ॥
      इत्यादि ॥ ९ ॥
    slp1: |-
      puRyaH pfTivyAM ganDo'smi tejaScA'smi viBAvasO . jIvanaM sarvaBUtezu tapaScA'smi tapasvizu .. 7-9 ..
      ityAdi .. 9 ..
    iast: |-
      puṇyaḥ pṛthivyāṃ gandho'smi tejaścā'smi vibhāvasau | jīvanaṃ sarvabhūteṣu tapaścā'smi tapasviṣu || 7-9 ||
      ityādi || 9 ||
  - verse: 10
    devanagari: |-
      बीजं मां सर्वभूतानां विद्धि पार्थ सनातनम् । बुद्धिर्बुद्धिमतामस्मि तेजस्तेजस्विनामहम् ॥ ७-१० ॥
    slp1: |-
      bIjaM mAM sarvaBUtAnAM vidDi pArTa sanAtanam . budDirbudDimatAmasmi tejastejasvinAmaham .. 7-10 ..
    iast: |-
      bījaṃ māṃ sarvabhūtānāṃ viddhi pārtha sanātanam | buddhirbuddhimatāmasmi tejastejasvināmaham || 7-10 ||
  - verse: 11
    devanagari: |-
      बलं बलवतामस्मि कामरागविवर्जितम् । धर्माविरुद्धो भूतेषु कामोऽस्मि भरतर्षभ ॥ ७-११ ॥
      इति । जात एव नतु बाह्यप्रसृते इत्यर्थः । एवं व्याख्यानं त्यक्त्वा ये परस्परानुपघातकं त्रिवर्गं सेवेत-इत्याशयेन व्याचक्षते ते संप्रदायक्रममजानाना भगवद्रहस्यं च व्याचक्षाणा नमस्कार्या एव ॥ ११ ॥
    slp1: |-
      balaM balavatAmasmi kAmarAgavivarjitam . DarmAvirudDo BUtezu kAmo'smi BaratarzaBa .. 7-11 ..
      iti . jAta eva natu bAhyaprasfte ityarTaH . evaM vyAKyAnaM tyaktvA ye parasparAnupaGAtakaM trivargaM seveta-ityASayena vyAcakzate te saMpradAyakramamajAnAnA BagavadrahasyaM ca vyAcakzARA namaskAryA eva .. 11 ..
    iast: |-
      balaṃ balavatāmasmi kāmarāgavivarjitam | dharmāviruddho bhūteṣu kāmo'smi bharatarṣabha || 7-11 ||
      iti | jāta eva natu bāhyaprasṛte ityarthaḥ | evaṃ vyākhyānaṃ tyaktvā ye parasparānupaghātakaṃ trivargaṃ seveta-ityāśayena vyācakṣate te saṃpradāyakramamajānānā bhagavadrahasyaṃ ca vyācakṣāṇā namaskāryā eva || 11 ||
  - verse: 12
    devanagari: |-
      ये चैव सात्त्विका भावा राजसास्तामसाश्च ये । मत्त एवेति तान् विद्धि नत्वहं तेषु ते मयि ॥ ७-१२ ॥
    slp1: |-
      ye cEva sAttvikA BAvA rAjasAstAmasASca ye . matta eveti tAn vidDi natvahaM tezu te mayi .. 7-12 ..
    iast: |-
      ye caiva sāttvikā bhāvā rājasāstāmasāśca ye | matta eveti tān viddhi natvahaṃ teṣu te mayi || 7-12 ||
  - verse: 13
    devanagari: |-
      त्रिभिर्गुणमयैर्भावैरेभिः सर्वमिदं जगत् । मोहितं नाभिजानाति मामेभ्यः परमव्ययम् ॥ ७-१३ ॥
      सत्त्वादीनि मन्मयानि नत्वहं तन्मयः । अत एव च भगवन्मयः सर्वं भगवद्भावेन संवेदयते । नतु नानाविधपदार्थविज्ञाननिष्ठो भगवत्तत्वं प्रतिपद्यते इति सकलमानसावर्जक एष क्रमः । अनेनैव चाशयेन वक्ष्यते वासुदेवः सर्वमिति इति ज्ञानेन यो बहुजन्मोपभोगजनितकर्मसमतासमनन्तरसमुत्पन्नपरशक्तिपातान् उ-गृहीतान्तः करणोऽसौ प्रतिपद्यते भगवत्तत्वं सर्वं वासुदेवः-इति बुद्धा स महात्मा स च दुर्लभ इति । एवं ह्यबुद्ध्यमानं प्रत्युत सत्त्वादिभिर्गुणैर्मोहितमिदं जगत् गुणातीतं वासुदेवतत्त्वं नैवोपलभते ॥ १३ ॥
    slp1: |-
      triBirguRamayErBAvEreBiH sarvamidaM jagat . mohitaM nABijAnAti mAmeByaH paramavyayam .. 7-13 ..
      sattvAdIni manmayAni natvahaM tanmayaH . ata eva ca BagavanmayaH sarvaM BagavadBAvena saMvedayate . natu nAnAviDapadArTavijYAnanizWo BagavattatvaM pratipadyate iti sakalamAnasAvarjaka eza kramaH . anenEva cASayena vakzyate vAsudevaH sarvamiti iti jYAnena yo bahujanmopaBogajanitakarmasamatAsamanantarasamutpannaparaSaktipAtAn u-gfhItAntaH karaRo'sO pratipadyate BagavattatvaM sarvaM vAsudevaH-iti budDA sa mahAtmA sa ca durlaBa iti . evaM hyabudDyamAnaM pratyuta sattvAdiBirguRErmohitamidaM jagat guRAtItaM vAsudevatattvaM nEvopalaBate .. 13 ..
    iast: |-
      tribhirguṇamayairbhāvairebhiḥ sarvamidaṃ jagat | mohitaṃ nābhijānāti māmebhyaḥ paramavyayam || 7-13 ||
      sattvādīni manmayāni natvahaṃ tanmayaḥ | ata eva ca bhagavanmayaḥ sarvaṃ bhagavadbhāvena saṃvedayate | natu nānāvidhapadārthavijñānaniṣṭho bhagavattatvaṃ pratipadyate iti sakalamānasāvarjaka eṣa kramaḥ | anenaiva cāśayena vakṣyate vāsudevaḥ sarvamiti iti jñānena yo bahujanmopabhogajanitakarmasamatāsamanantarasamutpannaparaśaktipātān u-gṛhītāntaḥ karaṇo'sau pratipadyate bhagavattatvaṃ sarvaṃ vāsudevaḥ-iti buddhā sa mahātmā sa ca durlabha iti | evaṃ hyabuddhyamānaṃ pratyuta sattvādibhirguṇairmohitamidaṃ jagat guṇātītaṃ vāsudevatattvaṃ naivopalabhate || 13 ||
  - verse: 14
    devanagari: |-
      कथं खलु सत्त्वादिमात्रस्थिता भगवतस्तत्त्वं न विदुः ? इत्याह
      दैवी ह्येषा गुणमयी मम माया दुरत्यया । मामेव ये प्रपद्यन्ते मायामतितरन्ति ते ॥ ७-१४ ॥
      देवः-क्रीडाकरः तत्र भवा दैवी-क्रीडा ममेयमित्यर्थः । तेन सत्त्वादीनां वस्तुतः संविन्मात्रपरब्रह्मानतिरिक्ततायामपि यत्तदतिरिक्ततावगमनं तदेव गुणत्वं-भोक्तृतत्त्वपारतन्त्र्यं भोग्यत्वम् । तच्च भेदात्मकं रूपं संसारिभिरनिर्वाच्यतया तान् प्रति मायारूपम् । अतो ये परमार्थब्रह्मप्रकाशविदस्ते तदनतिरिक्तं विश्वं पश्यन्तो गुणानां-सत्त्वादीनां गुणतालक्षणां भेदावभासस्वभावां मायामतितरन्तीति मामेव-इत्येवकारस्याशयः । ये तु यथास्थितं भेदावभासमात्रं विदुस्ते मायां नातिक्रामन्ति । तद्युक्तमुक्तं नत्वहं तेषु-इति ॥ १४ ॥
    slp1: |-
      kaTaM Kalu sattvAdimAtrasTitA BagavatastattvaM na viduH ? ityAha
      dEvI hyezA guRamayI mama mAyA duratyayA . mAmeva ye prapadyante mAyAmatitaranti te .. 7-14 ..
      devaH-krIqAkaraH tatra BavA dEvI-krIqA mameyamityarTaH . tena sattvAdInAM vastutaH saMvinmAtraparabrahmAnatiriktatAyAmapi yattadatiriktatAvagamanaM tadeva guRatvaM-BoktftattvapAratantryaM Bogyatvam . tacca BedAtmakaM rUpaM saMsAriBiranirvAcyatayA tAn prati mAyArUpam . ato ye paramArTabrahmaprakASavidaste tadanatiriktaM viSvaM paSyanto guRAnAM-sattvAdInAM guRatAlakzaRAM BedAvaBAsasvaBAvAM mAyAmatitarantIti mAmeva-ityevakArasyASayaH . ye tu yaTAsTitaM BedAvaBAsamAtraM viduste mAyAM nAtikrAmanti . tadyuktamuktaM natvahaM tezu-iti .. 14 ..
    iast: |-
      kathaṃ khalu sattvādimātrasthitā bhagavatastattvaṃ na viduḥ ? ityāha
      daivī hyeṣā guṇamayī mama māyā duratyayā | māmeva ye prapadyante māyāmatitaranti te || 7-14 ||
      devaḥ-krīḍākaraḥ tatra bhavā daivī-krīḍā mameyamityarthaḥ | tena sattvādīnāṃ vastutaḥ saṃvinmātraparabrahmānatiriktatāyāmapi yattadatiriktatāvagamanaṃ tadeva guṇatvaṃ-bhoktṛtattvapāratantryaṃ bhogyatvam | tacca bhedātmakaṃ rūpaṃ saṃsāribhiranirvācyatayā tān prati māyārūpam | ato ye paramārthabrahmaprakāśavidaste tadanatiriktaṃ viśvaṃ paśyanto guṇānāṃ-sattvādīnāṃ guṇatālakṣaṇāṃ bhedāvabhāsasvabhāvāṃ māyāmatitarantīti māmeva-ityevakārasyāśayaḥ | ye tu yathāsthitaṃ bhedāvabhāsamātraṃ viduste māyāṃ nātikrāmanti | tadyuktamuktaṃ natvahaṃ teṣu-iti || 14 ||
  - verse: 15
    devanagari: |-
      न मां दुष्कृतिनो मूढाः प्रपद्यन्ते नराधमाः । माययापहृतज्ञाना आसुरं भावमाश्रिताः ॥ ७-१५ ॥
      ये च मां सत्यप्यधिकारिणि काये नाद्रियन्ते ते दुष्कृतिनो नराधमाः मूढाः-आसुरास्तामसाः । इति मायामहिमैवायम् ॥ १५ ॥
    slp1: |-
      na mAM duzkftino mUQAH prapadyante narADamAH . mAyayApahftajYAnA AsuraM BAvamASritAH .. 7-15 ..
      ye ca mAM satyapyaDikAriRi kAye nAdriyante te duzkftino narADamAH mUQAH-AsurAstAmasAH . iti mAyAmahimEvAyam .. 15 ..
    iast: |-
      na māṃ duṣkṛtino mūḍhāḥ prapadyante narādhamāḥ | māyayāpahṛtajñānā āsuraṃ bhāvamāśritāḥ || 7-15 ||
      ye ca māṃ satyapyadhikāriṇi kāye nādriyante te duṣkṛtino narādhamāḥ mūḍhāḥ-āsurāstāmasāḥ | iti māyāmahimaivāyam || 15 ||
  - verse: 16
    devanagari: |-
      चतुर्विधा भजन्ते मां जनाः सुकृतिनः सदा । आर्तो जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ ॥ ७-१६ ॥
    slp1: |-
      caturviDA Bajante mAM janAH sukftinaH sadA . Arto jijYAsurarTArTI jYAnI ca BaratarzaBa .. 7-16 ..
    iast: |-
      caturvidhā bhajante māṃ janāḥ sukṛtinaḥ sadā | ārto jijñāsurarthārthī jñānī ca bharatarṣabha || 7-16 ||
  - verse: 17
    devanagari: |-
      तेषां ज्ञानी नित्ययुक्त एकभक्तिर्विशिष्यते । प्रियो हि ज्ञानिनोऽत्यर्थमहं स च मम प्रियः ॥ ७-१७ ॥
    slp1: |-
      tezAM jYAnI nityayukta ekaBaktirviSizyate . priyo hi jYAnino'tyarTamahaM sa ca mama priyaH .. 7-17 ..
    iast: |-
      teṣāṃ jñānī nityayukta ekabhaktirviśiṣyate | priyo hi jñānino'tyarthamahaṃ sa ca mama priyaḥ || 7-17 ||
  - verse: 18
    devanagari: |-
      उदाराः सर्व एवैते ज्ञानी त्वात्मैव मे मतः । आस्थितः स हि युक्तात्मा मामेवानुत्तमां गतिम् ॥ ७-१८ ॥
    slp1: |-
      udArAH sarva evEte jYAnI tvAtmEva me mataH . AsTitaH sa hi yuktAtmA mAmevAnuttamAM gatim .. 7-18 ..
    iast: |-
      udārāḥ sarva evaite jñānī tvātmaiva me mataḥ | āsthitaḥ sa hi yuktātmā māmevānuttamāṃ gatim || 7-18 ||
  - verse: 19
    devanagari: |-
      बहूनां जन्मनामन्ते ज्ञानवान् मां प्रपद्यते । वासुदेवः सर्वमिति स महात्मा सुदुर्लभः ॥ ७-१९ ॥
      ये तु मां भजन्ते ते सुकृतिनः ते च चत्वारः । सर्वे चैते उदाराः यतोऽन्ये कृपणबुद्धयः आर्तिनिवारणमर्थादि च तुल्यपाणिपादोदरशरीरसत्त्वेभ्योऽधिकतरं वा आत्मन्यूनेभ्यो मार्गयन्ते । ज्ञान्यपेक्षया तु न्यूनसत्त्वाः । यतस्तेषां तावत्यपि भेदोऽस्ति भगवत इदमहमभिलष्यामि-इति भेदस्य स्फुटप्रतिभासात् । ज्ञानी तु मामेवाभेदतयावलम्बते इति ततोऽहमभिन्न एव । तस्य चाहमेव प्रियो नतु फलम् । अत एव स वासुदेव एव सर्वम्-इत्येवं दृढप्रतिपत्तिपवित्रीकृतहृदयः ॥ १९ ॥
    slp1: |-
      bahUnAM janmanAmante jYAnavAn mAM prapadyate . vAsudevaH sarvamiti sa mahAtmA sudurlaBaH .. 7-19 ..
      ye tu mAM Bajante te sukftinaH te ca catvAraH . sarve cEte udArAH yato'nye kfpaRabudDayaH ArtinivAraRamarTAdi ca tulyapARipAdodaraSarIrasattveByo'DikataraM vA AtmanyUneByo mArgayante . jYAnyapekzayA tu nyUnasattvAH . yatastezAM tAvatyapi Bedo'sti Bagavata idamahamaBilazyAmi-iti Bedasya sPuwapratiBAsAt . jYAnI tu mAmevABedatayAvalambate iti tato'hamaBinna eva . tasya cAhameva priyo natu Palam . ata eva sa vAsudeva eva sarvam-ityevaM dfQapratipattipavitrIkftahfdayaH .. 19 ..
    iast: |-
      bahūnāṃ janmanāmante jñānavān māṃ prapadyate | vāsudevaḥ sarvamiti sa mahātmā sudurlabhaḥ || 7-19 ||
      ye tu māṃ bhajante te sukṛtinaḥ te ca catvāraḥ | sarve caite udārāḥ yato'nye kṛpaṇabuddhayaḥ ārtinivāraṇamarthādi ca tulyapāṇipādodaraśarīrasattvebhyo'dhikataraṃ vā ātmanyūnebhyo mārgayante | jñānyapekṣayā tu nyūnasattvāḥ | yatasteṣāṃ tāvatyapi bhedo'sti bhagavata idamahamabhilaṣyāmi-iti bhedasya sphuṭapratibhāsāt | jñānī tu māmevābhedatayāvalambate iti tato'hamabhinna eva | tasya cāhameva priyo natu phalam | ata eva sa vāsudeva eva sarvam-ityevaṃ dṛḍhapratipattipavitrīkṛtahṛdayaḥ || 19 ||
  - verse: 20
    devanagari: |-
      कामैस्तैस्तैर्हृतज्ञानाः प्रपद्यन्तेऽन्यदेवताः । तं तं नियममास्थाय प्रकृत्या नियताः स्वया ॥ ७-२० ॥
    slp1: |-
      kAmEstEstErhftajYAnAH prapadyante'nyadevatAH . taM taM niyamamAsTAya prakftyA niyatAH svayA .. 7-20 ..
    iast: |-
      kāmaistaistairhṛtajñānāḥ prapadyante'nyadevatāḥ | taṃ taṃ niyamamāsthāya prakṛtyā niyatāḥ svayā || 7-20 ||
  - verse: 21
    devanagari: |-
      यो यो यां यां तनुं भक्तः श्रद्धयार्चितुमिच्छति । तस्य तस्याचलां श्रद्धां तामेव विदधाम्यहम् ॥ ७-२१ ॥
    slp1: |-
      yo yo yAM yAM tanuM BaktaH SradDayArcitumicCati . tasya tasyAcalAM SradDAM tAmeva vidaDAmyaham .. 7-21 ..
    iast: |-
      yo yo yāṃ yāṃ tanuṃ bhaktaḥ śraddhayārcitumicchati | tasya tasyācalāṃ śraddhāṃ tāmeva vidadhāmyaham || 7-21 ||
  - verse: 22
    devanagari: |-
      स तया श्रद्धया युक्तस्तस्याराधनमीहते । लभते च ततः कामान् मयैव विहितान्हितान् ॥ ७-२२ ॥
    slp1: |-
      sa tayA SradDayA yuktastasyArADanamIhate . laBate ca tataH kAmAn mayEva vihitAnhitAn .. 7-22 ..
    iast: |-
      sa tayā śraddhayā yuktastasyārādhanamīhate | labhate ca tataḥ kāmān mayaiva vihitānhitān || 7-22 ||
  - verse: 23
    devanagari: |-
      अन्तवत्तु फलं तेषां तद्भवत्यल्पमेधसाम् । देवान्देवयजो यान्ति मद्भक्ता यान्ति मामपि ॥ ७-२३ ॥
      ये पुनः स्वेन स्वेनोत्तमादिकामनास्वभावेन विचित्रेण परिच्छिन्नमनसस्ते कामनापहृतचेतनास्तत्समुचितामेव ममैवावान्तरतनुं देवताविशेषमुपासते । अतो मत्त एव कामफलमुपाददते । किन्तु तस्य अन्तोऽस्ति-निजयैव वासनया परिमितीकृतत्वात् । अत एवेन्द्रादिभावनातात्पर्येण यामादि कुर्वन्तस्तथाविधमेव फलमुपाददते । मत्प्राप्तिपरास्तु मामेव ॥ २३ ॥
    slp1: |-
      antavattu PalaM tezAM tadBavatyalpameDasAm . devAndevayajo yAnti madBaktA yAnti mAmapi .. 7-23 ..
      ye punaH svena svenottamAdikAmanAsvaBAvena vicitreRa paricCinnamanasaste kAmanApahftacetanAstatsamucitAmeva mamEvAvAntaratanuM devatAviSezamupAsate . ato matta eva kAmaPalamupAdadate . kintu tasya anto'sti-nijayEva vAsanayA parimitIkftatvAt . ata evendrAdiBAvanAtAtparyeRa yAmAdi kurvantastaTAviDameva PalamupAdadate . matprAptiparAstu mAmeva .. 23 ..
    iast: |-
      antavattu phalaṃ teṣāṃ tadbhavatyalpamedhasām | devāndevayajo yānti madbhaktā yānti māmapi || 7-23 ||
      ye punaḥ svena svenottamādikāmanāsvabhāvena vicitreṇa paricchinnamanasaste kāmanāpahṛtacetanāstatsamucitāmeva mamaivāvāntaratanuṃ devatāviśeṣamupāsate | ato matta eva kāmaphalamupādadate | kintu tasya anto'sti-nijayaiva vāsanayā parimitīkṛtatvāt | ata evendrādibhāvanātātparyeṇa yāmādi kurvantastathāvidhameva phalamupādadate | matprāptiparāstu māmeva || 23 ||
  - verse: 24
    devanagari: |-
      ननु सर्वगते भगवत्तत्त्वे किमिति देवतान्तरोपासकानां मितं फलम् ? उच्यते-
      अव्यक्तं व्यक्तिमापन्नं मन्यन्ते मामबुद्धयः । परं भावमजानन्तो ममाव्ययमनुत्तमम् ॥ ७-२४ ॥
      ते खलु अल्पबुद्धित्वात् मत्स्वरूपं पारमार्थिकमविद्यमानव्यक्तिकं न प्रत्यभिजानते । अपितु निजकामनासमुचिताकारविशिष्टज्ञानस्वभावं व्यक्तिमेवापन्नं विदन्ति नान्यथा । अत एव न नाम्नि आकारे वा कश्चिद्ग्रहः । किन्तु सिद्धान्तोऽयमत्र यः कामनापरिहारेण यत्किंचिद्देवतारूपमालम्बते तस्य तत् शुद्धमुक्तभावेन पर्यवस्यति । विपर्यात्तु विपर्ययः ॥ २४ ॥
    slp1: |-
      nanu sarvagate Bagavattattve kimiti devatAntaropAsakAnAM mitaM Palam ? ucyate-
      avyaktaM vyaktimApannaM manyante mAmabudDayaH . paraM BAvamajAnanto mamAvyayamanuttamam .. 7-24 ..
      te Kalu alpabudDitvAt matsvarUpaM pAramArTikamavidyamAnavyaktikaM na pratyaBijAnate . apitu nijakAmanAsamucitAkAraviSizwajYAnasvaBAvaM vyaktimevApannaM vidanti nAnyaTA . ata eva na nAmni AkAre vA kaScidgrahaH . kintu sidDAnto'yamatra yaH kAmanAparihAreRa yatkiMciddevatArUpamAlambate tasya tat SudDamuktaBAvena paryavasyati . viparyAttu viparyayaH .. 24 ..
    iast: |-
      nanu sarvagate bhagavattattve kimiti devatāntaropāsakānāṃ mitaṃ phalam ? ucyate-
      avyaktaṃ vyaktimāpannaṃ manyante māmabuddhayaḥ | paraṃ bhāvamajānanto mamāvyayamanuttamam || 7-24 ||
      te khalu alpabuddhitvāt matsvarūpaṃ pāramārthikamavidyamānavyaktikaṃ na pratyabhijānate | apitu nijakāmanāsamucitākāraviśiṣṭajñānasvabhāvaṃ vyaktimevāpannaṃ vidanti nānyathā | ata eva na nāmni ākāre vā kaścidgrahaḥ | kintu siddhānto'yamatra yaḥ kāmanāparihāreṇa yatkiṃciddevatārūpamālambate tasya tat śuddhamuktabhāvena paryavasyati | viparyāttu viparyayaḥ || 24 ||
  - verse: 25
    devanagari: |-
      नाहं प्रकाशः सर्वस्य योगमायासमावृतः । मूढोऽयं नाभिजानाति लोको मामजमव्ययम् ॥ ७-२५ ॥
    slp1: |-
      nAhaM prakASaH sarvasya yogamAyAsamAvftaH . mUQo'yaM nABijAnAti loko mAmajamavyayam .. 7-25 ..
    iast: |-
      nāhaṃ prakāśaḥ sarvasya yogamāyāsamāvṛtaḥ | mūḍho'yaṃ nābhijānāti loko māmajamavyayam || 7-25 ||
  - verse: 26
    devanagari: |-
      वेदाऽहं समतीतानि वर्तमानानि चार्जुन । भविष्यन्ति च भूतानि मां तु वेद न कश्चन ॥ ७-२६ ॥
      सर्वेषां नाहं गोचरतां प्राप्नोमि ॥ २६ ॥
    slp1: |-
      vedA'haM samatItAni vartamAnAni cArjuna . Bavizyanti ca BUtAni mAM tu veda na kaScana .. 7-26 ..
      sarvezAM nAhaM gocaratAM prApnomi .. 26 ..
    iast: |-
      vedā'haṃ samatītāni vartamānāni cārjuna | bhaviṣyanti ca bhūtāni māṃ tu veda na kaścana || 7-26 ||
      sarveṣāṃ nāhaṃ gocaratāṃ prāpnomi || 26 ||
  - verse: 27
    devanagari: |-
      ननु च कर्माण्येव क्रियमाणानि प्रलयकाले मोक्षं विदधते । अन्यथा किमिति महाप्रलय उपजायते ? इत्याशङ्कायामारभते-
      इच्छाद्वेषसमुत्थेन द्वन्द्वमोहेन भारत । सर्वभूतानि सम्मोहं सर्गे यान्ति परन्तप ॥ ७-२७ ॥
      इच्छाद्वेषक्रोधमोहादिभिस्तावन्मोहात्मक एव स परं स्फीतीभाव-मुपनीयते । येन प्रकृतिजठरान्तर्वर्ति समग्रमेव जगत् निजकार्यकरणमात्राक्षममेव प्रसुप्ततामवलम्बते । आमोहं-वासनानुभवात्प्रतिदिनम् रात्रिसमये सौषुप्तवत् । नतु तावता विमुक्तरूपता-मोहानुभवसमाप्तौ पुनर्विचित्रव्यापारसंसारदर्शनात् ॥ २७ ॥
    slp1: |-
      nanu ca karmARyeva kriyamARAni pralayakAle mokzaM vidaDate . anyaTA kimiti mahApralaya upajAyate ? ityASaNkAyAmAraBate-
      icCAdvezasamutTena dvandvamohena BArata . sarvaBUtAni sammohaM sarge yAnti parantapa .. 7-27 ..
      icCAdvezakroDamohAdiBistAvanmohAtmaka eva sa paraM sPItIBAva-mupanIyate . yena prakftijaWarAntarvarti samagrameva jagat nijakAryakaraRamAtrAkzamameva prasuptatAmavalambate . AmohaM-vAsanAnuBavAtpratidinam rAtrisamaye sOzuptavat . natu tAvatA vimuktarUpatA-mohAnuBavasamAptO punarvicitravyApArasaMsAradarSanAt .. 27 ..
    iast: |-
      nanu ca karmāṇyeva kriyamāṇāni pralayakāle mokṣaṃ vidadhate | anyathā kimiti mahāpralaya upajāyate ? ityāśaṅkāyāmārabhate-
      icchādveṣasamutthena dvandvamohena bhārata | sarvabhūtāni sammohaṃ sarge yānti parantapa || 7-27 ||
      icchādveṣakrodhamohādibhistāvanmohātmaka eva sa paraṃ sphītībhāva-mupanīyate | yena prakṛtijaṭharāntarvarti samagrameva jagat nijakāryakaraṇamātrākṣamameva prasuptatāmavalambate | āmohaṃ-vāsanānubhavātpratidinam rātrisamaye sauṣuptavat | natu tāvatā vimuktarūpatā-mohānubhavasamāptau punarvicitravyāpārasaṃsāradarśanāt || 27 ||
  - verse: 28
    devanagari: |-
      येषां त्वन्तं गतं पापं जनानां पुण्यकर्मणाम् । ते द्वन्द्वमोहनिर्मुक्ता भजन्ते मां दृढव्रताः ॥ ७-२८ ॥
    slp1: |-
      yezAM tvantaM gataM pApaM janAnAM puRyakarmaRAm . te dvandvamohanirmuktA Bajante mAM dfQavratAH .. 7-28 ..
    iast: |-
      yeṣāṃ tvantaṃ gataṃ pāpaṃ janānāṃ puṇyakarmaṇām | te dvandvamohanirmuktā bhajante māṃ dṛḍhavratāḥ || 7-28 ||
  - verse: 29
    devanagari: |-
      जरामरणमोक्षाय मामाश्रित्य यतन्ति ये । ते ब्रह्म तद्विदुः कृत्स्नमध्यात्मं कर्म चाखिलम् ॥ ७-२९ ॥
      ये तु विनष्टतामसाः पुण्यापुण्यपरिक्षयक्षेमीकृतात्मानस्ते विपाटितमहामोहवितानाः सर्वमेव भगवद्रश्मिखचितं जरामरणमयतमिस्रस्रुतं ब्रह्म विदन्ति ॥ २९ ॥
    slp1: |-
      jarAmaraRamokzAya mAmASritya yatanti ye . te brahma tadviduH kftsnamaDyAtmaM karma cAKilam .. 7-29 ..
      ye tu vinazwatAmasAH puRyApuRyaparikzayakzemIkftAtmAnaste vipAwitamahAmohavitAnAH sarvameva BagavadraSmiKacitaM jarAmaraRamayatamisrasrutaM brahma vidanti .. 29 ..
    iast: |-
      jarāmaraṇamokṣāya māmāśritya yatanti ye | te brahma tadviduḥ kṛtsnamadhyātmaṃ karma cākhilam || 7-29 ||
      ye tu vinaṣṭatāmasāḥ puṇyāpuṇyaparikṣayakṣemīkṛtātmānaste vipāṭitamahāmohavitānāḥ sarvameva bhagavadraśmikhacitaṃ jarāmaraṇamayatamisrasrutaṃ brahma vidanti || 29 ||
  - verse: 30
    devanagari: |-
      साधिभूताधिदैवं मां साधियज्ञं च ये विदुः । प्रयाणकालेऽपि च मां ते विदुर्युक्तचेतसः ॥ ७-३० ॥
      आध्यात्मिकाधिभौतिकाधिदैविकाधियज्ञिकानि च ममैव रूपान्तराणि । प्रयाणकाले च नित्यं भगवद्भावितान्तः करणत्वान्मां जानन्ति येतो येषां जन्मपूर्वमेव भगवत्तत्त्वं तेऽन्तकाले परमेश्वरं संस्मरेयुः । किं जन्मासेवनया-इति ये मन्यन्ते तेषां तूष्णींभाव एव शोभन इति शिवम् ॥ ३० ॥
    slp1: |-
      sADiBUtADidEvaM mAM sADiyajYaM ca ye viduH . prayARakAle'pi ca mAM te viduryuktacetasaH .. 7-30 ..
      ADyAtmikADiBOtikADidEvikADiyajYikAni ca mamEva rUpAntarARi . prayARakAle ca nityaM BagavadBAvitAntaH karaRatvAnmAM jAnanti yeto yezAM janmapUrvameva BagavattattvaM te'ntakAle parameSvaraM saMsmareyuH . kiM janmAsevanayA-iti ye manyante tezAM tUzRIMBAva eva SoBana iti Sivam .. 30 ..
    iast: |-
      sādhibhūtādhidaivaṃ māṃ sādhiyajñaṃ ca ye viduḥ | prayāṇakāle'pi ca māṃ te viduryuktacetasaḥ || 7-30 ||
      ādhyātmikādhibhautikādhidaivikādhiyajñikāni ca mamaiva rūpāntarāṇi | prayāṇakāle ca nityaṃ bhagavadbhāvitāntaḥ karaṇatvānmāṃ jānanti yeto yeṣāṃ janmapūrvameva bhagavattattvaṃ te'ntakāle parameśvaraṃ saṃsmareyuḥ | kiṃ janmāsevanayā-iti ye manyante teṣāṃ tūṣṇīṃbhāva eva śobhana iti śivam || 30 ||
  - verse: 1000
    devanagari: |-
      स्फुटं भगवतो भक्तिराहिता कल्पमञ्जरी । साधकेच्छासमुचितां येनाशां परिपूरयेत् ॥ ७ ॥
    slp1: |-
      sPuwaM Bagavato BaktirAhitA kalpamaYjarI . sADakecCAsamucitAM yenASAM paripUrayet .. 7 ..
    iast: |-
      sphuṭaṃ bhagavato bhaktirāhitā kalpamañjarī | sādhakecchāsamucitāṃ yenāśāṃ paripūrayet || 7 ||
- chapter: 8
  title_sa: अष्टमोऽध्यायः
  title_iast: "aṣṭamo'dhyāyaḥ"
  title_en: "Eighth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      अर्जुन उवाच
      किं तद् ब्रह्म किमध्यात्मं किं कर्म पुरुषोत्तम । अधिभूतं च किं प्रोक्तमधिदैवं किमुच्यते ॥ ८-१ ॥
    slp1: |-
      arjuna uvAca
      kiM tad brahma kimaDyAtmaM kiM karma puruzottama . aDiBUtaM ca kiM proktamaDidEvaM kimucyate .. 8-1 ..
    iast: |-
      arjuna uvāca
      kiṃ tad brahma kimadhyātmaṃ kiṃ karma puruṣottama | adhibhūtaṃ ca kiṃ proktamadhidaivaṃ kimucyate || 8-1 ||
  - verse: 2
    devanagari: |-
      अधियज्ञः कथं कोऽत्र देहेऽस्मिन् मधुसूदन । प्रयाणकाले च कथं ज्ञेयोऽसि नियतात्मभिः ॥ ८-२ ॥
      ते ब्रह्म तद्विदुः इत्यादिना यद्भगवतोपक्षिप्तं तत्प्रश्ननवकपूर्वकं निर्णयति । अधियज्ञः कथं कोऽत्र देहे तिष्ठतीति शेषः ॥ २ ॥
    slp1: |-
      aDiyajYaH kaTaM ko'tra dehe'smin maDusUdana . prayARakAle ca kaTaM jYeyo'si niyatAtmaBiH .. 8-2 ..
      te brahma tadviduH ityAdinA yadBagavatopakziptaM tatpraSnanavakapUrvakaM nirRayati . aDiyajYaH kaTaM ko'tra dehe tizWatIti SezaH .. 2 ..
    iast: |-
      adhiyajñaḥ kathaṃ ko'tra dehe'smin madhusūdana | prayāṇakāle ca kathaṃ jñeyo'si niyatātmabhiḥ || 8-2 ||
      te brahma tadviduḥ ityādinā yadbhagavatopakṣiptaṃ tatpraśnanavakapūrvakaṃ nirṇayati | adhiyajñaḥ kathaṃ ko'tra dehe tiṣṭhatīti śeṣaḥ || 2 ||
  - verse: 3
    devanagari: |-
      श्रीभगवानुवाच
      अक्षरं ब्रह्म परमं स्वभावोऽध्यात्ममुच्यते । भूतभावोद्भवकरो विसर्गः कर्मसंज्ञितः ॥ ८-३ ॥
      बृहत्वाद्बृंहकत्वाच्च परं ब्रह्म । अत एव अध्यात्मशब्दवाच्यम् । यतः स्वः-अनिवृत्तधर्मा चैतन्याख्यो भावः । तस्य च चैतन्यस्वभावस्य ब्रह्मणोऽपरिच्छिन्नबाह्यलक्षणतया क्रोडीकृतविश्वशक्तेरैश्वर्यलक्षणात्स्वातन्त्र्यात् बहिर्भावावभासनात्मा बहिर्भूतभावान्तरावभासनात्मा च यो विसर्गः क्रमेण भूतानां-ब्रह्मादिप्रमातॄणां भावानां-जडानाम् उद्भवकारी-जडाजडवैचित्र्यनिर्भासकः । तथा भूतभावस्य-विगलितसकलवितथप्रपञ्चस्य सत्यत्वस्य उद्भवं करोतीति ॥ ३ ॥
    slp1: |-
      SrIBagavAnuvAca
      akzaraM brahma paramaM svaBAvo'DyAtmamucyate . BUtaBAvodBavakaro visargaH karmasaMjYitaH .. 8-3 ..
      bfhatvAdbfMhakatvAcca paraM brahma . ata eva aDyAtmaSabdavAcyam . yataH svaH-anivfttaDarmA cEtanyAKyo BAvaH . tasya ca cEtanyasvaBAvasya brahmaRo'paricCinnabAhyalakzaRatayA kroqIkftaviSvaSakterESvaryalakzaRAtsvAtantryAt bahirBAvAvaBAsanAtmA bahirBUtaBAvAntarAvaBAsanAtmA ca yo visargaH krameRa BUtAnAM-brahmAdipramAtFRAM BAvAnAM-jaqAnAm udBavakArI-jaqAjaqavEcitryanirBAsakaH . taTA BUtaBAvasya-vigalitasakalavitaTaprapaYcasya satyatvasya udBavaM karotIti .. 3 ..
    iast: |-
      śrībhagavānuvāca
      akṣaraṃ brahma paramaṃ svabhāvo'dhyātmamucyate | bhūtabhāvodbhavakaro visargaḥ karmasaṃjñitaḥ || 8-3 ||
      bṛhatvādbṛṃhakatvācca paraṃ brahma | ata eva adhyātmaśabdavācyam | yataḥ svaḥ-anivṛttadharmā caitanyākhyo bhāvaḥ | tasya ca caitanyasvabhāvasya brahmaṇo'paricchinnabāhyalakṣaṇatayā kroḍīkṛtaviśvaśakteraiśvaryalakṣaṇātsvātantryāt bahirbhāvāvabhāsanātmā bahirbhūtabhāvāntarāvabhāsanātmā ca yo visargaḥ krameṇa bhūtānāṃ-brahmādipramātṝṇāṃ bhāvānāṃ-jaḍānām udbhavakārī-jaḍājaḍavaicitryanirbhāsakaḥ | tathā bhūtabhāvasya-vigalitasakalavitathaprapañcasya satyatvasya udbhavaṃ karotīti || 3 ||
  - verse: 4
    devanagari: |-
      अधिभूतं क्षरो भावः पुरुषश्चाधिदैवतम् । अधियज्ञोऽहमेवात्र देहे देहभृतां वर ॥ ८-४ ॥
      क्षरति-स्रवति परिणामादिधर्मेणेति क्षरः-घटादिः पदार्थग्राम उच्यते । पुरुषः-आत्मा स चाधिदैवतम्-तत्र सर्वदेवतानां परिनिष्ठितत्वात् । अत एवाशेषयज्ञभोक्तृत्वेन यज्ञान्-अवश्यकार्याणि कर्माणि अधिकृत्य यः स्थितः पुरुषोत्तमः सोऽहमेव । अहमेव च देहे स्थित इति प्रश्नद्वयमेकेन यत्नेन निर्णीतम् ॥ ४ ॥
    slp1: |-
      aDiBUtaM kzaro BAvaH puruzaScADidEvatam . aDiyajYo'hamevAtra dehe dehaBftAM vara .. 8-4 ..
      kzarati-sravati pariRAmAdiDarmeReti kzaraH-GawAdiH padArTagrAma ucyate . puruzaH-AtmA sa cADidEvatam-tatra sarvadevatAnAM parinizWitatvAt . ata evASezayajYaBoktftvena yajYAn-avaSyakAryARi karmARi aDikftya yaH sTitaH puruzottamaH so'hameva . ahameva ca dehe sTita iti praSnadvayamekena yatnena nirRItam .. 4 ..
    iast: |-
      adhibhūtaṃ kṣaro bhāvaḥ puruṣaścādhidaivatam | adhiyajño'hamevātra dehe dehabhṛtāṃ vara || 8-4 ||
      kṣarati-sravati pariṇāmādidharmeṇeti kṣaraḥ-ghaṭādiḥ padārthagrāma ucyate | puruṣaḥ-ātmā sa cādhidaivatam-tatra sarvadevatānāṃ pariniṣṭhitatvāt | ata evāśeṣayajñabhoktṛtvena yajñān-avaśyakāryāṇi karmāṇi adhikṛtya yaḥ sthitaḥ puruṣottamaḥ so'hameva | ahameva ca dehe sthita iti praśnadvayamekena yatnena nirṇītam || 4 ||
  - verse: 5
    devanagari: |-
      अथ योऽवशिष्टः प्रश्नः कथं प्रयाणकाले ज्ञेयोऽसि इति तं निर्णयति-
      अन्तकाले च मामेव स्मरन्मुक्त्वा कलेवरम् । यः प्रयाति स मद्भावं याति नास्त्यत्र संशयः ॥ ८-५ ॥
    slp1: |-
      aTa yo'vaSizwaH praSnaH kaTaM prayARakAle jYeyo'si iti taM nirRayati-
      antakAle ca mAmeva smaranmuktvA kalevaram . yaH prayAti sa madBAvaM yAti nAstyatra saMSayaH .. 8-5 ..
    iast: |-
      atha yo'vaśiṣṭaḥ praśnaḥ kathaṃ prayāṇakāle jñeyo'si iti taṃ nirṇayati-
      antakāle ca māmeva smaranmuktvā kalevaram | yaḥ prayāti sa madbhāvaṃ yāti nāstyatra saṃśayaḥ || 8-5 ||
  - verse: 6
    devanagari: |-
      यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम् । तं तमेवैति कौन्तेय सदा तद्भावभावितः ॥ ८-६ ॥
    slp1: |-
      yaM yaM vApi smaranBAvaM tyajatyante kalevaram . taM tamevEti kOnteya sadA tadBAvaBAvitaH .. 8-6 ..
    iast: |-
      yaṃ yaṃ vāpi smaranbhāvaṃ tyajatyante kalevaram | taṃ tamevaiti kaunteya sadā tadbhāvabhāvitaḥ || 8-6 ||
  - verse: 7
    devanagari: |-
      तस्मात् सर्वेषु कालेषु मामनुस्मर युध्य च । मदर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयम् ॥ ८-७ ॥
      इति न्यायेन तस्यामलक्ष्यायामन्तदशायां संस्कारान्तरापहस्तनेन तत्संस्कारकृते तत्तत्त्वस्मरणे देहसद्भावक्षणकृते च तस्य स्मरणेऽनन्तरं देहविनिपातक्षण एव कालसंस्कारनिवृत्तेस्तदिदमित्यादिवेद्यविभागानवभासात् संविन्मात्रसतत्त्वपरमेश्वरस्वभावतैव भवति-इति श्रीमदभिनवगुप्तगुरुणां संमतम् इत्यलम् । असंशयमिति-नात्र सन्देग्धव्यमिति ॥ ७ ॥
    slp1: |-
      tasmAt sarvezu kAlezu mAmanusmara yuDya ca . madarpitamanobudDirmAmevEzyasyasaMSayam .. 8-7 ..
      iti nyAyena tasyAmalakzyAyAmantadaSAyAM saMskArAntarApahastanena tatsaMskArakfte tattattvasmaraRe dehasadBAvakzaRakfte ca tasya smaraRe'nantaraM dehavinipAtakzaRa eva kAlasaMskAranivfttestadidamityAdivedyaviBAgAnavaBAsAt saMvinmAtrasatattvaparameSvarasvaBAvatEva Bavati-iti SrImadaBinavaguptaguruRAM saMmatam ityalam . asaMSayamiti-nAtra sandegDavyamiti .. 7 ..
    iast: |-
      tasmāt sarveṣu kāleṣu māmanusmara yudhya ca | madarpitamanobuddhirmāmevaiṣyasyasaṃśayam || 8-7 ||
      iti nyāyena tasyāmalakṣyāyāmantadaśāyāṃ saṃskārāntarāpahastanena tatsaṃskārakṛte tattattvasmaraṇe dehasadbhāvakṣaṇakṛte ca tasya smaraṇe'nantaraṃ dehavinipātakṣaṇa eva kālasaṃskāranivṛttestadidamityādivedyavibhāgānavabhāsāt saṃvinmātrasatattvaparameśvarasvabhāvataiva bhavati-iti śrīmadabhinavaguptaguruṇāṃ saṃmatam ityalam | asaṃśayamiti-nātra sandegdhavyamiti || 7 ||
  - verse: 10
    devanagari: |-
      अभ्यासयोगयुक्तेन चेतसानन्यगामिना । परमं पुरुषं दिव्यं याति पार्थानुचिन्तयन् ॥ ८- ८ ॥
      अनुचिन्तयन्निति शरीरभेदानन्तरं निवृत्तकलेवरकृतव्यथः पश्चाद्भगवन्तं चिन्तयन्निति ॥ ८ ॥
      कविं पुराणमनुशासितार मणोरणीयांसमनुस्मरेद्यः । सर्वस्य धातारमचिन्त्यरूप मादित्यवर्णं तमसः परस्तात् ॥ ९ ॥
      प्रयाणकाले मनसाचलेन भक्त्या युक्तो योगबलेन चैव । भ्रुवोर्मध्ये प्राणमावेश्य सम्यक् स तं परं पुरुषमुपैति दिव्यम् ॥ ८-१० ॥
      एवमनुस्मरेदिति । आदित्यवर्णमिति-आदित्यवर्णत्वं वासुदेवतत्त्वस्य परिच्छेदकम्-आकृतिकल्पनादिविभ्रान्तिमयमोहतमसोऽतीतत्वात् रवित्वेन उपमानमित्याशयः । भ्रुवोर्मध्ये-इति प्राग्वत् ॥ १० ॥
    slp1: |-
      aByAsayogayuktena cetasAnanyagAminA . paramaM puruzaM divyaM yAti pArTAnucintayan .. 8- 8 ..
      anucintayanniti SarIraBedAnantaraM nivfttakalevarakftavyaTaH paScAdBagavantaM cintayanniti .. 8 ..
      kaviM purARamanuSAsitAra maRoraRIyAMsamanusmaredyaH . sarvasya DAtAramacintyarUpa mAdityavarRaM tamasaH parastAt .. 9 ..
      prayARakAle manasAcalena BaktyA yukto yogabalena cEva . BruvormaDye prARamAveSya samyak sa taM paraM puruzamupEti divyam .. 8-10 ..
      evamanusmarediti . AdityavarRamiti-AdityavarRatvaM vAsudevatattvasya paricCedakam-AkftikalpanAdiviBrAntimayamohatamaso'tItatvAt ravitvena upamAnamityASayaH . BruvormaDye-iti prAgvat .. 10 ..
    iast: |-
      abhyāsayogayuktena cetasānanyagāminā | paramaṃ puruṣaṃ divyaṃ yāti pārthānucintayan || 8- 8 ||
      anucintayanniti śarīrabhedānantaraṃ nivṛttakalevarakṛtavyathaḥ paścādbhagavantaṃ cintayanniti || 8 ||
      kaviṃ purāṇamanuśāsitāra maṇoraṇīyāṃsamanusmaredyaḥ | sarvasya dhātāramacintyarūpa mādityavarṇaṃ tamasaḥ parastāt || 9 ||
      prayāṇakāle manasācalena bhaktyā yukto yogabalena caiva | bhruvormadhye prāṇamāveśya samyak sa taṃ paraṃ puruṣamupaiti divyam || 8-10 ||
      evamanusmarediti | ādityavarṇamiti-ādityavarṇatvaṃ vāsudevatattvasya paricchedakam-ākṛtikalpanādivibhrāntimayamohatamaso'tītatvāt ravitvena upamānamityāśayaḥ | bhruvormadhye-iti prāgvat || 10 ||
  - verse: 11
    devanagari: |-
      यदक्षरं वेदविदो वदन्ति विशन्ति यद्यतयो वीतरागाः । यदिच्छन्तो ब्रह्मचर्यं चरन्ति तत्ते पदं संग्रहेणाभिधास्ये ॥ ८-११ ॥
      सम्यग् गृह्यते-निश्चीयतेऽनेनेति संग्रहः-उपायः । तेनोपायेन तत्पदम् अभिधास्ये-उपायमत्र सतताभ्यासाय वक्ष्ये ॥ ११ ॥
    slp1: |-
      yadakzaraM vedavido vadanti viSanti yadyatayo vItarAgAH . yadicCanto brahmacaryaM caranti tatte padaM saMgraheRABiDAsye .. 8-11 ..
      samyag gfhyate-niScIyate'neneti saMgrahaH-upAyaH . tenopAyena tatpadam aBiDAsye-upAyamatra satatAByAsAya vakzye .. 11 ..
    iast: |-
      yadakṣaraṃ vedavido vadanti viśanti yadyatayo vītarāgāḥ | yadicchanto brahmacaryaṃ caranti tatte padaṃ saṃgraheṇābhidhāsye || 8-11 ||
      samyag gṛhyate-niścīyate'neneti saṃgrahaḥ-upāyaḥ | tenopāyena tatpadam abhidhāsye-upāyamatra satatābhyāsāya vakṣye || 11 ||
  - verse: 12
    devanagari: |-
      सर्वद्वाराणि संयम्य मनो हृदि निरुध्य च । मूर्ध्न्याधायात्मनः प्राणमास्थितो योगधारणाम् ॥ ८-१२ ॥
      द्वाराणि-इन्द्रियाणि । हृदि-इत्यनेन विषयसंगाभाव उच्यते नतु विष्ठास्थानाधिष्ठानम् । आत्मनः प्राणम्-आत्मसारथिम् इच्छाशक्त्यात्मनि मूर्ध्नि-सकलतत्त्वातीते धारयन्निति कायनियमः ॥ १२ ॥
    slp1: |-
      sarvadvArARi saMyamya mano hfdi niruDya ca . mUrDnyADAyAtmanaH prARamAsTito yogaDAraRAm .. 8-12 ..
      dvArARi-indriyARi . hfdi-ityanena vizayasaMgABAva ucyate natu vizWAsTAnADizWAnam . AtmanaH prARam-AtmasAraTim icCASaktyAtmani mUrDni-sakalatattvAtIte DArayanniti kAyaniyamaH .. 12 ..
    iast: |-
      sarvadvārāṇi saṃyamya mano hṛdi nirudhya ca | mūrdhnyādhāyātmanaḥ prāṇamāsthito yogadhāraṇām || 8-12 ||
      dvārāṇi-indriyāṇi | hṛdi-ityanena viṣayasaṃgābhāva ucyate natu viṣṭhāsthānādhiṣṭhānam | ātmanaḥ prāṇam-ātmasārathim icchāśaktyātmani mūrdhni-sakalatattvātīte dhārayanniti kāyaniyamaḥ || 12 ||
  - verse: 13
    devanagari: |-
      ओमित्येकाक्षरं ब्रह्म व्याहरन्मामनुस्मरन् । यः प्रयाति त्यजन्देहं स याति परमां गतिम् ॥ ८-१३ ॥
    slp1: |-
      omityekAkzaraM brahma vyAharanmAmanusmaran . yaH prayAti tyajandehaM sa yAti paramAM gatim .. 8-13 ..
    iast: |-
      omityekākṣaraṃ brahma vyāharanmāmanusmaran | yaḥ prayāti tyajandehaṃ sa yāti paramāṃ gatim || 8-13 ||
  - verse: 14
    devanagari: |-
      अनन्यचेताः सततं यो मां स्मरति नित्यशः । तस्याहं सुलभः पार्थ नित्ययुक्तस्य योगिनः ॥ ८-१४ ॥
      इति । अत एव प्रयाणकाले स्मरणेन विना खण्डना-इति येषां शङ्का तान् वीतशङ्कान्कर्तुमुक्तम्-अनन्यचेताः सततमिति-अन्यत्र फलादौ साध्ये यस्य न चेत इत्यर्थः । तस्याहं सुलभ इति-तस्य न किंचित्प्रयाणकालौचित्यपर्येषणम्-तीर्थसेवा उत्तरायणम् आयतनसंश्रयः सत्त्वविवृद्धिः सचिन्तकत्वं विषुवदादि-पुण्यकालः दिनम् अकृत्रिमपवित्रभूपरिग्रहः स्नेहमलविहीनदेहता शुद्धवस्त्रादि-ग्रहः-इत्यादिक्लेशोऽभ्यर्थनीय इत्यर्थः । यत्प्रागुक्तं-तीर्थे श्वपचगृहे वा-इत्यादि ॥ १४ ॥
    slp1: |-
      ananyacetAH satataM yo mAM smarati nityaSaH . tasyAhaM sulaBaH pArTa nityayuktasya yoginaH .. 8-14 ..
      iti . ata eva prayARakAle smaraRena vinA KaRqanA-iti yezAM SaNkA tAn vItaSaNkAnkartumuktam-ananyacetAH satatamiti-anyatra PalAdO sADye yasya na ceta ityarTaH . tasyAhaM sulaBa iti-tasya na kiMcitprayARakAlOcityaparyezaRam-tIrTasevA uttarAyaRam AyatanasaMSrayaH sattvavivfdDiH sacintakatvaM vizuvadAdi-puRyakAlaH dinam akftrimapavitraBUparigrahaH snehamalavihInadehatA SudDavastrAdi-grahaH-ityAdikleSo'ByarTanIya ityarTaH . yatprAguktaM-tIrTe Svapacagfhe vA-ityAdi .. 14 ..
    iast: |-
      ananyacetāḥ satataṃ yo māṃ smarati nityaśaḥ | tasyāhaṃ sulabhaḥ pārtha nityayuktasya yoginaḥ || 8-14 ||
      iti | ata eva prayāṇakāle smaraṇena vinā khaṇḍanā-iti yeṣāṃ śaṅkā tān vītaśaṅkānkartumuktam-ananyacetāḥ satatamiti-anyatra phalādau sādhye yasya na ceta ityarthaḥ | tasyāhaṃ sulabha iti-tasya na kiṃcitprayāṇakālaucityaparyeṣaṇam-tīrthasevā uttarāyaṇam āyatanasaṃśrayaḥ sattvavivṛddhiḥ sacintakatvaṃ viṣuvadādi-puṇyakālaḥ dinam akṛtrimapavitrabhūparigrahaḥ snehamalavihīnadehatā śuddhavastrādi-grahaḥ-ityādikleśo'bhyarthanīya ityarthaḥ | yatprāguktaṃ-tīrthe śvapacagṛhe vā-ityādi || 14 ||
  - verse: 15
    devanagari: |-
      ननु मद्भावं याति-इत्युक्तम् । तत्किं प्राप्तेऽपि पुनरावृत्तिरस्ति ? इत्याशङ्क्याह-
      मामुपेत्य पुनर्जन्म दुःखालयमशाश्वतम् । नप्नुवन्ति महात्मानः संसिद्धिं परमां गताः ॥ ८-१५ ॥
      अन्यतस्तु सर्वत एव पुनरावृत्तिरस्तीति समनन्तरेण श्लोकेन प्रतिपाद-यिष्यते । मां तु प्राप्य न पुनर्योगिनो जन्मादित्रासमाप्नुवन्ति ॥ १५ ॥
    slp1: |-
      nanu madBAvaM yAti-ityuktam . tatkiM prApte'pi punarAvfttirasti ? ityASaNkyAha-
      mAmupetya punarjanma duHKAlayamaSASvatam . napnuvanti mahAtmAnaH saMsidDiM paramAM gatAH .. 8-15 ..
      anyatastu sarvata eva punarAvfttirastIti samanantareRa Slokena pratipAda-yizyate . mAM tu prApya na punaryogino janmAditrAsamApnuvanti .. 15 ..
    iast: |-
      nanu madbhāvaṃ yāti-ityuktam | tatkiṃ prāpte'pi punarāvṛttirasti ? ityāśaṅkyāha-
      māmupetya punarjanma duḥkhālayamaśāśvatam | napnuvanti mahātmānaḥ saṃsiddhiṃ paramāṃ gatāḥ || 8-15 ||
      anyatastu sarvata eva punarāvṛttirastīti samanantareṇa ślokena pratipāda-yiṣyate | māṃ tu prāpya na punaryogino janmāditrāsamāpnuvanti || 15 ||
  - verse: 16
    devanagari: |-
      आब्रह्म भुवनाल्लोकाः पुनरावर्तिनोऽर्जुन । मामुपेत्य तु कौन्तेय पुनर्जन्म न विद्यते ॥ ८-१६ ॥
      ब्रह्मलोकमाप्तानामपि पुनरावृत्तिरस्ति-इति सर्वैर्व्याख्यातम् । एतदभ्युप-गमे च तदुपरितनलोकगतिर्मुक्तिः-इत्यभिहितं स्यात् । तच्च न हृदयंगमम् इति संशयमहामोहकलुषीकृतान्तर्दुशामस्माकं प्रतिभातीयमागमाधिगता व्याख्यावर्त्तिः आब्रह्म-यावत् ब्रह्मपदं प्राप्तं तावत् यस्मात्कस्माच्चित्तिर्यगूर्ध्वाधस्तात्भुवनात् पुनरावर्तन्ते-चक्रवत्स्थानान्तरमविरतं भ्राभ्यन्तो विपरिवर्तन्ते इति ॥ १६ ॥
    slp1: |-
      Abrahma BuvanAllokAH punarAvartino'rjuna . mAmupetya tu kOnteya punarjanma na vidyate .. 8-16 ..
      brahmalokamAptAnAmapi punarAvfttirasti-iti sarvErvyAKyAtam . etadaByupa-game ca taduparitanalokagatirmuktiH-ityaBihitaM syAt . tacca na hfdayaMgamam iti saMSayamahAmohakaluzIkftAntarduSAmasmAkaM pratiBAtIyamAgamADigatA vyAKyAvarttiH Abrahma-yAvat brahmapadaM prAptaM tAvat yasmAtkasmAccittiryagUrDvADastAtBuvanAt punarAvartante-cakravatsTAnAntaramavirataM BrAByanto viparivartante iti .. 16 ..
    iast: |-
      ābrahma bhuvanāllokāḥ punarāvartino'rjuna | māmupetya tu kaunteya punarjanma na vidyate || 8-16 ||
      brahmalokamāptānāmapi punarāvṛttirasti-iti sarvairvyākhyātam | etadabhyupa-game ca taduparitanalokagatirmuktiḥ-ityabhihitaṃ syāt | tacca na hṛdayaṃgamam iti saṃśayamahāmohakaluṣīkṛtāntarduśāmasmākaṃ pratibhātīyamāgamādhigatā vyākhyāvarttiḥ ābrahma-yāvat brahmapadaṃ prāptaṃ tāvat yasmātkasmāccittiryagūrdhvādhastātbhuvanāt punarāvartante-cakravatsthānāntaramavirataṃ bhrābhyanto viparivartante iti || 16 ||
  - verse: 17
    devanagari: |-
      ननु क एवं जानाति यत्सर्वभुवनेभ्यः पुनरावृत्तिः । ब्रह्मादय एव हि तावच्चिरतरस्थायिनः श्रूयन्ते । ते एव तावत्कथं पुनरावर्तिनः । पुनरावर्तित्वे हि तेऽपि स्युः प्रभवाप्ययधर्माणः ? इत्याह-
      सहस्रयुगपर्यन्तमहर्ये ब्रह्मणो विदुः । रात्रिं युगसहस्रान्तां तेऽहोरात्रविदो जनाः ॥ ८-१७ ॥
    slp1: |-
      nanu ka evaM jAnAti yatsarvaBuvaneByaH punarAvfttiH . brahmAdaya eva hi tAvacciratarasTAyinaH SrUyante . te eva tAvatkaTaM punarAvartinaH . punarAvartitve hi te'pi syuH praBavApyayaDarmARaH ? ityAha-
      sahasrayugaparyantamaharye brahmaRo viduH . rAtriM yugasahasrAntAM te'horAtravido janAH .. 8-17 ..
    iast: |-
      nanu ka evaṃ jānāti yatsarvabhuvanebhyaḥ punarāvṛttiḥ | brahmādaya eva hi tāvacciratarasthāyinaḥ śrūyante | te eva tāvatkathaṃ punarāvartinaḥ | punarāvartitve hi te'pi syuḥ prabhavāpyayadharmāṇaḥ ? ityāha-
      sahasrayugaparyantamaharye brahmaṇo viduḥ | rātriṃ yugasahasrāntāṃ te'horātravido janāḥ || 8-17 ||
  - verse: 18
    devanagari: |-
      अव्यक्ताद्व्यक्तयः सर्वाः प्रभवन्त्यहरागमे । रात्र्यागमे प्रलीयन्ते तत्रैवाव्यक्तसंज्ञके ॥ ८-१८ ॥
    slp1: |-
      avyaktAdvyaktayaH sarvAH praBavantyaharAgame . rAtryAgame pralIyante tatrEvAvyaktasaMjYake .. 8-18 ..
    iast: |-
      avyaktādvyaktayaḥ sarvāḥ prabhavantyaharāgame | rātryāgame pralīyante tatraivāvyaktasaṃjñake || 8-18 ||
  - verse: 19
    devanagari: |-
      भूतग्रामः स एवायं भूत्वा भूत्वा प्रलीयते । रात्र्यागमेऽवशः पार्थ प्रभवत्यहरागमे ॥ ८-१९ ॥
      ये खलु दीर्घदृश्वानस्ते ब्रह्मणोऽपि रात्रिं दिनं पश्यन्ति प्रलयोदयतया । तथाच । अहरहस्त एव विबुध्य निजां निजामेव चेष्टामनुरुध्यन्ते । प्रतिरात्रि च तेषामेव निवृत्तपरिस्पन्दानां शक्तिमात्रत्वेनावस्थानम् । एवं सृष्टौ प्रलये च पुनः पुनर्भावः । नान्येऽन्ये उपसृज्यन्ते अपितु ते एव जीवाः कालकृतस्तु चिरक्षिप्रप्रत्ययात्मा विशेषः । एष च परिच्छेदः प्रजापतीनामप्यस्ति । ततश्च तेऽपि प्रभवाप्ययधर्माण एव-इति स्थितम् ॥ १९ ॥
    slp1: |-
      BUtagrAmaH sa evAyaM BUtvA BUtvA pralIyate . rAtryAgame'vaSaH pArTa praBavatyaharAgame .. 8-19 ..
      ye Kalu dIrGadfSvAnaste brahmaRo'pi rAtriM dinaM paSyanti pralayodayatayA . taTAca . aharahasta eva vibuDya nijAM nijAmeva cezwAmanuruDyante . pratirAtri ca tezAmeva nivfttaparispandAnAM SaktimAtratvenAvasTAnam . evaM sfzwO pralaye ca punaH punarBAvaH . nAnye'nye upasfjyante apitu te eva jIvAH kAlakftastu cirakziprapratyayAtmA viSezaH . eza ca paricCedaH prajApatInAmapyasti . tataSca te'pi praBavApyayaDarmARa eva-iti sTitam .. 19 ..
    iast: |-
      bhūtagrāmaḥ sa evāyaṃ bhūtvā bhūtvā pralīyate | rātryāgame'vaśaḥ pārtha prabhavatyaharāgame || 8-19 ||
      ye khalu dīrghadṛśvānaste brahmaṇo'pi rātriṃ dinaṃ paśyanti pralayodayatayā | tathāca | aharahasta eva vibudhya nijāṃ nijāmeva ceṣṭāmanurudhyante | pratirātri ca teṣāmeva nivṛttaparispandānāṃ śaktimātratvenāvasthānam | evaṃ sṛṣṭau pralaye ca punaḥ punarbhāvaḥ | nānye'nye upasṛjyante apitu te eva jīvāḥ kālakṛtastu cirakṣiprapratyayātmā viśeṣaḥ | eṣa ca paricchedaḥ prajāpatīnāmapyasti | tataśca te'pi prabhavāpyayadharmāṇa eva-iti sthitam || 19 ||
  - verse: 20
    devanagari: |-
      सर्वतो लोकेभ्यः पुनरावृत्तिर्नतु मां प्राप्य इति स्फुटयति-
      परस्तस्मात्तु भावोऽन्यो व्यक्ताव्यक्तः सनातनः । यः स सर्वेषु भूतेषु नश्यत्सु न विनश्यति ॥ ८-२० ॥
    slp1: |-
      sarvato lokeByaH punarAvfttirnatu mAM prApya iti sPuwayati-
      parastasmAttu BAvo'nyo vyaktAvyaktaH sanAtanaH . yaH sa sarvezu BUtezu naSyatsu na vinaSyati .. 8-20 ..
    iast: |-
      sarvato lokebhyaḥ punarāvṛttirnatu māṃ prāpya iti sphuṭayati-
      parastasmāttu bhāvo'nyo vyaktāvyaktaḥ sanātanaḥ | yaḥ sa sarveṣu bhūteṣu naśyatsu na vinaśyati || 8-20 ||
  - verse: 21
    devanagari: |-
      अव्यक्तोऽक्षर इत्युक्तस्तमाहुः परमां गतिम् । यं प्राप्य न निवर्तन्ते तद्धाम परमं मम ॥ ८-२१ ॥
    slp1: |-
      avyakto'kzara ityuktastamAhuH paramAM gatim . yaM prApya na nivartante tadDAma paramaM mama .. 8-21 ..
    iast: |-
      avyakto'kṣara ityuktastamāhuḥ paramāṃ gatim | yaṃ prāpya na nivartante taddhāma paramaṃ mama || 8-21 ||
  - verse: 22
    devanagari: |-
      पुरुषः स परः पार्थ भक्त्या लभ्यस्त्वनन्यया । यं प्राप्य न पुनर्जन्म लभन्ते योगिनोऽर्जुन ॥ ८-२२ ॥
      उक्तप्रकारं कालसंकलनाविवर्जितं तु वासुदेवतत्त्वम् । व्यक्तम्-सर्वानुगतम् तत्त्वेऽपि अव्यक्तं-दुष्प्रापत्वात् । तच्च भक्तिलभ्यमित्यावेदितं प्राक् । तत्रस्थं चैतद्विश्वम् । यत् खल्वविनाशि रूपं सदा तथाभूतं तत्र कः पुनःशब्दस्यावृत्तिशब्दस्य चार्थः । स हि मध्ये तत्स्वभावविच्छेदापेक्षः । न च सदातनविश्वोत्तीर्णविश्वाव्यतिरिक्तविश्वप्रतिष्ठात्मकपरबोध स्वातन्त्र्य-स्वभावस्य श्रीपरमेश्वरस्य तद्भावप्राप्तिः येन स्वभावविच्छेदः कोऽपि कदाप्यस्ति । अतो युक्तमुक्तं-मामुपेत्य तु-इति ॥ २२ ॥
    slp1: |-
      puruzaH sa paraH pArTa BaktyA laByastvananyayA . yaM prApya na punarjanma laBante yogino'rjuna .. 8-22 ..
      uktaprakAraM kAlasaMkalanAvivarjitaM tu vAsudevatattvam . vyaktam-sarvAnugatam tattve'pi avyaktaM-duzprApatvAt . tacca BaktilaByamityAveditaM prAk . tatrasTaM cEtadviSvam . yat KalvavinASi rUpaM sadA taTABUtaM tatra kaH punaHSabdasyAvfttiSabdasya cArTaH . sa hi maDye tatsvaBAvavicCedApekzaH . na ca sadAtanaviSvottIrRaviSvAvyatiriktaviSvapratizWAtmakaparaboDa svAtantrya-svaBAvasya SrIparameSvarasya tadBAvaprAptiH yena svaBAvavicCedaH ko'pi kadApyasti . ato yuktamuktaM-mAmupetya tu-iti .. 22 ..
    iast: |-
      puruṣaḥ sa paraḥ pārtha bhaktyā labhyastvananyayā | yaṃ prāpya na punarjanma labhante yogino'rjuna || 8-22 ||
      uktaprakāraṃ kālasaṃkalanāvivarjitaṃ tu vāsudevatattvam | vyaktam-sarvānugatam tattve'pi avyaktaṃ-duṣprāpatvāt | tacca bhaktilabhyamityāveditaṃ prāk | tatrasthaṃ caitadviśvam | yat khalvavināśi rūpaṃ sadā tathābhūtaṃ tatra kaḥ punaḥśabdasyāvṛttiśabdasya cārthaḥ | sa hi madhye tatsvabhāvavicchedāpekṣaḥ | na ca sadātanaviśvottīrṇaviśvāvyatiriktaviśvapratiṣṭhātmakaparabodha svātantrya-svabhāvasya śrīparameśvarasya tadbhāvaprāptiḥ yena svabhāvavicchedaḥ ko'pi kadāpyasti | ato yuktamuktaṃ-māmupetya tu-iti || 22 ||
  - verse: 23
    devanagari: |-
      एवं च सतताभ्यासेन येषां क्लेशं विनैव भगवदाप्तिस्तेषां वृत्तमुक्तम् इदानीमुत्क्रान्त्या येऽपवर्गं भोगं चेच्छन्ति तेषां कश्चिद्विशेष उच्यते-
      यत्र काले त्वनावृत्तिमावृत्तिं चैव योगिनः । प्रयाता यान्ति तं कालं वक्ष्यामि भरतर्षभ ॥ ८-२३ ॥
      अनावृत्तिः-मोक्षः । आवृत्तिः-भोगाय ॥ २३ ॥
    slp1: |-
      evaM ca satatAByAsena yezAM kleSaM vinEva BagavadAptistezAM vfttamuktam idAnImutkrAntyA ye'pavargaM BogaM cecCanti tezAM kaScidviSeza ucyate-
      yatra kAle tvanAvfttimAvfttiM cEva yoginaH . prayAtA yAnti taM kAlaM vakzyAmi BaratarzaBa .. 8-23 ..
      anAvfttiH-mokzaH . AvfttiH-BogAya .. 23 ..
    iast: |-
      evaṃ ca satatābhyāsena yeṣāṃ kleśaṃ vinaiva bhagavadāptisteṣāṃ vṛttamuktam idānīmutkrāntyā ye'pavargaṃ bhogaṃ cecchanti teṣāṃ kaścidviśeṣa ucyate-
      yatra kāle tvanāvṛttimāvṛttiṃ caiva yoginaḥ | prayātā yānti taṃ kālaṃ vakṣyāmi bharatarṣabha || 8-23 ||
      anāvṛttiḥ-mokṣaḥ | āvṛttiḥ-bhogāya || 23 ||
  - verse: 24
    devanagari: |-
      अग्निज्योतिरहः शुक्लः षण्मासा उत्तरायणम् । तत्र प्रयाता गच्छन्ति ब्रह्म ब्रह्मविदो जनाः ॥ ८-२४ ॥
    slp1: |-
      agnijyotirahaH SuklaH zaRmAsA uttarAyaRam . tatra prayAtA gacCanti brahma brahmavido janAH .. 8-24 ..
    iast: |-
      agnijyotirahaḥ śuklaḥ ṣaṇmāsā uttarāyaṇam | tatra prayātā gacchanti brahma brahmavido janāḥ || 8-24 ||
  - verse: 25
    devanagari: |-
      धूमो रात्रिस्तथा कृष्णः षण्मासा दक्षिणायनम् । तत्र चान्द्रमसं ज्योतिर्योगी प्राप्य निवर्तते ॥ ८-२५ ॥
      उत्तरेण-ऊर्ध्वेन अयनं-षाण्मासिकम् । तच्च प्रकाशादिधर्मकत्वात् दहनादिकैः शब्दैरुपचर्यते । अतो विपरीतं विपर्ययेण । तत्र चन्द्रमसो भोग्यांशानुप्रवेशाद्भोगायावृत्तिः ॥ २५ ॥
    slp1: |-
      DUmo rAtristaTA kfzRaH zaRmAsA dakziRAyanam . tatra cAndramasaM jyotiryogI prApya nivartate .. 8-25 ..
      uttareRa-UrDvena ayanaM-zARmAsikam . tacca prakASAdiDarmakatvAt dahanAdikEH SabdErupacaryate . ato viparItaM viparyayeRa . tatra candramaso BogyAMSAnupraveSAdBogAyAvfttiH .. 25 ..
    iast: |-
      dhūmo rātristathā kṛṣṇaḥ ṣaṇmāsā dakṣiṇāyanam | tatra cāndramasaṃ jyotiryogī prāpya nivartate || 8-25 ||
      uttareṇa-ūrdhvena ayanaṃ-ṣāṇmāsikam | tacca prakāśādidharmakatvāt dahanādikaiḥ śabdairupacaryate | ato viparītaṃ viparyayeṇa | tatra candramaso bhogyāṃśānupraveśādbhogāyāvṛttiḥ || 25 ||
  - verse: 26
    devanagari: |-
      शुक्लकृष्णे गती ह्येते जगतः शाश्वते मते । अनयोर्यात्यनावृत्तिमाद्ययावर्ततेऽन्यया ॥ ८-२६ ॥
      अनयोर्गत्योर्मध्यादाद्यया-अनावृत्तिः-मोक्षः । अन्यया भोगः ॥ २६ ॥
    slp1: |-
      SuklakfzRe gatI hyete jagataH SASvate mate . anayoryAtyanAvfttimAdyayAvartate'nyayA .. 8-26 ..
      anayorgatyormaDyAdAdyayA-anAvfttiH-mokzaH . anyayA BogaH .. 26 ..
    iast: |-
      śuklakṛṣṇe gatī hyete jagataḥ śāśvate mate | anayoryātyanāvṛttimādyayāvartate'nyayā || 8-26 ||
      anayorgatyormadhyādādyayā-anāvṛttiḥ-mokṣaḥ | anyayā bhogaḥ || 26 ||
  - verse: 27
    devanagari: |-
      नैते सृती पार्थ जानन् योगी मुह्यति कश्चन । तस्मात्सर्वेषु कालेषु योगयुक्तो भवार्जुन ॥ ८-२७ ॥
      एते सृती यो वेत्ति-आभ्यन्तरेण क्रमेण योगाभ्यासस्वीकृतेनेत्यर्थः । एतच्च वितत्य प्रकाश्यमानं ग्रन्थं विस्तारयतीत्यलम् । सर्वे ये काला आभ्यन्तराः तद्विषयं योगमभ्यस्येत् । अस्मद्गुरवस्त्वाहुः-सर्वानुग्राहकतया मध्ये आभ्यन्तरकालकृतमुत्क्रान्तिभेदमभिधाय प्रकृतमेव बाह्यकालविषयं मुख्यं प्रमेयमुपसंहृतम् तस्मात्सर्वेषु कालेषु-इत्यादिना ॥ २७ ॥
    slp1: |-
      nEte sftI pArTa jAnan yogI muhyati kaScana . tasmAtsarvezu kAlezu yogayukto BavArjuna .. 8-27 ..
      ete sftI yo vetti-AByantareRa krameRa yogAByAsasvIkftenetyarTaH . etacca vitatya prakASyamAnaM granTaM vistArayatItyalam . sarve ye kAlA AByantarAH tadvizayaM yogamaByasyet . asmadguravastvAhuH-sarvAnugrAhakatayA maDye AByantarakAlakftamutkrAntiBedamaBiDAya prakftameva bAhyakAlavizayaM muKyaM prameyamupasaMhftam tasmAtsarvezu kAlezu-ityAdinA .. 27 ..
    iast: |-
      naite sṛtī pārtha jānan yogī muhyati kaścana | tasmātsarveṣu kāleṣu yogayukto bhavārjuna || 8-27 ||
      ete sṛtī yo vetti-ābhyantareṇa krameṇa yogābhyāsasvīkṛtenetyarthaḥ | etacca vitatya prakāśyamānaṃ granthaṃ vistārayatītyalam | sarve ye kālā ābhyantarāḥ tadviṣayaṃ yogamabhyasyet | asmadguravastvāhuḥ-sarvānugrāhakatayā madhye ābhyantarakālakṛtamutkrāntibhedamabhidhāya prakṛtameva bāhyakālaviṣayaṃ mukhyaṃ prameyamupasaṃhṛtam tasmātsarveṣu kāleṣu-ityādinā || 27 ||
  - verse: 28
    devanagari: |-
      वेदेषु यज्ञेषु तपःसु चैव दानेषु यत्पुण्यफलं प्रदिष्टम् । अभ्येति तत्सर्वमिदं विदित्वा योगी परं स्थानमुपैति चाद्यम् ॥ ८-२८ ॥
      अभ्येति-अभिभवति-सर्वकर्मसंस्काराणां भगवत्स्मृत्या विफलीकरणात् । सर्वकर्मपरिक्षये चासौ सुखेनैव विन्दति परं शिवमिति शिवम् ॥ २८ ॥
    slp1: |-
      vedezu yajYezu tapaHsu cEva dAnezu yatpuRyaPalaM pradizwam . aByeti tatsarvamidaM viditvA yogI paraM sTAnamupEti cAdyam .. 8-28 ..
      aByeti-aBiBavati-sarvakarmasaMskArARAM BagavatsmftyA viPalIkaraRAt . sarvakarmaparikzaye cAsO suKenEva vindati paraM Sivamiti Sivam .. 28 ..
    iast: |-
      vedeṣu yajñeṣu tapaḥsu caiva dāneṣu yatpuṇyaphalaṃ pradiṣṭam | abhyeti tatsarvamidaṃ viditvā yogī paraṃ sthānamupaiti cādyam || 8-28 ||
      abhyeti-abhibhavati-sarvakarmasaṃskārāṇāṃ bhagavatsmṛtyā viphalīkaraṇāt | sarvakarmaparikṣaye cāsau sukhenaiva vindati paraṃ śivamiti śivam || 28 ||
  - verse: 1000
    devanagari: |-
      सर्वतत्त्वगतत्वेन विज्ञाते परमेश्वरे । अन्तर्बहिर्न सावस्था न यस्यां भासते विभुः ॥ ८ ॥
    slp1: |-
      sarvatattvagatatvena vijYAte parameSvare . antarbahirna sAvasTA na yasyAM BAsate viBuH .. 8 ..
    iast: |-
      sarvatattvagatatvena vijñāte parameśvare | antarbahirna sāvasthā na yasyāṃ bhāsate vibhuḥ || 8 ||
- chapter: 9
  title_sa: नवमोऽध्यायः
  title_iast: "navamo'dhyāyaḥ"
  title_en: "Ninth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      श्रीभगवानुवाच
      इदं तु ते गुह्यतमं प्रवक्ष्याम्यनसूयवे । ज्ञानं विज्ञानसहितं यज्ज्ञात्वा मोक्ष्यसेऽशुभात् ॥ ९-१ ॥
      अनसूयत्वं ज्ञानसंक्रान्तौ कारणं मुख्यम् । ज्ञानविज्ञाने-प्राग्वत् ॥ १ ॥
    slp1: |-
      SrIBagavAnuvAca
      idaM tu te guhyatamaM pravakzyAmyanasUyave . jYAnaM vijYAnasahitaM yajjYAtvA mokzyase'SuBAt .. 9-1 ..
      anasUyatvaM jYAnasaMkrAntO kAraRaM muKyam . jYAnavijYAne-prAgvat .. 1 ..
    iast: |-
      śrībhagavānuvāca
      idaṃ tu te guhyatamaṃ pravakṣyāmyanasūyave | jñānaṃ vijñānasahitaṃ yajjñātvā mokṣyase'śubhāt || 9-1 ||
      anasūyatvaṃ jñānasaṃkrāntau kāraṇaṃ mukhyam | jñānavijñāne-prāgvat || 1 ||
  - verse: 2
    devanagari: |-
      राजविद्या राजगुह्यं पवित्रमिदमुत्तमम् । प्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम् ॥ ९-२ ॥
      राजते-सर्वविद्यामध्ये दीप्यते या । इहैव ह्युच्यते-अध्यात्मविद्या विद्यानाम् इति । राज्ञाम्-जनकादीनामत्राधिकारस्तेषां रहस्यम्-अतिगुप्तत्वात् क्षत्रियसुलभेन वीरभावेनाविकम्पत्वात् । कर्तुम्-अनुष्ठातुं सुसुखम् । न चास्य ब्रह्मोपासनात्मनः कर्मणोऽन्यकर्मवदुपभोगादिना व्ययोऽस्ति ॥ २ ॥
    slp1: |-
      rAjavidyA rAjaguhyaM pavitramidamuttamam . pratyakzAvagamaM DarmyaM susuKaM kartumavyayam .. 9-2 ..
      rAjate-sarvavidyAmaDye dIpyate yA . ihEva hyucyate-aDyAtmavidyA vidyAnAm iti . rAjYAm-janakAdInAmatrADikArastezAM rahasyam-atiguptatvAt kzatriyasulaBena vIraBAvenAvikampatvAt . kartum-anuzWAtuM susuKam . na cAsya brahmopAsanAtmanaH karmaRo'nyakarmavadupaBogAdinA vyayo'sti .. 2 ..
    iast: |-
      rājavidyā rājaguhyaṃ pavitramidamuttamam | pratyakṣāvagamaṃ dharmyaṃ susukhaṃ kartumavyayam || 9-2 ||
      rājate-sarvavidyāmadhye dīpyate yā | ihaiva hyucyate-adhyātmavidyā vidyānām iti | rājñām-janakādīnāmatrādhikārasteṣāṃ rahasyam-atiguptatvāt kṣatriyasulabhena vīrabhāvenāvikampatvāt | kartum-anuṣṭhātuṃ susukham | na cāsya brahmopāsanātmanaḥ karmaṇo'nyakarmavadupabhogādinā vyayo'sti || 2 ||
  - verse: 3
    devanagari: |-
      अश्रद्दधानाः पुरुषा धर्मस्यास्य परन्तप । अप्राप्य मां निवर्तन्ते मृत्युसंसारवर्त्मनि ॥ ९-३ ॥
      निवर्तन्ते-पुनःपुनर्जायन्ते म्रियन्ते च ॥ ३ ॥
    slp1: |-
      aSraddaDAnAH puruzA DarmasyAsya parantapa . aprApya mAM nivartante mftyusaMsAravartmani .. 9-3 ..
      nivartante-punaHpunarjAyante mriyante ca .. 3 ..
    iast: |-
      aśraddadhānāḥ puruṣā dharmasyāsya parantapa | aprāpya māṃ nivartante mṛtyusaṃsāravartmani || 9-3 ||
      nivartante-punaḥpunarjāyante mriyante ca || 3 ||
  - verse: 4
    devanagari: |-
      मया ततमिदं कृत्स्नं जगदव्यक्तमूर्तिना । मत्स्थानि सर्वभूतानि न चाऽहं तेष्ववस्थितः ॥ ९-४ ॥
      मत्स्थानि सर्वभूतानीति-सुचिरमपि गत्वा अन्यस्य प्रतिष्ठाधाम्नोऽविद्यमानत्वात् । भूतरूपबोध्यात्मकप्रसिद्धतदीयजडरूपपुरःसरीकारेण तदवभासे तद्विपरीतबोधस्वभावतिरोधानम् । इत्येतदाह-न चाहं तेष्ववस्थितः-इति ॥ ४ ॥
    slp1: |-
      mayA tatamidaM kftsnaM jagadavyaktamUrtinA . matsTAni sarvaBUtAni na cA'haM tezvavasTitaH .. 9-4 ..
      matsTAni sarvaBUtAnIti-suciramapi gatvA anyasya pratizWADAmno'vidyamAnatvAt . BUtarUpaboDyAtmakaprasidDatadIyajaqarUpapuraHsarIkAreRa tadavaBAse tadviparItaboDasvaBAvatiroDAnam . ityetadAha-na cAhaM tezvavasTitaH-iti .. 4 ..
    iast: |-
      mayā tatamidaṃ kṛtsnaṃ jagadavyaktamūrtinā | matsthāni sarvabhūtāni na cā'haṃ teṣvavasthitaḥ || 9-4 ||
      matsthāni sarvabhūtānīti-suciramapi gatvā anyasya pratiṣṭhādhāmno'vidyamānatvāt | bhūtarūpabodhyātmakaprasiddhatadīyajaḍarūpapuraḥsarīkāreṇa tadavabhāse tadviparītabodhasvabhāvatirodhānam | ityetadāha-na cāhaṃ teṣvavasthitaḥ-iti || 4 ||
  - verse: 5
    devanagari: |-
      न च मत्स्थानि भूतानि पश्य मे योगमैश्वरम् । भूतभृन्न च भूतस्थो ममात्मा भूतभावनः ॥ ९-५ ॥
      न च मत्स्थानि-अविद्यान्धानां तत्त्वादृष्टेः । नहि मूढा अविच्छिन्नसंवित्स्वभावं परमेश्वरं समस्तवस्तुपरिच्छेदप्रतिष्ठास्थानं मन्यन्ते । अपितु कृशो देवदत्तोऽहम् इदं वेद्मि भूतले इदं स्थितम्-इति मितमेव स्वभावं प्रतिष्ठा-स्थानतया पश्यन्ति । ननु कथमेतद्विरुद्धम् ? इत्याह- पश्य मे योगमैश्वरम्-इति । योगः-शक्तिः-युज्यमानत्वात् । एतदेव ममैश्वर्यं-यदेवं निरतिशयाद्भुतवृत्तिस्वातन्त्र्यमित्यर्थः ॥ ५ ॥
    slp1: |-
      na ca matsTAni BUtAni paSya me yogamESvaram . BUtaBfnna ca BUtasTo mamAtmA BUtaBAvanaH .. 9-5 ..
      na ca matsTAni-avidyAnDAnAM tattvAdfzweH . nahi mUQA avicCinnasaMvitsvaBAvaM parameSvaraM samastavastuparicCedapratizWAsTAnaM manyante . apitu kfSo devadatto'ham idaM vedmi BUtale idaM sTitam-iti mitameva svaBAvaM pratizWA-sTAnatayA paSyanti . nanu kaTametadvirudDam ? ityAha- paSya me yogamESvaram-iti . yogaH-SaktiH-yujyamAnatvAt . etadeva mamESvaryaM-yadevaM niratiSayAdButavfttisvAtantryamityarTaH .. 5 ..
    iast: |-
      na ca matsthāni bhūtāni paśya me yogamaiśvaram | bhūtabhṛnna ca bhūtastho mamātmā bhūtabhāvanaḥ || 9-5 ||
      na ca matsthāni-avidyāndhānāṃ tattvādṛṣṭeḥ | nahi mūḍhā avicchinnasaṃvitsvabhāvaṃ parameśvaraṃ samastavastuparicchedapratiṣṭhāsthānaṃ manyante | apitu kṛśo devadatto'ham idaṃ vedmi bhūtale idaṃ sthitam-iti mitameva svabhāvaṃ pratiṣṭhā-sthānatayā paśyanti | nanu kathametadviruddham ? ityāha- paśya me yogamaiśvaram-iti | yogaḥ-śaktiḥ-yujyamānatvāt | etadeva mamaiśvaryaṃ-yadevaṃ niratiśayādbhutavṛttisvātantryamityarthaḥ || 5 ||
  - verse: 6
    devanagari: |-
      यथाकाशस्थितो नित्यं वायुः सर्वत्रगो महान् । तथा सर्वाणि भूतानि मत्स्थानीत्युपधारय ॥ ९-६ ॥
    slp1: |-
      yaTAkASasTito nityaM vAyuH sarvatrago mahAn . taTA sarvARi BUtAni matsTAnItyupaDAraya .. 9-6 ..
    iast: |-
      yathākāśasthito nityaṃ vāyuḥ sarvatrago mahān | tathā sarvāṇi bhūtāni matsthānītyupadhāraya || 9-6 ||
  - verse: 7
    devanagari: |-
      एवं हि सर्वभावेषु चराम्यनभिलक्षितः । भूतप्रकृतिमास्थाय सहैव च विनैव च ॥ ९-७ ॥
      यद्वदाकाशवाय्वोरविनाभाविन्यपि संबन्धे न जातुचिन्नभः स्पृश्यता श्रूयते एवं सकलसंसारविसार्यपि भगवत्तत्त्वं न सर्वजनविषयम् ॥ ७ ॥
    slp1: |-
      evaM hi sarvaBAvezu carAmyanaBilakzitaH . BUtaprakftimAsTAya sahEva ca vinEva ca .. 9-7 ..
      yadvadAkASavAyvoravinABAvinyapi saMbanDe na jAtucinnaBaH spfSyatA SrUyate evaM sakalasaMsAravisAryapi BagavattattvaM na sarvajanavizayam .. 7 ..
    iast: |-
      evaṃ hi sarvabhāveṣu carāmyanabhilakṣitaḥ | bhūtaprakṛtimāsthāya sahaiva ca vinaiva ca || 9-7 ||
      yadvadākāśavāyvoravinābhāvinyapi saṃbandhe na jātucinnabhaḥ spṛśyatā śrūyate evaṃ sakalasaṃsāravisāryapi bhagavattattvaṃ na sarvajanaviṣayam || 7 ||
  - verse: 8
    devanagari: |-
      सर्वभूतानि कौन्तेय प्रकृतिं यान्ति मामिकाम् । कल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम् ॥ ९-८ ॥
      प्रकृतिम्-अव्यक्तरूपाम् ॥ ८ ॥
    slp1: |-
      sarvaBUtAni kOnteya prakftiM yAnti mAmikAm . kalpakzaye punastAni kalpAdO visfjAmyaham .. 9-8 ..
      prakftim-avyaktarUpAm .. 8 ..
    iast: |-
      sarvabhūtāni kaunteya prakṛtiṃ yānti māmikām | kalpakṣaye punastāni kalpādau visṛjāmyaham || 9-8 ||
      prakṛtim-avyaktarūpām || 8 ||
  - verse: 9
    devanagari: |-
      प्रकृतिं स्वामवष्टभ्य विसृजामि पुनः पुनः । भूतग्राममिमं कृत्स्नमवशं प्रकृतेर्वशात् ॥ ९-९ ॥
      स्वां प्रकृतिमवष्टभ्य-इत्येतावता जडोऽपि स्वतोऽयं भावग्रामः परप्रकृत्यन्वयात्प्रकाशतां प्राप्तः ॥ ९ ॥
    slp1: |-
      prakftiM svAmavazwaBya visfjAmi punaH punaH . BUtagrAmamimaM kftsnamavaSaM prakftervaSAt .. 9-9 ..
      svAM prakftimavazwaBya-ityetAvatA jaqo'pi svato'yaM BAvagrAmaH paraprakftyanvayAtprakASatAM prAptaH .. 9 ..
    iast: |-
      prakṛtiṃ svāmavaṣṭabhya visṛjāmi punaḥ punaḥ | bhūtagrāmamimaṃ kṛtsnamavaśaṃ prakṛtervaśāt || 9-9 ||
      svāṃ prakṛtimavaṣṭabhya-ityetāvatā jaḍo'pi svato'yaṃ bhāvagrāmaḥ paraprakṛtyanvayātprakāśatāṃ prāptaḥ || 9 ||
  - verse: 10
    devanagari: |-
      न च मां तानि कर्माणि निबध्नन्ति धनञ्जय । उदासीनवदासीनमसक्तं तेषु कर्मसु ॥ ९-१० ॥
    slp1: |-
      na ca mAM tAni karmARi nibaDnanti DanaYjaya . udAsInavadAsInamasaktaM tezu karmasu .. 9-10 ..
    iast: |-
      na ca māṃ tāni karmāṇi nibadhnanti dhanañjaya | udāsīnavadāsīnamasaktaṃ teṣu karmasu || 9-10 ||
  - verse: 11
    devanagari: |-
      मयाध्यक्षेण प्रकृतिः सूयते सचराचरम् । हेतुनानेन कौन्तेय जगद् विपरिवर्तते ॥ ९-११ ॥
      न च मेऽस्ति कर्मबन्धः-औदासीत्येन वर्तमानोऽहं यतः । अत एवाहं जगन्निर्माणेऽनाश्रितव्यापारत्वाद्धेतुः ॥ ११ ॥
    slp1: |-
      mayADyakzeRa prakftiH sUyate sacarAcaram . hetunAnena kOnteya jagad viparivartate .. 9-11 ..
      na ca me'sti karmabanDaH-OdAsItyena vartamAno'haM yataH . ata evAhaM jagannirmARe'nASritavyApAratvAdDetuH .. 11 ..
    iast: |-
      mayādhyakṣeṇa prakṛtiḥ sūyate sacarācaram | hetunānena kaunteya jagad viparivartate || 9-11 ||
      na ca me'sti karmabandhaḥ-audāsītyena vartamāno'haṃ yataḥ | ata evāhaṃ jagannirmāṇe'nāśritavyāpāratvāddhetuḥ || 11 ||
  - verse: 12
    devanagari: |-
      अवजानन्ति मां मूढा मानुषीं तनुमास्थितम् । परं भावमजानन्तो ममाव्ययमनुत्तमम् ॥ ९-१२ ॥
      सोऽहं सर्वजनान्तःशायी सर्वस्यात्मपररूपतयावज्ञास्पदम्-यन्मानुषादि-चतुर्दशविधस र्गव्यतिरिक्त ईश्वरो नोपलभ्यते स कथमस्तीति ॥ १२ ॥
    slp1: |-
      avajAnanti mAM mUQA mAnuzIM tanumAsTitam . paraM BAvamajAnanto mamAvyayamanuttamam .. 9-12 ..
      so'haM sarvajanAntaHSAyI sarvasyAtmapararUpatayAvajYAspadam-yanmAnuzAdi-caturdaSaviDasa rgavyatirikta ISvaro nopalaByate sa kaTamastIti .. 12 ..
    iast: |-
      avajānanti māṃ mūḍhā mānuṣīṃ tanumāsthitam | paraṃ bhāvamajānanto mamāvyayamanuttamam || 9-12 ||
      so'haṃ sarvajanāntaḥśāyī sarvasyātmapararūpatayāvajñāspadam-yanmānuṣādi-caturdaśavidhasa rgavyatirikta īśvaro nopalabhyate sa kathamastīti || 12 ||
  - verse: 13
    devanagari: |-
      मोघाशा मोघकर्माणो मोघज्ञाना विचेतसः । आसुरीं राक्षसीं चैव प्रकृतिं मोहिनीं श्रिताः ॥ ९-१३ ॥
      तेषां च कर्म ज्ञानमाकाङ्क्षाश्च सर्वं निष्फलम्-अवस्तुविषयत्वात् । आसुरीं राक्षसीं चेति-उद्रिक्तरजस्तमोधर्माण इति ॥ १३ ॥
    slp1: |-
      moGASA moGakarmARo moGajYAnA vicetasaH . AsurIM rAkzasIM cEva prakftiM mohinIM SritAH .. 9-13 ..
      tezAM ca karma jYAnamAkANkzASca sarvaM nizPalam-avastuvizayatvAt . AsurIM rAkzasIM ceti-udriktarajastamoDarmARa iti .. 13 ..
    iast: |-
      moghāśā moghakarmāṇo moghajñānā vicetasaḥ | āsurīṃ rākṣasīṃ caiva prakṛtiṃ mohinīṃ śritāḥ || 9-13 ||
      teṣāṃ ca karma jñānamākāṅkṣāśca sarvaṃ niṣphalam-avastuviṣayatvāt | āsurīṃ rākṣasīṃ ceti-udriktarajastamodharmāṇa iti || 13 ||
  - verse: 14
    devanagari: |-
      महात्मानस्तु मां पार्थ दैवीं प्रकृतिमाश्रिताः । भजन्त्यनन्यमनसो ज्ञात्वा भूतादिमव्ययम् ॥ ९-१४ ॥
    slp1: |-
      mahAtmAnastu mAM pArTa dEvIM prakftimASritAH . Bajantyananyamanaso jYAtvA BUtAdimavyayam .. 9-14 ..
    iast: |-
      mahātmānastu māṃ pārtha daivīṃ prakṛtimāśritāḥ | bhajantyananyamanaso jñātvā bhūtādimavyayam || 9-14 ||
  - verse: 15
    devanagari: |-
      सततं कीर्तयन्तश्च यतन्तश्च यतव्रताः । नमस्यन्तश्च मां भक्त्या नित्ययुक्ता उपासते ॥ ९-१५ ॥
    slp1: |-
      satataM kIrtayantaSca yatantaSca yatavratAH . namasyantaSca mAM BaktyA nityayuktA upAsate .. 9-15 ..
    iast: |-
      satataṃ kīrtayantaśca yatantaśca yatavratāḥ | namasyantaśca māṃ bhaktyā nityayuktā upāsate || 9-15 ||
  - verse: 16
    devanagari: |-
      ज्ञानयज्ञेन चाऽप्यन्ये यजन्तो मामुपासते । एकत्वेन पृथक्त्वेन बहुधा विश्वतोमुखम् ॥ ९-१६ ॥
      दैवीं-सात्त्विकीम् । यजन्तो-बाह्यद्रव्यादियागैः । अन्ये तु मां ज्ञानयज्ञेनैवोपासते । अतः केचित् एकतया-ज्ञानतः । केचिद् बहुधा-कर्मयोगात् । मत्परा एव सर्वे ॥ १६ ॥
    slp1: |-
      jYAnayajYena cA'pyanye yajanto mAmupAsate . ekatvena pfTaktvena bahuDA viSvatomuKam .. 9-16 ..
      dEvIM-sAttvikIm . yajanto-bAhyadravyAdiyAgEH . anye tu mAM jYAnayajYenEvopAsate . ataH kecit ekatayA-jYAnataH . kecid bahuDA-karmayogAt . matparA eva sarve .. 16 ..
    iast: |-
      jñānayajñena cā'pyanye yajanto māmupāsate | ekatvena pṛthaktvena bahudhā viśvatomukham || 9-16 ||
      daivīṃ-sāttvikīm | yajanto-bāhyadravyādiyāgaiḥ | anye tu māṃ jñānayajñenaivopāsate | ataḥ kecit ekatayā-jñānataḥ | kecid bahudhā-karmayogāt | matparā eva sarve || 16 ||
  - verse: 17
    devanagari: |-
      ननु कर्म तावत्कारककलापव्याप्तभेदोद्रेकि कथमभिन्नं भगवत्पदं प्रापयतीति ? उच्यते-
      अहं क्रतुरहं यज्ञः स्वधाहमहमौषधम् । मन्त्रोऽहमहमेवाज्यमहमग्निरहं हुतम् ॥ ९-१७ ॥
    slp1: |-
      nanu karma tAvatkArakakalApavyAptaBedodreki kaTamaBinnaM BagavatpadaM prApayatIti ? ucyate-
      ahaM kraturahaM yajYaH svaDAhamahamOzaDam . mantro'hamahamevAjyamahamagnirahaM hutam .. 9-17 ..
    iast: |-
      nanu karma tāvatkārakakalāpavyāptabhedodreki kathamabhinnaṃ bhagavatpadaṃ prāpayatīti ? ucyate-
      ahaṃ kraturahaṃ yajñaḥ svadhāhamahamauṣadham | mantro'hamahamevājyamahamagnirahaṃ hutam || 9-17 ||
  - verse: 18
    devanagari: |-
      पिताहमस्य जगतो माता धाता पितामहः । वेद्यं पवित्रमोङ्कार ऋक्साम यजुरेव च ॥ ९-१८ ॥
    slp1: |-
      pitAhamasya jagato mAtA DAtA pitAmahaH . vedyaM pavitramoNkAra fksAma yajureva ca .. 9-18 ..
    iast: |-
      pitāhamasya jagato mātā dhātā pitāmahaḥ | vedyaṃ pavitramoṅkāra ṛksāma yajureva ca || 9-18 ||
  - verse: 19
    devanagari: |-
      गतिर्भर्ता प्रभुः साक्षी निवासः शरणं सुहृत् । प्रभवः प्रलयः स्थानं निधानं बीजमव्ययम् ॥ ९-१९ ॥
    slp1: |-
      gatirBartA praBuH sAkzI nivAsaH SaraRaM suhft . praBavaH pralayaH sTAnaM niDAnaM bIjamavyayam .. 9-19 ..
    iast: |-
      gatirbhartā prabhuḥ sākṣī nivāsaḥ śaraṇaṃ suhṛt | prabhavaḥ pralayaḥ sthānaṃ nidhānaṃ bījamavyayam || 9-19 ||
  - verse: 20
    devanagari: |-
      तपाम्यहमहं वर्षं निगृह्णाम्युत्सृजामि च । अमृतं चैव मृत्युश्च सदसच्चाहमर्जुन ॥ ९-२० ॥
      इति तत्र तत्र वितत्य विचारितचरमेतत् इतीहोपरम्यते । तषाम्यहमित्यादि-अद्वैतकथाप्रसङ्गेनोक्तम् ॥ २० ॥
    slp1: |-
      tapAmyahamahaM varzaM nigfhRAmyutsfjAmi ca . amftaM cEva mftyuSca sadasaccAhamarjuna .. 9-20 ..
      iti tatra tatra vitatya vicAritacarametat itIhoparamyate . tazAmyahamityAdi-advEtakaTAprasaNgenoktam .. 20 ..
    iast: |-
      tapāmyahamahaṃ varṣaṃ nigṛhṇāmyutsṛjāmi ca | amṛtaṃ caiva mṛtyuśca sadasaccāhamarjuna || 9-20 ||
      iti tatra tatra vitatya vicāritacarametat itīhoparamyate | taṣāmyahamityādi-advaitakathāprasaṅgenoktam || 20 ||
  - verse: 21
    devanagari: |-
      नन्वेवं यदि बाह्ययागादिनापि ब्रह्माप्तिः तर्ह्यग्निष्टोमादिष्वपि किमन्यो याज्यः ? अभ्युपगमे भेदवादः वासुदेव एवेति चेत् कथं नापवर्गस्तैः ? तदर्थमुच्यते-
      त्रैविद्या मां सोमपाः पूतपापा यज्ञैरिष्ट्वा स्वर्गतिं प्रार्थयन्ते । ते पुण्यमासाद्य सुरेन्द्रलोक- मश्नन्ति दिव्यान्दिवि देवभोगान् ॥ ९-२१ ॥
    slp1: |-
      nanvevaM yadi bAhyayAgAdinApi brahmAptiH tarhyagnizwomAdizvapi kimanyo yAjyaH ? aByupagame BedavAdaH vAsudeva eveti cet kaTaM nApavargastEH ? tadarTamucyate-
      trEvidyA mAM somapAH pUtapApA yajYErizwvA svargatiM prArTayante . te puRyamAsAdya surendraloka- maSnanti divyAndivi devaBogAn .. 9-21 ..
    iast: |-
      nanvevaṃ yadi bāhyayāgādināpi brahmāptiḥ tarhyagniṣṭomādiṣvapi kimanyo yājyaḥ ? abhyupagame bhedavādaḥ vāsudeva eveti cet kathaṃ nāpavargastaiḥ ? tadarthamucyate-
      traividyā māṃ somapāḥ pūtapāpā yajñairiṣṭvā svargatiṃ prārthayante | te puṇyamāsādya surendraloka- maśnanti divyāndivi devabhogān || 9-21 ||
  - verse: 22
    devanagari: |-
      ते तं भुक्त्वा स्वर्गलोकं विशालं क्षीणे पुण्ये मर्त्यलोकं विशन्ति । एवं त्रयीधर्ममनुप्रपन्ना गतागतं कामकामा लभन्त ॥ ९-२२ ॥
    slp1: |-
      te taM BuktvA svargalokaM viSAlaM kzIRe puRye martyalokaM viSanti . evaM trayIDarmamanuprapannA gatAgataM kAmakAmA laBanta .. 9-22 ..
    iast: |-
      te taṃ bhuktvā svargalokaṃ viśālaṃ kṣīṇe puṇye martyalokaṃ viśanti | evaṃ trayīdharmamanuprapannā gatāgataṃ kāmakāmā labhanta || 9-22 ||
  - verse: 23
    devanagari: |-
      यद्यपि ते मामेव यजन्ते तथापि स्वर्गमात्रप्रार्थनया मितकर्मनिजसत्त्वदुर्बलतया स्वर्गादिमात्रेणैव फलेनावच्छिन्दन्ति । अत एवैषां पुनरावर्तको धर्मः । एवं ते गतागतं लभन्ते नतु यागस्य पुनरावृत्तिप्रसवधर्मा स्वभावः ॥ २२ ॥ तथाहि
      अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते । तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम् ॥ ९-२३ ॥
      तेभ्योऽन्ये मां चिन्तयन्तः कथम्? अनन्या-अविद्यमानम् अन्यत्-मद्व्यतिरिक्तं कामनीयं फलं येषामिति । योगः-अप्रतिलब्धमत्स्वरूपलाभः । क्षेमं-प्राप्तभगवत्स्वरूपप्रतिष्ठालाभपरिरक्षणम् । येन योगभ्रष्टत्वशङ्कापि न भवेदित्यर्थः ॥ २३ ॥
    slp1: |-
      yadyapi te mAmeva yajante taTApi svargamAtraprArTanayA mitakarmanijasattvadurbalatayA svargAdimAtreREva PalenAvacCindanti . ata evEzAM punarAvartako DarmaH . evaM te gatAgataM laBante natu yAgasya punarAvfttiprasavaDarmA svaBAvaH .. 22 .. taTAhi
      ananyAScintayanto mAM ye janAH paryupAsate . tezAM nityABiyuktAnAM yogakzemaM vahAmyaham .. 9-23 ..
      teByo'nye mAM cintayantaH kaTam? ananyA-avidyamAnam anyat-madvyatiriktaM kAmanIyaM PalaM yezAmiti . yogaH-apratilabDamatsvarUpalABaH . kzemaM-prAptaBagavatsvarUpapratizWAlABaparirakzaRam . yena yogaBrazwatvaSaNkApi na BavedityarTaH .. 23 ..
    iast: |-
      yadyapi te māmeva yajante tathāpi svargamātraprārthanayā mitakarmanijasattvadurbalatayā svargādimātreṇaiva phalenāvacchindanti | ata evaiṣāṃ punarāvartako dharmaḥ | evaṃ te gatāgataṃ labhante natu yāgasya punarāvṛttiprasavadharmā svabhāvaḥ || 22 || tathāhi
      ananyāścintayanto māṃ ye janāḥ paryupāsate | teṣāṃ nityābhiyuktānāṃ yogakṣemaṃ vahāmyaham || 9-23 ||
      tebhyo'nye māṃ cintayantaḥ katham? ananyā-avidyamānam anyat-madvyatiriktaṃ kāmanīyaṃ phalaṃ yeṣāmiti | yogaḥ-apratilabdhamatsvarūpalābhaḥ | kṣemaṃ-prāptabhagavatsvarūpapratiṣṭhālābhaparirakṣaṇam | yena yogabhraṣṭatvaśaṅkāpi na bhavedityarthaḥ || 23 ||
  - verse: 24
    devanagari: |-
      येऽप्यन्यदेवताभक्ता यजन्ते श्रद्धयान्विताः । तेऽपि मामेव कौन्तेय यजन्त्यविधिपूर्वकम् ॥ ९-२४ ॥
    slp1: |-
      ye'pyanyadevatABaktA yajante SradDayAnvitAH . te'pi mAmeva kOnteya yajantyaviDipUrvakam .. 9-24 ..
    iast: |-
      ye'pyanyadevatābhaktā yajante śraddhayānvitāḥ | te'pi māmeva kaunteya yajantyavidhipūrvakam || 9-24 ||
  - verse: 25
    devanagari: |-
      अहं हि सर्वयज्ञानां भोक्ता च प्रभुरेव च । नतु मामभिजानन्ति तत्त्वेनातश्चलन्ति ते ॥ ९-२५ ॥
    slp1: |-
      ahaM hi sarvayajYAnAM BoktA ca praBureva ca . natu mAmaBijAnanti tattvenAtaScalanti te .. 9-25 ..
    iast: |-
      ahaṃ hi sarvayajñānāṃ bhoktā ca prabhureva ca | natu māmabhijānanti tattvenātaścalanti te || 9-25 ||
  - verse: 26
    devanagari: |-
      यान्ति देवव्रता देवान्पितृन्यान्ति पितृव्रताः । भूतानि यान्ति भूतेज्या यान्ति मद्याजिनोऽपि माम् ॥ ९-२६ ॥
    slp1: |-
      yAnti devavratA devAnpitfnyAnti pitfvratAH . BUtAni yAnti BUtejyA yAnti madyAjino'pi mAm .. 9-26 ..
    iast: |-
      yānti devavratā devānpitṛnyānti pitṛvratāḥ | bhūtāni yānti bhūtejyā yānti madyājino'pi mām || 9-26 ||
  - verse: 27
    devanagari: |-
      पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति । तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः ॥ ९-२७ ॥
      इति ॥ २७ ॥
    slp1: |-
      patraM puzpaM PalaM toyaM yo me BaktyA prayacCati . tadahaM BaktyupahftamaSnAmi prayatAtmanaH .. 9-27 ..
      iti .. 27 ..
    iast: |-
      patraṃ puṣpaṃ phalaṃ toyaṃ yo me bhaktyā prayacchati | tadahaṃ bhaktyupahṛtamaśnāmi prayatātmanaḥ || 9-27 ||
      iti || 27 ||
  - verse: 28
    devanagari: |-
      एवं य उक्तक्रमेण वेत्ति-तस्येन्द्रादिदेवतायागोऽपि परमेश्वरयाग इति यदप्यन्यत्कर्म तदपि महेश्वरस्वात्मार्चनरूपं तस्यैव सर्वत्रोद्देशात्-इत्याह
      यत्करोषि यदश्नासि यज्जुहोषि ददासि यत् । यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम् ॥ ९-२८ ॥
    slp1: |-
      evaM ya uktakrameRa vetti-tasyendrAdidevatAyAgo'pi parameSvarayAga iti yadapyanyatkarma tadapi maheSvarasvAtmArcanarUpaM tasyEva sarvatroddeSAt-ityAha
      yatkarozi yadaSnAsi yajjuhozi dadAsi yat . yattapasyasi kOnteya tatkuruzva madarpaRam .. 9-28 ..
    iast: |-
      evaṃ ya uktakrameṇa vetti-tasyendrādidevatāyāgo'pi parameśvarayāga iti yadapyanyatkarma tadapi maheśvarasvātmārcanarūpaṃ tasyaiva sarvatroddeśāt-ityāha
      yatkaroṣi yadaśnāsi yajjuhoṣi dadāsi yat | yattapasyasi kaunteya tatkuruṣva madarpaṇam || 9-28 ||
  - verse: 29
    devanagari: |-
      शुभाशुभफलैरेवं मोक्ष्यसे कर्मबन्धनैः । संन्यासयोगयुक्तात्मा विमुक्तो मामुपैष्यसि ॥ ९-२९ ॥
      देवतान्तरयाजिनो यतो मितमनोरथाः फलं लघयन्ति अतस्त्वं सर्वे प्रागुक्तोपदेशक्रमेण मदर्पणं-मन्मयत्वेन भावनं कुरु । एष एव च संन्यासयोगः । इति विस्तीर्णं विस्पष्टप्रायं पुरस्तादेव ॥ २९ ॥
    slp1: |-
      SuBASuBaPalErevaM mokzyase karmabanDanEH . saMnyAsayogayuktAtmA vimukto mAmupEzyasi .. 9-29 ..
      devatAntarayAjino yato mitamanoraTAH PalaM laGayanti atastvaM sarve prAguktopadeSakrameRa madarpaRaM-manmayatvena BAvanaM kuru . eza eva ca saMnyAsayogaH . iti vistIrRaM vispazwaprAyaM purastAdeva .. 29 ..
    iast: |-
      śubhāśubhaphalairevaṃ mokṣyase karmabandhanaiḥ | saṃnyāsayogayuktātmā vimukto māmupaiṣyasi || 9-29 ||
      devatāntarayājino yato mitamanorathāḥ phalaṃ laghayanti atastvaṃ sarve prāguktopadeśakrameṇa madarpaṇaṃ-manmayatvena bhāvanaṃ kuru | eṣa eva ca saṃnyāsayogaḥ | iti vistīrṇaṃ vispaṣṭaprāyaṃ purastādeva || 29 ||
  - verse: 30
    devanagari: |-
      समोऽहं सर्वभूतेषु न मे द्वेष्योऽस्ति न प्रियः । ये भजन्ति तु मां भक्त्या मयि ते तेषु चाऽप्यहम् ॥ ९-३० ॥
    slp1: |-
      samo'haM sarvaBUtezu na me dvezyo'sti na priyaH . ye Bajanti tu mAM BaktyA mayi te tezu cA'pyaham .. 9-30 ..
    iast: |-
      samo'haṃ sarvabhūteṣu na me dveṣyo'sti na priyaḥ | ye bhajanti tu māṃ bhaktyā mayi te teṣu cā'pyaham || 9-30 ||
  - verse: 31
    devanagari: |-
      अपि चेत् सुदुराचारो भजते मामनन्यभाक् । साधुरेव स मन्तव्यः सम्यग्व्यवसितो हि सः ॥ ९-३१ ॥
    slp1: |-
      api cet sudurAcAro Bajate mAmananyaBAk . sADureva sa mantavyaH samyagvyavasito hi saH .. 9-31 ..
    iast: |-
      api cet sudurācāro bhajate māmananyabhāk | sādhureva sa mantavyaḥ samyagvyavasito hi saḥ || 9-31 ||
  - verse: 32
    devanagari: |-
      क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति । कौन्तेय प्रतिजानीहि न मद्भक्तः प्रणश्यति ॥ ९-३२ ॥
      प्रतिजाने इति-युक्तियुक्तोऽयमर्थो भगवत्प्रतिज्ञातत्वात्सुष्ठुतमां दृढो भवति ॥ ३२ ॥
    slp1: |-
      kzipraM Bavati DarmAtmA SaSvacCAntiM nigacCati . kOnteya pratijAnIhi na madBaktaH praRaSyati .. 9-32 ..
      pratijAne iti-yuktiyukto'yamarTo BagavatpratijYAtatvAtsuzWutamAM dfQo Bavati .. 32 ..
    iast: |-
      kṣipraṃ bhavati dharmātmā śaśvacchāntiṃ nigacchati | kaunteya pratijānīhi na madbhaktaḥ praṇaśyati || 9-32 ||
      pratijāne iti-yuktiyukto'yamartho bhagavatpratijñātatvātsuṣṭhutamāṃ dṛḍho bhavati || 32 ||
  - verse: 33
    devanagari: |-
      मां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः । स्त्रियो वैश्यास्तथा शूद्रास्तेऽपि यान्ति परां गतिम् ॥ ९-३३ ॥
    slp1: |-
      mAM hi pArTa vyapASritya ye'pi syuH pApayonayaH . striyo vESyAstaTA SUdrAste'pi yAnti parAM gatim .. 9-33 ..
    iast: |-
      māṃ hi pārtha vyapāśritya ye'pi syuḥ pāpayonayaḥ | striyo vaiśyāstathā śūdrāste'pi yānti parāṃ gatim || 9-33 ||
  - verse: 34
    devanagari: |-
      किं पुनर्ब्राह्मणाः पुण्या भक्ता राजर्षयस्तथा । अनित्यमसुखं लोकमिमं प्राप्य भजस्व माम् ॥ ९-३४ ॥
    slp1: |-
      kiM punarbrAhmaRAH puRyA BaktA rAjarzayastaTA . anityamasuKaM lokamimaM prApya Bajasva mAm .. 9-34 ..
    iast: |-
      kiṃ punarbrāhmaṇāḥ puṇyā bhaktā rājarṣayastathā | anityamasukhaṃ lokamimaṃ prāpya bhajasva mām || 9-34 ||
  - verse: 35
    devanagari: |-
      मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु । मामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः ॥ ९-३५ ॥
      पापयोनयः-पशुपक्षिसरीसृपादयः । स्त्रिय इत्यज्ञाः । वैश्या इति-कृष्यादिकर्मान्तररताः । शूद्रा इति-कार्त्स्न्येन वैदिकक्रियानधिकृताः परतन्त्रवृत्तयश्च । तेऽपि मदाश्रिता मामेव यजन्ते । (गजेन्द्रमोक्षणादीनि चरितानि हि परमकारुणिकस्य भगवतः सहस्रशः श्रूयन्ते) । किमङ्ग पुनरेतद्विपरीतवृत्तयः । केचिदाचक्षते-द्विजराजन्यप्रशंसापरमेतद्वाक्यं नतु स्त्र्यादिष्वपवर्गप्राप्तितात्पर्येण-इति । ते हि भगवतः सर्वानुग्राहिकां शक्तिं मितविषयतया खण्डयन्तः तथा परमेश्वरस्य परमकृपालुत्वमसहमानाः न मे द्वेष्योऽस्ति न प्रियः अपि चेत्सुदुराचारः इत्यादीन्यन्यानि चैवंप्रकारस्फुटार्थप्रतिपादकानि वाक्यानि विरोधयन्तो निरतिशययुक्तिप्रपञ्चसाधिताद्वैतभगवत्तत्त्वे भेदलिङ्गं बलादेवानयन्तो अन्यांश्चागमविरोधानचेतयमानाः कथमिदं कथमिदम्-इति पर्यनुयुज्यमाना यदि परमन्तर्गभीकृतजात्यादिमहाग्रहाविष्टान्तःकरणाः मात्सर्यावहित्थलज्जाजिह्मीकृतावाङ्मुखदृष्टयः समग्रस्य जनस्यासत्प्रलापिन इति हास्यरसविषयभावमात्मन्यारोपयन्ति । यत्पूर्वैव व्याख्या सर्वस्य करोति शिवमिति शिवम् ॥ ३५ ॥
    slp1: |-
      manmanA Bava madBakto madyAjI mAM namaskuru . mAmevEzyasi yuktvEvamAtmAnaM matparAyaRaH .. 9-35 ..
      pApayonayaH-paSupakzisarIsfpAdayaH . striya ityajYAH . vESyA iti-kfzyAdikarmAntararatAH . SUdrA iti-kArtsnyena vEdikakriyAnaDikftAH paratantravfttayaSca . te'pi madASritA mAmeva yajante . (gajendramokzaRAdIni caritAni hi paramakAruRikasya BagavataH sahasraSaH SrUyante) . kimaNga punaretadviparItavfttayaH . kecidAcakzate-dvijarAjanyapraSaMsAparametadvAkyaM natu stryAdizvapavargaprAptitAtparyeRa-iti . te hi BagavataH sarvAnugrAhikAM SaktiM mitavizayatayA KaRqayantaH taTA parameSvarasya paramakfpAlutvamasahamAnAH na me dvezyo'sti na priyaH api cetsudurAcAraH ityAdInyanyAni cEvaMprakArasPuwArTapratipAdakAni vAkyAni viroDayanto niratiSayayuktiprapaYcasADitAdvEtaBagavattattve BedaliNgaM balAdevAnayanto anyAMScAgamaviroDAnacetayamAnAH kaTamidaM kaTamidam-iti paryanuyujyamAnA yadi paramantargaBIkftajAtyAdimahAgrahAvizwAntaHkaraRAH mAtsaryAvahitTalajjAjihmIkftAvANmuKadfzwayaH samagrasya janasyAsatpralApina iti hAsyarasavizayaBAvamAtmanyAropayanti . yatpUrvEva vyAKyA sarvasya karoti Sivamiti Sivam .. 35 ..
    iast: |-
      manmanā bhava madbhakto madyājī māṃ namaskuru | māmevaiṣyasi yuktvaivamātmānaṃ matparāyaṇaḥ || 9-35 ||
      pāpayonayaḥ-paśupakṣisarīsṛpādayaḥ | striya ityajñāḥ | vaiśyā iti-kṛṣyādikarmāntararatāḥ | śūdrā iti-kārtsnyena vaidikakriyānadhikṛtāḥ paratantravṛttayaśca | te'pi madāśritā māmeva yajante | (gajendramokṣaṇādīni caritāni hi paramakāruṇikasya bhagavataḥ sahasraśaḥ śrūyante) | kimaṅga punaretadviparītavṛttayaḥ | kecidācakṣate-dvijarājanyapraśaṃsāparametadvākyaṃ natu stryādiṣvapavargaprāptitātparyeṇa-iti | te hi bhagavataḥ sarvānugrāhikāṃ śaktiṃ mitaviṣayatayā khaṇḍayantaḥ tathā parameśvarasya paramakṛpālutvamasahamānāḥ na me dveṣyo'sti na priyaḥ api cetsudurācāraḥ ityādīnyanyāni caivaṃprakārasphuṭārthapratipādakāni vākyāni virodhayanto niratiśayayuktiprapañcasādhitādvaitabhagavattattve bhedaliṅgaṃ balādevānayanto anyāṃścāgamavirodhānacetayamānāḥ kathamidaṃ kathamidam-iti paryanuyujyamānā yadi paramantargabhīkṛtajātyādimahāgrahāviṣṭāntaḥkaraṇāḥ mātsaryāvahitthalajjājihmīkṛtāvāṅmukhadṛṣṭayaḥ samagrasya janasyāsatpralāpina iti hāsyarasaviṣayabhāvamātmanyāropayanti | yatpūrvaiva vyākhyā sarvasya karoti śivamiti śivam || 35 ||
  - verse: 1000
    devanagari: |-
      अद्वैते ब्रह्मणि परा सर्वानुग्रहशालिनी । शाक्तिर्विजृम्भते तेन यतनीयं तदाप्तये ॥ ९ ॥
    slp1: |-
      advEte brahmaRi parA sarvAnugrahaSAlinI . SAktirvijfmBate tena yatanIyaM tadAptaye .. 9 ..
    iast: |-
      advaite brahmaṇi parā sarvānugrahaśālinī | śāktirvijṛmbhate tena yatanīyaṃ tadāptaye || 9 ||
- chapter: 10
  title_sa: दशमोऽध्यायः
  title_iast: "daśamo'dhyāyaḥ"
  title_en: "Tenth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      प्राक्तनैर्नवभिरध्यायैर्य एवार्थो लक्षितः स एव प्रतिपदपाठैरस्मिन्नध्याये प्रतायते । तथा चाह-भूय एव-इति । उक्तमेवार्थं स्फुटीकर्तुं पुनः कथ्यमानं शृण्विति । अर्जुनोऽप्येवमेवाभिधास्यति-भूयः कथय इति-इत्यध्यायतात्पर्यम् । शिष्टं निगदव्याख्यातमिति किं पुनरुक्तेन । संदिग्धं तु निर्णेष्यते ।
      श्रीभगवानुवाच
      भूय एव महाबाहो शृणु मे परमं वचः । यत्तेऽहं प्रीयमाणाय वक्ष्यामि हितकाम्यया ॥ १०-१ ॥
    slp1: |-
      prAktanErnavaBiraDyAyErya evArTo lakzitaH sa eva pratipadapAWErasminnaDyAye pratAyate . taTA cAha-BUya eva-iti . uktamevArTaM sPuwIkartuM punaH kaTyamAnaM SfRviti . arjuno'pyevamevABiDAsyati-BUyaH kaTaya iti-ityaDyAyatAtparyam . SizwaM nigadavyAKyAtamiti kiM punaruktena . saMdigDaM tu nirRezyate .
      SrIBagavAnuvAca
      BUya eva mahAbAho SfRu me paramaM vacaH . yatte'haM prIyamARAya vakzyAmi hitakAmyayA .. 10-1 ..
    iast: |-
      prāktanairnavabhiradhyāyairya evārtho lakṣitaḥ sa eva pratipadapāṭhairasminnadhyāye pratāyate | tathā cāha-bhūya eva-iti | uktamevārthaṃ sphuṭīkartuṃ punaḥ kathyamānaṃ śṛṇviti | arjuno'pyevamevābhidhāsyati-bhūyaḥ kathaya iti-ityadhyāyatātparyam | śiṣṭaṃ nigadavyākhyātamiti kiṃ punaruktena | saṃdigdhaṃ tu nirṇeṣyate |
      śrībhagavānuvāca
      bhūya eva mahābāho śṛṇu me paramaṃ vacaḥ | yatte'haṃ prīyamāṇāya vakṣyāmi hitakāmyayā || 10-1 ||
  - verse: 2
    devanagari: |-
      न मे विदुः सुरगणाः प्रभवं न महर्षयः । अहमादिर्हि देवानां महर्षीणां च सर्वशः ॥ १०-२ ॥
    slp1: |-
      na me viduH suragaRAH praBavaM na maharzayaH . ahamAdirhi devAnAM maharzIRAM ca sarvaSaH .. 10-2 ..
    iast: |-
      na me viduḥ suragaṇāḥ prabhavaṃ na maharṣayaḥ | ahamādirhi devānāṃ maharṣīṇāṃ ca sarvaśaḥ || 10-2 ||
  - verse: 3
    devanagari: |-
      यो मामजमनादिं च वेत्ति लोकमहेश्वरम् । असम्मूढः स मर्त्येषु सर्वपापैः प्रमुच्यते ॥ १०-३ ॥
    slp1: |-
      yo mAmajamanAdiM ca vetti lokamaheSvaram . asammUQaH sa martyezu sarvapApEH pramucyate .. 10-3 ..
    iast: |-
      yo māmajamanādiṃ ca vetti lokamaheśvaram | asammūḍhaḥ sa martyeṣu sarvapāpaiḥ pramucyate || 10-3 ||
  - verse: 4
    devanagari: |-
      बुद्धिर्ज्ञानमसम्मोहः क्षमा सत्यं दमः शमः । सुखं दुःखं भवो भावो भयं चाभयमेव च ॥ १०-४ ॥
      असंमोहः-उत्साहः ॥ ४ ॥
    slp1: |-
      budDirjYAnamasammohaH kzamA satyaM damaH SamaH . suKaM duHKaM Bavo BAvo BayaM cABayameva ca .. 10-4 ..
      asaMmohaH-utsAhaH .. 4 ..
    iast: |-
      buddhirjñānamasammohaḥ kṣamā satyaṃ damaḥ śamaḥ | sukhaṃ duḥkhaṃ bhavo bhāvo bhayaṃ cābhayameva ca || 10-4 ||
      asaṃmohaḥ-utsāhaḥ || 4 ||
  - verse: 5
    devanagari: |-
      अहिंसा समता तुष्टिस्तपो दानं यशोऽयशः । भवन्ति भावा भूतानां मत्त एव पृथग्विधाः ॥ १०-५ ॥
    slp1: |-
      ahiMsA samatA tuzwistapo dAnaM yaSo'yaSaH . Bavanti BAvA BUtAnAM matta eva pfTagviDAH .. 10-5 ..
    iast: |-
      ahiṃsā samatā tuṣṭistapo dānaṃ yaśo'yaśaḥ | bhavanti bhāvā bhūtānāṃ matta eva pṛthagvidhāḥ || 10-5 ||
  - verse: 6
    devanagari: |-
      महर्षयः सप्त पूर्वे चत्वारो मनवस्तथा । मद्भावा मानसा जाता येषां लोक इमाः प्रजाः ॥ १०-६ ॥
    slp1: |-
      maharzayaH sapta pUrve catvAro manavastaTA . madBAvA mAnasA jAtA yezAM loka imAH prajAH .. 10-6 ..
    iast: |-
      maharṣayaḥ sapta pūrve catvāro manavastathā | madbhāvā mānasā jātā yeṣāṃ loka imāḥ prajāḥ || 10-6 ||
  - verse: 7
    devanagari: |-
      एतां विभूतिं योगं च मम यो वेत्ति तत्त्वतः । सोऽविकम्पेन योगेन युज्यते नात्र संशयः ॥ १०-७ ॥
    slp1: |-
      etAM viBUtiM yogaM ca mama yo vetti tattvataH . so'vikampena yogena yujyate nAtra saMSayaH .. 10-7 ..
    iast: |-
      etāṃ vibhūtiṃ yogaṃ ca mama yo vetti tattvataḥ | so'vikampena yogena yujyate nātra saṃśayaḥ || 10-7 ||
  - verse: 8
    devanagari: |-
      अहं सर्वस्य प्रभवो इतः सर्वं प्रवर्तते । इति मत्वा भजन्ते मां बुधा भावसमन्विताः ॥ १०-८ ॥
    slp1: |-
      ahaM sarvasya praBavo itaH sarvaM pravartate . iti matvA Bajante mAM buDA BAvasamanvitAH .. 10-8 ..
    iast: |-
      ahaṃ sarvasya prabhavo itaḥ sarvaṃ pravartate | iti matvā bhajante māṃ budhā bhāvasamanvitāḥ || 10-8 ||
  - verse: 9
    devanagari: |-
      मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम् । कथयन्तश्च मां नित्यं तुष्यन्ति च रमयन्ति च ॥ १०-९ ॥
      परस्परबोधनया अन्योन्यबोधस्फारसंक्रमणात् सर्व एव हि प्रमातार एक ईश्वरः-इति विततव्याप्त्या सुखेनैव सर्वशक्तिकसर्वगतस्वात्मरूपताधिगमेन माहेश्वर्यमेषामिति भावः ॥ ९ ॥
    slp1: |-
      maccittA madgataprARA boDayantaH parasparam . kaTayantaSca mAM nityaM tuzyanti ca ramayanti ca .. 10-9 ..
      parasparaboDanayA anyonyaboDasPArasaMkramaRAt sarva eva hi pramAtAra eka ISvaraH-iti vitatavyAptyA suKenEva sarvaSaktikasarvagatasvAtmarUpatADigamena mAheSvaryamezAmiti BAvaH .. 9 ..
    iast: |-
      maccittā madgataprāṇā bodhayantaḥ parasparam | kathayantaśca māṃ nityaṃ tuṣyanti ca ramayanti ca || 10-9 ||
      parasparabodhanayā anyonyabodhasphārasaṃkramaṇāt sarva eva hi pramātāra eka īśvaraḥ-iti vitatavyāptyā sukhenaiva sarvaśaktikasarvagatasvātmarūpatādhigamena māheśvaryameṣāmiti bhāvaḥ || 9 ||
  - verse: 10
    devanagari: |-
      तेषां सततयुक्तानां भजतां प्रीतिपूर्वकम् । ददामि बुद्धियोगं तं येन मां प्रापयन्ति ते ॥ १०-१० ॥
    slp1: |-
      tezAM satatayuktAnAM BajatAM prItipUrvakam . dadAmi budDiyogaM taM yena mAM prApayanti te .. 10-10 ..
    iast: |-
      teṣāṃ satatayuktānāṃ bhajatāṃ prītipūrvakam | dadāmi buddhiyogaṃ taṃ yena māṃ prāpayanti te || 10-10 ||
  - verse: 11
    devanagari: |-
      तेषामेवानुकम्पार्थमहमज्ञानजं तमः । नाशयाम्यात्मभावस्थो ज्ञानदीपेन भास्वता ॥ १०-११ ॥
    slp1: |-
      tezAmevAnukampArTamahamajYAnajaM tamaH . nASayAmyAtmaBAvasTo jYAnadIpena BAsvatA .. 10-11 ..
    iast: |-
      teṣāmevānukampārthamahamajñānajaṃ tamaḥ | nāśayāmyātmabhāvastho jñānadīpena bhāsvatā || 10-11 ||
  - verse: 12
    devanagari: |-
      अर्जुन उवाच
      परं ब्रह्म परं धाम पवित्रं परमं भवान् । पुरुषं शाश्वतं दिव्यमादिदेवमजं विभुम् ॥ १०-१२ ॥
    slp1: |-
      arjuna uvAca
      paraM brahma paraM DAma pavitraM paramaM BavAn . puruzaM SASvataM divyamAdidevamajaM viBum .. 10-12 ..
    iast: |-
      arjuna uvāca
      paraṃ brahma paraṃ dhāma pavitraṃ paramaṃ bhavān | puruṣaṃ śāśvataṃ divyamādidevamajaṃ vibhum || 10-12 ||
  - verse: 13
    devanagari: |-
      आहुस्त्वामृषयः सर्वे देवर्षिर्नारदस्तथा । असितो देवलो व्यासः स्वयं चैव ब्रवीषि माम् ॥ १०-१३ ॥
    slp1: |-
      AhustvAmfzayaH sarve devarzirnAradastaTA . asito devalo vyAsaH svayaM cEva bravIzi mAm .. 10-13 ..
    iast: |-
      āhustvāmṛṣayaḥ sarve devarṣirnāradastathā | asito devalo vyāsaḥ svayaṃ caiva bravīṣi mām || 10-13 ||
  - verse: 14
    devanagari: |-
      सर्वमेतदृतं मन्ये यन्मे वदसि केशव । न हि ते भगवन्व्यक्तिं विदुर्देवा महषयः ॥ १०-१४ ॥
    slp1: |-
      sarvametadftaM manye yanme vadasi keSava . na hi te BagavanvyaktiM vidurdevA mahazayaH .. 10-14 ..
    iast: |-
      sarvametadṛtaṃ manye yanme vadasi keśava | na hi te bhagavanvyaktiṃ vidurdevā mahaṣayaḥ || 10-14 ||
  - verse: 15
    devanagari: |-
      स्वयमेवात्मनात्मानं वेत्थ त्वं पुरुषोत्तम । भूतभावन भूतेश देवदेव जगत्पते ॥ १०-१५ ॥
    slp1: |-
      svayamevAtmanAtmAnaM vetTa tvaM puruzottama . BUtaBAvana BUteSa devadeva jagatpate .. 10-15 ..
    iast: |-
      svayamevātmanātmānaṃ vettha tvaṃ puruṣottama | bhūtabhāvana bhūteśa devadeva jagatpate || 10-15 ||
  - verse: 16
    devanagari: |-
      वक्तुमर्हस्यशेषेण विभूतीरात्मनः शुभाः । याभिर्विभूतिभिर्लोकानिमांस्त्वं व्याप्य तिष्ठसि ॥ १०-१६ ॥
    slp1: |-
      vaktumarhasyaSezeRa viBUtIrAtmanaH SuBAH . yABirviBUtiBirlokAnimAMstvaM vyApya tizWasi .. 10-16 ..
    iast: |-
      vaktumarhasyaśeṣeṇa vibhūtīrātmanaḥ śubhāḥ | yābhirvibhūtibhirlokānimāṃstvaṃ vyāpya tiṣṭhasi || 10-16 ||
  - verse: 17
    devanagari: |-
      कथं विद्यामहं योगिंस्त्वामहं परिचिन्तयन् । केषु केषु च भावेषु चिन्त्योऽसि भगवन्मया ॥ १०-१७ ॥
    slp1: |-
      kaTaM vidyAmahaM yogiMstvAmahaM paricintayan . kezu kezu ca BAvezu cintyo'si BagavanmayA .. 10-17 ..
    iast: |-
      kathaṃ vidyāmahaṃ yogiṃstvāmahaṃ paricintayan | keṣu keṣu ca bhāveṣu cintyo'si bhagavanmayā || 10-17 ||
  - verse: 18
    devanagari: |-
      विस्तरेणात्मनो योगं विभूतिं च जनार्दन । भूयः कथय तृप्तिर्हि शृण्वतो नास्ति मेऽमृतम् ॥ १०-१८ ॥
    slp1: |-
      vistareRAtmano yogaM viBUtiM ca janArdana . BUyaH kaTaya tfptirhi SfRvato nAsti me'mftam .. 10-18 ..
    iast: |-
      vistareṇātmano yogaṃ vibhūtiṃ ca janārdana | bhūyaḥ kathaya tṛptirhi śṛṇvato nāsti me'mṛtam || 10-18 ||
  - verse: 19
    devanagari: |-
      श्रीभगवानुवाच
      हन्त ते कथयिष्यामि विभूतिरात्मानः शुभाः । प्राधान्यतः कुरुश्रेष्ठ नास्त्यन्तो विस्तरस्य मे ॥ १०-१९ ॥
    slp1: |-
      SrIBagavAnuvAca
      hanta te kaTayizyAmi viBUtirAtmAnaH SuBAH . prADAnyataH kuruSrezWa nAstyanto vistarasya me .. 10-19 ..
    iast: |-
      śrībhagavānuvāca
      hanta te kathayiṣyāmi vibhūtirātmānaḥ śubhāḥ | prādhānyataḥ kuruśreṣṭha nāstyanto vistarasya me || 10-19 ||
  - verse: 20
    devanagari: |-
      अहमात्मा गुडाकेश सर्वभूताशयस्थितः । अहमादिश्च मध्यं च भूतानामन्त एव च ॥ १०-२० ॥
    slp1: |-
      ahamAtmA guqAkeSa sarvaBUtASayasTitaH . ahamAdiSca maDyaM ca BUtAnAmanta eva ca .. 10-20 ..
    iast: |-
      ahamātmā guḍākeśa sarvabhūtāśayasthitaḥ | ahamādiśca madhyaṃ ca bhūtānāmanta eva ca || 10-20 ||
  - verse: 21
    devanagari: |-
      आदित्यानामहं विष्णुर्ज्योतिषां रविरंशुमान् । मरीचिर्मरुतामस्मि नक्षत्राणामहं शशी ॥ १०-२१ ॥
    slp1: |-
      AdityAnAmahaM vizRurjyotizAM raviraMSumAn . marIcirmarutAmasmi nakzatrARAmahaM SaSI .. 10-21 ..
    iast: |-
      ādityānāmahaṃ viṣṇurjyotiṣāṃ raviraṃśumān | marīcirmarutāmasmi nakṣatrāṇāmahaṃ śaśī || 10-21 ||
  - verse: 22
    devanagari: |-
      वेदानां सामवेदोऽहं देवानामस्मि वासवः । इन्द्रियाणां मनश्चास्मि भूतानामस्मि चेतना ॥ १०-२२ ॥
    slp1: |-
      vedAnAM sAmavedo'haM devAnAmasmi vAsavaH . indriyARAM manaScAsmi BUtAnAmasmi cetanA .. 10-22 ..
    iast: |-
      vedānāṃ sāmavedo'haṃ devānāmasmi vāsavaḥ | indriyāṇāṃ manaścāsmi bhūtānāmasmi cetanā || 10-22 ||
  - verse: 23
    devanagari: |-
      रुद्राणां शङ्करश्चास्मि वित्तेशो यक्षरक्षसाम् । वसूनां पावकश्चास्मि मेरुः शिखरिणामहम् ॥ १०-२३ ॥
    slp1: |-
      rudrARAM SaNkaraScAsmi vitteSo yakzarakzasAm . vasUnAM pAvakaScAsmi meruH SiKariRAmaham .. 10-23 ..
    iast: |-
      rudrāṇāṃ śaṅkaraścāsmi vitteśo yakṣarakṣasām | vasūnāṃ pāvakaścāsmi meruḥ śikhariṇāmaham || 10-23 ||
  - verse: 24
    devanagari: |-
      पुरोधसां च मुख्यं विद्धि पार्थ ! बृहस्पतिम् । सेनान्यामप्यहं स्कन्दः सरसामस्मि सागरः ॥ १०-२४ ॥
    slp1: |-
      puroDasAM ca muKyaM vidDi pArTa ! bfhaspatim . senAnyAmapyahaM skandaH sarasAmasmi sAgaraH .. 10-24 ..
    iast: |-
      purodhasāṃ ca mukhyaṃ viddhi pārtha ! bṛhaspatim | senānyāmapyahaṃ skandaḥ sarasāmasmi sāgaraḥ || 10-24 ||
  - verse: 25
    devanagari: |-
      महर्षीणां भृगुरहं गिरामप्येकमक्षरम् । यज्ञानां जपयज्ञोऽस्मि स्थावराणां हिमालयः ॥ १०-२५ ॥
    slp1: |-
      maharzIRAM BfgurahaM girAmapyekamakzaram . yajYAnAM japayajYo'smi sTAvarARAM himAlayaH .. 10-25 ..
    iast: |-
      maharṣīṇāṃ bhṛgurahaṃ girāmapyekamakṣaram | yajñānāṃ japayajño'smi sthāvarāṇāṃ himālayaḥ || 10-25 ||
  - verse: 26
    devanagari: |-
      अश्वत्थः सर्ववृक्षाणां देवर्षीणां च नारदः । गन्धर्वाणां चित्ररथः सिद्धानां कपिलो मुनिः ॥ १०-२६ ॥
    slp1: |-
      aSvatTaH sarvavfkzARAM devarzIRAM ca nAradaH . ganDarvARAM citraraTaH sidDAnAM kapilo muniH .. 10-26 ..
    iast: |-
      aśvatthaḥ sarvavṛkṣāṇāṃ devarṣīṇāṃ ca nāradaḥ | gandharvāṇāṃ citrarathaḥ siddhānāṃ kapilo muniḥ || 10-26 ||
  - verse: 27
    devanagari: |-
      उच्चैः श्रवसमश्वानां विद्धि माममृतोद्भवम् । ऐरावतं गजेन्द्राणां नराणां च नराधिपम् ॥ १०-२७ ॥
    slp1: |-
      uccEH SravasamaSvAnAM vidDi mAmamftodBavam . ErAvataM gajendrARAM narARAM ca narADipam .. 10-27 ..
    iast: |-
      uccaiḥ śravasamaśvānāṃ viddhi māmamṛtodbhavam | airāvataṃ gajendrāṇāṃ narāṇāṃ ca narādhipam || 10-27 ||
  - verse: 28
    devanagari: |-
      आयुधानामहं वज्रं धेनूनामस्मि कामधुक् । प्रजनश्चास्मि कन्दर्पः सर्पाणामस्मि वासुकिः ॥ १०-२८ ॥
    slp1: |-
      AyuDAnAmahaM vajraM DenUnAmasmi kAmaDuk . prajanaScAsmi kandarpaH sarpARAmasmi vAsukiH .. 10-28 ..
    iast: |-
      āyudhānāmahaṃ vajraṃ dhenūnāmasmi kāmadhuk | prajanaścāsmi kandarpaḥ sarpāṇāmasmi vāsukiḥ || 10-28 ||
  - verse: 29
    devanagari: |-
      अनन्तश्चास्मि नागानां वरुणो यादसामहम् । पितृणामर्यमा चास्मि यमः संयमतामहम् ॥ १०-२९ ॥
    slp1: |-
      anantaScAsmi nAgAnAM varuRo yAdasAmaham . pitfRAmaryamA cAsmi yamaH saMyamatAmaham .. 10-29 ..
    iast: |-
      anantaścāsmi nāgānāṃ varuṇo yādasāmaham | pitṛṇāmaryamā cāsmi yamaḥ saṃyamatāmaham || 10-29 ||
  - verse: 30
    devanagari: |-
      प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम् । मृगाणां च मृगेन्द्रोऽहं वैनतेयश्च पक्षिणाम् ॥ १०-३० ॥
    slp1: |-
      prahlAdaScAsmi dEtyAnAM kAlaH kalayatAmaham . mfgARAM ca mfgendro'haM vEnateyaSca pakziRAm .. 10-30 ..
    iast: |-
      prahlādaścāsmi daityānāṃ kālaḥ kalayatāmaham | mṛgāṇāṃ ca mṛgendro'haṃ vainateyaśca pakṣiṇām || 10-30 ||
  - verse: 31
    devanagari: |-
      पवनः पवतामस्मि रामः शस्त्रभृतामहम् । झषाणां मकरश्चास्मि स्रोतसामस्मि जाह्नवी ॥ १०-३१ ॥
    slp1: |-
      pavanaH pavatAmasmi rAmaH SastraBftAmaham . JazARAM makaraScAsmi srotasAmasmi jAhnavI .. 10-31 ..
    iast: |-
      pavanaḥ pavatāmasmi rāmaḥ śastrabhṛtāmaham | jhaṣāṇāṃ makaraścāsmi srotasāmasmi jāhnavī || 10-31 ||
  - verse: 32
    devanagari: |-
      सर्गाणामादिरन्तश्च मध्यं चैवाहमर्जुन । अध्यात्मविद्या विद्यानां वादः प्रवदतामहम् ॥ १०-३२ ॥
    slp1: |-
      sargARAmAdirantaSca maDyaM cEvAhamarjuna . aDyAtmavidyA vidyAnAM vAdaH pravadatAmaham .. 10-32 ..
    iast: |-
      sargāṇāmādirantaśca madhyaṃ caivāhamarjuna | adhyātmavidyā vidyānāṃ vādaḥ pravadatāmaham || 10-32 ||
  - verse: 33
    devanagari: |-
      अक्षराणामकारोऽस्मि द्वन्द्वः सामासिकस्य च । अहमेवाक्षयः कालो धाताऽहं विश्वतोमुखः ॥ १०-३३ ॥
    slp1: |-
      akzarARAmakAro'smi dvandvaH sAmAsikasya ca . ahamevAkzayaH kAlo DAtA'haM viSvatomuKaH .. 10-33 ..
    iast: |-
      akṣarāṇāmakāro'smi dvandvaḥ sāmāsikasya ca | ahamevākṣayaḥ kālo dhātā'haṃ viśvatomukhaḥ || 10-33 ||
  - verse: 34
    devanagari: |-
      मृत्युः सर्वहरश्चाहमुद्भवश्च भविष्यताम् । कीर्तिः श्रीर्वाक्च नारीणां स्मृतिर्मेधा धृतिः क्षमा ॥ १०-३४ ॥
    slp1: |-
      mftyuH sarvaharaScAhamudBavaSca BavizyatAm . kIrtiH SrIrvAkca nArIRAM smftirmeDA DftiH kzamA .. 10-34 ..
    iast: |-
      mṛtyuḥ sarvaharaścāhamudbhavaśca bhaviṣyatām | kīrtiḥ śrīrvākca nārīṇāṃ smṛtirmedhā dhṛtiḥ kṣamā || 10-34 ||
  - verse: 35
    devanagari: |-
      बृहत्साम तथा साम्नां गायत्री छन्दसामहम् । मासानां मार्गशीर्षोऽहमृतूनां कुसुमाकरः ॥ १०-३५ ॥
    slp1: |-
      bfhatsAma taTA sAmnAM gAyatrI CandasAmaham . mAsAnAM mArgaSIrzo'hamftUnAM kusumAkaraH .. 10-35 ..
    iast: |-
      bṛhatsāma tathā sāmnāṃ gāyatrī chandasāmaham | māsānāṃ mārgaśīrṣo'hamṛtūnāṃ kusumākaraḥ || 10-35 ||
  - verse: 36
    devanagari: |-
      द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम् । जयोऽस्मि व्यवसायोऽस्मि सत्त्वं सत्त्ववतामहम् ॥ १०-३६ ॥
    slp1: |-
      dyUtaM CalayatAmasmi tejastejasvinAmaham . jayo'smi vyavasAyo'smi sattvaM sattvavatAmaham .. 10-36 ..
    iast: |-
      dyūtaṃ chalayatāmasmi tejastejasvināmaham | jayo'smi vyavasāyo'smi sattvaṃ sattvavatāmaham || 10-36 ||
  - verse: 37
    devanagari: |-
      वृष्णीनां वासुदेवोऽस्मि पाण्डवानां धनञ्जयः । मुनीनामप्यहं व्यासः कवीनामुशना कविः ॥ १०-३७ ॥
    slp1: |-
      vfzRInAM vAsudevo'smi pARqavAnAM DanaYjayaH . munInAmapyahaM vyAsaH kavInAmuSanA kaviH .. 10-37 ..
    iast: |-
      vṛṣṇīnāṃ vāsudevo'smi pāṇḍavānāṃ dhanañjayaḥ | munīnāmapyahaṃ vyāsaḥ kavīnāmuśanā kaviḥ || 10-37 ||
  - verse: 38
    devanagari: |-
      दण्डो दमयतामस्मि नीतिरस्मि जिगीषताम् । मौनं चैवास्मि गुह्यानां ज्ञानं ज्ञानवतामहम् ॥ १०-३८ ॥
    slp1: |-
      daRqo damayatAmasmi nItirasmi jigIzatAm . mOnaM cEvAsmi guhyAnAM jYAnaM jYAnavatAmaham .. 10-38 ..
    iast: |-
      daṇḍo damayatāmasmi nītirasmi jigīṣatām | maunaṃ caivāsmi guhyānāṃ jñānaṃ jñānavatāmaham || 10-38 ||
  - verse: 39
    devanagari: |-
      यच्चापि सर्वभूतानां बीजं तदहमर्जुन । न तदस्ति विना यत्स्यान्मया भूतं चराचरम् ॥ १०-३९ ॥
    slp1: |-
      yaccApi sarvaBUtAnAM bIjaM tadahamarjuna . na tadasti vinA yatsyAnmayA BUtaM carAcaram .. 10-39 ..
    iast: |-
      yaccāpi sarvabhūtānāṃ bījaṃ tadahamarjuna | na tadasti vinā yatsyānmayā bhūtaṃ carācaram || 10-39 ||
  - verse: 40
    devanagari: |-
      नान्तोऽस्ति मम दिव्यानां विभूतीनां परन्तप । एष तूद्देशतः प्रोक्तो विभूतेर्विस्तरो मया ॥ १०-४० ॥
    slp1: |-
      nAnto'sti mama divyAnAM viBUtInAM parantapa . eza tUddeSataH prokto viBUtervistaro mayA .. 10-40 ..
    iast: |-
      nānto'sti mama divyānāṃ vibhūtīnāṃ parantapa | eṣa tūddeśataḥ prokto vibhūtervistaro mayā || 10-40 ||
  - verse: 41
    devanagari: |-
      यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा । तत्तदेवावगच्छ त्वं मम तेज्ॐशसम्भवम् ॥ १०-४१ ॥
    slp1: |-
      yadyadviBUtimatsattvaM SrImadUrjitameva vA . tattadevAvagacCa tvaM mama tejAUMSasamBavam .. 10-41 ..
    iast: |-
      yadyadvibhūtimatsattvaṃ śrīmadūrjitameva vā | tattadevāvagaccha tvaṃ mama tejoṃśasambhavam || 10-41 ||
  - verse: 42
    devanagari: |-
      अथवा बहुनैतेन किं ज्ञानेन तवार्जुन ! विष्टभ्याहमिदं कृत्स्नमेकांशेन जगत्स्थितः ॥ १०-४२ ॥
      इति । प्रजानां सृष्टिहेतुः सर्वमिदं भगवत्तत्त्वमेव तैस्तैर्विचित्रै रूपैर्भाव्यमानं सकलस्य विषयतां यातीति शिवम् ॥ ४२ ॥
    slp1: |-
      aTavA bahunEtena kiM jYAnena tavArjuna ! vizwaByAhamidaM kftsnamekAMSena jagatsTitaH .. 10-42 ..
      iti . prajAnAM sfzwihetuH sarvamidaM Bagavattattvameva tEstErvicitrE rUpErBAvyamAnaM sakalasya vizayatAM yAtIti Sivam .. 42 ..
    iast: |-
      athavā bahunaitena kiṃ jñānena tavārjuna ! viṣṭabhyāhamidaṃ kṛtsnamekāṃśena jagatsthitaḥ || 10-42 ||
      iti | prajānāṃ sṛṣṭihetuḥ sarvamidaṃ bhagavattattvameva taistairvicitrai rūpairbhāvyamānaṃ sakalasya viṣayatāṃ yātīti śivam || 42 ||
  - verse: 1000
    devanagari: |-
      इच्छायामिन्द्रिये वापि यदेवायाति गोचरम् । हठाद्विलापयंस्तत्तत्प्रशान्तं ब्रह्म भावयेत् ॥ १० ॥
    slp1: |-
      icCAyAmindriye vApi yadevAyAti gocaram . haWAdvilApayaMstattatpraSAntaM brahma BAvayet .. 10 ..
    iast: |-
      icchāyāmindriye vāpi yadevāyāti gocaram | haṭhādvilāpayaṃstattatpraśāntaṃ brahma bhāvayet || 10 ||
- chapter: 11
  title_sa: एकादशोऽध्यायः
  title_iast: "ekādaśo'dhyāyaḥ"
  title_en: "Eleventh Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      समनन्तरेणाध्यायेन य एवार्थ उक्तस्तमेव प्रत्यक्षीकर्तुमर्जुनः पृच्छति । यो ह्युपदेशक्रमेणार्थोऽवगतः स एव प्रत्यक्षसंविदोपारुह्यमाणः स्फुटीभवति । तदर्थमेवेमे उक्तिप्रत्युक्ती उच्येते
      अर्जुन उवाच
      मदनुग्रहाय परमं गुह्यमध्यात्मसंज्ञितम् । यत्त्वयोक्तं वचस्तेन मोहोऽयं विगतो मम ॥ ११-१ ॥
    slp1: |-
      samanantareRADyAyena ya evArTa uktastameva pratyakzIkartumarjunaH pfcCati . yo hyupadeSakrameRArTo'vagataH sa eva pratyakzasaMvidopAruhyamARaH sPuwIBavati . tadarTameveme uktipratyuktI ucyete
      arjuna uvAca
      madanugrahAya paramaM guhyamaDyAtmasaMjYitam . yattvayoktaM vacastena moho'yaM vigato mama .. 11-1 ..
    iast: |-
      samanantareṇādhyāyena ya evārtha uktastameva pratyakṣīkartumarjunaḥ pṛcchati | yo hyupadeśakrameṇārtho'vagataḥ sa eva pratyakṣasaṃvidopāruhyamāṇaḥ sphuṭībhavati | tadarthameveme uktipratyuktī ucyete
      arjuna uvāca
      madanugrahāya paramaṃ guhyamadhyātmasaṃjñitam | yattvayoktaṃ vacastena moho'yaṃ vigato mama || 11-1 ||
  - verse: 2
    devanagari: |-
      भवाप्ययौ हि भूतानां श्रुतौ विस्तरशो मया । त्वत्तः कमलपत्राक्ष माहात्म्यमपि चाव्ययम् ॥ ११-२ ॥
    slp1: |-
      BavApyayO hi BUtAnAM SrutO vistaraSo mayA . tvattaH kamalapatrAkza mAhAtmyamapi cAvyayam .. 11-2 ..
    iast: |-
      bhavāpyayau hi bhūtānāṃ śrutau vistaraśo mayā | tvattaḥ kamalapatrākṣa māhātmyamapi cāvyayam || 11-2 ||
  - verse: 3
    devanagari: |-
      एवमेतद्यथात्थ त्वमात्मानं परमेश्वरम् । द्रष्टुमिच्छाम्यहं रूपमैश्वरं पुरुषोत्तम ॥ ११-३ ॥
    slp1: |-
      evametadyaTAtTa tvamAtmAnaM parameSvaram . drazwumicCAmyahaM rUpamESvaraM puruzottama .. 11-3 ..
    iast: |-
      evametadyathāttha tvamātmānaṃ parameśvaram | draṣṭumicchāmyahaṃ rūpamaiśvaraṃ puruṣottama || 11-3 ||
  - verse: 4
    devanagari: |-
      मन्यसे यदि तच्छक्यं मया द्रष्टुमिति प्रभो । योगीश्वर ततो मे त्वं दर्शयात्मानमव्ययम् ॥ ११-४ ॥
    slp1: |-
      manyase yadi tacCakyaM mayA drazwumiti praBo . yogISvara tato me tvaM darSayAtmAnamavyayam .. 11-4 ..
    iast: |-
      manyase yadi tacchakyaṃ mayā draṣṭumiti prabho | yogīśvara tato me tvaṃ darśayātmānamavyayam || 11-4 ||
  - verse: 5
    devanagari: |-
      श्रीभगवानुवाच
      पश्य मे पार्थ रूपाणि शतशोऽथ सहस्रशः । नानाविधानि दिव्यानि नानावर्णाकृतीनि च ॥ ११-५ ॥
    slp1: |-
      SrIBagavAnuvAca
      paSya me pArTa rUpARi SataSo'Ta sahasraSaH . nAnAviDAni divyAni nAnAvarRAkftIni ca .. 11-5 ..
    iast: |-
      śrībhagavānuvāca
      paśya me pārtha rūpāṇi śataśo'tha sahasraśaḥ | nānāvidhāni divyāni nānāvarṇākṛtīni ca || 11-5 ||
  - verse: 6
    devanagari: |-
      पश्यादित्यान्वसून्रुद्रानश्विनौ मरुतस्तथा । बहून्यदृष्टपूर्वाणि पश्याश्चर्याणि पाण्डव ॥ ११-६ ॥
    slp1: |-
      paSyAdityAnvasUnrudrAnaSvinO marutastaTA . bahUnyadfzwapUrvARi paSyAScaryARi pARqava .. 11-6 ..
    iast: |-
      paśyādityānvasūnrudrānaśvinau marutastathā | bahūnyadṛṣṭapūrvāṇi paśyāścaryāṇi pāṇḍava || 11-6 ||
  - verse: 7
    devanagari: |-
      इहैकस्थं जगत्कृत्स्नं पश्याद्य सचराचरम् । मम देहे गुडाकेश यच्चान्यद् द्रष्टुमिच्छसि ॥ ११-७ ॥
    slp1: |-
      ihEkasTaM jagatkftsnaM paSyAdya sacarAcaram . mama dehe guqAkeSa yaccAnyad drazwumicCasi .. 11-7 ..
    iast: |-
      ihaikasthaṃ jagatkṛtsnaṃ paśyādya sacarācaram | mama dehe guḍākeśa yaccānyad draṣṭumicchasi || 11-7 ||
  - verse: 8
    devanagari: |-
      नतु मां शक्यसे द्रष्टुमनेनैव स्वचक्षुषा । दिव्यं ददामि ते चक्षुः पश्य मे रूपमैश्वरम् ॥ ११-८ ॥
    slp1: |-
      natu mAM Sakyase drazwumanenEva svacakzuzA . divyaM dadAmi te cakzuH paSya me rUpamESvaram .. 11-8 ..
    iast: |-
      natu māṃ śakyase draṣṭumanenaiva svacakṣuṣā | divyaṃ dadāmi te cakṣuḥ paśya me rūpamaiśvaram || 11-8 ||
  - verse: 9
    devanagari: |-
      संजय उवाच
      एवमुक्त्वा ततो राजन् महायोगीश्वरो हरिः । दर्शयामास पार्थाय परमं रूपमैश्वरम् ॥ ११-९ ॥
    slp1: |-
      saMjaya uvAca
      evamuktvA tato rAjan mahAyogISvaro hariH . darSayAmAsa pArTAya paramaM rUpamESvaram .. 11-9 ..
    iast: |-
      saṃjaya uvāca
      evamuktvā tato rājan mahāyogīśvaro hariḥ | darśayāmāsa pārthāya paramaṃ rūpamaiśvaram || 11-9 ||
  - verse: 10
    devanagari: |-
      अनेकवक्त्रनयनमनेकाद्भुतदर्शनम् । अनेकदिव्याभरणं दिव्यानेकोद्यतायुधम् ॥ ११-१० ॥
    slp1: |-
      anekavaktranayanamanekAdButadarSanam . anekadivyABaraRaM divyAnekodyatAyuDam .. 11-10 ..
    iast: |-
      anekavaktranayanamanekādbhutadarśanam | anekadivyābharaṇaṃ divyānekodyatāyudham || 11-10 ||
  - verse: 11
    devanagari: |-
      दिव्यमाल्याम्बरधरं दिव्यगन्धानुलेपनम् । सर्वाश्चर्यमयं देवमनन्तं विश्वतोमुखम् ॥ ११-११ ॥
    slp1: |-
      divyamAlyAmbaraDaraM divyaganDAnulepanam . sarvAScaryamayaM devamanantaM viSvatomuKam .. 11-11 ..
    iast: |-
      divyamālyāmbaradharaṃ divyagandhānulepanam | sarvāścaryamayaṃ devamanantaṃ viśvatomukham || 11-11 ||
  - verse: 12
    devanagari: |-
      दिवि सूर्यसहस्रस्य भवेद्युगपदुत्थिता । यदि भाः सदृशी सा स्याद्भासस्तस्य महात्मनः ॥ ११-१२ ॥
    slp1: |-
      divi sUryasahasrasya BavedyugapadutTitA . yadi BAH sadfSI sA syAdBAsastasya mahAtmanaH .. 11-12 ..
    iast: |-
      divi sūryasahasrasya bhavedyugapadutthitā | yadi bhāḥ sadṛśī sā syādbhāsastasya mahātmanaḥ || 11-12 ||
  - verse: 13
    devanagari: |-
      तत्रैकस्थं जगत्कृत्स्नं प्रविभक्तमनेकधा । अपश्यद्देवदेवस्य शरीरे पाण्डवस्तदा ॥ ११-१३ ॥
    slp1: |-
      tatrEkasTaM jagatkftsnaM praviBaktamanekaDA . apaSyaddevadevasya SarIre pARqavastadA .. 11-13 ..
    iast: |-
      tatraikasthaṃ jagatkṛtsnaṃ pravibhaktamanekadhā | apaśyaddevadevasya śarīre pāṇḍavastadā || 11-13 ||
  - verse: 14
    devanagari: |-
      ततः स विस्मयाविष्टो हृष्टरोमा धनञ्जयः । प्रणम्य शिरसा देवं कृताञ्जलिरभाषत ॥ ११-१४ ॥
    slp1: |-
      tataH sa vismayAvizwo hfzwaromA DanaYjayaH . praRamya SirasA devaM kftAYjaliraBAzata .. 11-14 ..
    iast: |-
      tataḥ sa vismayāviṣṭo hṛṣṭaromā dhanañjayaḥ | praṇamya śirasā devaṃ kṛtāñjalirabhāṣata || 11-14 ||
  - verse: 15
    devanagari: |-
      अर्जुन उवाच
      पश्यामि देवांस्तव देव देहे सर्वांस्तथा भूतविशेषसङ्घान् । ब्रह्माणमीशं कमलासनस्थ मृषींश्च सर्वानुरगांश्च दिव्यान् ॥ ११-१५ ॥
    slp1: |-
      arjuna uvAca
      paSyAmi devAMstava deva dehe sarvAMstaTA BUtaviSezasaNGAn . brahmARamISaM kamalAsanasTa mfzIMSca sarvAnuragAMSca divyAn .. 11-15 ..
    iast: |-
      arjuna uvāca
      paśyāmi devāṃstava deva dehe sarvāṃstathā bhūtaviśeṣasaṅghān | brahmāṇamīśaṃ kamalāsanastha mṛṣīṃśca sarvānuragāṃśca divyān || 11-15 ||
  - verse: 16
    devanagari: |-
      अनेकबाहूदरवक्त्रनेत्रं पश्यामि त्वां सर्वतोऽनन्तरूपम् । नान्तं न मध्यं न पुनस्तवादिं पश्यामि विश्वेश्वर विश्वरूप ! ॥ ११-१६ ॥
    slp1: |-
      anekabAhUdaravaktranetraM paSyAmi tvAM sarvato'nantarUpam . nAntaM na maDyaM na punastavAdiM paSyAmi viSveSvara viSvarUpa ! .. 11-16 ..
    iast: |-
      anekabāhūdaravaktranetraṃ paśyāmi tvāṃ sarvato'nantarūpam | nāntaṃ na madhyaṃ na punastavādiṃ paśyāmi viśveśvara viśvarūpa ! || 11-16 ||
  - verse: 17
    devanagari: |-
      किरीटिनं गदिनं चक्रिणं च तेजोराशिं सर्वतो दीप्तिमन्तम् । पश्यामि त्वां दुर्निरीक्षं समन्ता द्दीप्तानलार्कद्युतिमप्रमेयम् ॥ ११-१७ ॥
    slp1: |-
      kirIwinaM gadinaM cakriRaM ca tejorASiM sarvato dIptimantam . paSyAmi tvAM durnirIkzaM samantA ddIptAnalArkadyutimaprameyam .. 11-17 ..
    iast: |-
      kirīṭinaṃ gadinaṃ cakriṇaṃ ca tejorāśiṃ sarvato dīptimantam | paśyāmi tvāṃ durnirīkṣaṃ samantā ddīptānalārkadyutimaprameyam || 11-17 ||
  - verse: 18
    devanagari: |-
      त्वमक्षरं परमं वेदितव्यं त्वमस्य विश्वस्य परं निधानम् । त्वमव्ययः सात्त्वतधर्मगोप्ता सनातनस्त्वं पुरुषो मतो मे ॥ ११-१८ ॥
      सात्त्वतधर्मगोप्तेति सत्-सत्यं-क्रियाज्ञानयोरुभयोरपि भेदाप्रतिभासात्मकं तथा सत्तात्मकं प्रकाशरूपं तत्त्वं विद्यते येषां ते-सात्त्वताः । तेषां धर्मः-अनवरतग्रहणसंन्यासपरत्वात्सृष्टिसंहारविषयः सकलमार्गोत्तीर्णः तं गोपायते । एतदेवात्राध्याये रहस्यं प्रायशो देवीस्तोत्रविवृत्तौ मया प्रकाशितम् । तत्सहृदयैः सोपदेशैः स्वयमेवावगम्यते इति किं पुनः पुनः स्फुटतरप्रकाशनवाचालतया ॥ १८ ॥
    slp1: |-
      tvamakzaraM paramaM veditavyaM tvamasya viSvasya paraM niDAnam . tvamavyayaH sAttvataDarmagoptA sanAtanastvaM puruzo mato me .. 11-18 ..
      sAttvataDarmagopteti sat-satyaM-kriyAjYAnayoruBayorapi BedApratiBAsAtmakaM taTA sattAtmakaM prakASarUpaM tattvaM vidyate yezAM te-sAttvatAH . tezAM DarmaH-anavaratagrahaRasaMnyAsaparatvAtsfzwisaMhAravizayaH sakalamArgottIrRaH taM gopAyate . etadevAtrADyAye rahasyaM prAyaSo devIstotravivfttO mayA prakASitam . tatsahfdayEH sopadeSEH svayamevAvagamyate iti kiM punaH punaH sPuwataraprakASanavAcAlatayA .. 18 ..
    iast: |-
      tvamakṣaraṃ paramaṃ veditavyaṃ tvamasya viśvasya paraṃ nidhānam | tvamavyayaḥ sāttvatadharmagoptā sanātanastvaṃ puruṣo mato me || 11-18 ||
      sāttvatadharmagopteti sat-satyaṃ-kriyājñānayorubhayorapi bhedāpratibhāsātmakaṃ tathā sattātmakaṃ prakāśarūpaṃ tattvaṃ vidyate yeṣāṃ te-sāttvatāḥ | teṣāṃ dharmaḥ-anavaratagrahaṇasaṃnyāsaparatvātsṛṣṭisaṃhāraviṣayaḥ sakalamārgottīrṇaḥ taṃ gopāyate | etadevātrādhyāye rahasyaṃ prāyaśo devīstotravivṛttau mayā prakāśitam | tatsahṛdayaiḥ sopadeśaiḥ svayamevāvagamyate iti kiṃ punaḥ punaḥ sphuṭataraprakāśanavācālatayā || 18 ||
  - verse: 19
    devanagari: |-
      अनादिमध्यान्तमनन्तवीर्य- मनन्तबाहुं शशिसूर्यनेत्रम् । पश्यामि त्वा दीप्तहुताशवक्त्रं स्वतेजसा विश्वमिदं तपन्तम् ॥ ११-१९ ॥
    slp1: |-
      anAdimaDyAntamanantavIrya- manantabAhuM SaSisUryanetram . paSyAmi tvA dIptahutASavaktraM svatejasA viSvamidaM tapantam .. 11-19 ..
    iast: |-
      anādimadhyāntamanantavīrya- manantabāhuṃ śaśisūryanetram | paśyāmi tvā dīptahutāśavaktraṃ svatejasā viśvamidaṃ tapantam || 11-19 ||
  - verse: 20
    devanagari: |-
      द्यावापृथिव्योरिदमन्तरं हि व्याप्तं त्वयैकेन दिशश्च सर्वाः । दृष्ट्वाद्भुतं रूपमुग्रं तवेदृ ग्लोकत्रयं प्रव्यथितं महात्मन् ॥ ११-२० ॥
    slp1: |-
      dyAvApfTivyoridamantaraM hi vyAptaM tvayEkena diSaSca sarvAH . dfzwvAdButaM rUpamugraM tavedf glokatrayaM pravyaTitaM mahAtman .. 11-20 ..
    iast: |-
      dyāvāpṛthivyoridamantaraṃ hi vyāptaṃ tvayaikena diśaśca sarvāḥ | dṛṣṭvādbhutaṃ rūpamugraṃ tavedṛ glokatrayaṃ pravyathitaṃ mahātman || 11-20 ||
  - verse: 21
    devanagari: |-
      अमी हि त्वा सुरसङ्घा विशन्ति केचिद्भीताः प्राञ्जलयो गृणन्ति । स्वस्तीति चोत्तचैव महर्षिसङ्घाः स्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः ॥ ११-२१ ॥
    slp1: |-
      amI hi tvA surasaNGA viSanti kecidBItAH prAYjalayo gfRanti . svastIti cottacEva maharzisaNGAH stuvanti tvAM stutiBiH puzkalABiH .. 11-21 ..
    iast: |-
      amī hi tvā surasaṅghā viśanti kecidbhītāḥ prāñjalayo gṛṇanti | svastīti cottacaiva maharṣisaṅghāḥ stuvanti tvāṃ stutibhiḥ puṣkalābhiḥ || 11-21 ||
  - verse: 22
    devanagari: |-
      रुद्रादित्या वसवो ये च साध्या विश्वेऽश्विनौ मरुतश्चोष्मपाश्च । गन्धर्वयक्षासुरसिद्धसङ्घा वीक्षन्ते त्वां विस्मिताश्चैव सर्वे ॥ ११-२२ ॥
    slp1: |-
      rudrAdityA vasavo ye ca sADyA viSve'SvinO marutaScozmapASca . ganDarvayakzAsurasidDasaNGA vIkzante tvAM vismitAScEva sarve .. 11-22 ..
    iast: |-
      rudrādityā vasavo ye ca sādhyā viśve'śvinau marutaścoṣmapāśca | gandharvayakṣāsurasiddhasaṅghā vīkṣante tvāṃ vismitāścaiva sarve || 11-22 ||
  - verse: 23
    devanagari: |-
      रूपं महत्ते बहुवक्त्रनेत्रं महाबाहो बहुबाहूरुपादम् । बहूदरं बहुदंष्ट्राकरालं दृष्ट्वा लोकाः प्रव्यथितास्तथाऽहम् ॥ ११-२३ ॥
    slp1: |-
      rUpaM mahatte bahuvaktranetraM mahAbAho bahubAhUrupAdam . bahUdaraM bahudaMzwrAkarAlaM dfzwvA lokAH pravyaTitAstaTA'ham .. 11-23 ..
    iast: |-
      rūpaṃ mahatte bahuvaktranetraṃ mahābāho bahubāhūrupādam | bahūdaraṃ bahudaṃṣṭrākarālaṃ dṛṣṭvā lokāḥ pravyathitāstathā'ham || 11-23 ||
  - verse: 24
    devanagari: |-
      नभःस्पृशं दीप्तमनेकवर्णं व्यात्ताननं दीप्तविशालनेत्रम् । दृष्ट्वा हि त्वां प्रव्यथितान्तरात्मा धृतिं न विन्दामि शमं च विष्णो ॥ ११-२४ ॥
    slp1: |-
      naBaHspfSaM dIptamanekavarRaM vyAttAnanaM dIptaviSAlanetram . dfzwvA hi tvAM pravyaTitAntarAtmA DftiM na vindAmi SamaM ca vizRo .. 11-24 ..
    iast: |-
      nabhaḥspṛśaṃ dīptamanekavarṇaṃ vyāttānanaṃ dīptaviśālanetram | dṛṣṭvā hi tvāṃ pravyathitāntarātmā dhṛtiṃ na vindāmi śamaṃ ca viṣṇo || 11-24 ||
  - verse: 25
    devanagari: |-
      दंष्ट्राकरालानि च ते मुखानि दृष्ट्वैव कालानलसन्निभानि । दिशो न जाने न लभे च शर्म प्रसीद देवेश जगन्निवास ॥ ११-२५ ॥
    slp1: |-
      daMzwrAkarAlAni ca te muKAni dfzwvEva kAlAnalasanniBAni . diSo na jAne na laBe ca Sarma prasIda deveSa jagannivAsa .. 11-25 ..
    iast: |-
      daṃṣṭrākarālāni ca te mukhāni dṛṣṭvaiva kālānalasannibhāni | diśo na jāne na labhe ca śarma prasīda deveśa jagannivāsa || 11-25 ||
  - verse: 26
    devanagari: |-
      अमी सर्वे धृतराष्ट्रस्य पुत्राः सर्वे सहैवावनिपालसङ्घैः । भीष्मो द्रोणः सूतपुत्रस्तथासौ सहास्मदीयैरपि योधमुख्यैः ॥ ११-२६ ॥
    slp1: |-
      amI sarve DftarAzwrasya putrAH sarve sahEvAvanipAlasaNGEH . BIzmo droRaH sUtaputrastaTAsO sahAsmadIyErapi yoDamuKyEH .. 11-26 ..
    iast: |-
      amī sarve dhṛtarāṣṭrasya putrāḥ sarve sahaivāvanipālasaṅghaiḥ | bhīṣmo droṇaḥ sūtaputrastathāsau sahāsmadīyairapi yodhamukhyaiḥ || 11-26 ||
  - verse: 27
    devanagari: |-
      वक्त्राणि ते त्वरमाणा विशन्ति दंष्ट्राकरालानि भयानकानि । केचिद्विलग्ना दशनान्तरेषु सन्दृश्यन्ते चूर्णितैरुत्तमाङ्गैः ॥ ११-२७ ॥
    slp1: |-
      vaktrARi te tvaramARA viSanti daMzwrAkarAlAni BayAnakAni . kecidvilagnA daSanAntarezu sandfSyante cUrRitEruttamANgEH .. 11-27 ..
    iast: |-
      vaktrāṇi te tvaramāṇā viśanti daṃṣṭrākarālāni bhayānakāni | kecidvilagnā daśanāntareṣu sandṛśyante cūrṇitairuttamāṅgaiḥ || 11-27 ||
  - verse: 28
    devanagari: |-
      नानारूपैः पुरुषैर्बाध्यमाना विशन्ति ते वक्त्रमचिन्त्यरूपम् । यौधिष्ठिरा धार्तराष्ट्राश्च योधाः शस्त्रैः कृत्ता विविधैः सर्व एव ॥ ११-२८ ॥
    slp1: |-
      nAnArUpEH puruzErbADyamAnA viSanti te vaktramacintyarUpam . yODizWirA DArtarAzwrASca yoDAH SastrEH kfttA viviDEH sarva eva .. 11-28 ..
    iast: |-
      nānārūpaiḥ puruṣairbādhyamānā viśanti te vaktramacintyarūpam | yaudhiṣṭhirā dhārtarāṣṭrāśca yodhāḥ śastraiḥ kṛttā vividhaiḥ sarva eva || 11-28 ||
  - verse: 29
    devanagari: |-
      त्वत्तेजसा निहता नूनमेते तथाहीमे त्वच्छरीरे प्रविष्टाः । यथा नदीनां बहवोऽम्बुवेगाः समुद्रमेवाभिमुखा वज्रन्ति ॥ ११-२९ ॥
    slp1: |-
      tvattejasA nihatA nUnamete taTAhIme tvacCarIre pravizwAH . yaTA nadInAM bahavo'mbuvegAH samudramevABimuKA vajranti .. 11-29 ..
    iast: |-
      tvattejasā nihatā nūnamete tathāhīme tvaccharīre praviṣṭāḥ | yathā nadīnāṃ bahavo'mbuvegāḥ samudramevābhimukhā vajranti || 11-29 ||
  - verse: 30
    devanagari: |-
      तथा तवामी नरलोकवीरा विशन्ति वक्त्राण्यभितो ज्वलन्ति । यथा प्रदीप्तं ज्वलनं पतङ्गा विशन्ति नाशाय समृद्धवेगाः । तथैव नाशाय विशन्ति लोका स्तवापि वक्त्राणि समृद्धवेगाः ॥ ११-३० ॥
    slp1: |-
      taTA tavAmI naralokavIrA viSanti vaktrARyaBito jvalanti . yaTA pradIptaM jvalanaM pataNgA viSanti nASAya samfdDavegAH . taTEva nASAya viSanti lokA stavApi vaktrARi samfdDavegAH .. 11-30 ..
    iast: |-
      tathā tavāmī naralokavīrā viśanti vaktrāṇyabhito jvalanti | yathā pradīptaṃ jvalanaṃ pataṅgā viśanti nāśāya samṛddhavegāḥ | tathaiva nāśāya viśanti lokā stavāpi vaktrāṇi samṛddhavegāḥ || 11-30 ||
  - verse: 31
    devanagari: |-
      लेलिह्यसे ग्रसमानः समन्ता ल्लोकान्समग्रान्वदनैर्ज्वलद्भिः । तेजोभिरापूर्य जगत्समग्रं भास स्तवोग्राः प्रतपन्ति विष्णो ॥ ११-३१ ॥
    slp1: |-
      lelihyase grasamAnaH samantA llokAnsamagrAnvadanErjvaladBiH . tejoBirApUrya jagatsamagraM BAsa stavogrAH pratapanti vizRo .. 11-31 ..
    iast: |-
      lelihyase grasamānaḥ samantā llokānsamagrānvadanairjvaladbhiḥ | tejobhirāpūrya jagatsamagraṃ bhāsa stavogrāḥ pratapanti viṣṇo || 11-31 ||
  - verse: 32
    devanagari: |-
      आख्याहि मे को भवानुग्ररूपो नमोऽस्तु ते देववर प्रसीद । विज्ञातुमिच्छामि भवन्तमाद्यं न हि प्रजानामि तव प्रवृत्तिम् ॥ ११-३२ ॥
      तव प्रवृत्तिं न वेद्मि-केनाशयेनेदृशीयमुग्रतेति ॥ ३२ ॥
    slp1: |-
      AKyAhi me ko BavAnugrarUpo namo'stu te devavara prasIda . vijYAtumicCAmi BavantamAdyaM na hi prajAnAmi tava pravfttim .. 11-32 ..
      tava pravfttiM na vedmi-kenASayenedfSIyamugrateti .. 32 ..
    iast: |-
      ākhyāhi me ko bhavānugrarūpo namo'stu te devavara prasīda | vijñātumicchāmi bhavantamādyaṃ na hi prajānāmi tava pravṛttim || 11-32 ||
      tava pravṛttiṃ na vedmi-kenāśayenedṛśīyamugrateti || 32 ||
  - verse: 33
    devanagari: |-
      श्रीभगवानुवाच
      कालोऽस्मि लोकक्षयकृत्प्रवृद्धो ल्लोकान्समाहर्तुमिह प्रवृत्तः । ऋतेऽपि त्वा न भविष्यन्ति सर्वे येऽवस्थिताः प्रत्यनीकेषु योधाः ॥ ११-३३ ॥
    slp1: |-
      SrIBagavAnuvAca
      kAlo'smi lokakzayakftpravfdDo llokAnsamAhartumiha pravfttaH . fte'pi tvA na Bavizyanti sarve ye'vasTitAH pratyanIkezu yoDAH .. 11-33 ..
    iast: |-
      śrībhagavānuvāca
      kālo'smi lokakṣayakṛtpravṛddho llokānsamāhartumiha pravṛttaḥ | ṛte'pi tvā na bhaviṣyanti sarve ye'vasthitāḥ pratyanīkeṣu yodhāḥ || 11-33 ||
  - verse: 34
    devanagari: |-
      तस्मात्त्वमुत्तिष्ठ यशो लभस्व जित्वा शत्रून्भुङ्क्ष्व राज्यं समृद्धम् । मयैवैते निहताः पूर्वमेव निमित्तमात्रं भव सव्यसाचिन् ॥ ११-३४ ॥
    slp1: |-
      tasmAttvamuttizWa yaSo laBasva jitvA SatrUnBuNkzva rAjyaM samfdDam . mayEvEte nihatAH pUrvameva nimittamAtraM Bava savyasAcin .. 11-34 ..
    iast: |-
      tasmāttvamuttiṣṭha yaśo labhasva jitvā śatrūnbhuṅkṣva rājyaṃ samṛddham | mayaivaite nihatāḥ pūrvameva nimittamātraṃ bhava savyasācin || 11-34 ||
  - verse: 35
    devanagari: |-
      द्रोणं च भीष्मं च जयद्रथं च कर्णं तथान्यानपि लोकवीरान् । मया हतांस्त्वं जहि मा व्यथिष्ठा युध्यस्व जेतासि रणे सपत्नान् ॥ ११-३५ ॥
      तदत्र भगवतोत्तरं जगतो विद्याविद्यात्मनः शुद्धाशुद्धमिश्रसंविद्वलग्रासीकारादभिधीयते-इति प्राशयः सूत्रितमत्राध्याये रहस्यम् उट्टङ्कितमात्रसंवित्तिसमर्थेभ्योऽस्तु । कियत्पंक्तिलेखनायासदौः स्थित्यमालम्भेमहि । अत्र यदुक्तं मया हतेषु त्वं निमित्तं यशस्वी भव इति-भगवता तत्प्रत्युक्तं यदुक्तं प्रागर्जुनेन नैतद्विद्भः कतरन्नोः गरीयः-इत्यादि ॥ ११-३५ ॥
    slp1: |-
      droRaM ca BIzmaM ca jayadraTaM ca karRaM taTAnyAnapi lokavIrAn . mayA hatAMstvaM jahi mA vyaTizWA yuDyasva jetAsi raRe sapatnAn .. 11-35 ..
      tadatra BagavatottaraM jagato vidyAvidyAtmanaH SudDASudDamiSrasaMvidvalagrAsIkArAdaBiDIyate-iti prASayaH sUtritamatrADyAye rahasyam uwwaNkitamAtrasaMvittisamarTeByo'stu . kiyatpaMktileKanAyAsadOH sTityamAlamBemahi . atra yaduktaM mayA hatezu tvaM nimittaM yaSasvI Bava iti-BagavatA tatpratyuktaM yaduktaM prAgarjunena nEtadvidBaH katarannoH garIyaH-ityAdi .. 11-35 ..
    iast: |-
      droṇaṃ ca bhīṣmaṃ ca jayadrathaṃ ca karṇaṃ tathānyānapi lokavīrān | mayā hatāṃstvaṃ jahi mā vyathiṣṭhā yudhyasva jetāsi raṇe sapatnān || 11-35 ||
      tadatra bhagavatottaraṃ jagato vidyāvidyātmanaḥ śuddhāśuddhamiśrasaṃvidvalagrāsīkārādabhidhīyate-iti prāśayaḥ sūtritamatrādhyāye rahasyam uṭṭaṅkitamātrasaṃvittisamarthebhyo'stu | kiyatpaṃktilekhanāyāsadauḥ sthityamālambhemahi | atra yaduktaṃ mayā hateṣu tvaṃ nimittaṃ yaśasvī bhava iti-bhagavatā tatpratyuktaṃ yaduktaṃ prāgarjunena naitadvidbhaḥ katarannoḥ garīyaḥ-ityādi || 11-35 ||
  - verse: 36
    devanagari: |-
      संजय उवाच
      एतच्छ्रुत्वा वचनं केशवस्य कृताञ्जलिर्वेपमानः किरीटी । नमस्कृत्वा भूय एवाह कृष्णं सगद्गदं भीतभीतः प्रणम्य ॥ ११-३६ ॥
    slp1: |-
      saMjaya uvAca
      etacCrutvA vacanaM keSavasya kftAYjalirvepamAnaH kirIwI . namaskftvA BUya evAha kfzRaM sagadgadaM BItaBItaH praRamya .. 11-36 ..
    iast: |-
      saṃjaya uvāca
      etacchrutvā vacanaṃ keśavasya kṛtāñjalirvepamānaḥ kirīṭī | namaskṛtvā bhūya evāha kṛṣṇaṃ sagadgadaṃ bhītabhītaḥ praṇamya || 11-36 ||
  - verse: 37
    devanagari: |-
      अर्जुन उवाच
      स्थाने हृषीकेश तव प्रकीर्त्या जगत्प्रहृष्यत्यनुरज्यते च । रक्षांसि भीतानि दिशो द्रवन्ति सर्वे नमस्यन्ति च सिद्धसङ्घाः ॥ ११-३७ ॥
      प्रकीर्त्या-प्रकीर्तनेन ॥ ३७ ॥
    slp1: |-
      arjuna uvAca
      sTAne hfzIkeSa tava prakIrtyA jagatprahfzyatyanurajyate ca . rakzAMsi BItAni diSo dravanti sarve namasyanti ca sidDasaNGAH .. 11-37 ..
      prakIrtyA-prakIrtanena .. 37 ..
    iast: |-
      arjuna uvāca
      sthāne hṛṣīkeśa tava prakīrtyā jagatprahṛṣyatyanurajyate ca | rakṣāṃsi bhītāni diśo dravanti sarve namasyanti ca siddhasaṅghāḥ || 11-37 ||
      prakīrtyā-prakīrtanena || 37 ||
  - verse: 38
    devanagari: |-
      कस्माच्चैते न नमेयुर्महात्मन् गरीयसे ब्रह्मणोऽप्यादिकर्त्रे । अनन्त देवेश जगन्निवास त्वमक्षरं सदसत्तत्परं यत् ॥ ११-३८ ॥
      सत्-पदार्थत्वेन । असत्-उपलम्भं प्रत्यविषयत्वात् । अथवा अभावोऽपि धियि निजनिजविशिष्टवाचकसंश्लेषितो ज्ञानाकारमश्नुवानो न परब्रह्मसत्ताव्यतिरिक्तः । सदसद्रूपाभ्यां च परम्-तदुभयबुद्धितिरोधाने तद्रूपोपलब्धेः ॥ ३८ ॥
    slp1: |-
      kasmAccEte na nameyurmahAtman garIyase brahmaRo'pyAdikartre . ananta deveSa jagannivAsa tvamakzaraM sadasattatparaM yat .. 11-38 ..
      sat-padArTatvena . asat-upalamBaM pratyavizayatvAt . aTavA aBAvo'pi Diyi nijanijaviSizwavAcakasaMSlezito jYAnAkAramaSnuvAno na parabrahmasattAvyatiriktaH . sadasadrUpAByAM ca param-taduBayabudDitiroDAne tadrUpopalabDeH .. 38 ..
    iast: |-
      kasmāccaite na nameyurmahātman garīyase brahmaṇo'pyādikartre | ananta deveśa jagannivāsa tvamakṣaraṃ sadasattatparaṃ yat || 11-38 ||
      sat-padārthatvena | asat-upalambhaṃ pratyaviṣayatvāt | athavā abhāvo'pi dhiyi nijanijaviśiṣṭavācakasaṃśleṣito jñānākāramaśnuvāno na parabrahmasattāvyatiriktaḥ | sadasadrūpābhyāṃ ca param-tadubhayabuddhitirodhāne tadrūpopalabdheḥ || 38 ||
  - verse: 39
    devanagari: |-
      त्वमादिदेवः पुरुषः पुराण स्त्वमस्य विश्वस्य परं निधानम् । वेत्ताऽसि वेद्यं च परं च धाम त्वया ततं विश्वमनन्तरूपम् ॥ ११-३९ ॥
    slp1: |-
      tvamAdidevaH puruzaH purARa stvamasya viSvasya paraM niDAnam . vettA'si vedyaM ca paraM ca DAma tvayA tataM viSvamanantarUpam .. 11-39 ..
    iast: |-
      tvamādidevaḥ puruṣaḥ purāṇa stvamasya viśvasya paraṃ nidhānam | vettā'si vedyaṃ ca paraṃ ca dhāma tvayā tataṃ viśvamanantarūpam || 11-39 ||
  - verse: 40
    devanagari: |-
      वायुर्यमोऽग्निर्वरुणः शशाङ्कः प्रजापतिस्त्वं प्रपितामहश्च । अनादिमानप्रतिमभावः सर्वेश्वरः सर्वमहाविभूते ॥ ११-४० ॥
    slp1: |-
      vAyuryamo'gnirvaruRaH SaSANkaH prajApatistvaM prapitAmahaSca . anAdimAnapratimaBAvaH sarveSvaraH sarvamahAviBUte .. 11-40 ..
    iast: |-
      vāyuryamo'gnirvaruṇaḥ śaśāṅkaḥ prajāpatistvaṃ prapitāmahaśca | anādimānapratimabhāvaḥ sarveśvaraḥ sarvamahāvibhūte || 11-40 ||
  - verse: 41
    devanagari: |-
      नमो नमस्तेऽस्तु सहस्रकृत्वः पुनश्च भूयोऽपि नमो नमस्ते । नमः पुरस्तादथ पृष्ठतस्ते नमोऽस्तु ते सर्वत एव सर्व ॥ ११-४१ ॥
      नमो नमः-इत्यनेन पौनः पुन्यं भक्त्यतिशयाविष्कारकम् यदेव भगवतातिक्रन्ताध्यायैरभ्यधायि स्वस्वरूपं तदेवार्जुनः प्रत्यक्षोपलम्भविषयापन्नं स्तोत्रद्वारेण प्रकटयतीति तद्व्याख्यानं केवलं पौनरुक्त्यप्रसङ्गायेति विरम्यते ॥ ४१ ॥
    slp1: |-
      namo namaste'stu sahasrakftvaH punaSca BUyo'pi namo namaste . namaH purastAdaTa pfzWataste namo'stu te sarvata eva sarva .. 11-41 ..
      namo namaH-ityanena pOnaH punyaM BaktyatiSayAvizkArakam yadeva BagavatAtikrantADyAyEraByaDAyi svasvarUpaM tadevArjunaH pratyakzopalamBavizayApannaM stotradvAreRa prakawayatIti tadvyAKyAnaM kevalaM pOnaruktyaprasaNgAyeti viramyate .. 41 ..
    iast: |-
      namo namaste'stu sahasrakṛtvaḥ punaśca bhūyo'pi namo namaste | namaḥ purastādatha pṛṣṭhataste namo'stu te sarvata eva sarva || 11-41 ||
      namo namaḥ-ityanena paunaḥ punyaṃ bhaktyatiśayāviṣkārakam yadeva bhagavatātikrantādhyāyairabhyadhāyi svasvarūpaṃ tadevārjunaḥ pratyakṣopalambhaviṣayāpannaṃ stotradvāreṇa prakaṭayatīti tadvyākhyānaṃ kevalaṃ paunaruktyaprasaṅgāyeti viramyate || 41 ||
  - verse: 42
    devanagari: |-
      नहि त्वदन्यः कश्चिदपीह देव लोकत्रये दृश्यतेऽचिन्त्यकर्मा । अनन्तवीर्योऽमितविक्रमस्त्वं सर्वं समाप्नोषि ततोऽसि सर्वः ॥ ११-४२ ॥
    slp1: |-
      nahi tvadanyaH kaScidapIha deva lokatraye dfSyate'cintyakarmA . anantavIryo'mitavikramastvaM sarvaM samApnozi tato'si sarvaH .. 11-42 ..
    iast: |-
      nahi tvadanyaḥ kaścidapīha deva lokatraye dṛśyate'cintyakarmā | anantavīryo'mitavikramastvaṃ sarvaṃ samāpnoṣi tato'si sarvaḥ || 11-42 ||
  - verse: 43
    devanagari: |-
      सखेति मत्वा प्रसभं यदुक्तं हे कृष्ण हे यादव हे सखे च । अजानता महिमानं तवेमं मया प्रमादात्प्रणयेन वापि ॥ ११-४३ ॥
    slp1: |-
      saKeti matvA prasaBaM yaduktaM he kfzRa he yAdava he saKe ca . ajAnatA mahimAnaM tavemaM mayA pramAdAtpraRayena vApi .. 11-43 ..
    iast: |-
      sakheti matvā prasabhaṃ yaduktaṃ he kṛṣṇa he yādava he sakhe ca | ajānatā mahimānaṃ tavemaṃ mayā pramādātpraṇayena vāpi || 11-43 ||
  - verse: 44
    devanagari: |-
      यच्चावहासार्थमसत्कृतोऽसि विहारशय्यासनभोजनेषु । एकोऽथवाप्यच्युत तत्समक्षं तत्क्षामये त्वामहमप्रमेयम् ॥ ११-४४ ॥
    slp1: |-
      yaccAvahAsArTamasatkfto'si vihAraSayyAsanaBojanezu . eko'TavApyacyuta tatsamakzaM tatkzAmaye tvAmahamaprameyam .. 11-44 ..
    iast: |-
      yaccāvahāsārthamasatkṛto'si vihāraśayyāsanabhojaneṣu | eko'thavāpyacyuta tatsamakṣaṃ tatkṣāmaye tvāmahamaprameyam || 11-44 ||
  - verse: 45
    devanagari: |-
      पितासि लोकस्य चराचरस्य त्वमस्य विश्वस्य गुरुर्गरीयान् । न त्वत्समोऽस्त्यभ्यधिकः कुतोऽन्यो लोकत्रयेऽप्यप्रतिमप्रभाव ॥ ११-४५ ॥
    slp1: |-
      pitAsi lokasya carAcarasya tvamasya viSvasya gururgarIyAn . na tvatsamo'styaByaDikaH kuto'nyo lokatraye'pyapratimapraBAva .. 11-45 ..
    iast: |-
      pitāsi lokasya carācarasya tvamasya viśvasya gururgarīyān | na tvatsamo'styabhyadhikaḥ kuto'nyo lokatraye'pyapratimaprabhāva || 11-45 ||
  - verse: 46
    devanagari: |-
      तस्मात्प्रणम्य प्रणिधाय कायं प्रसादये त्वामहमीशमीढ्यम् । पितेव पुत्रस्य सखेव सख्युः प्रियः प्रियास्यार्हसि देव सोढुम् ॥ ११-४६ ॥
    slp1: |-
      tasmAtpraRamya praRiDAya kAyaM prasAdaye tvAmahamISamIQyam . piteva putrasya saKeva saKyuH priyaH priyAsyArhasi deva soQum .. 11-46 ..
    iast: |-
      tasmātpraṇamya praṇidhāya kāyaṃ prasādaye tvāmahamīśamīḍhyam | piteva putrasya sakheva sakhyuḥ priyaḥ priyāsyārhasi deva soḍhum || 11-46 ||
  - verse: 47
    devanagari: |-
      दिव्यानि कर्माणि तवाद्भुतानि पूर्वाणि पूर्वे ऋषयः स्मरन्ति । नान्योऽस्ति कर्ता जगतस्त्वमेको धाता विधाता च विभुर्भवश्च ॥ ११-४७ ॥
    slp1: |-
      divyAni karmARi tavAdButAni pUrvARi pUrve fzayaH smaranti . nAnyo'sti kartA jagatastvameko DAtA viDAtA ca viBurBavaSca .. 11-47 ..
    iast: |-
      divyāni karmāṇi tavādbhutāni pūrvāṇi pūrve ṛṣayaḥ smaranti | nānyo'sti kartā jagatastvameko dhātā vidhātā ca vibhurbhavaśca || 11-47 ||
  - verse: 48
    devanagari: |-
      तवाद्भुतं किं नु भवेदसह्यं किं वा शक्यं परतः कीर्तयिष्ये । कर्तासि सर्वस्य यतः स्वयं वै विभो ततः सर्वमिदं त्वमेव ॥ ११-४८ ॥
    slp1: |-
      tavAdButaM kiM nu BavedasahyaM kiM vA SakyaM parataH kIrtayizye . kartAsi sarvasya yataH svayaM vE viBo tataH sarvamidaM tvameva .. 11-48 ..
    iast: |-
      tavādbhutaṃ kiṃ nu bhavedasahyaṃ kiṃ vā śakyaṃ parataḥ kīrtayiṣye | kartāsi sarvasya yataḥ svayaṃ vai vibho tataḥ sarvamidaṃ tvameva || 11-48 ||
  - verse: 49
    devanagari: |-
      अत्यद्भुतं कर्म न दुष्करं ते कर्मोपमानं नहि विद्यते ते । नते गुणानां परिमाणमस्ति न तेजसो नापि बलस्य नर्द्धेः ॥ ११-४९ ॥
    slp1: |-
      atyadButaM karma na duzkaraM te karmopamAnaM nahi vidyate te . nate guRAnAM parimARamasti na tejaso nApi balasya nardDeH .. 11-49 ..
    iast: |-
      atyadbhutaṃ karma na duṣkaraṃ te karmopamānaṃ nahi vidyate te | nate guṇānāṃ parimāṇamasti na tejaso nāpi balasya narddheḥ || 11-49 ||
  - verse: 50
    devanagari: |-
      अदृष्टपूर्वं हृषितोऽस्मि दृष्ट्वा भयेन च प्रव्यथितं मनो मे । तदेव मे दर्शय देव रूपं प्रसीद देवेश जगन्निवास ॥ ११-५० ॥
    slp1: |-
      adfzwapUrvaM hfzito'smi dfzwvA Bayena ca pravyaTitaM mano me . tadeva me darSaya deva rUpaM prasIda deveSa jagannivAsa .. 11-50 ..
    iast: |-
      adṛṣṭapūrvaṃ hṛṣito'smi dṛṣṭvā bhayena ca pravyathitaṃ mano me | tadeva me darśaya deva rūpaṃ prasīda deveśa jagannivāsa || 11-50 ||
  - verse: 51
    devanagari: |-
      किरीटिनं गदिनं चक्रहस्त- मिच्छामि त्वां द्रष्टुमहं तथैव । तेनैव रूपेण चतुर्भुजेन सहस्रबाहो भव विश्वमूर्ते ॥ ११-५१ ॥
    slp1: |-
      kirIwinaM gadinaM cakrahasta- micCAmi tvAM drazwumahaM taTEva . tenEva rUpeRa caturBujena sahasrabAho Bava viSvamUrte .. 11-51 ..
    iast: |-
      kirīṭinaṃ gadinaṃ cakrahasta- micchāmi tvāṃ draṣṭumahaṃ tathaiva | tenaiva rūpeṇa caturbhujena sahasrabāho bhava viśvamūrte || 11-51 ||
  - verse: 52
    devanagari: |-
      श्रीभगवानुवाच
      मया प्रसन्नेन तवार्जुनेदं रूपं परं दर्शितमात्मयोगात् । तेजोमयं विश्वमनन्तमाद्यं यन्मे त्वदन्येन न दृष्टपूर्वम् ॥ ११-५२ ॥
    slp1: |-
      SrIBagavAnuvAca
      mayA prasannena tavArjunedaM rUpaM paraM darSitamAtmayogAt . tejomayaM viSvamanantamAdyaM yanme tvadanyena na dfzwapUrvam .. 11-52 ..
    iast: |-
      śrībhagavānuvāca
      mayā prasannena tavārjunedaṃ rūpaṃ paraṃ darśitamātmayogāt | tejomayaṃ viśvamanantamādyaṃ yanme tvadanyena na dṛṣṭapūrvam || 11-52 ||
  - verse: 53
    devanagari: |-
      न वेदयज्ञाधिगमनैर्न दानै- र्न च क्रियाभिर्न तपोभिरुग्रैः । एवंरूपं शक्यमाहं नृलोके द्रष्टुं त्वदन्येन कुरुप्रवीर ॥ ११-५३ ॥
    slp1: |-
      na vedayajYADigamanErna dAnE- rna ca kriyABirna tapoBirugrEH . evaMrUpaM SakyamAhaM nfloke drazwuM tvadanyena kurupravIra .. 11-53 ..
    iast: |-
      na vedayajñādhigamanairna dānai- rna ca kriyābhirna tapobhirugraiḥ | evaṃrūpaṃ śakyamāhaṃ nṛloke draṣṭuṃ tvadanyena kurupravīra || 11-53 ||
  - verse: 54
    devanagari: |-
      मा ते व्यथा मा च विमूढत भूद् दृष्ट्वा रूपं घोरमुग्रं ममेदम् । व्यपेतभीः प्रीतमनाः पुनस्त्वं तदेव मे रूपमिदं प्रपश्य ॥ ११-५४ ॥
    slp1: |-
      mA te vyaTA mA ca vimUQata BUd dfzwvA rUpaM GoramugraM mamedam . vyapetaBIH prItamanAH punastvaM tadeva me rUpamidaM prapaSya .. 11-54 ..
    iast: |-
      mā te vyathā mā ca vimūḍhata bhūd dṛṣṭvā rūpaṃ ghoramugraṃ mamedam | vyapetabhīḥ prītamanāḥ punastvaṃ tadeva me rūpamidaṃ prapaśya || 11-54 ||
  - verse: 55
    devanagari: |-
      संजय उवाच
      इत्यर्जुनं वासुदेवस्तथोक्त्वा स्वकं रूपं दर्शयामास भूयः । आश्वासयामास च भीतमेनं भूत्वा पुनः सौम्यवपुर्महात्मा ॥ ११-५५ ॥
    slp1: |-
      saMjaya uvAca
      ityarjunaM vAsudevastaToktvA svakaM rUpaM darSayAmAsa BUyaH . ASvAsayAmAsa ca BItamenaM BUtvA punaH sOmyavapurmahAtmA .. 11-55 ..
    iast: |-
      saṃjaya uvāca
      ityarjunaṃ vāsudevastathoktvā svakaṃ rūpaṃ darśayāmāsa bhūyaḥ | āśvāsayāmāsa ca bhītamenaṃ bhūtvā punaḥ saumyavapurmahātmā || 11-55 ||
  - verse: 56
    devanagari: |-
      अर्जुन उवाच
      दृष्ट्वेदं मानुषं रूपं तवसौम्यं जनार्दन । इदानीमस्मि संवृत्तः सचेताः प्रकृतिं गतः ॥ ११-५६ ॥
      सकलोपसंहारान्ते परमप्रशान्तरूपां ब्रह्मतत्त्वस्थितिं ददाति-इत्युपसंहारे भगवतः सौम्यता ॥ ५६ ॥
    slp1: |-
      arjuna uvAca
      dfzwvedaM mAnuzaM rUpaM tavasOmyaM janArdana . idAnImasmi saMvfttaH sacetAH prakftiM gataH .. 11-56 ..
      sakalopasaMhArAnte paramapraSAntarUpAM brahmatattvasTitiM dadAti-ityupasaMhAre BagavataH sOmyatA .. 56 ..
    iast: |-
      arjuna uvāca
      dṛṣṭvedaṃ mānuṣaṃ rūpaṃ tavasaumyaṃ janārdana | idānīmasmi saṃvṛttaḥ sacetāḥ prakṛtiṃ gataḥ || 11-56 ||
      sakalopasaṃhārānte paramapraśāntarūpāṃ brahmatattvasthitiṃ dadāti-ityupasaṃhāre bhagavataḥ saumyatā || 56 ||
  - verse: 57
    devanagari: |-
      श्रीभगवानुवाच
      सुदुर्दर्शमिदं रूपं दृष्टवानसि यन्मम । देवा अप्यस्य रूपस्य नित्यं दर्शनकाङ्क्षिणः ॥ ११-५७ ॥
    slp1: |-
      SrIBagavAnuvAca
      sudurdarSamidaM rUpaM dfzwavAnasi yanmama . devA apyasya rUpasya nityaM darSanakANkziRaH .. 11-57 ..
    iast: |-
      śrībhagavānuvāca
      sudurdarśamidaṃ rūpaṃ dṛṣṭavānasi yanmama | devā apyasya rūpasya nityaṃ darśanakāṅkṣiṇaḥ || 11-57 ||
  - verse: 58
    devanagari: |-
      नाहं वेदैर्न तपसा न दानेन न चेज्यया । शक्य एवंविधो द्रष्टुं दृष्टवानसि मां यथा ॥ ११-५८ ॥
    slp1: |-
      nAhaM vedErna tapasA na dAnena na cejyayA . Sakya evaMviDo drazwuM dfzwavAnasi mAM yaTA .. 11-58 ..
    iast: |-
      nāhaṃ vedairna tapasā na dānena na cejyayā | śakya evaṃvidho draṣṭuṃ dṛṣṭavānasi māṃ yathā || 11-58 ||
  - verse: 59
    devanagari: |-
      भक्त्या त्वनन्यया शक्य ह्यहमेवंविधोऽर्जुन । ज्ञातुं द्रष्टुं च तत्त्वेन प्रवेष्टुं च परन्तप ॥ ११-५९ ॥
    slp1: |-
      BaktyA tvananyayA Sakya hyahamevaMviDo'rjuna . jYAtuM drazwuM ca tattvena pravezwuM ca parantapa .. 11-59 ..
    iast: |-
      bhaktyā tvananyayā śakya hyahamevaṃvidho'rjuna | jñātuṃ draṣṭuṃ ca tattvena praveṣṭuṃ ca parantapa || 11-59 ||
  - verse: 60
    devanagari: |-
      मत्कर्मकृन्मत्परमो मद्भक्तः सङ्गवर्जितः । निर्वैरः सर्वभूतेषु यः स मामेति पाण्डव ॥ ११-६० ॥
      अविद्यमानान्यज्ञेयरमणीया येषां भक्तिः परिस्फुरति तेषां मां प्रपद्यते वासुदेवः सर्वम् इत्यादिपूर्वाभिहितोपदेशचमत्कारात् विश्वात्मकं वासुदेवतत्त्वमयत्नत एव बोधपदवीमवतरतीति शिवम् ॥ ६० ॥
    slp1: |-
      matkarmakfnmatparamo madBaktaH saNgavarjitaH . nirvEraH sarvaBUtezu yaH sa mAmeti pARqava .. 11-60 ..
      avidyamAnAnyajYeyaramaRIyA yezAM BaktiH parisPurati tezAM mAM prapadyate vAsudevaH sarvam ityAdipUrvABihitopadeSacamatkArAt viSvAtmakaM vAsudevatattvamayatnata eva boDapadavImavataratIti Sivam .. 60 ..
    iast: |-
      matkarmakṛnmatparamo madbhaktaḥ saṅgavarjitaḥ | nirvairaḥ sarvabhūteṣu yaḥ sa māmeti pāṇḍava || 11-60 ||
      avidyamānānyajñeyaramaṇīyā yeṣāṃ bhaktiḥ parisphurati teṣāṃ māṃ prapadyate vāsudevaḥ sarvam ityādipūrvābhihitopadeśacamatkārāt viśvātmakaṃ vāsudevatattvamayatnata eva bodhapadavīmavataratīti śivam || 60 ||
  - verse: 1000
    devanagari: |-
      शुद्धाशुद्धविमिश्रोत्थसंविदैक्यविमर्शनात् । भूर्भुवः स्वस्त्रयं पश्यन्समत्वेन समो मुनिः ॥ ११ ॥
    slp1: |-
      SudDASudDavimiSrotTasaMvidEkyavimarSanAt . BUrBuvaH svastrayaM paSyansamatvena samo muniH .. 11 ..
    iast: |-
      śuddhāśuddhavimiśrotthasaṃvidaikyavimarśanāt | bhūrbhuvaḥ svastrayaṃ paśyansamatvena samo muniḥ || 11 ||
- chapter: 12
  title_sa: द्वादशोऽध्यायः
  title_iast: "dvādaśo'dhyāyaḥ"
  title_en: "Twelfth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      अर्जुन उवाच
      एवं सततयुक्ता ये भक्तास्त्वां पर्युपासते । ये चाप्यक्षरमव्यक्तं तेषां के योगवित्तमाः ॥ १२-१ ॥
      एवम्-उक्तेन नयेन ये सेश्वरब्रह्मोपासकाः ये च केवलमात्ममात्र-मुपासते तेषां विशेषाख्यानाय प्रश्नः ॥ १ ॥
    slp1: |-
      arjuna uvAca
      evaM satatayuktA ye BaktAstvAM paryupAsate . ye cApyakzaramavyaktaM tezAM ke yogavittamAH .. 12-1 ..
      evam-uktena nayena ye seSvarabrahmopAsakAH ye ca kevalamAtmamAtra-mupAsate tezAM viSezAKyAnAya praSnaH .. 1 ..
    iast: |-
      arjuna uvāca
      evaṃ satatayuktā ye bhaktāstvāṃ paryupāsate | ye cāpyakṣaramavyaktaṃ teṣāṃ ke yogavittamāḥ || 12-1 ||
      evam-uktena nayena ye seśvarabrahmopāsakāḥ ye ca kevalamātmamātra-mupāsate teṣāṃ viśeṣākhyānāya praśnaḥ || 1 ||
  - verse: 2
    devanagari: |-
      श्रीभगवानुवाच
      मय्यावेश्य मनो ये मां नित्ययुक्ता उपासते । श्रद्धया परयोपेतास्ते मे युक्ततमा मताः ॥ १२-२ ॥
      माहेश्वर्यविषयो येषां समावेशः-अकृत्रिमस्तन्मयीभावः ते युक्ततमा मम मताः-इत्यनेन प्रतिज्ञा क्रियते ॥ २ ॥
    slp1: |-
      SrIBagavAnuvAca
      mayyAveSya mano ye mAM nityayuktA upAsate . SradDayA parayopetAste me yuktatamA matAH .. 12-2 ..
      mAheSvaryavizayo yezAM samAveSaH-akftrimastanmayIBAvaH te yuktatamA mama matAH-ityanena pratijYA kriyate .. 2 ..
    iast: |-
      śrībhagavānuvāca
      mayyāveśya mano ye māṃ nityayuktā upāsate | śraddhayā parayopetāste me yuktatamā matāḥ || 12-2 ||
      māheśvaryaviṣayo yeṣāṃ samāveśaḥ-akṛtrimastanmayībhāvaḥ te yuktatamā mama matāḥ-ityanena pratijñā kriyate || 2 ||
  - verse: 3
    devanagari: |-
      ये त्वक्षरमनिर्देश्यमव्यक्तं पर्युपासते । सर्वत्रगमचिन्त्यं च कूटस्थमचलं ध्रुवम् ॥ १२-३ ॥
    slp1: |-
      ye tvakzaramanirdeSyamavyaktaM paryupAsate . sarvatragamacintyaM ca kUwasTamacalaM Druvam .. 12-3 ..
    iast: |-
      ye tvakṣaramanirdeśyamavyaktaṃ paryupāsate | sarvatragamacintyaṃ ca kūṭasthamacalaṃ dhruvam || 12-3 ||
  - verse: 4
    devanagari: |-
      सन्नियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः । ते प्राप्नुवन्ति मामेव सर्वभूतहिते रताः ॥ १२-४ ॥
    slp1: |-
      sanniyamyendriyagrAmaM sarvatra samabudDayaH . te prApnuvanti mAmeva sarvaBUtahite ratAH .. 12-4 ..
    iast: |-
      sanniyamyendriyagrāmaṃ sarvatra samabuddhayaḥ | te prāpnuvanti māmeva sarvabhūtahite ratāḥ || 12-4 ||
  - verse: 5
    devanagari: |-
      क्लेशोऽधिकतरस्तेषामव्यक्तासक्तचेतसाम् । अव्यक्ता हि गतिर्दुःखं देहभृद्भिरवाप्यते ॥ १२-५ ॥
      ये पुनरक्षरं ब्रह्मोपासते आत्मानं सर्वत्रगम्-इत्यादिभिर्विशेषणैरात्मनः सर्वे ईश्वरधर्मा आरोप्यन्ते । अतो ब्रह्मोपासका अपि मामेव यद्यपि यान्ति तथाप्यधिकतरस्तेषां क्लेशः । आत्मनि किलापहतपाप्मत्वादिगुणाष्टकारोपं विधाय पश्चात्तमेवोपासते इति स्वतःसिद्धगुणग्रामगरिमणि ईश्वरेऽयत्नसाध्ये स्थितेऽपि द्विगुणमायासं विन्दन्ति ॥ ५ ॥
    slp1: |-
      kleSo'DikatarastezAmavyaktAsaktacetasAm . avyaktA hi gatirduHKaM dehaBfdBiravApyate .. 12-5 ..
      ye punarakzaraM brahmopAsate AtmAnaM sarvatragam-ityAdiBirviSezaRErAtmanaH sarve ISvaraDarmA Aropyante . ato brahmopAsakA api mAmeva yadyapi yAnti taTApyaDikatarastezAM kleSaH . Atmani kilApahatapApmatvAdiguRAzwakAropaM viDAya paScAttamevopAsate iti svataHsidDaguRagrAmagarimaRi ISvare'yatnasADye sTite'pi dviguRamAyAsaM vindanti .. 5 ..
    iast: |-
      kleśo'dhikatarasteṣāmavyaktāsaktacetasām | avyaktā hi gatirduḥkhaṃ dehabhṛdbhiravāpyate || 12-5 ||
      ye punarakṣaraṃ brahmopāsate ātmānaṃ sarvatragam-ityādibhirviśeṣaṇairātmanaḥ sarve īśvaradharmā āropyante | ato brahmopāsakā api māmeva yadyapi yānti tathāpyadhikatarasteṣāṃ kleśaḥ | ātmani kilāpahatapāpmatvādiguṇāṣṭakāropaṃ vidhāya paścāttamevopāsate iti svataḥsiddhaguṇagrāmagarimaṇi īśvare'yatnasādhye sthite'pi dviguṇamāyāsaṃ vindanti || 5 ||
  - verse: 6
    devanagari: |-
      ये तु सर्वाणि कर्माणि मयि संन्यस्य मत्पराः । अनन्येनैव योगेन मां ध्यायन्त उपासते ॥ १२-६ ॥
    slp1: |-
      ye tu sarvARi karmARi mayi saMnyasya matparAH . ananyenEva yogena mAM DyAyanta upAsate .. 12-6 ..
    iast: |-
      ye tu sarvāṇi karmāṇi mayi saṃnyasya matparāḥ | ananyenaiva yogena māṃ dhyāyanta upāsate || 12-6 ||
  - verse: 7
    devanagari: |-
      तेषामहं समुद्धर्ता मृत्युसंसारसागरात् । भवामि न चिरात्पार्थ मय्यावेशितचेतसाम् ॥ १२-७ ॥
    slp1: |-
      tezAmahaM samudDartA mftyusaMsArasAgarAt . BavAmi na cirAtpArTa mayyAveSitacetasAm .. 12-7 ..
    iast: |-
      teṣāmahaṃ samuddhartā mṛtyusaṃsārasāgarāt | bhavāmi na cirātpārtha mayyāveśitacetasām || 12-7 ||
  - verse: 8
    devanagari: |-
      मय्येव मन आधत्स्व मयि बुद्धिं निवेशय । निवत्स्यसि त्वं मय्येव योगमुत्तममास्थिः ॥ १२-८ ॥
      इत्यादि ॥ ८ ॥
    slp1: |-
      mayyeva mana ADatsva mayi budDiM niveSaya . nivatsyasi tvaM mayyeva yogamuttamamAsTiH .. 12-8 ..
      ityAdi .. 8 ..
    iast: |-
      mayyeva mana ādhatsva mayi buddhiṃ niveśaya | nivatsyasi tvaṃ mayyeva yogamuttamamāsthiḥ || 12-8 ||
      ityādi || 8 ||
  - verse: 9
    devanagari: |-
      अहावेशयितुं चित्तं न शक्नोषि मयि स्थिरम् । अभ्यासयोगेन ततो मामिच्छाप्तुं धनञ्जय ॥ १२-९ ॥
      तीव्रतरभगवच्छक्तिपातं चिरतरप्रसादितगुरुचरणानुग्रहं च विना दुर्लभ आवेशः-इत्यभ्यासः ॥ ९ ॥
    slp1: |-
      ahAveSayituM cittaM na Saknozi mayi sTiram . aByAsayogena tato mAmicCAptuM DanaYjaya .. 12-9 ..
      tIvrataraBagavacCaktipAtaM cirataraprasAditagurucaraRAnugrahaM ca vinA durlaBa AveSaH-ityaByAsaH .. 9 ..
    iast: |-
      ahāveśayituṃ cittaṃ na śaknoṣi mayi sthiram | abhyāsayogena tato māmicchāptuṃ dhanañjaya || 12-9 ||
      tīvratarabhagavacchaktipātaṃ cirataraprasāditagurucaraṇānugrahaṃ ca vinā durlabha āveśaḥ-ityabhyāsaḥ || 9 ||
  - verse: 10
    devanagari: |-
      अभ्यासेऽप्यसमर्थोः सन्मत्कर्मपरमो भव । मदर्थमपि कर्माणि कुर्वन्सिद्धिमवाप्स्यसि ॥ १२-१० ॥
      अभ्यासोऽपि न शक्यते-विघ्नाद्यभिभवात् । अतस्तन्नाशाय कर्म-पूजाजपस्वाध्यायहोमादीन् कुरु ॥ १० ॥
    slp1: |-
      aByAse'pyasamarToH sanmatkarmaparamo Bava . madarTamapi karmARi kurvansidDimavApsyasi .. 12-10 ..
      aByAso'pi na Sakyate-viGnAdyaBiBavAt . atastannASAya karma-pUjAjapasvADyAyahomAdIn kuru .. 10 ..
    iast: |-
      abhyāse'pyasamarthoḥ sanmatkarmaparamo bhava | madarthamapi karmāṇi kurvansiddhimavāpsyasi || 12-10 ||
      abhyāso'pi na śakyate-vighnādyabhibhavāt | atastannāśāya karma-pūjājapasvādhyāyahomādīn kuru || 10 ||
  - verse: 11
    devanagari: |-
      अथैतदप्यशक्तोऽसि कर्तुं मद्योगमास्थितः । सर्वकर्मफलत्यागं ततः कुरु यतात्मवान् ॥ १२-११ ॥
      इति । पारमेश्वरेषु हि सिद्धान्तशास्त्रेषु आत्मनिवेदनेऽयमेवाभिप्रायः ॥ ११ ॥
    slp1: |-
      aTEtadapyaSakto'si kartuM madyogamAsTitaH . sarvakarmaPalatyAgaM tataH kuru yatAtmavAn .. 12-11 ..
      iti . pArameSvarezu hi sidDAntaSAstrezu Atmanivedane'yamevABiprAyaH .. 11 ..
    iast: |-
      athaitadapyaśakto'si kartuṃ madyogamāsthitaḥ | sarvakarmaphalatyāgaṃ tataḥ kuru yatātmavān || 12-11 ||
      iti | pārameśvareṣu hi siddhāntaśāstreṣu ātmanivedane'yamevābhiprāyaḥ || 11 ||
  - verse: 12
    devanagari: |-
      तदिदं तात्पर्यमुपसंह्रियते-
      श्रेयो हि ज्ञानमभ्यासाज्ज्ञानाद्ध्यानं विशिष्यते । ध्यानात्कर्मफलत्यागस्त्यागाच्छान्तिरनन्तरा ॥ १२-१२ ॥
      ज्ञानम्-आवेशात्म अभ्यासाच्छ्रेयः-अभ्यासस्य तत्फलत्वात् । तस्मादेवावेशात् ध्यानं-भगवन्मयत्वं विशिष्यते-विशेषत्वं याति-अभिमतप्राप्त्या । सति ध्याने-भगवन्मयत्वे कर्मफलानि संन्यसितुं युज्यन्ते । अन्यथाज्ञातरूपे क्व संन्यासः । कर्मफलत्यागे च आत्यन्तिकी शान्तिः । अतः सर्वमूलत्वादावेशात्मकं ज्ञानमेव प्रधानम् ॥ १२ ॥
    slp1: |-
      tadidaM tAtparyamupasaMhriyate-
      Sreyo hi jYAnamaByAsAjjYAnAdDyAnaM viSizyate . DyAnAtkarmaPalatyAgastyAgAcCAntiranantarA .. 12-12 ..
      jYAnam-AveSAtma aByAsAcCreyaH-aByAsasya tatPalatvAt . tasmAdevAveSAt DyAnaM-BagavanmayatvaM viSizyate-viSezatvaM yAti-aBimataprAptyA . sati DyAne-Bagavanmayatve karmaPalAni saMnyasituM yujyante . anyaTAjYAtarUpe kva saMnyAsaH . karmaPalatyAge ca AtyantikI SAntiH . ataH sarvamUlatvAdAveSAtmakaM jYAnameva praDAnam .. 12 ..
    iast: |-
      tadidaṃ tātparyamupasaṃhriyate-
      śreyo hi jñānamabhyāsājjñānāddhyānaṃ viśiṣyate | dhyānātkarmaphalatyāgastyāgācchāntiranantarā || 12-12 ||
      jñānam-āveśātma abhyāsācchreyaḥ-abhyāsasya tatphalatvāt | tasmādevāveśāt dhyānaṃ-bhagavanmayatvaṃ viśiṣyate-viśeṣatvaṃ yāti-abhimataprāptyā | sati dhyāne-bhagavanmayatve karmaphalāni saṃnyasituṃ yujyante | anyathājñātarūpe kva saṃnyāsaḥ | karmaphalatyāge ca ātyantikī śāntiḥ | ataḥ sarvamūlatvādāveśātmakaṃ jñānameva pradhānam || 12 ||
  - verse: 13
    devanagari: |-
      अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च । निर्ममो निरहङ्कारः समदुःखसुखः क्षमी ॥ १२-१३ ॥
      मैत्री-अमत्सरता यस्यास्तीति । एवं करुणः । ममामी-इत्यादिः ममकारः अहमुदारोऽहं तेजस्वी अहं सहनः-इत्यादिः अहंकारः-एतौ यस्य न स्तः । क्षमा-अपकारिणं शत्रुं प्रत्यद्वेषबुद्धिः ॥ १३ ॥
    slp1: |-
      advezwA sarvaBUtAnAM mEtraH karuRa eva ca . nirmamo nirahaNkAraH samaduHKasuKaH kzamI .. 12-13 ..
      mEtrI-amatsaratA yasyAstIti . evaM karuRaH . mamAmI-ityAdiH mamakAraH ahamudAro'haM tejasvI ahaM sahanaH-ityAdiH ahaMkAraH-etO yasya na staH . kzamA-apakAriRaM SatruM pratyadvezabudDiH .. 13 ..
    iast: |-
      adveṣṭā sarvabhūtānāṃ maitraḥ karuṇa eva ca | nirmamo nirahaṅkāraḥ samaduḥkhasukhaḥ kṣamī || 12-13 ||
      maitrī-amatsaratā yasyāstīti | evaṃ karuṇaḥ | mamāmī-ityādiḥ mamakāraḥ ahamudāro'haṃ tejasvī ahaṃ sahanaḥ-ityādiḥ ahaṃkāraḥ-etau yasya na staḥ | kṣamā-apakāriṇaṃ śatruṃ pratyadveṣabuddhiḥ || 13 ||
  - verse: 14
    devanagari: |-
      सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः । मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः ॥ १२-१४ ॥
      सततं योगी-व्यवहारावस्थायामपि प्रशान्तान्तः करणत्वात् ॥ १४ ॥
    slp1: |-
      santuzwaH satataM yogI yatAtmA dfQaniScayaH . mayyarpitamanobudDiryo madBaktaH sa me priyaH .. 12-14 ..
      satataM yogI-vyavahArAvasTAyAmapi praSAntAntaH karaRatvAt .. 14 ..
    iast: |-
      santuṣṭaḥ satataṃ yogī yatātmā dṛḍhaniścayaḥ | mayyarpitamanobuddhiryo madbhaktaḥ sa me priyaḥ || 12-14 ||
      satataṃ yogī-vyavahārāvasthāyāmapi praśāntāntaḥ karaṇatvāt || 14 ||
  - verse: 15
    devanagari: |-
      यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः । हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः ॥ १२-१५ ॥
    slp1: |-
      yasmAnnodvijate loko lokAnnodvijate ca yaH . harzAmarzaBayodvegErmukto yaH sa ca me priyaH .. 12-15 ..
    iast: |-
      yasmānnodvijate loko lokānnodvijate ca yaḥ | harṣāmarṣabhayodvegairmukto yaḥ sa ca me priyaḥ || 12-15 ||
  - verse: 16
    devanagari: |-
      अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः । सर्वारम्भफलत्यागी यो मद्भक्तः स मे प्रियः ॥ १२-१६ ॥
    slp1: |-
      anapekzaH Sucirdakza udAsIno gatavyaTaH . sarvAramBaPalatyAgI yo madBaktaH sa me priyaH .. 12-16 ..
    iast: |-
      anapekṣaḥ śucirdakṣa udāsīno gatavyathaḥ | sarvārambhaphalatyāgī yo madbhaktaḥ sa me priyaḥ || 12-16 ||
  - verse: 17
    devanagari: |-
      यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति । शुभाशुभफलत्यागी भक्तिमान्यः स मे प्रियः ॥ १२-१७ ॥
    slp1: |-
      yo na hfzyati na dvezwi na Socati na kANkzati . SuBASuBaPalatyAgI BaktimAnyaH sa me priyaH .. 12-17 ..
    iast: |-
      yo na hṛṣyati na dveṣṭi na śocati na kāṅkṣati | śubhāśubhaphalatyāgī bhaktimānyaḥ sa me priyaḥ || 12-17 ||
  - verse: 18
    devanagari: |-
      समः शत्रौ च मित्रे च तथा मानावमानयोः । शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः ॥ १२-१८ ॥
    slp1: |-
      samaH SatrO ca mitre ca taTA mAnAvamAnayoH . SItozRasuKaduHKezu samaH saNgavivarjitaH .. 12-18 ..
    iast: |-
      samaḥ śatrau ca mitre ca tathā mānāvamānayoḥ | śītoṣṇasukhaduḥkheṣu samaḥ saṅgavivarjitaḥ || 12-18 ||
  - verse: 19
    devanagari: |-
      तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येनकेनचित् । अनिकेतः स्थिरमतिर्भक्तिमान्मे प्रियो नरः ॥ १२-१९ ॥
    slp1: |-
      tulyanindAstutirmOnI santuzwo yenakenacit . aniketaH sTiramatirBaktimAnme priyo naraH .. 12-19 ..
    iast: |-
      tulyanindāstutirmaunī santuṣṭo yenakenacit | aniketaḥ sthiramatirbhaktimānme priyo naraḥ || 12-19 ||
  - verse: 20
    devanagari: |-
      ये तु धर्म्यामृतमिदं यथोक्तं पर्युपासते । श्रद्दधाना मत्परमा भक्तास्तेऽतीव मे प्रियाः ॥ १२-२० ॥
      अनिकेतः-इदमेव मया कर्तव्यम्-इति यस्य नास्ति प्रतिज्ञा । यथाप्राप्तहेवाकितया सुखदुःखादिकमुपभुज्जानः परमेश्वरविषयसमावेशितहृदयः सुखेनैव प्राप्नोति परमकैवल्यमिति शिवम् ॥ २० ॥
    slp1: |-
      ye tu DarmyAmftamidaM yaToktaM paryupAsate . SraddaDAnA matparamA BaktAste'tIva me priyAH .. 12-20 ..
      aniketaH-idameva mayA kartavyam-iti yasya nAsti pratijYA . yaTAprAptahevAkitayA suKaduHKAdikamupaBujjAnaH parameSvaravizayasamAveSitahfdayaH suKenEva prApnoti paramakEvalyamiti Sivam .. 20 ..
    iast: |-
      ye tu dharmyāmṛtamidaṃ yathoktaṃ paryupāsate | śraddadhānā matparamā bhaktāste'tīva me priyāḥ || 12-20 ||
      aniketaḥ-idameva mayā kartavyam-iti yasya nāsti pratijñā | yathāprāptahevākitayā sukhaduḥkhādikamupabhujjānaḥ parameśvaraviṣayasamāveśitahṛdayaḥ sukhenaiva prāpnoti paramakaivalyamiti śivam || 20 ||
  - verse: 1000
    devanagari: |-
      परमानन्दवैवश्यसञ्जातावेशसंपदः । स्वयं सर्वास्ववस्थासु ब्रह्मसत्ता ह्ययत्नतः ॥ १२ ॥
    slp1: |-
      paramAnandavEvaSyasaYjAtAveSasaMpadaH . svayaM sarvAsvavasTAsu brahmasattA hyayatnataH .. 12 ..
    iast: |-
      paramānandavaivaśyasañjātāveśasaṃpadaḥ | svayaṃ sarvāsvavasthāsu brahmasattā hyayatnataḥ || 12 ||
- chapter: 13
  title_sa: त्रयोदशोऽध्यायः
  title_iast: "trayodaśo'dhyāyaḥ"
  title_en: "Thirteenth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      अर्जुन उवाच
      प्रकृतिं पुरुषं चैव क्षेत्रं क्षेत्रज्ञमेव च । एतद्वेदितुमिच्छामि ज्ञानं ज्ञेयं च केशव ॥ १३-१ ॥
    slp1: |-
      arjuna uvAca
      prakftiM puruzaM cEva kzetraM kzetrajYameva ca . etadveditumicCAmi jYAnaM jYeyaM ca keSava .. 13-1 ..
    iast: |-
      arjuna uvāca
      prakṛtiṃ puruṣaṃ caiva kṣetraṃ kṣetrajñameva ca | etadveditumicchāmi jñānaṃ jñeyaṃ ca keśava || 13-1 ||
  - verse: 2
    devanagari: |-
      क्वचिच्छ्रुतौ क्षेत्रज्ञ उपास्यः-इति श्रूयते । स च किमात्मा उतेश्वरः अथ तृतीयः कश्चिदन्य एव ? इति प्रश्नाशङ्कायां श्रीभगवानादिशति-
      श्रीभगवानुवाच
      इदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते । एतद्यो वेद तं प्राहुः क्षेत्रज्ञ इति तद्विदः ॥ १३-२ ॥
    slp1: |-
      kvacicCrutO kzetrajYa upAsyaH-iti SrUyate . sa ca kimAtmA uteSvaraH aTa tftIyaH kaScidanya eva ? iti praSnASaNkAyAM SrIBagavAnAdiSati-
      SrIBagavAnuvAca
      idaM SarIraM kOnteya kzetramityaBiDIyate . etadyo veda taM prAhuH kzetrajYa iti tadvidaH .. 13-2 ..
    iast: |-
      kvacicchrutau kṣetrajña upāsyaḥ-iti śrūyate | sa ca kimātmā uteśvaraḥ atha tṛtīyaḥ kaścidanya eva ? iti praśnāśaṅkāyāṃ śrībhagavānādiśati-
      śrībhagavānuvāca
      idaṃ śarīraṃ kaunteya kṣetramityabhidhīyate | etadyo veda taṃ prāhuḥ kṣetrajña iti tadvidaḥ || 13-2 ||
  - verse: 3
    devanagari: |-
      क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत । क्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम ॥ १३-३ ॥
      संसारिणां शरीरं क्षेत्रं यत्र कर्मबीजप्ररोहः । अत एव तेषामात्मा आगन्तुककालुष्यरूषितः क्षेत्रज्ञ उच्यते । प्रबुद्धानां तदेव क्षेत्रम् । अन्वर्थभेदस्तु तद्यथा-क्षिणोति कर्मबन्धमुपभोगेन त्रायते जन्ममरणभयादिति । तांश्च प्रति परमात्मा वासुदेवः क्षेत्रज्ञः एतत्क्षेत्रं यो वेद-वेदयति इत्यन्तर्भावितण्यर्थो विदिः । तेन यत्प्रसादादचेतनमिदं चेतनीभावमायाति स एव क्षेत्रज्ञो नान्यः कश्चित् । विशेषस्तु परिमितव्याप्तिकं रूपमालम्ब्य आत्मेति भण्यते अपरिच्छिन्नसर्वक्षेत्रव्याप्त्या परमात्मा भगवान्वासुदेवः ममेति कर्मणि षष्ठी-अहमनेन ज्ञानेन ज्ञेय इत्यर्थः ॥ ३ ॥
    slp1: |-
      kzetrajYaM cApi mAM vidDi sarvakzetrezu BArata . kzetrakzetrajYayorjYAnaM yattajjYAnaM mataM mama .. 13-3 ..
      saMsAriRAM SarIraM kzetraM yatra karmabIjaprarohaH . ata eva tezAmAtmA AgantukakAluzyarUzitaH kzetrajYa ucyate . prabudDAnAM tadeva kzetram . anvarTaBedastu tadyaTA-kziRoti karmabanDamupaBogena trAyate janmamaraRaBayAditi . tAMSca prati paramAtmA vAsudevaH kzetrajYaH etatkzetraM yo veda-vedayati ityantarBAvitaRyarTo vidiH . tena yatprasAdAdacetanamidaM cetanIBAvamAyAti sa eva kzetrajYo nAnyaH kaScit . viSezastu parimitavyAptikaM rUpamAlambya Atmeti BaRyate aparicCinnasarvakzetravyAptyA paramAtmA BagavAnvAsudevaH mameti karmaRi zazWI-ahamanena jYAnena jYeya ityarTaH .. 3 ..
    iast: |-
      kṣetrajñaṃ cāpi māṃ viddhi sarvakṣetreṣu bhārata | kṣetrakṣetrajñayorjñānaṃ yattajjñānaṃ mataṃ mama || 13-3 ||
      saṃsāriṇāṃ śarīraṃ kṣetraṃ yatra karmabījaprarohaḥ | ata eva teṣāmātmā āgantukakāluṣyarūṣitaḥ kṣetrajña ucyate | prabuddhānāṃ tadeva kṣetram | anvarthabhedastu tadyathā-kṣiṇoti karmabandhamupabhogena trāyate janmamaraṇabhayāditi | tāṃśca prati paramātmā vāsudevaḥ kṣetrajñaḥ etatkṣetraṃ yo veda-vedayati ityantarbhāvitaṇyartho vidiḥ | tena yatprasādādacetanamidaṃ cetanībhāvamāyāti sa eva kṣetrajño nānyaḥ kaścit | viśeṣastu parimitavyāptikaṃ rūpamālambya ātmeti bhaṇyate aparicchinnasarvakṣetravyāptyā paramātmā bhagavānvāsudevaḥ mameti karmaṇi ṣaṣṭhī-ahamanena jñānena jñeya ityarthaḥ || 3 ||
  - verse: 4
    devanagari: |-
      तत्क्षेत्रं यच्च यादृक्च यद्विकारि यतश्च यत् । स च यो यत्स्वभावश्च तत्समासेन मे शृणु ॥ १३-४ ॥
    slp1: |-
      tatkzetraM yacca yAdfkca yadvikAri yataSca yat . sa ca yo yatsvaBAvaSca tatsamAsena me SfRu .. 13-4 ..
    iast: |-
      tatkṣetraṃ yacca yādṛkca yadvikāri yataśca yat | sa ca yo yatsvabhāvaśca tatsamāsena me śṛṇu || 13-4 ||
  - verse: 5
    devanagari: |-
      ऋषिभिर्बहुधा गीतं छन्दोभिर्विविधैः पृथक् । ब्रह्मसूत्रपदैश्चैव हेतुमद्भिर्विनिश्चितम् ॥ १३-५ ॥
      येन विकारं गच्छति यद्विकारि । समासेन-इत्यविभागेनैवैतान्प्रश्नान् साधारणोत्तरेण परिच्छिनत्ति । यद्यपि च ऋषिभिर्बहुधा वेदैश्चोक्तमेतत् तथापि समासेनाहं व्याचक्ष इति ॥ ५ ॥
    slp1: |-
      fziBirbahuDA gItaM CandoBirviviDEH pfTak . brahmasUtrapadEScEva hetumadBirviniScitam .. 13-5 ..
      yena vikAraM gacCati yadvikAri . samAsena-ityaviBAgenEvEtAnpraSnAn sADAraRottareRa paricCinatti . yadyapi ca fziBirbahuDA vedEScoktametat taTApi samAsenAhaM vyAcakza iti .. 5 ..
    iast: |-
      ṛṣibhirbahudhā gītaṃ chandobhirvividhaiḥ pṛthak | brahmasūtrapadaiścaiva hetumadbhirviniścitam || 13-5 ||
      yena vikāraṃ gacchati yadvikāri | samāsena-ityavibhāgenaivaitānpraśnān sādhāraṇottareṇa paricchinatti | yadyapi ca ṛṣibhirbahudhā vedaiścoktametat tathāpi samāsenāhaṃ vyācakṣa iti || 5 ||
  - verse: 6
    devanagari: |-
      महाभूतान्यहङ्कारो बुद्धिरव्यक्तमेव च । इन्द्रियाणि दशैकं च पञ्च चेन्द्रियगोचराः ॥ १३-६ ॥
      अव्यक्तं-प्रकृतिः । इन्द्रियाणि-मनसा सहैकादश । इन्द्रियगोचराः-रूपादयः पञ्च ॥ ६ ॥
    slp1: |-
      mahABUtAnyahaNkAro budDiravyaktameva ca . indriyARi daSEkaM ca paYca cendriyagocarAH .. 13-6 ..
      avyaktaM-prakftiH . indriyARi-manasA sahEkAdaSa . indriyagocarAH-rUpAdayaH paYca .. 6 ..
    iast: |-
      mahābhūtānyahaṅkāro buddhiravyaktameva ca | indriyāṇi daśaikaṃ ca pañca cendriyagocarāḥ || 13-6 ||
      avyaktaṃ-prakṛtiḥ | indriyāṇi-manasā sahaikādaśa | indriyagocarāḥ-rūpādayaḥ pañca || 6 ||
  - verse: 7
    devanagari: |-
      इच्छा द्वेषः सुखं दुःखं सङ्घातश्चेतना धृतिः । एतत्क्षेत्रं समासेन सविकारमुदाहृतम् ॥ १३-७ ॥
      चेतना-दृक्शक्तिः पुरुषः । धृतिरिति अन्ते किल सर्वस्य-आ ब्रह्मणः क्रिमिपर्यन्तस्य प्रारब्धे निष्पन्ने वा कार्ये कामक्रोधादिषु च इयतैव मम पर्याप्तं किमन्येन ईदृशश्चाहं नित्यमेव भूयासम्-इति प्राणसंघारिणी धृतिराश्वासनात्मिका पररहस्यशासनेषु रागशब्दवाच्या जायते ॥ ७ ॥
    slp1: |-
      icCA dvezaH suKaM duHKaM saNGAtaScetanA DftiH . etatkzetraM samAsena savikAramudAhftam .. 13-7 ..
      cetanA-dfkSaktiH puruzaH . Dftiriti ante kila sarvasya-A brahmaRaH krimiparyantasya prArabDe nizpanne vA kArye kAmakroDAdizu ca iyatEva mama paryAptaM kimanyena IdfSaScAhaM nityameva BUyAsam-iti prARasaMGAriRI DftirASvAsanAtmikA pararahasyaSAsanezu rAgaSabdavAcyA jAyate .. 7 ..
    iast: |-
      icchā dveṣaḥ sukhaṃ duḥkhaṃ saṅghātaścetanā dhṛtiḥ | etatkṣetraṃ samāsena savikāramudāhṛtam || 13-7 ||
      cetanā-dṛkśaktiḥ puruṣaḥ | dhṛtiriti ante kila sarvasya-ā brahmaṇaḥ krimiparyantasya prārabdhe niṣpanne vā kārye kāmakrodhādiṣu ca iyataiva mama paryāptaṃ kimanyena īdṛśaścāhaṃ nityameva bhūyāsam-iti prāṇasaṃghāriṇī dhṛtirāśvāsanātmikā pararahasyaśāsaneṣu rāgaśabdavācyā jāyate || 7 ||
  - verse: 8
    devanagari: |-
      एवं क्षेत्रं व्याख्यातं क्षेत्रज्ञश्च । इदानीं ज्ञानमुच्यते-
      अमानित्वमदम्भित्वमहिंसा क्षान्तिरार्जवम् । आचार्योपासनं शौचं स्थैर्यमात्मविनिग्रहः ॥ १३-८ ॥
    slp1: |-
      evaM kzetraM vyAKyAtaM kzetrajYaSca . idAnIM jYAnamucyate-
      amAnitvamadamBitvamahiMsA kzAntirArjavam . AcAryopAsanaM SOcaM sTEryamAtmavinigrahaH .. 13-8 ..
    iast: |-
      evaṃ kṣetraṃ vyākhyātaṃ kṣetrajñaśca | idānīṃ jñānamucyate-
      amānitvamadambhitvamahiṃsā kṣāntirārjavam | ācāryopāsanaṃ śaucaṃ sthairyamātmavinigrahaḥ || 13-8 ||
  - verse: 9
    devanagari: |-
      इन्द्रियार्थेषु वैराग्यमनहङ्कार एव च । जन्ममृत्युजराव्याधिदुःखदोषानुदर्शनम् ॥ १३-९ ॥
    slp1: |-
      indriyArTezu vErAgyamanahaNkAra eva ca . janmamftyujarAvyADiduHKadozAnudarSanam .. 13-9 ..
    iast: |-
      indriyārtheṣu vairāgyamanahaṅkāra eva ca | janmamṛtyujarāvyādhiduḥkhadoṣānudarśanam || 13-9 ||
  - verse: 10
    devanagari: |-
      असक्तिरनभिष्वङ्गः पुत्रदारगृहादिषु । नित्यं च समचित्तत्वमिष्टानिष्टोपपत्तिषु ॥ १३-१० ॥
    slp1: |-
      asaktiranaBizvaNgaH putradAragfhAdizu . nityaM ca samacittatvamizwAnizwopapattizu .. 13-10 ..
    iast: |-
      asaktiranabhiṣvaṅgaḥ putradāragṛhādiṣu | nityaṃ ca samacittatvamiṣṭāniṣṭopapattiṣu || 13-10 ||
  - verse: 11
    devanagari: |-
      मयि चानन्ययोगेन भक्तिरव्यभिचारिणी । विविक्तदेशसेवित्वमरतिर्जनसंसदि ॥ १३-११ ॥
    slp1: |-
      mayi cAnanyayogena BaktiravyaBicAriRI . viviktadeSasevitvamaratirjanasaMsadi .. 13-11 ..
    iast: |-
      mayi cānanyayogena bhaktiravyabhicāriṇī | viviktadeśasevitvamaratirjanasaṃsadi || 13-11 ||
  - verse: 12
    devanagari: |-
      अध्यात्मज्ञाननिष्ठत्वं तत्त्वज्ञानार्थदर्शनम् । एतज्ज्ञानमिति प्रोक्तमज्ञानं यदतोऽन्यथा ॥ १३-१२ ॥
      अनन्ययोगेनेति-परमात्मनो महेश्वरादन्यदपरं न किंचिदस्ति-इत्यनन्यरूपो यो निश्चयः स एव योगः-तेन निश्चयेन मयि भक्तिः । अत एव सा न कदाचिद्व्यभिचरति-व्यभिचारहेतुत्वाभिमतानां कामनानामभावात् तासामपि वा चित्तवृत्त्यन्तररूपाणां तदेकमयत्वात् । एवं सर्वत्रानुसंधेयम् एतद्विपरीतमज्ञानम् तथा मानित्वादीनि ॥ १२ ॥
    slp1: |-
      aDyAtmajYAnanizWatvaM tattvajYAnArTadarSanam . etajjYAnamiti proktamajYAnaM yadato'nyaTA .. 13-12 ..
      ananyayogeneti-paramAtmano maheSvarAdanyadaparaM na kiMcidasti-ityananyarUpo yo niScayaH sa eva yogaH-tena niScayena mayi BaktiH . ata eva sA na kadAcidvyaBicarati-vyaBicArahetutvABimatAnAM kAmanAnAmaBAvAt tAsAmapi vA cittavfttyantararUpARAM tadekamayatvAt . evaM sarvatrAnusaMDeyam etadviparItamajYAnam taTA mAnitvAdIni .. 12 ..
    iast: |-
      adhyātmajñānaniṣṭhatvaṃ tattvajñānārthadarśanam | etajjñānamiti proktamajñānaṃ yadato'nyathā || 13-12 ||
      ananyayogeneti-paramātmano maheśvarādanyadaparaṃ na kiṃcidasti-ityananyarūpo yo niścayaḥ sa eva yogaḥ-tena niścayena mayi bhaktiḥ | ata eva sā na kadācidvyabhicarati-vyabhicārahetutvābhimatānāṃ kāmanānāmabhāvāt tāsāmapi vā cittavṛttyantararūpāṇāṃ tadekamayatvāt | evaṃ sarvatrānusaṃdheyam etadviparītamajñānam tathā mānitvādīni || 12 ||
  - verse: 13
    devanagari: |-
      एतेन ज्ञानेन यज्ज्ञेयं तदुच्यते-
      ज्ञेयं यत्तत्प्रवक्ष्यामि यज्ज्ञात्वाऽमृतमश्नुते । अनादिमत्परं ब्रह्म न सत्तन्नासदुच्यते ॥ १३-१३ ॥
    slp1: |-
      etena jYAnena yajjYeyaM taducyate-
      jYeyaM yattatpravakzyAmi yajjYAtvA'mftamaSnute . anAdimatparaM brahma na sattannAsaducyate .. 13-13 ..
    iast: |-
      etena jñānena yajjñeyaṃ taducyate-
      jñeyaṃ yattatpravakṣyāmi yajjñātvā'mṛtamaśnute | anādimatparaṃ brahma na sattannāsaducyate || 13-13 ||
  - verse: 14
    devanagari: |-
      सर्वतः पाणिपादं तत्सर्वतोऽक्षिशिरोमुखम् । सर्वतः श्रुतिमल्लोके सर्वमावृत्त्य तिष्ठति ॥ १३-१४ ॥
    slp1: |-
      sarvataH pARipAdaM tatsarvato'kziSiromuKam . sarvataH Srutimalloke sarvamAvfttya tizWati .. 13-14 ..
    iast: |-
      sarvataḥ pāṇipādaṃ tatsarvato'kṣiśiromukham | sarvataḥ śrutimalloke sarvamāvṛttya tiṣṭhati || 13-14 ||
  - verse: 15
    devanagari: |-
      सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम् । असक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ च ॥ १३-१५ ॥
    slp1: |-
      sarvendriyaguRABAsaM sarvendriyavivarjitam . asaktaM sarvaBfccEva nirguRaM guRaBoktf ca .. 13-15 ..
    iast: |-
      sarvendriyaguṇābhāsaṃ sarvendriyavivarjitam | asaktaṃ sarvabhṛccaiva nirguṇaṃ guṇabhoktṛ ca || 13-15 ||
  - verse: 16
    devanagari: |-
      बहिरन्तश्च भूतानामचरं चरमेव च । सूक्ष्मत्वात्तदविज्ञेयं दूरस्थं चान्तिके च तत् ॥ १३-१६ ॥
    slp1: |-
      bahirantaSca BUtAnAmacaraM carameva ca . sUkzmatvAttadavijYeyaM dUrasTaM cAntike ca tat .. 13-16 ..
    iast: |-
      bahirantaśca bhūtānāmacaraṃ carameva ca | sūkṣmatvāttadavijñeyaṃ dūrasthaṃ cāntike ca tat || 13-16 ||
  - verse: 17
    devanagari: |-
      अविभक्तं च भूतेषु विभक्तमिव च स्थितम् । भूतभर्तृ च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च ॥ १३-१७ ॥
    slp1: |-
      aviBaktaM ca BUtezu viBaktamiva ca sTitam . BUtaBartf ca tajjYeyaM grasizRu praBavizRu ca .. 13-17 ..
    iast: |-
      avibhaktaṃ ca bhūteṣu vibhaktamiva ca sthitam | bhūtabhartṛ ca tajjñeyaṃ grasiṣṇu prabhaviṣṇu ca || 13-17 ||
  - verse: 18
    devanagari: |-
      ज्योतिषामपि तज्ज्योतिस्तमसः परमुच्यते । ज्ञानज्ञेयं ज्ञानगम्यं हृदि सर्वस्य विष्ठितम् ॥ १३-१८ ॥
      अनादिमत्परं ब्रह्म-इत्यादिभिर्विशेषणैर्ब्रह्मस्वरूपाक्षेपानुग्राहकं सर्वप्रवादाभिहितविज्ञानापृथग्भावं कथयति । एतानि च विशेषणाणि पूर्वमेव व्याख्यातानीति किं निष्फलया पुनरुक्त्या ॥ १८ ॥
    slp1: |-
      jyotizAmapi tajjyotistamasaH paramucyate . jYAnajYeyaM jYAnagamyaM hfdi sarvasya vizWitam .. 13-18 ..
      anAdimatparaM brahma-ityAdiBirviSezaRErbrahmasvarUpAkzepAnugrAhakaM sarvapravAdABihitavijYAnApfTagBAvaM kaTayati . etAni ca viSezaRARi pUrvameva vyAKyAtAnIti kiM nizPalayA punaruktyA .. 18 ..
    iast: |-
      jyotiṣāmapi tajjyotistamasaḥ paramucyate | jñānajñeyaṃ jñānagamyaṃ hṛdi sarvasya viṣṭhitam || 13-18 ||
      anādimatparaṃ brahma-ityādibhirviśeṣaṇairbrahmasvarūpākṣepānugrāhakaṃ sarvapravādābhihitavijñānāpṛthagbhāvaṃ kathayati | etāni ca viśeṣaṇāṇi pūrvameva vyākhyātānīti kiṃ niṣphalayā punaruktyā || 18 ||
  - verse: 19
    devanagari: |-
      एतत्क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः । मद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते ॥ १३-१९ ॥ एतत्क्षेत्रज्ञानज्ञेयात्मकं त्रयं यो वेत्ति स एव मद्भक्तः । स च मद्भावमेति ॥ १९ ॥
    slp1: |-
      etatkzetraM taTA jYAnaM jYeyaM coktaM samAsataH . madBakta etadvijYAya madBAvAyopapadyate .. 13-19 .. etatkzetrajYAnajYeyAtmakaM trayaM yo vetti sa eva madBaktaH . sa ca madBAvameti .. 19 ..
    iast: |-
      etatkṣetraṃ tathā jñānaṃ jñeyaṃ coktaṃ samāsataḥ | madbhakta etadvijñāya madbhāvāyopapadyate || 13-19 || etatkṣetrajñānajñeyātmakaṃ trayaṃ yo vetti sa eva madbhaktaḥ | sa ca madbhāvameti || 19 ||
  - verse: 20
    devanagari: |-
      एतल्लक्षणं कृत्वा परीक्षा क्रियते-
      प्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि । विकाराꣳश्च गुणाꣳश्चैव विद्धि प्रकृतिसम्भवान् ॥ १३-२० ॥
      प्रकृतिरप्यनादिः-कारणान्तराभावात् । विकाराः-पटादयः ॥ २० ॥
    slp1: |-
      etallakzaRaM kftvA parIkzA kriyate-
      prakftiM puruzaM cEva vidDyanAdI uBAvapi . vikArAṁSca guRAṁScEva vidDi prakftisamBavAn .. 13-20 ..
      prakftirapyanAdiH-kAraRAntarABAvAt . vikArAH-pawAdayaH .. 20 ..
    iast: |-
      etallakṣaṇaṃ kṛtvā parīkṣā kriyate-
      prakṛtiṃ puruṣaṃ caiva viddhyanādī ubhāvapi | vikārāṁśca guṇāṁścaiva viddhi prakṛtisambhavān || 13-20 ||
      prakṛtirapyanādiḥ-kāraṇāntarābhāvāt | vikārāḥ-paṭādayaḥ || 20 ||
  - verse: 21
    devanagari: |-
      कार्यकरणकर्तृत्वे हेतुः प्रकृतिरुच्यते । पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते ॥ १३-२१ ॥
      प्रकृतिरिति कार्यकारणभावे हेतुः । पुरुषस्तु प्राधान्याद्भोक्ता ॥ २१ ॥
    slp1: |-
      kAryakaraRakartftve hetuH prakftirucyate . puruzaH suKaduHKAnAM Boktftve heturucyate .. 13-21 ..
      prakftiriti kAryakAraRaBAve hetuH . puruzastu prADAnyAdBoktA .. 21 ..
    iast: |-
      kāryakaraṇakartṛtve hetuḥ prakṛtirucyate | puruṣaḥ sukhaduḥkhānāṃ bhoktṛtve heturucyate || 13-21 ||
      prakṛtiriti kāryakāraṇabhāve hetuḥ | puruṣastu prādhānyādbhoktā || 21 ||
  - verse: 22
    devanagari: |-
      पुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान् । कारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु ॥ १३-२२ ॥
      प्रकृतिपुरुषयोः पङ्ग्वन्धवत्किलान्योन्यापेक्षा वृत्तिः ॥ २२ ॥
    slp1: |-
      puruzaH prakftisTo hi BuNkte prakftijAnguRAn . kAraRaM guRasaNgo'sya sadasadyonijanmasu .. 13-22 ..
      prakftipuruzayoH paNgvanDavatkilAnyonyApekzA vfttiH .. 22 ..
    iast: |-
      puruṣaḥ prakṛtistho hi bhuṅkte prakṛtijānguṇān | kāraṇaṃ guṇasaṅgo'sya sadasadyonijanmasu || 13-22 ||
      prakṛtipuruṣayoḥ paṅgvandhavatkilānyonyāpekṣā vṛttiḥ || 22 ||
  - verse: 23
    devanagari: |-
      उपद्रष्टानुमन्ता च भर्ता भोक्ता महेश्वरः । परमात्मेति चाप्युक्तो देहेऽस्मिन्पुरुषः परः ॥ १३-२३ ॥
      अत एवास्य शास्त्रकृद्भिर्नानाकारैर्नामभिरभिधीयते रूपम्-उपद्रष्टा-इत्यादिभिः । अयमत्र तात्पर्यार्थः । प्रकृतिः तद्विकारश्चतुर्दशविधः सर्गः तथा पुरुषः-एतत्सर्वमनादि नित्यं च ब्रह्मतत्त्वाच्छुरितत्वे सति तदनन्यत्वात् ॥ २३ ॥
    slp1: |-
      upadrazwAnumantA ca BartA BoktA maheSvaraH . paramAtmeti cApyukto dehe'sminpuruzaH paraH .. 13-23 ..
      ata evAsya SAstrakfdBirnAnAkArErnAmaBiraBiDIyate rUpam-upadrazwA-ityAdiBiH . ayamatra tAtparyArTaH . prakftiH tadvikAraScaturdaSaviDaH sargaH taTA puruzaH-etatsarvamanAdi nityaM ca brahmatattvAcCuritatve sati tadananyatvAt .. 23 ..
    iast: |-
      upadraṣṭānumantā ca bhartā bhoktā maheśvaraḥ | paramātmeti cāpyukto dehe'sminpuruṣaḥ paraḥ || 13-23 ||
      ata evāsya śāstrakṛdbhirnānākārairnāmabhirabhidhīyate rūpam-upadraṣṭā-ityādibhiḥ | ayamatra tātparyārthaḥ | prakṛtiḥ tadvikāraścaturdaśavidhaḥ sargaḥ tathā puruṣaḥ-etatsarvamanādi nityaṃ ca brahmatattvācchuritatve sati tadananyatvāt || 23 ||
  - verse: 24
    devanagari: |-
      तथा चाह-
      य एवं वेत्ति पुरुषं प्रकृतिं च गुणैः सह । सर्वथा वर्तमानोऽपि न स भूयोऽभिजायते ॥ १३-२४ ॥
      एवम्-अनेन सर्वाभेदरूपेण ब्रह्मदर्शनेन यो योगी प्रकृतिं पुरुषं गुणांश्च तद्विकारान् जानाति । सर्वेण प्रकारेण यथातथा वर्तमानोऽपि स मुक्त एवेत्यर्थः ॥ २४ ॥
    slp1: |-
      taTA cAha-
      ya evaM vetti puruzaM prakftiM ca guREH saha . sarvaTA vartamAno'pi na sa BUyo'BijAyate .. 13-24 ..
      evam-anena sarvABedarUpeRa brahmadarSanena yo yogI prakftiM puruzaM guRAMSca tadvikArAn jAnAti . sarveRa prakAreRa yaTAtaTA vartamAno'pi sa mukta evetyarTaH .. 24 ..
    iast: |-
      tathā cāha-
      ya evaṃ vetti puruṣaṃ prakṛtiṃ ca guṇaiḥ saha | sarvathā vartamāno'pi na sa bhūyo'bhijāyate || 13-24 ||
      evam-anena sarvābhedarūpeṇa brahmadarśanena yo yogī prakṛtiṃ puruṣaṃ guṇāṃśca tadvikārān jānāti | sarveṇa prakāreṇa yathātathā vartamāno'pi sa mukta evetyarthaḥ || 24 ||
  - verse: 25
    devanagari: |-
      ध्यानेनाऽऽत्मनि पश्यन्ति केचिदात्मानमात्मना । अन्ये साङ्ख्येन योगेन कर्मयोगेन चापरे ॥ १३-२५ ॥
    slp1: |-
      DyAnenA''tmani paSyanti kecidAtmAnamAtmanA . anye sANKyena yogena karmayogena cApare .. 13-25 ..
    iast: |-
      dhyānenā''tmani paśyanti kecidātmānamātmanā | anye sāṅkhyena yogena karmayogena cāpare || 13-25 ||
  - verse: 26
    devanagari: |-
      अन्ये त्वेवमजानन्तः श्रुत्वान्येभ्य उपासते । तेऽपि चातितरन्त्येव मृत्युं श्रुतिपरायणाः ॥ १३-२६ ॥
      ईदृशं च ज्ञानं प्रधानं कैश्चिदात्मतया उपास्यते । अन्यैः प्रागुक्तेन सांख्यनयेन । अपरैः कर्मणा । इतरैरपि स्वयमीदृशं ज्ञानमजानद्भिरपि श्रवणप्रवणैर्यथाश्रुतमेवोपास्यते । तेऽपि मृत्युंसंसारं तरन्ति । येनकेनचिदुपायेन भगवत्तत्त्वमुपस्यमानमुत्तारयति । अतः सर्वथैवमासीतेत्युक्तम् ॥ २६ ॥
    slp1: |-
      anye tvevamajAnantaH SrutvAnyeBya upAsate . te'pi cAtitarantyeva mftyuM SrutiparAyaRAH .. 13-26 ..
      IdfSaM ca jYAnaM praDAnaM kEScidAtmatayA upAsyate . anyEH prAguktena sAMKyanayena . aparEH karmaRA . itarErapi svayamIdfSaM jYAnamajAnadBirapi SravaRapravaREryaTASrutamevopAsyate . te'pi mftyuMsaMsAraM taranti . yenakenacidupAyena BagavattattvamupasyamAnamuttArayati . ataH sarvaTEvamAsItetyuktam .. 26 ..
    iast: |-
      anye tvevamajānantaḥ śrutvānyebhya upāsate | te'pi cātitarantyeva mṛtyuṃ śrutiparāyaṇāḥ || 13-26 ||
      īdṛśaṃ ca jñānaṃ pradhānaṃ kaiścidātmatayā upāsyate | anyaiḥ prāguktena sāṃkhyanayena | aparaiḥ karmaṇā | itarairapi svayamīdṛśaṃ jñānamajānadbhirapi śravaṇapravaṇairyathāśrutamevopāsyate | te'pi mṛtyuṃsaṃsāraṃ taranti | yenakenacidupāyena bhagavattattvamupasyamānamuttārayati | ataḥ sarvathaivamāsītetyuktam || 26 ||
  - verse: 27
    devanagari: |-
      यावत्किञ्चित्सम्भवति सत्त्वं स्थावरजङ्गमम् । क्षेत्रक्षेत्रज्ञसंयोगात्तद्विद्धि भरतर्षभ ॥ १३-२७ ॥
      यत्किंचित् चरमचरं च तत्सर्वं क्षेत्रज्ञातिरेकि न संभवतीति ॥ २७ ॥
    slp1: |-
      yAvatkiYcitsamBavati sattvaM sTAvarajaNgamam . kzetrakzetrajYasaMyogAttadvidDi BaratarzaBa .. 13-27 ..
      yatkiMcit caramacaraM ca tatsarvaM kzetrajYAtireki na saMBavatIti .. 27 ..
    iast: |-
      yāvatkiñcitsambhavati sattvaṃ sthāvarajaṅgamam | kṣetrakṣetrajñasaṃyogāttadviddhi bharatarṣabha || 13-27 ||
      yatkiṃcit caramacaraṃ ca tatsarvaṃ kṣetrajñātireki na saṃbhavatīti || 27 ||
  - verse: 28
    devanagari: |-
      समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम् । विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति ॥ १३-२८ ॥
    slp1: |-
      samaM sarvezu BUtezu tizWantaM parameSvaram . vinaSyatsvavinaSyantaM yaH paSyati sa paSyati .. 13-28 ..
    iast: |-
      samaṃ sarveṣu bhūteṣu tiṣṭhantaṃ parameśvaram | vinaśyatsvavinaśyantaṃ yaḥ paśyati sa paśyati || 13-28 ||
  - verse: 29
    devanagari: |-
      अत एव
      समं पश्यन् हि सर्वत्र समवस्थितमीश्वरम् । न हिनस्त्यात्मनात्मानं ततो याति परां गतिम् ॥ १३-२९ ॥
      सर्वत्रैव समबुद्धिर्योगी आत्मानं न हिनस्ति-दुस्तरे संसारार्णवे न पातयति ॥ २९ ॥
    slp1: |-
      ata eva
      samaM paSyan hi sarvatra samavasTitamISvaram . na hinastyAtmanAtmAnaM tato yAti parAM gatim .. 13-29 ..
      sarvatrEva samabudDiryogI AtmAnaM na hinasti-dustare saMsArArRave na pAtayati .. 29 ..
    iast: |-
      ata eva
      samaṃ paśyan hi sarvatra samavasthitamīśvaram | na hinastyātmanātmānaṃ tato yāti parāṃ gatim || 13-29 ||
      sarvatraiva samabuddhiryogī ātmānaṃ na hinasti-dustare saṃsārārṇave na pātayati || 29 ||
  - verse: 30
    devanagari: |-
      प्रकृत्यैव हि कर्माणि क्रियमाणानि सर्वशः । यः पश्यति तथात्मानमकर्तारं स पश्यति ॥ १३-३० ॥
      यस्य हि ईदृशी स्थिरतरा बुद्धिर्भवति-प्रकृतिरेवेदं करोति नाहं किंचित् स सर्वं कुवाणोऽपि न करोति । एवमकर्तृत्वम् ॥ ३० ॥
    slp1: |-
      prakftyEva hi karmARi kriyamARAni sarvaSaH . yaH paSyati taTAtmAnamakartAraM sa paSyati .. 13-30 ..
      yasya hi IdfSI sTiratarA budDirBavati-prakftirevedaM karoti nAhaM kiMcit sa sarvaM kuvARo'pi na karoti . evamakartftvam .. 30 ..
    iast: |-
      prakṛtyaiva hi karmāṇi kriyamāṇāni sarvaśaḥ | yaḥ paśyati tathātmānamakartāraṃ sa paśyati || 13-30 ||
      yasya hi īdṛśī sthiratarā buddhirbhavati-prakṛtirevedaṃ karoti nāhaṃ kiṃcit sa sarvaṃ kuvāṇo'pi na karoti | evamakartṛtvam || 30 ||
  - verse: 31
    devanagari: |-
      यदि वा
      यदा भूतपृथग्भावमेकस्थमुनपश्यति । तत एव च विस्तारं ब्रह्म सम्पद्यते तदा ॥ १३-३१ ॥
    slp1: |-
      yadi vA
      yadA BUtapfTagBAvamekasTamunapaSyati . tata eva ca vistAraM brahma sampadyate tadA .. 13-31 ..
    iast: |-
      yadi vā
      yadā bhūtapṛthagbhāvamekasthamunapaśyati | tata eva ca vistāraṃ brahma sampadyate tadā || 13-31 ||
  - verse: 32
    devanagari: |-
      अनादित्वान्निर्गुणत्वात्परमात्माऽयमव्ययः । शरीरस्थोऽपि कौन्तेय न करोति न लिप्यते ॥ १३-३२ ॥
    slp1: |-
      anAditvAnnirguRatvAtparamAtmA'yamavyayaH . SarIrasTo'pi kOnteya na karoti na lipyate .. 13-32 ..
    iast: |-
      anāditvānnirguṇatvātparamātmā'yamavyayaḥ | śarīrastho'pi kaunteya na karoti na lipyate || 13-32 ||
  - verse: 33
    devanagari: |-
      यथा सर्वगतं सौक्ष्म्यादाकाशं नोपलिप्यते । सर्वत्रावस्थितो देहे तथात्मा नोपलिप्यते ॥ १३-३३ ॥
      विस्तीर्णत्वेन सर्वव्याप्त्या यदा भूतानां पृथक्तां-भिन्नताम् आत्मन्येव पश्यति आत्मन एव चोदितां तां मन्यते । तदापि सर्वकर्तृत्वान्न लेपभाक् । यतोऽसौ परमात्मैव शरीरस्थोऽपि न लिप्यते-आकाशवत् ॥ ३३ ॥
    slp1: |-
      yaTA sarvagataM sOkzmyAdAkASaM nopalipyate . sarvatrAvasTito dehe taTAtmA nopalipyate .. 13-33 ..
      vistIrRatvena sarvavyAptyA yadA BUtAnAM pfTaktAM-BinnatAm Atmanyeva paSyati Atmana eva coditAM tAM manyate . tadApi sarvakartftvAnna lepaBAk . yato'sO paramAtmEva SarIrasTo'pi na lipyate-AkASavat .. 33 ..
    iast: |-
      yathā sarvagataṃ saukṣmyādākāśaṃ nopalipyate | sarvatrāvasthito dehe tathātmā nopalipyate || 13-33 ||
      vistīrṇatvena sarvavyāptyā yadā bhūtānāṃ pṛthaktāṃ-bhinnatām ātmanyeva paśyati ātmana eva coditāṃ tāṃ manyate | tadāpi sarvakartṛtvānna lepabhāk | yato'sau paramātmaiva śarīrastho'pi na lipyate-ākāśavat || 33 ||
  - verse: 34
    devanagari: |-
      यथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः । क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत ॥ १३-३४ ॥
      ननु एकः परमात्मा कथमनेकानि क्षेत्राणि व्याप्नोति ?-इत्याशङ्का प्रसिद्धेन रविणा दृष्टान्तेनापाकृता । कृत्स्नं क्षेत्रं-चराचराणि क्षेत्राणीत्यर्थः ॥ ३४ ॥
    slp1: |-
      yaTA prakASayatyekaH kftsnaM lokamimaM raviH . kzetraM kzetrI taTA kftsnaM prakASayati BArata .. 13-34 ..
      nanu ekaH paramAtmA kaTamanekAni kzetrARi vyApnoti ?-ityASaNkA prasidDena raviRA dfzwAntenApAkftA . kftsnaM kzetraM-carAcarARi kzetrARItyarTaH .. 34 ..
    iast: |-
      yathā prakāśayatyekaḥ kṛtsnaṃ lokamimaṃ raviḥ | kṣetraṃ kṣetrī tathā kṛtsnaṃ prakāśayati bhārata || 13-34 ||
      nanu ekaḥ paramātmā kathamanekāni kṣetrāṇi vyāpnoti ?-ityāśaṅkā prasiddhena raviṇā dṛṣṭāntenāpākṛtā | kṛtsnaṃ kṣetraṃ-carācarāṇi kṣetrāṇītyarthaḥ || 34 ||
  - verse: 35
    devanagari: |-
      क्षेत्रक्षेत्रज्ञयोरेवमन्तरं ज्ञानचक्षुषा । भूतप्रकृतिमोक्षं च ये विदुर्यान्ति ते परम् ॥ १३-३५ ॥
      एवमध्यायेन यदुक्तं ज्ञेयं ज्ञानं क्षेत्रक्षेत्रज्ञयोरन्तरं भूतप्रकृतेश्च स्वल्पात्परिणामधर्मत्वान्मोचनं तत् ये ज्ञानलक्षणेन सर्वत्राप्रतिहतेनालौकिकेन चक्षुषा पश्यन्ति ते वासुदेवतां प्राप्य लभन्त एव परमं शिवमिति शिवम् ॥ ३५ ॥
    slp1: |-
      kzetrakzetrajYayorevamantaraM jYAnacakzuzA . BUtaprakftimokzaM ca ye viduryAnti te param .. 13-35 ..
      evamaDyAyena yaduktaM jYeyaM jYAnaM kzetrakzetrajYayorantaraM BUtaprakfteSca svalpAtpariRAmaDarmatvAnmocanaM tat ye jYAnalakzaRena sarvatrApratihatenAlOkikena cakzuzA paSyanti te vAsudevatAM prApya laBanta eva paramaM Sivamiti Sivam .. 35 ..
    iast: |-
      kṣetrakṣetrajñayorevamantaraṃ jñānacakṣuṣā | bhūtaprakṛtimokṣaṃ ca ye viduryānti te param || 13-35 ||
      evamadhyāyena yaduktaṃ jñeyaṃ jñānaṃ kṣetrakṣetrajñayorantaraṃ bhūtaprakṛteśca svalpātpariṇāmadharmatvānmocanaṃ tat ye jñānalakṣaṇena sarvatrāpratihatenālaukikena cakṣuṣā paśyanti te vāsudevatāṃ prāpya labhanta eva paramaṃ śivamiti śivam || 35 ||
  - verse: 1000
    devanagari: |-
      पुमान्प्रकृतिरित्येष भेदः संमूढचेतसाम् । परिपूर्णास्तु मन्यन्ते निर्मलात्ममयं जगत् ॥ १३ ॥
    slp1: |-
      pumAnprakftirityeza BedaH saMmUQacetasAm . paripUrRAstu manyante nirmalAtmamayaM jagat .. 13 ..
    iast: |-
      pumānprakṛtirityeṣa bhedaḥ saṃmūḍhacetasām | paripūrṇāstu manyante nirmalātmamayaṃ jagat || 13 ||
- chapter: 14
  title_sa: चतुर्दशोऽध्यायः
  title_iast: "caturdaśo'dhyāyaḥ"
  title_en: "Fourteenth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      श्रीभगवानुवाच
      परं भूयः प्रवक्ष्यामि ज्ञानानां ज्ञानमुत्तमम् । यज्ज्ञात्वा मुनयः सर्वे परां सिद्धिमितो गताः ॥ १४-१ ॥
      यदेव पूर्वोक्तं ज्ञानं तदेव पुनः प्रकर्षेण प्रत्येकं गुणस्वरूपनिरूपणया वैतत्येन वक्ष्यामि । यज्ज्ञात्वा-इत्यनेनास्य ज्ञानस्य दृष्टप्रत्ययतां प्रसिद्धिं चाह ॥ १ ॥
    slp1: |-
      SrIBagavAnuvAca
      paraM BUyaH pravakzyAmi jYAnAnAM jYAnamuttamam . yajjYAtvA munayaH sarve parAM sidDimito gatAH .. 14-1 ..
      yadeva pUrvoktaM jYAnaM tadeva punaH prakarzeRa pratyekaM guRasvarUpanirUpaRayA vEtatyena vakzyAmi . yajjYAtvA-ityanenAsya jYAnasya dfzwapratyayatAM prasidDiM cAha .. 1 ..
    iast: |-
      śrībhagavānuvāca
      paraṃ bhūyaḥ pravakṣyāmi jñānānāṃ jñānamuttamam | yajjñātvā munayaḥ sarve parāṃ siddhimito gatāḥ || 14-1 ||
      yadeva pūrvoktaṃ jñānaṃ tadeva punaḥ prakarṣeṇa pratyekaṃ guṇasvarūpanirūpaṇayā vaitatyena vakṣyāmi | yajjñātvā-ityanenāsya jñānasya dṛṣṭapratyayatāṃ prasiddhiṃ cāha || 1 ||
  - verse: 2
    devanagari: |-
      इदं ज्ञानमुपाश्रित्य मम साधर्म्यमागताः । सर्गेऽपि नोपजायन्ते प्रलये न व्यथन्ति च ॥ १४-२ ॥
      व्यथन्तीति-च्छान्दसत्वात्तिङ्प्रत्ययः । एवमन्यत्रापि सुप्तिङ्प्रत्यये वाच्यम् ॥ २ ॥
    slp1: |-
      idaM jYAnamupASritya mama sADarmyamAgatAH . sarge'pi nopajAyante pralaye na vyaTanti ca .. 14-2 ..
      vyaTantIti-cCAndasatvAttiNpratyayaH . evamanyatrApi suptiNpratyaye vAcyam .. 2 ..
    iast: |-
      idaṃ jñānamupāśritya mama sādharmyamāgatāḥ | sarge'pi nopajāyante pralaye na vyathanti ca || 14-2 ||
      vyathantīti-cchāndasatvāttiṅpratyayaḥ | evamanyatrāpi suptiṅpratyaye vācyam || 2 ||
  - verse: 3
    devanagari: |-
      तत्रादौ संसृतौ क्रममाह-
      मम योनिर्महद्ब्रह्म तस्मिन्गर्भं ददाम्यहम् । सम्भवः सर्वभूतानां ततो भवति भारत ॥ १४-३ ॥
      हातव्ये ज्ञाते तत्कारणे च सुकरं हि हानम् । मम-तावदव्यपदेश्यपरमानन्दरूपस्य महद्ब्रम्ह-वृंहकात्मीयशक्तिरूपं ब्रह्म । आत्मीयामेव हि विमर्शशक्तिमालम्ब्याहमनादीनात्माणून् अनुग्रहार्थं संसारयामि ॥ ३ ॥
    slp1: |-
      tatrAdO saMsftO kramamAha-
      mama yonirmahadbrahma tasmingarBaM dadAmyaham . samBavaH sarvaBUtAnAM tato Bavati BArata .. 14-3 ..
      hAtavye jYAte tatkAraRe ca sukaraM hi hAnam . mama-tAvadavyapadeSyaparamAnandarUpasya mahadbramha-vfMhakAtmIyaSaktirUpaM brahma . AtmIyAmeva hi vimarSaSaktimAlambyAhamanAdInAtmARUn anugrahArTaM saMsArayAmi .. 3 ..
    iast: |-
      tatrādau saṃsṛtau kramamāha-
      mama yonirmahadbrahma tasmingarbhaṃ dadāmyaham | sambhavaḥ sarvabhūtānāṃ tato bhavati bhārata || 14-3 ||
      hātavye jñāte tatkāraṇe ca sukaraṃ hi hānam | mama-tāvadavyapadeśyaparamānandarūpasya mahadbramha-vṛṃhakātmīyaśaktirūpaṃ brahma | ātmīyāmeva hi vimarśaśaktimālambyāhamanādīnātmāṇūn anugrahārthaṃ saṃsārayāmi || 3 ||
  - verse: 4
    devanagari: |-
      अत एव-
      सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः । तासां ब्रह्म महद्योनिरहं बीजप्रदः पिता ॥ १४-४ ॥
      सर्वासु योनिषु आदिकारणतया बृंहिका भगवच्छाक्तिः-सकलसंसारवमनस्वभावा माता । पिता त्वहं-शक्तिमानव्यपदेश्यः ॥ ४ ॥
    slp1: |-
      ata eva-
      sarvayonizu kOnteya mUrtayaH samBavanti yAH . tAsAM brahma mahadyonirahaM bIjapradaH pitA .. 14-4 ..
      sarvAsu yonizu AdikAraRatayA bfMhikA BagavacCAktiH-sakalasaMsAravamanasvaBAvA mAtA . pitA tvahaM-SaktimAnavyapadeSyaH .. 4 ..
    iast: |-
      ata eva-
      sarvayoniṣu kaunteya mūrtayaḥ sambhavanti yāḥ | tāsāṃ brahma mahadyonirahaṃ bījapradaḥ pitā || 14-4 ||
      sarvāsu yoniṣu ādikāraṇatayā bṛṃhikā bhagavacchāktiḥ-sakalasaṃsāravamanasvabhāvā mātā | pitā tvahaṃ-śaktimānavyapadeśyaḥ || 4 ||
  - verse: 5
    devanagari: |-
      सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः । निबध्नन्ति महाबाहो देहे देहिनमव्ययम् ॥ १४-५ ॥
      देही चायमात्मतया सत्त्वरजस्तमोभिर्धर्मैरपवर्गपर्यन्ताय भोगाय निबध्येत ॥ ५ ॥
    slp1: |-
      sattvaM rajastama iti guRAH prakftisamBavAH . nibaDnanti mahAbAho dehe dehinamavyayam .. 14-5 ..
      dehI cAyamAtmatayA sattvarajastamoBirDarmErapavargaparyantAya BogAya nibaDyeta .. 5 ..
    iast: |-
      sattvaṃ rajastama iti guṇāḥ prakṛtisambhavāḥ | nibadhnanti mahābāho dehe dehinamavyayam || 14-5 ||
      dehī cāyamātmatayā sattvarajastamobhirdharmairapavargaparyantāya bhogāya nibadhyeta || 5 ||
  - verse: 6
    devanagari: |-
      तत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम् । सुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ ॥ १४-६ ॥
    slp1: |-
      tatra sattvaM nirmalatvAtprakASakamanAmayam . suKasaNgena baDnAti jYAnasaNgena cAnaGa .. 14-6 ..
    iast: |-
      tatra sattvaṃ nirmalatvātprakāśakamanāmayam | sukhasaṅgena badhnāti jñānasaṅgena cānagha || 14-6 ||
  - verse: 7
    devanagari: |-
      रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम् । तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम् ॥ १४-७ ॥
      क्रमेणैषां रूपमुच्यते । सत्त्वं-निर्मलम् । तृष्णा सङ्गस्य समुद्भवो यतः ॥ ७ ॥
    slp1: |-
      rajo rAgAtmakaM vidDi tfzRAsaNgasamudBavam . tannibaDnAti kOnteya karmasaNgena dehinam .. 14-7 ..
      krameREzAM rUpamucyate . sattvaM-nirmalam . tfzRA saNgasya samudBavo yataH .. 7 ..
    iast: |-
      rajo rāgātmakaṃ viddhi tṛṣṇāsaṅgasamudbhavam | tannibadhnāti kaunteya karmasaṅgena dehinam || 14-7 ||
      krameṇaiṣāṃ rūpamucyate | sattvaṃ-nirmalam | tṛṣṇā saṅgasya samudbhavo yataḥ || 7 ||
  - verse: 8
    devanagari: |-
      तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम् । प्रमादालस्यनिद्राभिस्तन्निबध्नानि भारत ॥ १४-८ ॥
      इति । आलस्यं-शुभकरणीयेषु । निःशेषेण द्राणम् कुत्सिता गतिः-निद्रा ॥ ८ ॥
    slp1: |-
      tamastvajYAnajaM vidDi mohanaM sarvadehinAm . pramAdAlasyanidrABistannibaDnAni BArata .. 14-8 ..
      iti . AlasyaM-SuBakaraRIyezu . niHSezeRa drARam kutsitA gatiH-nidrA .. 8 ..
    iast: |-
      tamastvajñānajaṃ viddhi mohanaṃ sarvadehinām | pramādālasyanidrābhistannibadhnāni bhārata || 14-8 ||
      iti | ālasyaṃ-śubhakaraṇīyeṣu | niḥśeṣeṇa drāṇam kutsitā gatiḥ-nidrā || 8 ||
  - verse: 9
    devanagari: |-
      सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत । ज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत ॥ १४-९ ॥
      सञ्जयति-योजयति ॥ ९ ॥
    slp1: |-
      sattvaM suKe saYjayati rajaH karmaRi BArata . jYAnamAvftya tu tamaH pramAde saYjayatyuta .. 14-9 ..
      saYjayati-yojayati .. 9 ..
    iast: |-
      sattvaṃ sukhe sañjayati rajaḥ karmaṇi bhārata | jñānamāvṛtya tu tamaḥ pramāde sañjayatyuta || 14-9 ||
      sañjayati-yojayati || 9 ||
  - verse: 10
    devanagari: |-
      रजस्तमश्चाभिभूय सत्त्वं भवति भारत । रजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा ॥ १४-१० ॥
      इति ॥ १० ॥
    slp1: |-
      rajastamaScABiBUya sattvaM Bavati BArata . rajaH sattvaM tamaScEva tamaH sattvaM rajastaTA .. 14-10 ..
      iti .. 10 ..
    iast: |-
      rajastamaścābhibhūya sattvaṃ bhavati bhārata | rajaḥ sattvaṃ tamaścaiva tamaḥ sattvaṃ rajastathā || 14-10 ||
      iti || 10 ||
  - verse: 11
    devanagari: |-
      प्। २८८)
      सर्वद्वारेषु देहेऽस्मिन्प्रकाशमुपजायते । ज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत ॥ १४-११ ॥
    slp1: |-
      p. 288)
      sarvadvArezu dehe'sminprakASamupajAyate . jYAnaM yadA tadA vidyAdvivfdDaM sattvamityuta .. 14-11 ..
    iast: |-
      p. 288)
      sarvadvāreṣu dehe'sminprakāśamupajāyate | jñānaṃ yadā tadā vidyādvivṛddhaṃ sattvamityuta || 14-11 ||
  - verse: 12
    devanagari: |-
      लोभः प्रवृत्तिरारम्भः कर्मणामशमश्च तृट् । रजस्येतानि जायन्ते विवृद्धे भरतर्षभ ॥ १४-१२ ॥
    slp1: |-
      loBaH pravfttirAramBaH karmaRAmaSamaSca tfw . rajasyetAni jAyante vivfdDe BaratarzaBa .. 14-12 ..
    iast: |-
      lobhaḥ pravṛttirārambhaḥ karmaṇāmaśamaśca tṛṭ | rajasyetāni jāyante vivṛddhe bharatarṣabha || 14-12 ||
  - verse: 13
    devanagari: |-
      अप्रकाशोऽप्रवृत्तिश्च प्रमादो मोह एव च । तमस्येतानि जायन्ते विवृद्धे कुरुनन्दन ॥ १४-१३ ॥
      सर्वद्वारेषु-सर्वेन्द्रियेषु । लोभादयः क्रमेणैव रजस्युद्रिच्यमाने जायन्ते । एवमप्रकाशादयः क्रमेणैव तमोविवृद्धावाविर्भवन्ति ॥ १३ ॥
    slp1: |-
      aprakASo'pravfttiSca pramAdo moha eva ca . tamasyetAni jAyante vivfdDe kurunandana .. 14-13 ..
      sarvadvArezu-sarvendriyezu . loBAdayaH krameREva rajasyudricyamAne jAyante . evamaprakASAdayaH krameREva tamovivfdDAvAvirBavanti .. 13 ..
    iast: |-
      aprakāśo'pravṛttiśca pramādo moha eva ca | tamasyetāni jāyante vivṛddhe kurunandana || 14-13 ||
      sarvadvāreṣu-sarvendriyeṣu | lobhādayaḥ krameṇaiva rajasyudricyamāne jāyante | evamaprakāśādayaḥ krameṇaiva tamovivṛddhāvāvirbhavanti || 13 ||
  - verse: 14
    devanagari: |-
      यदा सत्त्वे प्रवृद्धे तु प्रलयं याति देहभृत् । तदोत्तमविदां लोकानमलान्प्रतिपद्यते ॥ १४-१४ ॥
      यदा समग्रेणैव जन्मनानवरतसात्त्विकव्यापाराभ्यासात्सत्त्वं विवृद्धं भवति तदा प्राप्तप्रलयस्य शुभलोकावाप्तिः ॥ १४ ॥
    slp1: |-
      yadA sattve pravfdDe tu pralayaM yAti dehaBft . tadottamavidAM lokAnamalAnpratipadyate .. 14-14 ..
      yadA samagreREva janmanAnavaratasAttvikavyApArAByAsAtsattvaM vivfdDaM Bavati tadA prAptapralayasya SuBalokAvAptiH .. 14 ..
    iast: |-
      yadā sattve pravṛddhe tu pralayaṃ yāti dehabhṛt | tadottamavidāṃ lokānamalānpratipadyate || 14-14 ||
      yadā samagreṇaiva janmanānavaratasāttvikavyāpārābhyāsātsattvaṃ vivṛddhaṃ bhavati tadā prāptapralayasya śubhalokāvāptiḥ || 14 ||
  - verse: 15
    devanagari: |-
      रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते । तथा प्रलीनस्तमसि मूढयोनिषु जायते ॥ १४-१५ ॥
      एवं जन्माभ्यस्तराजसकर्मणः प्रयाणात् विमिश्रोपभोगाय मानुप्यावाप्तिः । तथा-तेनैव क्रमेण यदा समग्रेण जन्मना तामसमेव कर्माभ्यस्यते तदा नरकतिर्यग्वृक्षादिदेहेषूत्पद्यते । ये तु व्याचक्षते-मरणकाल एव सत्त्वादौ विवृद्धे एतानि फलानि-इति । ते न सम्यक्शारीरेऽनुभवे प्रविष्टाः । यतः सर्वस्यैव सर्वथान्त्ये क्षणे मोह एवोपजायते । अस्मद्व्याख्यायां च संवादीनीमानि श्लोकान्तराणि ॥ १५ ॥
    slp1: |-
      rajasi pralayaM gatvA karmasaNgizu jAyate . taTA pralInastamasi mUQayonizu jAyate .. 14-15 ..
      evaM janmAByastarAjasakarmaRaH prayARAt vimiSropaBogAya mAnupyAvAptiH . taTA-tenEva krameRa yadA samagreRa janmanA tAmasameva karmAByasyate tadA narakatiryagvfkzAdidehezUtpadyate . ye tu vyAcakzate-maraRakAla eva sattvAdO vivfdDe etAni PalAni-iti . te na samyakSArIre'nuBave pravizwAH . yataH sarvasyEva sarvaTAntye kzaRe moha evopajAyate . asmadvyAKyAyAM ca saMvAdInImAni SlokAntarARi .. 15 ..
    iast: |-
      rajasi pralayaṃ gatvā karmasaṅgiṣu jāyate | tathā pralīnastamasi mūḍhayoniṣu jāyate || 14-15 ||
      evaṃ janmābhyastarājasakarmaṇaḥ prayāṇāt vimiśropabhogāya mānupyāvāptiḥ | tathā-tenaiva krameṇa yadā samagreṇa janmanā tāmasameva karmābhyasyate tadā narakatiryagvṛkṣādideheṣūtpadyate | ye tu vyācakṣate-maraṇakāla eva sattvādau vivṛddhe etāni phalāni-iti | te na samyakśārīre'nubhave praviṣṭāḥ | yataḥ sarvasyaiva sarvathāntye kṣaṇe moha evopajāyate | asmadvyākhyāyāṃ ca saṃvādīnīmāni ślokāntarāṇi || 15 ||
  - verse: 16
    devanagari: |-
      कर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम् । रजसस्तु फलं दुःखमज्ञानं तमसः फलम् ॥ १४-१६ ॥
    slp1: |-
      karmaRaH sukftasyAhuH sAttvikaM nirmalaM Palam . rajasastu PalaM duHKamajYAnaM tamasaH Palam .. 14-16 ..
    iast: |-
      karmaṇaḥ sukṛtasyāhuḥ sāttvikaṃ nirmalaṃ phalam | rajasastu phalaṃ duḥkhamajñānaṃ tamasaḥ phalam || 14-16 ||
  - verse: 17
    devanagari: |-
      सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च । प्रमादमोहौ जायेते तमसोऽज्ञानमेव च ॥ १४-१७ ॥
    slp1: |-
      sattvAtsaYjAyate jYAnaM rajaso loBa eva ca . pramAdamohO jAyete tamaso'jYAnameva ca .. 14-17 ..
    iast: |-
      sattvātsañjāyate jñānaṃ rajaso lobha eva ca | pramādamohau jāyete tamaso'jñānameva ca || 14-17 ||
  - verse: 18
    devanagari: |-
      ऊर्ध्वं गच्छन्ति सत्त्वस्था मध्ये तिष्ठन्ति राजसाः । जघन्यगुणवृत्तिस्था अधो गछन्ति तामसाः ॥ १४-१८ ॥
    slp1: |-
      UrDvaM gacCanti sattvasTA maDye tizWanti rAjasAH . jaGanyaguRavfttisTA aDo gaCanti tAmasAH .. 14-18 ..
    iast: |-
      ūrdhvaṃ gacchanti sattvasthā madhye tiṣṭhanti rājasāḥ | jaghanyaguṇavṛttisthā adho gachanti tāmasāḥ || 14-18 ||
  - verse: 19
    devanagari: |-
      नान्यं गुणेभ्यः कर्तारं यदा द्रष्टाऽनुपश्यति । गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति ॥ १४-१९ ॥
    slp1: |-
      nAnyaM guReByaH kartAraM yadA drazwA'nupaSyati . guReByaSca paraM vetti madBAvaM so'DigacCati .. 14-19 ..
    iast: |-
      nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭā'nupaśyati | guṇebhyaśca paraṃ vetti madbhāvaṃ so'dhigacchati || 14-19 ||
  - verse: 20
    devanagari: |-
      गुणानेतानतीत्य त्रीन्देही देहसमुद्भवान् । जन्ममृत्युजरादुःखैर्विमुक्तोऽमृतमश्नुते ॥ १४-२० ॥
      अत्र केचिदसंबद्धाः श्लोकाः कल्पिताः पुनरुक्तत्वात्ते त्जाज्या एव । एतद्गुणातीतवृत्तिस्तु मोक्षायैव कल्पते ॥ २० ॥
    slp1: |-
      guRAnetAnatItya trIndehI dehasamudBavAn . janmamftyujarAduHKErvimukto'mftamaSnute .. 14-20 ..
      atra kecidasaMbadDAH SlokAH kalpitAH punaruktatvAtte tjAjyA eva . etadguRAtItavfttistu mokzAyEva kalpate .. 20 ..
    iast: |-
      guṇānetānatītya trīndehī dehasamudbhavān | janmamṛtyujarāduḥkhairvimukto'mṛtamaśnute || 14-20 ||
      atra kecidasaṃbaddhāḥ ślokāḥ kalpitāḥ punaruktatvātte tjājyā eva | etadguṇātītavṛttistu mokṣāyaiva kalpate || 20 ||
  - verse: 21
    devanagari: |-
      ननु यदि अयं देही तत्कथं गुणातीतो भवति । सर्वथैव हि कयाचिच्चित्तवृत्त्या वर्तते सा च त्रैगुण्यादन्यतमा अवश्यं भवति ?-अनेनाभिप्रायेण पृच्छति अर्जुनः
      अर्जुन उवाच
      कैर्लिङ्गैस्त्रीन्गुणानेतानतीतो भवति प्रभो । किमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते ॥ १४-२१ ॥
    slp1: |-
      nanu yadi ayaM dehI tatkaTaM guRAtIto Bavati . sarvaTEva hi kayAciccittavfttyA vartate sA ca trEguRyAdanyatamA avaSyaM Bavati ?-anenABiprAyeRa pfcCati arjunaH
      arjuna uvAca
      kErliNgEstrInguRAnetAnatIto Bavati praBo . kimAcAraH kaTaM cEtAMstrInguRAnativartate .. 14-21 ..
    iast: |-
      nanu yadi ayaṃ dehī tatkathaṃ guṇātīto bhavati | sarvathaiva hi kayāciccittavṛttyā vartate sā ca traiguṇyādanyatamā avaśyaṃ bhavati ?-anenābhiprāyeṇa pṛcchati arjunaḥ
      arjuna uvāca
      kairliṅgaistrīnguṇānetānatīto bhavati prabho | kimācāraḥ kathaṃ caitāṃstrīnguṇānativartate || 14-21 ||
  - verse: 22
    devanagari: |-
      अत्रोत्तरं-
      शीभगवानुवाच
      प्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव । न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति ॥ १४-२२ ॥
      यद्यपि प्रकाशादिकाः सर्वेषु धर्मेषु वर्तन्ते तथापि योगिनस्तेषु प्रकाशादिषु न रज्यन्ते नापि द्वेषवन्तो भवन्ति । अपितु केवलपिण्डधर्मतयैते स्थिताः न मां क्षोभयितुमलम्-इति मन्वाना गुणातीता भवन्ति ॥ २२ ॥
    slp1: |-
      atrottaraM-
      SIBagavAnuvAca
      prakASaM ca pravfttiM ca mohameva ca pARqava . na dvezwi sampravfttAni na nivfttAni kANkzati .. 14-22 ..
      yadyapi prakASAdikAH sarvezu Darmezu vartante taTApi yoginastezu prakASAdizu na rajyante nApi dvezavanto Bavanti . apitu kevalapiRqaDarmatayEte sTitAH na mAM kzoBayitumalam-iti manvAnA guRAtItA Bavanti .. 22 ..
    iast: |-
      atrottaraṃ-
      śībhagavānuvāca
      prakāśaṃ ca pravṛttiṃ ca mohameva ca pāṇḍava | na dveṣṭi sampravṛttāni na nivṛttāni kāṅkṣati || 14-22 ||
      yadyapi prakāśādikāḥ sarveṣu dharmeṣu vartante tathāpi yoginasteṣu prakāśādiṣu na rajyante nāpi dveṣavanto bhavanti | apitu kevalapiṇḍadharmatayaite sthitāḥ na māṃ kṣobhayitumalam-iti manvānā guṇātītā bhavanti || 22 ||
  - verse: 23
    devanagari: |-
      अत एवाह-
      उदासीनवदासीनो गुणैर्यो न विचाल्यते । गुणा वर्तन्ते इत्येव योऽज्ञस्तिष्ठति नेङ्गते ॥ १४-२३ ॥
    slp1: |-
      ata evAha-
      udAsInavadAsIno guREryo na vicAlyate . guRA vartante ityeva yo'jYastizWati neNgate .. 14-23 ..
    iast: |-
      ata evāha-
      udāsīnavadāsīno guṇairyo na vicālyate | guṇā vartante ityeva yo'jñastiṣṭhati neṅgate || 14-23 ||
  - verse: 24
    devanagari: |-
      समदुःखसुखःस्वप्नः समलोष्टाश्मकाञ्चनः । तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः ॥ १४-२४ ॥
    slp1: |-
      samaduHKasuKaHsvapnaH samalozwASmakAYcanaH . tulyapriyApriyo DIrastulyanindAtmasaMstutiH .. 14-24 ..
    iast: |-
      samaduḥkhasukhaḥsvapnaḥ samaloṣṭāśmakāñcanaḥ | tulyapriyāpriyo dhīrastulyanindātmasaṃstutiḥ || 14-24 ||
  - verse: 25
    devanagari: |-
      मानावमानयोस्तुल्यस्तुल्यो मित्रापरिपक्षयोः । सर्वारम्भफलत्यागी गुणातीतः स उच्यते ॥ १४-२५ ॥
      यः अज्ञो निर्विवेकस्तिष्ठति स एव ज्ञः-सम्यग्ज्ञानात् । तथा हि । नेङ्गते-न स्वरूपाच्च्यवते । अत्र चोपायः-शरीरेन्द्रियादिस्वभाव एष यत्प्रवर्तनम् नतु फलं किंचिदहमभिसन्दध इति स्थिरा बुद्धिः ॥ २५ ॥
    slp1: |-
      mAnAvamAnayostulyastulyo mitrAparipakzayoH . sarvAramBaPalatyAgI guRAtItaH sa ucyate .. 14-25 ..
      yaH ajYo nirvivekastizWati sa eva jYaH-samyagjYAnAt . taTA hi . neNgate-na svarUpAccyavate . atra copAyaH-SarIrendriyAdisvaBAva eza yatpravartanam natu PalaM kiMcidahamaBisandaDa iti sTirA budDiH .. 25 ..
    iast: |-
      mānāvamānayostulyastulyo mitrāparipakṣayoḥ | sarvārambhaphalatyāgī guṇātītaḥ sa ucyate || 14-25 ||
      yaḥ ajño nirvivekastiṣṭhati sa eva jñaḥ-samyagjñānāt | tathā hi | neṅgate-na svarūpāccyavate | atra copāyaḥ-śarīrendriyādisvabhāva eṣa yatpravartanam natu phalaṃ kiṃcidahamabhisandadha iti sthirā buddhiḥ || 25 ||
  - verse: 26
    devanagari: |-
      मां च योऽव्यभिचारेण भक्तियोगेन सेवते । स गुणान्समतीत्यैतान्ब्रह्मभूयाय कल्पते ॥ १४-२६ ॥
      अनेन मूलभूतमुपायमुपदिशति मां चेति । चशब्दोऽवधारणे यो मामेव सेवते । अनेन-फलादिसाकाङ्क्षो मामङ्गत्वेना श्रयति फलं प्रधानतया-इति निरन्तः । अत एव नास्याव्यभिचारिणी मक्तिः-फलं प्रति ह्यसावास्थावानिति । यस्तु फलं किंचिदप्यनभिलष्यन् किमेतदलीकमनुतिष्ठसि-इति पर्यनुयुज्यमानोऽपि निरन्तरभगवद्भक्तिवेधविद्रुतान्तःकरणतया कण्टकितरोमवान् वेपमानतनुर्विस्फारितनयनयुगलपरिवर्तमानसलिलसंपातः तूष्णींभावेनैवोत्तरं प्रयच्छति । स एवाव्यभिचारिण्या भगवतो महेश्वरस्याग्रशक्त्या भक्त्या पवित्रीकृतो नान्य इति ज्ञेयम् ॥ २६ ॥
    slp1: |-
      mAM ca yo'vyaBicAreRa Baktiyogena sevate . sa guRAnsamatItyEtAnbrahmaBUyAya kalpate .. 14-26 ..
      anena mUlaBUtamupAyamupadiSati mAM ceti . caSabdo'vaDAraRe yo mAmeva sevate . anena-PalAdisAkANkzo mAmaNgatvenA Srayati PalaM praDAnatayA-iti nirantaH . ata eva nAsyAvyaBicAriRI maktiH-PalaM prati hyasAvAsTAvAniti . yastu PalaM kiMcidapyanaBilazyan kimetadalIkamanutizWasi-iti paryanuyujyamAno'pi nirantaraBagavadBaktiveDavidrutAntaHkaraRatayA kaRwakitaromavAn vepamAnatanurvisPAritanayanayugalaparivartamAnasalilasaMpAtaH tUzRIMBAvenEvottaraM prayacCati . sa evAvyaBicAriRyA Bagavato maheSvarasyAgraSaktyA BaktyA pavitrIkfto nAnya iti jYeyam .. 26 ..
    iast: |-
      māṃ ca yo'vyabhicāreṇa bhaktiyogena sevate | sa guṇānsamatītyaitānbrahmabhūyāya kalpate || 14-26 ||
      anena mūlabhūtamupāyamupadiśati māṃ ceti | caśabdo'vadhāraṇe yo māmeva sevate | anena-phalādisākāṅkṣo māmaṅgatvenā śrayati phalaṃ pradhānatayā-iti nirantaḥ | ata eva nāsyāvyabhicāriṇī maktiḥ-phalaṃ prati hyasāvāsthāvāniti | yastu phalaṃ kiṃcidapyanabhilaṣyan kimetadalīkamanutiṣṭhasi-iti paryanuyujyamāno'pi nirantarabhagavadbhaktivedhavidrutāntaḥkaraṇatayā kaṇṭakitaromavān vepamānatanurvisphāritanayanayugalaparivartamānasalilasaṃpātaḥ tūṣṇīṃbhāvenaivottaraṃ prayacchati | sa evāvyabhicāriṇyā bhagavato maheśvarasyāgraśaktyā bhaktyā pavitrīkṛto nānya iti jñeyam || 26 ||
  - verse: 27
    devanagari: |-
      ब्रह्मणो हि प्रतिष्ठाहममृतस्याव्ययस्य च । शाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य च ॥ १४-२७ ॥
      अहमेव हि ब्रह्मणः प्रतिष्ठा । मयि सेव्यमाने ब्रह्म भवति अन्यथा जडरूपतया ब्रह्म उपास्यमानं मोक्षमपि सौषुप्तादविशिष्टमेव प्रापयेदिति शिवम् ॥ २७ ॥
    slp1: |-
      brahmaRo hi pratizWAhamamftasyAvyayasya ca . SASvatasya ca Darmasya suKasyEkAntikasya ca .. 14-27 ..
      ahameva hi brahmaRaH pratizWA . mayi sevyamAne brahma Bavati anyaTA jaqarUpatayA brahma upAsyamAnaM mokzamapi sOzuptAdaviSizwameva prApayediti Sivam .. 27 ..
    iast: |-
      brahmaṇo hi pratiṣṭhāhamamṛtasyāvyayasya ca | śāśvatasya ca dharmasya sukhasyaikāntikasya ca || 14-27 ||
      ahameva hi brahmaṇaḥ pratiṣṭhā | mayi sevyamāne brahma bhavati anyathā jaḍarūpatayā brahma upāsyamānaṃ mokṣamapi sauṣuptādaviśiṣṭameva prāpayediti śivam || 27 ||
  - verse: 1000
    devanagari: |-
      लसद्भक्तिरसावेशहीनाहंकारविभ्रमः । स्थितेऽपि गुणसंमर्दे गुणातीतः समो यतिः ॥ १४ ॥
    slp1: |-
      lasadBaktirasAveSahInAhaMkAraviBramaH . sTite'pi guRasaMmarde guRAtItaH samo yatiH .. 14 ..
    iast: |-
      lasadbhaktirasāveśahīnāhaṃkāravibhramaḥ | sthite'pi guṇasaṃmarde guṇātītaḥ samo yatiḥ || 14 ||
- chapter: 15
  title_sa: पञ्चदशोऽध्यायः
  title_iast: "pañcadaśo'dhyāyaḥ"
  title_en: "Fifteenth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      श्रीभगवानुवाच
      ऊर्ध्वमूलमधः शाखमश्वत्थं प्राहुरव्ययम् । छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित् ॥ १५-१ ॥
      अनेन शास्त्रान्तरेषु यदुच्यते-अश्वत्थः सर्वं स एवोपासनीयः-इत्यादि तस्य भगवद्भह्योपासा तात्पर्यमित्युच्यते । मूलंप्रशान्तं रूपम् । तत् ऊर्ध्वं-सर्वतो हि निवृत्तस्य तदाप्तिः । छन्दांसि पर्णानीति-यथा वृक्षस्य मानत्वफलवत्त्वसरसतादयः पर्णैः सूच्यन्ते एवं ब्रह्मतत्त्वस्य वेदोपलक्षितशास्त्रद्वारिका प्रतीतिरित्याख्यायते ॥ १ ॥
    slp1: |-
      SrIBagavAnuvAca
      UrDvamUlamaDaH SAKamaSvatTaM prAhuravyayam . CandAMsi yasya parRAni yastaM veda sa vedavit .. 15-1 ..
      anena SAstrAntarezu yaducyate-aSvatTaH sarvaM sa evopAsanIyaH-ityAdi tasya BagavadBahyopAsA tAtparyamityucyate . mUlaMpraSAntaM rUpam . tat UrDvaM-sarvato hi nivfttasya tadAptiH . CandAMsi parRAnIti-yaTA vfkzasya mAnatvaPalavattvasarasatAdayaH parREH sUcyante evaM brahmatattvasya vedopalakzitaSAstradvArikA pratItirityAKyAyate .. 1 ..
    iast: |-
      śrībhagavānuvāca
      ūrdhvamūlamadhaḥ śākhamaśvatthaṃ prāhuravyayam | chandāṃsi yasya parṇāni yastaṃ veda sa vedavit || 15-1 ||
      anena śāstrāntareṣu yaducyate-aśvatthaḥ sarvaṃ sa evopāsanīyaḥ-ityādi tasya bhagavadbhahyopāsā tātparyamityucyate | mūlaṃpraśāntaṃ rūpam | tat ūrdhvaṃ-sarvato hi nivṛttasya tadāptiḥ | chandāṃsi parṇānīti-yathā vṛkṣasya mānatvaphalavattvasarasatādayaḥ parṇaiḥ sūcyante evaṃ brahmatattvasya vedopalakṣitaśāstradvārikā pratītirityākhyāyate || 1 ||
  - verse: 2
    devanagari: |-
      अधश्चोर्ध्वं प्रसृता यस्य शाखा गुणप्रवृद्धा विषयप्रवालाः । अधश्च मूलान्यनुसन्ततानि कर्मानुबन्धीनि मनुष्यलोके ॥ १५-२ ॥
    slp1: |-
      aDaScorDvaM prasftA yasya SAKA guRapravfdDA vizayapravAlAH . aDaSca mUlAnyanusantatAni karmAnubanDIni manuzyaloke .. 15-2 ..
    iast: |-
      adhaścordhvaṃ prasṛtā yasya śākhā guṇapravṛddhā viṣayapravālāḥ | adhaśca mūlānyanusantatāni karmānubandhīni manuṣyaloke || 15-2 ||
  - verse: 3
    devanagari: |-
      न रूपमस्येह तथोपलभ्यते नान्तो न चादिर्न च सम्प्रतिष्ठा । अश्वत्थमेनं सुविरूढमूल- मसङ्गशस्त्रेण शितेन च्छित्त्वा ॥ १५-३ ॥
    slp1: |-
      na rUpamasyeha taTopalaByate nAnto na cAdirna ca sampratizWA . aSvatTamenaM suvirUQamUla- masaNgaSastreRa Sitena cCittvA .. 15-3 ..
    iast: |-
      na rūpamasyeha tathopalabhyate nānto na cādirna ca sampratiṣṭhā | aśvatthamenaṃ suvirūḍhamūla- masaṅgaśastreṇa śitena cchittvā || 15-3 ||
  - verse: 4
    devanagari: |-
      ततः पदं तत्परिमार्गितव्यं यस्मिन्गतो न निवर्तेत भूयः । तमेव चाद्यं पुरुषं प्रपद्ये- द्यतः प्रवृत्तिः प्रसृता पुराणी ॥ १५-४ ॥
    slp1: |-
      tataH padaM tatparimArgitavyaM yasmingato na nivarteta BUyaH . tameva cAdyaM puruzaM prapadye- dyataH pravfttiH prasftA purARI .. 15-4 ..
    iast: |-
      tataḥ padaṃ tatparimārgitavyaṃ yasmingato na nivarteta bhūyaḥ | tameva cādyaṃ puruṣaṃ prapadye- dyataḥ pravṛttiḥ prasṛtā purāṇī || 15-4 ||
  - verse: 5
    devanagari: |-
      निर्मानमोहा जितसङ्गदोषा अध्यात्मनित्या विनिवृत्तकामाः । द्वन्द्वैर्विमुक्ताः सुखदुःखसंज्ञै- र्गच्छन्त्यमूढाः पदमव्ययं तत् ॥ १५-५ ॥
      गुणैः-सत्त्वादिभिः । प्रवृद्धाः-देवादिस्थावरान्ततया । तस्य च शुभाशुभात्मकानि कर्माणि अघस्तनमूलानि । तं छित्त्वेति-विशेष्ये क्रियाभिधीयमाना सामर्थ्यादत्र विशेषणपदमुपादत्ते दण्डी प्रैष्याननुब्रूयात्-इति विधिवत् । तेनाधोरूढानि मूलान्यस्य च्छिन्द्यादिति । तत्-पदं-प्रशान्तम् अव्ययं पदं तदेव ॥ ५ ॥
    slp1: |-
      nirmAnamohA jitasaNgadozA aDyAtmanityA vinivfttakAmAH . dvandvErvimuktAH suKaduHKasaMjYE- rgacCantyamUQAH padamavyayaM tat .. 15-5 ..
      guREH-sattvAdiBiH . pravfdDAH-devAdisTAvarAntatayA . tasya ca SuBASuBAtmakAni karmARi aGastanamUlAni . taM Cittveti-viSezye kriyABiDIyamAnA sAmarTyAdatra viSezaRapadamupAdatte daRqI prEzyAnanubrUyAt-iti viDivat . tenADorUQAni mUlAnyasya cCindyAditi . tat-padaM-praSAntam avyayaM padaM tadeva .. 5 ..
    iast: |-
      nirmānamohā jitasaṅgadoṣā adhyātmanityā vinivṛttakāmāḥ | dvandvairvimuktāḥ sukhaduḥkhasaṃjñai- rgacchantyamūḍhāḥ padamavyayaṃ tat || 15-5 ||
      guṇaiḥ-sattvādibhiḥ | pravṛddhāḥ-devādisthāvarāntatayā | tasya ca śubhāśubhātmakāni karmāṇi aghastanamūlāni | taṃ chittveti-viśeṣye kriyābhidhīyamānā sāmarthyādatra viśeṣaṇapadamupādatte daṇḍī praiṣyānanubrūyāt-iti vidhivat | tenādhorūḍhāni mūlānyasya cchindyāditi | tat-padaṃ-praśāntam avyayaṃ padaṃ tadeva || 5 ||
  - verse: 6
    devanagari: |-
      न तद्भासयते सूर्यो न शशाङ्को न पावकः । यद्गत्वा न निवर्तन्ते तद्धाम परमं मम ॥ १५-६ ॥
      सूर्यादीनां तत्रानवकाशः । तेषां कालाद्यवच्छेदात् वेद्यत्वात् करणोपकारकत्वात् । तस्य तु दिक्कालाद्यनवच्छेदात् वेदकत्वात् करणप्रवर्तकत्वात्-तदतीतत्वात् ॥ ६ ॥
    slp1: |-
      na tadBAsayate sUryo na SaSANko na pAvakaH . yadgatvA na nivartante tadDAma paramaM mama .. 15-6 ..
      sUryAdInAM tatrAnavakASaH . tezAM kAlAdyavacCedAt vedyatvAt karaRopakArakatvAt . tasya tu dikkAlAdyanavacCedAt vedakatvAt karaRapravartakatvAt-tadatItatvAt .. 6 ..
    iast: |-
      na tadbhāsayate sūryo na śaśāṅko na pāvakaḥ | yadgatvā na nivartante taddhāma paramaṃ mama || 15-6 ||
      sūryādīnāṃ tatrānavakāśaḥ | teṣāṃ kālādyavacchedāt vedyatvāt karaṇopakārakatvāt | tasya tu dikkālādyanavacchedāt vedakatvāt karaṇapravartakatvāt-tadatītatvāt || 6 ||
  - verse: 7
    devanagari: |-
      ममैवांशो जीवलोके जीवभूतः सनातनः । मनः षष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति ॥ १५-७ ॥
      इति हि श्रुतिः । एषैव चौपचारिकता यथावसरं योजनीयेति न विप्रतिपत्तव्यम् ॥ ७ ॥
    slp1: |-
      mamEvAMSo jIvaloke jIvaBUtaH sanAtanaH . manaH zazWAnIndriyARi prakftisTAni karzati .. 15-7 ..
      iti hi SrutiH . ezEva cOpacArikatA yaTAvasaraM yojanIyeti na vipratipattavyam .. 7 ..
    iast: |-
      mamaivāṃśo jīvaloke jīvabhūtaḥ sanātanaḥ | manaḥ ṣaṣṭhānīndriyāṇi prakṛtisthāni karṣati || 15-7 ||
      iti hi śrutiḥ | eṣaiva caupacārikatā yathāvasaraṃ yojanīyeti na vipratipattavyam || 7 ||
  - verse: 8
    devanagari: |-
      शरीरं यदवाप्नोति यच्चाप्युत्क्रामतीश्वरः । गृहीत्वैतानि संयति वायुर्गन्धानिवाशयात् ॥ १५-८ ॥
      अवाप्नोति-गृह्णाति । उत्क्रामति-त्यजति । एतैः सह । यथा वायुः सर्वगतो विश्रान्तिधाम पार्थिवं प्राप्य ततो गन्धमानीय स्थानान्तरे तत्सहित एव संक्रामति एवं जीवः पुर्यष्टकेन सह । एवं सृष्टौ संहारे चैतैः साहित्यमस्योक्त्वा स्थितावपि स्थानासनमननादिरूपायां विषयग्रहणात्मिकायां तत्सहितस्यैवास्य व्यापार इति निश्चीयते ॥ ८ ॥
    slp1: |-
      SarIraM yadavApnoti yaccApyutkrAmatISvaraH . gfhItvEtAni saMyati vAyurganDAnivASayAt .. 15-8 ..
      avApnoti-gfhRAti . utkrAmati-tyajati . etEH saha . yaTA vAyuH sarvagato viSrAntiDAma pArTivaM prApya tato ganDamAnIya sTAnAntare tatsahita eva saMkrAmati evaM jIvaH puryazwakena saha . evaM sfzwO saMhAre cEtEH sAhityamasyoktvA sTitAvapi sTAnAsanamananAdirUpAyAM vizayagrahaRAtmikAyAM tatsahitasyEvAsya vyApAra iti niScIyate .. 8 ..
    iast: |-
      śarīraṃ yadavāpnoti yaccāpyutkrāmatīśvaraḥ | gṛhītvaitāni saṃyati vāyurgandhānivāśayāt || 15-8 ||
      avāpnoti-gṛhṇāti | utkrāmati-tyajati | etaiḥ saha | yathā vāyuḥ sarvagato viśrāntidhāma pārthivaṃ prāpya tato gandhamānīya sthānāntare tatsahita eva saṃkrāmati evaṃ jīvaḥ puryaṣṭakena saha | evaṃ sṛṣṭau saṃhāre caitaiḥ sāhityamasyoktvā sthitāvapi sthānāsanamananādirūpāyāṃ viṣayagrahaṇātmikāyāṃ tatsahitasyaivāsya vyāpāra iti niścīyate || 8 ||
  - verse: 9
    devanagari: |-
      श्रोत्रं चक्षुः स्पर्शनं च रसनं घ्राणमेव च । अधिष्ठाय मनश्चायं विषयानुपसेवते ॥ १५-९ ॥
    slp1: |-
      SrotraM cakzuH sparSanaM ca rasanaM GrARameva ca . aDizWAya manaScAyaM vizayAnupasevate .. 15-9 ..
    iast: |-
      śrotraṃ cakṣuḥ sparśanaṃ ca rasanaṃ ghrāṇameva ca | adhiṣṭhāya manaścāyaṃ viṣayānupasevate || 15-9 ||
  - verse: 10
    devanagari: |-
      तिष्ठन्तमुत्क्रामन्तं वा भुञ्जानं वा गुणान्वितम् । विमूढा नानुपश्यन्ति पश्यन्ति ज्ञानचक्षुषः ॥ १५-१० ॥
      मन इत्यनेनान्तःकरणमुपलक्ष्यते । अत एव शरीरस्थितियोगात्तिष्ठन्तम् । शरीरान्तरग्रहणाय उत्क्रामन्तम् । विषयान्वा भुञ्जानं मूढा न पश्यन्ति-अप्रबुद्धत्वात् । प्रबुद्धास्तु सर्वत्रैव बोधरूपमेवानुसन्दधाना जानन्त्येव इत्यलुप्त-समाधयः-तेषां यत्नपरत्वात् ॥ १० ॥
    slp1: |-
      tizWantamutkrAmantaM vA BuYjAnaM vA guRAnvitam . vimUQA nAnupaSyanti paSyanti jYAnacakzuzaH .. 15-10 ..
      mana ityanenAntaHkaraRamupalakzyate . ata eva SarIrasTitiyogAttizWantam . SarIrAntaragrahaRAya utkrAmantam . vizayAnvA BuYjAnaM mUQA na paSyanti-aprabudDatvAt . prabudDAstu sarvatrEva boDarUpamevAnusandaDAnA jAnantyeva ityalupta-samADayaH-tezAM yatnaparatvAt .. 10 ..
    iast: |-
      tiṣṭhantamutkrāmantaṃ vā bhuñjānaṃ vā guṇānvitam | vimūḍhā nānupaśyanti paśyanti jñānacakṣuṣaḥ || 15-10 ||
      mana ityanenāntaḥkaraṇamupalakṣyate | ata eva śarīrasthitiyogāttiṣṭhantam | śarīrāntaragrahaṇāya utkrāmantam | viṣayānvā bhuñjānaṃ mūḍhā na paśyanti-aprabuddhatvāt | prabuddhāstu sarvatraiva bodharūpamevānusandadhānā jānantyeva ityalupta-samādhayaḥ-teṣāṃ yatnaparatvāt || 10 ||
  - verse: 11
    devanagari: |-
      यतन्तो योगिनश्चैनं पश्यन्त्यात्मन्यवस्थितम् । यतन्तोऽप्यकृतात्मानो नैनं पश्यन्त्यचेतसः ॥ १५-११ ॥
      इति ॥ ११ ॥
    slp1: |-
      yatanto yoginaScEnaM paSyantyAtmanyavasTitam . yatanto'pyakftAtmAno nEnaM paSyantyacetasaH .. 15-11 ..
      iti .. 11 ..
    iast: |-
      yatanto yoginaścainaṃ paśyantyātmanyavasthitam | yatanto'pyakṛtātmāno nainaṃ paśyantyacetasaḥ || 15-11 ||
      iti || 11 ||
  - verse: 12
    devanagari: |-
      यदादित्यगतं तेजो जगद्भासयतेऽखिलम् । यच्चन्द्रमसि यच्चाग्नौ तत्तेजो विद्धि मामकम् ॥ १५-१२ ॥
    slp1: |-
      yadAdityagataM tejo jagadBAsayate'Kilam . yaccandramasi yaccAgnO tattejo vidDi mAmakam .. 15-12 ..
    iast: |-
      yadādityagataṃ tejo jagadbhāsayate'khilam | yaccandramasi yaccāgnau tattejo viddhi māmakam || 15-12 ||
  - verse: 13
    devanagari: |-
      गामाविश्य च भूतानि धारयाम्यहमोजसा । पुष्णामि चौषधीः सर्वाः सोमो भूत्वा रसात्मकः ॥ १५-१३ ॥
    slp1: |-
      gAmAviSya ca BUtAni DArayAmyahamojasA . puzRAmi cOzaDIH sarvAH somo BUtvA rasAtmakaH .. 15-13 ..
    iast: |-
      gāmāviśya ca bhūtāni dhārayāmyahamojasā | puṣṇāmi cauṣadhīḥ sarvāḥ somo bhūtvā rasātmakaḥ || 15-13 ||
  - verse: 14
    devanagari: |-
      अहं वैश्वानरो भूत्वा प्राणिनां देहमास्थितः । प्राणापानसमायुक्तः पचाम्यन्नं चतुर्विधम् ॥ १५-१४ ॥
      इति चार्धश्लोकेन । वाह्नं तु तेजः प्रकाशनशोषणदहनस्वेदनपचनात्मकं-पृथिव्यप्तेजोवायुयोगा त् । तदेतदिहोक्तं-यच्चाग्नौ इत्यनेन अहं वैश्वानरः-इत्यनेन च । नभस्तु बोधावकाशरूपतया सर्वगतमेव ॥ १४ ॥
    slp1: |-
      ahaM vESvAnaro BUtvA prARinAM dehamAsTitaH . prARApAnasamAyuktaH pacAmyannaM caturviDam .. 15-14 ..
      iti cArDaSlokena . vAhnaM tu tejaH prakASanaSozaRadahanasvedanapacanAtmakaM-pfTivyaptejovAyuyogA t . tadetadihoktaM-yaccAgnO ityanena ahaM vESvAnaraH-ityanena ca . naBastu boDAvakASarUpatayA sarvagatameva .. 14 ..
    iast: |-
      ahaṃ vaiśvānaro bhūtvā prāṇināṃ dehamāsthitaḥ | prāṇāpānasamāyuktaḥ pacāmyannaṃ caturvidham || 15-14 ||
      iti cārdhaślokena | vāhnaṃ tu tejaḥ prakāśanaśoṣaṇadahanasvedanapacanātmakaṃ-pṛthivyaptejovāyuyogā t | tadetadihoktaṃ-yaccāgnau ityanena ahaṃ vaiśvānaraḥ-ityanena ca | nabhastu bodhāvakāśarūpatayā sarvagatameva || 14 ||
  - verse: 15
    devanagari: |-
      अत एव बोध्यरूपतामुक्त्वा तद्बोध्यस्वरूपपृष्ठपतितस्वातन्त्र्यबोधस्वभावमात्मानं परस्वभावं परमेश्वररूपं सर्वज्ञानस्वतन्त्रं सर्वकर्तारं दर्शयितुमाह-
      सर्वस्य चाहं हृदि सन्निविष्टो मत्तः स्मृतिर्ज्ञानमपोहनं च । वेदैश्च सर्वैरहमेव वेद्यो वेदान्तकृतद्वेदविदेव चाहम् ॥ १५-१५ ॥
      सर्वस्य वेद्यस्य यत् हृत्-समस्ताहरणस्वतन्त्रबोधस्वभावं तत्राहमिति यो विमर्शस्तत एवापूर्वाभासनामयं ज्ञानं विश्वमहासृष्टिरूपम् । अयं घट एव-इति सर्वात्मकभावखण्डनासारं विकल्पज्ञानात्मकमपोहनं पाशवसृष्टिरूपमायामयप्रमात्रुचितम् । स्मरणं च संस्कारशेषतां नीतस्य संहृतस्य पुनरवभासनात्मकमिति इयता समस्तज्ञानानि संहृतानि । इति सर्वज्ञतापूर्वकं स्वातन्त्र्यरूपं कर्तृत्वमुक्तम् । सर्वैरिति-संभूय किल सर्वशास्त्राणां परमेशतत्त्वमेव निरूप्यम् । वेदवेदान्तकर्तृत्वेन कर्मफलतत्संबन्धादिद्वारतया अशेषविश्वनिर्माणे तदुन्मूलनेन पुनः स्वरूपप्रतिष्ठापने भगवत एव स्वातन्त्र्यमिति विश्वकर्तृत्वमुक्तम् । अन्ये तु अपोहनम्-अनेनाकृतेनेदं भवति इति व्यतिरेकबुद्धिः । वेदान्तं करोति इत्यात्मसाद्भावेन । एवं वेदम् ॥ १५ ॥
    slp1: |-
      ata eva boDyarUpatAmuktvA tadboDyasvarUpapfzWapatitasvAtantryaboDasvaBAvamAtmAnaM parasvaBAvaM parameSvararUpaM sarvajYAnasvatantraM sarvakartAraM darSayitumAha-
      sarvasya cAhaM hfdi sannivizwo mattaH smftirjYAnamapohanaM ca . vedESca sarvErahameva vedyo vedAntakftadvedavideva cAham .. 15-15 ..
      sarvasya vedyasya yat hft-samastAharaRasvatantraboDasvaBAvaM tatrAhamiti yo vimarSastata evApUrvABAsanAmayaM jYAnaM viSvamahAsfzwirUpam . ayaM Gawa eva-iti sarvAtmakaBAvaKaRqanAsAraM vikalpajYAnAtmakamapohanaM pASavasfzwirUpamAyAmayapramAtrucitam . smaraRaM ca saMskAraSezatAM nItasya saMhftasya punaravaBAsanAtmakamiti iyatA samastajYAnAni saMhftAni . iti sarvajYatApUrvakaM svAtantryarUpaM kartftvamuktam . sarvEriti-saMBUya kila sarvaSAstrARAM parameSatattvameva nirUpyam . vedavedAntakartftvena karmaPalatatsaMbanDAdidvAratayA aSezaviSvanirmARe tadunmUlanena punaH svarUpapratizWApane Bagavata eva svAtantryamiti viSvakartftvamuktam . anye tu apohanam-anenAkftenedaM Bavati iti vyatirekabudDiH . vedAntaM karoti ityAtmasAdBAvena . evaM vedam .. 15 ..
    iast: |-
      ata eva bodhyarūpatāmuktvā tadbodhyasvarūpapṛṣṭhapatitasvātantryabodhasvabhāvamātmānaṃ parasvabhāvaṃ parameśvararūpaṃ sarvajñānasvatantraṃ sarvakartāraṃ darśayitumāha-
      sarvasya cāhaṃ hṛdi sanniviṣṭo mattaḥ smṛtirjñānamapohanaṃ ca | vedaiśca sarvairahameva vedyo vedāntakṛtadvedavideva cāham || 15-15 ||
      sarvasya vedyasya yat hṛt-samastāharaṇasvatantrabodhasvabhāvaṃ tatrāhamiti yo vimarśastata evāpūrvābhāsanāmayaṃ jñānaṃ viśvamahāsṛṣṭirūpam | ayaṃ ghaṭa eva-iti sarvātmakabhāvakhaṇḍanāsāraṃ vikalpajñānātmakamapohanaṃ pāśavasṛṣṭirūpamāyāmayapramātrucitam | smaraṇaṃ ca saṃskāraśeṣatāṃ nītasya saṃhṛtasya punaravabhāsanātmakamiti iyatā samastajñānāni saṃhṛtāni | iti sarvajñatāpūrvakaṃ svātantryarūpaṃ kartṛtvamuktam | sarvairiti-saṃbhūya kila sarvaśāstrāṇāṃ parameśatattvameva nirūpyam | vedavedāntakartṛtvena karmaphalatatsaṃbandhādidvāratayā aśeṣaviśvanirmāṇe tadunmūlanena punaḥ svarūpapratiṣṭhāpane bhagavata eva svātantryamiti viśvakartṛtvamuktam | anye tu apohanam-anenākṛtenedaṃ bhavati iti vyatirekabuddhiḥ | vedāntaṃ karoti ityātmasādbhāvena | evaṃ vedam || 15 ||
  - verse: 16
    devanagari: |-
      द्वाविमौ पुरुषौ लोके क्षरश्चाक्षर एव च । क्षरः सर्वाणि भूतानि कूटस्थोऽक्षर उच्यते ॥ १५-१६ ॥
    slp1: |-
      dvAvimO puruzO loke kzaraScAkzara eva ca . kzaraH sarvARi BUtAni kUwasTo'kzara ucyate .. 15-16 ..
    iast: |-
      dvāvimau puruṣau loke kṣaraścākṣara eva ca | kṣaraḥ sarvāṇi bhūtāni kūṭastho'kṣara ucyate || 15-16 ||
  - verse: 17
    devanagari: |-
      उत्तमः पुरुषस्त्वन्यः परमात्मेत्युदाहृतः । यो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः ॥ १५-१७ ॥
    slp1: |-
      uttamaH puruzastvanyaH paramAtmetyudAhftaH . yo lokatrayamAviSya biBartyavyaya ISvaraH .. 15-17 ..
    iast: |-
      uttamaḥ puruṣastvanyaḥ paramātmetyudāhṛtaḥ | yo lokatrayamāviśya bibhartyavyaya īśvaraḥ || 15-17 ||
  - verse: 18
    devanagari: |-
      यस्मात्क्षरमतीतोऽहमक्षरादपि चोत्तमः । अतोऽस्मि लोके वेदे च प्रथितः पुरुषोत्तमः ॥ १५-१८ ॥
      लोके द्वाविमौ पुरुषौ-इति ग्रन्थेनेदमुच्यते-लोके तावदप्रबुद्धस्वभावोऽपि सर्व पृथिव्यादिभूतारब्धशरीरमात्मानं चेतनं क्षररूपं जानातीति लोकस्य मूढत्वात् द्वैतधीर्न निवर्तते । अहं तु सकलानुग्राही द्वैतग्रन्थिं विभिद्य सकललोकव्यापकतया वेद्य इति । क्षरमतीतः-भूतानां जडत्वात् । अक्षरमतीतः-आत्मनोऽप्रबुद्धत्वे सर्वव्यापकत्वखण्डनात् । पुरुषोत्तमो लोके वेदेऽपि स उत्तमः पुरुषः-इत्यादिभिर्व्याक्यैः स एव परमात्माद्वय एवमुच्यते ॥ १८ ॥
    slp1: |-
      yasmAtkzaramatIto'hamakzarAdapi cottamaH . ato'smi loke vede ca praTitaH puruzottamaH .. 15-18 ..
      loke dvAvimO puruzO-iti granTenedamucyate-loke tAvadaprabudDasvaBAvo'pi sarva pfTivyAdiBUtArabDaSarIramAtmAnaM cetanaM kzararUpaM jAnAtIti lokasya mUQatvAt dvEtaDIrna nivartate . ahaM tu sakalAnugrAhI dvEtagranTiM viBidya sakalalokavyApakatayA vedya iti . kzaramatItaH-BUtAnAM jaqatvAt . akzaramatItaH-Atmano'prabudDatve sarvavyApakatvaKaRqanAt . puruzottamo loke vede'pi sa uttamaH puruzaH-ityAdiBirvyAkyEH sa eva paramAtmAdvaya evamucyate .. 18 ..
    iast: |-
      yasmātkṣaramatīto'hamakṣarādapi cottamaḥ | ato'smi loke vede ca prathitaḥ puruṣottamaḥ || 15-18 ||
      loke dvāvimau puruṣau-iti granthenedamucyate-loke tāvadaprabuddhasvabhāvo'pi sarva pṛthivyādibhūtārabdhaśarīramātmānaṃ cetanaṃ kṣararūpaṃ jānātīti lokasya mūḍhatvāt dvaitadhīrna nivartate | ahaṃ tu sakalānugrāhī dvaitagranthiṃ vibhidya sakalalokavyāpakatayā vedya iti | kṣaramatītaḥ-bhūtānāṃ jaḍatvāt | akṣaramatītaḥ-ātmano'prabuddhatve sarvavyāpakatvakhaṇḍanāt | puruṣottamo loke vede'pi sa uttamaḥ puruṣaḥ-ityādibhirvyākyaiḥ sa eva paramātmādvaya evamucyate || 18 ||
  - verse: 19
    devanagari: |-
      यो मामेवमसम्मूढो जानाति पुरुषोत्तमम् । स सर्वविद्भजति मां सर्वभावेन भारत ॥ १५-१९ ॥
      इति ॥ १९ ॥
    slp1: |-
      yo mAmevamasammUQo jAnAti puruzottamam . sa sarvavidBajati mAM sarvaBAvena BArata .. 15-19 ..
      iti .. 19 ..
    iast: |-
      yo māmevamasammūḍho jānāti puruṣottamam | sa sarvavidbhajati māṃ sarvabhāvena bhārata || 15-19 ||
      iti || 19 ||
  - verse: 20
    devanagari: |-
      इति गुह्यतमं शास्त्रमिदमुक्तं मयानघ । एतद्बुद्ध्वा बुद्धिमान्स्यात्कृतकृत्यश्च भारत ॥ १५-२० ॥
      गुह्यतमं-सर्वाद्वयप्रतिपादकत्वात् । एतदेव बुद्धा बुद्धिमत्त्वं नतु व्यवहारबुद्धा । एतेन च ज्ञातेनैव कृतकृत्यता नतु कृतेनापि शत्रुविजयार्थाहरणस्त्र्युपभोगादिना । चकारोऽद्भुतद्योतकः । कृतेन हि कृतकृत्यता दृष्टा एतेन तु ज्ञातेनैवेति चित्रम् । इतिशब्देन शास्त्रस्य समाप्तिः सूचिता-वक्तव्यस्य परिपूर्णतया समाप्तत्वात् । तथाहि । षोडशाध्यायेन शिष्यस्यार्जुनस्य केवलं योग्यता प्रतिपाद्यते । नतूपदिश्यते किंचित् । दैवी ह्येवंविधा संपत् आसुरी चाविद्यामय्येतादृशी संपत् । त्वं च विद्यामयीं दैवीं संपदंमभिप्राप्तः-इत्येतावति हि तात्पर्यम् । यद्वक्ष्यति मा शुचः संपदं दैवीम्-इति । अत एव पूर्वं विद्याविद्यासंघट्टनिरूपणावसरे देवासुरसंग्रामच्छलेन विद्याविद्ययोः संघर्ष इति सूचितम् । एवं च शिष्यस्वरूपे प्राधान्येन निरूप्यमाणे प्रसङ्गतोऽन्यदप्युक्तम् । इत्यध्यायद्वयं भविष्यति । उपदेशस्त्वित एव परिसमाप्तः । सर्वभावेन हि परमेश्वरभजनमावेशरूपं प्राप्यम् । तदर्थं चात्यत्सर्वमित्युक्तं प्राक् । सर्वमाहेश्वरस्वरूपावेश एव हि परमं शिवमिति शिवम् ॥ २० ॥
    slp1: |-
      iti guhyatamaM SAstramidamuktaM mayAnaGa . etadbudDvA budDimAnsyAtkftakftyaSca BArata .. 15-20 ..
      guhyatamaM-sarvAdvayapratipAdakatvAt . etadeva budDA budDimattvaM natu vyavahArabudDA . etena ca jYAtenEva kftakftyatA natu kftenApi SatruvijayArTAharaRastryupaBogAdinA . cakAro'dButadyotakaH . kftena hi kftakftyatA dfzwA etena tu jYAtenEveti citram . itiSabdena SAstrasya samAptiH sUcitA-vaktavyasya paripUrRatayA samAptatvAt . taTAhi . zoqaSADyAyena SizyasyArjunasya kevalaM yogyatA pratipAdyate . natUpadiSyate kiMcit . dEvI hyevaMviDA saMpat AsurI cAvidyAmayyetAdfSI saMpat . tvaM ca vidyAmayIM dEvIM saMpadaMmaBiprAptaH-ityetAvati hi tAtparyam . yadvakzyati mA SucaH saMpadaM dEvIm-iti . ata eva pUrvaM vidyAvidyAsaMGawwanirUpaRAvasare devAsurasaMgrAmacCalena vidyAvidyayoH saMGarza iti sUcitam . evaM ca SizyasvarUpe prADAnyena nirUpyamARe prasaNgato'nyadapyuktam . ityaDyAyadvayaM Bavizyati . upadeSastvita eva parisamAptaH . sarvaBAvena hi parameSvaraBajanamAveSarUpaM prApyam . tadarTaM cAtyatsarvamityuktaM prAk . sarvamAheSvarasvarUpAveSa eva hi paramaM Sivamiti Sivam .. 20 ..
    iast: |-
      iti guhyatamaṃ śāstramidamuktaṃ mayānagha | etadbuddhvā buddhimānsyātkṛtakṛtyaśca bhārata || 15-20 ||
      guhyatamaṃ-sarvādvayapratipādakatvāt | etadeva buddhā buddhimattvaṃ natu vyavahārabuddhā | etena ca jñātenaiva kṛtakṛtyatā natu kṛtenāpi śatruvijayārthāharaṇastryupabhogādinā | cakāro'dbhutadyotakaḥ | kṛtena hi kṛtakṛtyatā dṛṣṭā etena tu jñātenaiveti citram | itiśabdena śāstrasya samāptiḥ sūcitā-vaktavyasya paripūrṇatayā samāptatvāt | tathāhi | ṣoḍaśādhyāyena śiṣyasyārjunasya kevalaṃ yogyatā pratipādyate | natūpadiśyate kiṃcit | daivī hyevaṃvidhā saṃpat āsurī cāvidyāmayyetādṛśī saṃpat | tvaṃ ca vidyāmayīṃ daivīṃ saṃpadaṃmabhiprāptaḥ-ityetāvati hi tātparyam | yadvakṣyati mā śucaḥ saṃpadaṃ daivīm-iti | ata eva pūrvaṃ vidyāvidyāsaṃghaṭṭanirūpaṇāvasare devāsurasaṃgrāmacchalena vidyāvidyayoḥ saṃgharṣa iti sūcitam | evaṃ ca śiṣyasvarūpe prādhānyena nirūpyamāṇe prasaṅgato'nyadapyuktam | ityadhyāyadvayaṃ bhaviṣyati | upadeśastvita eva parisamāptaḥ | sarvabhāvena hi parameśvarabhajanamāveśarūpaṃ prāpyam | tadarthaṃ cātyatsarvamityuktaṃ prāk | sarvamāheśvarasvarūpāveśa eva hi paramaṃ śivamiti śivam || 20 ||
  - verse: 1000
    devanagari: |-
      हृत्वा द्वैतमहामोहं कृत्वा ब्रह्ममयीं चितिम् । लौकिके व्यवहारेऽपि मुनिर्नित्यं समाविशेत् ॥ १५ ॥
    slp1: |-
      hftvA dvEtamahAmohaM kftvA brahmamayIM citim . lOkike vyavahAre'pi munirnityaM samAviSet .. 15 ..
    iast: |-
