  - verse: 58
    devanagari: |-
      मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि । अथ चेत्त्वमहङ्कारां न मोक्ष्यसि विनंक्ष्यसि ॥ १८-५८ ॥
