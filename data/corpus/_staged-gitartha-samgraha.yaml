  - verse: 52
    devanagari: |-
      विविक्तसेवी लघ्वाशी यतवाक्कायमानसः । ध्यानयोगपरो नित्यं वैराग्यं समुपाश्रितः ॥ १८-५२ ॥
    slp1: |-
      viviktasevI laGvASI yatavAkkAyamAnasaH . DyAnayogaparo nityaM vErAgyaM samupASritaH .. 18-52 ..
