text:
  id: gitartha-samgraha
  slug: gitartha-samgraha
  title_sa: भगवद्गीता
  title_en: "Bhagavad Gītā (Kashmirian recension)"
  title_iast: "Bhagavadgītā"
  author:
  tradition: trika
  school: kashmir-shaivism
  era: "pre-9th c. CE (recension as transmitted c. 975-1025 CE)"
  source: "Muktabodha Indological Research Institute, digital library catalog no. M00244 (bhagavadgītārthasaṃgraha); e-texts entered by Muktabodha staff under Mark S. G. Dyczkowski, based on the ed. of Lakṣmaṇa Raina Brahmacārī (Lakshman Joo), Kashmiri Pratap Steam Press, Srinagar 1933. Only the Gītā ślokas (mūla) are extracted; Abhinavagupta's commentary prose is excluded."
  source_url: "https://muktalib7.com/DL_CATALOG_ROOT/MUKTABODHA-LIBRARY-IAST/bhagavadgItA-M00244-IAST.txt"
  source_revision: "Muktabodha revision 0, 2012-02-05; accessed 2026-06-12"
  license: CC-BY-NC
  pending_miri: true
  expected_verse_count: 716
  parent_text_id:
  manuscript_url:
  description: |
    The Bhagavadgītā in its KASHMIRIAN RECENSION — the Gītā mūla (the metrical
    ślokas only) as transmitted in Abhinavagupta's (c. 975-1025 CE)
    Gītārthasaṃgraha ("A Summary of the Meaning of the Gītā"). This file carries
    ONLY the original Gītā verses; Abhinavagupta's non-dual Trika commentary
    prose — together with his six maṅgala verses and the per-adhyāya
    saṃgraha-ślokas — is DROPPED here and reserved for a future sibling text
    (proposed slug gitartha-samgraha-vivrti, linked by parent_text_id) that will
    carry the commentary.

    The Kashmirian recension differs slightly from the vulgate (Śaṅkara)
    recension of ~700 ślokas: it transmits 716 ślokas across the 18 adhyāyas,
    with expansions chiefly in adhyāyas 2, 3, 6, 9, 11, and 13. The verse
    numbering (chapter.verse) follows the source's own "|| ch-v ||" markers.

    STRUCTURE: verse-keyed by chapter.verse_num across the 18 adhyāyas. Each
    entry holds one Gītā śloka verbatim, ending in its source marker (retained,
    mechanically transliterated). Per-adhyāya śloka counts:
    47, 74, 48, 42, 29, 49, 30, 28, 35, 42, 60, 20, 35, 27, 20, 24, 28, 78
    (= 716 total). Every Devanagari character is a mechanical Sanscript
    transliteration of the verbatim Muktabodha IAST e-text; upstream marker
    quirks are normalised in the trailing marker only (Gītā 8.9 "|| 9 ||" and
    8.8 "|| 8- 8 ||"), never in the verse text.

chapters:
- chapter: 1
  title_sa: प्रथमोऽध्यायः
  title_iast: "prathamo'dhyāyaḥ"
  title_en: "First Adhyāya"
  verses:
  - verse_num: 1
    devanagari: |-
      धर्मक्षेत्रे कुरुक्षेत्रे सर्वक्षत्रसमागमे । मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥ १-१ ॥
    slp1: |-
      Darmakzetre kurukzetre sarvakzatrasamAgame . mAmakAH pARqavAScEva kimakurvata saYjaya .. 1-1 ..
    iast: |-
      dharmakṣetre kurukṣetre sarvakṣatrasamāgame | māmakāḥ pāṇḍavāścaiva kimakurvata sañjaya || 1-1 ||
    word_glosses:
    - word: धर्मक्षेत्रे
      iast: dharmakṣetre
      gloss_en: "on the field of dharma"
      morph: "loc. sg. n."
    - word: कुरुक्षेत्रे
      iast: kurukṣetre
      gloss_en: "on Kurukṣetra, the field of the Kurus"
      morph: "loc. sg. n."
    - word: सर्वक्षत्रसमागमे
      iast: sarvakṣatrasamāgame
      gloss_en: "at the gathering-together of all the warriors"
      morph: "loc. sg. m."
    - word: मामकाः
      iast: māmakāḥ
      gloss_en: "my own (men), my side"
      morph: "nom. pl. m."
    - word: पाण्डवाः
      iast: pāṇḍavāḥ
      gloss_en: "the sons of Pāṇḍu"
      morph: "nom. pl. m."
    - word: च एव
      iast: caiva
      gloss_en: "and indeed"
      morph: "indecl."
    - word: किम् अकुर्वत
      iast: kimakurvata
      gloss_en: "what did they do"
      morph: "interrog. + 3 pl. impf. mid."
    - word: सञ्जय
      iast: sañjaya
      gloss_en: "O Sañjaya"
      morph: "voc. sg. m."
    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "On the field of dharma, on Kurukṣetra, at the gathering of all the warriors — what did my own men and the sons of Pāṇḍu do, O Sañjaya?"
      ai_assisted: true
      status: draft
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
  - verse_num: 2
    devanagari: |-
      दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा । आचार्यमुपसङ्गम्य राजा वचनमब्रवीत् ॥ १-२ ॥
    slp1: |-
      dfzwvA tu pARqavAnIkaM vyUQaM duryoDanastadA . AcAryamupasaNgamya rAjA vacanamabravIt .. 1-2 ..
    iast: |-
      dṛṣṭvā tu pāṇḍavānīkaṃ vyūḍhaṃ duryodhanastadā | ācāryamupasaṅgamya rājā vacanamabravīt || 1-2 ||
    word_glosses:
    - word: दृष्ट्वा
      iast: dṛṣṭvā
      gloss_en: "having seen"
      morph: "gerund"
    - word: तु
      iast: tu
      gloss_en: "but, now"
      morph: "indecl."
    - word: पाण्डवानीकम्
      iast: pāṇḍavānīkam
      gloss_en: "the army of the Pāṇḍavas"
      morph: "acc. sg. n."
    - word: व्यूढम्
      iast: vyūḍham
      gloss_en: "drawn up in battle-array"
      morph: "acc. sg. n."
    - word: दुर्योधनः
      iast: duryodhanaḥ
      gloss_en: "Duryodhana"
      morph: "nom. sg. m."
    - word: तदा
      iast: tadā
      gloss_en: "then"
      morph: "indecl."
    - word: आचार्यम् उपसङ्गम्य
      iast: ācāryamupasaṅgamya
      gloss_en: "having approached the teacher (Droṇa)"
      morph: "acc. sg. m. + gerund"
    - word: राजा
      iast: rājā
      gloss_en: "the king"
      morph: "nom. sg. m."
    - word: वचनम् अब्रवीत्
      iast: vacanamabravīt
      gloss_en: "spoke these words"
      morph: "acc. sg. n. + 3 sg. impf."
    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "But when King Duryodhana had seen the army of the Pāṇḍavas drawn up for battle, he then approached his teacher and spoke these words."
      ai_assisted: true
      status: draft
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
  - verse_num: 3
    devanagari: |-
      पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम् । व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता ॥ १-३ ॥
    slp1: |-
      paSyEtAM pARquputrARAmAcArya mahatIM camUm . vyUQAM drupadaputreRa tava SizyeRa DImatA .. 1-3 ..
    iast: |-
      paśyaitāṃ pāṇḍuputrāṇāmācārya mahatīṃ camūm | vyūḍhāṃ drupadaputreṇa tava śiṣyeṇa dhīmatā || 1-3 ||
    word_glosses:
    - word: पश्य
      iast: paśya
      gloss_en: "behold"
      morph: "2 sg. impv."
    - word: एताम्
      iast: etām
      gloss_en: "this"
      morph: "acc. sg. f."
    - word: पाण्डुपुत्राणाम्
      iast: pāṇḍuputrāṇām
      gloss_en: "of the sons of Pāṇḍu"
      morph: "gen. pl. m."
    - word: आचार्य
      iast: ācārya
      gloss_en: "O teacher"
      morph: "voc. sg. m."
    - word: महतीं चमूम्
      iast: mahatīṃ camūm
      gloss_en: "the great army"
      morph: "acc. sg. f."
    - word: व्यूढाम्
      iast: vyūḍhām
      gloss_en: "arrayed"
      morph: "acc. sg. f."
    - word: द्रुपदपुत्रेण
      iast: drupadaputreṇa
      gloss_en: "by the son of Drupada (Dhṛṣṭadyumna)"
      morph: "inst. sg. m."
    - word: तव शिष्येण
      iast: tava śiṣyeṇa
      gloss_en: "by your pupil"
      morph: "inst. sg. m."
    - word: धीमता
      iast: dhīmatā
      gloss_en: "the intelligent one"
      morph: "inst. sg. m."
    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "Behold, O teacher, this great army of the sons of Pāṇḍu, arrayed by your intelligent pupil, the son of Drupada."
      ai_assisted: true
      status: draft
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
  - verse_num: 4
    devanagari: |-
      अत्र शूरा महेष्वासा भीमार्जुनसमा युधि । युयुधानो विराटश्च द्रुपदश्च महारथः ॥ १-४ ॥
    slp1: |-
      atra SUrA mahezvAsA BImArjunasamA yuDi . yuyuDAno virAwaSca drupadaSca mahAraTaH .. 1-4 ..
    iast: |-
      atra śūrā maheṣvāsā bhīmārjunasamā yudhi | yuyudhāno virāṭaśca drupadaśca mahārathaḥ || 1-4 ||
    word_glosses:
    - word: अत्र
      iast: atra
      gloss_en: "here"
      morph: "indecl."
    - word: शूराः
      iast: śūrāḥ
      gloss_en: "heroes"
      morph: "nom. pl. m."
    - word: महेष्वासाः
