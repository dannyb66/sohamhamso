text:
  id: gitartha-samgraha
  slug: gitartha-samgraha
  title_sa: गीतार्थसंग्रह
  title_en: Abhinavagupta's Commentary on the Bhagavad Gita
  title_iast: Gītārthasaṃgraha
  author: Abhinavagupta
  tradition: trika
  school: kashmir-shaivism
  era: "c. 975-1025 CE"
  source: "Muktabodha Indological Research Institute, digital library catalog no. M00244 (bhagavadgītārthasaṃgraha); e-texts entered by Muktabodha staff under Mark S. G. Dyczkowski, based on the ed. of Lakṣmaṇa Raina Brahmacārī (Lakshman Joo), Kashmiri Pratap Steam Press, Srinagar 1933"
  source_url: "https://muktalib7.com/DL_CATALOG_ROOT/MUKTABODHA-LIBRARY-IAST/bhagavadgItA-M00244-IAST.txt"
  source_revision: "Muktabodha revision 0, 2012-02-05; accessed 2026-06-12"
  license: CC-BY-NC
  pending_miri: true
  expected_verse_count: 743
  parent_text_id:
  manuscript_url:
  description: |
    The Gītārthasaṃgraha ("A Summary of the Meaning of the Gītā") is
    Abhinavagupta's (c. 975-1025 CE) commentary on the Bhagavadgītā in its
    Kashmirian recension, read in the light of non-dual Trika Śaivism. It is
    not a full running commentary: Abhinavagupta quotes the Gītā ślokas of the
    Kashmirian recension and comments in prose only where he or his teacher
    Bhaṭṭendurāja (Bhaṭṭa Indurāja) saw an esoteric significance missed by
    earlier commentators. This file ingests the COMMENTARY together with the
    commented Gītā verses exactly as the Muktabodha e-text (catalog M00244)
    transmits them.

    STRUCTURE: the file is verse-keyed by chapter.verse_num across the 18
    adhyāyas of the Gītā. Each base-Gītā śloka and Abhinavagupta's commentary
    prose on it are carried together, verbatim and in source order, in one verse
    entry whose verse_num is the Gītā śloka number from the source's "|| ch-v ||"
    marker (those raw markers are retained inside the text). Where the source
    quotes two or three ślokas under a single marker (Kashmirian recension
    bundling) the entry keeps the lower number; where commentary re-cites a
    verse number it is merged into that verse's entry. Abhinavagupta's six
    maṅgala (benedictory) verses, which precede adhyāya 1 in the source, are
    carried at the head of chapter 1 as reserved verse_num 901-906 (the schema
    requires chapter >= 1, so there is no chapter 0). Within each adhyāya,
    verse_num 1000 holds that chapter's closing saṃgraha-śloka (Abhinavagupta's
    own summary verse). Chapter 18 additionally carries the four concluding
    lineage verses and the closing seal as verse_num 2001-2005. No Gītā verse is
    force-emitted where Abhinavagupta left it uncommented beyond what the source
    itself quotes.

    COUNTS: 18 adhyāyas; per-adhyāya distinct base-śloka counts
    47, 74, 48, 42, 29, 49, 30, 28, 35, 42, 60, 20, 35, 27, 20, 24, 28, 78
    (the recension's grouped markers cover those ranges; distinct entry counts
    are 47, 74, 48, 42, 29, 49, 30, 26, 35, 42, 60, 20, 35, 27, 20, 24, 28, 78).
    These per-chapter totals match the wisdomlib critical-study account of the
    Kashmirian recension (716 ślokas) exactly. Every Devanagari character is a
    mechanical Sanscript transliteration of the verbatim Muktabodha IAST e-text;
    upstream transcription quirks are preserved un-emended (e.g. "athaḥ
    tṛtīyo'dhyāyaḥ" sic at adhyāya 3, "aṣṭadaśo'dhyāyaḥ" sic at adhyāya 18,
    "śrīmadbhavadgītārthasaṃgrahe" sic in the adhyāya-1 colophon).

chapters:
- chapter: 1
  title_sa: प्रथमोऽध्यायः
  title_iast: "prathamo'dhyāyaḥ"
  title_en: "First Adhyāya"
  verses:
  - verse: 901
    devanagari: |-
      य एष विततस्फुरद्विविधभावचक्रात्मकः परस्परविभेदवान्विषयतामुपागच्छति । यदेकमयभावनावशत एत्यभेदान्वयं स शंभुरशिवापहो जयति बोधभासां निधिः ॥ १-१ ॥
    slp1: |-
      ya eza vitatasPuradviviDaBAvacakrAtmakaH parasparaviBedavAnvizayatAmupAgacCati . yadekamayaBAvanAvaSata etyaBedAnvayaM sa SaMBuraSivApaho jayati boDaBAsAM niDiH .. 1-1 ..
    iast: |-
      ya eṣa vitatasphuradvividhabhāvacakrātmakaḥ parasparavibhedavānviṣayatāmupāgacchati | yadekamayabhāvanāvaśata etyabhedānvayaṃ sa śaṃbhuraśivāpaho jayati bodhabhāsāṃ nidhiḥ || 1-1 ||
  - verse: 902
    devanagari: |-
      द्वैपायनेन मुनिना यदिदं व्यधायि सास्त्रं सहस्रशतसंमितमत्र मोक्षः । माधान्यतः फलतया प्रथितस्तदन्य- धर्मादि तस्य परिपोषयितुं प्रगीतम् ॥ १-२ ॥
    slp1: |-
      dvEpAyanena muninA yadidaM vyaDAyi sAstraM sahasraSatasaMmitamatra mokzaH . mADAnyataH PalatayA praTitastadanya- DarmAdi tasya paripozayituM pragItam .. 1-2 ..
    iast: |-
      dvaipāyanena muninā yadidaṃ vyadhāyi sāstraṃ sahasraśatasaṃmitamatra mokṣaḥ | mādhānyataḥ phalatayā prathitastadanya- dharmādi tasya paripoṣayituṃ pragītam || 1-2 ||
  - verse: 903
    devanagari: |-
      मोक्षश्च नाम सकलाप्रविभागरूपे सर्वज्ञसर्वकरणादिशुभस्वभावे । आकाङ्क्ष्य विरहिते भगवत्यधीशे नित्योदिते लय इयान्प्रथिः समासात् ॥ १-३ ॥
    slp1: |-
      mokzaSca nAma sakalApraviBAgarUpe sarvajYasarvakaraRAdiSuBasvaBAve . AkANkzya virahite BagavatyaDISe nityodite laya iyAnpraTiH samAsAt .. 1-3 ..
    iast: |-
      mokṣaśca nāma sakalāpravibhāgarūpe sarvajñasarvakaraṇādiśubhasvabhāve | ākāṅkṣya virahite bhagavatyadhīśe nityodite laya iyānprathiḥ samāsāt || 1-3 ||
  - verse: 904
    devanagari: |-
      यद्यप्यन्यप्रसङ्गेषु मोक्षो नामात्र गीयते । तथापि भगवद्गीताः सम्यक्तत्प्राप्तिदायिकाः ॥ १-४ ॥
    slp1: |-
      yadyapyanyaprasaNgezu mokzo nAmAtra gIyate . taTApi BagavadgItAH samyaktatprAptidAyikAH .. 1-4 ..
    iast: |-
      yadyapyanyaprasaṅgeṣu mokṣo nāmātra gīyate | tathāpi bhagavadgītāḥ samyaktatprāptidāyikāḥ || 1-4 ||
  - verse: 905
    devanagari: |-
      तास्वन्यैः प्राक्तनैर्व्याख्याः कृता यद्यपि भूयसा । न्याय्यस्तथाप्युद्यमो मे तद्गूढार्थप्रकाशकः ॥ १-५ ॥
    slp1: |-
      tAsvanyEH prAktanErvyAKyAH kftA yadyapi BUyasA . nyAyyastaTApyudyamo me tadgUQArTaprakASakaH .. 1-5 ..
    iast: |-
      tāsvanyaiḥ prāktanairvyākhyāḥ kṛtā yadyapi bhūyasā | nyāyyastathāpyudyamo me tadgūḍhārthaprakāśakaḥ || 1-5 ||
  - verse: 906
    devanagari: |-
      भट्टेन्दुराजादाम्नाय विविच्य च चिरं धिया । कृतोऽभिनवगुप्तेन सोऽयं गीतार्थसंग्रहः ॥ १-६ ॥
    slp1: |-
      BawwendurAjAdAmnAya vivicya ca ciraM DiyA . kfto'Binavaguptena so'yaM gItArTasaMgrahaH .. 1-6 ..
    iast: |-
      bhaṭṭendurājādāmnāya vivicya ca ciraṃ dhiyā | kṛto'bhinavaguptena so'yaṃ gītārthasaṃgrahaḥ || 1-6 ||
  - verse: 1
    devanagari: |-
      विद्याविद्यात्मनोर्द्वयोरभिभाव्याभिभावकात्मकत्वं प्रदर्शयितुं प्रथमाध्यायप्रस्तावः । नह्यनुत्पन्नविद्यालेशावकाश उपदेशभाजनम् नापि निर्मूलितसमस्ताविद्याप्रपञ्चः एककोटिविश्रान्तस्य तु ततः कोटेश्च्यावयितुमशक्यत्वात् । अज्ञविपर्यस्तयोस्तु उपदेश्यत्वं यदुच्यते तत्क्वचिदेव । तथात्वौन्मुख्योपदेष्टव्येऽर्थे सन्दिग्धतैव । अत एव संशयनिर्णोदक एवोपदेश इति विद्याविद्याङ्गसंघट्टमयः संशय उच्यते । देवासुरसृष्टिश्च विद्याविद्यामयीति तत्कथोपक्रमणमेव मोक्षमार्गोपदेशनम् । ज्ञानं च प्रधानं कर्माणि चापहर्तव्यानीति कर्मणां ज्ञाननिष्ठतया क्रियमाणानामपि न बन्धकत्वमिति ज्ञानप्राधान्यम् नान्तरीयकत्वं तु कर्मणाम् न तु ज्ञानकर्मणी समशीर्षकतया समुञ्चीयेते इत्यत्र तात्पर्यम् । एवमेव च मुनेरभिप्रायं यथास्थानं प्रतिपादयिष्याम इति किमन्यैस्तत्त्वदर्शनविघ्नमात्रफलैर्वाग्जालैः ॥
      धृतराष्ट्र उवाच
      धर्मक्षेत्रे कुरुक्षेत्रे सर्वक्षत्रसमागमे । मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥ १-१ ॥
      इत्यस्य च धर्मस्य क्षेत्रम् समस्तधर्माणां क्षयादपवर्गप्राप्त्या त्राणभूतम् तदधिकारि शरीरम् । सर्वक्षेत्राणां क्षदेर्हिंसार्थत्वात् परस्परवध्यघातकभावेन वर्तमानानां रागवैराग्यक्रोधक्षमाप्रभृतीनां समागमो यत्र तस्मिन् स्थिता ये मामकाः-अविद्यापुरुषोचिता अविद्यामयाः सङ्कल्पाः । पाण्डवाः-शुद्धविद्यापुरुषोचिता विद्यात्मनः । ते किमकुर्वत-कैः खलु के जिता इति यावत् । ममेति कायतीति मामकः अविद्यापुरुषः । पाण्डुः शुद्धः ॥ १ ॥
    slp1: |-
      vidyAvidyAtmanordvayoraBiBAvyABiBAvakAtmakatvaM pradarSayituM praTamADyAyaprastAvaH . nahyanutpannavidyAleSAvakASa upadeSaBAjanam nApi nirmUlitasamastAvidyAprapaYcaH ekakowiviSrAntasya tu tataH koweScyAvayitumaSakyatvAt . ajYaviparyastayostu upadeSyatvaM yaducyate tatkvacideva . taTAtvOnmuKyopadezwavye'rTe sandigDatEva . ata eva saMSayanirRodaka evopadeSa iti vidyAvidyANgasaMGawwamayaH saMSaya ucyate . devAsurasfzwiSca vidyAvidyAmayIti tatkaTopakramaRameva mokzamArgopadeSanam . jYAnaM ca praDAnaM karmARi cApahartavyAnIti karmaRAM jYAnanizWatayA kriyamARAnAmapi na banDakatvamiti jYAnaprADAnyam nAntarIyakatvaM tu karmaRAm na tu jYAnakarmaRI samaSIrzakatayA samuYcIyete ityatra tAtparyam . evameva ca muneraBiprAyaM yaTAsTAnaM pratipAdayizyAma iti kimanyEstattvadarSanaviGnamAtraPalErvAgjAlEH ..
      DftarAzwra uvAca
      Darmakzetre kurukzetre sarvakzatrasamAgame . mAmakAH pARqavAScEva kimakurvata saYjaya .. 1-1 ..
      ityasya ca Darmasya kzetram samastaDarmARAM kzayAdapavargaprAptyA trARaBUtam tadaDikAri SarIram . sarvakzetrARAM kzaderhiMsArTatvAt parasparavaDyaGAtakaBAvena vartamAnAnAM rAgavErAgyakroDakzamApraBftInAM samAgamo yatra tasmin sTitA ye mAmakAH-avidyApuruzocitA avidyAmayAH saNkalpAH . pARqavAH-SudDavidyApuruzocitA vidyAtmanaH . te kimakurvata-kEH Kalu ke jitA iti yAvat . mameti kAyatIti mAmakaH avidyApuruzaH . pARquH SudDaH .. 1 ..
    iast: |-
      vidyāvidyātmanordvayorabhibhāvyābhibhāvakātmakatvaṃ pradarśayituṃ prathamādhyāyaprastāvaḥ | nahyanutpannavidyāleśāvakāśa upadeśabhājanam nāpi nirmūlitasamastāvidyāprapañcaḥ ekakoṭiviśrāntasya tu tataḥ koṭeścyāvayitumaśakyatvāt | ajñaviparyastayostu upadeśyatvaṃ yaducyate tatkvacideva | tathātvaunmukhyopadeṣṭavye'rthe sandigdhataiva | ata eva saṃśayanirṇodaka evopadeśa iti vidyāvidyāṅgasaṃghaṭṭamayaḥ saṃśaya ucyate | devāsurasṛṣṭiśca vidyāvidyāmayīti tatkathopakramaṇameva mokṣamārgopadeśanam | jñānaṃ ca pradhānaṃ karmāṇi cāpahartavyānīti karmaṇāṃ jñānaniṣṭhatayā kriyamāṇānāmapi na bandhakatvamiti jñānaprādhānyam nāntarīyakatvaṃ tu karmaṇām na tu jñānakarmaṇī samaśīrṣakatayā samuñcīyete ityatra tātparyam | evameva ca munerabhiprāyaṃ yathāsthānaṃ pratipādayiṣyāma iti kimanyaistattvadarśanavighnamātraphalairvāgjālaiḥ ||
      dhṛtarāṣṭra uvāca
      dharmakṣetre kurukṣetre sarvakṣatrasamāgame | māmakāḥ pāṇḍavāścaiva kimakurvata sañjaya || 1-1 ||
      ityasya ca dharmasya kṣetram samastadharmāṇāṃ kṣayādapavargaprāptyā trāṇabhūtam tadadhikāri śarīram | sarvakṣetrāṇāṃ kṣaderhiṃsārthatvāt parasparavadhyaghātakabhāvena vartamānānāṃ rāgavairāgyakrodhakṣamāprabhṛtīnāṃ samāgamo yatra tasmin sthitā ye māmakāḥ-avidyāpuruṣocitā avidyāmayāḥ saṅkalpāḥ | pāṇḍavāḥ-śuddhavidyāpuruṣocitā vidyātmanaḥ | te kimakurvata-kaiḥ khalu ke jitā iti yāvat | mameti kāyatīti māmakaḥ avidyāpuruṣaḥ | pāṇḍuḥ śuddhaḥ || 1 ||
  - verse: 2
    devanagari: |-
      सञ्जय उवाच
      दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा । आचार्यमुपसङ्गम्य राजा वचनमब्रवीत् ॥ १-२ ॥
    slp1: |-
      saYjaya uvAca
      dfzwvA tu pARqavAnIkaM vyUQaM duryoDanastadA . AcAryamupasaNgamya rAjA vacanamabravIt .. 1-2 ..
    iast: |-
      sañjaya uvāca
      dṛṣṭvā tu pāṇḍavānīkaṃ vyūḍhaṃ duryodhanastadā | ācāryamupasaṅgamya rājā vacanamabravīt || 1-2 ||
  - verse: 3
    devanagari: |-
      पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम् । व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता ॥ १-३ ॥
    slp1: |-
      paSyEtAM pARquputrARAmAcArya mahatIM camUm . vyUQAM drupadaputreRa tava SizyeRa DImatA .. 1-3 ..
    iast: |-
      paśyaitāṃ pāṇḍuputrāṇāmācārya mahatīṃ camūm | vyūḍhāṃ drupadaputreṇa tava śiṣyeṇa dhīmatā || 1-3 ||
  - verse: 4
    devanagari: |-
      अत्र शूरा महेष्वासा भीमार्जुनसमा युधि । युयुधानो विराटश्च द्रुपदश्च महारथः ॥ १-४ ॥
    slp1: |-
      atra SUrA mahezvAsA BImArjunasamA yuDi . yuyuDAno virAwaSca drupadaSca mahAraTaH .. 1-4 ..
    iast: |-
      atra śūrā maheṣvāsā bhīmārjunasamā yudhi | yuyudhāno virāṭaśca drupadaśca mahārathaḥ || 1-4 ||
  - verse: 5
    devanagari: |-
      धृष्टकेतुश्चेकितानः काशिराजश्च वीर्यवान् । पुरुजित् कुन्तिभोजश्च शैव्यश्च नरपुङ्गवः ॥ १-५ ॥
    slp1: |-
      DfzwaketuScekitAnaH kASirAjaSca vIryavAn . purujit kuntiBojaSca SEvyaSca narapuNgavaH .. 1-5 ..
    iast: |-
      dhṛṣṭaketuścekitānaḥ kāśirājaśca vīryavān | purujit kuntibhojaśca śaivyaśca narapuṅgavaḥ || 1-5 ||
  - verse: 6
    devanagari: |-
      युधामन्युश्च विक्रान्त उत्तमौजाश्च वीर्यवान् । सौभद्रो द्रौपदेयाश्च सर्व एव महारथाः ॥ १-६ ॥
    slp1: |-
      yuDAmanyuSca vikrAnta uttamOjASca vIryavAn . sOBadro drOpadeyASca sarva eva mahAraTAH .. 1-6 ..
    iast: |-
      yudhāmanyuśca vikrānta uttamaujāśca vīryavān | saubhadro draupadeyāśca sarva eva mahārathāḥ || 1-6 ||
  - verse: 7
    devanagari: |-
      अस्माकं तु विशिष्टा ये तान्निबोध द्विजोत्तम । नायका मम सैन्यस्य संज्ञार्थं तान् ब्रवीमि ते ॥ १-७ ॥
    slp1: |-
      asmAkaM tu viSizwA ye tAnniboDa dvijottama . nAyakA mama sEnyasya saMjYArTaM tAn bravImi te .. 1-7 ..
    iast: |-
      asmākaṃ tu viśiṣṭā ye tānnibodha dvijottama | nāyakā mama sainyasya saṃjñārthaṃ tān bravīmi te || 1-7 ||
  - verse: 8
    devanagari: |-
      सैन्ये महति ये सर्वे नेतारः शूरसम्मताः । भवान् भीष्मश्च कर्णश्च कृपः शल्यो जयद्रथः अश्वत्थामा विकर्णश्च सौमदत्तिश्च वीर्यवान् ॥ १-८ ॥
    slp1: |-
      sEnye mahati ye sarve netAraH SUrasammatAH . BavAn BIzmaSca karRaSca kfpaH Salyo jayadraTaH aSvatTAmA vikarRaSca sOmadattiSca vIryavAn .. 1-8 ..
    iast: |-
      sainye mahati ye sarve netāraḥ śūrasammatāḥ | bhavān bhīṣmaśca karṇaśca kṛpaḥ śalyo jayadrathaḥ aśvatthāmā vikarṇaśca saumadattiśca vīryavān || 1-8 ||
  - verse: 9
    devanagari: |-
      अन्ये च बहवः शूरा मदर्थे त्यक्तजीविताः । नानाशस्त्रप्रहरणा नास्ति नानायुद्धविशारदाः ॥ १-९ ॥
    slp1: |-
      anye ca bahavaH SUrA madarTe tyaktajIvitAH . nAnASastrapraharaRA nAsti nAnAyudDaviSAradAH .. 1-9 ..
    iast: |-
      anye ca bahavaḥ śūrā madarthe tyaktajīvitāḥ | nānāśastrapraharaṇā nāsti nānāyuddhaviśāradāḥ || 1-9 ||
  - verse: 10
    devanagari: |-
      किंवानेन परिगणनेन इदं तावद्वस्तुतत्त्वमित्याह
      अपर्याप्तं तदस्माकं बलं भीमाभिरक्षितम् । पर्याप्तं त्विदमेतेषां बलं भीष्माभिरक्षितम् ॥ १-१० ॥
      भीमसेनाभिरक्षितं पाण्डवीयं बलम् अस्माकमपर्याप्तं-जेतुमशक्यम् अथवा-अपर्याप्तं-कियत्तदस्मद्वलस्येत्यर्थः । इदं तु भीष्माभिरक्षितं बलमस्माकं संबन्धि एतेषां-पाण्डवानां पर्याप्तं-जेतुं शक्यम् यदि वा पर्याप्तं-बहु न समरे जय्यमेतैरिति ॥ १-१० ॥
    slp1: |-
      kiMvAnena parigaRanena idaM tAvadvastutattvamityAha
      aparyAptaM tadasmAkaM balaM BImABirakzitam . paryAptaM tvidametezAM balaM BIzmABirakzitam .. 1-10 ..
      BImasenABirakzitaM pARqavIyaM balam asmAkamaparyAptaM-jetumaSakyam aTavA-aparyAptaM-kiyattadasmadvalasyetyarTaH . idaM tu BIzmABirakzitaM balamasmAkaM saMbanDi etezAM-pARqavAnAM paryAptaM-jetuM Sakyam yadi vA paryAptaM-bahu na samare jayyametEriti .. 1-10 ..
    iast: |-
      kiṃvānena parigaṇanena idaṃ tāvadvastutattvamityāha
      aparyāptaṃ tadasmākaṃ balaṃ bhīmābhirakṣitam | paryāptaṃ tvidameteṣāṃ balaṃ bhīṣmābhirakṣitam || 1-10 ||
      bhīmasenābhirakṣitaṃ pāṇḍavīyaṃ balam asmākamaparyāptaṃ-jetumaśakyam athavā-aparyāptaṃ-kiyattadasmadvalasyetyarthaḥ | idaṃ tu bhīṣmābhirakṣitaṃ balamasmākaṃ saṃbandhi eteṣāṃ-pāṇḍavānāṃ paryāptaṃ-jetuṃ śakyam yadi vā paryāptaṃ-bahu na samare jayyametairiti || 1-10 ||
  - verse: 11
    devanagari: |-
      अयनेषु च सर्वेषु यथाभागमवस्थिताः । भीष्ममेवाभिरक्षन्तु भवन्तः सर्व एव हि ॥ १-११ ॥
    slp1: |-
      ayanezu ca sarvezu yaTABAgamavasTitAH . BIzmamevABirakzantu BavantaH sarva eva hi .. 1-11 ..
    iast: |-
      ayaneṣu ca sarveṣu yathābhāgamavasthitāḥ | bhīṣmamevābhirakṣantu bhavantaḥ sarva eva hi || 1-11 ||
  - verse: 12
    devanagari: |-
      तस्य सञ्जनयन् हर्षं कुरुवृद्धः पितामहः । सिंहनादं विनद्योच्चैः शङ्खं दध्मौ प्रतापवान् ॥ १-१२ ॥
    slp1: |-
      tasya saYjanayan harzaM kuruvfdDaH pitAmahaH . siMhanAdaM vinadyoccEH SaNKaM daDmO pratApavAn .. 1-12 ..
    iast: |-
      tasya sañjanayan harṣaṃ kuruvṛddhaḥ pitāmahaḥ | siṃhanādaṃ vinadyoccaiḥ śaṅkhaṃ dadhmau pratāpavān || 1-12 ||
  - verse: 13
    devanagari: |-
      ततः शङ्खाश्च भीर्यश्च पणवानकगोमुखाः । सहसैवाभ्यहन्यन्त स शब्दस्तुमुलोऽभवत् ॥ १-१३ ॥
    slp1: |-
      tataH SaNKASca BIryaSca paRavAnakagomuKAH . sahasEvAByahanyanta sa Sabdastumulo'Bavat .. 1-13 ..
    iast: |-
      tataḥ śaṅkhāśca bhīryaśca paṇavānakagomukhāḥ | sahasaivābhyahanyanta sa śabdastumulo'bhavat || 1-13 ||
  - verse: 14
    devanagari: |-
      ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ । माधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः ॥ १-१४ ॥
    slp1: |-
      tataH SvetErhayEryukte mahati syandane sTitO . mADavaH pARqavaScEva divyO SaNKO pradaDmatuH .. 1-14 ..
    iast: |-
      tataḥ śvetairhayairyukte mahati syandane sthitau | mādhavaḥ pāṇḍavaścaiva divyau śaṅkhau pradadhmatuḥ || 1-14 ||
  - verse: 15
    devanagari: |-
      पाञ्जजन्यं हृषीकेशो देवदत्तं धनञ्जयः । पौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः ॥ १-१५ ॥
    slp1: |-
      pAYjajanyaM hfzIkeSo devadattaM DanaYjayaH . pORqraM daDmO mahASaNKaM BImakarmA vfkodaraH .. 1-15 ..
    iast: |-
      pāñjajanyaṃ hṛṣīkeśo devadattaṃ dhanañjayaḥ | pauṇḍraṃ dadhmau mahāśaṅkhaṃ bhīmakarmā vṛkodaraḥ || 1-15 ||
  - verse: 16
    devanagari: |-
      अनन्तविजयं राजा कुन्तीपुत्रो युधिष्ठिरः । नकुलः सहदेवश्व सुघोषमणिपुष्पकौ ॥ १-१६ ॥
    slp1: |-
      anantavijayaM rAjA kuntIputro yuDizWiraH . nakulaH sahadevaSva suGozamaRipuzpakO .. 1-16 ..
    iast: |-
      anantavijayaṃ rājā kuntīputro yudhiṣṭhiraḥ | nakulaḥ sahadevaśva sughoṣamaṇipuṣpakau || 1-16 ||
  - verse: 17
    devanagari: |-
      काश्यश्च परमेष्वासः शिखण्डी च महारथः । धृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः ॥ १-१७ ॥
    slp1: |-
      kASyaSca paramezvAsaH SiKaRqI ca mahAraTaH . Dfzwadyumno virAwaSca sAtyakiScAparAjitaH .. 1-17 ..
    iast: |-
      kāśyaśca parameṣvāsaḥ śikhaṇḍī ca mahārathaḥ | dhṛṣṭadyumno virāṭaśca sātyakiścāparājitaḥ || 1-17 ||
  - verse: 18
    devanagari: |-
      पाञ्चालश्च महेष्वासो द्रौपदेयाश्च पञ्च ये । सौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक् पृथक् ॥ १-१८ ॥
    slp1: |-
      pAYcAlaSca mahezvAso drOpadeyASca paYca ye . sOBadraSca mahAbAhuH SaNKAndaDmuH pfTak pfTak .. 1-18 ..
    iast: |-
      pāñcālaśca maheṣvāso draupadeyāśca pañca ye | saubhadraśca mahābāhuḥ śaṅkhāndadhmuḥ pṛthak pṛthak || 1-18 ||
  - verse: 19
    devanagari: |-
      स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत् । नभश्च पृथिवीं चैव तुमुलो व्यनुनादयन् ॥ १-१९ ॥
    slp1: |-
      sa Gozo DArtarAzwrARAM hfdayAni vyadArayat . naBaSca pfTivIM cEva tumulo vyanunAdayan .. 1-19 ..
    iast: |-
      sa ghoṣo dhārtarāṣṭrāṇāṃ hṛdayāni vyadārayat | nabhaśca pṛthivīṃ caiva tumulo vyanunādayan || 1-19 ||
  - verse: 20
    devanagari: |-
      अथ व्यवस्थितान्दृष्ट्वा धार्तराष्ट्रान्कपिध्वजः । प्रवृत्ते शस्त्रसम्पाते धनुरुद्यम्य पाण्डवः ॥ १-२० ॥
    slp1: |-
      aTa vyavasTitAndfzwvA DArtarAzwrAnkapiDvajaH . pravftte SastrasampAte Danurudyamya pARqavaH .. 1-20 ..
    iast: |-
      atha vyavasthitāndṛṣṭvā dhārtarāṣṭrānkapidhvajaḥ | pravṛtte śastrasampāte dhanurudyamya pāṇḍavaḥ || 1-20 ||
  - verse: 21
    devanagari: |-
      हृषीकेशं तदा वाक्यमिदमाह महीपते ।
      अर्जुन उवाच
      सेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत ॥ १-२१ ॥
    slp1: |-
      hfzIkeSaM tadA vAkyamidamAha mahIpate .
      arjuna uvAca
      senayoruBayormaDye raTaM sTApaya me'cyuta .. 1-21 ..
    iast: |-
      hṛṣīkeśaṃ tadā vākyamidamāha mahīpate |
      arjuna uvāca
      senayorubhayormadhye rathaṃ sthāpaya me'cyuta || 1-21 ||
  - verse: 22
    devanagari: |-
      यावदेतान्निरीक्षेऽहं योद्ध्रुकामानवस्थितान् । कैर्मया सह योद्धव्यमस्मिन् रणसमुद्यमे ॥ १-२२ ॥
    slp1: |-
      yAvadetAnnirIkze'haM yodDrukAmAnavasTitAn . kErmayA saha yodDavyamasmin raRasamudyame .. 1-22 ..
    iast: |-
      yāvadetānnirīkṣe'haṃ yoddhrukāmānavasthitān | kairmayā saha yoddhavyamasmin raṇasamudyame || 1-22 ||
  - verse: 23
    devanagari: |-
      योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः । धार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः ॥ १-२३ ॥
    slp1: |-
      yotsyamAnAnavekze'haM ya ete'tra samAgatAH . DArtarAzwrasya durbudDeryudDe priyacikIrzavaH .. 1-23 ..
    iast: |-
      yotsyamānānavekṣe'haṃ ya ete'tra samāgatāḥ | dhārtarāṣṭrasya durbuddheryuddhe priyacikīrṣavaḥ || 1-23 ||
  - verse: 24
    devanagari: |-
      सञ्जय उवाच
      एवमुक्तो हृषीकेशो गुडाकेशेन भारत ! । सेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम् ॥ १-२४ ॥
    slp1: |-
      saYjaya uvAca
      evamukto hfzIkeSo guqAkeSena BArata ! . senayoruBayormaDye sTApayitvA raTottamam .. 1-24 ..
    iast: |-
      sañjaya uvāca
      evamukto hṛṣīkeśo guḍākeśena bhārata ! | senayorubhayormadhye sthāpayitvā rathottamam || 1-24 ||
  - verse: 25
    devanagari: |-
      भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम् । उवाच पार्थ पश्यैतान्समवेतान्कुरूनिति ॥ १-२५ ॥
    slp1: |-
      BIzmadroRapramuKataH sarvezAM ca mahIkzitAm . uvAca pArTa paSyEtAnsamavetAnkurUniti .. 1-25 ..
    iast: |-
      bhīṣmadroṇapramukhataḥ sarveṣāṃ ca mahīkṣitām | uvāca pārtha paśyaitānsamavetānkurūniti || 1-25 ||
  - verse: 26
    devanagari: |-
      तत्रापश्यत्स्थितान्पार्थः पितृनथ पितामहान् । आचार्यान्मातुलान्भ्रातॄन्पुत्रान्पौत्रान्सखींस्तथा ॥ १-२६ ॥
    slp1: |-
      tatrApaSyatsTitAnpArTaH pitfnaTa pitAmahAn . AcAryAnmAtulAnBrAtFnputrAnpOtrAnsaKIMstaTA .. 1-26 ..
    iast: |-
      tatrāpaśyatsthitānpārthaḥ pitṛnatha pitāmahān | ācāryānmātulānbhrātṝnputrānpautrānsakhīṃstathā || 1-26 ||
  - verse: 27
    devanagari: |-
      श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि ॥ १-२७ ॥
    slp1: |-
      SvaSurAnsuhfdaScEva senayoruBayorapi .. 1-27 ..
    iast: |-
      śvaśurānsuhṛdaścaiva senayorubhayorapi || 1-27 ||
  - verse: 28
    devanagari: |-
      तान्समीक्ष्य स कौन्तेयः सर्वान् बन्धूनवस्थितान् । कृपया परयाविष्टो सीदमानोऽब्रवीदिदम् ॥ १-२८ ॥
    slp1: |-
      tAnsamIkzya sa kOnteyaH sarvAn banDUnavasTitAn . kfpayA parayAvizwo sIdamAno'bravIdidam .. 1-28 ..
    iast: |-
      tānsamīkṣya sa kaunteyaḥ sarvān bandhūnavasthitān | kṛpayā parayāviṣṭo sīdamāno'bravīdidam || 1-28 ||
  - verse: 29
    devanagari: |-
      अर्जुन उवाच
      दृष्ट्वेमान्स्वजनान्कृष्ण युयुत्सून्समुपस्थितान् । सीदन्ति मम गात्राणि मुखं च परिशुष्यति ॥ १-२९ ॥
    slp1: |-
      arjuna uvAca
      dfzwvemAnsvajanAnkfzRa yuyutsUnsamupasTitAn . sIdanti mama gAtrARi muKaM ca pariSuzyati .. 1-29 ..
    iast: |-
      arjuna uvāca
      dṛṣṭvemānsvajanānkṛṣṇa yuyutsūnsamupasthitān | sīdanti mama gātrāṇi mukhaṃ ca pariśuṣyati || 1-29 ||
  - verse: 30
    devanagari: |-
      वेपथुश्च शरीरे मे रोमहर्षश्च जायते । गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते ॥ १-३० ॥
    slp1: |-
      vepaTuSca SarIre me romaharzaSca jAyate . gARqIvaM sraMsate hastAttvakcEva paridahyate .. 1-30 ..
    iast: |-
      vepathuśca śarīre me romaharṣaśca jāyate | gāṇḍīvaṃ sraṃsate hastāttvakcaiva paridahyate || 1-30 ||
  - verse: 31
    devanagari: |-
      न च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः । निमित्तानि च पश्यामि विपरीतानि केशव ! ॥ १-३१ ॥
    slp1: |-
      na ca SaknomyavasTAtuM BramatIva ca me manaH . nimittAni ca paSyAmi viparItAni keSava ! .. 1-31 ..
    iast: |-
      na ca śaknomyavasthātuṃ bhramatīva ca me manaḥ | nimittāni ca paśyāmi viparītāni keśava ! || 1-31 ||
  - verse: 32
    devanagari: |-
      न च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे । न काङ्क्षे विजयं कृष्ण ! न च राज्यं सुखानि च ॥ १-३२ ॥
    slp1: |-
      na ca Sreyo'nupaSyAmi hatvA svajanamAhave . na kANkze vijayaM kfzRa ! na ca rAjyaM suKAni ca .. 1-32 ..
    iast: |-
      na ca śreyo'nupaśyāmi hatvā svajanamāhave | na kāṅkṣe vijayaṃ kṛṣṇa ! na ca rājyaṃ sukhāni ca || 1-32 ||
  - verse: 33
    devanagari: |-
      किं नो राज्येन गोविन्द ! किं भोगैर्जीवितेन वा । येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च ॥ १-३३ ॥
    slp1: |-
      kiM no rAjyena govinda ! kiM BogErjIvitena vA . yezAmarTe kANkzitaM no rAjyaM BogAH suKAni ca .. 1-33 ..
    iast: |-
      kiṃ no rājyena govinda ! kiṃ bhogairjīvitena vā | yeṣāmarthe kāṅkṣitaṃ no rājyaṃ bhogāḥ sukhāni ca || 1-33 ||
  - verse: 34
    devanagari: |-
      त इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च । आचार्याः पितरः पुत्रास्तथैव च पितामहाः ॥ १-३४ ॥
    slp1: |-
      ta ime'vasTitA yudDe prARAMstyaktvA DanAni ca . AcAryAH pitaraH putrAstaTEva ca pitAmahAH .. 1-34 ..
    iast: |-
      ta ime'vasthitā yuddhe prāṇāṃstyaktvā dhanāni ca | ācāryāḥ pitaraḥ putrāstathaiva ca pitāmahāḥ || 1-34 ||
  - verse: 35
    devanagari: |-
      मातुलाः श्वशुराः पौत्राः स्यालाः सम्बन्धिनस्तथा । एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन ! ॥ १-३५ ॥
      अमी आचार्यादयः इति विशेषबुद्ध्या बुद्धावारोप्यमाणा वधकर्मतयावश्यं पापदायिनः । तथा भोगसुखादिदृष्टार्थमेतद्युद्धं क्रियते इति बुद्ध्या क्रियमाणं युद्धेष्ववध्यहननादि तदवश्यं पातककारीति पूर्वपक्षाभिप्रायः । अत एव स्वधर्ममात्रतयैव कर्माण्यनुतिष्ठ न विशेषधिया-इत्युत्तरं दास्यते ॥ ३५ ॥
    slp1: |-
      mAtulAH SvaSurAH pOtrAH syAlAH sambanDinastaTA . etAnna hantumicCAmi Gnato'pi maDusUdana ! .. 1-35 ..
      amI AcAryAdayaH iti viSezabudDyA budDAvAropyamARA vaDakarmatayAvaSyaM pApadAyinaH . taTA BogasuKAdidfzwArTametadyudDaM kriyate iti budDyA kriyamARaM yudDezvavaDyahananAdi tadavaSyaM pAtakakArIti pUrvapakzABiprAyaH . ata eva svaDarmamAtratayEva karmARyanutizWa na viSezaDiyA-ityuttaraM dAsyate .. 35 ..
    iast: |-
      mātulāḥ śvaśurāḥ pautrāḥ syālāḥ sambandhinastathā | etānna hantumicchāmi ghnato'pi madhusūdana ! || 1-35 ||
      amī ācāryādayaḥ iti viśeṣabuddhyā buddhāvāropyamāṇā vadhakarmatayāvaśyaṃ pāpadāyinaḥ | tathā bhogasukhādidṛṣṭārthametadyuddhaṃ kriyate iti buddhyā kriyamāṇaṃ yuddheṣvavadhyahananādi tadavaśyaṃ pātakakārīti pūrvapakṣābhiprāyaḥ | ata eva svadharmamātratayaiva karmāṇyanutiṣṭha na viśeṣadhiyā-ityuttaraṃ dāsyate || 35 ||
  - verse: 36
    devanagari: |-
      निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन ! ॥ १-३६ ॥
      निहत्येति आततायिनां हनने पापमेव कर्तृ । अतोऽयमर्थः पापेन तावदेतेऽस्मच्छत्रवो हताः परतन्त्रीकृताः तांश्च निहत्यास्मानपि पापमाश्रयेत् । पापमत्र लोभवशात् कुलक्षयादिदोषादर्शनम् ॥ १-३६ ॥
    slp1: |-
      nihatya DArtarAzwrAnnaH kA prItiH syAjjanArdana ! .. 1-36 ..
      nihatyeti AtatAyinAM hanane pApameva kartf . ato'yamarTaH pApena tAvadete'smacCatravo hatAH paratantrIkftAH tAMSca nihatyAsmAnapi pApamASrayet . pApamatra loBavaSAt kulakzayAdidozAdarSanam .. 1-36 ..
    iast: |-
      nihatya dhārtarāṣṭrānnaḥ kā prītiḥ syājjanārdana ! || 1-36 ||
      nihatyeti ātatāyināṃ hanane pāpameva kartṛ | ato'yamarthaḥ pāpena tāvadete'smacchatravo hatāḥ paratantrīkṛtāḥ tāṃśca nihatyāsmānapi pāpamāśrayet | pāpamatra lobhavaśāt kulakṣayādidoṣādarśanam || 1-36 ||
  - verse: 37
    devanagari: |-
      पापमेवाश्रयेदस्मान् हत्वैतानाततायिनः । तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्स्वबान्धवान् ॥ १-३७ ॥
    slp1: |-
      pApamevASrayedasmAn hatvEtAnAtatAyinaH . tasmAnnArhA vayaM hantuM DArtarAzwrAnsvabAnDavAn .. 1-37 ..
    iast: |-
      pāpamevāśrayedasmān hatvaitānātatāyinaḥ | tasmānnārhā vayaṃ hantuṃ dhārtarāṣṭrānsvabāndhavān || 1-37 ||
  - verse: 38
    devanagari: |-
      अत एव कुलक्षयादिधर्माणामुपक्षेपं करोति अर्जुनः स्वजनं हि कथं इत्यादिना
      स्वजनं हि कथं हत्वा सुखिनः स्याम माधव ! । यद्यप्येते न पश्यन्ति लोभोपहतचेतसः ॥ १-३८ ॥
    slp1: |-
      ata eva kulakzayAdiDarmARAmupakzepaM karoti arjunaH svajanaM hi kaTaM ityAdinA
      svajanaM hi kaTaM hatvA suKinaH syAma mADava ! . yadyapyete na paSyanti loBopahatacetasaH .. 1-38 ..
    iast: |-
      ata eva kulakṣayādidharmāṇāmupakṣepaṃ karoti arjunaḥ svajanaṃ hi kathaṃ ityādinā
      svajanaṃ hi kathaṃ hatvā sukhinaḥ syāma mādhava ! | yadyapyete na paśyanti lobhopahatacetasaḥ || 1-38 ||
  - verse: 39
    devanagari: |-
      कुलक्षयकृतं दोषं मित्रद्रोहे च पातकम् । कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम् ॥ १-३९ ॥
    slp1: |-
      kulakzayakftaM dozaM mitradrohe ca pAtakam . kaTaM na jYeyamasmABiH pApAdasmAnnivartitum .. 1-39 ..
    iast: |-
      kulakṣayakṛtaṃ doṣaṃ mitradrohe ca pātakam | kathaṃ na jñeyamasmābhiḥ pāpādasmānnivartitum || 1-39 ||
  - verse: 40
    devanagari: |-
      कुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन ! । कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः ॥ १-४० ॥
    slp1: |-
      kulakzayakftaM dozaM prapaSyadBirjanArdana ! . kulakzaye praRaSyanti kulaDarmAH sanAtanAH .. 1-40 ..
    iast: |-
      kulakṣayakṛtaṃ doṣaṃ prapaśyadbhirjanārdana ! | kulakṣaye praṇaśyanti kuladharmāḥ sanātanāḥ || 1-40 ||
  - verse: 41
    devanagari: |-
      धर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत । अधर्माभिभवात् कृष्ण ! प्रदुष्यन्ति कुलस्त्रियः ॥ १-४१ ॥
    slp1: |-
      Darme nazwe kulaM kftsnamaDarmo'BiBavatyuta . aDarmABiBavAt kfzRa ! praduzyanti kulastriyaH .. 1-41 ..
    iast: |-
      dharme naṣṭe kulaṃ kṛtsnamadharmo'bhibhavatyuta | adharmābhibhavāt kṛṣṇa ! praduṣyanti kulastriyaḥ || 1-41 ||
  - verse: 42
    devanagari: |-
      स्त्रीषु दुष्टासु वार्ष्णेय ! जायते वर्णसङ्करः । सङ्करो नरकायैव कुलघ्नानां कुलस्य च ॥ १-४२ ॥
    slp1: |-
      strIzu duzwAsu vArzReya ! jAyate varRasaNkaraH . saNkaro narakAyEva kulaGnAnAM kulasya ca .. 1-42 ..
    iast: |-
      strīṣu duṣṭāsu vārṣṇeya ! jāyate varṇasaṅkaraḥ | saṅkaro narakāyaiva kulaghnānāṃ kulasya ca || 1-42 ||
  - verse: 43
    devanagari: |-
      पतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः । दोषैरेतैः कुलघ्नानां वर्णसङ्करकारकैः ॥ १-४३ ॥
    slp1: |-
      patanti pitaro hyezAM luptapiRqodakakriyAH . dozEretEH kulaGnAnAM varRasaNkarakArakEH .. 1-43 ..
    iast: |-
      patanti pitaro hyeṣāṃ luptapiṇḍodakakriyāḥ | doṣairetaiḥ kulaghnānāṃ varṇasaṅkarakārakaiḥ || 1-43 ||
  - verse: 44
    devanagari: |-
      उत्साद्यन्ते जातिधर्माः कुलधर्माश्च शाश्वताः । उत्सन्नकुलधर्माणां मनुष्याणां जनार्दन ! ॥ १-४४ ॥
    slp1: |-
      utsAdyante jAtiDarmAH kulaDarmASca SASvatAH . utsannakulaDarmARAM manuzyARAM janArdana ! .. 1-44 ..
    iast: |-
      utsādyante jātidharmāḥ kuladharmāśca śāśvatāḥ | utsannakuladharmāṇāṃ manuṣyāṇāṃ janārdana ! || 1-44 ||
  - verse: 45
    devanagari: |-
      नरके नियतं वासो भवतीत्यनुशुश्रुम ।
      विशेषफलबुद्ध्या हन्तव्यादिविशेषबुद्ध्या च हननं महापातकमिति । एतदेव संक्षिप्याभिधातुं परितापातिशयसूचनायात्मगतमेवार्जुनो वचनमाह
      अहो वत महत्पापं कर्तुं व्यवसिता वयम् । यद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः ॥ १-४५ ॥
      वयमिति - कौरवपाण्डवभेदभिन्नाः सर्व एवेत्यर्थः ॥ १-४५ ॥
    slp1: |-
      narake niyataM vAso BavatItyanuSuSruma .
      viSezaPalabudDyA hantavyAdiviSezabudDyA ca hananaM mahApAtakamiti . etadeva saMkzipyABiDAtuM paritApAtiSayasUcanAyAtmagatamevArjuno vacanamAha
      aho vata mahatpApaM kartuM vyavasitA vayam . yadrAjyasuKaloBena hantuM svajanamudyatAH .. 1-45 ..
      vayamiti - kOravapARqavaBedaBinnAH sarva evetyarTaH .. 1-45 ..
    iast: |-
      narake niyataṃ vāso bhavatītyanuśuśruma |
      viśeṣaphalabuddhyā hantavyādiviśeṣabuddhyā ca hananaṃ mahāpātakamiti | etadeva saṃkṣipyābhidhātuṃ paritāpātiśayasūcanāyātmagatamevārjuno vacanamāha
      aho vata mahatpāpaṃ kartuṃ vyavasitā vayam | yadrājyasukhalobhena hantuṃ svajanamudyatāḥ || 1-45 ||
      vayamiti - kauravapāṇḍavabhedabhinnāḥ sarva evetyarthaḥ || 1-45 ||
  - verse: 46
    devanagari: |-
      एवं सर्वेष्वविवेकिषु मम विवेकिनः किमुचितम् उचितं तावद्युद्धान्निवर्तनम् एतत्तूचिततरमित्याह
      यदिमामप्रतीकारमशस्त्रं शस्त्रपाणयः । धार्तराष्ट्रा रणे हन्युस्तन्मे क्षेमतरं भवेत् ॥ १-४६ ॥
    slp1: |-
      evaM sarvezvavivekizu mama vivekinaH kimucitam ucitaM tAvadyudDAnnivartanam etattUcitataramityAha
      yadimAmapratIkAramaSastraM SastrapARayaH . DArtarAzwrA raRe hanyustanme kzemataraM Bavet .. 1-46 ..
    iast: |-
      evaṃ sarveṣvavivekiṣu mama vivekinaḥ kimucitam ucitaṃ tāvadyuddhānnivartanam etattūcitataramityāha
      yadimāmapratīkāramaśastraṃ śastrapāṇayaḥ | dhārtarāṣṭrā raṇe hanyustanme kṣemataraṃ bhavet || 1-46 ||
  - verse: 47
    devanagari: |-
      सञ्जय उवाच
      एवमुक्त्वार्जुनः सङ्ख्ये रथोपस्थ उपाविशत् । विसृज्य सशरं चापं शोकसंविग्नमानसः ॥ १-४७ ॥
    slp1: |-
      saYjaya uvAca
      evamuktvArjunaH saNKye raTopasTa upAviSat . visfjya saSaraM cApaM SokasaMvignamAnasaH .. 1-47 ..
    iast: |-
      sañjaya uvāca
      evamuktvārjunaḥ saṅkhye rathopastha upāviśat | visṛjya saśaraṃ cāpaṃ śokasaṃvignamānasaḥ || 1-47 ||
  - verse: 1000
    devanagari: |-
      विद्याविद्योभयाघातसंघट्ट विवशीकृतः युक्त्या द्वयमपि त्यक्त्वा निर्विवेको भवेन्मुनिः ॥ १-१ ॥
    slp1: |-
      vidyAvidyoBayAGAtasaMGawwa vivaSIkftaH yuktyA dvayamapi tyaktvA nirviveko BavenmuniH .. 1-1 ..
    iast: |-
      vidyāvidyobhayāghātasaṃghaṭṭa vivaśīkṛtaḥ yuktyā dvayamapi tyaktvā nirviveko bhavenmuniḥ || 1-1 ||
- chapter: 2
  title_sa: द्वितीयोऽध्यायः
  title_iast: "dvitīyo'dhyāyaḥ"
  title_en: "Second Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      सञ्जय उवाच
      तं तथा कृपयाविष्टमश्रुपूर्णाकुलेक्षणम् । विषीदन्तमिदं वाक्यमुवाच मधुसूदनः ॥ २-१ ॥
    slp1: |-
      saYjaya uvAca
      taM taTA kfpayAvizwamaSrupUrRAkulekzaRam . vizIdantamidaM vAkyamuvAca maDusUdanaH .. 2-1 ..
    iast: |-
      sañjaya uvāca
      taṃ tathā kṛpayāviṣṭamaśrupūrṇākulekṣaṇam | viṣīdantamidaṃ vākyamuvāca madhusūdanaḥ || 2-1 ||
  - verse: 2
    devanagari: |-
      श्रीभगवानुवाच
      कुतस्त्वा कश्मलमिदं विषमे समुपस्थितम् । अनार्यजुष्टमस्वर्ग्यमकीर्तिकरमर्जुन ॥ २-२ ॥
      आदौ लोकव्यवहाराश्रयेणैव श्रीभगवानर्जुनं प्रतिबोधयति क्रमात्तु ज्ञानं करिष्यतीति अतः अनार्यजुष्टम् इत्याह ॥ २-२ ॥
    slp1: |-
      SrIBagavAnuvAca
      kutastvA kaSmalamidaM vizame samupasTitam . anAryajuzwamasvargyamakIrtikaramarjuna .. 2-2 ..
      AdO lokavyavahArASrayeREva SrIBagavAnarjunaM pratiboDayati kramAttu jYAnaM karizyatIti ataH anAryajuzwam ityAha .. 2-2 ..
    iast: |-
      śrībhagavānuvāca
      kutastvā kaśmalamidaṃ viṣame samupasthitam | anāryajuṣṭamasvargyamakīrtikaramarjuna || 2-2 ||
      ādau lokavyavahārāśrayeṇaiva śrībhagavānarjunaṃ pratibodhayati kramāttu jñānaṃ kariṣyatīti ataḥ anāryajuṣṭam ityāha || 2-2 ||
  - verse: 3
    devanagari: |-
      क्लैव्यादिभिर्निर्भर्त्सनमभिदधदधर्मे तव धर्माभिमानोऽयमित्यादि दर्शयति
      मा क्लैब्यं गच्छ कौन्तेन नैतत्त्वय्युपपद्यते । क्षुद्रं हृदयदौर्बल्यं त्यक्त्वोत्तिष्ठ परन्तप ॥ २-३ ॥
    slp1: |-
      klEvyAdiBirnirBartsanamaBidaDadaDarme tava DarmABimAno'yamityAdi darSayati
      mA klEbyaM gacCa kOntena nEtattvayyupapadyate . kzudraM hfdayadOrbalyaM tyaktvottizWa parantapa .. 2-3 ..
    iast: |-
      klaivyādibhirnirbhartsanamabhidadhadadharme tava dharmābhimāno'yamityādi darśayati
      mā klaibyaṃ gaccha kauntena naitattvayyupapadyate | kṣudraṃ hṛdayadaurbalyaṃ tyaktvottiṣṭha parantapa || 2-3 ||
  - verse: 4
    devanagari: |-
      अर्जुन उवाच
      कथं भीष्ममहं सङ्ख्ये द्रोणं च मधुसूदन इषुभिः प्रतियोत्स्यामि पूजार्हावरिसूदन ॥ २-४ ॥
    slp1: |-
      arjuna uvAca
      kaTaM BIzmamahaM saNKye droRaM ca maDusUdana izuBiH pratiyotsyAmi pUjArhAvarisUdana .. 2-4 ..
    iast: |-
      arjuna uvāca
      kathaṃ bhīṣmamahaṃ saṅkhye droṇaṃ ca madhusūdana iṣubhiḥ pratiyotsyāmi pūjārhāvarisūdana || 2-4 ||
  - verse: 5
    devanagari: |-
      गुरूनहत्वा हि महानुभावा- ञ्छ्रेयश्चर्तुं भैक्षमपीह लोके । न त्वर्थकामस्तु गुरून्निहत्य भुञ्जीय भोगान् रुधिरप्रदिग्धान् ॥ २-५ ॥
      भीष्मं द्रोणं च इत्यादिना भुञ्जीय भोगान् इत्यनेन च कर्मविशेषानु-सन्धानं फलविशेषानुसन्धानं च हेयतया पूर्वपक्षे सूचयति ॥ ५ ॥
    slp1: |-
      gurUnahatvA hi mahAnuBAvA- YCreyaScartuM BEkzamapIha loke . na tvarTakAmastu gurUnnihatya BuYjIya BogAn ruDirapradigDAn .. 2-5 ..
      BIzmaM droRaM ca ityAdinA BuYjIya BogAn ityanena ca karmaviSezAnu-sanDAnaM PalaviSezAnusanDAnaM ca heyatayA pUrvapakze sUcayati .. 5 ..
    iast: |-
      gurūnahatvā hi mahānubhāvā- ñchreyaścartuṃ bhaikṣamapīha loke | na tvarthakāmastu gurūnnihatya bhuñjīya bhogān rudhirapradigdhān || 2-5 ||
      bhīṣmaṃ droṇaṃ ca ityādinā bhuñjīya bhogān ityanena ca karmaviśeṣānu-sandhānaṃ phalaviśeṣānusandhānaṃ ca heyatayā pūrvapakṣe sūcayati || 5 ||
  - verse: 6
    devanagari: |-
      नैतद्विद्मः कतरन्नो गरीयो यद्वा जयेम यदि वा नो जयेयुः । यानेव हत्वा न जिजीविषाम- स्ते नः स्थिताः प्रमुखे धार्तराष्ट्राः ॥ २-६ ॥
      नैतद्विद्यः-इत्यनेन च कर्मविशेषानुसंधानमाह । निरभिसंधानं तावत्कर्म नोपपद्यते । न च पराजयमभिसंधाय युद्धे प्रवर्तते । जयोऽपि चायमनर्थ एव । तदाह अहत्वा गुरून् भैक्षमपि चर्तुं श्रेयः । एतच्च निश्चेतुमशक्यम्-किं जयं काङ्क्षामः किं वा पराजयम् जयोऽपि बन्धूनां विनाशात् ॥ ६ ॥
    slp1: |-
      nEtadvidmaH kataranno garIyo yadvA jayema yadi vA no jayeyuH . yAneva hatvA na jijIvizAma- ste naH sTitAH pramuKe DArtarAzwrAH .. 2-6 ..
      nEtadvidyaH-ityanena ca karmaviSezAnusaMDAnamAha . niraBisaMDAnaM tAvatkarma nopapadyate . na ca parAjayamaBisaMDAya yudDe pravartate . jayo'pi cAyamanarTa eva . tadAha ahatvA gurUn BEkzamapi cartuM SreyaH . etacca niScetumaSakyam-kiM jayaM kANkzAmaH kiM vA parAjayam jayo'pi banDUnAM vinASAt .. 6 ..
    iast: |-
      naitadvidmaḥ kataranno garīyo yadvā jayema yadi vā no jayeyuḥ | yāneva hatvā na jijīviṣāma- ste naḥ sthitāḥ pramukhe dhārtarāṣṭrāḥ || 2-6 ||
      naitadvidyaḥ-ityanena ca karmaviśeṣānusaṃdhānamāha | nirabhisaṃdhānaṃ tāvatkarma nopapadyate | na ca parājayamabhisaṃdhāya yuddhe pravartate | jayo'pi cāyamanartha eva | tadāha ahatvā gurūn bhaikṣamapi cartuṃ śreyaḥ | etacca niścetumaśakyam-kiṃ jayaṃ kāṅkṣāmaḥ kiṃ vā parājayam jayo'pi bandhūnāṃ vināśāt || 6 ||
  - verse: 7
    devanagari: |-
      कार्पण्यदोषोपहतस्वभावः पृच्छामि त्वां धर्मसंमूढचेताः । यच्छ्रेयः स्यान्निश्चितं ब्रूहि तन्मे शिष्यस्तेऽहं शाधि मां त्वां प्रपन्नम् ॥ २-७ ॥
    slp1: |-
      kArpaRyadozopahatasvaBAvaH pfcCAmi tvAM DarmasaMmUQacetAH . yacCreyaH syAnniScitaM brUhi tanme Sizyaste'haM SADi mAM tvAM prapannam .. 2-7 ..
    iast: |-
      kārpaṇyadoṣopahatasvabhāvaḥ pṛcchāmi tvāṃ dharmasaṃmūḍhacetāḥ | yacchreyaḥ syānniścitaṃ brūhi tanme śiṣyaste'haṃ śādhi māṃ tvāṃ prapannam || 2-7 ||
  - verse: 8
    devanagari: |-
      न हि प्रपश्यामि ममापनुद्या- द्यः शोकमुच्छोषणमिन्द्रियाणाम् । अवाप्य भूमावसपत्नमृद्धं राज्यं सुराणामपि चाधिपत्यम् ॥ २-८ ॥
    slp1: |-
      na hi prapaSyAmi mamApanudyA- dyaH SokamucCozaRamindriyARAm . avApya BUmAvasapatnamfdDaM rAjyaM surARAmapi cADipatyam .. 2-8 ..
    iast: |-
      na hi prapaśyāmi mamāpanudyā- dyaḥ śokamucchoṣaṇamindriyāṇām | avāpya bhūmāvasapatnamṛddhaṃ rājyaṃ surāṇāmapi cādhipatyam || 2-8 ||
  - verse: 9
    devanagari: |-
      सञ्जय उवाच
      एवमुक्त्वा हृषीकेशं गुडाकेशः परन्तप । न योत्स्यानिति गोविन्दमुक्त्वा तूष्णीं बभूव ह ॥ २-९ ॥
    slp1: |-
      saYjaya uvAca
      evamuktvA hfzIkeSaM guqAkeSaH parantapa . na yotsyAniti govindamuktvA tUzRIM baBUva ha .. 2-9 ..
    iast: |-
      sañjaya uvāca
      evamuktvā hṛṣīkeśaṃ guḍākeśaḥ parantapa | na yotsyāniti govindamuktvā tūṣṇīṃ babhūva ha || 2-9 ||
  - verse: 10
    devanagari: |-
      तमुवाच हृषीकेशः प्रहसन्निव भारत । सेनयोरुभयोर्मध्ये सीदमानमिदं वचः ॥ २-१० ॥
      सेनयोरुभयोर्मध्ये-इत्यनेनेदं सूचयति-संशयाविष्टोऽर्जुनो नैकपक्षेण युद्धान्निवृत्तो यत एवमाह स्म-शाधि मां त्वां प्रपन्नम् इति ॥ २-१० ॥
    slp1: |-
      tamuvAca hfzIkeSaH prahasanniva BArata . senayoruBayormaDye sIdamAnamidaM vacaH .. 2-10 ..
      senayoruBayormaDye-ityanenedaM sUcayati-saMSayAvizwo'rjuno nEkapakzeRa yudDAnnivftto yata evamAha sma-SADi mAM tvAM prapannam iti .. 2-10 ..
    iast: |-
      tamuvāca hṛṣīkeśaḥ prahasanniva bhārata | senayorubhayormadhye sīdamānamidaṃ vacaḥ || 2-10 ||
      senayorubhayormadhye-ityanenedaṃ sūcayati-saṃśayāviṣṭo'rjuno naikapakṣeṇa yuddhānnivṛtto yata evamāha sma-śādhi māṃ tvāṃ prapannam iti || 2-10 ||
  - verse: 11
    devanagari: |-
      अत उभयोरपि ज्ञानाज्ञानयोर्मध्यगः श्रीभगवतानुशिष्यते
      श्रीभगवानुवाच
      त्वं मानुष्येणोपहतान्तरात्मा विषादमोहाभिभवाद्विसंज्ञः । कृपागृहीतः समवेक्ष्य बन्धू- भिप्रपन्नान्मुखमन्तकस्य ॥ २-११ ॥
      मानुष्यं-मनुष्यभावः । अन्तकमुखं स्वयमेते प्रविष्टा इति तव को बाधः ॥ ११ ॥
    slp1: |-
      ata uBayorapi jYAnAjYAnayormaDyagaH SrIBagavatAnuSizyate
      SrIBagavAnuvAca
      tvaM mAnuzyeRopahatAntarAtmA vizAdamohABiBavAdvisaMjYaH . kfpAgfhItaH samavekzya banDU- BiprapannAnmuKamantakasya .. 2-11 ..
      mAnuzyaM-manuzyaBAvaH . antakamuKaM svayamete pravizwA iti tava ko bADaH .. 11 ..
    iast: |-
      ata ubhayorapi jñānājñānayormadhyagaḥ śrībhagavatānuśiṣyate
      śrībhagavānuvāca
      tvaṃ mānuṣyeṇopahatāntarātmā viṣādamohābhibhavādvisaṃjñaḥ | kṛpāgṛhītaḥ samavekṣya bandhū- bhiprapannānmukhamantakasya || 2-11 ||
      mānuṣyaṃ-manuṣyabhāvaḥ | antakamukhaṃ svayamete praviṣṭā iti tava ko bādhaḥ || 11 ||
  - verse: 12
    devanagari: |-
      अशोच्यानन्वशोचस्त्वं प्रज्ञवन्नाभिभाषसे । गतासूनगतासूंश्च नानुशोचन्ति पण्डिताः ॥ २-१२ ॥
      शोचितुमशक्यं कलेवरं-सदा नश्वरत्वात् अशोचनार्हमात्मानं च शोचसि । न कश्चित् गतासुः - मृतः अगतासुः - जीवन्वा शोच्योऽस्ति । तथाहि-आत्मा तावदविनाशी नानाशरीरेषु संचरतः कास्य शोच्यता । न च देहन्तरसंचारे एव शोच्यता । एवं हि यौवनादावपि शोच्यता भवेत् ॥ २-१२ ॥
    slp1: |-
      aSocyAnanvaSocastvaM prajYavannABiBAzase . gatAsUnagatAsUMSca nAnuSocanti paRqitAH .. 2-12 ..
      SocitumaSakyaM kalevaraM-sadA naSvaratvAt aSocanArhamAtmAnaM ca Socasi . na kaScit gatAsuH - mftaH agatAsuH - jIvanvA Socyo'sti . taTAhi-AtmA tAvadavinASI nAnASarIrezu saMcarataH kAsya SocyatA . na ca dehantarasaMcAre eva SocyatA . evaM hi yOvanAdAvapi SocyatA Bavet .. 2-12 ..
    iast: |-
      aśocyānanvaśocastvaṃ prajñavannābhibhāṣase | gatāsūnagatāsūṃśca nānuśocanti paṇḍitāḥ || 2-12 ||
      śocitumaśakyaṃ kalevaraṃ-sadā naśvaratvāt aśocanārhamātmānaṃ ca śocasi | na kaścit gatāsuḥ - mṛtaḥ agatāsuḥ - jīvanvā śocyo'sti | tathāhi-ātmā tāvadavināśī nānāśarīreṣu saṃcarataḥ kāsya śocyatā | na ca dehantarasaṃcāre eva śocyatā | evaṃ hi yauvanādāvapi śocyatā bhavet || 2-12 ||
  - verse: 13
    devanagari: |-
      एवमर्थद्वयमाह
      नह्येवाहं जातु नासं न त्वं नेमे जनाधिपाः । न चैव न भविष्यामः सर्वे वयमितः परम् ॥ २-१३ ॥
    slp1: |-
      evamarTadvayamAha
      nahyevAhaM jAtu nAsaM na tvaM neme janADipAH . na cEva na BavizyAmaH sarve vayamitaH param .. 2-13 ..
    iast: |-
      evamarthadvayamāha
      nahyevāhaṃ jātu nāsaṃ na tvaṃ neme janādhipāḥ | na caiva na bhaviṣyāmaḥ sarve vayamitaḥ param || 2-13 ||
  - verse: 14
    devanagari: |-
      देहिनोऽस्मिन्यथा देहे कौमारं यौवनं जरा । तथा देहान्तरप्राप्तिर्धीरस्तत्र न मुह्यति ॥ २-१४ ॥
      अहं हि नैव नासम् अपि तु आसम् । एवं त्वम् अमी च राजानः ॥ १३ ॥ आकारान्तरे च सति यदि शोच्यता तर्हि कौमारात् यौवनावाप्तौ किमिति न शोच्यते । यो धीरः स न शोचति । धैर्यं च एतच्छरीरेऽपि यस्यास्था नास्ति तेन सुकरम् । अतस्त्वं धैर्यमन्विच्छ ॥ २-१४ ॥
    slp1: |-
      dehino'sminyaTA dehe kOmAraM yOvanaM jarA . taTA dehAntaraprAptirDIrastatra na muhyati .. 2-14 ..
      ahaM hi nEva nAsam api tu Asam . evaM tvam amI ca rAjAnaH .. 13 .. AkArAntare ca sati yadi SocyatA tarhi kOmArAt yOvanAvAptO kimiti na Socyate . yo DIraH sa na Socati . DEryaM ca etacCarIre'pi yasyAsTA nAsti tena sukaram . atastvaM DEryamanvicCa .. 2-14 ..
    iast: |-
      dehino'sminyathā dehe kaumāraṃ yauvanaṃ jarā | tathā dehāntaraprāptirdhīrastatra na muhyati || 2-14 ||
      ahaṃ hi naiva nāsam api tu āsam | evaṃ tvam amī ca rājānaḥ || 13 || ākārāntare ca sati yadi śocyatā tarhi kaumārāt yauvanāvāptau kimiti na śocyate | yo dhīraḥ sa na śocati | dhairyaṃ ca etaccharīre'pi yasyāsthā nāsti tena sukaram | atastvaṃ dhairyamanviccha || 2-14 ||
  - verse: 15
    devanagari: |-
      अधीरास्तु मात्राशब्दवाच्यैरर्थैर्ये कृताः स्पर्शा इन्द्रियद्वारेणात्मना संबन्धाः तत्कृता याः शीतोष्णसुखदुःखाद्यावस्था अनित्याः तास्वपि शोचन्ति । न त्वेवं धीरा इत्याह
      मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः । आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत ! ॥ २-१५ ॥
      अथवा-मात्राभिः-इन्द्रियैर्येषां स्पर्श्ॐ न तु साक्षात्परमात्मना । आगमः-उत्पत्तिः । अपायो-विनाशः । एतद्युक्रांस्तितिक्षस्व-सहस्व ॥ १५ ॥
    slp1: |-
      aDIrAstu mAtrASabdavAcyErarTErye kftAH sparSA indriyadvAreRAtmanA saMbanDAH tatkftA yAH SItozRasuKaduHKAdyAvasTA anityAH tAsvapi Socanti . na tvevaM DIrA ityAha
      mAtrAsparSAstu kOnteya SItozRasuKaduHKadAH . AgamApAyino'nityAstAMstitikzasva BArata ! .. 2-15 ..
      aTavA-mAtrABiH-indriyEryezAM sparSAUM na tu sAkzAtparamAtmanA . AgamaH-utpattiH . apAyo-vinASaH . etadyukrAMstitikzasva-sahasva .. 15 ..
    iast: |-
      adhīrāstu mātrāśabdavācyairarthairye kṛtāḥ sparśā indriyadvāreṇātmanā saṃbandhāḥ tatkṛtā yāḥ śītoṣṇasukhaduḥkhādyāvasthā anityāḥ tāsvapi śocanti | na tvevaṃ dhīrā ityāha
      mātrāsparśāstu kaunteya śītoṣṇasukhaduḥkhadāḥ | āgamāpāyino'nityāstāṃstitikṣasva bhārata ! || 2-15 ||
      athavā-mātrābhiḥ-indriyairyeṣāṃ sparśoṃ na tu sākṣātparamātmanā | āgamaḥ-utpattiḥ | apāyo-vināśaḥ | etadyukrāṃstitikṣasva-sahasva || 15 ||
  - verse: 16
    devanagari: |-
      यं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ ! । समदुःखसुखं धीरं सोऽमृतत्वाय कल्पते ॥ २-१६ ॥
    slp1: |-
      yaM hi na vyaTayantyete puruzaM puruzarzaBa ! . samaduHKasuKaM DIraM so'mftatvAya kalpate .. 2-16 ..
    iast: |-
      yaṃ hi na vyathayantyete puruṣaṃ puruṣarṣabha ! | samaduḥkhasukhaṃ dhīraṃ so'mṛtatvāya kalpate || 2-16 ||
  - verse: 17
    devanagari: |-
      ननु यत एवागमापायिन एते सर्वे दशाविशेषास्तत एव शोच्यन्ते ? मैवम् । तथाहि कोऽयमागमो नाम ? उत्पत्तिरिति चेत् । सापि का ? असत आत्मलाभः सा इति त्वसत् । असत्स्वभावता हि निःस्वभावता निरात्मता । निरात्मा च निःस्वभावः कथं स स्वभावीकर्तुं शक्यः अनीलं हि न नीलीकर्तुं शक्यम्-स्वभावान्तरापत्तेर्दुष्टत्वात् । तथा च शास्त्रम्
      नहि स्वभावो भावानां व्यावर्तेतौष्ण्यवद्रवेः ।
      इति । अथ सत एवात्मलाभ उत्पत्तिः तदा लब्धात्मनोऽस्य जात्वपि अनभावात् नित्यतैवेत्यागमे का शोच्यता । एवमपायोऽपि सतोऽसतो वा । असत्तावदसदेव । सत्स्वभावस्यापि कथमसत्तास्वभावः । द्वितीये क्षणेऽसावसत्स्वभावः-इति चेत् आद्येऽपि तथा स्यादिति न कश्चिद्भावः स्यात् स्वभावस्यात्यागात् । अथ मुद्गरादिनास्य नाशः क्रियते । स यदि व्यतिरिक्तः भावस्य किं वृत्तम् ? न दृश्यते-इति चेत् मा नाम दर्शि भावः । न त्वन्यथाभूतः पटावृत इव । अव्यतिरिक्तस्तु नासावित्युक्तम् । तदेतत्संक्षिप्याह
      नासतो विद्यते भावो नाभावो विद्यते सतः । उभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः ॥ २-१७ ॥
      अनयोः सदसतोरन्तः-प्रतिष्ठापदं यत्रानयोर्विश्रान्तिः ॥ १७ ॥
    slp1: |-
      nanu yata evAgamApAyina ete sarve daSAviSezAstata eva Socyante ? mEvam . taTAhi ko'yamAgamo nAma ? utpattiriti cet . sApi kA ? asata AtmalABaH sA iti tvasat . asatsvaBAvatA hi niHsvaBAvatA nirAtmatA . nirAtmA ca niHsvaBAvaH kaTaM sa svaBAvIkartuM SakyaH anIlaM hi na nIlIkartuM Sakyam-svaBAvAntarApatterduzwatvAt . taTA ca SAstram
      nahi svaBAvo BAvAnAM vyAvartetOzRyavadraveH .
      iti . aTa sata evAtmalABa utpattiH tadA labDAtmano'sya jAtvapi anaBAvAt nityatEvetyAgame kA SocyatA . evamapAyo'pi sato'sato vA . asattAvadasadeva . satsvaBAvasyApi kaTamasattAsvaBAvaH . dvitIye kzaRe'sAvasatsvaBAvaH-iti cet Adye'pi taTA syAditi na kaScidBAvaH syAt svaBAvasyAtyAgAt . aTa mudgarAdinAsya nASaH kriyate . sa yadi vyatiriktaH BAvasya kiM vfttam ? na dfSyate-iti cet mA nAma darSi BAvaH . na tvanyaTABUtaH pawAvfta iva . avyatiriktastu nAsAvityuktam . tadetatsaMkzipyAha
      nAsato vidyate BAvo nABAvo vidyate sataH . uBayorapi dfzwo'ntastvanayostattvadarSiBiH .. 2-17 ..
      anayoH sadasatorantaH-pratizWApadaM yatrAnayorviSrAntiH .. 17 ..
    iast: |-
      nanu yata evāgamāpāyina ete sarve daśāviśeṣāstata eva śocyante ? maivam | tathāhi ko'yamāgamo nāma ? utpattiriti cet | sāpi kā ? asata ātmalābhaḥ sā iti tvasat | asatsvabhāvatā hi niḥsvabhāvatā nirātmatā | nirātmā ca niḥsvabhāvaḥ kathaṃ sa svabhāvīkartuṃ śakyaḥ anīlaṃ hi na nīlīkartuṃ śakyam-svabhāvāntarāpatterduṣṭatvāt | tathā ca śāstram
      nahi svabhāvo bhāvānāṃ vyāvartetauṣṇyavadraveḥ |
      iti | atha sata evātmalābha utpattiḥ tadā labdhātmano'sya jātvapi anabhāvāt nityataivetyāgame kā śocyatā | evamapāyo'pi sato'sato vā | asattāvadasadeva | satsvabhāvasyāpi kathamasattāsvabhāvaḥ | dvitīye kṣaṇe'sāvasatsvabhāvaḥ-iti cet ādye'pi tathā syāditi na kaścidbhāvaḥ syāt svabhāvasyātyāgāt | atha mudgarādināsya nāśaḥ kriyate | sa yadi vyatiriktaḥ bhāvasya kiṃ vṛttam ? na dṛśyate-iti cet mā nāma darśi bhāvaḥ | na tvanyathābhūtaḥ paṭāvṛta iva | avyatiriktastu nāsāvityuktam | tadetatsaṃkṣipyāha
      nāsato vidyate bhāvo nābhāvo vidyate sataḥ | ubhayorapi dṛṣṭo'ntastvanayostattvadarśibhiḥ || 2-17 ||
      anayoḥ sadasatorantaḥ-pratiṣṭhāpadaṃ yatrānayorviśrāntiḥ || 17 ||
  - verse: 18
    devanagari: |-
      यस्तत्त्वदर्शिभिदृष्टः स खलु नित्योऽनित्यो वा-इत्याशङ्क्याह
      अविनाशि तु तद्विद्धि येन सर्वमिदं ततम् । विनाशमव्ययस्यास्य न कश्चित्कर्तुमर्हति ॥ २-१८ ॥
      तुश्चार्थे । आत्मा च अविनाशी ॥ १८ ॥ तुश्चार्थे । आत्मा च अविनाशी ॥ १८ ॥
    slp1: |-
      yastattvadarSiBidfzwaH sa Kalu nityo'nityo vA-ityASaNkyAha
      avinASi tu tadvidDi yena sarvamidaM tatam . vinASamavyayasyAsya na kaScitkartumarhati .. 2-18 ..
      tuScArTe . AtmA ca avinASI .. 18 .. tuScArTe . AtmA ca avinASI .. 18 ..
    iast: |-
      yastattvadarśibhidṛṣṭaḥ sa khalu nityo'nityo vā-ityāśaṅkyāha
      avināśi tu tadviddhi yena sarvamidaṃ tatam | vināśamavyayasyāsya na kaścitkartumarhati || 2-18 ||
      tuścārthe | ātmā ca avināśī || 18 || tuścārthe | ātmā ca avināśī || 18 ||
  - verse: 19
    devanagari: |-
      अन्तवन्त इमे देहा नित्यस्योक्ताः शरीरिणः । विनाशिनोऽप्रमेयस्य तस्माद्युद्ध्यस्व भारत ! ॥ २-१९ ॥
      इति । पृथगर्थानामिति-पृथगर्थक्रियाकारित्वादिति यावत् । देहा अन्तवन्तो विनाशिनश्च । आत्मा तु नित्यः यतोऽप्रमेयः । प्रमेयस्य तु जडस्य परिणामित्वं न त्वजडस्य चिदेकरूपस्य स्वभावान्तरायोगात् । एवं देहा नित्यमन्तवन्तः इति शोचितुमशक्याः । आत्मा नित्यमविनाशी तेन न शोचनार्हः । तन्त्रेणायमकेः कृत्यप्रत्ययो द्वयोरर्थयोर्मुनिना दर्शित अशोच्यान् इति ॥ १९ ॥
    slp1: |-
      antavanta ime dehA nityasyoktAH SarIriRaH . vinASino'prameyasya tasmAdyudDyasva BArata ! .. 2-19 ..
      iti . pfTagarTAnAmiti-pfTagarTakriyAkAritvAditi yAvat . dehA antavanto vinASinaSca . AtmA tu nityaH yato'prameyaH . prameyasya tu jaqasya pariRAmitvaM na tvajaqasya cidekarUpasya svaBAvAntarAyogAt . evaM dehA nityamantavantaH iti SocitumaSakyAH . AtmA nityamavinASI tena na SocanArhaH . tantreRAyamakeH kftyapratyayo dvayorarTayormuninA darSita aSocyAn iti .. 19 ..
    iast: |-
      antavanta ime dehā nityasyoktāḥ śarīriṇaḥ | vināśino'prameyasya tasmādyuddhyasva bhārata ! || 2-19 ||
      iti | pṛthagarthānāmiti-pṛthagarthakriyākāritvāditi yāvat | dehā antavanto vināśinaśca | ātmā tu nityaḥ yato'prameyaḥ | prameyasya tu jaḍasya pariṇāmitvaṃ na tvajaḍasya cidekarūpasya svabhāvāntarāyogāt | evaṃ dehā nityamantavantaḥ iti śocitumaśakyāḥ | ātmā nityamavināśī tena na śocanārhaḥ | tantreṇāyamakeḥ kṛtyapratyayo dvayorarthayormuninā darśita aśocyān iti || 19 ||
  - verse: 20
    devanagari: |-
      य एनं वेत्ति हन्तारं यश्चैनं मन्यते हतम् । उभौ तौ न विजानीतो नायं हन्ति न हन्यते ॥ २-२० ॥
      य एनमात्मानं देहं च हन्तारं हतं च वेत्ति तस्य अज्ञानम् अत एव स बद्धः ॥ २० ॥
    slp1: |-
      ya enaM vetti hantAraM yaScEnaM manyate hatam . uBO tO na vijAnIto nAyaM hanti na hanyate .. 2-20 ..
      ya enamAtmAnaM dehaM ca hantAraM hataM ca vetti tasya ajYAnam ata eva sa badDaH .. 20 ..
    iast: |-
      ya enaṃ vetti hantāraṃ yaścainaṃ manyate hatam | ubhau tau na vijānīto nāyaṃ hanti na hanyate || 2-20 ||
      ya enamātmānaṃ dehaṃ ca hantāraṃ hataṃ ca vetti tasya ajñānam ata eva sa baddhaḥ || 20 ||
  - verse: 21
    devanagari: |-
      न जायते म्रियते वा कदाचि- न्नायं भूत्वा भविता वा न भूयः । अजो नित्यः शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे ॥ २-२१ ॥
      एतदेव स्फुटयति-नायं भूत्वा-इति । अयमात्मा न न भूत्वा भविता अपितु भूत्वैव । अतो न जायते । न च म्रियते-यतो भूत्वा न न भविता अपितु भवितैव ॥ २१ ॥
    slp1: |-
      na jAyate mriyate vA kadAci- nnAyaM BUtvA BavitA vA na BUyaH . ajo nityaH SASvato'yaM purARo na hanyate hanyamAne SarIre .. 2-21 ..
      etadeva sPuwayati-nAyaM BUtvA-iti . ayamAtmA na na BUtvA BavitA apitu BUtvEva . ato na jAyate . na ca mriyate-yato BUtvA na na BavitA apitu BavitEva .. 21 ..
    iast: |-
      na jāyate mriyate vā kadāci- nnāyaṃ bhūtvā bhavitā vā na bhūyaḥ | ajo nityaḥ śāśvato'yaṃ purāṇo na hanyate hanyamāne śarīre || 2-21 ||
      etadeva sphuṭayati-nāyaṃ bhūtvā-iti | ayamātmā na na bhūtvā bhavitā apitu bhūtvaiva | ato na jāyate | na ca mriyate-yato bhūtvā na na bhavitā apitu bhavitaiva || 21 ||
  - verse: 22
    devanagari: |-
      वेदाविनाशिनं नित्यं य एनमजमव्ययम् । कथं स पुरुषः पार्थ हन्यते हन्ति वा कथम् ॥ २-२२ ॥
      य एनमात्मानं प्रबुद्धत्वाज्जानाति न स हन्ति न स हन्यते इति तस्य कथं बन्धः ॥ २२ ॥
    slp1: |-
      vedAvinASinaM nityaM ya enamajamavyayam . kaTaM sa puruzaH pArTa hanyate hanti vA kaTam .. 2-22 ..
      ya enamAtmAnaM prabudDatvAjjAnAti na sa hanti na sa hanyate iti tasya kaTaM banDaH .. 22 ..
    iast: |-
      vedāvināśinaṃ nityaṃ ya enamajamavyayam | kathaṃ sa puruṣaḥ pārtha hanyate hanti vā katham || 2-22 ||
      ya enamātmānaṃ prabuddhatvājjānāti na sa hanti na sa hanyate iti tasya kathaṃ bandhaḥ || 22 ||
  - verse: 23
    devanagari: |-
      वासांसि जीर्णानि यथा विहाय नवानि गृह्णाति नरोऽपराणि । तथा शरीराणि विहाय जीर्णा- न्यन्यानि संयाति नवानि देही ॥ २-२३ ॥
      यथा वस्त्राच्छादितस्तद्वस्त्रनाशे समुचितवस्त्रान्तरावृतो न विनश्यति एवमात्मा देहान्तरावृतः ॥ २३ ॥
    slp1: |-
      vAsAMsi jIrRAni yaTA vihAya navAni gfhRAti naro'parARi . taTA SarIrARi vihAya jIrRA- nyanyAni saMyAti navAni dehI .. 2-23 ..
      yaTA vastrAcCAditastadvastranASe samucitavastrAntarAvfto na vinaSyati evamAtmA dehAntarAvftaH .. 23 ..
    iast: |-
      vāsāṃsi jīrṇāni yathā vihāya navāni gṛhṇāti naro'parāṇi | tathā śarīrāṇi vihāya jīrṇā- nyanyāni saṃyāti navāni dehī || 2-23 ||
      yathā vastrācchāditastadvastranāśe samucitavastrāntarāvṛto na vinaśyati evamātmā dehāntarāvṛtaḥ || 23 ||
  - verse: 24
    devanagari: |-
      नैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः । न चैनं क्लेदयन्त्यापो न शोषयति मारुतः ॥ २-२४ ॥
    slp1: |-
      nEnaM Cindanti SastrARi nEnaM dahati pAvakaH . na cEnaM kledayantyApo na Sozayati mArutaH .. 2-24 ..
    iast: |-
      nainaṃ chindanti śastrāṇi nainaṃ dahati pāvakaḥ | na cainaṃ kledayantyāpo na śoṣayati mārutaḥ || 2-24 ||
  - verse: 25
    devanagari: |-
      अच्छेद्योऽयमदाह्योऽयमक्लेद्योऽशोष्य एव च । नित्यः सर्वगतः स्थाणुरचलोऽयं सनातनः ॥ २-२५ ॥
    slp1: |-
      acCedyo'yamadAhyo'yamakledyo'Sozya eva ca . nityaH sarvagataH sTARuracalo'yaM sanAtanaH .. 2-25 ..
    iast: |-
      acchedyo'yamadāhyo'yamakledyo'śoṣya eva ca | nityaḥ sarvagataḥ sthāṇuracalo'yaṃ sanātanaḥ || 2-25 ||
  - verse: 26
    devanagari: |-
      अव्यक्तोऽयमचिन्त्योऽयमविकार्योऽयमुच्यते । तस्मादेवं विदित्वैनं नानुशोचितुमर्हसि ॥ २-२६ ॥
      नास्य नाशकारणं शस्त्रादि किंचित्करम् चिदेकस्वभावस्यानाश्रितस्य निरपेक्षस्य निरंशस्य स्वतंत्रस्य स्वभावान्तरापत्त्याश्रयविनाशावयवविभागविरोधिप्रादुर्भाव अदि-क्रमेण नाशयितुमशक्यत्वात् । न च देहान्तरगमनमस्यापूर्वम् । देहान्वितोऽपि सततं देहान्तरं गच्छति तेन संवध्यत इत्यर्थः देहस्य क्षणमात्रमप्यनवस्थायित्वात् । एवंभूतं विदित्वैनमात्मानं शोचितुं नार्हसि ॥ २६ ॥
    slp1: |-
      avyakto'yamacintyo'yamavikAryo'yamucyate . tasmAdevaM viditvEnaM nAnuSocitumarhasi .. 2-26 ..
      nAsya nASakAraRaM SastrAdi kiMcitkaram cidekasvaBAvasyAnASritasya nirapekzasya niraMSasya svataMtrasya svaBAvAntarApattyASrayavinASAvayavaviBAgaviroDiprAdurBAva adi-krameRa nASayitumaSakyatvAt . na ca dehAntaragamanamasyApUrvam . dehAnvito'pi satataM dehAntaraM gacCati tena saMvaDyata ityarTaH dehasya kzaRamAtramapyanavasTAyitvAt . evaMBUtaM viditvEnamAtmAnaM SocituM nArhasi .. 26 ..
    iast: |-
      avyakto'yamacintyo'yamavikāryo'yamucyate | tasmādevaṃ viditvainaṃ nānuśocitumarhasi || 2-26 ||
      nāsya nāśakāraṇaṃ śastrādi kiṃcitkaram cidekasvabhāvasyānāśritasya nirapekṣasya niraṃśasya svataṃtrasya svabhāvāntarāpattyāśrayavināśāvayavavibhāgavirodhiprādurbhāva adi-krameṇa nāśayitumaśakyatvāt | na ca dehāntaragamanamasyāpūrvam | dehānvito'pi satataṃ dehāntaraṃ gacchati tena saṃvadhyata ityarthaḥ dehasya kṣaṇamātramapyanavasthāyitvāt | evaṃbhūtaṃ viditvainamātmānaṃ śocituṃ nārhasi || 26 ||
  - verse: 27
    devanagari: |-
      अथवैनं नित्यजातं नित्यं वा मन्यसे मृतम् । तथापि त्वं महाबाहो नैनं शोचितुमर्हसि ॥ २-२७ ॥
      अथाप्येनं देहं मन्यसे नित्यजातं प्रवाहस्याविनाशात् तथापि न शोच्यता । क्षणिकप्रक्रियया वा नित्यविनाशिनम् तथापि का शोच्यता । एवं यदि आत्मनस्तद्देहसंयोगवियोगाभ्यां नित्यजातत्वं नित्यमृतत्वं वा मन्यसे तथापि सर्वथा शोचनं प्रामाणिकानामयुक्तम् ॥ २७ ॥
    slp1: |-
      aTavEnaM nityajAtaM nityaM vA manyase mftam . taTApi tvaM mahAbAho nEnaM Socitumarhasi .. 2-27 ..
      aTApyenaM dehaM manyase nityajAtaM pravAhasyAvinASAt taTApi na SocyatA . kzaRikaprakriyayA vA nityavinASinam taTApi kA SocyatA . evaM yadi AtmanastaddehasaMyogaviyogAByAM nityajAtatvaM nityamftatvaM vA manyase taTApi sarvaTA SocanaM prAmARikAnAmayuktam .. 27 ..
    iast: |-
      athavainaṃ nityajātaṃ nityaṃ vā manyase mṛtam | tathāpi tvaṃ mahābāho nainaṃ śocitumarhasi || 2-27 ||
      athāpyenaṃ dehaṃ manyase nityajātaṃ pravāhasyāvināśāt tathāpi na śocyatā | kṣaṇikaprakriyayā vā nityavināśinam tathāpi kā śocyatā | evaṃ yadi ātmanastaddehasaṃyogaviyogābhyāṃ nityajātatvaṃ nityamṛtatvaṃ vā manyase tathāpi sarvathā śocanaṃ prāmāṇikānāmayuktam || 27 ||
  - verse: 28
    devanagari: |-
      न चैतदन्यथा नित्यत्वानित्यत्वमुपपत्तिमत्-यतः
      जातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च । तस्मादपरिहार्येऽर्थे न त्वं शोचितुमर्हसि ॥ २-२८ ॥
      जन्मन एवानन्तरं नाशो नाशादनन्तरं जन्म इति चक्रवदयं जन्ममरणसन्तान इति किं परिमाणं शोच्यतामिति ॥ २८ ॥
    slp1: |-
      na cEtadanyaTA nityatvAnityatvamupapattimat-yataH
      jAtasya hi Druvo mftyurDruvaM janma mftasya ca . tasmAdaparihArye'rTe na tvaM Socitumarhasi .. 2-28 ..
      janmana evAnantaraM nASo nASAdanantaraM janma iti cakravadayaM janmamaraRasantAna iti kiM parimARaM SocyatAmiti .. 28 ..
    iast: |-
      na caitadanyathā nityatvānityatvamupapattimat-yataḥ
      jātasya hi dhruvo mṛtyurdhruvaṃ janma mṛtasya ca | tasmādaparihārye'rthe na tvaṃ śocitumarhasi || 2-28 ||
      janmana evānantaraṃ nāśo nāśādanantaraṃ janma iti cakravadayaṃ janmamaraṇasantāna iti kiṃ parimāṇaṃ śocyatāmiti || 28 ||
  - verse: 29
    devanagari: |-
      अपिच
      अव्यक्तादीनि भूतानि व्यक्तमध्यानि भारत ! अव्यक्तनिधनान्येव तत्र का परिदेवना ॥ २-२९ ॥
      नित्याः सन्तु अनित्या वा यस्तावदस्य शोचकस्तं प्रत्येव आदावव्यक्तः अन्ते चाव्यक्तः मध्येतस्य व्यक्तता विकार इति प्रत्युत विकारे शोचनीयं न स्वभावे । किंच यत्तन्मूलकारणं किंचिदभिमतं तदेव यथाक्रमं विचित्रस्वभावतया स्वात्ममध्ये दर्शिततत्तदनन्तसृष्टिस्थितिसंहृतिवैचित्र्यं नित्यमेव । तथास्वभावेऽपि कास्य शोच्यता ॥ २९ ॥
    slp1: |-
      apica
      avyaktAdIni BUtAni vyaktamaDyAni BArata ! avyaktaniDanAnyeva tatra kA paridevanA .. 2-29 ..
      nityAH santu anityA vA yastAvadasya SocakastaM pratyeva AdAvavyaktaH ante cAvyaktaH maDyetasya vyaktatA vikAra iti pratyuta vikAre SocanIyaM na svaBAve . kiMca yattanmUlakAraRaM kiMcidaBimataM tadeva yaTAkramaM vicitrasvaBAvatayA svAtmamaDye darSitatattadanantasfzwisTitisaMhftivEcitryaM nityameva . taTAsvaBAve'pi kAsya SocyatA .. 29 ..
    iast: |-
      apica
      avyaktādīni bhūtāni vyaktamadhyāni bhārata ! avyaktanidhanānyeva tatra kā paridevanā || 2-29 ||
      nityāḥ santu anityā vā yastāvadasya śocakastaṃ pratyeva ādāvavyaktaḥ ante cāvyaktaḥ madhyetasya vyaktatā vikāra iti pratyuta vikāre śocanīyaṃ na svabhāve | kiṃca yattanmūlakāraṇaṃ kiṃcidabhimataṃ tadeva yathākramaṃ vicitrasvabhāvatayā svātmamadhye darśitatattadanantasṛṣṭisthitisaṃhṛtivaicitryaṃ nityameva | tathāsvabhāve'pi kāsya śocyatā || 29 ||
  - verse: 30
    devanagari: |-
      एवंविधं च
      आश्चर्यवत् पश्यति कश्चिदेन- माश्चर्यवद्वदति तथैनमन्यः । आश्चर्यवच्चैनमन्यः शृणोति श्रुत्वाप्येनं वेद न चैव कश्चित् ॥ २-३० ॥
      ननु यद्येवमयमात्मा अविनाशी किमिति सर्वेण तथैव नोपलभ्यते ? यतोऽद्भुतवत्कश्चिदेव पश्यति । श्रुत्वापि न कश्चिदेनं जानाति-वेत्ति ॥ ३० ॥
    slp1: |-
      evaMviDaM ca
      AScaryavat paSyati kaScidena- mAScaryavadvadati taTEnamanyaH . AScaryavaccEnamanyaH SfRoti SrutvApyenaM veda na cEva kaScit .. 2-30 ..
      nanu yadyevamayamAtmA avinASI kimiti sarveRa taTEva nopalaByate ? yato'dButavatkaScideva paSyati . SrutvApi na kaScidenaM jAnAti-vetti .. 30 ..
    iast: |-
      evaṃvidhaṃ ca
      āścaryavat paśyati kaścidena- māścaryavadvadati tathainamanyaḥ | āścaryavaccainamanyaḥ śṛṇoti śrutvāpyenaṃ veda na caiva kaścit || 2-30 ||
      nanu yadyevamayamātmā avināśī kimiti sarveṇa tathaiva nopalabhyate ? yato'dbhutavatkaścideva paśyati | śrutvāpi na kaścidenaṃ jānāti-vetti || 30 ||
  - verse: 31
    devanagari: |-
      देही नित्यमवध्योऽयं देहे सर्वस्य भारत । तस्मात्सर्वाणि भूतानि न त्वं शोचितुमर्हसि ॥ २-३१ ॥
      अतो नित्यमात्मनोऽविनाशित्वम् ॥ ३१ ॥
    slp1: |-
      dehI nityamavaDyo'yaM dehe sarvasya BArata . tasmAtsarvARi BUtAni na tvaM Socitumarhasi .. 2-31 ..
      ato nityamAtmano'vinASitvam .. 31 ..
    iast: |-
      dehī nityamavadhyo'yaṃ dehe sarvasya bhārata | tasmātsarvāṇi bhūtāni na tvaṃ śocitumarhasi || 2-31 ||
      ato nityamātmano'vināśitvam || 31 ||
  - verse: 32
    devanagari: |-
      स्वधर्ममपि चावेक्ष्य न विकम्पितुमर्हसि । धर्म्याद्धि युद्धाच्छ्रेयोऽन्यत्क्षत्रियस्य न विद्यते ॥ २-३२ ॥
      स्वधर्मस्य चानपहार्यत्वात् युद्धविषयः कम्पो न युक्तः ॥ ३२ ॥
    slp1: |-
      svaDarmamapi cAvekzya na vikampitumarhasi . DarmyAdDi yudDAcCreyo'nyatkzatriyasya na vidyate .. 2-32 ..
      svaDarmasya cAnapahAryatvAt yudDavizayaH kampo na yuktaH .. 32 ..
    iast: |-
      svadharmamapi cāvekṣya na vikampitumarhasi | dharmyāddhi yuddhācchreyo'nyatkṣatriyasya na vidyate || 2-32 ||
      svadharmasya cānapahāryatvāt yuddhaviṣayaḥ kampo na yuktaḥ || 32 ||
  - verse: 33
    devanagari: |-
      यदृच्छया चोपपन्नं स्वर्गद्वारमपावृतम् । सुकृतात्क्षत्रियाः पार्थ लभन्ते युद्धमीदृशम् ॥ २-३३ ॥
      अन्येऽपि ये काममयाः क्षत्रियास्तैरपि ईदृशं युद्धं स्वर्गहेतुत्वान्न त्याज्यम् किं पुनर्यस्य ईदृशं ज्ञानमुपदिष्टमिति तात्पर्यम् । न पुनः स्वर्गपर्यवसायी श्लोकः ॥ ३३ ॥
    slp1: |-
      yadfcCayA copapannaM svargadvAramapAvftam . sukftAtkzatriyAH pArTa laBante yudDamIdfSam .. 2-33 ..
      anye'pi ye kAmamayAH kzatriyAstErapi IdfSaM yudDaM svargahetutvAnna tyAjyam kiM punaryasya IdfSaM jYAnamupadizwamiti tAtparyam . na punaH svargaparyavasAyI SlokaH .. 33 ..
    iast: |-
      yadṛcchayā copapannaṃ svargadvāramapāvṛtam | sukṛtātkṣatriyāḥ pārtha labhante yuddhamīdṛśam || 2-33 ||
      anye'pi ye kāmamayāḥ kṣatriyāstairapi īdṛśaṃ yuddhaṃ svargahetutvānna tyājyam kiṃ punaryasya īdṛśaṃ jñānamupadiṣṭamiti tātparyam | na punaḥ svargaparyavasāyī ślokaḥ || 33 ||
  - verse: 34
    devanagari: |-
      यद्भयाच्च भवान् युद्धान्निवर्तेत तदेव शतशाखमुपनिपतिष्यति भवत इत्याह
      अथ चेत्त्वमिमं धर्म्यं संग्रामं न करिष्यसि । ततः स्वधर्मं कीर्तिं च हित्वा पापमवाप्स्यसि ॥ २-३४ ॥
    slp1: |-
      yadBayAcca BavAn yudDAnnivarteta tadeva SataSAKamupanipatizyati Bavata ityAha
      aTa cettvamimaM DarmyaM saMgrAmaM na karizyasi . tataH svaDarmaM kIrtiM ca hitvA pApamavApsyasi .. 2-34 ..
    iast: |-
      yadbhayācca bhavān yuddhānnivarteta tadeva śataśākhamupanipatiṣyati bhavata ityāha
      atha cettvamimaṃ dharmyaṃ saṃgrāmaṃ na kariṣyasi | tataḥ svadharmaṃ kīrtiṃ ca hitvā pāpamavāpsyasi || 2-34 ||
  - verse: 35
    devanagari: |-
      अकीर्तिं चापि भूतानि कथयिष्यन्ति तेऽव्ययाम् । सम्भावितस्य चाकीर्तिर्मरणादतिरिच्यते ॥ २-३५ ॥
    slp1: |-
      akIrtiM cApi BUtAni kaTayizyanti te'vyayAm . samBAvitasya cAkIrtirmaraRAdatiricyate .. 2-35 ..
    iast: |-
      akīrtiṃ cāpi bhūtāni kathayiṣyanti te'vyayām | sambhāvitasya cākīrtirmaraṇādatiricyate || 2-35 ||
  - verse: 36
    devanagari: |-
      भयाद्रणादुपरतं मंस्यन्ते त्वां महारथाः । येषां च त्वं बहुमतो भूत्वा यास्यसि लाघवम् ॥ २-३६ ॥
    slp1: |-
      BayAdraRAduparataM maMsyante tvAM mahAraTAH . yezAM ca tvaM bahumato BUtvA yAsyasi lAGavam .. 2-36 ..
    iast: |-
      bhayādraṇāduparataṃ maṃsyante tvāṃ mahārathāḥ | yeṣāṃ ca tvaṃ bahumato bhūtvā yāsyasi lāghavam || 2-36 ||
  - verse: 37
    devanagari: |-
      अवाच्यवादांश्च बहून्वदिष्यन्ति तवाहिताः । निन्दन्तस्तव सामर्थ्यं ततो दुःखतरं नु किम् ॥ २-३७ ॥
    slp1: |-
      avAcyavAdAMSca bahUnvadizyanti tavAhitAH . nindantastava sAmarTyaM tato duHKataraM nu kim .. 2-37 ..
    iast: |-
      avācyavādāṃśca bahūnvadiṣyanti tavāhitāḥ | nindantastava sāmarthyaṃ tato duḥkhataraṃ nu kim || 2-37 ||
  - verse: 38
    devanagari: |-
      हतो वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम् । तस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः ॥ २-३८ ॥
      श्लोकपञ्चकमिदमभ्युपगम्य वादरूपमुच्यते यदि लौकिकेन व्यवहारेणास्ते भवांस्तथाप्यवश्यानुष्ठेयमेतत् ॥ ३८ ॥
    slp1: |-
      hato vA prApsyasi svargaM jitvA vA Bokzyase mahIm . tasmAduttizWa kOnteya yudDAya kftaniScayaH .. 2-38 ..
      SlokapaYcakamidamaByupagamya vAdarUpamucyate yadi lOkikena vyavahAreRAste BavAMstaTApyavaSyAnuzWeyametat .. 38 ..
    iast: |-
      hato vā prāpsyasi svargaṃ jitvā vā bhokṣyase mahīm | tasmāduttiṣṭha kaunteya yuddhāya kṛtaniścayaḥ || 2-38 ||
      ślokapañcakamidamabhyupagamya vādarūpamucyate yadi laukikena vyavahāreṇāste bhavāṃstathāpyavaśyānuṣṭheyametat || 38 ||
  - verse: 39
    devanagari: |-
      सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ । ततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि ॥ २-३९ ॥
      तव तु स्वधर्मतयैव कर्माणि कुर्वतो न कदाचित्पापसम्बन्धः ॥ ३९ ॥
    slp1: |-
      suKaduHKe same kftvA lABAlABO jayAjayO . tato yudDAya yujyasva nEvaM pApamavApsyasi .. 2-39 ..
      tava tu svaDarmatayEva karmARi kurvato na kadAcitpApasambanDaH .. 39 ..
    iast: |-
      sukhaduḥkhe same kṛtvā lābhālābhau jayājayau | tato yuddhāya yujyasva naivaṃ pāpamavāpsyasi || 2-39 ||
      tava tu svadharmatayaiva karmāṇi kurvato na kadācitpāpasambandhaḥ || 39 ||
  - verse: 40
    devanagari: |-
      एषा तेऽभिहिता सांख्ये बुद्धिर्योगे त्विमां शृणु । बुद्ध्या युक्तो यया पार्थ कर्मबन्धं प्रहास्यसि ॥ २-४० ॥
      एषा च तव सांख्ये-सम्यग्ज्ञाने बुद्धिः-निश्चयात्मिका उक्ता । एषैव च यथा योगे-कर्मकौशले योज्यते तथैव शृणु । यया बुद्ध्या कर्मणां बन्धकत्वं त्यक्ष्यसि । नहि कर्माणि स्वयं बध्नन्ति-जडत्वात् अतः स्वयमात्मा कर्मभिर्वासनात्मकैरात्मानं बध्नाति ॥ ४० ॥
    slp1: |-
      ezA te'BihitA sAMKye budDiryoge tvimAM SfRu . budDyA yukto yayA pArTa karmabanDaM prahAsyasi .. 2-40 ..
      ezA ca tava sAMKye-samyagjYAne budDiH-niScayAtmikA uktA . ezEva ca yaTA yoge-karmakOSale yojyate taTEva SfRu . yayA budDyA karmaRAM banDakatvaM tyakzyasi . nahi karmARi svayaM baDnanti-jaqatvAt ataH svayamAtmA karmaBirvAsanAtmakErAtmAnaM baDnAti .. 40 ..
    iast: |-
      eṣā te'bhihitā sāṃkhye buddhiryoge tvimāṃ śṛṇu | buddhyā yukto yayā pārtha karmabandhaṃ prahāsyasi || 2-40 ||
      eṣā ca tava sāṃkhye-samyagjñāne buddhiḥ-niścayātmikā uktā | eṣaiva ca yathā yoge-karmakauśale yojyate tathaiva śṛṇu | yayā buddhyā karmaṇāṃ bandhakatvaṃ tyakṣyasi | nahi karmāṇi svayaṃ badhnanti-jaḍatvāt ataḥ svayamātmā karmabhirvāsanātmakairātmānaṃ badhnāti || 40 ||
  - verse: 41
    devanagari: |-
      नेहातिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते । स्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात् ॥ २-४१ ॥
      अस्यां बुद्धौ अतिक्रमेण-अपराधेन प्रमादेन नाशो न भवति-प्रमादस्याभावात् । यथा च परिमितेन श्रीखण्डकणेन ज्वालायमानोऽपि तैलकटाहः सद्यः शीतीभवति एवमनया स्वल्पयापि योगबुद्ध्या महाभयं संसाररूपं विनश्यति ॥ ४१ ॥
    slp1: |-
      nehAtikramanASo'sti pratyavAyo na vidyate . svalpamapyasya Darmasya trAyate mahato BayAt .. 2-41 ..
      asyAM budDO atikrameRa-aparADena pramAdena nASo na Bavati-pramAdasyABAvAt . yaTA ca parimitena SrIKaRqakaRena jvAlAyamAno'pi tElakawAhaH sadyaH SItIBavati evamanayA svalpayApi yogabudDyA mahABayaM saMsArarUpaM vinaSyati .. 41 ..
    iast: |-
      nehātikramanāśo'sti pratyavāyo na vidyate | svalpamapyasya dharmasya trāyate mahato bhayāt || 2-41 ||
      asyāṃ buddhau atikrameṇa-aparādhena pramādena nāśo na bhavati-pramādasyābhāvāt | yathā ca parimitena śrīkhaṇḍakaṇena jvālāyamāno'pi tailakaṭāhaḥ sadyaḥ śītībhavati evamanayā svalpayāpi yogabuddhyā mahābhayaṃ saṃsārarūpaṃ vinaśyati || 41 ||
  - verse: 42
    devanagari: |-
      न चैषा बुद्धिरपूर्वानीयते किंतर्हि
      व्यवसायात्मिका बुद्धिरेकैव कुरुनन्दन । बहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम् ॥ २-४२ ॥
      व्यवसायात्मिका सर्वस्यैकैव सहजा धीः । निश्चेतव्यवशात्तु बहुत्वं गच्छति ॥ ४२ ॥
    slp1: |-
      na cEzA budDirapUrvAnIyate kiMtarhi
      vyavasAyAtmikA budDirekEva kurunandana . bahuSAKA hyanantASca budDayo'vyavasAyinAm .. 2-42 ..
      vyavasAyAtmikA sarvasyEkEva sahajA DIH . niScetavyavaSAttu bahutvaM gacCati .. 42 ..
    iast: |-
      na caiṣā buddhirapūrvānīyate kiṃtarhi
      vyavasāyātmikā buddhirekaiva kurunandana | bahuśākhā hyanantāśca buddhayo'vyavasāyinām || 2-42 ||
      vyavasāyātmikā sarvasyaikaiva sahajā dhīḥ | niścetavyavaśāttu bahutvaṃ gacchati || 42 ||
  - verse: 43
    devanagari: |-
      तथाच
      यामिमां पुष्पितां वाचं प्रवदन्त्यविपश्चितः । वेदवादरताः पार्थ नान्यदस्तीतिवादिनः ॥ २-४३ ॥
    slp1: |-
      taTAca
      yAmimAM puzpitAM vAcaM pravadantyavipaScitaH . vedavAdaratAH pArTa nAnyadastItivAdinaH .. 2-43 ..
    iast: |-
      tathāca
      yāmimāṃ puṣpitāṃ vācaṃ pravadantyavipaścitaḥ | vedavādaratāḥ pārtha nānyadastītivādinaḥ || 2-43 ||
  - verse: 44
    devanagari: |-
      कामात्मानः स्वर्गपरा जन्मकर्मफलेप्सवः । क्रियाविशेषबहुला भोगैश्वर्यगतीः प्रति ॥ २-४४ ॥
    slp1: |-
      kAmAtmAnaH svargaparA janmakarmaPalepsavaH . kriyAviSezabahulA BogESvaryagatIH prati .. 2-44 ..
    iast: |-
      kāmātmānaḥ svargaparā janmakarmaphalepsavaḥ | kriyāviśeṣabahulā bhogaiśvaryagatīḥ prati || 2-44 ||
  - verse: 45
    devanagari: |-
      भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम् । व्यवसायात्मिका बुद्धिः समाधौ न विधीयते ॥ २-४५ ॥
      ये कामाभिलाषिणस्ते स्वयमेतां वाचं वेदात्मिकां पुष्पितां-भविष्यत्स्वर्गफलेन व्याप्तां वदन्ति । अत एव जन्मनः कर्मैव फलमिच्छन्ति तेऽवपिश्चितः । ते च तयैव-स्वयंकल्पितया वेदवाचा अपहृतचित्ता व्यवसायबुद्धियुक्ता अपि न समाधियोग्याः-तत्र फलनिश्चयत्वादिति श्लोकत्रयस्य तात्पर्यम् ॥ २-४५ ॥
    slp1: |-
      BogESvaryaprasaktAnAM tayApahftacetasAm . vyavasAyAtmikA budDiH samADO na viDIyate .. 2-45 ..
      ye kAmABilAziRaste svayametAM vAcaM vedAtmikAM puzpitAM-BavizyatsvargaPalena vyAptAM vadanti . ata eva janmanaH karmEva PalamicCanti te'vapiScitaH . te ca tayEva-svayaMkalpitayA vedavAcA apahftacittA vyavasAyabudDiyuktA api na samADiyogyAH-tatra PalaniScayatvAditi Slokatrayasya tAtparyam .. 2-45 ..
    iast: |-
      bhogaiśvaryaprasaktānāṃ tayāpahṛtacetasām | vyavasāyātmikā buddhiḥ samādhau na vidhīyate || 2-45 ||
      ye kāmābhilāṣiṇaste svayametāṃ vācaṃ vedātmikāṃ puṣpitāṃ-bhaviṣyatsvargaphalena vyāptāṃ vadanti | ata eva janmanaḥ karmaiva phalamicchanti te'vapiścitaḥ | te ca tayaiva-svayaṃkalpitayā vedavācā apahṛtacittā vyavasāyabuddhiyuktā api na samādhiyogyāḥ-tatra phalaniścayatvāditi ślokatrayasya tātparyam || 2-45 ||
  - verse: 46
    devanagari: |-
      अत एव च
      त्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन । निर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान् ॥ २-४६ ॥
      वेदास्त्रैगुण्येन करणेन विशेषेण सिन्वन्ति-बध्नन्ति न तु बन्धकाः । यस्मात् सुखदुःखमोहबुद्ध्या कर्माणि वैदिकानि क्रियमाणानि बन्धकानि अतस्त्रैगुण्यं-कामरूपं त्याज्यम् । यदि तु वेददूषणपरमेतदभविष्यत् प्रकृतं युद्धकरणं व्यघटिष्यत-वेदादन्यस्य स्वधर्मनिश्चायकत्वाभावात् । येषां तु फलाभिलाषो विगलितस्तेषां न वेदा बन्धकाः ॥ ४६ ॥
    slp1: |-
      ata eva ca
      trEguRyavizayA vedA nistrEguRyo BavArjuna . nirdvandvo nityasattvasTo niryogakzema AtmavAn .. 2-46 ..
      vedAstrEguRyena karaRena viSezeRa sinvanti-baDnanti na tu banDakAH . yasmAt suKaduHKamohabudDyA karmARi vEdikAni kriyamARAni banDakAni atastrEguRyaM-kAmarUpaM tyAjyam . yadi tu vedadUzaRaparametadaBavizyat prakftaM yudDakaraRaM vyaGawizyata-vedAdanyasya svaDarmaniScAyakatvABAvAt . yezAM tu PalABilAzo vigalitastezAM na vedA banDakAH .. 46 ..
    iast: |-
      ata eva ca
      traiguṇyaviṣayā vedā nistraiguṇyo bhavārjuna | nirdvandvo nityasattvastho niryogakṣema ātmavān || 2-46 ||
      vedāstraiguṇyena karaṇena viśeṣeṇa sinvanti-badhnanti na tu bandhakāḥ | yasmāt sukhaduḥkhamohabuddhyā karmāṇi vaidikāni kriyamāṇāni bandhakāni atastraiguṇyaṃ-kāmarūpaṃ tyājyam | yadi tu vedadūṣaṇaparametadabhaviṣyat prakṛtaṃ yuddhakaraṇaṃ vyaghaṭiṣyata-vedādanyasya svadharmaniścāyakatvābhāvāt | yeṣāṃ tu phalābhilāṣo vigalitasteṣāṃ na vedā bandhakāḥ || 46 ||
  - verse: 47
    devanagari: |-
      यतो वेदाः परं तेषां सम्यग्ज्ञानोपयोगिनः अत आह
      यावानर्थ उदपाने सर्वतः सम्प्लुतोदके । तावान्सर्वेषु वेदेषु ब्राह्मणस्य विजानतः ॥ २-४७ ॥
      यस्य स्वधर्ममात्रे ज्ञाने च प्राधान्यं परिमितादपि वेदभाषितात्कार्यम् ॥ ४७ ॥
    slp1: |-
      yato vedAH paraM tezAM samyagjYAnopayoginaH ata Aha
      yAvAnarTa udapAne sarvataH samplutodake . tAvAnsarvezu vedezu brAhmaRasya vijAnataH .. 2-47 ..
      yasya svaDarmamAtre jYAne ca prADAnyaM parimitAdapi vedaBAzitAtkAryam .. 47 ..
    iast: |-
      yato vedāḥ paraṃ teṣāṃ samyagjñānopayoginaḥ ata āha
      yāvānartha udapāne sarvataḥ samplutodake | tāvānsarveṣu vedeṣu brāhmaṇasya vijānataḥ || 2-47 ||
      yasya svadharmamātre jñāne ca prādhānyaṃ parimitādapi vedabhāṣitātkāryam || 47 ||
  - verse: 48
    devanagari: |-
      अतश्च
      कर्मण्यस्त्वधिकारस्ते मा फलेषु कदाचन । मा कर्मफलहेतुभूर्मा ते सङ्गोऽस्त्वकर्मणि ॥ २-४८ ॥
      कर्ममात्रे त्वं व्यापृतो भव नतु कर्मफलेषु । ननु कर्मणि कृते नान्तरीयकतयैव फलमापतति इति ? मैवम् । तत्र हि यदि त्वं फलकामना-कालुष्यव्याप्तो भवसि तदा कर्मणां फलं प्रति हेतुत्वम् । यदप्रार्थ्यमानं फलं तत् ज्ञानम् । नानिच्छोस्तदिति कर्माभावेन यः सङ्गः स एव गाढग्रहरूपो मिथ्या-ज्ञानस्वरूपः इति त्याज्य एव ॥ २-४८ ॥
    slp1: |-
      ataSca
      karmaRyastvaDikAraste mA Palezu kadAcana . mA karmaPalahetuBUrmA te saNgo'stvakarmaRi .. 2-48 ..
      karmamAtre tvaM vyApfto Bava natu karmaPalezu . nanu karmaRi kfte nAntarIyakatayEva PalamApatati iti ? mEvam . tatra hi yadi tvaM PalakAmanA-kAluzyavyApto Bavasi tadA karmaRAM PalaM prati hetutvam . yadaprArTyamAnaM PalaM tat jYAnam . nAnicCostaditi karmABAvena yaH saNgaH sa eva gAQagraharUpo miTyA-jYAnasvarUpaH iti tyAjya eva .. 2-48 ..
    iast: |-
      ataśca
      karmaṇyastvadhikāraste mā phaleṣu kadācana | mā karmaphalahetubhūrmā te saṅgo'stvakarmaṇi || 2-48 ||
      karmamātre tvaṃ vyāpṛto bhava natu karmaphaleṣu | nanu karmaṇi kṛte nāntarīyakatayaiva phalamāpatati iti ? maivam | tatra hi yadi tvaṃ phalakāmanā-kāluṣyavyāpto bhavasi tadā karmaṇāṃ phalaṃ prati hetutvam | yadaprārthyamānaṃ phalaṃ tat jñānam | nānicchostaditi karmābhāvena yaḥ saṅgaḥ sa eva gāḍhagraharūpo mithyā-jñānasvarūpaḥ iti tyājya eva || 2-48 ||
  - verse: 49
    devanagari: |-
      किंतर्हि
      योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय । सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते ॥ २-४९ ॥
      योगे स्थित्वा कर्माणि कुरु । साम्यं च योगः ॥ ४९ ॥
    slp1: |-
      kiMtarhi
      yogasTaH kuru karmARi saNgaM tyaktvA DanaYjaya . sidDyasidDyoH samo BUtvA samatvaM yoga ucyate .. 2-49 ..
      yoge sTitvA karmARi kuru . sAmyaM ca yogaH .. 49 ..
    iast: |-
      kiṃtarhi
      yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya | siddhyasiddhyoḥ samo bhūtvā samatvaṃ yoga ucyate || 2-49 ||
      yoge sthitvā karmāṇi kuru | sāmyaṃ ca yogaḥ || 49 ||
  - verse: 50
    devanagari: |-
      यस्य सर्वे समारम्भ निराशीर्बन्धनास्त्विह । त्यागे यस्य हुतं सर्वं स त्यागी स च बुद्धिमान् ॥ २-५० ॥
      यस्य सर्वे व्यापारा आशीरूपेण बन्धनेन न युक्ताः । अभिलाषो हि बन्धकः ॥ ५० ॥
    slp1: |-
      yasya sarve samAramBa nirASIrbanDanAstviha . tyAge yasya hutaM sarvaM sa tyAgI sa ca budDimAn .. 2-50 ..
      yasya sarve vyApArA ASIrUpeRa banDanena na yuktAH . aBilAzo hi banDakaH .. 50 ..
    iast: |-
      yasya sarve samārambha nirāśīrbandhanāstviha | tyāge yasya hutaṃ sarvaṃ sa tyāgī sa ca buddhimān || 2-50 ||
      yasya sarve vyāpārā āśīrūpeṇa bandhanena na yuktāḥ | abhilāṣo hi bandhakaḥ || 50 ||
  - verse: 51
    devanagari: |-
      दूरेण ह्यवरं कर्म बुद्धियोगाद्धनञ्जय । बुद्धौ शरणमन्विच्छ कृपणाः फलहेतवः ॥ २-५१ ॥
      बुद्धियोगात्किल हेतोरवरं-दुष्टफलं रिक्तं कर्म दूरीभवति । अतस्तादृश्यां बुद्धौ शरणमन्विच्छ-प्रार्थयस्व येन सा बुद्धिर्लभ्यते ॥ ५१ ॥
    slp1: |-
      dUreRa hyavaraM karma budDiyogAdDanaYjaya . budDO SaraRamanvicCa kfpaRAH PalahetavaH .. 2-51 ..
      budDiyogAtkila hetoravaraM-duzwaPalaM riktaM karma dUrIBavati . atastAdfSyAM budDO SaraRamanvicCa-prArTayasva yena sA budDirlaByate .. 51 ..
    iast: |-
      dūreṇa hyavaraṃ karma buddhiyogāddhanañjaya | buddhau śaraṇamanviccha kṛpaṇāḥ phalahetavaḥ || 2-51 ||
      buddhiyogātkila hetoravaraṃ-duṣṭaphalaṃ riktaṃ karma dūrībhavati | atastādṛśyāṃ buddhau śaraṇamanviccha-prārthayasva yena sā buddhirlabhyate || 51 ||
  - verse: 52
    devanagari: |-
      बुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते । तस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम् ॥ २-५२ ॥
      उभे इति परस्परव्यभिचारं दर्शयति । तस्मात्-यथाहि सुकृत्तदुष्कृते नश्यतस्तथाकरणमेव परमं कौशलमिति भावः ॥ ५२ ॥
    slp1: |-
      budDiyukto jahAtIha uBe sukftaduzkfte . tasmAdyogAya yujyasva yogaH karmasu kOSalam .. 2-52 ..
      uBe iti parasparavyaBicAraM darSayati . tasmAt-yaTAhi sukfttaduzkfte naSyatastaTAkaraRameva paramaM kOSalamiti BAvaH .. 52 ..
    iast: |-
      buddhiyukto jahātīha ubhe sukṛtaduṣkṛte | tasmādyogāya yujyasva yogaḥ karmasu kauśalam || 2-52 ||
      ubhe iti parasparavyabhicāraṃ darśayati | tasmāt-yathāhi sukṛttaduṣkṛte naśyatastathākaraṇameva paramaṃ kauśalamiti bhāvaḥ || 52 ||
  - verse: 53
    devanagari: |-
      कर्मजं बुद्धियुक्ता हि फलं त्यक्त्वा मनीषिणः । जन्मबन्धविनिर्मुक्ताः पदं गच्छन्त्यनामयम् ॥ २-५३ ॥
      योगबुद्धियुक्ताः कर्मणां फलं त्यक्त्वा जन्मबन्धं त्यजन्तिब्रह्मसत्तामवाप्नुवन्ति ॥ ५३ ॥
    slp1: |-
      karmajaM budDiyuktA hi PalaM tyaktvA manIziRaH . janmabanDavinirmuktAH padaM gacCantyanAmayam .. 2-53 ..
      yogabudDiyuktAH karmaRAM PalaM tyaktvA janmabanDaM tyajantibrahmasattAmavApnuvanti .. 53 ..
    iast: |-
      karmajaṃ buddhiyuktā hi phalaṃ tyaktvā manīṣiṇaḥ | janmabandhavinirmuktāḥ padaṃ gacchantyanāmayam || 2-53 ||
      yogabuddhiyuktāḥ karmaṇāṃ phalaṃ tyaktvā janmabandhaṃ tyajantibrahmasattāmavāpnuvanti || 53 ||
  - verse: 54
    devanagari: |-
      यदा ते मोहकलिलं बुद्धिर्व्यतितरिष्यति । तदा गन्तासि निर्वेदं श्रोतव्यस्य श्रुतस्य च ॥ २-५४ ॥
    slp1: |-
      yadA te mohakalilaM budDirvyatitarizyati . tadA gantAsi nirvedaM Srotavyasya Srutasya ca .. 2-54 ..
    iast: |-
      yadā te mohakalilaṃ buddhirvyatitariṣyati | tadā gantāsi nirvedaṃ śrotavyasya śrutasya ca || 2-54 ||
  - verse: 55
    devanagari: |-
      श्रुतिविप्रतिपन्ना ते यदा स्थास्यति निश्चला । समाधावचला बुद्धिस्तदा योगमवाप्स्यसि ॥ २-५५ ॥
      तत्र च योगबुद्धिप्राप्त्यवसरे व स्फुटमेवेदमभिज्ञानम् श्रोतव्यस्य श्रुतस्याभिलष्यमाणस्य च आगमस्य उभयस्यापि निर्वेदभाक्त्वम् । अनेन चेदमुक्तम्-अविद्यापदनिपतितप्रमात्रनुग्राहकशास्त्रश्रवणसंस्क् आर-विप्रलम्भमहिमा अयं - यत्तवास्थाने कुलक्षयादिदोषदर्शनम् तत्तु तथा शासनबहुमानविगलने विगलिष्यतीति ॥ ५५ ॥
    slp1: |-
      SrutivipratipannA te yadA sTAsyati niScalA . samADAvacalA budDistadA yogamavApsyasi .. 2-55 ..
      tatra ca yogabudDiprAptyavasare va sPuwamevedamaBijYAnam Srotavyasya SrutasyABilazyamARasya ca Agamasya uBayasyApi nirvedaBAktvam . anena cedamuktam-avidyApadanipatitapramAtranugrAhakaSAstraSravaRasaMsk Ara-vipralamBamahimA ayaM - yattavAsTAne kulakzayAdidozadarSanam tattu taTA SAsanabahumAnavigalane vigalizyatIti .. 55 ..
    iast: |-
      śrutivipratipannā te yadā sthāsyati niścalā | samādhāvacalā buddhistadā yogamavāpsyasi || 2-55 ||
      tatra ca yogabuddhiprāptyavasare va sphuṭamevedamabhijñānam śrotavyasya śrutasyābhilaṣyamāṇasya ca āgamasya ubhayasyāpi nirvedabhāktvam | anena cedamuktam-avidyāpadanipatitapramātranugrāhakaśāstraśravaṇasaṃsk āra-vipralambhamahimā ayaṃ - yattavāsthāne kulakṣayādidoṣadarśanam tattu tathā śāsanabahumānavigalane vigaliṣyatīti || 55 ||
  - verse: 56
    devanagari: |-
      अर्जुन उवाच
      स्थितप्रज्ञस्य का भाषा समाधिस्थस्य केशव । स्थिरधीः किं प्रभाषेत किमासीत व्रजेच्च किम् ॥ २-५६ ॥
      यदा स्थास्यति बुद्धिः-इत्यनेन वचसा समाधिस्थस्य योगिनो यः स्थितप्रज्ञशब्दस्तत्र वाचक उक्तस्तस्य का भाषा-किं प्रवृत्तिनिमित्तं भाष्यते येन निमित्तेन शब्दैरर्थ इति कृत्वा योगिनः स्थितप्रज्ञशब्दः किं रूढ्या वाचकोऽन्वर्थतया वा इति एकः प्रश्नः । यद्यपि रूढौ शङ्कैव नास्ति तथाप्यन्वर्थतां लब्धामपि स्वरूपलक्षणनिमित्तनिरूपणेन स्फुटीकर्तुमेष प्रश्नः । स्थिरधीरिति शब्दपदार्थकोऽर्थपदार्थकश्च तत्र स्थिरधीशब्दः किं प्रयोगलक्षणमेवार्थमाह आहो तपस्विनमपि इति द्वितीयः प्रश्नः । स च स्थिरधीर्योगी किमासीत्-किमभ्यस्येत्-क्वास्य स्थैर्यं स्यात् इति तृतीयः । अभ्यस्यंश्च किमाप्नुयात् इति चतुर्थः ॥ ५६ ॥
    slp1: |-
      arjuna uvAca
      sTitaprajYasya kA BAzA samADisTasya keSava . sTiraDIH kiM praBAzeta kimAsIta vrajecca kim .. 2-56 ..
      yadA sTAsyati budDiH-ityanena vacasA samADisTasya yogino yaH sTitaprajYaSabdastatra vAcaka uktastasya kA BAzA-kiM pravfttinimittaM BAzyate yena nimittena SabdErarTa iti kftvA yoginaH sTitaprajYaSabdaH kiM rUQyA vAcako'nvarTatayA vA iti ekaH praSnaH . yadyapi rUQO SaNkEva nAsti taTApyanvarTatAM labDAmapi svarUpalakzaRanimittanirUpaRena sPuwIkartumeza praSnaH . sTiraDIriti SabdapadArTako'rTapadArTakaSca tatra sTiraDISabdaH kiM prayogalakzaRamevArTamAha Aho tapasvinamapi iti dvitIyaH praSnaH . sa ca sTiraDIryogI kimAsIt-kimaByasyet-kvAsya sTEryaM syAt iti tftIyaH . aByasyaMSca kimApnuyAt iti caturTaH .. 56 ..
    iast: |-
      arjuna uvāca
      sthitaprajñasya kā bhāṣā samādhisthasya keśava | sthiradhīḥ kiṃ prabhāṣeta kimāsīta vrajecca kim || 2-56 ||
      yadā sthāsyati buddhiḥ-ityanena vacasā samādhisthasya yogino yaḥ sthitaprajñaśabdastatra vācaka uktastasya kā bhāṣā-kiṃ pravṛttinimittaṃ bhāṣyate yena nimittena śabdairartha iti kṛtvā yoginaḥ sthitaprajñaśabdaḥ kiṃ rūḍhyā vācako'nvarthatayā vā iti ekaḥ praśnaḥ | yadyapi rūḍhau śaṅkaiva nāsti tathāpyanvarthatāṃ labdhāmapi svarūpalakṣaṇanimittanirūpaṇena sphuṭīkartumeṣa praśnaḥ | sthiradhīriti śabdapadārthako'rthapadārthakaśca tatra sthiradhīśabdaḥ kiṃ prayogalakṣaṇamevārthamāha āho tapasvinamapi iti dvitīyaḥ praśnaḥ | sa ca sthiradhīryogī kimāsīt-kimabhyasyet-kvāsya sthairyaṃ syāt iti tṛtīyaḥ | abhyasyaṃśca kimāpnuyāt iti caturthaḥ || 56 ||
  - verse: 57
    devanagari: |-
      एतदेव प्रश्नचतुष्टयं क्रमेण निर्णीयते श्रीभगवता
      श्री भगवानुवाच
      प्रजहाति यदा कामान्सर्वान्पार्थ मनोगतान् । आत्मन्येवात्मना तुष्टः स्थितप्रज्ञस्तदोच्यते ॥ २-५७ ॥ स्थिता रूढा प्रज्ञा यस्य । रूढिश्च नित्यमात्मरूढित्वे सति विषयविक्षेपकृतस्य कामरूपस्य भ्रमस्य निवृत्तत्वात् योगिनो यः स्थितप्रज्ञ-शब्दोऽन्वर्थः स चेत्थंयुक्त इत्येकः प्रश्नो निर्णीतः ॥ ५७ ॥
    slp1: |-
      etadeva praSnacatuzwayaM krameRa nirRIyate SrIBagavatA
      SrI BagavAnuvAca
      prajahAti yadA kAmAnsarvAnpArTa manogatAn . AtmanyevAtmanA tuzwaH sTitaprajYastadocyate .. 2-57 .. sTitA rUQA prajYA yasya . rUQiSca nityamAtmarUQitve sati vizayavikzepakftasya kAmarUpasya Bramasya nivfttatvAt yogino yaH sTitaprajYa-Sabdo'nvarTaH sa cetTaMyukta ityekaH praSno nirRItaH .. 57 ..
    iast: |-
      etadeva praśnacatuṣṭayaṃ krameṇa nirṇīyate śrībhagavatā
      śrī bhagavānuvāca
      prajahāti yadā kāmānsarvānpārtha manogatān | ātmanyevātmanā tuṣṭaḥ sthitaprajñastadocyate || 2-57 || sthitā rūḍhā prajñā yasya | rūḍhiśca nityamātmarūḍhitve sati viṣayavikṣepakṛtasya kāmarūpasya bhramasya nivṛttatvāt yogino yaḥ sthitaprajña-śabdo'nvarthaḥ sa cetthaṃyukta ityekaḥ praśno nirṇītaḥ || 57 ||
  - verse: 58
    devanagari: |-
      दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः । वीतरागभयक्रोधः स्थिरधीर्मुनिरुच्यते ॥ २-५८ ॥
      सुखदुःखयोर्यस्य रागद्वेषरहिता वृत्तिः स मुनिरेव स्थिरप्रज्ञो नान्यः ॥ ५८ ॥
    slp1: |-
      duHKezvanudvignamanAH suKezu vigataspfhaH . vItarAgaBayakroDaH sTiraDIrmunirucyate .. 2-58 ..
      suKaduHKayoryasya rAgadvezarahitA vfttiH sa munireva sTiraprajYo nAnyaH .. 58 ..
    iast: |-
      duḥkheṣvanudvignamanāḥ sukheṣu vigataspṛhaḥ | vītarāgabhayakrodhaḥ sthiradhīrmunirucyate || 2-58 ||
      sukhaduḥkhayoryasya rāgadveṣarahitā vṛttiḥ sa munireva sthiraprajño nānyaḥ || 58 ||
  - verse: 59
    devanagari: |-
      युक्तं चैतत् यतः
      यः सर्वत्रानभिस्नेहस्तत्तत्प्राप्य शुभाशुभम् । नाभिनन्दति न द्वेष्टि तस्य प्रज्ञा प्रतिष्ठिता ॥ २-५९ ॥
      शुभाशुभप्राप्तौ तस्याह्लादतापौ न भवतः ॥ ५९ ॥
    slp1: |-
      yuktaM cEtat yataH
      yaH sarvatrAnaBisnehastattatprApya SuBASuBam . nABinandati na dvezwi tasya prajYA pratizWitA .. 2-59 ..
      SuBASuBaprAptO tasyAhlAdatApO na BavataH .. 59 ..
    iast: |-
      yuktaṃ caitat yataḥ
      yaḥ sarvatrānabhisnehastattatprāpya śubhāśubham | nābhinandati na dveṣṭi tasya prajñā pratiṣṭhitā || 2-59 ||
      śubhāśubhaprāptau tasyāhlādatāpau na bhavataḥ || 59 ||
  - verse: 60
    devanagari: |-
      यदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः । इन्द्रियाणीन्द्रियार्थेभ्यः स्थिरप्रज्ञस्तदोच्यते ॥ २-६० ॥
      न चास्य पाचकवद्योगरूढित्वम् यदा यदा किलायमिन्द्रियाणि संहरते-आत्मन्येव कूर्म इवाङ्गानि क्रोडीकरोति विषयिभ्यो विषयान्निवार्य तदा तदा स्थिरप्रज्ञः । यद्वा-इन्द्रियार्थेभ्यः प्रभृति इन्द्रियाणि आत्मनि संहरते-विषयेन्द्रियादिकं सर्वमात्मसात्करोति ॥ २-६० ॥
    slp1: |-
      yadA saMharate cAyaM kUrmo'NgAnIva sarvaSaH . indriyARIndriyArTeByaH sTiraprajYastadocyate .. 2-60 ..
      na cAsya pAcakavadyogarUQitvam yadA yadA kilAyamindriyARi saMharate-Atmanyeva kUrma ivANgAni kroqIkaroti vizayiByo vizayAnnivArya tadA tadA sTiraprajYaH . yadvA-indriyArTeByaH praBfti indriyARi Atmani saMharate-vizayendriyAdikaM sarvamAtmasAtkaroti .. 2-60 ..
    iast: |-
      yadā saṃharate cāyaṃ kūrmo'ṅgānīva sarvaśaḥ | indriyāṇīndriyārthebhyaḥ sthiraprajñastadocyate || 2-60 ||
      na cāsya pācakavadyogarūḍhitvam yadā yadā kilāyamindriyāṇi saṃharate-ātmanyeva kūrma ivāṅgāni kroḍīkaroti viṣayibhyo viṣayānnivārya tadā tadā sthiraprajñaḥ | yadvā-indriyārthebhyaḥ prabhṛti indriyāṇi ātmani saṃharate-viṣayendriyādikaṃ sarvamātmasātkaroti || 2-60 ||
  - verse: 61
    devanagari: |-
      ननु तपस्विनोऽपि कथं स्थिरप्रज्ञशब्दो न प्रवर्तते ? उच्यते-
      विषया विनिवर्तन्ते निराहारस्य देहिनः । रसवर्जं रसोऽप्यस्य परं दृष्ट्वा निवर्तते ॥ २-६१ ॥
      यद्यपि आहार्यैः-रूपादिभिर्विषयैः संबन्धोऽस्य नास्ति तथापि तस्य विषया अन्तःकरणगतमुपरागलक्षणं रसं वर्जयित्वा निवर्तन्ते । अतो नासौ स्थिरप्रज्ञः । योगिनस्तु परमेश्वरदर्शनादुपरागो न भवति अन्यस्य तु तपस्विनो नासौ निवर्तते ॥ ६१ ॥
    slp1: |-
      nanu tapasvino'pi kaTaM sTiraprajYaSabdo na pravartate ? ucyate-
      vizayA vinivartante nirAhArasya dehinaH . rasavarjaM raso'pyasya paraM dfzwvA nivartate .. 2-61 ..
      yadyapi AhAryEH-rUpAdiBirvizayEH saMbanDo'sya nAsti taTApi tasya vizayA antaHkaraRagatamuparAgalakzaRaM rasaM varjayitvA nivartante . ato nAsO sTiraprajYaH . yoginastu parameSvaradarSanAduparAgo na Bavati anyasya tu tapasvino nAsO nivartate .. 61 ..
    iast: |-
      nanu tapasvino'pi kathaṃ sthiraprajñaśabdo na pravartate ? ucyate-
      viṣayā vinivartante nirāhārasya dehinaḥ | rasavarjaṃ raso'pyasya paraṃ dṛṣṭvā nivartate || 2-61 ||
      yadyapi āhāryaiḥ-rūpādibhirviṣayaiḥ saṃbandho'sya nāsti tathāpi tasya viṣayā antaḥkaraṇagatamuparāgalakṣaṇaṃ rasaṃ varjayitvā nivartante | ato nāsau sthiraprajñaḥ | yoginastu parameśvaradarśanāduparāgo na bhavati anyasya tu tapasvino nāsau nivartate || 61 ||
  - verse: 62
    devanagari: |-
      यत्तस्यापि हि कौन्तेय पुरुषस्य विपश्चितः । इन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः ॥ २-६२ ॥
      यत्-यस्मात् तस्यापि-तपस्विनो मन इन्द्रियैर्हियते अथवा यत्तस्य-सयत्नस्यापि । योगिना च मन एव जेतव्यम् इति द्वितीयो निर्णीतः ॥ ६२ ॥
    slp1: |-
      yattasyApi hi kOnteya puruzasya vipaScitaH . indriyARi pramATIni haranti prasaBaM manaH .. 2-62 ..
      yat-yasmAt tasyApi-tapasvino mana indriyErhiyate aTavA yattasya-sayatnasyApi . yoginA ca mana eva jetavyam iti dvitIyo nirRItaH .. 62 ..
    iast: |-
      yattasyāpi hi kaunteya puruṣasya vipaścitaḥ | indriyāṇi pramāthīni haranti prasabhaṃ manaḥ || 2-62 ||
      yat-yasmāt tasyāpi-tapasvino mana indriyairhiyate athavā yattasya-sayatnasyāpi | yoginā ca mana eva jetavyam iti dvitīyo nirṇītaḥ || 62 ||
  - verse: 63
    devanagari: |-
      तानि संयम्य मनसा युक्त आसीत मत्परः । वशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता ॥ २-६३ ॥
      य एवं मनसा इन्द्रियाणि नियमयति नतु अप्रवृत्त्या स एव स्थिरप्रज्ञः । स च मत्पर एवासीत-मामेव चिदात्मानं परमेश्वरं अभ्यस्येत् ॥ ६३ ॥
    slp1: |-
      tAni saMyamya manasA yukta AsIta matparaH . vaSe hi yasyendriyARi tasya prajYA pratizWitA .. 2-63 ..
      ya evaM manasA indriyARi niyamayati natu apravfttyA sa eva sTiraprajYaH . sa ca matpara evAsIta-mAmeva cidAtmAnaM parameSvaraM aByasyet .. 63 ..
    iast: |-
      tāni saṃyamya manasā yukta āsīta matparaḥ | vaśe hi yasyendriyāṇi tasya prajñā pratiṣṭhitā || 2-63 ||
      ya evaṃ manasā indriyāṇi niyamayati natu apravṛttyā sa eva sthiraprajñaḥ | sa ca matpara evāsīta-māmeva cidātmānaṃ parameśvaraṃ abhyasyet || 63 ||
  - verse: 64
    devanagari: |-
      ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते । सङ्गात् सञ्जायते कामः कामात्क्रोधोऽभिजायते ॥ २-६४ ॥
    slp1: |-
      DyAyato vizayAnpuMsaH saNgastezUpajAyate . saNgAt saYjAyate kAmaH kAmAtkroDo'BijAyate .. 2-64 ..
    iast: |-
      dhyāyato viṣayānpuṃsaḥ saṅgasteṣūpajāyate | saṅgāt sañjāyate kāmaḥ kāmātkrodho'bhijāyate || 2-64 ||
  - verse: 65
    devanagari: |-
      क्रोधाद्भवति सम्मोहः सम्मोहात्स्मृतिविभ्रमः । स्मृतिभ्रंशाद्बुद्धिनाशो बुद्धिनाशात् प्रणश्यति ॥ २-६५ ॥
      तपस्विनो विषयत्याग एव विषयग्रहणे पर्यवस्यति । ध्यात्वा हि ते त्यज्यन्ते । ध्यानकाल एव च सङ्गादय उपजायन्ते-इत्यनुपायो विषयत्यागः स्थिरप्रज्ञस्य ॥ ६५ ॥
    slp1: |-
      kroDAdBavati sammohaH sammohAtsmftiviBramaH . smftiBraMSAdbudDinASo budDinASAt praRaSyati .. 2-65 ..
      tapasvino vizayatyAga eva vizayagrahaRe paryavasyati . DyAtvA hi te tyajyante . DyAnakAla eva ca saNgAdaya upajAyante-ityanupAyo vizayatyAgaH sTiraprajYasya .. 65 ..
    iast: |-
      krodhādbhavati sammohaḥ sammohātsmṛtivibhramaḥ | smṛtibhraṃśādbuddhināśo buddhināśāt praṇaśyati || 2-65 ||
      tapasvino viṣayatyāga eva viṣayagrahaṇe paryavasyati | dhyātvā hi te tyajyante | dhyānakāla eva ca saṅgādaya upajāyante-ityanupāyo viṣayatyāgaḥ sthiraprajñasya || 65 ||
  - verse: 66
    devanagari: |-
      रागद्वेषविमुक्तैस्तु विषयानिन्द्रियैश्चरन् । आत्मवश्यैर्विधेयात्मा प्रसादमधिगच्छति ॥ २-६६ ॥
    slp1: |-
      rAgadvezavimuktEstu vizayAnindriyEScaran . AtmavaSyErviDeyAtmA prasAdamaDigacCati .. 2-66 ..
    iast: |-
      rāgadveṣavimuktaistu viṣayānindriyaiścaran | ātmavaśyairvidheyātmā prasādamadhigacchati || 2-66 ||
  - verse: 67
    devanagari: |-
      प्रसादे सर्वदुःखानां हानिरस्योपजायते । प्रसन्नचेतसो ह्याशु बुद्धिः पर्यवतिष्ठते ॥ २-६७ ॥
    slp1: |-
      prasAde sarvaduHKAnAM hAnirasyopajAyate . prasannacetaso hyASu budDiH paryavatizWate .. 2-67 ..
    iast: |-
      prasāde sarvaduḥkhānāṃ hānirasyopajāyate | prasannacetaso hyāśu buddhiḥ paryavatiṣṭhate || 2-67 ||
  - verse: 68
    devanagari: |-
      नास्ति बुद्धिरयुक्तस्य न चायुक्तम्य भावना । न चाभावयतः शान्तिरशान्तस्य कुतः सुखम् ॥ २-६८ ॥
    slp1: |-
      nAsti budDirayuktasya na cAyuktamya BAvanA . na cABAvayataH SAntiraSAntasya kutaH suKam .. 2-68 ..
    iast: |-
      nāsti buddhirayuktasya na cāyuktamya bhāvanā | na cābhāvayataḥ śāntiraśāntasya kutaḥ sukham || 2-68 ||
  - verse: 69
    devanagari: |-
      इन्द्रियाणां हि चरतां यन्मनोऽनुविधीयते । तदस्य हरति प्रज्ञां वायुर्नावमिवाम्भसि ॥ २-६९ ॥
    slp1: |-
      indriyARAM hi caratAM yanmano'nuviDIyate . tadasya harati prajYAM vAyurnAvamivAmBasi .. 2-69 ..
    iast: |-
      indriyāṇāṃ hi caratāṃ yanmano'nuvidhīyate | tadasya harati prajñāṃ vāyurnāvamivāmbhasi || 2-69 ||
  - verse: 70
    devanagari: |-
      तस्माद्यस्य महाबाहो निगृहीतानि सर्वशः । इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता ॥ २-७० ॥
      यस्तु मनसो नियामकः स विषयान्सेवमानोऽपि न क्रोधादिकल्लोलैरभिभूयते इति स एव स्थिरप्रज्ञो योगी-इति तात्पर्यम् ॥ ७० ॥
    slp1: |-
      tasmAdyasya mahAbAho nigfhItAni sarvaSaH . indriyARIndriyArTeByastasya prajYA pratizWitA .. 2-70 ..
      yastu manaso niyAmakaH sa vizayAnsevamAno'pi na kroDAdikallolEraBiBUyate iti sa eva sTiraprajYo yogI-iti tAtparyam .. 70 ..
    iast: |-
      tasmādyasya mahābāho nigṛhītāni sarvaśaḥ | indriyāṇīndriyārthebhyastasya prajñā pratiṣṭhitā || 2-70 ||
      yastu manaso niyāmakaḥ sa viṣayānsevamāno'pi na krodhādikallolairabhibhūyate iti sa eva sthiraprajño yogī-iti tātparyam || 70 ||
  - verse: 71
    devanagari: |-
      योगी च सर्वव्यवहारान् कुर्वाणोऽपि लोकोत्तरः-इति निरूपयता परमेश्वरेण संक्षिप्यास्य स्वरूपं कथ्यते
      या निशा सर्वभूतानां तस्यां जागर्ति संयमी । यस्यां जाग्रति भूतानि सा रात्रिः पश्यतो मुनेः ॥ २-७१ ॥
      या सर्वेषां भूतानां निशा-मोहनी माया तस्यां मुनिर्जागर्ति-कथमियं हेयेति । यस्यां च दशायां लोको जागर्ति-नानाविधां चेष्टां कुरुते सा मुनेः रात्रिः यतोऽसौ व्यवहारं प्रत्यबुद्धः । एतदुक्तं भवति-येयं माया खलु तस्या मोहकत्वं नामरूपं सुखतन्त्रताभासनं च । तत्र-लोकः प्राच्यं स्वरूपमस्या अपरामृश्यैव द्वितीयस्मिन्रूपे निबद्धस्मृतिरास्ते । योगी तु तद्विपरीतस्तदीयं मोहकत्वं तदुन्मूलनाय पश्यति सुखतन्त्रतां तु नाद्रियते । पश्यन् सम्यग्ज्ञानी मिथ्याज्ञानोपघाताच्च सुखतन्त्रतानादरः । पश्यत एव सा रात्रिरिति चित्रम् । विद्यायां चावधत्ते योगी यत्र सर्वो विमूढः । अविद्यायां त्वबुद्धः यत्र जनः प्रबुद्धः-इत्यपि चित्रम् ॥ ७१ ॥
    slp1: |-
      yogI ca sarvavyavahArAn kurvARo'pi lokottaraH-iti nirUpayatA parameSvareRa saMkzipyAsya svarUpaM kaTyate
      yA niSA sarvaBUtAnAM tasyAM jAgarti saMyamI . yasyAM jAgrati BUtAni sA rAtriH paSyato muneH .. 2-71 ..
      yA sarvezAM BUtAnAM niSA-mohanI mAyA tasyAM munirjAgarti-kaTamiyaM heyeti . yasyAM ca daSAyAM loko jAgarti-nAnAviDAM cezwAM kurute sA muneH rAtriH yato'sO vyavahAraM pratyabudDaH . etaduktaM Bavati-yeyaM mAyA Kalu tasyA mohakatvaM nAmarUpaM suKatantratABAsanaM ca . tatra-lokaH prAcyaM svarUpamasyA aparAmfSyEva dvitIyasminrUpe nibadDasmftirAste . yogI tu tadviparItastadIyaM mohakatvaM tadunmUlanAya paSyati suKatantratAM tu nAdriyate . paSyan samyagjYAnI miTyAjYAnopaGAtAcca suKatantratAnAdaraH . paSyata eva sA rAtririti citram . vidyAyAM cAvaDatte yogI yatra sarvo vimUQaH . avidyAyAM tvabudDaH yatra janaH prabudDaH-ityapi citram .. 71 ..
    iast: |-
      yogī ca sarvavyavahārān kurvāṇo'pi lokottaraḥ-iti nirūpayatā parameśvareṇa saṃkṣipyāsya svarūpaṃ kathyate
      yā niśā sarvabhūtānāṃ tasyāṃ jāgarti saṃyamī | yasyāṃ jāgrati bhūtāni sā rātriḥ paśyato muneḥ || 2-71 ||
      yā sarveṣāṃ bhūtānāṃ niśā-mohanī māyā tasyāṃ munirjāgarti-kathamiyaṃ heyeti | yasyāṃ ca daśāyāṃ loko jāgarti-nānāvidhāṃ ceṣṭāṃ kurute sā muneḥ rātriḥ yato'sau vyavahāraṃ pratyabuddhaḥ | etaduktaṃ bhavati-yeyaṃ māyā khalu tasyā mohakatvaṃ nāmarūpaṃ sukhatantratābhāsanaṃ ca | tatra-lokaḥ prācyaṃ svarūpamasyā aparāmṛśyaiva dvitīyasminrūpe nibaddhasmṛtirāste | yogī tu tadviparītastadīyaṃ mohakatvaṃ tadunmūlanāya paśyati sukhatantratāṃ tu nādriyate | paśyan samyagjñānī mithyājñānopaghātācca sukhatantratānādaraḥ | paśyata eva sā rātririti citram | vidyāyāṃ cāvadhatte yogī yatra sarvo vimūḍhaḥ | avidyāyāṃ tvabuddhaḥ yatra janaḥ prabuddhaḥ-ityapi citram || 71 ||
  - verse: 72
    devanagari: |-
      अत एव
      आपूर्यमाणमचलप्रतिष्ठं समुद्रमापः प्रविशन्ति यद्वत् । तद्वत्कामा यं प्रविशन्ति सर्वे स शान्तिमाप्नोति न कामकामी ॥ २-७२ ॥
      योगी न कामार्थं बहिर्धावति अपि त्विन्द्रियधर्मतया । तं विषया अनुप्रविशन्तो न तरङ्गयन्ति नदीवेगा इवोदधिम् । एवं तृतीयो निर्णीतः ॥ ७२ ॥
    slp1: |-
      ata eva
      ApUryamARamacalapratizWaM samudramApaH praviSanti yadvat . tadvatkAmA yaM praviSanti sarve sa SAntimApnoti na kAmakAmI .. 2-72 ..
      yogI na kAmArTaM bahirDAvati api tvindriyaDarmatayA . taM vizayA anupraviSanto na taraNgayanti nadIvegA ivodaDim . evaM tftIyo nirRItaH .. 72 ..
    iast: |-
      ata eva
      āpūryamāṇamacalapratiṣṭhaṃ samudramāpaḥ praviśanti yadvat | tadvatkāmā yaṃ praviśanti sarve sa śāntimāpnoti na kāmakāmī || 2-72 ||
      yogī na kāmārthaṃ bahirdhāvati api tvindriyadharmatayā | taṃ viṣayā anupraviśanto na taraṅgayanti nadīvegā ivodadhim | evaṃ tṛtīyo nirṇītaḥ || 72 ||
  - verse: 73
    devanagari: |-
      विहाय कामान्यः सर्वान्पुमांश्चरति निस्पृहः । निर्ममो निरहङ्कारः स शान्तिमधिगच्छति ॥ २-७३ ॥
      स योगी सर्वकामसंन्यासित्वात् शान्तिरूपं मोक्षमेति ॥ ७३ ॥
    slp1: |-
      vihAya kAmAnyaH sarvAnpumAMScarati nispfhaH . nirmamo nirahaNkAraH sa SAntimaDigacCati .. 2-73 ..
      sa yogI sarvakAmasaMnyAsitvAt SAntirUpaM mokzameti .. 73 ..
    iast: |-
      vihāya kāmānyaḥ sarvānpumāṃścarati nispṛhaḥ | nirmamo nirahaṅkāraḥ sa śāntimadhigacchati || 2-73 ||
      sa yogī sarvakāmasaṃnyāsitvāt śāntirūpaṃ mokṣameti || 73 ||
  - verse: 74
    devanagari: |-
      एषा ब्राह्मी स्थितिः पार्थ नैनां प्राप्य विमुह्यति । स्थित्वास्यामन्तकालेऽपि ब्रह्मनिर्वाणमृच्छति ॥ २-७४ ॥
      एषासौ ब्रह्मसत्ता यस्यां क्षणमात्रं स्थित्वा-अवस्थितिं प्राप्य शरीरभेदात् परमं ब्रह्माप्नोति इति प्रश्नचतुष्टयं निर्णीतमिति शिवम् ॥ ७४ ॥
    slp1: |-
      ezA brAhmI sTitiH pArTa nEnAM prApya vimuhyati . sTitvAsyAmantakAle'pi brahmanirvARamfcCati .. 2-74 ..
      ezAsO brahmasattA yasyAM kzaRamAtraM sTitvA-avasTitiM prApya SarIraBedAt paramaM brahmApnoti iti praSnacatuzwayaM nirRItamiti Sivam .. 74 ..
    iast: |-
      eṣā brāhmī sthitiḥ pārtha naināṃ prāpya vimuhyati | sthitvāsyāmantakāle'pi brahmanirvāṇamṛcchati || 2-74 ||
      eṣāsau brahmasattā yasyāṃ kṣaṇamātraṃ sthitvā-avasthitiṃ prāpya śarīrabhedāt paramaṃ brahmāpnoti iti praśnacatuṣṭayaṃ nirṇītamiti śivam || 74 ||
  - verse: 1000
    devanagari: |-
      अहो नु चेतसश्चित्रा गतिस्त्यागेन यत्किल । आरोहत्येव विषयाञ्छ्रयंस्तांस्तु परित्यजेत् ॥ २ ॥
    slp1: |-
      aho nu cetasaScitrA gatistyAgena yatkila . Arohatyeva vizayAYCrayaMstAMstu parityajet .. 2 ..
    iast: |-
      aho nu cetasaścitrā gatistyāgena yatkila | ārohatyeva viṣayāñchrayaṃstāṃstu parityajet || 2 ||
- chapter: 3
  title_sa: तृतीयोऽध्यायः
  title_iast: "tṛtīyo'dhyāyaḥ"
  title_en: "Third Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      ज्यायसी चेत्कर्मणस्ते मता बुद्धिर्जनार्दन । तत्किं कर्मणि घोरे मां नियोजयसि केशव ! ॥ ३-१ ॥
    slp1: |-
      jyAyasI cetkarmaRaste matA budDirjanArdana . tatkiM karmaRi Gore mAM niyojayasi keSava ! .. 3-1 ..
    iast: |-
      jyāyasī cetkarmaṇaste matā buddhirjanārdana | tatkiṃ karmaṇi ghore māṃ niyojayasi keśava ! || 3-1 ||
  - verse: 2
    devanagari: |-
      व्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे । तदेकं वद निश्चित्य येन श्रेयोऽहमाप्नुयाम् ॥ ३-२ ॥
      कर्म उक्तं ज्ञानं च । तत्र न द्वयोः प्राधान्यं युक्तम् अपितु ज्ञानस्य । तद्बलेन क्षपणीयत्वं यदि कर्मणां बुद्धियुक्तो जहातीमे इत्यादिनयेन मूलत एव तत् कर्मणा किं प्रयोजनमिति प्रश्नाभिप्रायः ॥ २ ॥
    slp1: |-
      vyAmiSreReva vAkyena budDiM mohayasIva me . tadekaM vada niScitya yena Sreyo'hamApnuyAm .. 3-2 ..
      karma uktaM jYAnaM ca . tatra na dvayoH prADAnyaM yuktam apitu jYAnasya . tadbalena kzapaRIyatvaM yadi karmaRAM budDiyukto jahAtIme ityAdinayena mUlata eva tat karmaRA kiM prayojanamiti praSnABiprAyaH .. 2 ..
    iast: |-
      vyāmiśreṇeva vākyena buddhiṃ mohayasīva me | tadekaṃ vada niścitya yena śreyo'hamāpnuyām || 3-2 ||
      karma uktaṃ jñānaṃ ca | tatra na dvayoḥ prādhānyaṃ yuktam apitu jñānasya | tadbalena kṣapaṇīyatvaṃ yadi karmaṇāṃ buddhiyukto jahātīme ityādinayena mūlata eva tat karmaṇā kiṃ prayojanamiti praśnābhiprāyaḥ || 2 ||
  - verse: 3
    devanagari: |-
      श्रीभगवांस्तूत्तरं ददाति
      लोकेऽस्मिन्द्विविधा निष्ठा पुरा प्रोक्ता मयानघ । ज्ञानयोगेन साङ्ख्यानां कर्मयोगेन योगिनाम् ॥ ३-३ ॥
      लोके एषा द्वयी गतिः प्रसिद्धा । सांख्यानां ज्ञानं प्रधानं योगिनां च कर्मेति । मया तु सैकैव निष्ठोक्ता ज्ञानक्रियामयत्वात्संवित्तत्त्वस्येति भावः ॥ ३ ॥
    slp1: |-
      SrIBagavAMstUttaraM dadAti
      loke'smindviviDA nizWA purA proktA mayAnaGa . jYAnayogena sANKyAnAM karmayogena yoginAm .. 3-3 ..
      loke ezA dvayI gatiH prasidDA . sAMKyAnAM jYAnaM praDAnaM yoginAM ca karmeti . mayA tu sEkEva nizWoktA jYAnakriyAmayatvAtsaMvittattvasyeti BAvaH .. 3 ..
    iast: |-
      śrībhagavāṃstūttaraṃ dadāti
      loke'smindvividhā niṣṭhā purā proktā mayānagha | jñānayogena sāṅkhyānāṃ karmayogena yoginām || 3-3 ||
      loke eṣā dvayī gatiḥ prasiddhā | sāṃkhyānāṃ jñānaṃ pradhānaṃ yogināṃ ca karmeti | mayā tu saikaiva niṣṭhoktā jñānakriyāmayatvātsaṃvittattvasyeti bhāvaḥ || 3 ||
  - verse: 4
    devanagari: |-
      तथाहि-
      न कर्मणामनारम्भान्नैष्कर्म्यं पुरुषोऽश्नुते । न च संन्यसनादेव सिद्धिं समधिगच्छति ॥ ३-४ ॥
    slp1: |-
      taTAhi-
      na karmaRAmanAramBAnnEzkarmyaM puruzo'Snute . na ca saMnyasanAdeva sidDiM samaDigacCati .. 3-4 ..
    iast: |-
      tathāhi-
      na karmaṇāmanārambhānnaiṣkarmyaṃ puruṣo'śnute | na ca saṃnyasanādeva siddhiṃ samadhigacchati || 3-4 ||
  - verse: 5
    devanagari: |-
      न हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत् । कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः ॥ ३-५ ॥
      इति । तस्माज्ज्ञानान्तर्वर्ति कर्मापरिहार्यम् यतः परवश एव कायवाङ्मनसां परिस्पन्दात्मकत्वात् अवश्यं किंचित्करोति ॥ ५ ॥
    slp1: |-
      na hi kaScitkzaRamapi jAtu tizWatyakarmakft . kAryate hyavaSaH karma sarvaH prakftijErguREH .. 3-5 ..
      iti . tasmAjjYAnAntarvarti karmAparihAryam yataH paravaSa eva kAyavANmanasAM parispandAtmakatvAt avaSyaM kiMcitkaroti .. 5 ..
    iast: |-
      na hi kaścitkṣaṇamapi jātu tiṣṭhatyakarmakṛt | kāryate hyavaśaḥ karma sarvaḥ prakṛtijairguṇaiḥ || 3-5 ||
      iti | tasmājjñānāntarvarti karmāparihāryam yataḥ paravaśa eva kāyavāṅmanasāṃ parispandātmakatvāt avaśyaṃ kiṃcitkaroti || 5 ||
  - verse: 6
    devanagari: |-
      कर्मेन्द्रियाणि संयम्य य आस्ते मनसा स्मरन् । इन्द्रियार्थान्विमूढात्मा मूढाचारः स उच्यते ॥ ३-६ ॥
      कर्मेन्द्रियैश्चैन्न करोति अवश्यं तर्हि मनसा करोति । प्रत्युत मूढाचारः-मानसानां कर्मणामत्यन्तमपरिहार्यत्वात् ॥ ६ ॥
    slp1: |-
      karmendriyARi saMyamya ya Aste manasA smaran . indriyArTAnvimUQAtmA mUQAcAraH sa ucyate .. 3-6 ..
      karmendriyEScEnna karoti avaSyaM tarhi manasA karoti . pratyuta mUQAcAraH-mAnasAnAM karmaRAmatyantamaparihAryatvAt .. 6 ..
    iast: |-
      karmendriyāṇi saṃyamya ya āste manasā smaran | indriyārthānvimūḍhātmā mūḍhācāraḥ sa ucyate || 3-6 ||
      karmendriyaiścainna karoti avaśyaṃ tarhi manasā karoti | pratyuta mūḍhācāraḥ-mānasānāṃ karmaṇāmatyantamaparihāryatvāt || 6 ||
  - verse: 7
    devanagari: |-
      यस्त्विन्द्रियाणि मनसा नियम्यारभतेऽर्जुन । कर्मेन्द्रियैः कर्मयोगमसक्तः स विशिष्यते ॥ ३-७ ॥
      कर्मसु क्रियमाणेषु न ज्ञानहानिः-मनसोऽव्यापारे यन्त्रपुरुषवत्कर्मणः क्रियमाणत्वात् ॥ ७ ॥
    slp1: |-
      yastvindriyARi manasA niyamyAraBate'rjuna . karmendriyEH karmayogamasaktaH sa viSizyate .. 3-7 ..
      karmasu kriyamARezu na jYAnahAniH-manaso'vyApAre yantrapuruzavatkarmaRaH kriyamARatvAt .. 7 ..
    iast: |-
      yastvindriyāṇi manasā niyamyārabhate'rjuna | karmendriyaiḥ karmayogamasaktaḥ sa viśiṣyate || 3-7 ||
      karmasu kriyamāṇeṣu na jñānahāniḥ-manaso'vyāpāre yantrapuruṣavatkarmaṇaḥ kriyamāṇatvāt || 7 ||
  - verse: 8
    devanagari: |-
      अतः
      नियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः । शरीरयात्रापि च ते न प्रसिद्ध्येदकर्मणः ॥ ३-८ ॥
      नियतं-शास्त्रीयं कर्म कुरु शरीरयात्रामात्रस्यापि कर्माधीनत्वात् ॥ ८ ॥
    slp1: |-
      ataH
      niyataM kuru karma tvaM karma jyAyo hyakarmaRaH . SarIrayAtrApi ca te na prasidDyedakarmaRaH .. 3-8 ..
      niyataM-SAstrIyaM karma kuru SarIrayAtrAmAtrasyApi karmADInatvAt .. 8 ..
    iast: |-
      ataḥ
      niyataṃ kuru karma tvaṃ karma jyāyo hyakarmaṇaḥ | śarīrayātrāpi ca te na prasiddhyedakarmaṇaḥ || 3-8 ||
      niyataṃ-śāstrīyaṃ karma kuru śarīrayātrāmātrasyāpi karmādhīnatvāt || 8 ||
  - verse: 9
    devanagari: |-
      यतः
      यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः । तदर्थं कर्म कौन्तेय मुक्तसङ्गः समाचर ॥ ३-९ ॥
      यज्ञार्थात्-अवश्यकरणीयात् अन्यानि कर्माणि बन्धकानि । अवश्य-कर्तव्यं मुक्तफलसङ्गतया क्रियमाणं न फलदम् ॥ ९ ॥
    slp1: |-
      yataH
      yajYArTAtkarmaRo'nyatra loko'yaM karmabanDanaH . tadarTaM karma kOnteya muktasaNgaH samAcara .. 3-9 ..
      yajYArTAt-avaSyakaraRIyAt anyAni karmARi banDakAni . avaSya-kartavyaM muktaPalasaNgatayA kriyamARaM na Paladam .. 9 ..
    iast: |-
      yataḥ
      yajñārthātkarmaṇo'nyatra loko'yaṃ karmabandhanaḥ | tadarthaṃ karma kaunteya muktasaṅgaḥ samācara || 3-9 ||
      yajñārthāt-avaśyakaraṇīyāt anyāni karmāṇi bandhakāni | avaśya-kartavyaṃ muktaphalasaṅgatayā kriyamāṇaṃ na phaladam || 9 ||
  - verse: 10
    devanagari: |-
      सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः । अनेन प्रसविष्यध्वमेष वोऽस्त्विष्टकामधुक् ॥ ३-१० ॥
      प्रजापतिः-परमात्मा प्रजाः सहैव कर्मभिः ससर्ज । उक्तं च तेन प्रजानां कर्मभ्य एव प्रसवः सन्तानः एतान्येव चेष्टं संसारं मोक्षं वा दास्यन्ति । सङ्गात्संसारं मुक्तसङ्गत्वान्मोक्षम् ॥ १० ॥
    slp1: |-
      sahayajYAH prajAH sfzwvA purovAca prajApatiH . anena prasavizyaDvameza vo'stvizwakAmaDuk .. 3-10 ..
      prajApatiH-paramAtmA prajAH sahEva karmaBiH sasarja . uktaM ca tena prajAnAM karmaBya eva prasavaH santAnaH etAnyeva cezwaM saMsAraM mokzaM vA dAsyanti . saNgAtsaMsAraM muktasaNgatvAnmokzam .. 10 ..
    iast: |-
      sahayajñāḥ prajāḥ sṛṣṭvā purovāca prajāpatiḥ | anena prasaviṣyadhvameṣa vo'stviṣṭakāmadhuk || 3-10 ||
      prajāpatiḥ-paramātmā prajāḥ sahaiva karmabhiḥ sasarja | uktaṃ ca tena prajānāṃ karmabhya eva prasavaḥ santānaḥ etānyeva ceṣṭaṃ saṃsāraṃ mokṣaṃ vā dāsyanti | saṅgātsaṃsāraṃ muktasaṅgatvānmokṣam || 10 ||
  - verse: 11
    devanagari: |-
      यत्र येषां मोक्षप्राधान्यं तैरेव विषयाः सेव्या इत्युच्यते
      देवान्भावयतानेन ते देवा भावयन्तु वः । परस्परं भावयन्तः श्रेयः परमवाप्स्यथ ॥ ३-११ ॥
      देवाः-क्रीडनशीला इन्द्रियवृत्तयः करणेश्वर्यो देवता रहस्यशास्त्रप्रसिद्धाः ता अनेन कर्मणा तर्पयत-यथासंभवं विषयान्भक्षयतेत्यर्थः । तृप्ताश्च सत्यस्ता वो-युष्मान् आत्मन एव स्वरूपमात्रोचितापवर्गान् भावयन्तु-स्वात्म-स्थितियोग्यत्वात् । एवमनवरतं व्युत्थानसमाधिसमयपरम्परायामिन्द्रियतर्पणतदात्म-साद्भाव लक्षणे परस्परभावने सति शीघ्रमेव परमं श्रेयः-परस्परभेदविगलनलक्षणं ब्रह्म प्राप्स्यथ ॥ ११ ॥
    slp1: |-
      yatra yezAM mokzaprADAnyaM tEreva vizayAH sevyA ityucyate
      devAnBAvayatAnena te devA BAvayantu vaH . parasparaM BAvayantaH SreyaH paramavApsyaTa .. 3-11 ..
      devAH-krIqanaSIlA indriyavfttayaH karaReSvaryo devatA rahasyaSAstraprasidDAH tA anena karmaRA tarpayata-yaTAsaMBavaM vizayAnBakzayatetyarTaH . tfptASca satyastA vo-yuzmAn Atmana eva svarUpamAtrocitApavargAn BAvayantu-svAtma-sTitiyogyatvAt . evamanavarataM vyutTAnasamADisamayaparamparAyAmindriyatarpaRatadAtma-sAdBAva lakzaRe parasparaBAvane sati SIGrameva paramaM SreyaH-parasparaBedavigalanalakzaRaM brahma prApsyaTa .. 11 ..
    iast: |-
      yatra yeṣāṃ mokṣaprādhānyaṃ taireva viṣayāḥ sevyā ityucyate
      devānbhāvayatānena te devā bhāvayantu vaḥ | parasparaṃ bhāvayantaḥ śreyaḥ paramavāpsyatha || 3-11 ||
      devāḥ-krīḍanaśīlā indriyavṛttayaḥ karaṇeśvaryo devatā rahasyaśāstraprasiddhāḥ tā anena karmaṇā tarpayata-yathāsaṃbhavaṃ viṣayānbhakṣayatetyarthaḥ | tṛptāśca satyastā vo-yuṣmān ātmana eva svarūpamātrocitāpavargān bhāvayantu-svātma-sthitiyogyatvāt | evamanavarataṃ vyutthānasamādhisamayaparamparāyāmindriyatarpaṇatadātma-sādbhāva lakṣaṇe parasparabhāvane sati śīghrameva paramaṃ śreyaḥ-parasparabhedavigalanalakṣaṇaṃ brahma prāpsyatha || 11 ||
  - verse: 12
    devanagari: |-
      न केवलमित्थमपवर्गे यावत्सिद्धिलाभेऽप्ययं मार्ग इत्याह
      इष्टान्कामान्हि वो देवा दास्यन्ते यज्ञभाविताः । तैर्दत्तानप्रदायैभ्यो यो भुङ्क्ते स्तेन एव सः ॥ ३-१२ ॥
      यज्ञतर्पितानि हीन्द्रियाणि स्थितिं बध्नन्ति यत्र क्वापि ध्येयादाविति । अत एव तद्व्यापारे सति तेषां विषयाणां स्मृतिसंकल्पध्यानादिना भावाः-विषया इन्द्रियैरेव दत्ताः यदि तेषामेव उपभोगाय न दीयन्ते तर्हि स्तेनत्वं-चौर्यं स्यात् छद्मचारित्वात् । उक्तं हि पूर्वमेव भगवता मूढाचारः स उच्यते इति । अतोऽयं वाक्यार्थः-यः सुखोपायं सिद्धिमपवर्गं वा प्रेप्सति तेन इन्द्रियकौतुकनिवृत्ति-मात्रफलतयैव भोगा यथोपनतमासेव्या इति ॥ १२ ॥
    slp1: |-
      na kevalamitTamapavarge yAvatsidDilABe'pyayaM mArga ityAha
      izwAnkAmAnhi vo devA dAsyante yajYaBAvitAH . tErdattAnapradAyEByo yo BuNkte stena eva saH .. 3-12 ..
      yajYatarpitAni hIndriyARi sTitiM baDnanti yatra kvApi DyeyAdAviti . ata eva tadvyApAre sati tezAM vizayARAM smftisaMkalpaDyAnAdinA BAvAH-vizayA indriyEreva dattAH yadi tezAmeva upaBogAya na dIyante tarhi stenatvaM-cOryaM syAt CadmacAritvAt . uktaM hi pUrvameva BagavatA mUQAcAraH sa ucyate iti . ato'yaM vAkyArTaH-yaH suKopAyaM sidDimapavargaM vA prepsati tena indriyakOtukanivftti-mAtraPalatayEva BogA yaTopanatamAsevyA iti .. 12 ..
    iast: |-
      na kevalamitthamapavarge yāvatsiddhilābhe'pyayaṃ mārga ityāha
      iṣṭānkāmānhi vo devā dāsyante yajñabhāvitāḥ | tairdattānapradāyaibhyo yo bhuṅkte stena eva saḥ || 3-12 ||
      yajñatarpitāni hīndriyāṇi sthitiṃ badhnanti yatra kvāpi dhyeyādāviti | ata eva tadvyāpāre sati teṣāṃ viṣayāṇāṃ smṛtisaṃkalpadhyānādinā bhāvāḥ-viṣayā indriyaireva dattāḥ yadi teṣāmeva upabhogāya na dīyante tarhi stenatvaṃ-cauryaṃ syāt chadmacāritvāt | uktaṃ hi pūrvameva bhagavatā mūḍhācāraḥ sa ucyate iti | ato'yaṃ vākyārthaḥ-yaḥ sukhopāyaṃ siddhimapavargaṃ vā prepsati tena indriyakautukanivṛtti-mātraphalatayaiva bhogā yathopanatamāsevyā iti || 12 ||
  - verse: 13
    devanagari: |-
      यज्ञशिष्टाशिनः सन्तो मुच्यन्ते सर्वकिल्बिषैः । भुञ्जते ते त्वघं पापा ये पचन्त्यात्मकारणात् ॥ ३-१३ ॥
      अवश्यकर्तव्यतारूपशासनमहिमायातान्भोगान् येऽश्नन्ति अवान्तरव्यापारमात्रतया अत एव च पृथग्फलत्वाभावाङ्गतया । अथ च-इन्द्रियात्मकदेवगणतर्पणलक्षणयज्ञात् अवशिष्टम्-अन्तःसारस्वात्मस्थित्यानन्दलक्षणविघसं येऽश्नन्ति-तत्रारूढा भवन्ति तदुपादेयोपायतया तु विषयभोगं वाञ्छन्ति ते सर्वकिल्विषैः-शुभाशुभैर्मुच्यन्ते । ये तु आत्मकारणादिति-अविद्यावशात् स्थूलमेव विषयभोगं परत्वेन मन्वानाः आत्मार्थमिदं वयं कुर्मः-इति कुर्वते । त एव अघं-शुभाशुभात्मकं लभन्ते ॥ १३ ॥
    slp1: |-
      yajYaSizwASinaH santo mucyante sarvakilbizEH . BuYjate te tvaGaM pApA ye pacantyAtmakAraRAt .. 3-13 ..
      avaSyakartavyatArUpaSAsanamahimAyAtAnBogAn ye'Snanti avAntaravyApAramAtratayA ata eva ca pfTagPalatvABAvANgatayA . aTa ca-indriyAtmakadevagaRatarpaRalakzaRayajYAt avaSizwam-antaHsArasvAtmasTityAnandalakzaRaviGasaM ye'Snanti-tatrArUQA Bavanti tadupAdeyopAyatayA tu vizayaBogaM vAYCanti te sarvakilvizEH-SuBASuBErmucyante . ye tu AtmakAraRAditi-avidyAvaSAt sTUlameva vizayaBogaM paratvena manvAnAH AtmArTamidaM vayaM kurmaH-iti kurvate . ta eva aGaM-SuBASuBAtmakaM laBante .. 13 ..
    iast: |-
      yajñaśiṣṭāśinaḥ santo mucyante sarvakilbiṣaiḥ | bhuñjate te tvaghaṃ pāpā ye pacantyātmakāraṇāt || 3-13 ||
      avaśyakartavyatārūpaśāsanamahimāyātānbhogān ye'śnanti avāntaravyāpāramātratayā ata eva ca pṛthagphalatvābhāvāṅgatayā | atha ca-indriyātmakadevagaṇatarpaṇalakṣaṇayajñāt avaśiṣṭam-antaḥsārasvātmasthityānandalakṣaṇavighasaṃ ye'śnanti-tatrārūḍhā bhavanti tadupādeyopāyatayā tu viṣayabhogaṃ vāñchanti te sarvakilviṣaiḥ-śubhāśubhairmucyante | ye tu ātmakāraṇāditi-avidyāvaśāt sthūlameva viṣayabhogaṃ paratvena manvānāḥ ātmārthamidaṃ vayaṃ kurmaḥ-iti kurvate | ta eva aghaṃ-śubhāśubhātmakaṃ labhante || 13 ||
  - verse: 14
    devanagari: |-
      अन्नाद् भवन्ति भूतानि पर्जन्यादन्नसम्भवः । यज्ञाद् भवति पर्जन्यो यज्ञः कर्मसमुद्भवः ॥ ३-१४ ॥
    slp1: |-
      annAd Bavanti BUtAni parjanyAdannasamBavaH . yajYAd Bavati parjanyo yajYaH karmasamudBavaH .. 3-14 ..
    iast: |-
      annād bhavanti bhūtāni parjanyādannasambhavaḥ | yajñād bhavati parjanyo yajñaḥ karmasamudbhavaḥ || 3-14 ||
  - verse: 15
    devanagari: |-
      कर्म ब्रह्मोद्भवं विद्धि ब्रह्माक्षरसमुद्भवम् । तस्मात् सर्वगतं ब्रह्म नित्यं यज्ञे प्रतिष्ठितम् ॥ ३-१५ ॥
      अन्नात्-अविभागभोग्यस्वभावात् कथञ्चिन्मायाविद्याकालाद्यनेकापरपर्यायात् भूतानि विचित्राणि भवन्ति । तच्चान्नं पर्जन्यात्-अविच्छिन्नसंवित्स्वभावादात्मनः भोक्तृतन्त्रात्मलाभत्वाद्भोग्यतायाः । स च पर्जन्यो-भोक्ता यज्ञात् भोगक्रियायत्तत्वाद्भोक्तृत्वस्य । भोगक्रिया च कर्मणः-क्रियाशक्तिस्वातन्त्र्यबलात् । तच्च स्वातन्त्र्यम्-अविच्छिन्नमपि अनवच्छिन्नानन्तस्वातन्त्र्यपूर्णसमुच्छलन्महेश्वरभावपरमात्म् अ-ब्रह्मसंस्पर्शवशात् । तच्च उच्छलदच्छानाच्छादितैश्वर्यं ब्रह्म-अक्षरात्-प्रशान्ताशेषैश्वर्यतरङ्गात्संविन्मात्रात् । इत्येवं सुव्यवस्थितोऽयं यज्ञः षडरं चक्रं वाहयन् अरात्रयसन्धानादपवर्गम् अरात्रयतन्त्रणाद्व्यवहारमासूत्रयति । इति विद्याविद्योल्लासतरङ्गसुभगं ब्रह्म यज्ञे एव प्रतिष्ठितम् । अन्ये तु-अन्नं तावद्वीर्यलोहितक्रमेण भूतकारणम् अन्नं च वृष्टिद्वारेण पर्जन्यात् सोऽपि यज्ञात् यज्ञः क्रियातः सा च ज्ञानपूर्विका ज्ञानमक्षरात् इति । अपरे तु-अन्नम्-अद्यमानं विषयपञ्चकमाश्रित्य भूतानि-इन्द्रियाणि विषयाश्चात्मस्फुरितरूपाः । अत आत्मैव विषयोपभोगेन । पोष्यते । अतश्च सर्वगतं ब्रह्म कर्मणि प्रतिष्ठितम्-तन्मयत्वात्तस्य ॥ १५ ॥
    slp1: |-
      karma brahmodBavaM vidDi brahmAkzarasamudBavam . tasmAt sarvagataM brahma nityaM yajYe pratizWitam .. 3-15 ..
      annAt-aviBAgaBogyasvaBAvAt kaTaYcinmAyAvidyAkAlAdyanekAparaparyAyAt BUtAni vicitrARi Bavanti . taccAnnaM parjanyAt-avicCinnasaMvitsvaBAvAdAtmanaH BoktftantrAtmalABatvAdBogyatAyAH . sa ca parjanyo-BoktA yajYAt BogakriyAyattatvAdBoktftvasya . BogakriyA ca karmaRaH-kriyASaktisvAtantryabalAt . tacca svAtantryam-avicCinnamapi anavacCinnAnantasvAtantryapUrRasamucCalanmaheSvaraBAvaparamAtm a-brahmasaMsparSavaSAt . tacca ucCaladacCAnAcCAditESvaryaM brahma-akzarAt-praSAntASezESvaryataraNgAtsaMvinmAtrAt . ityevaM suvyavasTito'yaM yajYaH zaqaraM cakraM vAhayan arAtrayasanDAnAdapavargam arAtrayatantraRAdvyavahAramAsUtrayati . iti vidyAvidyollAsataraNgasuBagaM brahma yajYe eva pratizWitam . anye tu-annaM tAvadvIryalohitakrameRa BUtakAraRam annaM ca vfzwidvAreRa parjanyAt so'pi yajYAt yajYaH kriyAtaH sA ca jYAnapUrvikA jYAnamakzarAt iti . apare tu-annam-adyamAnaM vizayapaYcakamASritya BUtAni-indriyARi vizayAScAtmasPuritarUpAH . ata AtmEva vizayopaBogena . pozyate . ataSca sarvagataM brahma karmaRi pratizWitam-tanmayatvAttasya .. 15 ..
    iast: |-
      karma brahmodbhavaṃ viddhi brahmākṣarasamudbhavam | tasmāt sarvagataṃ brahma nityaṃ yajñe pratiṣṭhitam || 3-15 ||
      annāt-avibhāgabhogyasvabhāvāt kathañcinmāyāvidyākālādyanekāparaparyāyāt bhūtāni vicitrāṇi bhavanti | taccānnaṃ parjanyāt-avicchinnasaṃvitsvabhāvādātmanaḥ bhoktṛtantrātmalābhatvādbhogyatāyāḥ | sa ca parjanyo-bhoktā yajñāt bhogakriyāyattatvādbhoktṛtvasya | bhogakriyā ca karmaṇaḥ-kriyāśaktisvātantryabalāt | tacca svātantryam-avicchinnamapi anavacchinnānantasvātantryapūrṇasamucchalanmaheśvarabhāvaparamātm a-brahmasaṃsparśavaśāt | tacca ucchaladacchānācchāditaiśvaryaṃ brahma-akṣarāt-praśāntāśeṣaiśvaryataraṅgātsaṃvinmātrāt | ityevaṃ suvyavasthito'yaṃ yajñaḥ ṣaḍaraṃ cakraṃ vāhayan arātrayasandhānādapavargam arātrayatantraṇādvyavahāramāsūtrayati | iti vidyāvidyollāsataraṅgasubhagaṃ brahma yajñe eva pratiṣṭhitam | anye tu-annaṃ tāvadvīryalohitakrameṇa bhūtakāraṇam annaṃ ca vṛṣṭidvāreṇa parjanyāt so'pi yajñāt yajñaḥ kriyātaḥ sā ca jñānapūrvikā jñānamakṣarāt iti | apare tu-annam-adyamānaṃ viṣayapañcakamāśritya bhūtāni-indriyāṇi viṣayāścātmasphuritarūpāḥ | ata ātmaiva viṣayopabhogena | poṣyate | ataśca sarvagataṃ brahma karmaṇi pratiṣṭhitam-tanmayatvāttasya || 15 ||
  - verse: 16
    devanagari: |-
      एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः । अघायुरिन्द्रियारामो मोघं पार्थ स जीवति ॥ ३-१६ ॥
      यस्त्वेवं नाङ्गीकरोति स पापमयः । यतः स इन्द्रियेष्वेव रमते नात्मनि ॥ १६ ॥
    slp1: |-
      evaM pravartitaM cakraM nAnuvartayatIha yaH . aGAyurindriyArAmo moGaM pArTa sa jIvati .. 3-16 ..
      yastvevaM nANgIkaroti sa pApamayaH . yataH sa indriyezveva ramate nAtmani .. 16 ..
    iast: |-
      evaṃ pravartitaṃ cakraṃ nānuvartayatīha yaḥ | aghāyurindriyārāmo moghaṃ pārtha sa jīvati || 3-16 ||
      yastvevaṃ nāṅgīkaroti sa pāpamayaḥ | yataḥ sa indriyeṣveva ramate nātmani || 16 ||
  - verse: 17
    devanagari: |-
      यश्चात्मरतिरेव स्यादात्मतृप्तश्च मानवः । आत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते ॥ ३-१७ ॥
    slp1: |-
      yaScAtmaratireva syAdAtmatfptaSca mAnavaH . Atmanyeva ca santuzwastasya kAryaM na vidyate .. 3-17 ..
    iast: |-
      yaścātmaratireva syādātmatṛptaśca mānavaḥ | ātmanyeva ca santuṣṭastasya kāryaṃ na vidyate || 3-17 ||
  - verse: 18
    devanagari: |-
      नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन । न चास्य सर्वभूतेषु कश्चिदर्थव्यपाश्रयः ॥ ३-१८ ॥
      आत्मरतेस्तु-कर्मेन्द्रियव्यापारतयैव कुर्वतः करणाकरणेषु समता । अत एव नासौ भूतेषु किंचिदात्मप्रयोजनमपेक्ष्य निग्रहानुग्रहौ करोति अपितु करणीयमिदम्-इत्येतावता ॥ १८ ॥
    slp1: |-
      nEva tasya kftenArTo nAkfteneha kaScana . na cAsya sarvaBUtezu kaScidarTavyapASrayaH .. 3-18 ..
      Atmaratestu-karmendriyavyApAratayEva kurvataH karaRAkaraRezu samatA . ata eva nAsO BUtezu kiMcidAtmaprayojanamapekzya nigrahAnugrahO karoti apitu karaRIyamidam-ityetAvatA .. 18 ..
    iast: |-
      naiva tasya kṛtenārtho nākṛteneha kaścana | na cāsya sarvabhūteṣu kaścidarthavyapāśrayaḥ || 3-18 ||
      ātmaratestu-karmendriyavyāpāratayaiva kurvataḥ karaṇākaraṇeṣu samatā | ata eva nāsau bhūteṣu kiṃcidātmaprayojanamapekṣya nigrahānugrahau karoti apitu karaṇīyamidam-ityetāvatā || 18 ||
  - verse: 19
    devanagari: |-
      कर्मणैव हि संसिद्धिमास्थिता जनकादयः । लोकसंग्रहमेवापि सम्पश्यन्कर्तुमर्हसि ॥ ३-१९ ॥
      तदत्र कुर्वतामपि सिद्धौ जनकादयो दृष्टान्ताः ॥ १९ ॥
    slp1: |-
      karmaREva hi saMsidDimAsTitA janakAdayaH . lokasaMgrahamevApi sampaSyankartumarhasi .. 3-19 ..
      tadatra kurvatAmapi sidDO janakAdayo dfzwAntAH .. 19 ..
    iast: |-
      karmaṇaiva hi saṃsiddhimāsthitā janakādayaḥ | lokasaṃgrahamevāpi sampaśyankartumarhasi || 3-19 ||
      tadatra kurvatāmapi siddhau janakādayo dṛṣṭāntāḥ || 19 ||
  - verse: 20
    devanagari: |-
      यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः । स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते ॥ ३-२० ॥
    slp1: |-
      yadyadAcarati SrezWastattadevetaro janaH . sa yatpramARaM kurute lokastadanuvartate .. 3-20 ..
    iast: |-
      yadyadācarati śreṣṭhastattadevetaro janaḥ | sa yatpramāṇaṃ kurute lokastadanuvartate || 3-20 ||
  - verse: 21
    devanagari: |-
      न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किञ्चन । नानवाप्तमवाप्तव्यं प्रवर्तेऽथ च कर्मणि ॥ ३-२१ ॥
    slp1: |-
      na me pArTAsti kartavyaM trizu lokezu kiYcana . nAnavAptamavAptavyaM pravarte'Ta ca karmaRi .. 3-21 ..
    iast: |-
      na me pārthāsti kartavyaṃ triṣu lokeṣu kiñcana | nānavāptamavāptavyaṃ pravarte'tha ca karmaṇi || 3-21 ||
  - verse: 22
    devanagari: |-
      यदि ह्यहं न वर्तेयं जातु कर्मण्यतन्द्रितः । मम वर्त्मानुवर्तेरन्मनुष्याः पार्थ सर्वशः ॥ ३-२२ ॥
    slp1: |-
      yadi hyahaM na varteyaM jAtu karmaRyatandritaH . mama vartmAnuvarteranmanuzyAH pArTa sarvaSaH .. 3-22 ..
    iast: |-
      yadi hyahaṃ na varteyaṃ jātu karmaṇyatandritaḥ | mama vartmānuvarteranmanuṣyāḥ pārtha sarvaśaḥ || 3-22 ||
  - verse: 23
    devanagari: |-
      उत्सीदेयुरिमे लोका न कुर्यां कर्म चेदहम् । सङ्करस्य च कर्ता स्यामुपहन्यामिमाः प्रजाः ॥ ३-२३ ॥
    slp1: |-
      utsIdeyurime lokA na kuryAM karma cedaham . saNkarasya ca kartA syAmupahanyAmimAH prajAH .. 3-23 ..
    iast: |-
      utsīdeyurime lokā na kuryāṃ karma cedaham | saṅkarasya ca kartā syāmupahanyāmimāḥ prajāḥ || 3-23 ||
  - verse: 24
    devanagari: |-
      तस्मादसक्तः सततं कार्यं कर्म समाचर । असक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः ॥ ३-२४ ॥
    slp1: |-
      tasmAdasaktaH satataM kAryaM karma samAcara . asakto hyAcarankarma paramApnoti pUruzaH .. 3-24 ..
    iast: |-
      tasmādasaktaḥ satataṃ kāryaṃ karma samācara | asakto hyācarankarma paramāpnoti pūruṣaḥ || 3-24 ||
  - verse: 25
    devanagari: |-
      सक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत । कुर्याद्विद्वांस्तथासक्तश्चिकीर्षुर्लोकसंग्रहम् ॥ ३-२५ ॥
      प्राप्तप्रापणीयस्य परिपूर्णमनसोऽपि कर्मप्रवृत्तौ लोकानुग्रहः प्रयोजनम्-इत्यत्र श्रीभगवानात्मानमेव दृष्टान्तमकरोति । तस्मादसक्त एव करणीयं कर्म कुर्यात् । किंच विदितवेद्यः । कर्म चेत् त्यजेत् तल्लोकानां दुर्भेद एवैकप्रसिद्धपक्षशिथिलितास्थाबन्धत्वेनाप्ररूढिलक्षणो जायते । यतः कर्मवासनां च न मोक्तुं शक्नुवन्ति ज्ञानधारां च नाश्रयितुम् । अथ च शिथिलीभवन्ति ॥ २५ ॥
    slp1: |-
      saktAH karmaRyavidvAMso yaTA kurvanti BArata . kuryAdvidvAMstaTAsaktaScikIrzurlokasaMgraham .. 3-25 ..
      prAptaprApaRIyasya paripUrRamanaso'pi karmapravfttO lokAnugrahaH prayojanam-ityatra SrIBagavAnAtmAnameva dfzwAntamakaroti . tasmAdasakta eva karaRIyaM karma kuryAt . kiMca viditavedyaH . karma cet tyajet tallokAnAM durBeda evEkaprasidDapakzaSiTilitAsTAbanDatvenAprarUQilakzaRo jAyate . yataH karmavAsanAM ca na moktuM Saknuvanti jYAnaDArAM ca nASrayitum . aTa ca SiTilIBavanti .. 25 ..
    iast: |-
      saktāḥ karmaṇyavidvāṃso yathā kurvanti bhārata | kuryādvidvāṃstathāsaktaścikīrṣurlokasaṃgraham || 3-25 ||
      prāptaprāpaṇīyasya paripūrṇamanaso'pi karmapravṛttau lokānugrahaḥ prayojanam-ityatra śrībhagavānātmānameva dṛṣṭāntamakaroti | tasmādasakta eva karaṇīyaṃ karma kuryāt | kiṃca viditavedyaḥ | karma cet tyajet tallokānāṃ durbheda evaikaprasiddhapakṣaśithilitāsthābandhatvenāprarūḍhilakṣaṇo jāyate | yataḥ karmavāsanāṃ ca na moktuṃ śaknuvanti jñānadhārāṃ ca nāśrayitum | atha ca śithilībhavanti || 25 ||
  - verse: 26
    devanagari: |-
      यतस्ते न सम्यग्ज्ञानेन पूताः अतो बुद्धेर्भेदनं-विचालनं तेषां परमोऽनर्थ इत्यनुग्रहाय भेदयेन्न धियमेषाम् तदाह
      न बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम् । जोषयेत् सर्वकर्माणि विद्वान्युक्तः समाचरन् ॥ ३-२६ ॥
      स्वयं चैवं बुद्ध्यमानः कर्माणि कुर्यात् । न च लोकानां बुद्धिं भिन्द्याद् ॥ २६ ॥
    slp1: |-
      yataste na samyagjYAnena pUtAH ato budDerBedanaM-vicAlanaM tezAM paramo'narTa ityanugrahAya Bedayenna DiyamezAm tadAha
      na budDiBedaM janayedajYAnAM karmasaNginAm . jozayet sarvakarmARi vidvAnyuktaH samAcaran .. 3-26 ..
      svayaM cEvaM budDyamAnaH karmARi kuryAt . na ca lokAnAM budDiM BindyAd .. 26 ..
    iast: |-
      yataste na samyagjñānena pūtāḥ ato buddherbhedanaṃ-vicālanaṃ teṣāṃ paramo'nartha ityanugrahāya bhedayenna dhiyameṣām tadāha
      na buddhibhedaṃ janayedajñānāṃ karmasaṅginām | joṣayet sarvakarmāṇi vidvānyuktaḥ samācaran || 3-26 ||
      svayaṃ caivaṃ buddhyamānaḥ karmāṇi kuryāt | na ca lokānāṃ buddhiṃ bhindyād || 26 ||
  - verse: 27
    devanagari: |-
      अज्ञानमित्युक्तं तदज्ञत्वं दर्शयति
      प्रकृतेः क्रियमाणानि गुणैः कर्माणि भागशः । अहङ्कारविमूढात्मा कर्ताहमिति मन्यते ॥ ३-२७ ॥
      प्रकृतिसंबन्धिभिर्गुणैः सत्त्वाद्यैः किल कर्माणि क्रियन्ते । मूढश्चाहं कर्तेत्यध्यवस्य मिथ्यैवात्मानं बध्नाति ॥ २७ ॥
    slp1: |-
      ajYAnamityuktaM tadajYatvaM darSayati
      prakfteH kriyamARAni guREH karmARi BAgaSaH . ahaNkAravimUQAtmA kartAhamiti manyate .. 3-27 ..
      prakftisaMbanDiBirguREH sattvAdyEH kila karmARi kriyante . mUQaScAhaM kartetyaDyavasya miTyEvAtmAnaM baDnAti .. 27 ..
    iast: |-
      ajñānamityuktaṃ tadajñatvaṃ darśayati
      prakṛteḥ kriyamāṇāni guṇaiḥ karmāṇi bhāgaśaḥ | ahaṅkāravimūḍhātmā kartāhamiti manyate || 3-27 ||
      prakṛtisaṃbandhibhirguṇaiḥ sattvādyaiḥ kila karmāṇi kriyante | mūḍhaścāhaṃ kartetyadhyavasya mithyaivātmānaṃ badhnāti || 27 ||
  - verse: 28
    devanagari: |-
      तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः । गुणा गुणेषु वर्तन्त इति मत्वा न सज्जते ॥ ३-२८ ॥
      गुणकर्मविभागतत्त्ववित्तु प्रकृतिः करोति मम किमायातम्-इत्यात्मानं मोचयति ॥ २८ ॥
    slp1: |-
      tattvavittu mahAbAho guRakarmaviBAgayoH . guRA guRezu vartanta iti matvA na sajjate .. 3-28 ..
      guRakarmaviBAgatattvavittu prakftiH karoti mama kimAyAtam-ityAtmAnaM mocayati .. 28 ..
    iast: |-
      tattvavittu mahābāho guṇakarmavibhāgayoḥ | guṇā guṇeṣu vartanta iti matvā na sajjate || 3-28 ||
      guṇakarmavibhāgatattvavittu prakṛtiḥ karoti mama kimāyātam-ityātmānaṃ mocayati || 28 ||
  - verse: 29
    devanagari: |-
      कर्मसङ्गिनामित्युक्तम् तत् कर्मसङ्गित्वं दर्शयति
      प्रकृतेर्गुणसम्मूढाः सज्जन्ते गुणकर्मसु । तानकृत्स्नविदो मन्दान्कृत्स्नविन्न विचालयेत् ॥ ३-२९ ॥
      प्रकृतिसंबन्धिभिर्गुणैः सत्वाद्यैः कृतेषु कर्मषु मूढाः सज्जन्ति सत्त्वादिगुणमाहात्म्यात् । तस्माद्युक्तः सन् जुषेत कर्माणि इत्युक्तम् ॥ २९ ॥
    slp1: |-
      karmasaNginAmityuktam tat karmasaNgitvaM darSayati
      prakfterguRasammUQAH sajjante guRakarmasu . tAnakftsnavido mandAnkftsnavinna vicAlayet .. 3-29 ..
      prakftisaMbanDiBirguREH satvAdyEH kftezu karmazu mUQAH sajjanti sattvAdiguRamAhAtmyAt . tasmAdyuktaH san juzeta karmARi ityuktam .. 29 ..
    iast: |-
      karmasaṅgināmityuktam tat karmasaṅgitvaṃ darśayati
      prakṛterguṇasammūḍhāḥ sajjante guṇakarmasu | tānakṛtsnavido mandānkṛtsnavinna vicālayet || 3-29 ||
      prakṛtisaṃbandhibhirguṇaiḥ satvādyaiḥ kṛteṣu karmaṣu mūḍhāḥ sajjanti sattvādiguṇamāhātmyāt | tasmādyuktaḥ san juṣeta karmāṇi ityuktam || 29 ||
  - verse: 30
    devanagari: |-
      तत्र कथम् इति स्फुटयति-
      मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा । निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः ॥ ३-३० ॥
      मयि सर्वाणि कर्माणि नाहं कर्ता-इति संन्यस्य स्वतन्त्रः परमेश्वर एव सर्वकर्ता नाहं कश्चित्-इति निश्चित्य लोकानुग्रहं चिकीर्षुर्लोकाचारं युद्धात्मकमनुतिष्ठ ॥ ३० ॥
    slp1: |-
      tatra kaTam iti sPuwayati-
      mayi sarvARi karmARi saMnyasyADyAtmacetasA . nirASIrnirmamo BUtvA yuDyasva vigatajvaraH .. 3-30 ..
      mayi sarvARi karmARi nAhaM kartA-iti saMnyasya svatantraH parameSvara eva sarvakartA nAhaM kaScit-iti niScitya lokAnugrahaM cikIrzurlokAcAraM yudDAtmakamanutizWa .. 30 ..
    iast: |-
      tatra katham iti sphuṭayati-
      mayi sarvāṇi karmāṇi saṃnyasyādhyātmacetasā | nirāśīrnirmamo bhūtvā yudhyasva vigatajvaraḥ || 3-30 ||
      mayi sarvāṇi karmāṇi nāhaṃ kartā-iti saṃnyasya svatantraḥ parameśvara eva sarvakartā nāhaṃ kaścit-iti niścitya lokānugrahaṃ cikīrṣurlokācāraṃ yuddhātmakamanutiṣṭha || 30 ||
  - verse: 31
    devanagari: |-
      ये मे मतमिदं नित्यमनुतिष्ठन्ति मानवाः । श्रद्धावन्तोऽनसूयन्तो मुच्यन्ते सर्वकर्मभिः ॥ ३-३१ ॥
      एतच्च मतमाश्रित्य यः कश्चिद्यत्किंचित्करोति तत्तस्य न बन्धकम् ॥ ३१ ॥
    slp1: |-
      ye me matamidaM nityamanutizWanti mAnavAH . SradDAvanto'nasUyanto mucyante sarvakarmaBiH .. 3-31 ..
      etacca matamASritya yaH kaScidyatkiMcitkaroti tattasya na banDakam .. 31 ..
    iast: |-
      ye me matamidaṃ nityamanutiṣṭhanti mānavāḥ | śraddhāvanto'nasūyanto mucyante sarvakarmabhiḥ || 3-31 ||
      etacca matamāśritya yaḥ kaścidyatkiṃcitkaroti tattasya na bandhakam || 31 ||
  - verse: 32
    devanagari: |-
      ये त्वेतदभ्यसूयन्तो नानुवर्तन्ति मे मतम् । सर्वज्ञानविमूढांस्तान्विद्धि नष्टानचेतसः ॥ ३-३२ ॥
      एतस्मिंस्तु ज्ञाने ये न श्रद्धालवस्ते विनष्टाः-अविरतं जन्ममरणादिभयभावितत्वात् ॥ ३२ ॥
    slp1: |-
      ye tvetadaByasUyanto nAnuvartanti me matam . sarvajYAnavimUQAMstAnvidDi nazwAnacetasaH .. 3-32 ..
      etasmiMstu jYAne ye na SradDAlavaste vinazwAH-avirataM janmamaraRAdiBayaBAvitatvAt .. 32 ..
    iast: |-
      ye tvetadabhyasūyanto nānuvartanti me matam | sarvajñānavimūḍhāṃstānviddhi naṣṭānacetasaḥ || 3-32 ||
      etasmiṃstu jñāne ye na śraddhālavaste vinaṣṭāḥ-avirataṃ janmamaraṇādibhayabhāvitatvāt || 32 ||
  - verse: 33
    devanagari: |-
      सदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञानवानपि । प्रकृतिं यान्ति भूतानि निग्रहः किं करिष्यति ॥ ३-३३ ॥
      योऽपि च ज्ञानी न तस्य व्यवहारे भोजनादौ विपर्यासः कश्चित् अपितु सोऽपि सत्त्वाद्युचितमेव चेष्टते । एवमेव जानन् यतो भूतानां-पृथिव्यादीनां प्रकृतौ विलयः आत्मा चाकर्ता नित्यमुक्तः इति कस्य जन्मादिनिग्रहः ॥ ३३ ॥
    slp1: |-
      sadfSaM cezwate svasyAH prakfterjYAnavAnapi . prakftiM yAnti BUtAni nigrahaH kiM karizyati .. 3-33 ..
      yo'pi ca jYAnI na tasya vyavahAre BojanAdO viparyAsaH kaScit apitu so'pi sattvAdyucitameva cezwate . evameva jAnan yato BUtAnAM-pfTivyAdInAM prakftO vilayaH AtmA cAkartA nityamuktaH iti kasya janmAdinigrahaH .. 33 ..
    iast: |-
      sadṛśaṃ ceṣṭate svasyāḥ prakṛterjñānavānapi | prakṛtiṃ yānti bhūtāni nigrahaḥ kiṃ kariṣyati || 3-33 ||
      yo'pi ca jñānī na tasya vyavahāre bhojanādau viparyāsaḥ kaścit apitu so'pi sattvādyucitameva ceṣṭate | evameva jānan yato bhūtānāṃ-pṛthivyādīnāṃ prakṛtau vilayaḥ ātmā cākartā nityamuktaḥ iti kasya janmādinigrahaḥ || 33 ||
  - verse: 34
    devanagari: |-
      कथं तर्हि बन्धः ? इत्थमुच्यते-
      इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ । तयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ ॥ ३-३४ ॥
    slp1: |-
      kaTaM tarhi banDaH ? itTamucyate-
      indriyasyendriyasyArTe rAgadvezO vyavasTitO . tayorna vaSamAgacCettO hyasya paripanTinO .. 3-34 ..
    iast: |-
      kathaṃ tarhi bandhaḥ ? itthamucyate-
      indriyasyendriyasyārthe rāgadveṣau vyavasthitau | tayorna vaśamāgacchettau hyasya paripanthinau || 3-34 ||
  - verse: 35
    devanagari: |-
      श्रेयान् स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् । स्वधर्मे निधनं श्रेयः परधर्मोदयादपिः ॥ ३-३५ ॥
      संसारी च प्रतिविषयं रागं द्वेषं च गृह्णाति । यतः कर्माणि आत्मकर्तृकाण्येव विमूढत्वादभिमन्यते इति सममपि भोजनादिव्यवहारं कुर्वतोर्ज्ञानिसंसारिणोरस्त्ययं विशेषः । अयं नः सिद्धान्तः-सर्वथा मुक्तसंगस्य स्वधर्मचारिणो नास्ति कश्चित्पुण्यपापात्मको बन्धः । स्वधर्मो हि हृदयादनपायी स्वरसनिरूढ एव । न तेन कश्चिदपि रिक्तो जन्तुर्जायते-इत्यत्याज्यः ॥ ३५ ॥
    slp1: |-
      SreyAn svaDarmo viguRaH paraDarmAtsvanuzWitAt . svaDarme niDanaM SreyaH paraDarmodayAdapiH .. 3-35 ..
      saMsArI ca prativizayaM rAgaM dvezaM ca gfhRAti . yataH karmARi AtmakartfkARyeva vimUQatvAdaBimanyate iti samamapi BojanAdivyavahAraM kurvatorjYAnisaMsAriRorastyayaM viSezaH . ayaM naH sidDAntaH-sarvaTA muktasaMgasya svaDarmacAriRo nAsti kaScitpuRyapApAtmako banDaH . svaDarmo hi hfdayAdanapAyI svarasanirUQa eva . na tena kaScidapi rikto janturjAyate-ityatyAjyaH .. 35 ..
    iast: |-
      śreyān svadharmo viguṇaḥ paradharmātsvanuṣṭhitāt | svadharme nidhanaṃ śreyaḥ paradharmodayādapiḥ || 3-35 ||
      saṃsārī ca prativiṣayaṃ rāgaṃ dveṣaṃ ca gṛhṇāti | yataḥ karmāṇi ātmakartṛkāṇyeva vimūḍhatvādabhimanyate iti samamapi bhojanādivyavahāraṃ kurvatorjñānisaṃsāriṇorastyayaṃ viśeṣaḥ | ayaṃ naḥ siddhāntaḥ-sarvathā muktasaṃgasya svadharmacāriṇo nāsti kaścitpuṇyapāpātmako bandhaḥ | svadharmo hi hṛdayādanapāyī svarasanirūḍha eva | na tena kaścidapi rikto janturjāyate-ityatyājyaḥ || 35 ||
  - verse: 36
    devanagari: |-
      अर्जुन उवाच
      अथ केन प्रयुक्तोऽयं पापं चरति पूरुषः । अनिच्छमनोऽपि बलादाक्रम्येव नियोजितः ॥ ३-३६ ॥
      पापं पापतया विदन्नपि जनः कथं तत्र प्रवर्तते ? इति प्रश्नः । अस्य प्रश्नस्योत्थानेऽयमाशयः-स्वधर्मो यदि स्वहृदयादनपायित्वादत्याज्यः कथं तर्ह्यधर्माचरणमेषामिति । कोऽयं स्वधर्मो नाम येनारिक्तो जन्तुः-इत्युक्तं भवति ॥ ३६ ॥
    slp1: |-
      arjuna uvAca
      aTa kena prayukto'yaM pApaM carati pUruzaH . anicCamano'pi balAdAkramyeva niyojitaH .. 3-36 ..
      pApaM pApatayA vidannapi janaH kaTaM tatra pravartate ? iti praSnaH . asya praSnasyotTAne'yamASayaH-svaDarmo yadi svahfdayAdanapAyitvAdatyAjyaH kaTaM tarhyaDarmAcaraRamezAmiti . ko'yaM svaDarmo nAma yenArikto jantuH-ityuktaM Bavati .. 36 ..
    iast: |-
      arjuna uvāca
      atha kena prayukto'yaṃ pāpaṃ carati pūruṣaḥ | anicchamano'pi balādākramyeva niyojitaḥ || 3-36 ||
      pāpaṃ pāpatayā vidannapi janaḥ kathaṃ tatra pravartate ? iti praśnaḥ | asya praśnasyotthāne'yamāśayaḥ-svadharmo yadi svahṛdayādanapāyitvādatyājyaḥ kathaṃ tarhyadharmācaraṇameṣāmiti | ko'yaṃ svadharmo nāma yenārikto jantuḥ-ityuktaṃ bhavati || 36 ||
  - verse: 37
    devanagari: |-
      अत्रोत्तरं सत्यपि स्वधर्मे हृदिस्थे आगन्तुकावरणकृतोऽयं विल्पवः न तु तदभावकृतः-इत्याशयेन-
      श्रीभगवानुवाच
      काम एष क्रोध एष रजोगुणसमुद्भवः । महाशनो महापाप्मा विद्ध्येनमिह वैरिणम् ॥ ३-३७ ॥
      सुखस्य अशनो-ग्रासकारकः महतः पापस्य हेतुत्वाच्च क्रोध एव पापदायी । एनं च वैरिणं प्राज्ञो जानीयात् ॥ ३७ ॥
    slp1: |-
      atrottaraM satyapi svaDarme hfdisTe AgantukAvaraRakfto'yaM vilpavaH na tu tadaBAvakftaH-ityASayena-
      SrIBagavAnuvAca
      kAma eza kroDa eza rajoguRasamudBavaH . mahASano mahApApmA vidDyenamiha vEriRam .. 3-37 ..
      suKasya aSano-grAsakArakaH mahataH pApasya hetutvAcca kroDa eva pApadAyI . enaM ca vEriRaM prAjYo jAnIyAt .. 37 ..
    iast: |-
      atrottaraṃ satyapi svadharme hṛdisthe āgantukāvaraṇakṛto'yaṃ vilpavaḥ na tu tadabhāvakṛtaḥ-ityāśayena-
      śrībhagavānuvāca
      kāma eṣa krodha eṣa rajoguṇasamudbhavaḥ | mahāśano mahāpāpmā viddhyenamiha vairiṇam || 3-37 ||
      sukhasya aśano-grāsakārakaḥ mahataḥ pāpasya hetutvācca krodha eva pāpadāyī | enaṃ ca vairiṇaṃ prājño jānīyāt || 37 ||
  - verse: 38
    devanagari: |-
      ननु अर्थाद्युपघातकं ज्ञातस्वरूपं च वस्तु हातुं सुशकं भवेत्-इत्यभिप्रायेणार्जुन उवाच
      भवत्येष कथं कृष्ण कथं चैव विवर्धते । किमात्मकः किमाचारस्तन्ममाचक्ष्व पृच्छतः ॥ ३-३८ ॥
      अस्य चोत्पत्तौ किं कारणं वर्धने च को हेतुः स्वरूपं चास्य कीदृक् उत्पन्नौ रूढीभूतश्च किमाचरति-किं करोति ? इति प्रश्नाः ॥ ३८ ॥
    slp1: |-
      nanu arTAdyupaGAtakaM jYAtasvarUpaM ca vastu hAtuM suSakaM Bavet-ityaBiprAyeRArjuna uvAca
      Bavatyeza kaTaM kfzRa kaTaM cEva vivarDate . kimAtmakaH kimAcArastanmamAcakzva pfcCataH .. 3-38 ..
      asya cotpattO kiM kAraRaM varDane ca ko hetuH svarUpaM cAsya kIdfk utpannO rUQIBUtaSca kimAcarati-kiM karoti ? iti praSnAH .. 38 ..
    iast: |-
      nanu arthādyupaghātakaṃ jñātasvarūpaṃ ca vastu hātuṃ suśakaṃ bhavet-ityabhiprāyeṇārjuna uvāca
      bhavatyeṣa kathaṃ kṛṣṇa kathaṃ caiva vivardhate | kimātmakaḥ kimācārastanmamācakṣva pṛcchataḥ || 3-38 ||
      asya cotpattau kiṃ kāraṇaṃ vardhane ca ko hetuḥ svarūpaṃ cāsya kīdṛk utpannau rūḍhībhūtaśca kimācarati-kiṃ karoti ? iti praśnāḥ || 38 ||
  - verse: 39
    devanagari: |-
      अत्रोत्तरं-
      श्रीभगवानुवाच
      एष सूक्ष्मः परः शत्रुर्देहिनामिन्द्रियैः सह । सुखतन्त्र इवासीनो मोहयन्पार्थ तिष्ठति ॥ ३-३९ ॥
      एष तावत्सूक्ष्मः-उत्पत्तिसमयेऽलक्ष्य इन्द्रियेषु । एवं च वर्तमानः सुखं तन्त्रयितुमिवोत्पद्यते वस्तुतस्तु दुःखमोहमयः-तामसत्वात् । अत एव मोहयन् ॥ ३९ ॥
    slp1: |-
      atrottaraM-
      SrIBagavAnuvAca
      eza sUkzmaH paraH SatrurdehinAmindriyEH saha . suKatantra ivAsIno mohayanpArTa tizWati .. 3-39 ..
      eza tAvatsUkzmaH-utpattisamaye'lakzya indriyezu . evaM ca vartamAnaH suKaM tantrayitumivotpadyate vastutastu duHKamohamayaH-tAmasatvAt . ata eva mohayan .. 39 ..
    iast: |-
      atrottaraṃ-
      śrībhagavānuvāca
      eṣa sūkṣmaḥ paraḥ śatrurdehināmindriyaiḥ saha | sukhatantra ivāsīno mohayanpārtha tiṣṭhati || 3-39 ||
      eṣa tāvatsūkṣmaḥ-utpattisamaye'lakṣya indriyeṣu | evaṃ ca vartamānaḥ sukhaṃ tantrayitumivotpadyate vastutastu duḥkhamohamayaḥ-tāmasatvāt | ata eva mohayan || 39 ||
  - verse: 40
    devanagari: |-
      कामक्रोधमयो घोरः स्तम्भहर्षसमुद्भवः । अहङ्कारोऽभिमानात्मा दुस्तरः पापकर्मभिः ॥ ३-४० ॥
      स्तम्भः-कुलाद्यभिमानः तत्कृतो यो हर्षः-अहमीदृशः-इति । अत एवाह-अहंकार इति ॥ ४० ॥
    slp1: |-
      kAmakroDamayo GoraH stamBaharzasamudBavaH . ahaNkAro'BimAnAtmA dustaraH pApakarmaBiH .. 3-40 ..
      stamBaH-kulAdyaBimAnaH tatkfto yo harzaH-ahamIdfSaH-iti . ata evAha-ahaMkAra iti .. 40 ..
    iast: |-
      kāmakrodhamayo ghoraḥ stambhaharṣasamudbhavaḥ | ahaṅkāro'bhimānātmā dustaraḥ pāpakarmabhiḥ || 3-40 ||
      stambhaḥ-kulādyabhimānaḥ tatkṛto yo harṣaḥ-ahamīdṛśaḥ-iti | ata evāha-ahaṃkāra iti || 40 ||
  - verse: 41
    devanagari: |-
      हर्षमस्य निवर्त्यैष शोकमस्य ददाति च । भयं चास्य करोत्येष मोहयंस्तु मुहुर्मुहुः ॥ ३-४१ ॥
      अत एव च गर्वाद्वर्धतेऽभिमानस्वभावः सुखबुद्धिप्रकारेण च जायते इति त्रयः प्रश्नाः परिहृताः ॥ ४१ ॥
    slp1: |-
      harzamasya nivartyEza Sokamasya dadAti ca . BayaM cAsya karotyeza mohayaMstu muhurmuhuH .. 3-41 ..
      ata eva ca garvAdvarDate'BimAnasvaBAvaH suKabudDiprakAreRa ca jAyate iti trayaH praSnAH parihftAH .. 41 ..
    iast: |-
      harṣamasya nivartyaiṣa śokamasya dadāti ca | bhayaṃ cāsya karotyeṣa mohayaṃstu muhurmuhuḥ || 3-41 ||
      ata eva ca garvādvardhate'bhimānasvabhāvaḥ sukhabuddhiprakāreṇa ca jāyate iti trayaḥ praśnāḥ parihṛtāḥ || 41 ||
  - verse: 42
    devanagari: |-
      स एष कलुषी क्षुद्रश्छिद्रप्रेक्षी धनञ्जय । रजःप्रवृत्तो मोहात्मा मनुष्याणामुपद्रवः ॥ ३-४२ ॥
      इति । रजसः प्रवृत्तस्तमोरूप इत्यर्थः ॥ ४२ ॥
    slp1: |-
      sa eza kaluzI kzudraSCidraprekzI DanaYjaya . rajaHpravftto mohAtmA manuzyARAmupadravaH .. 3-42 ..
      iti . rajasaH pravfttastamorUpa ityarTaH .. 42 ..
    iast: |-
      sa eṣa kaluṣī kṣudraśchidraprekṣī dhanañjaya | rajaḥpravṛtto mohātmā manuṣyāṇāmupadravaḥ || 3-42 ||
      iti | rajasaḥ pravṛttastamorūpa ityarthaḥ || 42 ||
  - verse: 43
    devanagari: |-
      धूमेनाव्रियते वह्निर्यथाऽऽदर्शो मलेन च । यथोल्वेनावृतो गर्भस्तथा नेनायमावृतः ॥ ३-४३ ॥
      दृष्टान्तत्रयेण दुरपसर्पत्वम् अकार्यकरत्वं युगुप्सास्पदत्वं चोक्तम् । अयमिति-आत्मा ॥ ४३ ॥
    slp1: |-
      DUmenAvriyate vahniryaTA''darSo malena ca . yaTolvenAvfto garBastaTA nenAyamAvftaH .. 3-43 ..
      dfzwAntatrayeRa durapasarpatvam akAryakaratvaM yugupsAspadatvaM coktam . ayamiti-AtmA .. 43 ..
    iast: |-
      dhūmenāvriyate vahniryathā''darśo malena ca | yatholvenāvṛto garbhastathā nenāyamāvṛtaḥ || 3-43 ||
      dṛṣṭāntatrayeṇa durapasarpatvam akāryakaratvaṃ yugupsāspadatvaṃ coktam | ayamiti-ātmā || 43 ||
  - verse: 44
    devanagari: |-
      आवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा । कामरूपेण कौन्तेय दुष्पूरेणानलेन च ॥ ३-४४ ॥
      कामरूप इच्छायां यतश्चरति । अनलेन च-अग्निनेव पूरयितुमशक्येन-दृष्टादृष्टद्वयदाहकत्वात् ॥ ४४ ॥
    slp1: |-
      AvftaM jYAnametena jYAnino nityavEriRA . kAmarUpeRa kOnteya duzpUreRAnalena ca .. 3-44 ..
      kAmarUpa icCAyAM yataScarati . analena ca-agnineva pUrayitumaSakyena-dfzwAdfzwadvayadAhakatvAt .. 44 ..
    iast: |-
      āvṛtaṃ jñānametena jñānino nityavairiṇā | kāmarūpeṇa kaunteya duṣpūreṇānalena ca || 3-44 ||
      kāmarūpa icchāyāṃ yataścarati | analena ca-agnineva pūrayitumaśakyena-dṛṣṭādṛṣṭadvayadāhakatvāt || 44 ||
  - verse: 45
    devanagari: |-
      इन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते । एतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम् ॥ ३-४५ ॥
      आदौ इन्द्रियेषु सत्सु तिष्ठति । यथा चक्षुषा शत्रुर्दृष्ट इन्द्रियप्रदेशे एव क्रोधमात्मनो जनयति । ततो मनसि-संकल्पे । ततो बुद्धौ-निश्चये । एतद्वारेण मोहं जनयन् ज्ञानं नाशयति ॥ ४५ ॥
    slp1: |-
      indriyARi mano budDirasyADizWAnamucyate . etErvimohayatyeza jYAnamAvftya dehinam .. 3-45 ..
      AdO indriyezu satsu tizWati . yaTA cakzuzA Satrurdfzwa indriyapradeSe eva kroDamAtmano janayati . tato manasi-saMkalpe . tato budDO-niScaye . etadvAreRa mohaM janayan jYAnaM nASayati .. 45 ..
    iast: |-
      indriyāṇi mano buddhirasyādhiṣṭhānamucyate | etairvimohayatyeṣa jñānamāvṛtya dehinam || 3-45 ||
      ādau indriyeṣu satsu tiṣṭhati | yathā cakṣuṣā śatrurdṛṣṭa indriyapradeśe eva krodhamātmano janayati | tato manasi-saṃkalpe | tato buddhau-niścaye | etadvāreṇa mohaṃ janayan jñānaṃ nāśayati || 45 ||
  - verse: 46
    devanagari: |-
      अस्य निवारणे उपायमाह
      तस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ । पाप्मानं प्रजहीह्येनं ज्ञानविज्ञाननाशनम् ॥ ३-४६ ॥
      तस्मादादाविन्द्रियाणि नियमयेत्-क्रोधादिकमिन्द्रियेषु प्रथमं न गृह्णीयात् । ज्ञानं-ब्रह्म विज्ञानं च-भगवन्मयीं क्रियां नाशयति । हि-यतः अतः पाप्मानं क्रोधं त्यज । अथवा-ज्ञानेन-मनसा विज्ञानेन-बुद्ध्या च नाशनं-वारणं कृत्वा इति क्रियाविशेषणम् इन्द्रियेषूत्पन्नं संकल्पे न गृह्णीयात् । संकल्पितं वा न निश्चिनुयादिति तात्पर्यम् ॥ ४६ ॥
    slp1: |-
      asya nivAraRe upAyamAha
      tasmAttvamindriyARyAdO niyamya BaratarzaBa . pApmAnaM prajahIhyenaM jYAnavijYAnanASanam .. 3-46 ..
      tasmAdAdAvindriyARi niyamayet-kroDAdikamindriyezu praTamaM na gfhRIyAt . jYAnaM-brahma vijYAnaM ca-BagavanmayIM kriyAM nASayati . hi-yataH ataH pApmAnaM kroDaM tyaja . aTavA-jYAnena-manasA vijYAnena-budDyA ca nASanaM-vAraRaM kftvA iti kriyAviSezaRam indriyezUtpannaM saMkalpe na gfhRIyAt . saMkalpitaM vA na niScinuyAditi tAtparyam .. 46 ..
    iast: |-
      asya nivāraṇe upāyamāha
      tasmāttvamindriyāṇyādau niyamya bharatarṣabha | pāpmānaṃ prajahīhyenaṃ jñānavijñānanāśanam || 3-46 ||
      tasmādādāvindriyāṇi niyamayet-krodhādikamindriyeṣu prathamaṃ na gṛhṇīyāt | jñānaṃ-brahma vijñānaṃ ca-bhagavanmayīṃ kriyāṃ nāśayati | hi-yataḥ ataḥ pāpmānaṃ krodhaṃ tyaja | athavā-jñānena-manasā vijñānena-buddhyā ca nāśanaṃ-vāraṇaṃ kṛtvā iti kriyāviśeṣaṇam indriyeṣūtpannaṃ saṃkalpe na gṛhṇīyāt | saṃkalpitaṃ vā na niścinuyāditi tātparyam || 46 ||
  - verse: 47
    devanagari: |-
      अत्र युक्तिं श्लोकद्वयेनाह
      इन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः । मनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः ॥ ३-४७ ॥
    slp1: |-
      atra yuktiM SlokadvayenAha
      indriyARi parARyAhurindriyeByaH paraM manaH . manasastu parA budDiryo budDeH paratastu saH .. 3-47 ..
    iast: |-
      atra yuktiṃ ślokadvayenāha
      indriyāṇi parāṇyāhurindriyebhyaḥ paraṃ manaḥ | manasastu parā buddhiryo buddheḥ paratastu saḥ || 3-47 ||
  - verse: 48
    devanagari: |-
      एवं बुद्धेः परं बुद्ध्वा संस्तभ्यात्मानमात्मना । जहि शत्रुं महाबाहो कामरूपं दुरासदम् ॥ ३-४८ ॥
      यत इन्द्रियाणि शत्रुलक्षणाद्विषयादन्यानि । तेभ्यश्चान्यन्मनः । तस्मादपि बुद्धेर्व्यतिरेकः । बुद्धेरपि यस्यान्यस्वभावत्वं स आत्मा । एवमिन्द्रियोत्पन्नेन क्रोधेन कथं मनसो बुद्धेरात्मनो वा क्षोभः ? इति पर्यालोचयेदित्यर्थः । रहस्यविदां त्वयमाशयः-बुद्धेर्यः परत्र वर्तते परोऽहंकारः-सर्वमहम्-इत्यभेदात्मा स खलु परमोऽभेदः । अत एव च परिपूर्णस्य खण्डनाभावान्न क्रोधादय उदयन्ते । अतः परमहंकारं-परोत्साहसंविदात्मकं गृहीत्वा क्रोधम् अविद्यात्मानं शत्रुं जहीति शिवम् ॥ ४८ ॥
    slp1: |-
      evaM budDeH paraM budDvA saMstaByAtmAnamAtmanA . jahi SatruM mahAbAho kAmarUpaM durAsadam .. 3-48 ..
      yata indriyARi SatrulakzaRAdvizayAdanyAni . teByaScAnyanmanaH . tasmAdapi budDervyatirekaH . budDerapi yasyAnyasvaBAvatvaM sa AtmA . evamindriyotpannena kroDena kaTaM manaso budDerAtmano vA kzoBaH ? iti paryAlocayedityarTaH . rahasyavidAM tvayamASayaH-budDeryaH paratra vartate paro'haMkAraH-sarvamaham-ityaBedAtmA sa Kalu paramo'BedaH . ata eva ca paripUrRasya KaRqanABAvAnna kroDAdaya udayante . ataH paramahaMkAraM-parotsAhasaMvidAtmakaM gfhItvA kroDam avidyAtmAnaM SatruM jahIti Sivam .. 48 ..
    iast: |-
      evaṃ buddheḥ paraṃ buddhvā saṃstabhyātmānamātmanā | jahi śatruṃ mahābāho kāmarūpaṃ durāsadam || 3-48 ||
      yata indriyāṇi śatrulakṣaṇādviṣayādanyāni | tebhyaścānyanmanaḥ | tasmādapi buddhervyatirekaḥ | buddherapi yasyānyasvabhāvatvaṃ sa ātmā | evamindriyotpannena krodhena kathaṃ manaso buddherātmano vā kṣobhaḥ ? iti paryālocayedityarthaḥ | rahasyavidāṃ tvayamāśayaḥ-buddheryaḥ paratra vartate paro'haṃkāraḥ-sarvamaham-ityabhedātmā sa khalu paramo'bhedaḥ | ata eva ca paripūrṇasya khaṇḍanābhāvānna krodhādaya udayante | ataḥ paramahaṃkāraṃ-parotsāhasaṃvidātmakaṃ gṛhītvā krodham avidyātmānaṃ śatruṃ jahīti śivam || 48 ||
  - verse: 1000
    devanagari: |-
      घनानि दारान्देहं च योऽन्यत्वेनाधिगच्छति । किं नाम तस्य कुर्वन्ति क्रोधाद्याश्चित्तविभ्रमाः ॥ ३ ॥
    slp1: |-
      GanAni dArAndehaM ca yo'nyatvenADigacCati . kiM nAma tasya kurvanti kroDAdyAScittaviBramAH .. 3 ..
    iast: |-
      ghanāni dārāndehaṃ ca yo'nyatvenādhigacchati | kiṃ nāma tasya kurvanti krodhādyāścittavibhramāḥ || 3 ||
- chapter: 4
  title_sa: चतुर्थोऽध्यायः
  title_iast: "caturtho'dhyāyaḥ"
  title_en: "Fourth Adhyāya"
  verses:
  - verse: 1
    devanagari: |-
      श्रीभगवानुवाच
      एवं विवस्वते योगं प्रोक्तवानहमव्ययम् । विवस्वान्मनवे प्राह मनुरिक्ष्वाकवेऽब्रवीत् ॥ ४-१ ॥
    slp1: |-
      SrIBagavAnuvAca
      evaM vivasvate yogaM proktavAnahamavyayam . vivasvAnmanave prAha manurikzvAkave'bravIt .. 4-1 ..
    iast: |-
      śrībhagavānuvāca
      evaṃ vivasvate yogaṃ proktavānahamavyayam | vivasvānmanave prāha manurikṣvākave'bravīt || 4-1 ||
  - verse: 2
    devanagari: |-
      एवं परम्पराप्राप्तमिमं राजर्षयो विदुः । स कालेनेह महता योगो नष्टः परन्तप ॥ ४-२ ॥
      एतच्च गुरुपरम्परया प्राप्तमपि अद्यत्वे नष्टम् इत्यनेन भगवानस्य ज्ञानस्य दुर्लभतां गौरवं च प्रदर्शयति ॥ २ ॥
    slp1: |-
      evaM paramparAprAptamimaM rAjarzayo viduH . sa kAleneha mahatA yogo nazwaH parantapa .. 4-2 ..
      etacca guruparamparayA prAptamapi adyatve nazwam ityanena BagavAnasya jYAnasya durlaBatAM gOravaM ca pradarSayati .. 2 ..
    iast: |-
      evaṃ paramparāprāptamimaṃ rājarṣayo viduḥ | sa kāleneha mahatā yogo naṣṭaḥ parantapa || 4-2 ||
      etacca guruparamparayā prāptamapi adyatve naṣṭam ityanena bhagavānasya jñānasya durlabhatāṃ gauravaṃ ca pradarśayati || 2 ||
  - verse: 3
    devanagari: |-
      स एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः । भक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम् ॥ ४-३ ॥
      भक्तोऽसि मे सखा चेति त्वं भक्तो मत्परमः सखा च । चशब्देनान्वाचय उच्यते । तेन यथा भिक्षाटने भिक्षाणां प्राधान्यं गवानयने त्वप्राधान्यम् । एवं भक्तिरत्र गुरुं प्रधानं न सखित्वमपीति तात्पर्यार्थः ॥ ३ ॥
    slp1: |-
      sa evAyaM mayA te'dya yogaH proktaH purAtanaH . Bakto'si me saKA ceti rahasyaM hyetaduttamam .. 4-3 ..
      Bakto'si me saKA ceti tvaM Bakto matparamaH saKA ca . caSabdenAnvAcaya ucyate . tena yaTA BikzAwane BikzARAM prADAnyaM gavAnayane tvaprADAnyam . evaM Baktiratra guruM praDAnaM na saKitvamapIti tAtparyArTaH .. 3 ..
    iast: |-
      sa evāyaṃ mayā te'dya yogaḥ proktaḥ purātanaḥ | bhakto'si me sakhā ceti rahasyaṃ hyetaduttamam || 4-3 ||
      bhakto'si me sakhā ceti tvaṃ bhakto matparamaḥ sakhā ca | caśabdenānvācaya ucyate | tena yathā bhikṣāṭane bhikṣāṇāṃ prādhānyaṃ gavānayane tvaprādhānyam | evaṃ bhaktiratra guruṃ pradhānaṃ na sakhitvamapīti tātparyārthaḥ || 3 ||
  - verse: 4
    devanagari: |-
      अर्जुनो भगवत्स्वरूपं जानन्नपि लोके स्फुटीकर्तुं पृच्छति-
      अर्जुन उवाच
      अपरं भवतो जन्म परं जन्म विवस्वतः । कथमेतद्विजानीयां त्वमादौ प्रोक्तवानिति ॥ ४-४ ॥
    slp1: |-
      arjuno BagavatsvarUpaM jAnannapi loke sPuwIkartuM pfcCati-
      arjuna uvAca
      aparaM Bavato janma paraM janma vivasvataH . kaTametadvijAnIyAM tvamAdO proktavAniti .. 4-4 ..
    iast: |-
      arjuno bhagavatsvarūpaṃ jānannapi loke sphuṭīkartuṃ pṛcchati-
      arjuna uvāca
      aparaṃ bhavato janma paraṃ janma vivasvataḥ | kathametadvijānīyāṃ tvamādau proktavāniti || 4-4 ||
  - verse: 5
    devanagari: |-
      श्रीभगवानुवाच
      बहूनि मे व्यतीतानि जन्मानि तव चार्जुन । तान्यहं वेद सर्वाणि न त्वं वेत्थ परन्तप ॥ ४-५ ॥
    slp1: |-
      SrIBagavAnuvAca
      bahUni me vyatItAni janmAni tava cArjuna . tAnyahaM veda sarvARi na tvaM vetTa parantapa .. 4-5 ..
    iast: |-
      śrībhagavānuvāca
      bahūni me vyatītāni janmāni tava cārjuna | tānyahaṃ veda sarvāṇi na tvaṃ vettha parantapa || 4-5 ||
  - verse: 6
    devanagari: |-
      अजोऽपि सन्नव्ययात्मा भूतानामीश्वरोऽपि सन् । प्रकृतिं स्वामधिष्ठाय सम्भवाम्यात्ममायया ॥ ४-६ ॥
    slp1: |-
      ajo'pi sannavyayAtmA BUtAnAmISvaro'pi san . prakftiM svAmaDizWAya samBavAmyAtmamAyayA .. 4-6 ..
    iast: |-
      ajo'pi sannavyayātmā bhūtānāmīśvaro'pi san | prakṛtiṃ svāmadhiṣṭhāya sambhavāmyātmamāyayā || 4-6 ||
  - verse: 7
    devanagari: |-
      यदा यदा हि धर्मस्य ग्लानिर्भवति भारत । अभ्युत्थानमधर्मस्य तदात्मांशं सृजाम्यहम् ॥ ४-७ ॥
      श्रीभगवान्किल पूर्णषाड्गुण्यत्वाच्छरीरसंपर्कमात्ररहितोऽपि स्थितिकारित्वात्कारुणिकतया आत्मांशं सृजति । आत्मा-पूर्णषाड्गुण्यः अंशः-उपकारकत्वेनाप्रधानभूतो यत्र तदात्मांशं-शरीरं गृह्णातीत्यर्थः ॥ ७ ॥
    slp1: |-
      yadA yadA hi Darmasya glAnirBavati BArata . aByutTAnamaDarmasya tadAtmAMSaM sfjAmyaham .. 4-7 ..
      SrIBagavAnkila pUrRazAqguRyatvAcCarIrasaMparkamAtrarahito'pi sTitikAritvAtkAruRikatayA AtmAMSaM sfjati . AtmA-pUrRazAqguRyaH aMSaH-upakArakatvenApraDAnaBUto yatra tadAtmAMSaM-SarIraM gfhRAtItyarTaH .. 7 ..
    iast: |-
      yadā yadā hi dharmasya glānirbhavati bhārata | abhyutthānamadharmasya tadātmāṃśaṃ sṛjāmyaham || 4-7 ||
      śrībhagavānkila pūrṇaṣāḍguṇyatvāccharīrasaṃparkamātrarahito'pi sthitikāritvātkāruṇikatayā ātmāṃśaṃ sṛjati | ātmā-pūrṇaṣāḍguṇyaḥ aṃśaḥ-upakārakatvenāpradhānabhūto yatra tadātmāṃśaṃ-śarīraṃ gṛhṇātītyarthaḥ || 7 ||
  - verse: 8
    devanagari: |-
      परित्राणाय साधूनां विनाशाय च दुष्कृताम् । धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ॥ ४-८ ॥
    slp1: |-
      paritrARAya sADUnAM vinASAya ca duzkftAm . DarmasaMsTApanArTAya samBavAmi yuge yuge .. 4-8 ..
    iast: |-
      paritrāṇāya sādhūnāṃ vināśāya ca duṣkṛtām | dharmasaṃsthāpanārthāya sambhavāmi yuge yuge || 4-8 ||
  - verse: 9
    devanagari: |-
      जन्म कर्म च मे दिव्यमेवं यो वेत्ति तत्त्वतः । त्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन ॥ ४-९ ॥
      अत एवास्य जन्म दिव्यं यत आत्ममायया योगप्रज्ञया स्वस्वातन्त्र्यशक्त्या आरब्धं न कर्मभिः । कर्मापि दिव्यं-फलदानासमर्थत्वात् । यश्चैवमेतत्तत्वं वेत्ति-आत्मन्यप्येवमेव मन्यते सोऽवश्यं भगवद्वासुदेवतत्त्वं जानाति ॥ ९ ॥
    slp1: |-
      janma karma ca me divyamevaM yo vetti tattvataH . tyaktvA dehaM punarjanma nEti mAmeti so'rjuna .. 4-9 ..
      ata evAsya janma divyaM yata AtmamAyayA yogaprajYayA svasvAtantryaSaktyA ArabDaM na karmaBiH . karmApi divyaM-PaladAnAsamarTatvAt . yaScEvametattatvaM vetti-Atmanyapyevameva manyate so'vaSyaM BagavadvAsudevatattvaM jAnAti .. 9 ..
    iast: |-
      janma karma ca me divyamevaṃ yo vetti tattvataḥ | tyaktvā dehaṃ punarjanma naiti māmeti so'rjuna || 4-9 ||
      ata evāsya janma divyaṃ yata ātmamāyayā yogaprajñayā svasvātantryaśaktyā ārabdhaṃ na karmabhiḥ | karmāpi divyaṃ-phaladānāsamarthatvāt | yaścaivametattatvaṃ vetti-ātmanyapyevameva manyate so'vaśyaṃ bhagavadvāsudevatattvaṃ jānāti || 9 ||
  - verse: 10
    devanagari: |-
      वीतरागभयक्रोधा मन्मया मद्व्यपाश्रयाः । बहवो ज्ञानतपसा पूता मद्भावमागताः ॥ ४-१० ॥
      तथा चैव विदन्तः मन्मयत्वात्परिपूर्णेच्छत्वात् क्रोधादिरहिता निष्फलं कर्म करणीयं कुर्वाणा बहवो मत्स्वरूपमवाप्ताः ॥ १० ॥
    slp1: |-
      vItarAgaBayakroDA manmayA madvyapASrayAH . bahavo jYAnatapasA pUtA madBAvamAgatAH .. 4-10 ..
      taTA cEva vidantaH manmayatvAtparipUrRecCatvAt kroDAdirahitA nizPalaM karma karaRIyaM kurvARA bahavo matsvarUpamavAptAH .. 10 ..
    iast: |-
      vītarāgabhayakrodhā manmayā madvyapāśrayāḥ | bahavo jñānatapasā pūtā madbhāvamāgatāḥ || 4-10 ||
      tathā caiva vidantaḥ manmayatvātparipūrṇecchatvāt krodhādirahitā niṣphalaṃ karma karaṇīyaṃ kurvāṇā bahavo matsvarūpamavāptāḥ || 10 ||
  - verse: 11
    devanagari: |-
      यतः-
      ये यथा मां प्रपद्यन्ते तांस्तथैव भजाम्यहम् । मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः ॥ ४-११ ॥
      ये ययैव बुद्ध्या मामाश्रयन्ते तान्प्रति तदेव स्वरूपं गृह्णंस्ताननुगृह्णामि । एवमेव मदीयं मार्गं मन्मया अमन्मयाश्च सर्वे एवानुवर्तन्ते नहि ज्योतिष्टोमादिरन्यो मार्गः मदीयैव सा तथेच्छा । वक्ष्यते हि चातुर्वर्ण्य मया सृष्टम् इति । अन्यस्त्वाह-लिङर्थे लट् । यथा अतिरात्रे षोडशिनं गृह्णन्ति-गृह्णीयुरित्यर्थः । एवमिहापि अनुवर्तन्ते-अनुवर्तेरन्निति ॥ ११ ॥
    slp1: |-
      yataH-
      ye yaTA mAM prapadyante tAMstaTEva BajAmyaham . mama vartmAnuvartante manuzyAH pArTa sarvaSaH .. 4-11 ..
      ye yayEva budDyA mAmASrayante tAnprati tadeva svarUpaM gfhRaMstAnanugfhRAmi . evameva madIyaM mArgaM manmayA amanmayASca sarve evAnuvartante nahi jyotizwomAdiranyo mArgaH madIyEva sA taTecCA . vakzyate hi cAturvarRya mayA sfzwam iti . anyastvAha-liNarTe law . yaTA atirAtre zoqaSinaM gfhRanti-gfhRIyurityarTaH . evamihApi anuvartante-anuvarteranniti .. 11 ..
    iast: |-
      yataḥ-
      ye yathā māṃ prapadyante tāṃstathaiva bhajāmyaham | mama vartmānuvartante manuṣyāḥ pārtha sarvaśaḥ || 4-11 ||
      ye yayaiva buddhyā māmāśrayante tānprati tadeva svarūpaṃ gṛhṇaṃstānanugṛhṇāmi | evameva madīyaṃ mārgaṃ manmayā amanmayāśca sarve evānuvartante nahi jyotiṣṭomādiranyo mārgaḥ madīyaiva sā tathecchā | vakṣyate hi cāturvarṇya mayā sṛṣṭam iti | anyastvāha-liṅarthe laṭ | yathā atirātre ṣoḍaśinaṃ gṛhṇanti-gṛhṇīyurityarthaḥ | evamihāpi anuvartante-anuvarteranniti || 11 ||
  - verse: 12
    devanagari: |-
      काङ्क्षन्तः कर्मणां सिद्धिं यजन्त इह देवताः । क्षिप्रं हि मानुषे लोके सिद्धिर्भवति कर्मजा ॥ ४-१२ ॥
      मानुष एव लोके भोगापवर्गलक्षणा सिद्धिर्नान्यत्र इति ॥ १२ ॥
    slp1: |-
      kANkzantaH karmaRAM sidDiM yajanta iha devatAH . kzipraM hi mAnuze loke sidDirBavati karmajA .. 4-12 ..
      mAnuza eva loke BogApavargalakzaRA sidDirnAnyatra iti .. 12 ..
    iast: |-
      kāṅkṣantaḥ karmaṇāṃ siddhiṃ yajanta iha devatāḥ | kṣipraṃ hi mānuṣe loke siddhirbhavati karmajā || 4-12 ||
      mānuṣa eva loke bhogāpavargalakṣaṇā siddhirnānyatra iti || 12 ||
  - verse: 13
    devanagari: |-
      चातुर्वर्ण्यं मया सृष्टं गुणकर्मविभागशः । तस्य कर्तारमपि मां विद्ध्यकर्तारमव्ययम् ॥ ४-१३ ॥
    slp1: |-
      cAturvarRyaM mayA sfzwaM guRakarmaviBAgaSaH . tasya kartAramapi mAM vidDyakartAramavyayam .. 4-13 ..
    iast: |-
      cāturvarṇyaṃ mayā sṛṣṭaṃ guṇakarmavibhāgaśaḥ | tasya kartāramapi māṃ viddhyakartāramavyayam || 4-13 ||
  - verse: 14
    devanagari: |-
      न मां कर्माणि लिम्पन्ति न मे कामः फलेष्वपि । इति मां योऽभिजानाति कर्मभिर्न स बध्यते ॥ ४-१४ ॥
      मम किल कथमाकाशकल्पस्य कर्मभिर्लेपः । आकाशप्रतिमत्वं कामनाभावात् । इत्यनेन ज्ञानप्रकारेण यो भगवन्तमेवाश्रयते सर्वत्र सर्वदा आनन्दघनं परमेश्वरमेव न वासुदेवात्परमस्ति किंचित् इति नीत्या विमृशति तस्य किं कर्मभिर्बन्धः ॥ १४ ॥
    slp1: |-
      na mAM karmARi limpanti na me kAmaH Palezvapi . iti mAM yo'BijAnAti karmaBirna sa baDyate .. 4-14 ..
      mama kila kaTamAkASakalpasya karmaBirlepaH . AkASapratimatvaM kAmanABAvAt . ityanena jYAnaprakAreRa yo BagavantamevASrayate sarvatra sarvadA AnandaGanaM parameSvarameva na vAsudevAtparamasti kiMcit iti nItyA vimfSati tasya kiM karmaBirbanDaH .. 14 ..
    iast: |-
      na māṃ karmāṇi limpanti na me kāmaḥ phaleṣvapi | iti māṃ yo'bhijānāti karmabhirna sa badhyate || 4-14 ||
      mama kila kathamākāśakalpasya karmabhirlepaḥ | ākāśapratimatvaṃ kāmanābhāvāt | ityanena jñānaprakāreṇa yo bhagavantamevāśrayate sarvatra sarvadā ānandaghanaṃ parameśvarameva na vāsudevātparamasti kiṃcit iti nītyā vimṛśati tasya kiṃ karmabhirbandhaḥ || 14 ||
  - verse: 15
    devanagari: |-
      एवं ज्ञात्वा कृतं कर्म पूर्वैरपि मुमुक्षुभिः । कुरु कर्मैव तस्मात्त्वं पूर्वैः पूर्वतरं कृतम् ॥ ४-१५ ॥
      तस्मादनया बुद्ध्या पवित्रीकृतस्त्वमपि कर्माणि-अवश्यकर्तव्यानि कुरु ॥ १५ ॥
    slp1: |-
      evaM jYAtvA kftaM karma pUrvErapi mumukzuBiH . kuru karmEva tasmAttvaM pUrvEH pUrvataraM kftam .. 4-15 ..
      tasmAdanayA budDyA pavitrIkftastvamapi karmARi-avaSyakartavyAni kuru .. 15 ..
    iast: |-
      evaṃ jñātvā kṛtaṃ karma pūrvairapi mumukṣubhiḥ | kuru karmaiva tasmāttvaṃ pūrvaiḥ pūrvataraṃ kṛtam || 4-15 ||
      tasmādanayā buddhyā pavitrīkṛtastvamapi karmāṇi-avaśyakartavyāni kuru || 15 ||
  - verse: 16
    devanagari: |-
      अथोच्यते अकरणादेव सिद्धिः - इति । तन्न यतः
      किं कर्म किमकर्मेति कवयोऽप्यत्र मोहिताः । तत्ते कर्म प्रवक्ष्यामि यज्ज्ञात्वा मोक्ष्यसेऽशुभात् ॥ ४-१६ ॥
    slp1: |-
      aTocyate akaraRAdeva sidDiH - iti . tanna yataH
      kiM karma kimakarmeti kavayo'pyatra mohitAH . tatte karma pravakzyAmi yajjYAtvA mokzyase'SuBAt .. 4-16 ..
    iast: |-
      athocyate akaraṇādeva siddhiḥ - iti | tanna yataḥ
      kiṃ karma kimakarmeti kavayo'pyatra mohitāḥ | tatte karma pravakṣyāmi yajjñātvā mokṣyase'śubhāt || 4-16 ||
  - verse: 17
    devanagari: |-
      कर्मणो ह्यपि बोद्धव्यं बोद्धव्यं च विकर्मणः । अकर्मणश्च बोद्धव्यं गहना कर्मणो गतिः ॥ ४-१७ ॥
      कर्माकर्मणोर्विभागो दुष्परिज्ञानः । तथा च-विहितकर्मण्यपि मध्ये दुष्टं कर्मास्ति-अग्निष्टोम इव पशुवधः । विरुद्धेऽपि च कर्मणि शुभमस्ति कर्म । तथाहि हिंस्रप्राणिवधे प्रजोपतापाभावः । अकरणेऽपि च शुभाशुभं कर्मास्ति-वाङ्मनसकृतानां कर्मणामवश्यंभावात् तेषां ज्ञानमन्तरेण दुष्परिहरत्वात् । अतः कुशलैरपि गहनत्वात्कर्म न ज्ञायते अनेन शुभकर्मणा शुभमस्माकं भविष्यति अनेन च कर्मणामनारम्भेण मोक्षो न भविष्यति-इति । तस्माद्वक्ष्यमाणो विज्ञानवह्निरेवावश्यं सकलशुभाशुभकर्मेन्धनप्लोषसमर्थः शरणत्वेनान्वेष्य-इति भगवतोऽभिप्रायः ॥ १७ ॥
    slp1: |-
      karmaRo hyapi bodDavyaM bodDavyaM ca vikarmaRaH . akarmaRaSca bodDavyaM gahanA karmaRo gatiH .. 4-17 ..
      karmAkarmaRorviBAgo duzparijYAnaH . taTA ca-vihitakarmaRyapi maDye duzwaM karmAsti-agnizwoma iva paSuvaDaH . virudDe'pi ca karmaRi SuBamasti karma . taTAhi hiMsraprARivaDe prajopatApABAvaH . akaraRe'pi ca SuBASuBaM karmAsti-vANmanasakftAnAM karmaRAmavaSyaMBAvAt tezAM jYAnamantareRa duzpariharatvAt . ataH kuSalErapi gahanatvAtkarma na jYAyate anena SuBakarmaRA SuBamasmAkaM Bavizyati anena ca karmaRAmanAramBeRa mokzo na Bavizyati-iti . tasmAdvakzyamARo vijYAnavahnirevAvaSyaM sakalaSuBASuBakarmenDanaplozasamarTaH SaraRatvenAnvezya-iti Bagavato'BiprAyaH .. 17 ..
    iast: |-
      karmaṇo hyapi boddhavyaṃ boddhavyaṃ ca vikarmaṇaḥ | akarmaṇaśca boddhavyaṃ gahanā karmaṇo gatiḥ || 4-17 ||
      karmākarmaṇorvibhāgo duṣparijñānaḥ | tathā ca-vihitakarmaṇyapi madhye duṣṭaṃ karmāsti-agniṣṭoma iva paśuvadhaḥ | viruddhe'pi ca karmaṇi śubhamasti karma | tathāhi hiṃsraprāṇivadhe prajopatāpābhāvaḥ | akaraṇe'pi ca śubhāśubhaṃ karmāsti-vāṅmanasakṛtānāṃ karmaṇāmavaśyaṃbhāvāt teṣāṃ jñānamantareṇa duṣpariharatvāt | ataḥ kuśalairapi gahanatvātkarma na jñāyate anena śubhakarmaṇā śubhamasmākaṃ bhaviṣyati anena ca karmaṇāmanārambheṇa mokṣo na bhaviṣyati-iti | tasmādvakṣyamāṇo vijñānavahnirevāvaśyaṃ sakalaśubhāśubhakarmendhanaploṣasamarthaḥ śaraṇatvenānveṣya-iti bhagavato'bhiprāyaḥ || 17 ||
  - verse: 18
    devanagari: |-
      तमेवोद्बोधयितुमाह-
      कर्मण्यकर्म यः पश्यत्यकर्मणि च कर्म यः । स बुद्धिमान् मनुष्येषु स चोक्तः कृत्स्नकर्मकृत् ॥ ४-१८ ॥
      कर्मणीति-आत्मीयेषु कर्मसु यः अकर्तृत्वादकर्मत्वं पश्यति प्रशान्ततया । अकर्मसु च-परकृतेषु आत्मकृतत्वं जानाति परिपूर्णोदितस्वरूपत्वेन । स एव सर्वस्व मध्ये बुद्धिमान् कार्त्स्न्येन-साकल्येनासौ कर्म करोति । अतोऽस्य केन कर्मणा फलं दीयताम् इत्युदितदशायाम् । प्रशान्तत्वे तु कृत्स्नानि कर्माणि कृन्तति च्छिनत्ति । अतः सर्वमेव करोति न किंचिद्वा करोति-इत्युपनिषत् ॥ १८ ॥
    slp1: |-
      tamevodboDayitumAha-
      karmaRyakarma yaH paSyatyakarmaRi ca karma yaH . sa budDimAn manuzyezu sa coktaH kftsnakarmakft .. 4-18 ..
      karmaRIti-AtmIyezu karmasu yaH akartftvAdakarmatvaM paSyati praSAntatayA . akarmasu ca-parakftezu AtmakftatvaM jAnAti paripUrRoditasvarUpatvena . sa eva sarvasva maDye budDimAn kArtsnyena-sAkalyenAsO karma karoti . ato'sya kena karmaRA PalaM dIyatAm ityuditadaSAyAm . praSAntatve tu kftsnAni karmARi kfntati cCinatti . ataH sarvameva karoti na kiMcidvA karoti-ityupanizat .. 18 ..
    iast: |-
      tamevodbodhayitumāha-
      karmaṇyakarma yaḥ paśyatyakarmaṇi ca karma yaḥ | sa buddhimān manuṣyeṣu sa coktaḥ kṛtsnakarmakṛt || 4-18 ||
      karmaṇīti-ātmīyeṣu karmasu yaḥ akartṛtvādakarmatvaṃ paśyati praśāntatayā | akarmasu ca-parakṛteṣu ātmakṛtatvaṃ jānāti paripūrṇoditasvarūpatvena | sa eva sarvasva madhye buddhimān kārtsnyena-sākalyenāsau karma karoti | ato'sya kena karmaṇā phalaṃ dīyatām ityuditadaśāyām | praśāntatve tu kṛtsnāni karmāṇi kṛntati cchinatti | ataḥ sarvameva karoti na kiṃcidvā karoti-ityupaniṣat || 18 ||
  - verse: 19
    devanagari: |-
      यस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः । ज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः ॥ ४-१९ ॥
      अत एव कामेषु-काम्यमानेषु फलेषु सङ्कल्पं विहाय क्रियमाणानि कर्माणि कथितकथयिष्यमाणस्वरूपे ज्ञानाग्नावनुप्रविश्य दह्यन्ते ॥ १९ ॥
    slp1: |-
      yasya sarve samAramBAH kAmasaNkalpavarjitAH . jYAnAgnidagDakarmARaM tamAhuH paRqitaM buDAH .. 4-19 ..
      ata eva kAmezu-kAmyamAnezu Palezu saNkalpaM vihAya kriyamARAni karmARi kaTitakaTayizyamARasvarUpe jYAnAgnAvanupraviSya dahyante .. 19 ..
    iast: |-
      yasya sarve samārambhāḥ kāmasaṅkalpavarjitāḥ | jñānāgnidagdhakarmāṇaṃ tamāhuḥ paṇḍitaṃ budhāḥ || 4-19 ||
      ata eva kāmeṣu-kāmyamāneṣu phaleṣu saṅkalpaṃ vihāya kriyamāṇāni karmāṇi kathitakathayiṣyamāṇasvarūpe jñānāgnāvanupraviśya dahyante || 19 ||
  - verse: 20
    devanagari: |-
      त्यक्त्वा कर्मफलासङ्गं नित्यतृप्तो निराश्रयः । कर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः ॥ ४-२० ॥
      अभिप्रवृत्तोऽपि-आभिमुख्येन प्रवृत्तोऽपि ॥ २० ॥
    slp1: |-
      tyaktvA karmaPalAsaNgaM nityatfpto nirASrayaH . karmaRyaBipravftto'pi nEva kiYcitkaroti saH .. 4-20 ..
      aBipravftto'pi-ABimuKyena pravftto'pi .. 20 ..
    iast: |-
      tyaktvā karmaphalāsaṅgaṃ nityatṛpto nirāśrayaḥ | karmaṇyabhipravṛtto'pi naiva kiñcitkaroti saḥ || 4-20 ||
      abhipravṛtto'pi-ābhimukhyena pravṛtto'pi || 20 ||
  - verse: 21
    devanagari: |-
      निराशीर्यतचित्तात्मा त्यक्तसर्वपरिग्रहः । शारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम् ॥ ४-२१ ॥
      शरीरोपयोगि इन्द्रियव्यापारात्मकं कर्म शारीरं यन्मनोबुद्धिभ्यां न तथानुरञ्जितम् ॥ २१ ॥
    slp1: |-
      nirASIryatacittAtmA tyaktasarvaparigrahaH . SArIraM kevalaM karma kurvannApnoti kilbizam .. 4-21 ..
      SarIropayogi indriyavyApArAtmakaM karma SArIraM yanmanobudDiByAM na taTAnuraYjitam .. 21 ..
    iast: |-
      nirāśīryatacittātmā tyaktasarvaparigrahaḥ | śārīraṃ kevalaṃ karma kurvannāpnoti kilbiṣam || 4-21 ||
      śarīropayogi indriyavyāpārātmakaṃ karma śārīraṃ yanmanobuddhibhyāṃ na tathānurañjitam || 21 ||
  - verse: 22
    devanagari: |-
      यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः । समः सिद्धावसिद्धौ च कृत्वाऽपि न निबध्यते ॥ ४-२२ ॥
      कर्मकर्तरि प्रयोगः स्वयमेव ह्यात्मा आत्मानं बध्नाति फलवासनाकालुष्यमुपाददान इत्यर्थः । अन्यथा जडानां कर्मणां बन्धने स्वातन्त्र्यं न तथा हृदयंगमम् ॥ २२ ॥
    slp1: |-
      yadfcCAlABasantuzwo dvandvAtIto vimatsaraH . samaH sidDAvasidDO ca kftvA'pi na nibaDyate .. 4-22 ..
      karmakartari prayogaH svayameva hyAtmA AtmAnaM baDnAti PalavAsanAkAluzyamupAdadAna ityarTaH . anyaTA jaqAnAM karmaRAM banDane svAtantryaM na taTA hfdayaMgamam .. 22 ..
    iast: |-
      yadṛcchālābhasantuṣṭo dvandvātīto vimatsaraḥ | samaḥ siddhāvasiddhau ca kṛtvā'pi na nibadhyate || 4-22 ||
      karmakartari prayogaḥ svayameva hyātmā ātmānaṃ badhnāti phalavāsanākāluṣyamupādadāna ityarthaḥ | anyathā jaḍānāṃ karmaṇāṃ bandhane svātantryaṃ na tathā hṛdayaṃgamam || 22 ||
  - verse: 23
    devanagari: |-
      गतसङ्गस्य मुक्तस्य ज्ञानावस्थितचेतसः । यज्ञायारभतः कर्म समग्रं प्रविलीयते ॥ ४-२३ ॥
      यज्ञायेति-जातावेकवचनम् । यज्ञाः-वक्ष्यमाणलक्षणाः ॥ २३ ॥
    slp1: |-
      gatasaNgasya muktasya jYAnAvasTitacetasaH . yajYAyAraBataH karma samagraM pravilIyate .. 4-23 ..
      yajYAyeti-jAtAvekavacanam . yajYAH-vakzyamARalakzaRAH .. 23 ..
    iast: |-
      gatasaṅgasya muktasya jñānāvasthitacetasaḥ | yajñāyārabhataḥ karma samagraṃ pravilīyate || 4-23 ||
      yajñāyeti-jātāvekavacanam | yajñāḥ-vakṣyamāṇalakṣaṇāḥ || 23 ||
  - verse: 24
    devanagari: |-
      यज्ञायेत्युक्तम्-तत्स्वरूपं सामान्यं तावदाह
      ब्रह्मार्पणं ब्रह्महविर्ब्रह्माग्नौ ब्रह्मणा हुतम् । ब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना ॥ ४-२४ ॥
      ब्रह्मण्यर्पणं-तत एव प्रवृत्तस्य पुनस्तत्रैवानुप्रवेशनं यस्य तत् । ब्रह्म-समग्रं विश्वात्मकं यदेतत् हविस्तत् । ब्रह्मणि-परमबोधे प्रशान्तेऽग्नौ । ब्रह्मणा-येनकेनचित्कर्मणा हुतं-तद्दीप्त्यभिवृद्धये समर्पितम् इतीदृशं ब्रह्मकर्मैव समाधिर्यस्य योगिनस्तेन ब्रह्मैव गन्तव्यं ज्ञेयं नान्यत्किंचिदन्याभावात् । यदिवा तदर्थेन यदर्थाक्षेपादेवंसंबन्धः-यत्खलु ब्रह्मस्वरूपेण यजमानेन ब्रह्माग्नौ ब्रह्महविर्हुतं ब्रह्मणि ब्रह्मस्वभावदेवतोद्देशेनार्पणं यस्य तदेवं भूतं यद्ब्रह्मकर्म तदेव समाधिरात्मस्वरूपलाभोपायत्वात् तेन-ब्रह्मकर्मसमाधिना नान्यत्फलमवाप्यते अपितु ब्रह्मैवेति ये यथा मां प्रपद्यन्ते-इति हि निर्वाहितम् । मितस्वरूपी-कृतमदात्मकयज्ञस्वभावा इति तादृशफलभागिनः-इत्युक्तम् । अपरिमितपरिपूर्णमदात्मकयज्ञस्वरूपवेदिनस्तु कथं परिमितफललवलाम्पट्यभागिनो भवेयुरिति तात्पर्यम् । इत्यनेन । श्लोकेन वक्ष्यमाणैश्च श्लोकेः परमरहस्यमुपनिबद्धम् । तच्चास्माभिर्मितबुद्धिभिरपि यथाबुद्धि यथागुर्वाम्नायं च विवृतम् । मुखसंप्रदायक्रममन्तरेण नैतत् नभश्चित्रमिव चित्तमुपारोहतीति न वयमुपालम्भनीयाः । अत्र हविषोऽग्नेः करणानां च स्रुगादीनां क्रियायाश्च ब्रह्मविशेषणत्वमिति कैश्चिदुक्तं तदुपेक्ष्यमेव-तेषां रहस्यसंप्रदायक्रमेऽक्षुणत्वात् ॥ २४ ॥
