  - verse: 59
    devanagari: |-
      यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे । मिथ्यैप व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति ॥ १८-५९ ॥
    slp1: |-
      yadahaNkAramASritya na yotsya iti manyase . miTyEpa vyavasAyaste prakftistvAM niyokzyati .. 18-59 ..
    iast: |-
      yadahaṅkāramāśritya na yotsya iti manyase | mithyaipa vyavasāyaste prakṛtistvāṃ niyokṣyati || 18-59 ||
  - verse: 60
    devanagari: |-
      स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा । कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत् ॥ १८-६० ॥
      ब्राह्मणादीनां कर्मप्रविभागनिरूपणस्य स्वभावोऽवश्यं नातिक्रामतीति क्षत्रियस्वभावस्य भवतोऽनिच्छतोऽपि प्रकृतिः स्वभावाख्या नियोक्तृतामव्यभिचारेण भजते । केवलं तया नियुक्तस्य पुण्यपापसंबन्धः । अतो मदभिहितविज्ञानप्रमाणपुरःसरीकारेण कर्माण्यनुतिष्ठ । तथा सति बन्धो निवर्त्स्यति । इत्यस्यार्थस्य परिकरबन्धघटनतात्पर्यं महावाक्यार्थस्य । अवान्तरवाक्यानां स्पष्टार्थः । समासेन संक्षेपेण ज्ञानस्य प्रागुक्तस्य । निष्ठां वाग्जालपरिहारेण निश्चितामाह-बुद्ध्या विशुद्धया-इत्यादि । सर्वमेतद्व्याख्यातप्रायमिति न पुनरायस्यते ॥ ६० ॥
    slp1: |-
      svaBAvajena kOnteya nibadDaH svena karmaRA . kartuM necCasi yanmohAtkarizyasyavaSo'pi tat .. 18-60 ..
      brAhmaRAdInAM karmapraviBAganirUpaRasya svaBAvo'vaSyaM nAtikrAmatIti kzatriyasvaBAvasya Bavato'nicCato'pi prakftiH svaBAvAKyA niyoktftAmavyaBicAreRa Bajate . kevalaM tayA niyuktasya puRyapApasaMbanDaH . ato madaBihitavijYAnapramARapuraHsarIkAreRa karmARyanutizWa . taTA sati banDo nivartsyati . ityasyArTasya parikarabanDaGawanatAtparyaM mahAvAkyArTasya . avAntaravAkyAnAM spazwArTaH . samAsena saMkzepeRa jYAnasya prAguktasya . nizWAM vAgjAlaparihAreRa niScitAmAha-budDyA viSudDayA-ityAdi . sarvametadvyAKyAtaprAyamiti na punarAyasyate .. 60 ..
    iast: |-
      svabhāvajena kaunteya nibaddhaḥ svena karmaṇā | kartuṃ necchasi yanmohātkariṣyasyavaśo'pi tat || 18-60 ||
      brāhmaṇādīnāṃ karmapravibhāganirūpaṇasya svabhāvo'vaśyaṃ nātikrāmatīti kṣatriyasvabhāvasya bhavato'nicchato'pi prakṛtiḥ svabhāvākhyā niyoktṛtāmavyabhicāreṇa bhajate | kevalaṃ tayā niyuktasya puṇyapāpasaṃbandhaḥ | ato madabhihitavijñānapramāṇapuraḥsarīkāreṇa karmāṇyanutiṣṭha | tathā sati bandho nivartsyati | ityasyārthasya parikarabandhaghaṭanatātparyaṃ mahāvākyārthasya | avāntaravākyānāṃ spaṣṭārthaḥ | samāsena saṃkṣepeṇa jñānasya prāguktasya | niṣṭhāṃ vāgjālaparihāreṇa niścitāmāha-buddhyā viśuddhayā-ityādi | sarvametadvyākhyātaprāyamiti na punarāyasyate || 60 ||
  - verse: 61
    devanagari: |-
      ईश्वरः सर्वभूतानां हृद्येष वसतेऽर्जुन । भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया ॥ १८-६१ ॥
    slp1: |-
      ISvaraH sarvaBUtAnAM hfdyeza vasate'rjuna . BrAmayansarvaBUtAni yantrArUQAni mAyayA .. 18-61 ..
    iast: |-
      īśvaraḥ sarvabhūtānāṃ hṛdyeṣa vasate'rjuna | bhrāmayansarvabhūtāni yantrārūḍhāni māyayā || 18-61 ||
  - verse: 62
    devanagari: |-
      तमेव शरणं गच्छ सर्वभावेन भारत । तत्प्रसादात्परां सिदिं स्थानं प्राप्स्यसि शाश्वतम् ॥ १८-६२ ॥
      एष ईश्वरः परमात्मावश्यं शरणत्वेन ग्राह्यः । तत्र ह्यधिष्ठातरि कर्तरि बोद्धरि स्वात्ममये विमृष्टे न कर्माणि स्थितिभाञ्जि भवन्ति । नहि निशिततरनखरकोटिविदारितसमदकरिकरटगलितमुक्ताफलनिकर परिकर-प्रकाशितप्रतापमहसि सिंहकिशोरके गुहामधितिष्ठति चपलमनसो विद्रवणमात्रबलशालिनो हिरणपोतकाः स्वैरं स्वव्यापारपरिशीलनापटुभावमवलम्बन्ते इति । तमेव शरणं गच्छ-इत्युपक्रम्य मत्प्रसादात्-इति निर्वाहवाक्यमभिदधद्भगवान् परमात्मानमीश्वरं वासुदेवं चैकतया योजयतीति ॥ ६२ ॥
    slp1: |-
      tameva SaraRaM gacCa sarvaBAvena BArata . tatprasAdAtparAM sidiM sTAnaM prApsyasi SASvatam .. 18-62 ..
      eza ISvaraH paramAtmAvaSyaM SaraRatvena grAhyaH . tatra hyaDizWAtari kartari bodDari svAtmamaye vimfzwe na karmARi sTitiBAYji Bavanti . nahi niSitataranaKarakowividAritasamadakarikarawagalitamuktAPalanikara parikara-prakASitapratApamahasi siMhakiSorake guhAmaDitizWati capalamanaso vidravaRamAtrabalaSAlino hiraRapotakAH svEraM svavyApArapariSIlanApawuBAvamavalambante iti . tameva SaraRaM gacCa-ityupakramya matprasAdAt-iti nirvAhavAkyamaBidaDadBagavAn paramAtmAnamISvaraM vAsudevaM cEkatayA yojayatIti .. 62 ..
    iast: |-
      tameva śaraṇaṃ gaccha sarvabhāvena bhārata | tatprasādātparāṃ sidiṃ sthānaṃ prāpsyasi śāśvatam || 18-62 ||
      eṣa īśvaraḥ paramātmāvaśyaṃ śaraṇatvena grāhyaḥ | tatra hyadhiṣṭhātari kartari boddhari svātmamaye vimṛṣṭe na karmāṇi sthitibhāñji bhavanti | nahi niśitataranakharakoṭividāritasamadakarikaraṭagalitamuktāphalanikara parikara-prakāśitapratāpamahasi siṃhakiśorake guhāmadhitiṣṭhati capalamanaso vidravaṇamātrabalaśālino hiraṇapotakāḥ svairaṃ svavyāpārapariśīlanāpaṭubhāvamavalambante iti | tameva śaraṇaṃ gaccha-ityupakramya matprasādāt-iti nirvāhavākyamabhidadhadbhagavān paramātmānamīśvaraṃ vāsudevaṃ caikatayā yojayatīti || 62 ||
  - verse: 63
    devanagari: |-
      इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया । विमृश्यैतदशेषेण यथेच्छसि तथा कुरु ॥ १८-६३ ॥
      तदेवेदं ज्ञानमुक्तम् । गुह्यात्-वेदान्तादपि गुह्यम्-परमाद्वैतप्रकाशनात् । एतच्चाशेषेण विमृश्येति-तात्पर्यमत्र विचार्येत्यर्थः । तच्च तात्पर्यं यथावसरमस्माभिः शृङ्ग्राहिकयैव प्रकाशितं यद्यपि तथापि स्फुटमशेषविमर्शनं प्रदर्श्यते-उपादेयतमं ह्यदः । नास्मिन्निरूप्यमाणे श्रूयमाणे वा मतिस्तृप्यति ॥ ६३ ॥
    slp1: |-
      iti te jYAnamAKyAtaM guhyAdguhyataraM mayA . vimfSyEtadaSezeRa yaTecCasi taTA kuru .. 18-63 ..
      tadevedaM jYAnamuktam . guhyAt-vedAntAdapi guhyam-paramAdvEtaprakASanAt . etaccASezeRa vimfSyeti-tAtparyamatra vicAryetyarTaH . tacca tAtparyaM yaTAvasaramasmABiH SfNgrAhikayEva prakASitaM yadyapi taTApi sPuwamaSezavimarSanaM pradarSyate-upAdeyatamaM hyadaH . nAsminnirUpyamARe SrUyamARe vA matistfpyati .. 63 ..
    iast: |-
      iti te jñānamākhyātaṃ guhyādguhyataraṃ mayā | vimṛśyaitadaśeṣeṇa yathecchasi tathā kuru || 18-63 ||
      tadevedaṃ jñānamuktam | guhyāt-vedāntādapi guhyam-paramādvaitaprakāśanāt | etaccāśeṣeṇa vimṛśyeti-tātparyamatra vicāryetyarthaḥ | tacca tātparyaṃ yathāvasaramasmābhiḥ śṛṅgrāhikayaiva prakāśitaṃ yadyapi tathāpi sphuṭamaśeṣavimarśanaṃ pradarśyate-upādeyatamaṃ hyadaḥ | nāsminnirūpyamāṇe śrūyamāṇe vā matistṛpyati || 63 ||
  - verse: 64
    devanagari: |-
      गुह्यतमं यदत्र निश्चितम् तज्ज्ञानमिदानीं शृणु-इत्याह
      सर्वगुह्यतमं भूयः शृणु मे परमं वचः । इष्टोऽसि मे दृढमतिस्ततो वक्ष्यामि ते हितम् ॥ १८-६४ ॥
    slp1: |-
      guhyatamaM yadatra niScitam tajjYAnamidAnIM SfRu-ityAha
      sarvaguhyatamaM BUyaH SfRu me paramaM vacaH . izwo'si me dfQamatistato vakzyAmi te hitam .. 18-64 ..
    iast: |-
      guhyatamaṃ yadatra niścitam tajjñānamidānīṃ śṛṇu-ityāha
      sarvaguhyatamaṃ bhūyaḥ śṛṇu me paramaṃ vacaḥ | iṣṭo'si me dṛḍhamatistato vakṣyāmi te hitam || 18-64 ||
  - verse: 65
    devanagari: |-
      मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु । मामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे ॥ १८-६५ ॥
      मन्मना भव-इत्यादिना शास्त्रे ब्रह्मार्पण एव सर्वथा प्राधान्यम्-इति निश्चितम् । ब्रह्मार्पणकारिणः शास्त्रमिदमर्थवदित्युक्तम् ॥ १८-६५ ॥
    slp1: |-
      manmanA Bava madBakto madyAjI mAM namaskuru . mAmevEzyasi satyaM te pratijAne priyo'si me .. 18-65 ..
      manmanA Bava-ityAdinA SAstre brahmArpaRa eva sarvaTA prADAnyam-iti niScitam . brahmArpaRakAriRaH SAstramidamarTavadityuktam .. 18-65 ..
    iast: |-
      manmanā bhava madbhakto madyājī māṃ namaskuru | māmevaiṣyasi satyaṃ te pratijāne priyo'si me || 18-65 ||
      manmanā bhava-ityādinā śāstre brahmārpaṇa eva sarvathā prādhānyam-iti niścitam | brahmārpaṇakāriṇaḥ śāstramidamarthavadityuktam || 18-65 ||
  - verse: 66
    devanagari: |-
      आह च-
      सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज । अहं त्वां सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः ॥ १८-६६ ॥
      सर्वधर्मानिति । यदिदं युद्धकरणे प्रासङ्गिकबन्धुवधादि तस्य सर्वस्याहं कर्ता-इत्यात्मधर्मतां परित्यज्य-तथाचार्यादिहननक्रियानिषेधे मम धर्मो भविष्यति-इति मनसा विहाय । मामेवैकं सर्वकर्तारं परमेश्वरं स्वतन्त्रं शरणं सर्वस्वभावाधिष्ठायकतया व्रज । अत एवाहं सर्वज्ञः सर्वेभ्यः पापेभ्यस्त्वां मोक्षयिष्यामीति । मा शुचः-किंकर्तव्यतामोहं मा गाः ॥ ६६ ॥
    slp1: |-
      Aha ca-
      sarvaDarmAnparityajya mAmekaM SaraRaM vraja . ahaM tvAM sarvapApeByo mokzayizyAmi mA SucaH .. 18-66 ..
      sarvaDarmAniti . yadidaM yudDakaraRe prAsaNgikabanDuvaDAdi tasya sarvasyAhaM kartA-ityAtmaDarmatAM parityajya-taTAcAryAdihananakriyAnizeDe mama Darmo Bavizyati-iti manasA vihAya . mAmevEkaM sarvakartAraM parameSvaraM svatantraM SaraRaM sarvasvaBAvADizWAyakatayA vraja . ata evAhaM sarvajYaH sarveByaH pApeByastvAM mokzayizyAmIti . mA SucaH-kiMkartavyatAmohaM mA gAH .. 66 ..
    iast: |-
      āha ca-
      sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja | ahaṃ tvāṃ sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ || 18-66 ||
      sarvadharmāniti | yadidaṃ yuddhakaraṇe prāsaṅgikabandhuvadhādi tasya sarvasyāhaṃ kartā-ityātmadharmatāṃ parityajya-tathācāryādihananakriyāniṣedhe mama dharmo bhaviṣyati-iti manasā vihāya | māmevaikaṃ sarvakartāraṃ parameśvaraṃ svatantraṃ śaraṇaṃ sarvasvabhāvādhiṣṭhāyakatayā vraja | ata evāhaṃ sarvajñaḥ sarvebhyaḥ pāpebhyastvāṃ mokṣayiṣyāmīti | mā śucaḥ-kiṃkartavyatāmohaṃ mā gāḥ || 66 ||
  - verse: 67
    devanagari: |-
      इदं ते नातपस्काय नाभक्ताय कदाचन । न चाशुश्रूषवे वाच्यं न च मां योऽभ्यसूयति ॥ १८-६७ ॥
      इति । एवमुभयथापि भगवत्यसूयैवानादर इत्यर्थः ॥ ६७ ॥
    slp1: |-
      idaM te nAtapaskAya nABaktAya kadAcana . na cASuSrUzave vAcyaM na ca mAM yo'ByasUyati .. 18-67 ..
      iti . evamuBayaTApi BagavatyasUyEvAnAdara ityarTaH .. 67 ..
    iast: |-
      idaṃ te nātapaskāya nābhaktāya kadācana | na cāśuśrūṣave vācyaṃ na ca māṃ yo'bhyasūyati || 18-67 ||
      iti | evamubhayathāpi bhagavatyasūyaivānādara ityarthaḥ || 67 ||
  - verse: 68
    devanagari: |-
      य इदं परमं गुह्यं मद्भक्तेष्वभिधास्यति । भक्तिं मयि परां कृत्वा मामेवैष्यत्यसंशयः ॥ १८-६८ ॥
      भक्तिमिति-एतदेव मयि भक्तिकरणं यद्भक्तेष्वेतन्निरूपणम् । अभिधास्यति-आभिमुख्येन शास्त्रोक्तप्रक्रियया धास्यति-वितरिष्यति । स मन्मयतामेतीति विधिरेवैष नार्थवादः । एवमन्यत्र ॥ ६८ ॥
    slp1: |-
      ya idaM paramaM guhyaM madBaktezvaBiDAsyati . BaktiM mayi parAM kftvA mAmevEzyatyasaMSayaH .. 18-68 ..
      Baktimiti-etadeva mayi BaktikaraRaM yadBaktezvetannirUpaRam . aBiDAsyati-ABimuKyena SAstroktaprakriyayA DAsyati-vitarizyati . sa manmayatAmetIti viDirevEza nArTavAdaH . evamanyatra .. 68 ..
    iast: |-
      ya idaṃ paramaṃ guhyaṃ madbhakteṣvabhidhāsyati | bhaktiṃ mayi parāṃ kṛtvā māmevaiṣyatyasaṃśayaḥ || 18-68 ||
      bhaktimiti-etadeva mayi bhaktikaraṇaṃ yadbhakteṣvetannirūpaṇam | abhidhāsyati-ābhimukhyena śāstroktaprakriyayā dhāsyati-vitariṣyati | sa manmayatāmetīti vidhirevaiṣa nārthavādaḥ | evamanyatra || 68 ||
  - verse: 69
    devanagari: |-
      न च तस्मान्मनुष्येषु कश्चिन्मे प्रियकृत्तमः । भविता न च मे तस्मादन्यः प्रियतरो भुवि ॥ १८-६९ ॥
    slp1: |-
      na ca tasmAnmanuzyezu kaScinme priyakfttamaH . BavitA na ca me tasmAdanyaH priyataro Buvi .. 18-69 ..
    iast: |-
      na ca tasmānmanuṣyeṣu kaścinme priyakṛttamaḥ | bhavitā na ca me tasmādanyaḥ priyataro bhuvi || 18-69 ||
  - verse: 70
    devanagari: |-
      अध्येष्यते च य इमं धर्म्यं संवादमावयोः । ज्ञानयज्ञेन तेनाहमिष्टः स्यामिति मे मतिः ॥ १८-७० ॥
    slp1: |-
      aDyezyate ca ya imaM DarmyaM saMvAdamAvayoH . jYAnayajYena tenAhamizwaH syAmiti me matiH .. 18-70 ..
    iast: |-
      adhyeṣyate ca ya imaṃ dharmyaṃ saṃvādamāvayoḥ | jñānayajñena tenāhamiṣṭaḥ syāmiti me matiḥ || 18-70 ||
  - verse: 71
    devanagari: |-
      श्रद्धावाननसूयश्च शृणुयादपि यो नरः । सोऽपि मुक्तः शुभांल्लोकान्प्राप्नुयात्पुण्यकर्मणाम् ॥ १८-७१ ॥
    slp1: |-
      SradDAvAnanasUyaSca SfRuyAdapi yo naraH . so'pi muktaH SuBAMllokAnprApnuyAtpuRyakarmaRAm .. 18-71 ..
    iast: |-
      śraddhāvānanasūyaśca śṛṇuyādapi yo naraḥ | so'pi muktaḥ śubhāṃllokānprāpnuyātpuṇyakarmaṇām || 18-71 ||
  - verse: 72
    devanagari: |-
      कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा । कच्चिदज्ञानसम्मोहः प्रनष्टस्ते धनञ्जय ॥ १८-७२ ॥
    slp1: |-
      kaccidetacCrutaM pArTa tvayEkAgreRa cetasA . kaccidajYAnasammohaH pranazwaste DanaYjaya .. 18-72 ..
    iast: |-
      kaccidetacchrutaṃ pārtha tvayaikāgreṇa cetasā | kaccidajñānasammohaḥ pranaṣṭaste dhanañjaya || 18-72 ||
  - verse: 73
    devanagari: |-
      अर्जुन उवाच
      नष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाऽच्युत । स्थितोऽस्मि गतसन्देहः करिष्ये वचनं तव ॥ १८-७३ ॥
      नष्टो मोहः-इत्यादिना युद्धप्रवृत्तिस्तावदर्जुनस्योत्पन्ना नतु सम्यग्ब्रह्म-वित्त्वं जातम्-इति सूचयन्भाविनोऽनुगीतार्थस्यावकाशं ददाति ॥ ७३ ॥
    slp1: |-
      arjuna uvAca
      nazwo mohaH smftirlabDA tvatprasAdAnmayA'cyuta . sTito'smi gatasandehaH karizye vacanaM tava .. 18-73 ..
      nazwo mohaH-ityAdinA yudDapravfttistAvadarjunasyotpannA natu samyagbrahma-vittvaM jAtam-iti sUcayanBAvino'nugItArTasyAvakASaM dadAti .. 73 ..
    iast: |-
      arjuna uvāca
      naṣṭo mohaḥ smṛtirlabdhā tvatprasādānmayā'cyuta | sthito'smi gatasandehaḥ kariṣye vacanaṃ tava || 18-73 ||
      naṣṭo mohaḥ-ityādinā yuddhapravṛttistāvadarjunasyotpannā natu samyagbrahma-vittvaṃ jātam-iti sūcayanbhāvino'nugītārthasyāvakāśaṃ dadāti || 73 ||
  - verse: 74
    devanagari: |-
      सञ्जय उवाच
      इत्यहं वासुदेवस्य पार्थस्य च महात्मनः । संवादमिममश्रौषमद्भुतं रोमहर्षणम् ॥ १८-७४ ॥
    slp1: |-
      saYjaya uvAca
      ityahaM vAsudevasya pArTasya ca mahAtmanaH . saMvAdamimamaSrOzamadButaM romaharzaRam .. 18-74 ..
    iast: |-
      sañjaya uvāca
      ityahaṃ vāsudevasya pārthasya ca mahātmanaḥ | saṃvādamimamaśrauṣamadbhutaṃ romaharṣaṇam || 18-74 ||
  - verse: 75
    devanagari: |-
      व्यासप्रसादाच्छ्रुतवानेतद्गुह्यतरं महत् । योगं योगीश्वरात्कृष्णात्साक्षात्कथयतः स्वयम् ॥ १८-७५ ॥
    slp1: |-
      vyAsaprasAdAcCrutavAnetadguhyataraM mahat . yogaM yogISvarAtkfzRAtsAkzAtkaTayataH svayam .. 18-75 ..
    iast: |-
      vyāsaprasādācchrutavānetadguhyataraṃ mahat | yogaṃ yogīśvarātkṛṣṇātsākṣātkathayataḥ svayam || 18-75 ||
  - verse: 76
    devanagari: |-
      राजन् संस्मृत्य संस्मृत्य संवादमिममद्भुतम् । केशवार्जुनयोः पुण्यं हृष्यामि च पुनः पुनः ॥ १८-७६ ॥
    slp1: |-
      rAjan saMsmftya saMsmftya saMvAdamimamadButam . keSavArjunayoH puRyaM hfzyAmi ca punaH punaH .. 18-76 ..
    iast: |-
      rājan saṃsmṛtya saṃsmṛtya saṃvādamimamadbhutam | keśavārjunayoḥ puṇyaṃ hṛṣyāmi ca punaḥ punaḥ || 18-76 ||
  - verse: 77
    devanagari: |-
      तच्च संस्मृत्य संस्मृत्य रूपमत्युद्भुतं हरेः । विस्मयो मे महाराज प्रहृष्ये च पुनः पुनः ॥ १८-७७ ॥
    slp1: |-
      tacca saMsmftya saMsmftya rUpamatyudButaM hareH . vismayo me mahArAja prahfzye ca punaH punaH .. 18-77 ..
    iast: |-
      tacca saṃsmṛtya saṃsmṛtya rūpamatyudbhutaṃ hareḥ | vismayo me mahārāja prahṛṣye ca punaḥ punaḥ || 18-77 ||
  - verse: 78
    devanagari: |-
      यत्र योगीश्वरः कृष्णो यत्र पार्थो धनुर्धरः । तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम ॥ १८-७८ ॥
      संजयवचनेन संवादमुपसंहरन्नेतदर्थस्य गाढप्रबन्धक्रमेण निरन्तरचिन्तासन्तानोपकृतनैर्यन्तर्यादेव चान्ते सुपरिस्फुटनिर्विकल्पानुभवरूपतामापाद्यमानं स्मरणमात्रमेव परब्रह्मप्रदायकम्-इत्युच्यते । एवं भगवदर्जुनसंवादमात्रस्मरणादेव तत्त्वावाप्त्या श्रीविजयविभूतय इति शिवम् ॥ ७८ ॥
    slp1: |-
      yatra yogISvaraH kfzRo yatra pArTo DanurDaraH . tatra SrIrvijayo BUtirDruvA nItirmatirmama .. 18-78 ..
      saMjayavacanena saMvAdamupasaMharannetadarTasya gAQaprabanDakrameRa nirantaracintAsantAnopakftanEryantaryAdeva cAnte suparisPuwanirvikalpAnuBavarUpatAmApAdyamAnaM smaraRamAtrameva parabrahmapradAyakam-ityucyate . evaM BagavadarjunasaMvAdamAtrasmaraRAdeva tattvAvAptyA SrIvijayaviBUtaya iti Sivam .. 78 ..
    iast: |-
      yatra yogīśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ | tatra śrīrvijayo bhūtirdhruvā nītirmatirmama || 18-78 ||
      saṃjayavacanena saṃvādamupasaṃharannetadarthasya gāḍhaprabandhakrameṇa nirantaracintāsantānopakṛtanairyantaryādeva cānte suparisphuṭanirvikalpānubhavarūpatāmāpādyamānaṃ smaraṇamātrameva parabrahmapradāyakam-ityucyate | evaṃ bhagavadarjunasaṃvādamātrasmaraṇādeva tattvāvāptyā śrīvijayavibhūtaya iti śivam || 78 ||
  - verse: 1000
    devanagari: |-
      भङ्क्त्वा ज्ञानविमोहमन्थरमयीं सत्त्वादिभिन्नां धियं प्राप्य स्वात्मविभूतसुन्दरतया विष्णुं विकल्पातिगम् । यक्तिंचित्स्वरसोद्यदिन्द्रियनिजव्यापारमात्रस्थिते- र्हेलातः कुरुते तदस्य सकलं संपद्यते शङ्करम् ॥ १८ ॥
    slp1: |-
      BaNktvA jYAnavimohamanTaramayIM sattvAdiBinnAM DiyaM prApya svAtmaviBUtasundaratayA vizRuM vikalpAtigam . yaktiMcitsvarasodyadindriyanijavyApAramAtrasTite- rhelAtaH kurute tadasya sakalaM saMpadyate SaNkaram .. 18 ..
    iast: |-
      bhaṅktvā jñānavimohamantharamayīṃ sattvādibhinnāṃ dhiyaṃ prāpya svātmavibhūtasundaratayā viṣṇuṃ vikalpātigam | yaktiṃcitsvarasodyadindriyanijavyāpāramātrasthite- rhelātaḥ kurute tadasya sakalaṃ saṃpadyate śaṅkaram || 18 ||
  - verse: 2001
    devanagari: |-
      श्रीमान्कात्यायनोऽभूद्वररुचिसदृशः प्रस्फुरद्बोधतृप्त-स्तद्वंशालङ्कृतो यः स्थिरमतिरभवत्सौशुकाख्योऽतिविद्वान् । विप्रः श्री भूतिराजस्तदनु समभवत्तस्य सूनुर्महात्मा येनामी सर्वलोकास्तमसि निपतिताः प्रोद्धृता भानुनेव ॥ १ ॥
    slp1: |-
      SrImAnkAtyAyano'BUdvararucisadfSaH prasPuradboDatfpta-stadvaMSAlaNkfto yaH sTiramatiraBavatsOSukAKyo'tividvAn . vipraH SrI BUtirAjastadanu samaBavattasya sUnurmahAtmA yenAmI sarvalokAstamasi nipatitAH prodDftA BAnuneva .. 1 ..
    iast: |-
      śrīmānkātyāyano'bhūdvararucisadṛśaḥ prasphuradbodhatṛpta-stadvaṃśālaṅkṛto yaḥ sthiramatirabhavatsauśukākhyo'tividvān | vipraḥ śrī bhūtirājastadanu samabhavattasya sūnurmahātmā yenāmī sarvalokāstamasi nipatitāḥ proddhṛtā bhānuneva || 1 ||
  - verse: 2002
    devanagari: |-
      तच्चरणकमलमधुपो भगवद्गीतार्थसंग्रहं व्यदधात् । अभिनवगुप्तः सद्दिवजलोटककृतचोदनावशतः ॥ २ ॥
    slp1: |-
      taccaraRakamalamaDupo BagavadgItArTasaMgrahaM vyadaDAt . aBinavaguptaH saddivajalowakakftacodanAvaSataH .. 2 ..
    iast: |-
      taccaraṇakamalamadhupo bhagavadgītārthasaṃgrahaṃ vyadadhāt | abhinavaguptaḥ saddivajaloṭakakṛtacodanāvaśataḥ || 2 ||
  - verse: 2003
    devanagari: |-
      अत इदमयथार्थं वा यथार्थमपि सर्वथा नैव । विदुषामसूयनीयं कृत्यमिदं बान्धवार्थं हि ॥ ३ ॥
    slp1: |-
      ata idamayaTArTaM vA yaTArTamapi sarvaTA nEva . viduzAmasUyanIyaM kftyamidaM bAnDavArTaM hi .. 3 ..
    iast: |-
      ata idamayathārthaṃ vā yathārthamapi sarvathā naiva | viduṣāmasūyanīyaṃ kṛtyamidaṃ bāndhavārthaṃ hi || 3 ||
  - verse: 2004
    devanagari: |-
      अभिनवरूपा शक्तिस्तद्गुप्तो यो महेश्वरो देवः । तदुभययामलरूपमभिनवगुप्तं शिवं वन्दे ॥ ४ ॥
    slp1: |-
      aBinavarUpA Saktistadgupto yo maheSvaro devaH . taduBayayAmalarUpamaBinavaguptaM SivaM vande .. 4 ..
    iast: |-
      abhinavarūpā śaktistadgupto yo maheśvaro devaḥ | tadubhayayāmalarūpamabhinavaguptaṃ śivaṃ vande || 4 ||
  - verse: 2005
    devanagari: |-
      परिपूर्णोऽयं श्रीमद्भगवद्गीतार्थसंग्रहः । कृतिस्त्रिनयनचरणसरोरुह चिन्तनलब्धप्रसिद्धेरभिनवगुप्तस्येति शिवम् ॥
    slp1: |-
      paripUrRo'yaM SrImadBagavadgItArTasaMgrahaH . kftistrinayanacaraRasaroruha cintanalabDaprasidDeraBinavaguptasyeti Sivam ..
    iast: |-
      paripūrṇo'yaṃ śrīmadbhagavadgītārthasaṃgrahaḥ | kṛtistrinayanacaraṇasaroruha cintanalabdhaprasiddherabhinavaguptasyeti śivam ||
