  - verse: 29
    devanagari: |-
      ते च सर्वान्-इन्द्रियव्यापारान्मानसान् मुखनासिकानिर्गमनमूत्राद्यधोनयनादीन्वायवीयांश्च आत्मनो-मनसः संयमहेतौ योगनाम्न्यैकाग्र्यवह्नौ सम्यक् ज्ञानपरिदीपिते पूरयितव्ये निवेशयन्ति-गृह्यमाणं विषयं संकल्प्यमानं वा तदेकाग्रतयैव परित्यक्तान्यव्यापारतया बुद्धा गृह्णन्तीति तात्पर्यम् । यदुक्तं शिवोपनिषदि-
      भावेऽत्यक्ते निरुद्धा चिन्नैव भावान्तरं व्रजेत् । तदा तन्मयभावेन विकसत्यतिभावना ॥ (वि० भै० ६२ श्लो०)
      इति । एवं योगयज्ञा व्याख्याताः ॥ २७ ॥
      एवं द्रव्ययज्ञस्तपोयज्ञो योगयज्ञश्चोक्तलक्षणाः । स्वाध्यायज्ञानयज्ञाश्च ये- ते संप्रति लक्ष्यन्ते-
      अपाने जुह्वति प्राणं प्राणेऽपानं तथाऽपरे । प्राणापानगती रुद्ध्वा प्राणायामपरायणाः ॥ ४-२९ ॥
