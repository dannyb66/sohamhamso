  - verse: 2
    devanagari: स्वेच्छया स्वभित्तौ विश्वमुन्मीलयति ॥२॥
    slp1: "svecCayA svaBittO vizvamunmIlayati"
    iast: "svecchayā svabhittau viśvam unmīlayati"
    meter: sūtra
    word_glosses:
    - word: स्व-इच्छया
      iast: sva-icchayā
      gloss_en: by her own will
      morph: inst. sg. f.
      gloss_as: নিজৰ ইচ্ছাৰে
      gloss_bn: আপন ইচ্ছায়
      gloss_gu: પોતાની ઇચ્છાથી
      gloss_hi: अपनी इच्छा से
      gloss_kn: ಸ್ವ-ಇಚ್ಛೆಯಿಂದ — ತನ್ನದೇ ಇಚ್ಛೆಯಿಂದ
      gloss_ml: സ്വ-ഇച്ഛയാ — സ്വന്തം ഇച്ഛയാൽ
      gloss_mr: स्वतःच्या इच्छेने
      gloss_or: ନିଜ ଇଚ୍ଛାରେ
      gloss_pa: ਆਪਣੀ ਇੱਛਾ ਨਾਲ
      gloss_ta: தனது சுய இச்சையினால்
      gloss_te: తన స్వంత ఇచ్ఛచేత
    - word: स्व-भित्तौ
      iast: sva-bhittau
      gloss_en: on her own canvas (screen of the Self)
      morph: loc. sg. f.
      gloss_as: নিজৰ ভিত্তিত (আত্মৰূপ পৰ্দাত)
      gloss_bn: আপন ভিত্তিতে (স্বরূপের পটে)
      gloss_gu: પોતાની ભીંત પર (આત્મારૂપી પટ ઉપર)
      gloss_hi: अपनी ही भित्ति (आत्म-रूप पट) पर
      gloss_kn: ಸ್ವ-ಭಿತ್ತಿಯಲ್ಲಿ — ತನ್ನದೇ ಭಿತ್ತಿಯ (ಆತ್ಮನ ಪರದೆಯ) ಮೇಲೆ
      gloss_ml: സ്വ-ഭിത്തൗ — സ്വന്തം ഭിത്തിയിൽ (ആത്മപടത്തിൽ)
      gloss_mr: स्वतःच्या पटावर (स्व-स्वरूपाच्या पडद्यावर)
      gloss_or: ନିଜ ଭିତ୍ତି (ଆତ୍ମରୂପୀ ପଟ) ଉପରେ
      gloss_pa: ਆਪਣੀ ਹੀ ਭਿੱਤੀ (ਪਟ) ਉੱਤੇ — ਸਵੈ ਦੇ ਪਰਦੇ ਉੱਤੇ
      gloss_ta: தனது சுய திரையின் மீது (சுயத்தின் சுவரில்)
      gloss_te: తన స్వంత తెరపై (ఆత్మ యొక్క భిత్తిపై)
    - word: विश्वम्
      iast: viśvam
      gloss_en: the universe
      morph: acc. sg. n.
      gloss_as: বিশ্বক
      gloss_bn: বিশ্বকে
      gloss_gu: વિશ્વને
      gloss_hi: विश्व को
      gloss_kn: ವಿಶ್ವವನ್ನು — ಜಗತ್ತನ್ನು
      gloss_ml: വിശ്വം — പ്രപഞ്ചത്തെ
      gloss_mr: विश्वाला
      gloss_or: ବିଶ୍ୱକୁ
      gloss_pa: ਵਿਸ਼ਵ ਨੂੰ
      gloss_ta: பிரபஞ்சத்தை
      gloss_te: విశ్వమును
    - word: उन्मीलयति
      iast: unmīlayati
      gloss_en: unfolds, makes manifest (lit. 'opens out')
      morph: 3sg. pres. caus. √mīl
      gloss_as: উন্মীলন কৰে, প্ৰকটিত কৰে
      gloss_bn: উন্মীলিত করেন, প্রকাশ করেন (আক্ষরিক — উন্মুক্ত করেন)
      gloss_gu: ઉન્મીલિત કરે છે, ખોલી દેખાડે છે (પ્રગટ કરે છે)
      gloss_hi: उन्मीलित करती है, प्रकट करती है (शाब्दिक — 'खोलती है')
      gloss_kn: ಉನ್ಮೀಲಯತಿ — ಅನಾವರಣಗೊಳಿಸುತ್ತಾಳೆ, ಪ್ರಕಟಪಡಿಸುತ್ತಾಳೆ (ಅಕ್ಷರಶಃ 'ಅರಳಿಸುತ್ತಾಳೆ')
      gloss_ml: "ഉന്മീലയതി — വിടർത്തുന്നു, പ്രകടമാക്കുന്നു (അക്ഷരാർഥം: 'തുറന്നു കാട്ടുന്നു')"
      gloss_mr: उलगडते, प्रकट करते (शब्दशः 'उघडते')
      gloss_or: ଉନ୍ମୀଳିତ କରେ, ପ୍ରକଟ କରେ
      gloss_pa: ਉਨਮੀਲਿਤ ਕਰਦੀ ਹੈ, ਪ੍ਰਗਟ ਕਰਦੀ ਹੈ (ਅੱਖ ਖੋਲ੍ਹਣ ਵਾਂਗ)
      gloss_ta: விரித்து வெளிப்படுத்துகிறாள் (திறந்து விரிக்கிறாள்)
      gloss_te: "విప్పును, ప్రకటించును (అక్షరార్థము: 'తెరచును')"
    translations:
    - lang: en
      translator: "public-domain composite"
      source: "synthesized from PD-era English renderings"
      license: PD
      text: "By her own free will she unfolds the universe upon the screen of her own Self."
      ai_assisted: false
      status: published

