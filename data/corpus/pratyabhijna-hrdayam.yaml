text:
  id: pratyabhijna-hrdayam
  slug: pratyabhijna-hrdayam
  title_sa: प्रत्यभिज्ञाहृदयम्
  title_en: The Heart of Recognition
  title_iast: Pratyabhijñāhṛdayam
  author: Kṣemarāja
  tradition: trika
  school: kashmir-shaivism
  era: "11th century CE"
  source: "Muktabodha Indological Research Institute"
  source_url: "https://muktabodha.org"
  source_revision: pending
  license: PD
  parent_text_id: null
  manuscript_url: null
  description: |
    The Pratyabhijñāhṛdayam ("Heart of Recognition") is a concise primer
    on the Pratyabhijñā (Recognition) school of Kashmir Śaivism composed
    by Kṣemarāja (c. 11th century CE), the principal disciple of
    Abhinavagupta. In twenty sūtras with the author's own auto-commentary
    (vṛtti), it distills the essential metaphysics, cosmology, and
    soteriology of non-dual Trika Śaivism for aspirants who lacked the
    capacity to study the larger works such as Utpaladeva's
    Īśvarapratyabhijñākārikā. V1 ingests only the sūtras; Kṣemarāja's
    auto-commentary is treated as a sibling text (pratyabhijna-hrdayam-vrtti).

chapters:
  - chapter: 1
    title_sa: सूत्राणि
    title_iast: sūtrāṇi
    title_en: The Sūtras
    verses:
      - verse: 1
        devanagari: चितिः स्वतन्त्रा विश्वसिद्धिहेतुः ॥१॥
        slp1: "citiH svatantrA vizvasiddhihetuH"
        iast: "citiḥ svatantrā viśvasiddhihetuḥ"
        meter: sūtra
        word_glosses:
          - word: चितिः
            iast: citiḥ
            gloss_en: Consciousness, the absolute Awareness
            morph: nom. sg. f.
          - word: स्वतन्त्रा
            iast: svatantrā
            gloss_en: self-dependent, free, autonomous
            morph: nom. sg. f. adj.
          - word: विश्व
            iast: viśva
            gloss_en: the universe, the all
            morph: stem in cpd.
          - word: सिद्धि
            iast: siddhi
            gloss_en: accomplishment, manifestation, establishment
            morph: stem in cpd.
          - word: हेतुः
            iast: hetuḥ
            gloss_en: the cause
            morph: nom. sg. m.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings (Singh, Chatterji)"
            license: PD
            text: "The absolute Consciousness, in its freedom, is the cause of the manifestation of the universe."
            ai_assisted: false
            status: published

      - verse: 2
        devanagari: स्वेच्छया स्वभित्तौ विश्वमुन्मीलयति ॥२॥
        slp1: "svecCayA svaBittO vizvamunmIlayati"
        iast: "svecchayā svabhittau viśvam unmīlayati"
        meter: sūtra
        word_glosses:
          - word: स्व-इच्छया
            iast: sva-icchayā
            gloss_en: by her own will
            morph: inst. sg. f.
          - word: स्व-भित्तौ
            iast: sva-bhittau
            gloss_en: on her own canvas (screen of the Self)
            morph: loc. sg. f.
          - word: विश्वम्
            iast: viśvam
            gloss_en: the universe
            morph: acc. sg. n.
          - word: उन्मीलयति
            iast: unmīlayati
            gloss_en: unfolds, makes manifest (lit. 'opens out')
            morph: 3sg. pres. caus. √mīl
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "By her own free will she unfolds the universe upon the screen of her own Self."
            ai_assisted: false
            status: published

      - verse: 3
        devanagari: तन्नाना अनुरूपग्राह्यग्राहकभेदात् ॥३॥
        slp1: "tannAnA anurUpagrAhyagrAhakaBedAt"
        iast: "tan nānā anurūpa-grāhya-grāhaka-bhedāt"
        meter: sūtra
        word_glosses:
          - word: तत्
            iast: tat
            gloss_en: that (universe)
            morph: nom. sg. n.
          - word: नाना
            iast: nānā
            gloss_en: manifold, various
            morph: indecl.
          - word: अनुरूप
            iast: anurūpa
            gloss_en: corresponding, conformable
            morph: stem in cpd.
          - word: ग्राह्य
            iast: grāhya
            gloss_en: the perceivable (object)
            morph: stem in cpd.
          - word: ग्राहक
            iast: grāhaka
            gloss_en: the perceiver (subject)
            morph: stem in cpd.
          - word: भेदात्
            iast: bhedāt
            gloss_en: by reason of the differentiation
            morph: abl. sg. m.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "That (universe) is manifold because of the corresponding differentiation of perceived objects and perceiving subjects."
            ai_assisted: false
            status: published

      - verse: 4
        devanagari: चितिसंकोचात्मा चेतनोऽपि सङ्कुचितविश्वमयः ॥४॥
        slp1: "citisaMkocAtmA cetano'pi saNkucitavizvamayaH"
        iast: "citi-saṃkocātmā cetano 'pi saṅkucita-viśvamayaḥ"
        meter: sūtra
        word_glosses:
          - word: चिति-सङ्कोच-आत्मा
            iast: citi-saṃkoca-ātmā
            gloss_en: having a contraction of Consciousness as its essence
            morph: nom. sg. m. cpd.
          - word: चेतनः
            iast: cetanaḥ
            gloss_en: the sentient being, the experient
            morph: nom. sg. m.
          - word: अपि
            iast: api
            gloss_en: even, also
            morph: ptcl.
          - word: सङ्कुचित
            iast: saṅkucita
            gloss_en: contracted, narrowed
            morph: ppp. stem in cpd.
          - word: विश्व-मयः
            iast: viśva-mayaḥ
            gloss_en: made of the universe, identical with the universe
            morph: nom. sg. m. cpd.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The individual experiencer (cetana), whose essence is contracted Consciousness, embodies the universe in a contracted form."
            ai_assisted: false
            status: published

      - verse: 5
        devanagari: चितिरेव चेतनपदादवरूढा चेत्यसङ्कोचिनी चित्तम् ॥५॥
        slp1: "citireva cetanapadAdavarUDhA cetyasaNkocinI cittam"
        iast: "citir eva cetana-padād avarūḍhā cetya-saṅkocinī cittam"
        meter: sūtra
        word_glosses:
          - word: चितिः
            iast: citiḥ
            gloss_en: Consciousness itself
            morph: nom. sg. f.
          - word: एव
            iast: eva
            gloss_en: indeed, alone
            morph: ptcl. emph.
          - word: चेतन-पदात्
            iast: cetana-padāt
            gloss_en: from the level of the (free) experient
            morph: abl. sg. n. cpd.
          - word: अवरूढा
            iast: avarūḍhā
            gloss_en: descended, fallen
            morph: ppp. nom. sg. f.
          - word: चेत्य-सङ्कोचिनी
            iast: cetya-saṅkocinī
            gloss_en: contracting itself to the knowable (object)
            morph: nom. sg. f. cpd.
          - word: चित्तम्
            iast: cittam
            gloss_en: is (called) citta — the individualized mind
            morph: nom. sg. n.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Consciousness itself, descended from the plane of pure subjectivity and contracted by its objects, becomes the mind (citta)."
            ai_assisted: false
            status: published

      - verse: 6
        devanagari: तन्मयो मायाप्रमाता ॥६॥
        slp1: "tanmayo mAyApramAtA"
        iast: "tan-mayo māyā-pramātā"
        meter: sūtra
        word_glosses:
          - word: तत्-मयः
            iast: tat-mayaḥ
            gloss_en: made of that (citta)
            morph: nom. sg. m. cpd.
          - word: माया-प्रमाता
            iast: māyā-pramātā
            gloss_en: is the māyic experient (the soul bound by māyā)
            morph: nom. sg. m. cpd.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The empirical subject conditioned by māyā consists of that (contracted mind)."
            ai_assisted: false
            status: published

      - verse: 7
        devanagari: स चैको द्विरूपस्त्रिमयश्चतुरात्मा सप्तपञ्चकस्वभावः ॥७॥
        slp1: "sa caiko dvirUpastrimayazcaturAtmA saptapaYcakasvaBAvaH"
        iast: "sa caiko dvi-rūpas tri-mayaś catur-ātmā sapta-pañcaka-svabhāvaḥ"
        meter: sūtra
        word_glosses:
          - word: सः
            iast: saḥ
            gloss_en: he (the experient)
            morph: nom. sg. m.
          - word: च
            iast: ca
            gloss_en: and
            morph: conj.
          - word: एकः
            iast: ekaḥ
            gloss_en: one (in essence)
            morph: nom. sg. m.
          - word: द्वि-रूपः
            iast: dvi-rūpaḥ
            gloss_en: of two forms (Śiva–Śakti)
            morph: nom. sg. m. cpd.
          - word: त्रि-मयः
            iast: tri-mayaḥ
            gloss_en: consisting of three (āṇava/śākta/śāmbhava or three malas)
            morph: nom. sg. m. cpd.
          - word: चतुर्-आत्मा
            iast: catur-ātmā
            gloss_en: having four selves (the four states of consciousness)
            morph: nom. sg. m. cpd.
          - word: सप्त-पञ्चक
            iast: sapta-pañcaka
            gloss_en: the seven pentads
            morph: stem in cpd.
          - word: स्वभावः
            iast: svabhāvaḥ
            gloss_en: is of that own nature
            morph: nom. sg. m.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "He, though one, has two forms, three modes, four selves, and the nature of seven pentads."
            ai_assisted: true
            status: draft

      - verse: 8
        devanagari: तद्भूमिकाः सर्वदर्शनस्थितयः ॥८॥
        slp1: "tadBUmikAH sarvadarzanasTitayaH"
        iast: "tad-bhūmikāḥ sarva-darśana-sthitayaḥ"
        meter: sūtra
        word_glosses:
          - word: तत्-भूमिकाः
            iast: tat-bhūmikāḥ
            gloss_en: roles/stages of that (one Consciousness)
            morph: nom. pl. f. cpd.
          - word: सर्व
            iast: sarva
            gloss_en: all
            morph: adj. stem
          - word: दर्शन
            iast: darśana
            gloss_en: philosophical view, system
            morph: stem in cpd.
          - word: स्थितयः
            iast: sthitayaḥ
            gloss_en: are the standpoints
            morph: nom. pl. f.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The doctrinal positions of all philosophical schools are roles assumed by that (one Consciousness)."
            ai_assisted: false
            status: published

      - verse: 9
        devanagari: चिद्वत्तच्छक्तिसङ्कोचान्मलावृतः संसारी ॥९॥
        slp1: "cidvattacCaktisaNkocAnmalAvftaH saMsArI"
        iast: "cid-vat tac-chakti-saṅkocān malāvṛtaḥ saṃsārī"
        meter: sūtra
        word_glosses:
          - word: चित्-वत्
            iast: cit-vat
            gloss_en: though of the nature of Consciousness
            morph: adv./adj. cpd.
          - word: तत्-शक्ति-सङ्कोचात्
            iast: tat-śakti-saṅkocāt
            gloss_en: owing to the contraction of his own powers
            morph: abl. sg. m. cpd.
          - word: मल-आवृतः
            iast: mala-āvṛtaḥ
            gloss_en: covered by the impurities (malas)
            morph: nom. sg. m. cpd.
          - word: संसारी
            iast: saṃsārī
            gloss_en: becomes the transmigrant
            morph: nom. sg. m.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Like Consciousness itself (in essence), but with his powers contracted and covered by impurities, he becomes the transmigrating soul."
            ai_assisted: false
            status: published

      - verse: 10
        devanagari: तथापि तद्वत् पञ्चकृत्यानि करोति ॥१०॥
        slp1: "taTApi tadvat paYcakftyAni karoti"
        iast: "tathāpi tad-vat pañca-kṛtyāni karoti"
        meter: sūtra
        word_glosses:
          - word: तथापि
            iast: tathāpi
            gloss_en: yet even so
            morph: conj.
          - word: तत्-वत्
            iast: tad-vat
            gloss_en: like Him (Śiva)
            morph: adv.
          - word: पञ्च-कृत्यानि
            iast: pañca-kṛtyāni
            gloss_en: the five acts (sṛṣṭi, sthiti, saṃhāra, tirodhāna, anugraha)
            morph: acc. pl. n. cpd.
          - word: करोति
            iast: karoti
            gloss_en: performs
            morph: 3sg. pres. √kṛ
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Even so, like Śiva himself, the bound soul performs the five cosmic acts."
            ai_assisted: false
            status: published

      - verse: 11
        devanagari: आभासनरक्तिविमर्शनबीजावस्थापनविलापनतस्तानि ॥११॥
        slp1: "ABAsanaraktivimarzanabIjAvasTApanavilApanatastAni"
        iast: "ābhāsana-rakti-vimarśana-bījāvasthāpana-vilāpanatas tāni"
        meter: sūtra
        word_glosses:
          - word: आभासन
            iast: ābhāsana
            gloss_en: manifesting (= sṛṣṭi, emission)
            morph: stem in cpd.
          - word: रक्ति
            iast: rakti
            gloss_en: relishing (= sthiti, maintenance)
            morph: stem in cpd.
          - word: विमर्शन
            iast: vimarśana
            gloss_en: reflective grasp (= saṃhāra, withdrawal)
            morph: stem in cpd.
          - word: बीज-अवस्थापन
            iast: bīja-avasthāpana
            gloss_en: placing in seed-form (= tirodhāna, concealment)
            morph: stem in cpd.
          - word: विलापनतः
            iast: vilāpanataḥ
            gloss_en: and dissolving (= anugraha, grace) — by these
            morph: abl. sg. n. cpd.
          - word: तानि
            iast: tāni
            gloss_en: those five acts (are accomplished)
            morph: acc. pl. n.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Those five acts (he performs) by way of manifesting, relishing, reflective withdrawal, depositing as seed, and dissolving."
            ai_assisted: false
            status: published

      - verse: 12
        devanagari: तदपरिज्ञाने स्वशक्तिभिर्व्यामोहितता संसारित्वम् ॥१२॥
        slp1: "tadaparijYAne svazaktiBirvyAmohitatA saMsAritvam"
        iast: "tad-aparijñāne sva-śaktibhir vyāmohitatā saṃsāritvam"
        meter: sūtra
        word_glosses:
          - word: तत्-अपरिज्ञाने
            iast: tat-aparijñāne
            gloss_en: when there is non-recognition of that (true nature)
            morph: loc. sg. n. cpd.
          - word: स्व-शक्तिभिः
            iast: sva-śaktibhiḥ
            gloss_en: by one's own powers
            morph: inst. pl. f. cpd.
          - word: व्यामोहितता
            iast: vyāmohitatā
            gloss_en: the state of being utterly deluded
            morph: nom. sg. f.
          - word: संसारित्वम्
            iast: saṃsāritvam
            gloss_en: is transmigratory existence
            morph: nom. sg. n.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "When that (true nature) is not recognized, being deluded by one's own powers constitutes bondage to saṃsāra."
            ai_assisted: false
            status: published

      - verse: 13
        devanagari: तत्परिज्ञाने चित्तमेव अन्तर्मुखीभावेन चेतनपदाध्यारोहाच्चितिः ॥१३॥
        slp1: "tatparijYAne cittameva antarmuKIBAvena cetanapadADyArohAccitiH"
        iast: "tat-parijñāne cittam eva antarmukhī-bhāvena cetana-padādhyārohāc citiḥ"
        meter: sūtra
        word_glosses:
          - word: तत्-परिज्ञाने
            iast: tat-parijñāne
            gloss_en: when there is full recognition of that
            morph: loc. sg. n. cpd.
          - word: चित्तम्
            iast: cittam
            gloss_en: the (limited) mind
            morph: nom. sg. n.
          - word: एव
            iast: eva
            gloss_en: itself
            morph: ptcl. emph.
          - word: अन्तर्मुखी-भावेन
            iast: antarmukhī-bhāvena
            gloss_en: by becoming inward-facing
            morph: inst. sg. m. cpd.
          - word: चेतन-पद-अध्यारोहात्
            iast: cetana-pada-adhyārohāt
            gloss_en: through ascent to the level of the (free) experient
            morph: abl. sg. m. cpd.
          - word: चितिः
            iast: citiḥ
            gloss_en: becomes Citi (universal Consciousness)
            morph: nom. sg. f.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "When that is recognized, the mind itself, turning inward and ascending to the plane of the conscious subject, becomes Consciousness."
            ai_assisted: false
            status: published

      - verse: 14
        devanagari: चितिवह्निरवरोहपदे छन्नोऽपि मात्रया मेयेन्धनं प्लुष्यति ॥१४॥
        slp1: "citivahniravarohapade Canno'pi mAtrayA meyendhanaM pluzyati"
        iast: "citi-vahnir avaroha-pade channo 'pi mātrayā meyendhanaṃ pluṣyati"
        meter: sūtra
        word_glosses:
          - word: चिति-वह्निः
            iast: citi-vahniḥ
            gloss_en: the fire of Consciousness
            morph: nom. sg. m. cpd.
          - word: अवरोह-पदे
            iast: avaroha-pade
            gloss_en: at the level of descent (= the bound state)
            morph: loc. sg. n. cpd.
          - word: छन्नः
            iast: channaḥ
            gloss_en: though concealed
            morph: nom. sg. m. ppp.
          - word: अपि
            iast: api
            gloss_en: even
            morph: ptcl.
          - word: मात्रया
            iast: mātrayā
            gloss_en: partially
            morph: inst. sg. f.
          - word: मेय-इन्धनम्
            iast: meya-indhanam
            gloss_en: the fuel of objects of knowledge
            morph: acc. sg. n. cpd.
          - word: प्लुष्यति
            iast: pluṣyati
            gloss_en: burns up
            morph: 3sg. pres. √pluṣ
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The fire of Consciousness, even when veiled in the descended state, still partially consumes the fuel of objective phenomena."
            ai_assisted: false
            status: published

      - verse: 15
        devanagari: बललाभे विश्वमात्मसात्करोति ॥१५॥
        slp1: "balalABe vizvamAtmasAtkaroti"
        iast: "bala-lābhe viśvam ātmasāt karoti"
        meter: sūtra
        word_glosses:
          - word: बल-लाभे
            iast: bala-lābhe
            gloss_en: on attaining the power (of Citi)
            morph: loc. sg. m. cpd.
          - word: विश्वम्
            iast: viśvam
            gloss_en: the universe
            morph: acc. sg. n.
          - word: आत्मसात्
            iast: ātmasāt
            gloss_en: as one's own self
            morph: indecl. (sāc-affix)
          - word: करोति
            iast: karoti
            gloss_en: one makes
            morph: 3sg. pres. √kṛ
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "On gaining (its full) power, it assimilates the whole universe to itself."
            ai_assisted: false
            status: published

      - verse: 16
        devanagari: चिदानन्दलाभे देहादिषु चेत्यमानेष्वपि चिदैकात्म्यप्रतिपत्तिदार्ढ्यं जीवन्मुक्तिः ॥१६॥
