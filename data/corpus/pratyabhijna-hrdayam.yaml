text:
  id: pratyabhijna-hrdayam
  slug: pratyabhijna-hrdayam
  title_sa: प्रत्यभिज्ञाहृदयम्
  title_en: The Heart of Recognition
  title_iast: Pratyabhijñāhṛdayam
  author: Kṣemarāja
  tradition: trika
  school: kashmir-shaivism
  era: "11th century CE"
  source: "Muktabodha Indological Research Institute"
  source_url: "https://muktabodha.org"
  source_revision: pending
  license: PD
  parent_text_id:
  manuscript_url:
  description: |
    The Pratyabhijñāhṛdayam ("Heart of Recognition") is a concise primer
    on the Pratyabhijñā (Recognition) school of Kashmir Śaivism composed
    by Kṣemarāja (c. 11th century CE), the principal disciple of
    Abhinavagupta. In twenty sūtras with the author's own auto-commentary
    (vṛtti), it distills the essential metaphysics, cosmology, and
    soteriology of non-dual Trika Śaivism for aspirants who lacked the
    capacity to study the larger works such as Utpaladeva's
    Īśvarapratyabhijñākārikā. V1 ingests only the sūtras; Kṣemarāja's
    auto-commentary is treated as a sibling text (pratyabhijna-hrdayam-vrtti).

chapters:
- chapter: 1
  title_sa: सूत्राणि
  title_iast: sūtrāṇi
  title_en: The Sūtras
  verses:
  - verse: 1
    devanagari: चितिः स्वतन्त्रा विश्वसिद्धिहेतुः ॥१॥
    slp1: "citiH svatantrA vizvasiddhihetuH"
    iast: "citiḥ svatantrā viśvasiddhihetuḥ"
    meter: sūtra
    word_glosses:
    - word: चितिः
      iast: citiḥ
      gloss_en: Consciousness, the absolute Awareness
      morph: nom. sg. f.
      gloss_as: চিতি, পৰম চৈতন্য
      gloss_bn: চিতি, পরম চৈতন্য
      gloss_gu: ચૈતન્ય, પરમ જ્ઞાન-સ્વરૂપ
      gloss_hi: चिति — चैतन्य, परम बोध-शक्ति
      gloss_kn: ಚಿತಿ — ಚೈತನ್ಯ, ಪರಮ ಪ್ರಜ್ಞೆ
      gloss_ml: ചിതി — പരമബോധം, ശുദ്ധ ചൈതന്യം
      gloss_mr: चैतन्य, परम जाणीव
      gloss_or: ଚୈତନ୍ୟ, ପରମ ବୋଧ
      gloss_pa: ਚੈਤੰਨ, ਪਰਮ ਚੇਤਨਾ
      gloss_ta: சித், பேரறிவு, தனிமுதல் சைதன்யம்
      gloss_te: చైతన్యము, పరమ అవగాహన
    - word: स्वतन्त्रा
      iast: svatantrā
      gloss_en: self-dependent, free, autonomous
      morph: nom. sg. f. adj.
      gloss_as: স্বতন্ত্ৰা, স্বাধীন, মুক্ত
      gloss_bn: স্বাধীনা, স্বতন্ত্র, মুক্ত
      gloss_gu: સ્વતંત્ર, સ્વાધીન, કોઈના આશ્રય વગરની
      gloss_hi: स्वतन्त्र, स्वाधीन, स्वायत्त
      gloss_kn: ಸ್ವತಂತ್ರಳಾದ, ಸ್ವಾಧೀನಳಾದ, ಸ್ವಯಂಭು
      gloss_ml: സ്വതന്ത്ര — സ്വാധീന, സ്വയം ആശ്രയിച്ച, സ്വാതന്ത്ര്യമുള്ള
      gloss_mr: स्वतंत्र, स्वायत्त, स्व-अधीन
      gloss_or: ସ୍ୱତନ୍ତ୍ର, ସ୍ୱାଧୀନ, ସ୍ୱାୟତ୍ତ
      gloss_pa: ਸਵੈ-ਨਿਰਭਰ, ਸੁਤੰਤਰ, ਆਜ਼ਾਦ
      gloss_ta: சுயாதீனமான, சுதந்திரமான, தன்னிச்சையான
      gloss_te: స్వతంత్రమైన, స్వాధీనమైన, స్వేచ్ఛాయుతమైన
    - word: विश्व
      iast: viśva
      gloss_en: the universe, the all
      morph: stem in cpd.
      gloss_as: বিশ্ব, সমষ্টি
      gloss_bn: বিশ্ব, সমস্ত
      gloss_gu: વિશ્વ, સમગ્ર બ્રહ્માંડ
      gloss_hi: विश्व, समस्त (समासगत स्तम्भ)
      gloss_kn: ವಿಶ್ವ — ಜಗತ್ತು, ಸರ್ವವೂ
      gloss_ml: വിശ്വ — പ്രപഞ്ചം, സർവം
      gloss_mr: विश्व, सर्व
      gloss_or: ବିଶ୍ୱ, ସମଗ୍ର
      gloss_pa: ਵਿਸ਼ਵ, ਸਮੂਹ ਬ੍ਰਹਿਮੰਡ
      gloss_ta: பிரபஞ்சம், அனைத்தும்
      gloss_te: విశ్వము, సర్వము
    - word: सिद्धि
      iast: siddhi
      gloss_en: accomplishment, manifestation, establishment
      morph: stem in cpd.
      gloss_as: সিদ্ধি, প্ৰকটন, প্ৰতিষ্ঠা
      gloss_bn: সিদ্ধি, প্রকাশ, প্রতিষ্ঠা
      gloss_gu: સિદ્ધિ, અભિવ્યક્તિ, સ્થાપના
      gloss_hi: सिद्धि — अभिव्यक्ति, स्थापना (समासगत स्तम्भ)
      gloss_kn: ಸಿದ್ಧಿ — ಅಭಿವ್ಯಕ್ತಿ, ಸಿದ್ಧಗೊಳ್ಳುವಿಕೆ, ಪ್ರತಿಷ್ಠಾಪನೆ
      gloss_ml: സിദ്ധി — സാധനം, പ്രകടനം, സ്ഥാപനം
      gloss_mr: सिद्धी, आविष्कार, प्रकटन
      gloss_or: ସିଦ୍ଧି, ଅଭିବ୍ୟକ୍ତି, ପ୍ରତିଷ୍ଠା
      gloss_pa: ਸਿੱਧੀ, ਪ੍ਰਗਟਾਵਾ, ਸਥਾਪਨਾ
      gloss_ta: சித்தி, வெளிப்பாடு, நிலைநிறுத்துதல்
      gloss_te: సిద్ధి, ఆవిర్భావము, స్థాపన
    - word: हेतुः
      iast: hetuḥ
      gloss_en: the cause
      morph: nom. sg. m.
      gloss_as: হেতু, কাৰণ
      gloss_bn: কারণ
      gloss_gu: હેતુ, કારણ
      gloss_hi: हेतु — कारण
      gloss_kn: ಹೇತು — ಕಾರಣ
      gloss_ml: ഹേതു — കാരണം
      gloss_mr: कारण
      gloss_or: କାରଣ
      gloss_pa: ਕਾਰਨ, ਹੇਤੁ
      gloss_ta: காரணம்
      gloss_te: కారణము
    translations:
    - lang: en
      translator: "public-domain composite"
      source: "synthesized from PD-era English renderings (Singh, Chatterji)"
      license: PD
      text: "The absolute Consciousness, in its freedom, is the cause of the manifestation of the universe."
      ai_assisted: false
      status: published

    - lang: as
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: চিতি, নিজৰ স্বাধীনতাত, বিশ্বৰ প্ৰকটনৰ কাৰণ।
      ai_assisted: true
      status: published
      model: claude-opus-4-7
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-7)
      license: CC-BY-SA
      text: পরম চিতি, স্বাধীনা হইয়া, বিশ্বের প্রকাশের কারণ।
