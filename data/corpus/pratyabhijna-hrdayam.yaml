      text: "Then, through absorption in the full I-consciousness — whose essence is the bliss of luminous Awareness and whose nature is the potency of the great Mantra — one attains forever the lordship over the wheel of deities of one's own Consciousness, which performs all creation and dissolution. Thus, may there be auspiciousness (śivam)."
