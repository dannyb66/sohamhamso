text:
  id: vijnana-bhairava-tantra
  slug: vijnana-bhairava-tantra
  title_sa: विज्ञानभैरवतन्त्र
  title_en: Vijñāna Bhairava Tantra
  title_iast: Vijñānabhairavatantra
  author: null
  tradition: trika
  school: kashmir-shaivism
  era: "8th-9th century CE"
  source: "Muktabodha Indological Research Institute (permission pending) + sanskritdocuments.org"
  source_url: "https://sanskritdocuments.org/doc_tantra/vijnAna_bhairava.html"
  source_revision: pending
  license: NC
  parent_text_id: null
  manuscript_url: null
  description: |
    The Vijñāna Bhairava Tantra is a foundational text of the Trika school
    of Kashmir Shaivism, structured as a dialogue between Bhairava and
    Bhairavī. It presents 112 (plus framing verses, totaling ~163) dhāraṇās
    — meditation techniques — for direct recognition of the Self.

chapters:
  - chapter: 1
    title_sa: विज्ञानभैरवतन्त्रम्
    title_iast: Vijñāna-bhairava-tantram
    title_en: "Vijñāna Bhairava Tantra"
    verses:
      - verse: 1
        devanagari: श्रीदेव्युवाच । श्रुतं देव मया सर्वं रुद्रयामलसम्भवम् । त्रिकभेदमशेषेण सारात्सारविभागशः ॥१॥
        slp1: "SrIdevyuvAca | SrutaM deva mayA sarvaM rudrayAmalasamBavam | trikaBedamaSezeRa sArAtsAravibAgaSaH"
        iast: "śrīdevy uvāca | śrutaṃ deva mayā sarvaṃ rudrayāmalasambhavam | trikabhedam aśeṣeṇa sārāt sāravibhāgaśaḥ"
        meter: anuṣṭubh
        word_glosses:
          - word: śrīdevī
            iast: śrīdevī
            gloss_en: "the Goddess (Bhairavī)"
            morph: "nom. sg. f."
          - word: rudrayāmala
            iast: rudrayāmala
            gloss_en: "the Rudra-yāmala Tantra (source text)"
            morph: "stem in cpd."
          - word: trika-bheda
            iast: trika-bheda
            gloss_en: "the divisions of the Trika"
            morph: "acc. sg. m."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The Goddess said: O Lord, I have heard from you in full the entire teaching arising from the Rudrayāmala — the divisions of the Trika in their essence, distinguished from the most essential."
            ai_assisted: false
            status: published

      - verse: 2
        devanagari: अद्यापि न निवृत्तो मे संशयः परमेश्वर । किं रूपं तत्त्वतो देव शब्दराशिकलामयम् ॥२॥
        slp1: "adyApi na nivftto me saMSayaH parameSvara | kiM rUpaM tattvato deva SabdarASikalAmayam"
        iast: "adyāpi na nivṛtto me saṃśayaḥ parameśvara | kiṃ rūpaṃ tattvato deva śabdarāśikalāmayam"
        meter: anuṣṭubh
        word_glosses:
          - word: saṃśayaḥ
            iast: saṃśayaḥ
            gloss_en: "doubt"
            morph: "nom. sg. m."
          - word: parameśvara
            iast: parameśvara
            gloss_en: "Supreme Lord"
            morph: "voc. sg. m."
          - word: śabdarāśi-kalā-mayam
            iast: śabdarāśi-kalā-mayam
            gloss_en: "consisting of the totality of phonemes and the kalās"
            morph: "acc. sg. n., bahuvrīhi"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Yet even now, O Supreme Lord, my doubt is not dispelled: what truly is the nature, O God, of that which is constituted of the totality of phonemes and the kalās?"
            ai_assisted: false
            status: published

      - verse: 3
        devanagari: किं वा नवात्मभेदेन भैरवे भैरवाकृतौ । त्रिशिरोभेदभिन्नं वा किं वा शक्तित्रयात्मकम् ॥३॥
        slp1: "kiM vA navAtmaBedena Bairave BairavAkftau | triSiroBedaBinnaM vA kiM vA SaktitrayAtmakam"
        iast: "kiṃ vā navātmabhedena bhairave bhairavākṛtau | triśirobhedabhinnaṃ vā kiṃ vā śaktitrayātmakam"
        meter: anuṣṭubh
        word_glosses:
          - word: navātma-bhedena
            iast: navātma-bhedena
            gloss_en: "by the ninefold division (of the nine selves)"
            morph: "inst. sg. m."
          - word: triśiro-bheda
            iast: triśiro-bheda
            gloss_en: "the threefold division (Triśirobhairava system)"
            morph: "stem in cpd."
          - word: śakti-trayātmakam
            iast: śakti-trayātmakam
            gloss_en: "consisting of the three Śaktis (parā, parāparā, aparā)"
            morph: "nom. sg. n., bahuvrīhi"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Is it by the ninefold division within Bhairava in the form of Bhairava? Or is it divided by the threefold (Triśiras) division? Or does it consist of the three Śaktis?"
            ai_assisted: false
            status: published

      - verse: 4
        devanagari: नादबिन्दुमयं वापि किं चन्द्रार्धनिरोधिकाः । चक्रारूढमनच्कं वा किं वा शक्तिस्वरूपकम् ॥४॥
        slp1: "nAdabindumayaM vApi kiM candrArDaniroDikAH | cakrArUQamanackaM vA kiM vA SaktisvarUpakam"
        iast: "nādabindumayaṃ vāpi kiṃ candrārdhanirodhikāḥ | cakrārūḍham anackaṃ vā kiṃ vā śaktisvarūpakam"
        meter: anuṣṭubh
        word_glosses:
          - word: nāda-bindu-mayam
            iast: nāda-bindu-mayam
            gloss_en: "consisting of nāda and bindu (sound and point)"
            morph: "nom. sg. n., bahuvrīhi"
          - word: candrārdha-nirodhikāḥ
            iast: candrārdha-nirodhikāḥ
            gloss_en: "the half-moon and the obstructress (subtle phonic stages)"
            morph: "nom. pl. f."
          - word: cakrārūḍha
            iast: cakrārūḍha
            gloss_en: "mounted on the wheel (of phonemes)"
            morph: "nom. sg. n."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Or does it consist of nāda and bindu? Or of the half-moon and the obstructress (nirodhikā)? Or is it mounted on the cakra and vowel-less? Or is it the very form of Śakti?"
            ai_assisted: true
            status: draft

      - verse: 5
        devanagari: परापरायाः सकलमपरायाश्च वा पुनः । परायाः यदि तद्वत्स्यात्परत्वं तद्विरुध्यते ॥५॥
        slp1: "parAparAyAH sakalamaparAyASca vA punaH | parAyAH yadi tadvatsyAtparatvaM tadviruDyate"
        iast: "parāparāyāḥ sakalam aparāyāś ca vā punaḥ | parāyāḥ yadi tadvat syāt paratvaṃ tad virudhyate"
        meter: anuṣṭubh
        word_glosses:
          - word: parāparā
            iast: parāparā
            gloss_en: "the supreme-yet-non-supreme (middle Śakti)"
            morph: "gen. sg. f."
          - word: aparā
            iast: aparā
            gloss_en: "the non-supreme (lower Śakti)"
            morph: "gen. sg. f."
          - word: paratvam
            iast: paratvam
            gloss_en: "supreme-ness, transcendence"
            morph: "nom. sg. n."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Or is it the totality of parāparā and aparā? But if Parā too were of the same nature, her supremacy would be contradicted."
            ai_assisted: true
            status: draft

      - verse: 6
        devanagari: न हि वर्णविभेदेन देहभेदेन वा भवेत् । परत्वं निष्कलत्वेन सकलत्वे न तद्भवेत् ॥६॥
        slp1: "na hi varRaviBedena dehaBedena vA Bavet | paratvaM nizkalatvena sakalatve na tadBavet"
        iast: "na hi varṇavibhedena dehabhedena vā bhavet | paratvaṃ niṣkalatvena sakalatve na tad bhavet"
        meter: anuṣṭubh
        word_glosses:
          - word: varṇa-vibheda
            iast: varṇa-vibheda
            gloss_en: "division by phonemes"
            morph: "inst. sg. m."
          - word: niṣkalatvena
            iast: niṣkalatvena
            gloss_en: "by partlessness, indivisibility"
            morph: "inst. sg. n."
          - word: sakalatve
            iast: sakalatve
            gloss_en: "in the state of having parts"
            morph: "loc. sg. n."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "For supremacy cannot arise through division of phonemes or of bodies. Supremacy belongs to the partless (niṣkala); in the state of having parts, it cannot exist."
            ai_assisted: false
            status: published

      - verse: 7
        devanagari: प्रसादं कुरु मे नाथ निःशेषं छिन्धि संशयम् । भैरव उवाच साधु साधु त्वया पृष्टं तन्त्रसारमिदं प्रिये ॥७॥
        slp1: "prasAdaM kuru me nATa niHSezaM CinDi saMSayam | Bairava uvAca sADu sADu tvayA pfzwaM tantrasAramidaM priye"
        iast: "prasādaṃ kuru me nātha niḥśeṣaṃ chindhi saṃśayam | bhairava uvāca sādhu sādhu tvayā pṛṣṭaṃ tantrasāram idaṃ priye"
        meter: anuṣṭubh
        word_glosses:
          - word: prasādam
            iast: prasādam
            gloss_en: "grace, favor"
            morph: "acc. sg. m."
          - word: saṃśayam
            iast: saṃśayam
            gloss_en: "doubt"
            morph: "acc. sg. m."
          - word: tantra-sāram
            iast: tantra-sāram
            gloss_en: "the essence of the Tantra"
            morph: "nom. sg. n."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Bestow your grace, O Lord, and cut my doubt entirely! Bhairava said: Well, well! You have asked, O dear one, this very essence of the Tantra."
            ai_assisted: false
            status: published

      - verse: 8
        devanagari: गुह्यातिगुह्यगोप्तृ त्वं यद्यपीदं वरानने । तथापि कथयिष्यामि यथा वेत्सि तथा शृणु ॥८॥
        slp1: "guhyAtiguhyagoptf tvaM yadyapIdaM varAnane | taTApi kaTayizyAmi yaTA vetsi taTA SfRu"
        iast: "guhyātiguhyagoptṛ tvaṃ yadyapīdaṃ varānane | tathāpi kathayiṣyāmi yathā vetsi tathā śṛṇu"
        meter: anuṣṭubh
        word_glosses:
          - word: guhyātiguhya-goptṛ
            iast: guhyātiguhya-goptṛ
            gloss_en: "guardian of the most secret of secrets"
            morph: "voc. sg. f."
          - word: varānane
            iast: varānane
            gloss_en: "O fair-faced one"
            morph: "voc. sg. f."
          - word: kathayiṣyāmi
            iast: kathayiṣyāmi
            gloss_en: "I shall declare"
            morph: "1 sg. fut."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Though this teaching is the most secret of secrets, O fair-faced one, and you are its guardian, even so I shall declare it. Listen as I know it."
            ai_assisted: false
            status: published

      - verse: 9
        devanagari: यत्परं निष्कलं देवि सर्वतत्त्वातिगोचरम् । तत्तु शक्यं न तेनेह वक्तुं शक्यं तदिच्छया ॥९॥
        slp1: "yatparaM nizkalaM devi sarvatattvAtigocaram | tattu SakyaM na teneha vaktuM SakyaM tadicCayA"
        iast: "yat paraṃ niṣkalaṃ devi sarvatattvātigocaram | tat tu śakyaṃ na teneha vaktuṃ śakyaṃ tad icchayā"
        meter: anuṣṭubh
        word_glosses:
          - word: niṣkalam
            iast: niṣkalam
            gloss_en: "partless, undivided"
            morph: "acc. sg. n."
          - word: sarva-tattvātigocaram
            iast: sarva-tattvātigocaram
            gloss_en: "beyond the range of all categories"
            morph: "acc. sg. n."
          - word: icchayā
            iast: icchayā
            gloss_en: "by will (alone)"
            morph: "inst. sg. f."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "That Supreme which is partless, O Goddess, beyond the reach of all categories — that cannot be described here. Yet by intent (icchā), it can be indicated."
            ai_assisted: true
            status: draft

      - verse: 10
        devanagari: देवि प्रकृतिरूपा या तस्याः किं रूपमुच्यते । सकलत्वे विकल्पानां सकलाद्वैतकल्पना ॥१०॥
        slp1: "devi prakftirUpA yA tasyAH kiM rUpamucyate | sakalatve vikalpAnAM sakalAdvaitakalpanA"
        iast: "devi prakṛtirūpā yā tasyāḥ kiṃ rūpam ucyate | sakalatve vikalpānāṃ sakalādvaitakalpanā"
        meter: anuṣṭubh
        word_glosses:
          - word: prakṛti-rūpā
            iast: prakṛti-rūpā
            gloss_en: "having the form of Prakṛti"
            morph: "nom. sg. f."
          - word: vikalpānām
            iast: vikalpānām
            gloss_en: "of conceptual constructs"
            morph: "gen. pl. m."
          - word: sakalādvaita-kalpanā
            iast: sakalādvaita-kalpanā
            gloss_en: "the imagining of non-duality with parts"
            morph: "nom. sg. f."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "O Goddess, that which has the form of Prakṛti — what form can be ascribed to it? In the state of being composed of parts, all imagining of non-duality is only an idea of vikalpas."
            ai_assisted: true
            status: draft

      - verse: 11
        devanagari: तदा तस्मिन्महाव्योम्नि प्रलीने शशिभास्करे । मग्नवत्तामसी निद्रा बभूव खिलगोचरे ॥११॥
        slp1: "tadA tasmin mahAvyomni pralIne SaSiBAskare | magnavattAmasI nidrA baBUva KilagocarE"
        iast: "tadā tasmin mahāvyomni pralīne śaśibhāskare | magnavat tāmasī nidrā babhūva khilagocare"
        meter: anuṣṭubh
        word_glosses:
          - word: mahā-vyomni
            iast: mahā-vyomni
            gloss_en: "in the great void / supreme space"
            morph: "loc. sg. n."
          - word: śaśi-bhāskare
            iast: śaśi-bhāskare
            gloss_en: "moon and sun (idā-piṅgalā / prāṇa-apāna)"
            morph: "loc. dual m."
          - word: tāmasī nidrā
            iast: tāmasī nidrā
            gloss_en: "tamasic sleep"
            morph: "nom. sg. f."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Then in that Great Void, when sun and moon are dissolved, a tamasic sleep arises as if one is sunk in obstructed range."
            ai_assisted: true
            status: draft

      - verse: 12
        devanagari: एवंविधा भैरवस्य यावस्था परिगीयते । सा परा पररूपेण परा देवी प्रकीर्तिता ॥१२॥
        slp1: "evaMviDA Bairavasya yAvasTA parigIyate | sA parA parArUpeRa parA devI prakIrtitA"
        iast: "evaṃvidhā bhairavasya yāvasthā parigīyate | sā parā pararūpeṇa parā devī prakīrtitā"
        meter: anuṣṭubh
        word_glosses:
          - word: evaṃvidhā
            iast: evaṃvidhā
            gloss_en: "of such a kind"
            morph: "nom. sg. f."
          - word: avasthā
            iast: avasthā
            gloss_en: "state, condition"
            morph: "nom. sg. f."
          - word: parā devī
            iast: parā devī
            gloss_en: "the Supreme Goddess"
            morph: "nom. sg. f."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Such is the state of Bhairava which is celebrated. As the supreme form, she is proclaimed the Supreme Goddess, Parā."
            ai_assisted: true
            status: draft

      - verse: 13
        devanagari: शक्तिशक्तिमतोर्यद्वदभेदः सर्वदा स्थितः । अतस्तद्धर्मधर्मित्वात्परा शक्तिः परात्मनः ॥१३॥
        slp1: "SaktiSaktimatoryadvadaBedaH sarvadA sTitaH | atastadDarmaDarmitvAtparA SaktiH parAtmanaH"
        iast: "śaktiśaktimator yadvad abhedaḥ sarvadā sthitaḥ | atas taddharmadharmitvāt parā śaktiḥ parātmanaḥ"
        meter: anuṣṭubh
        word_glosses:
          - word: śakti-śaktimatoḥ
            iast: śakti-śaktimatoḥ
            gloss_en: "of Power and the Power-holder"
            morph: "gen. dual m."
          - word: abhedaḥ
            iast: abhedaḥ
            gloss_en: "non-difference"
            morph: "nom. sg. m."
          - word: dharma-dharmitvāt
            iast: dharma-dharmitvāt
            gloss_en: "from the relation of attribute and attribute-holder"
            morph: "abl. sg. n."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Just as Śakti and the Possessor of Śakti are ever non-different, so too — by the relation of attribute and attribute-holder — Parā Śakti belongs to the Supreme Self."
            ai_assisted: false
            status: published

      - verse: 14
        devanagari: न वह्नेर्दाहिका शक्तिर्व्यतिरिक्ता विभाव्यते । केवलं ज्ञानसत्तायां प्रारम्भोऽयं प्रवेशने ॥१४॥
        slp1: "na vahnerdAhikA SaktirvyatiriktA viBAvyate | kevalaM jYAnasattAyAM prAramBoyaM praveSane"
        iast: "na vahner dāhikā śaktir vyatiriktā vibhāvyate | kevalaṃ jñānasattāyāṃ prārambho'yaṃ praveśane"
        meter: anuṣṭubh
        word_glosses:
          - word: vahneḥ
            iast: vahneḥ
            gloss_en: "of fire"
            morph: "gen. sg. m."
          - word: dāhikā śaktiḥ
            iast: dāhikā śaktiḥ
            gloss_en: "the burning power"
            morph: "nom. sg. f."
          - word: vyatiriktā
            iast: vyatiriktā
            gloss_en: "separate, distinct"
            morph: "nom. sg. f."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The burning power of fire is not conceived as separate from fire itself. So too here: this is only the beginning of entry into the existence of pure Knowing."
            ai_assisted: false
            status: published

      - verse: 15
        devanagari: शक्त्यवस्थाप्रविष्टस्य निर्विभागेन भावना । तदासौ शिवरूपी स्यात्शैवी मुखमिहोच्यते ॥१५॥
        slp1: "SaktyavasTApravizwasya nirviBAgena BAvanA | tadAsau SivarUpI syAtSaivI muKamihocyate"
        iast: "śaktyavasthāpraviṣṭasya nirvibhāgena bhāvanā | tadāsau śivarūpī syāt śaivī mukham ihocyate"
        meter: anuṣṭubh
        word_glosses:
          - word: śaktyavasthā
            iast: śaktyavasthā
            gloss_en: "the state of Śakti"
            morph: "stem in cpd."
          - word: bhāvanā
            iast: bhāvanā
            gloss_en: "contemplative realization"
            morph: "nom. sg. f."
          - word: śaivī mukham
            iast: śaivī mukham
            gloss_en: "the Face of Śiva (entrance to Śiva)"
            morph: "nom. sg. n."
          - word: śivarūpī
            iast: śivarūpī
            gloss_en: "having the form of Śiva"
            morph: "nom. sg. m."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "For one who has entered the state of Śakti, contemplated as undivided — that person becomes of the form of Śiva. This is here called the Face of Śiva (śaivī-mukha)."
            ai_assisted: false
            status: published

      - verse: 16
