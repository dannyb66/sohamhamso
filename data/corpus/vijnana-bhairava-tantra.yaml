text:
  id: vijnana-bhairava-tantra
  slug: vijnana-bhairava-tantra
  title_sa: विज्ञानभैरवतन्त्र
  title_en: Vijñāna Bhairava Tantra
  title_iast: Vijñānabhairavatantra
  author: null
  tradition: trika
  school: kashmir-shaivism
  era: "8th-9th century CE"
  source: "Muktabodha Indological Research Institute (permission pending) + sanskritdocuments.org"
  source_url: "https://sanskritdocuments.org/doc_tantra/vijnAna_bhairava.html"
  source_revision: pending
  license: NC
  parent_text_id: null
  manuscript_url: null
  description: |
    The Vijñāna Bhairava Tantra is a foundational text of the Trika school
    of Kashmir Shaivism, structured as a dialogue between Bhairava and
    Bhairavī. It presents 112 (plus framing verses, totaling ~163) dhāraṇās
    — meditation techniques — for direct recognition of the Self.

chapters:
  - chapter: 1
    title_sa: विज्ञानभैरवतन्त्रम्
    title_iast: Vijñāna-bhairava-tantram
    title_en: "Vijñāna Bhairava Tantra"
    verses:
      - verse: 1
        devanagari: श्रीदेव्युवाच । श्रुतं देव मया सर्वं रुद्रयामलसम्भवम् । त्रिकभेदमशेषेण सारात्सारविभागशः ॥१॥
        slp1: "SrIdevyuvAca | SrutaM deva mayA sarvaM rudrayAmalasamBavam | trikaBedamaSezeRa sArAtsAravibAgaSaH"
        iast: "śrīdevy uvāca | śrutaṃ deva mayā sarvaṃ rudrayāmalasambhavam | trikabhedam aśeṣeṇa sārāt sāravibhāgaśaḥ"
        meter: anuṣṭubh
        word_glosses:
          - word: śrīdevī
            iast: śrīdevī
            gloss_en: the blessed Goddess (Bhairavī)
            morph: nom. sg. f.
          - word: uvāca
            iast: uvāca
            gloss_en: said
            morph: 3sg. pf. √vac
          - word: śrutam
            iast: śrutam
            gloss_en: heard
            morph: ppp. nom. sg. n.
          - word: deva
            iast: deva
            gloss_en: O Lord
            morph: voc. sg. m.
          - word: mayā
            iast: mayā
            gloss_en: by me
            morph: inst. sg.
          - word: sarvam
            iast: sarvam
            gloss_en: everything, the whole
            morph: acc. sg. n.
          - word: rudrayāmala-sambhavam
            iast: rudrayāmala-sambhavam
            gloss_en: originating from the Rudra-yāmala Tantra
            morph: acc. sg. n. cpd.
          - word: trika-bhedam
            iast: trika-bhedam
            gloss_en: the divisions of the Trika
            morph: acc. sg. m. cpd.
          - word: aśeṣeṇa
            iast: aśeṣeṇa
            gloss_en: without remainder, completely
            morph: inst. sg. n.
          - word: sārāt sāra-vibhāgaśaḥ
            iast: sārāt sāra-vibhāgaśaḥ
            gloss_en: distinguished from the essence of the essence
            morph: adv. cpd.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The Goddess said: O Lord, I have heard from you in full the entire teaching arising from the Rudrayāmala — the divisions of the Trika in their essence, distinguished from the most essential."
            ai_assisted: false
            status: published

      - verse: 2
        devanagari: अद्यापि न निवृत्तो मे संशयः परमेश्वर । किं रूपं तत्त्वतो देव शब्दराशिकलामयम् ॥२॥
        slp1: "adyApi na nivftto me saMSayaH parameSvara | kiM rUpaM tattvato deva SabdarASikalAmayam"
        iast: "adyāpi na nivṛtto me saṃśayaḥ parameśvara | kiṃ rūpaṃ tattvato deva śabdarāśikalāmayam"
        meter: anuṣṭubh
        word_glosses:
          - word: adya api
            iast: adya api
            gloss_en: even today
            morph: adv. + ptcl.
          - word: na
            iast: na
            gloss_en: not
            morph: neg.
          - word: nivṛttaḥ
            iast: nivṛttaḥ
            gloss_en: ceased, dispelled
            morph: ppp. nom. sg. m.
          - word: me
            iast: me
            gloss_en: my, of me
            morph: gen. sg.
          - word: saṃśayaḥ
            iast: saṃśayaḥ
            gloss_en: doubt
            morph: nom. sg. m.
          - word: parameśvara
            iast: parameśvara
            gloss_en: O Supreme Lord
            morph: voc. sg. m.
          - word: kim
            iast: kim
            gloss_en: what?
            morph: interrog.
          - word: rūpam
            iast: rūpam
            gloss_en: form, nature
            morph: nom. sg. n.
          - word: tattvataḥ
            iast: tattvataḥ
            gloss_en: in reality, truly
            morph: adv.
          - word: deva
            iast: deva
            gloss_en: O God
            morph: voc. sg. m.
          - word: śabda-rāśi-kalā-mayam
            iast: śabda-rāśi-kalā-mayam
            gloss_en: consisting of the totality of phonemes and the kalās
            morph: nom. sg. n. cpd.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Yet even now, O Supreme Lord, my doubt is not dispelled: what truly is the nature, O God, of that which is constituted of the totality of phonemes and the kalās?"
            ai_assisted: false
            status: published

      - verse: 3
        devanagari: किं वा नवात्मभेदेन भैरवे भैरवाकृतौ । त्रिशिरोभेदभिन्नं वा किं वा शक्तित्रयात्मकम् ॥३॥
        slp1: "kiM vA navAtmaBedena Bairave BairavAkftau | triSiroBedaBinnaM vA kiM vA SaktitrayAtmakam"
        iast: "kiṃ vā navātmabhedena bhairave bhairavākṛtau | triśirobhedabhinnaṃ vā kiṃ vā śaktitrayātmakam"
        meter: anuṣṭubh
        word_glosses:
          - word: kim vā
            iast: kim vā
            gloss_en: or is it?
            morph: interrog. + ptcl.
          - word: navātma-bhedena
            iast: navātma-bhedena
            gloss_en: by the division of the nine selves
            morph: inst. sg. m. cpd.
          - word: bhairave
            iast: bhairave
            gloss_en: in Bhairava
            morph: loc. sg. m.
          - word: bhairavākṛtau
            iast: bhairavākṛtau
            gloss_en: in the form of Bhairava
            morph: loc. sg. f. cpd.
          - word: triśiraḥ-bheda-bhinnam
            iast: triśiraḥ-bheda-bhinnam
            gloss_en: divided by the three-headed division
            morph: nom. sg. n. cpd.
          - word: vā
            iast: vā
            gloss_en: or
            morph: conj.
          - word: kim vā
            iast: kim vā
            gloss_en: or is it
            morph: interrog.
          - word: śakti-trayātmakam
            iast: śakti-trayātmakam
            gloss_en: consisting of the triad of Powers
            morph: nom. sg. n. cpd.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Is it by the ninefold division within Bhairava in the form of Bhairava? Or is it divided by the threefold (Triśiras) division? Or does it consist of the three Śaktis?"
            ai_assisted: false
            status: published

      - verse: 4
        devanagari: नादबिन्दुमयं वापि किं चन्द्रार्धनिरोधिकाः । चक्रारूढमनच्कं वा किं वा शक्तिस्वरूपकम् ॥४॥
        slp1: "nAdabindumayaM vApi kiM candrArDaniroDikAH | cakrArUQamanackaM vA kiM vA SaktisvarUpakam"
        iast: "nādabindumayaṃ vāpi kiṃ candrārdhanirodhikāḥ | cakrārūḍham anackaṃ vā kiṃ vā śaktisvarūpakam"
        meter: anuṣṭubh
        word_glosses:
          - word: nāda-bindu-mayam
            iast: nāda-bindu-mayam
            gloss_en: consisting of nāda and bindu
            morph: nom. sg. n. cpd.
          - word: vā api
            iast: vā api
            gloss_en: or even
            morph: ptcl.
          - word: kim
            iast: kim
            gloss_en: is it?
            morph: interrog.
          - word: candra-ardha-nirodhikāḥ
            iast: candra-ardha-nirodhikāḥ
            gloss_en: the half-moon and the restraining (forms)
            morph: nom. pl. f. cpd.
          - word: cakra-ārūḍham
            iast: cakra-ārūḍham
            gloss_en: mounted on the wheel
            morph: nom. sg. n. cpd.
          - word: anackam
            iast: anackam
            gloss_en: the vowel-less (i.e. pure consonant)
            morph: nom. sg. n.
          - word: vā
            iast: vā
            gloss_en: or
            morph: conj.
          - word: kim vā
            iast: kim vā
            gloss_en: or is it
            morph: interrog.
          - word: śakti-svarūpakam
            iast: śakti-svarūpakam
            gloss_en: of the very nature of Śakti
            morph: nom. sg. n. cpd.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Or does it consist of nāda and bindu? Or of the half-moon and the obstructress (nirodhikā)? Or is it mounted on the cakra and vowel-less? Or is it the very form of Śakti?"
            ai_assisted: true
            status: draft

      - verse: 5
        devanagari: परापरायाः सकलमपरायाश्च वा पुनः । परायाः यदि तद्वत्स्यात्परत्वं तद्विरुध्यते ॥५॥
        slp1: "parAparAyAH sakalamaparAyASca vA punaH | parAyAH yadi tadvatsyAtparatvaM tadviruDyate"
        iast: "parāparāyāḥ sakalam aparāyāś ca vā punaḥ | parāyāḥ yadi tadvat syāt paratvaṃ tad virudhyate"
        meter: anuṣṭubh
        word_glosses:
          - word: parāparāyāḥ
            iast: parāparāyāḥ
            gloss_en: of parāparā (the intermediate Goddess)
            morph: gen. sg. f.
          - word: sakalam
            iast: sakalam
            gloss_en: the manifest, with-parts (state)
            morph: nom./acc. sg. n.
          - word: aparāyāḥ
            iast: aparāyāḥ
            gloss_en: of aparā (the lower Goddess)
            morph: gen. sg. f.
          - word: ca vā
            iast: ca vā
            gloss_en: or and
            morph: conj.
          - word: punaḥ
            iast: punaḥ
            gloss_en: again
            morph: adv.
          - word: parāyāḥ
            iast: parāyāḥ
            gloss_en: of parā (the highest Goddess)
            morph: gen. sg. f.
          - word: yadi
            iast: yadi
            gloss_en: if
            morph: conj.
          - word: tadvat
            iast: tadvat
            gloss_en: in the same way
            morph: adv.
          - word: syāt
            iast: syāt
            gloss_en: would be
            morph: 3sg. opt. √as
          - word: paratvam
            iast: paratvam
            gloss_en: the state of supremacy
            morph: nom. sg. n.
          - word: tat
            iast: tat
            gloss_en: that
            morph: nom. sg. n.
          - word: virudhyate
            iast: virudhyate
            gloss_en: is contradicted
            morph: 3sg. pres. pass.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Or is it the totality of parāparā and aparā? But if Parā too were of the same nature, her supremacy would be contradicted."
            ai_assisted: true
            status: draft

      - verse: 6
        devanagari: न हि वर्णविभेदेन देहभेदेन वा भवेत् । परत्वं निष्कलत्वेन सकलत्वे न तद्भवेत् ॥६॥
        slp1: "na hi varRaviBedena dehaBedena vA Bavet | paratvaM nizkalatvena sakalatve na tadBavet"
        iast: "na hi varṇavibhedena dehabhedena vā bhavet | paratvaṃ niṣkalatvena sakalatve na tad bhavet"
        meter: anuṣṭubh
        word_glosses:
          - word: na hi
            iast: na hi
            gloss_en: for not
            morph: neg. + ptcl.
          - word: varṇa-vibhedena
            iast: varṇa-vibhedena
            gloss_en: by distinction of letters/colors
            morph: inst. sg. m. cpd.
          - word: deha-bhedena
            iast: deha-bhedena
            gloss_en: by distinction of bodies
            morph: inst. sg. m. cpd.
          - word: vā
            iast: vā
            gloss_en: or
            morph: conj.
          - word: bhavet
            iast: bhavet
            gloss_en: could be
            morph: 3sg. opt. √bhū
          - word: paratvam
            iast: paratvam
            gloss_en: supremacy
            morph: nom. sg. n.
          - word: niṣkalatvena
            iast: niṣkalatvena
            gloss_en: by partlessness
            morph: inst. sg. n.
          - word: sakalatve
            iast: sakalatve
            gloss_en: in the with-parts state
            morph: loc. sg. n.
          - word: na tad bhavet
            iast: na tad bhavet
            gloss_en: that cannot be
            morph: phrase
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "For supremacy cannot arise through division of phonemes or of bodies. Supremacy belongs to the partless (niṣkala); in the state of having parts, it cannot exist."
            ai_assisted: false
            status: published

      - verse: 7
        devanagari: प्रसादं कुरु मे नाथ निःशेषं छिन्धि संशयम् । भैरव उवाच साधु साधु त्वया पृष्टं तन्त्रसारमिदं प्रिये ॥७॥
        slp1: "prasAdaM kuru me nATa niHSezaM CinDi saMSayam | Bairava uvAca sADu sADu tvayA pfzwaM tantrasAramidaM priye"
        iast: "prasādaṃ kuru me nātha niḥśeṣaṃ chindhi saṃśayam | bhairava uvāca sādhu sādhu tvayā pṛṣṭaṃ tantrasāram idaṃ priye"
        meter: anuṣṭubh
        word_glosses:
          - word: prasādam
            iast: prasādam
            gloss_en: favour, grace
            morph: acc. sg. m.
          - word: kuru
            iast: kuru
            gloss_en: do, bestow
            morph: 2sg. impv. √kṛ
          - word: me
            iast: me
            gloss_en: to me
            morph: gen./dat. sg.
          - word: nātha
            iast: nātha
            gloss_en: O Lord
            morph: voc. sg. m.
          - word: niḥśeṣam
            iast: niḥśeṣam
            gloss_en: without remainder, completely
            morph: adv.
          - word: chindhi
            iast: chindhi
            gloss_en: cut, sever
            morph: 2sg. impv. √chid
          - word: saṃśayam
            iast: saṃśayam
            gloss_en: doubt
            morph: acc. sg. m.
          - word: bhairavaḥ uvāca
            iast: bhairavaḥ uvāca
            gloss_en: Bhairava said
            morph: phrase
          - word: sādhu sādhu
            iast: sādhu sādhu
            gloss_en: well, well!
            morph: interj.
          - word: tvayā pṛṣṭam
            iast: tvayā pṛṣṭam
            gloss_en: asked by you
            morph: phrase
          - word: tantra-sāram
            iast: tantra-sāram
            gloss_en: the essence of tantra
            morph: acc. sg. n. cpd.
          - word: idam priye
            iast: idam priye
            gloss_en: this, O beloved
            morph: phrase
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Bestow your grace, O Lord, and cut my doubt entirely! Bhairava said: Well, well! You have asked, O dear one, this very essence of the Tantra."
            ai_assisted: false
            status: published

      - verse: 8
        devanagari: गुह्यातिगुह्यगोप्तृ त्वं यद्यपीदं वरानने । तथापि कथयिष्यामि यथा वेत्सि तथा शृणु ॥८॥
        slp1: "guhyAtiguhyagoptf tvaM yadyapIdaM varAnane | taTApi kaTayizyAmi yaTA vetsi taTA SfRu"
        iast: "guhyātiguhyagoptṛ tvaṃ yadyapīdaṃ varānane | tathāpi kathayiṣyāmi yathā vetsi tathā śṛṇu"
        meter: anuṣṭubh
        word_glosses:
          - word: guhyātiguhya-goptṛ
            iast: guhyātiguhya-goptṛ
            gloss_en: O guardian of the secret-of-secrets
            morph: voc. sg. f.
          - word: tvam
            iast: tvam
            gloss_en: you
            morph: nom. sg.
          - word: yadi api
            iast: yadi api
            gloss_en: although
            morph: conj.
          - word: idam
            iast: idam
            gloss_en: this
            morph: nom. sg. n.
          - word: varānane
            iast: varānane
            gloss_en: O fair-faced one
            morph: voc. sg. f.
          - word: tathā api
            iast: tathā api
            gloss_en: yet even so
            morph: conj.
          - word: kathayiṣyāmi
            iast: kathayiṣyāmi
            gloss_en: I shall tell
            morph: 1sg. fut. √kath
          - word: yathā
            iast: yathā
            gloss_en: as
            morph: adv.
          - word: vetsi
            iast: vetsi
            gloss_en: you know
            morph: 2sg. pres. √vid
          - word: tathā śṛṇu
            iast: tathā śṛṇu
            gloss_en: thus listen
            morph: phrase
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Though this teaching is the most secret of secrets, O fair-faced one, and you are its guardian, even so I shall declare it. Listen as I know it."
            ai_assisted: false
            status: published

      - verse: 9
        devanagari: यत्परं निष्कलं देवि सर्वतत्त्वातिगोचरम् । तत्तु शक्यं न तेनेह वक्तुं शक्यं तदिच्छया ॥९॥
        slp1: "yatparaM nizkalaM devi sarvatattvAtigocaram | tattu SakyaM na teneha vaktuM SakyaM tadicCayA"
        iast: "yat paraṃ niṣkalaṃ devi sarvatattvātigocaram | tat tu śakyaṃ na teneha vaktuṃ śakyaṃ tad icchayā"
        meter: anuṣṭubh
        word_glosses:
          - word: yat
            iast: yat
            gloss_en: that which
            morph: rel. nom. sg. n.
          - word: param
            iast: param
            gloss_en: is supreme
            morph: nom. sg. n.
          - word: niṣkalam
            iast: niṣkalam
            gloss_en: partless
            morph: nom. sg. n.
          - word: devi
            iast: devi
            gloss_en: O Goddess
            morph: voc. sg. f.
          - word: sarva-tattvāti-gocaram
            iast: sarva-tattvāti-gocaram
            gloss_en: beyond the range of all the tattvas
            morph: nom. sg. n. cpd.
          - word: tat tu śakyam na
            iast: tat tu śakyam na
            gloss_en: that surely cannot be
            morph: phrase
          - word: tena
            iast: tena
            gloss_en: by him
            morph: inst. sg. m.
          - word: iha
            iast: iha
            gloss_en: here (in words)
            morph: adv.
          - word: vaktum
            iast: vaktum
            gloss_en: to be told
            morph: inf. √vac
          - word: śakyam tat
            iast: śakyam tat
            gloss_en: is that which can be
            morph: phrase
          - word: icchayā
            iast: icchayā
            gloss_en: by mere wish
            morph: inst. sg. f.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "That Supreme which is partless, O Goddess, beyond the reach of all categories — that cannot be described here. Yet by intent (icchā), it can be indicated."
            ai_assisted: true
            status: draft

      - verse: 10
        devanagari: देवि प्रकृतिरूपा या तस्याः किं रूपमुच्यते । सकलत्वे विकल्पानां सकलाद्वैतकल्पना ॥१०॥
        slp1: "devi prakftirUpA yA tasyAH kiM rUpamucyate | sakalatve vikalpAnAM sakalAdvaitakalpanA"
        iast: "devi prakṛtirūpā yā tasyāḥ kiṃ rūpam ucyate | sakalatve vikalpānāṃ sakalādvaitakalpanā"
        meter: anuṣṭubh
        word_glosses:
          - word: devi
            iast: devi
            gloss_en: O Goddess
            morph: voc. sg. f.
          - word: prakṛti-rūpā
            iast: prakṛti-rūpā
            gloss_en: having the form of prakṛti
            morph: nom. sg. f. cpd.
          - word: yā
            iast: yā
            gloss_en: she who
            morph: rel. nom. sg. f.
          - word: tasyāḥ
            iast: tasyāḥ
            gloss_en: her
            morph: gen. sg. f.
          - word: kim rūpam
            iast: kim rūpam
            gloss_en: what form?
            morph: interrog.
          - word: ucyate
            iast: ucyate
