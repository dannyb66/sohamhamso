  description: |
    The Parātrīśikā (also transmitted as Parātriṃśikā, "the Thirty Verses
    on the Supreme") is a short Trika tantra of 36 verses, framed as a
    dialogue between the Goddess and Bhairava and traditionally regarded
    as the essence of the Rudrayāmala Tantra (its closing verse says
    "ity etad rudrayāmalam"). It is the root text of Abhinavagupta's
    Parātrīśikā-Vivaraṇa and Laghuvṛtti commentaries; the sibling slug
    paratrisika-vivarana is reserved for the Vivaraṇa. This file ingests
    the mūla verses only, verbatim from GRETIL's e-text; two
    legacy-encoding artifacts in the upstream transcription (verse 19
    "ma.ṅdalo", verse 29 "stha.ṅdilaṃ") are preserved as-is rather than
    emended.

chapters:
- chapter: 1
  title_sa: परात्रिंशिका
  title_iast: Parātriṃśikā
  title_en: Parātrīśikā
  verses:
  - verse: 1
    devanagari: श्रीदेव्य् उवाच । अनुत्तरं कथं देव स्वतः कौलिकसिद्धिदम् । येन विज्ञातमात्रेण खेचरीसमतां व्रजेत् ॥१॥
    slp1: "SrIdevy uvAca | anuttaraM kaTaM deva svataH kOlikasidDidam | yena vijYAtamAtreRa KecarIsamatAM vrajet"
    iast: "śrīdevy uvāca | anuttaraṃ kathaṃ deva svataḥ kaulikasiddhidam | yena vijñātamātreṇa khecarīsamatāṃ vrajet"
  - verse: 2
    devanagari: एतद् गुह्यं महागुह्यं कथयस्व मम प्रभो । हृदयस्था तु या शक्तिः कौलिनी कुलनायिका ॥२॥
    slp1: "etad guhyaM mahAguhyaM kaTayasva mama praBo | hfdayasTA tu yA SaktiH kOlinI kulanAyikA"
    iast: "etad guhyaṃ mahāguhyaṃ kathayasva mama prabho | hṛdayasthā tu yā śaktiḥ kaulinī kulanāyikā"
  - verse: 3
    devanagari: ताम् मे कथय देवेश येन तृप्तिं व्रजाम्य् अहम् । श्रीभैरव उवाच । शृणु देवि महाभगे उत्तरस्याप्य् अनुत्तरम् ॥३॥
    slp1: "tAm me kaTaya deveSa yena tfptiM vrajAmy aham | SrIBErava uvAca | SfRu devi mahABage uttarasyApy anuttaram"
    iast: "tām me kathaya deveśa yena tṛptiṃ vrajāmy aham | śrībhairava uvāca | śṛṇu devi mahābhage uttarasyāpy anuttaram"
  - verse: 4
    devanagari: कथयामि न संदेहः सद्यः कौलिकसिद्धिदम् । कौलिको ऽयं विधिर् देवि मम हृद्व्योम्न्य् अवस्थितः ॥४॥
    slp1: "kaTayAmi na saMdehaH sadyaH kOlikasidDidam | kOliko 'yaM viDir devi mama hfdvyomny avasTitaH"
    iast: "kathayāmi na saṃdehaḥ sadyaḥ kaulikasiddhidam | kauliko 'yaṃ vidhir devi mama hṛdvyomny avasthitaḥ"
  - verse: 5
    devanagari: अथाद्यास् तिथयः सर्वे स्वरा बिन्द्ववसानकाः । तदन्तः कालयोगेन सोमसूर्यौ प्रकीर्तितौ ॥५॥
    slp1: "aTAdyAs tiTayaH sarve svarA bindvavasAnakAH | tadantaH kAlayogena somasUryO prakIrtitO"
    iast: "athādyās tithayaḥ sarve svarā bindvavasānakāḥ | tadantaḥ kālayogena somasūryau prakīrtitau"
  - verse: 6
    devanagari: पृथिव्यादीनि तत्त्वानि पुरुषान्तानि पञ्चसु । क्रमात् कादिषु वर्गेषु मकारान्तेषु सुव्रते ॥६॥
    slp1: "pfTivyAdIni tattvAni puruzAntAni paYcasu | kramAt kAdizu vargezu makArAntezu suvrate"
    iast: "pṛthivyādīni tattvāni puruṣāntāni pañcasu | kramāt kādiṣu vargeṣu makārānteṣu suvrate"
  - verse: 7
    devanagari: वाय्वग्निसलिलेन्द्राणां धारणानां चतुष्टयम् । तदूर्ध्वे शादिविख्यातम् पुरस्ताद् ब्रह्मपञ्चकम् ॥७॥
    slp1: "vAyvagnisalilendrARAM DAraRAnAM catuzwayam | tadUrDve SAdiviKyAtam purastAd brahmapaYcakam"
    iast: "vāyvagnisalilendrāṇāṃ dhāraṇānāṃ catuṣṭayam | tadūrdhve śādivikhyātam purastād brahmapañcakam"
  - verse: 8
    devanagari: अमूला तत्क्रमा ज्ञेया क्षान्ता सृष्टिर् उदाहृता । सर्वेषां चैव मन्त्राणां विद्यानां च यशस्विनि ॥८॥
    slp1: "amUlA tatkramA jYeyA kzAntA sfzwir udAhftA | sarvezAM cEva mantrARAM vidyAnAM ca yaSasvini"
    iast: "amūlā tatkramā jñeyā kṣāntā sṛṣṭir udāhṛtā | sarveṣāṃ caiva mantrāṇāṃ vidyānāṃ ca yaśasvini"
  - verse: 9
    devanagari: इयं योनिः समाख्याता सर्वतन्त्रेषु सर्वदा । चतुर्दशयुतं भद्रे तिथीशान्तसमन्वितम् । तृतीयम् ब्रह्म सुश्रोणि हृदयम् भैरवात्मनः ॥९॥
    slp1: "iyaM yoniH samAKyAtA sarvatantrezu sarvadA | caturdaSayutaM Badre tiTISAntasamanvitam | tftIyam brahma suSroRi hfdayam BEravAtmanaH"
    iast: "iyaṃ yoniḥ samākhyātā sarvatantreṣu sarvadā | caturdaśayutaṃ bhadre tithīśāntasamanvitam | tṛtīyam brahma suśroṇi hṛdayam bhairavātmanaḥ"
  - verse: 10
    devanagari: एतन् ना योगिनीजातो ना रुद्रो लभते स्फुटम् । हृदयं देवदेवस्य सद्यो योगविमोक्षदम् ॥१०॥
    slp1: "etan nA yoginIjAto nA rudro laBate sPuwam | hfdayaM devadevasya sadyo yogavimokzadam"
    iast: "etan nā yoginījāto nā rudro labhate sphuṭam | hṛdayaṃ devadevasya sadyo yogavimokṣadam"
  - verse: 11
    devanagari: अस्योच्चारे कृते सम्यङ् मन्त्रमुद्रागणो महान् । सद्यः सन्मुखताम् एति स्वदेहावेशलक्षणम् ॥११॥
    slp1: "asyoccAre kfte samyaN mantramudrAgaRo mahAn | sadyaH sanmuKatAm eti svadehAveSalakzaRam"
    iast: "asyoccāre kṛte samyaṅ mantramudrāgaṇo mahān | sadyaḥ sanmukhatām eti svadehāveśalakṣaṇam"
  - verse: 12
    devanagari: मुहूर्तं स्मरते यस् तु चुम्बके नाभिमुद्रितः । स बध्नाति तदा देहं मन्त्रमुद्रागणं नरः ॥१२॥
    slp1: "muhUrtaM smarate yas tu cumbake nABimudritaH | sa baDnAti tadA dehaM mantramudrAgaRaM naraH"
    iast: "muhūrtaṃ smarate yas tu cumbake nābhimudritaḥ | sa badhnāti tadā dehaṃ mantramudrāgaṇaṃ naraḥ"
  - verse: 13
    devanagari: अतीतानागतानर्थान् पृष्टो ऽसौ कथयत्य् अपि । प्रहराद् यद् अभिप्रेतं देवतारूपम् उच्चरन् ॥१३॥
    slp1: "atItAnAgatAnarTAn pfzwo 'sO kaTayaty api | praharAd yad aBipretaM devatArUpam uccaran"
    iast: "atītānāgatānarthān pṛṣṭo 'sau kathayaty api | praharād yad abhipretaṃ devatārūpam uccaran"
  - verse: 14
    devanagari: सक्षात् पश्यत्य् असंदिग्धम् आकृष्टं रुद्रसक्तिभिः । प्रहरद्वयमात्रेण व्योमस्थो जायते स्मरन् ॥१४॥
    slp1: "sakzAt paSyaty asaMdigDam AkfzwaM rudrasaktiBiH | praharadvayamAtreRa vyomasTo jAyate smaran"
    iast: "sakṣāt paśyaty asaṃdigdham ākṛṣṭaṃ rudrasaktibhiḥ | praharadvayamātreṇa vyomastho jāyate smaran"
  - verse: 15
    devanagari: त्रयेण मातरः सर्वा योगेस्वर्यो महाबलाः । वीरा वीरेस्वराः सिद्धा बलवान् शाकिनीगणः ॥१५॥
    slp1: "trayeRa mAtaraH sarvA yogesvaryo mahAbalAH | vIrA vIresvarAH sidDA balavAn SAkinIgaRaH"
    iast: "trayeṇa mātaraḥ sarvā yogesvaryo mahābalāḥ | vīrā vīresvarāḥ siddhā balavān śākinīgaṇaḥ"
  - verse: 16
    devanagari: आगत्य समयं दत्त्वा भैरवेण प्रचोदिताः । यच्छन्ति परमां सिद्धिं फलं यद् वा समीहितम् ॥१६॥
    slp1: "Agatya samayaM dattvA BEraveRa pracoditAH | yacCanti paramAM sidDiM PalaM yad vA samIhitam"
    iast: "āgatya samayaṃ dattvā bhairaveṇa pracoditāḥ | yacchanti paramāṃ siddhiṃ phalaṃ yad vā samīhitam"
  - verse: 17
    devanagari: अनेन सिद्धाः सेत्स्यन्ति साधयन्ति च मन्त्रिणः ॥१७॥
    slp1: "anena sidDAH setsyanti sADayanti ca mantriRaH"
    iast: "anena siddhāḥ setsyanti sādhayanti ca mantriṇaḥ"
  - verse: 18
    devanagari: यत्किंचिद् भैरवे तन्त्रे सर्वम् अस्मात् प्रसिध्यति । मन्त्रवीर्यसमावेशप्रभावान् न नियन्त्रिणा ॥१८॥
    slp1: "yatkiMcid BErave tantre sarvam asmAt prasiDyati | mantravIryasamAveSapraBAvAn na niyantriRA"
    iast: "yatkiṃcid bhairave tantre sarvam asmāt prasidhyati | mantravīryasamāveśaprabhāvān na niyantriṇā"
  - verse: 19
    devanagari: अदृष्टम.ङ्दलो ऽप्य् एवम् यः कश्चिद् वेत्ति तत्त्वतः । स सिद्धिभाग् भवेन् नित्यं स योगी स च दीक्षीतः ॥१९॥
    slp1: "adfzwama.Ndalo 'py evam yaH kaScid vetti tattvataH | sa sidDiBAg Baven nityaM sa yogI sa ca dIkzItaH"
    iast: "adṛṣṭama.ṅdalo 'py evam yaḥ kaścid vetti tattvataḥ | sa siddhibhāg bhaven nityaṃ sa yogī sa ca dīkṣītaḥ"
  - verse: 20
    devanagari: अनेन ज्ञातमात्रेण ज्ञायते सर्वशक्तिभिः । शाकिनीकुलसामान्यो भवेद् योगं विनापि हि ॥२०॥
    slp1: "anena jYAtamAtreRa jYAyate sarvaSaktiBiH | SAkinIkulasAmAnyo Baved yogaM vinApi hi"
    iast: "anena jñātamātreṇa jñāyate sarvaśaktibhiḥ | śākinīkulasāmānyo bhaved yogaṃ vināpi hi"
  - verse: 21
    devanagari: अविधिज्ञो विधानज्ञो जायते यजनं प्रति । कालाग्निम् आदितः कृत्वा मायान्तम् ब्रह्मदेहगम् ॥२१॥
    slp1: "aviDijYo viDAnajYo jAyate yajanaM prati | kAlAgnim AditaH kftvA mAyAntam brahmadehagam"
    iast: "avidhijño vidhānajño jāyate yajanaṃ prati | kālāgnim āditaḥ kṛtvā māyāntam brahmadehagam"
  - verse: 22
    devanagari: शिवो विश्वद्यनन्तान्तः परं शक्तित्रयं मतम् । तदन्तर् वर्ति यत्किंचिच् छुद्धमार्गे व्यवस्थितम् ॥२२॥
    slp1: "Sivo viSvadyanantAntaH paraM SaktitrayaM matam | tadantar varti yatkiMcic CudDamArge vyavasTitam"
    iast: "śivo viśvadyanantāntaḥ paraṃ śaktitrayaṃ matam | tadantar varti yatkiṃcic chuddhamārge vyavasthitam"
  - verse: 23
    devanagari: अणुर् विशुद्धम् अचिराद् ऐस्वरं ज्ञानम् अश्नुते । तच्चोदकः शिवो ज्ञेयः सर्वज्ञः परमेश्वरः ॥२३॥
    slp1: "aRur viSudDam acirAd EsvaraM jYAnam aSnute | taccodakaH Sivo jYeyaH sarvajYaH parameSvaraH"
    iast: "aṇur viśuddham acirād aisvaraṃ jñānam aśnute | taccodakaḥ śivo jñeyaḥ sarvajñaḥ parameśvaraḥ"
  - verse: 24
    devanagari: सर्वगो निर्मलः स्वच्छस् तृप्तः स्वायतनः शुचिः । यथा न्यग्रोधबीजस्थः शक्तिरूपो महाद्रुमः ॥२४॥
    slp1: "sarvago nirmalaH svacCas tfptaH svAyatanaH SuciH | yaTA nyagroDabIjasTaH SaktirUpo mahAdrumaH"
    iast: "sarvago nirmalaḥ svacchas tṛptaḥ svāyatanaḥ śuciḥ | yathā nyagrodhabījasthaḥ śaktirūpo mahādrumaḥ"
  - verse: 25
    devanagari: तथा हृदयबीजस्थं जगद् एतच् चराचरम् । एवं यो वेत्ति तत्त्वेन तस्य निर्वाणगामिनी ॥२५॥
    slp1: "taTA hfdayabIjasTaM jagad etac carAcaram | evaM yo vetti tattvena tasya nirvARagAminI"
    iast: "tathā hṛdayabījasthaṃ jagad etac carācaram | evaṃ yo vetti tattvena tasya nirvāṇagāminī"
  - verse: 26
    devanagari: दीक्षा भवत्य् असंदिग्धा तिलाज्याहुतिवर्जिता । मूर्ध्नि वक्त्रे च हृदये गुह्ये मुर्तौ तथैव च ॥२६॥
    slp1: "dIkzA Bavaty asaMdigDA tilAjyAhutivarjitA | mUrDni vaktre ca hfdaye guhye murtO taTEva ca"
    iast: "dīkṣā bhavaty asaṃdigdhā tilājyāhutivarjitā | mūrdhni vaktre ca hṛdaye guhye murtau tathaiva ca"
  - verse: 27
    devanagari: न्यासं क्र्त्वा शिखां बद्ध्वा सप्तविंसतिमन्त्रिताम् । एकैकेन दिशां बन्धं दशानाम् अपि कारयेत् ॥२७॥
    slp1: "nyAsaM krtvA SiKAM badDvA saptaviMsatimantritAm | ekEkena diSAM banDaM daSAnAm api kArayet"
    iast: "nyāsaṃ krtvā śikhāṃ baddhvā saptaviṃsatimantritām | ekaikena diśāṃ bandhaṃ daśānām api kārayet"
  - verse: 28
    devanagari: तालत्रयम् पुरा दत्त्वा सशब्दं विघ्नशान्तये । शिखासंख्याभिजप्तेन तोयेनाभ्युक्षयेत् ततः ॥२८॥
    slp1: "tAlatrayam purA dattvA saSabdaM viGnaSAntaye | SiKAsaMKyABijaptena toyenAByukzayet tataH"
    iast: "tālatrayam purā dattvā saśabdaṃ vighnaśāntaye | śikhāsaṃkhyābhijaptena toyenābhyukṣayet tataḥ"
  - verse: 29
    devanagari: पुष्पादिकं क्रमात् सर्वं लिङ्गं वा स्थ.ङ्दिलं च वा । चतुर्दशाभिजप्तेन पुष्पेणासनकल्पना ॥२९॥
    slp1: "puzpAdikaM kramAt sarvaM liNgaM vA sTa.NdilaM ca vA | caturdaSABijaptena puzpeRAsanakalpanA"
    iast: "puṣpādikaṃ kramāt sarvaṃ liṅgaṃ vā stha.ṅdilaṃ ca vā | caturdaśābhijaptena puṣpeṇāsanakalpanā"
  - verse: 30
    devanagari: तत्र सृष्टिं यजेद् वीरः पुनर् एवासनं ततः । सृष्टिं तु सम्पुटीकृत्य पश्चाद् यजनम् आरभेत् ॥३०॥
    slp1: "tatra sfzwiM yajed vIraH punar evAsanaM tataH | sfzwiM tu sampuwIkftya paScAd yajanam AraBet"
    iast: "tatra sṛṣṭiṃ yajed vīraḥ punar evāsanaṃ tataḥ | sṛṣṭiṃ tu sampuṭīkṛtya paścād yajanam ārabhet"
  - verse: 31
    devanagari: सर्वतत्त्वसुसम्पूर्णाम् सर्वावयवशोभिताम् । यजेद् देवीं महाभागा सप्तविंशतिमन्त्रिताम् ॥३१॥
    slp1: "sarvatattvasusampUrRAm sarvAvayavaSoBitAm | yajed devIM mahABAgA saptaviMSatimantritAm"
    iast: "sarvatattvasusampūrṇām sarvāvayavaśobhitām | yajed devīṃ mahābhāgā saptaviṃśatimantritām"
  - verse: 32
    devanagari: ततः सुगन्धिपुष्पैश् च यथाशक्त्या समर्चयेत् । पूजयेत् परया भक्त्या स्वात्मनं च निवेदयेत् ॥३२॥
    slp1: "tataH suganDipuzpES ca yaTASaktyA samarcayet | pUjayet parayA BaktyA svAtmanaM ca nivedayet"
    iast: "tataḥ sugandhipuṣpaiś ca yathāśaktyā samarcayet | pūjayet parayā bhaktyā svātmanaṃ ca nivedayet"
  - verse: 33
    devanagari: एवं यजनम् आख्यातम् अग्निकार्ये ऽप्य् अयं विधिः । कृतपूजाविधिः सम्यक् स्मरन् बीजम् प्रसिद्ध्यति ॥३३॥
    slp1: "evaM yajanam AKyAtam agnikArye 'py ayaM viDiH | kftapUjAviDiH samyak smaran bIjam prasidDyati"
    iast: "evaṃ yajanam ākhyātam agnikārye 'py ayaṃ vidhiḥ | kṛtapūjāvidhiḥ samyak smaran bījam prasiddhyati"
  - verse: 34
    devanagari: आद्यन्तरहितम् बीजं विकसत् तिथिमध्यगम् । हृत्पद्मान्तर्गतं ध्यायेत् सोमांशुं नित्यम् अभ्यस्येत् ॥३४॥
    slp1: "Adyantarahitam bIjaM vikasat tiTimaDyagam | hftpadmAntargataM DyAyet somAMSuM nityam aByasyet"
    iast: "ādyantarahitam bījaṃ vikasat tithimadhyagam | hṛtpadmāntargataṃ dhyāyet somāṃśuṃ nityam abhyasyet"
  - verse: 35
    devanagari: यान् यान् कामयते कामांस् तान् ताञ् च्छीघ्रम् अवाप्नुयात् । अज्ञः प्रत्यक्षताम् एति सर्वज्ञत्वं न संशयः ॥३५॥
    slp1: "yAn yAn kAmayate kAmAMs tAn tAY cCIGram avApnuyAt | ajYaH pratyakzatAm eti sarvajYatvaM na saMSayaH"
    iast: "yān yān kāmayate kāmāṃs tān tāñ cchīghram avāpnuyāt | ajñaḥ pratyakṣatām eti sarvajñatvaṃ na saṃśayaḥ"
  - verse: 36
    devanagari: एवं मन्त्रफलावप्तिर् इत्य् एतद् रुद्रयामलम् । एतद् अभ्यासतः सिद्धिः सर्वज्ञत्वम् अवाप्यते ॥३६॥
    slp1: "evaM mantraPalAvaptir ity etad rudrayAmalam | etad aByAsataH sidDiH sarvajYatvam avApyate"
    iast: "evaṃ mantraphalāvaptir ity etad rudrayāmalam | etad abhyāsataḥ siddhiḥ sarvajñatvam avāpyate"
