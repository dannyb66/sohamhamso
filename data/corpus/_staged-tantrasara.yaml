text:
  id: tantrasara
  slug: tantrasara
  title_sa: तन्त्रसार
  title_en: The Essence of the Tantra
  title_iast: Tantrasāra
  author: Abhinavagupta
  tradition: trika
  school: kashmir-shaivism
  era: "c. 975-1025 CE"
  source: "GRETIL (Göttingen Register of Electronic Texts in Indian Languages); Devanagari e-text input by Oliver Hellwig, based on the editio princeps: Mukund Rām Śāstrī (ed.), The Tantrasāra of Abhinava Gupta, Bombay: Nirnaya Sagara Press, 1918 (Kashmir Series of Texts and Studies 17)"
  source_url: "https://github.com/sanskrit/raw_etexts/blob/master/mixed/gretil_devanAgarI/1_sanskr/6_sastra/3_phil/saiva/abhinavagupta_tantrasara.md"
  source_revision: "GRETIL Devanagari conversion of the Oliver Hellwig e-text (KSTS 17, 1918, public domain); retrieved from the sanskrit/raw_etexts mirror, accessed 2026-06-12"
  license: CC-BY-NC
  pending_miri: true
  expected_verse_count: 748
  parent_text_id:
  manuscript_url:
  description: |
    The Tantrasāra ("Essence of the Tantra") by Abhinavagupta (fl.
    c. 975-1025 CE) is his own condensed prose redaction of the much
    larger verse Tantrāloka, distilling the doctrine and ritual of
    non-dual Trika (Kashmir) Śaivism into twenty-two āhnikas
    (chapters). It is a PROSE work: every editorial unit below carries
    section_type: 'prose' and a prose_block_ref; there are no verse
    meters (the embedded framing/summary ślokas are not separately
    metered out — they stay inside the prose flow exactly as the source
    numbers them).
    SOURCE: GRETIL Devanagari e-text (input by Oliver Hellwig), itself
    based verbatim on the editio princeps — Mukund Rām Śāstrī (ed.), The
    Tantrasāra of Abhinava Gupta, Bombay: Nirnaya Sagara Press, 1918
    (Kashmir Series of Texts and Studies 17), which is public domain.
    Every Devanagari character below is verbatim from that GRETIL file;
    the IAST is a mechanical Sanscript devanagari->iast transliteration
    of it (no emendation). Upstream quirks are preserved un-emended —
    e.g. āhnika 16's heading spells the ordinal "षोदशम्" (sic, for
    षोडशम्), and āhnika 22 skips block number 46 (the source's
    numbering jumps 22.45 -> 22.47); both are kept as-is.
    BLOCK-SEGMENTATION RULE: the GRETIL source already segments the text
    into numbered units, each closed by the marker "॥ अभ्त्स्_<āhnika>।
    <unit>" (Abhinavagupta Tantrasāra). Each such source-numbered unit
    is exactly one prose block here. prose_block_ref is "ah<A>.b<N>"
    where A is the āhnika and N is the source's own unit number for that
    āhnika (so refs inherit the source's gaps, e.g. ah22 has no b46),
    while verse_num is a contiguous 1.. counter per āhnika for stable
    URLs. These boundaries are editorial-but-source-derived and become
    permanent. Chapter titles are the source's bare ordinal headings
    ("तन्त्रसार, <ordinal> आह्निकम्") verbatim; topical āhnika names are
    NOT in this source and are deliberately omitted rather than composed.
    LICENSE: GRETIL redistributes under its reference-use terms tracking
    the public-domain 1918 KSTS print; pending_miri is set so the
    Muktabodha/critical-edition cross-check can be completed before
    deploy.

chapters:
- chapter: 1
  title_sa: तन्त्रसार, प्रथमम् आह्निकम्
  title_iast: "tantrasāra, prathamam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah1.b1"
    devanagari: |-
      विमलकलाश्रयाभिनवसृष्टिमहा जननी भरिततनुश् च पञ्चमुखगुप्तरुचिर् जनकः । तदुभययामलस्फुरितभावविसर्गमयं हृदयम् अनुत्तरामृतकुलं मम संस्फुरतात्
    iast: |-
      vimalakalāśrayābhinavasṛṣṭimahā jananī bharitatanuś ca pañcamukhaguptarucir janakaḥ | tadubhayayāmalasphuritabhāvavisargamayaṃ hṛdayam anuttarāmṛtakulaṃ mama saṃsphuratāt
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah1.b2"
    devanagari: |-
      विततस् तन्त्रालोको विगाहितुं नैव शक्यते सर्वैः । ऋजुवचनविरचितम् इदं तु तन्त्रसारं ततः शृणुत
    iast: |-
      vitatas tantrāloko vigāhituṃ naiva śakyate sarvaiḥ | ṛjuvacanaviracitam idaṃ tu tantrasāraṃ tataḥ śṛṇuta
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah1.b3"
    devanagari: |-
      श्रीशम्भुनाथभास्करचरणनिपातप्रभापगतसङ्कोचम् । अभिनवगुप्तहृदम्बुजम् एतद् विचिनुत महेशपूजनहेतोः
    iast: |-
      śrīśambhunāthabhāskaracaraṇanipātaprabhāpagatasaṅkocam | abhinavaguptahṛdambujam etad vicinuta maheśapūjanahetoḥ
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah1.b4"
    devanagari: |-
      इह ज्ञानं मोक्षकारणं बन्धनिमित्तस्य अज्ञानस्य विरोधकत्वात् द्विविधं च अज्ञानं बुद्धिगतं पौरुषं च तत्र बुद्धिगतम् अनिश्चयस्वभावं विपरीतनिश्चयात्मकं च । पौरुषं तु विकल्पस्वभावं सङ्कुचितप्रथात्मकं तद् एव च मूलकारणं संसारस्य इति वक्ष्यामो मलनिर्णये । तत्र पौरुषम् अज्ञानं दीक्षादिना निवर्तेतापि किं तु दीक्षापि बुद्धिगते अनध्यवसायात्मके अज्ञाने सति न सम्भवति हेयोपादेयनिश्चयपूर्वकत्वात् तत्त्वशुद्धिशिवयोजनारूपाया दीक्षाया इति । तत्र अध्यवसायात्मकं बुद्धिनिष्ठम् एव ज्ञानं प्रधानम् तद् एव च अभ्यस्यमानं पौरुषम् अपि अज्ञानं निहन्ति विकल्पसंविदभ्यासस्य अविकल्पान्ततापर्यवसानात् । विकल्पासङ्कुचितसंवित्प्रकाशरूपो ह्य् आत्मा शिवस्वभाव इति सर्वथा समस्तवस्तुनिष्ठं सम्यङ्निश्चयात्मकं ज्ञानम् उपादेयम् । तच् च शास्त्रपूर्वकम् । शास्त्रं च परमेश्वरभाषितम् एव प्रमाणम् । अपरशास्त्रोक्तानाम् अर्थानां तत्र वैविक्त्येन अभ्युपगमात् तदर्थातिरिक्तयुक्तिसिद्धनिरूपणाच् च तेन अपरागमोक्तं ज्ञानं तावत एव बन्धात् विमोचकम् न सर्वस्मात् सर्वस्मात् तु विमोचकं परमेश्वरशास्त्रं पञ्चस्रोतोमयं दशाष्टादशवस्वष्टभेदभिन्नम् । ततो ऽपि सर्वस्मात् सारं षडर्धशास्त्राणि । तेभ्यो ऽपि मालिनीविजयम् । तदन्तर्गतश् चार्थः सङ्कलय्याशक्यो निरूपयितुम् । न च अनिरूपितवस्तुतत्त्वस्य मुक्तत्वं मोचकत्वं वा शुद्धस्य ज्ञानस्यैव तथारूपत्वात् इति । स्वभ्यस्तज्ञानमूलत्वात् परपुरुषार्थस्य तत्सिद्धये इदम् आरभ्यते । अज्ञानं किल बन्धहेतुर् उदितः शास्त्रे मलं तत् स्मृतं पूर्णज्ञानकलोदये तद् अखिलं निर्मूलतां गच्छति । ध्वस्ताशेषमलात्मसंविदुदये मोक्षश् च तेनामुना शास्त्रेण प्रकटीकरोमि निखिलं यज् ज्ञेयतत्त्वं भवेत्
    iast: |-
      iha jñānaṃ mokṣakāraṇaṃ bandhanimittasya ajñānasya virodhakatvāt dvividhaṃ ca ajñānaṃ buddhigataṃ pauruṣaṃ ca tatra buddhigatam aniścayasvabhāvaṃ viparītaniścayātmakaṃ ca | pauruṣaṃ tu vikalpasvabhāvaṃ saṅkucitaprathātmakaṃ tad eva ca mūlakāraṇaṃ saṃsārasya iti vakṣyāmo malanirṇaye | tatra pauruṣam ajñānaṃ dīkṣādinā nivartetāpi kiṃ tu dīkṣāpi buddhigate anadhyavasāyātmake ajñāne sati na sambhavati heyopādeyaniścayapūrvakatvāt tattvaśuddhiśivayojanārūpāyā dīkṣāyā iti | tatra adhyavasāyātmakaṃ buddhiniṣṭham eva jñānaṃ pradhānam tad eva ca abhyasyamānaṃ pauruṣam api ajñānaṃ nihanti vikalpasaṃvidabhyāsasya avikalpāntatāparyavasānāt | vikalpāsaṅkucitasaṃvitprakāśarūpo hy ātmā śivasvabhāva iti sarvathā samastavastuniṣṭhaṃ samyaṅniścayātmakaṃ jñānam upādeyam | tac ca śāstrapūrvakam | śāstraṃ ca parameśvarabhāṣitam eva pramāṇam | aparaśāstroktānām arthānāṃ tatra vaiviktyena abhyupagamāt tadarthātiriktayuktisiddhanirūpaṇāc ca tena aparāgamoktaṃ jñānaṃ tāvata eva bandhāt vimocakam na sarvasmāt sarvasmāt tu vimocakaṃ parameśvaraśāstraṃ pañcasrotomayaṃ daśāṣṭādaśavasvaṣṭabhedabhinnam | tato 'pi sarvasmāt sāraṃ ṣaḍardhaśāstrāṇi | tebhyo 'pi mālinīvijayam | tadantargataś cārthaḥ saṅkalayyāśakyo nirūpayitum | na ca anirūpitavastutattvasya muktatvaṃ mocakatvaṃ vā śuddhasya jñānasyaiva tathārūpatvāt iti | svabhyastajñānamūlatvāt parapuruṣārthasya tatsiddhaye idam ārabhyate | ajñānaṃ kila bandhahetur uditaḥ śāstre malaṃ tat smṛtaṃ pūrṇajñānakalodaye tad akhilaṃ nirmūlatāṃ gacchati | dhvastāśeṣamalātmasaṃvidudaye mokṣaś ca tenāmunā śāstreṇa prakaṭīkaromi nikhilaṃ yaj jñeyatattvaṃ bhavet
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah1.b5"
    devanagari: |-
      तत्र इह स्वभाव एव परमोपादेयः स च सर्वभावानां प्रकाशरूप एव अप्रकाशस्य स्वभावतानुपपत्तेः स च नानेकः प्रकाशस्य तदितरस्वभावानुप्रवेशायोगे स्वभावभेदाभावात् देशकालाव् अपि च अस्य न भेदकौ तयोर् अपि तत्प्रकाशस्वभावत्वात् इति एक एव प्रकाशः स एव च संवित् अर्थप्रकाशरूपा हि संवित् इति सर्वेषाम् अत्र अविवाद एव । स च प्रकाशो न परतन्त्रः प्रकाश्यतैव हि पारतन्त्र्यम् प्रकाश्यता च प्रकाशान्तरापेक्षितैव न च प्रकाशान्तरं किञ्चित् अस्ति इति स्वतन्त्र एकः प्रकाशः स्वातन्त्र्याद् एव च देशकालाकारावच्छेदविरहात् व्यापको नित्यः सर्वाकारनिराकारस्वभावः तस्य च स्वातन्त्र्यम् आनन्दशक्तिः तच्चमत्कार इच्छाशक्तिः प्रकाशरूपता चिच्छक्तिः आमर्शात्मकता ज्ञानशक्तिः सर्वाकारयोगित्वं क्रियाशक्तिः इत्य् एवं मुख्याभिः शक्तिभिः युक्तो ऽपि वस्तुत इच्छाज्ञानक्रियाशक्तियुक्तः अनवच्छिन्नः प्रकाशो निजानन्दविश्रान्तः शिवरूपः स एव स्वातन्त्र्यात् आत्मानं सङ्कुचितम् अवभासयन् अणुर् इति उच्यते । पुनर् अपि च स्वात्मानं स्वतन्त्रतया प्रकाशयति येन अनवच्छिन्नप्रकाशशिवरूपतयैव प्रकाशते । तत्रापि स्वातन्त्र्यवशात् अनुपायम् एव स्वात्मानं प्रकाशयति सोपायं वा सोपायत्वे ऽपि इच्छा वा ज्ञानं वा क्रिया वा अभ्युपाय इति त्रैविध्यं शाम्भवशाक्ताणवभेदेन समावेशस्य तत्र चतुर्विधम् अपि एतद् रूपं क्रमेण अत्र उपदिश्यते । आत्मा प्रकाशवपुर् एष शिवः स्वतन्त्रः स्वातन्त्र्यनर्मरभसेन निजं स्वरूपम् । सञ्छाद्य यत् पुनर् अपि प्रथयेत पूर्णं तच् च क्रमाक्रमवशाद् अथवा त्रिभेदात्
    iast: |-
      tatra iha svabhāva eva paramopādeyaḥ sa ca sarvabhāvānāṃ prakāśarūpa eva aprakāśasya svabhāvatānupapatteḥ sa ca nānekaḥ prakāśasya taditarasvabhāvānupraveśāyoge svabhāvabhedābhāvāt deśakālāv api ca asya na bhedakau tayor api tatprakāśasvabhāvatvāt iti eka eva prakāśaḥ sa eva ca saṃvit arthaprakāśarūpā hi saṃvit iti sarveṣām atra avivāda eva | sa ca prakāśo na paratantraḥ prakāśyataiva hi pāratantryam prakāśyatā ca prakāśāntarāpekṣitaiva na ca prakāśāntaraṃ kiñcit asti iti svatantra ekaḥ prakāśaḥ svātantryād eva ca deśakālākārāvacchedavirahāt vyāpako nityaḥ sarvākāranirākārasvabhāvaḥ tasya ca svātantryam ānandaśaktiḥ taccamatkāra icchāśaktiḥ prakāśarūpatā cicchaktiḥ āmarśātmakatā jñānaśaktiḥ sarvākārayogitvaṃ kriyāśaktiḥ ity evaṃ mukhyābhiḥ śaktibhiḥ yukto 'pi vastuta icchājñānakriyāśaktiyuktaḥ anavacchinnaḥ prakāśo nijānandaviśrāntaḥ śivarūpaḥ sa eva svātantryāt ātmānaṃ saṅkucitam avabhāsayan aṇur iti ucyate | punar api ca svātmānaṃ svatantratayā prakāśayati yena anavacchinnaprakāśaśivarūpatayaiva prakāśate | tatrāpi svātantryavaśāt anupāyam eva svātmānaṃ prakāśayati sopāyaṃ vā sopāyatve 'pi icchā vā jñānaṃ vā kriyā vā abhyupāya iti traividhyaṃ śāmbhavaśāktāṇavabhedena samāveśasya tatra caturvidham api etad rūpaṃ krameṇa atra upadiśyate | ātmā prakāśavapur eṣa śivaḥ svatantraḥ svātantryanarmarabhasena nijaṃ svarūpam | sañchādya yat punar api prathayeta pūrṇaṃ tac ca kramākramavaśād athavā tribhedāt
- chapter: 2
  title_sa: तन्त्रसार, द्वितीयम् आह्निकम्
  title_iast: "tantrasāra, dvitīyam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah2.b1"
    devanagari: |-
      अथ अनुपायम् एव तावत् व्याख्यास्यामः
    iast: |-
      atha anupāyam eva tāvat vyākhyāsyāmaḥ
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah2.b2"
    devanagari: |-
      यदा खलु दृढशक्तिपाताविद्धः स्वयम् एव इत्थं विवेचयति सकृद् एव गुरुवचनम् अवधार्य तदा पुनर् उपायविरहितो नित्योदितः अस्य समावेशः
    iast: |-
      yadā khalu dṛḍhaśaktipātāviddhaḥ svayam eva itthaṃ vivecayati sakṛd eva guruvacanam avadhārya tadā punar upāyavirahito nityoditaḥ asya samāveśaḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah2.b3"
    devanagari: |-
      अत्र च तर्क एव योगाङ्गम् इति कथं विवेचयति इति चेत् उच्यते यो ऽयं परमेश्वरः स्वप्रकाशरूपः स्वात्मा तत्र किम् उपायेन क्रियते न स्वरूपलाभो नित्यत्वात् न ज्ञप्तिः स्वयम्प्रकाशमानत्वात् नावरणविगमः आवरणस्य कस्यचिद् अपि असम्भवात् न तदनुप्रवेशः अनुप्रवेष्टुः व्यतिरिक्तस्य अभावात्
    iast: |-
      atra ca tarka eva yogāṅgam iti kathaṃ vivecayati iti cet ucyate yo 'yaṃ parameśvaraḥ svaprakāśarūpaḥ svātmā tatra kim upāyena kriyate na svarūpalābho nityatvāt na jñaptiḥ svayamprakāśamānatvāt nāvaraṇavigamaḥ āvaraṇasya kasyacid api asambhavāt na tadanupraveśaḥ anupraveṣṭuḥ vyatiriktasya abhāvāt
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah2.b4"
    devanagari: |-
      कश् चात्र उपायः तस्यापि व्यतिरिक्तस्य अनुपपत्तेः तस्मात् समस्तम् इदम् एकं चिन्मात्रतत्त्वं कालेन अकलितं देशेन अपरिच्छिन्नम् उपाधिभिर् अम्लानम् आकृतिभिर् अनियन्त्रितं शब्दैर् असन्दिष्टं प्रमाणैर् अप्रपञ्चितं कालादेः प्रमाणपर्यन्तस्य स्वेच्छयैव स्वरूपलाभनिमित्तं च स्वतन्त्रम् आनन्दघनं तत्त्वं तद् एव च अहम् तत्रैव अन्तर् मयि विश्वं प्रतिबिम्बितम् एवं दृढं विविञ्चानस्य शश्वद् एव पारमेश्वरः समावेशो निरुपायक एव तस्य च न मन्त्रपूजाध्यानचर्यादिनियन्त्रणा काचित्
    iast: |-
      kaś cātra upāyaḥ tasyāpi vyatiriktasya anupapatteḥ tasmāt samastam idam ekaṃ cinmātratattvaṃ kālena akalitaṃ deśena aparicchinnam upādhibhir amlānam ākṛtibhir aniyantritaṃ śabdair asandiṣṭaṃ pramāṇair aprapañcitaṃ kālādeḥ pramāṇaparyantasya svecchayaiva svarūpalābhanimittaṃ ca svatantram ānandaghanaṃ tattvaṃ tad eva ca aham tatraiva antar mayi viśvaṃ pratibimbitam evaṃ dṛḍhaṃ viviñcānasya śaśvad eva pārameśvaraḥ samāveśo nirupāyaka eva tasya ca na mantrapūjādhyānacaryādiniyantraṇā kācit
- chapter: 3
  title_sa: तन्त्रसार, तृतीयम् आह्निकम्
  title_iast: "tantrasāra, tṛtīyam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah3.b1"
    devanagari: |-
      यद् एतत् प्रकाशरूपं शिवतत्त्वम् उक्तम् तत्र अखण्डमण्डले यदा प्रवेष्टुं न शक्नोति तदा स्वातन्त्र्यशक्तिम् एव अधिकां पश्यन् निर्विकल्पम् एव भैरवसमावेशम् अनुभवति अयं च अस्य उपदेशः सर्वम् इदं भावजातं बोधगगने प्रतिबिम्बमात्रं प्रतिबिम्बलक्षणोपेतत्वात् इदं हि प्रतिबिम्बस्य लक्षणं यत् भेदेन भासितम् अशक्तम् अन्यव्यामिश्रत्वेनैव भाति तत् प्रतिबिम्बम् मुखरूपम् इव दर्पणे रस इव दन्तोदके गन्ध इव घ्राण मिथुनस्पर्श इव आनन्देन्द्रिये शूलकुन्तादिस्पर्शो वा अन्तःस्पर्शनेन्द्रिये प्रतिश्रुत्केव व्योम्नि
    iast: |-
      yad etat prakāśarūpaṃ śivatattvam uktam tatra akhaṇḍamaṇḍale yadā praveṣṭuṃ na śaknoti tadā svātantryaśaktim eva adhikāṃ paśyan nirvikalpam eva bhairavasamāveśam anubhavati ayaṃ ca asya upadeśaḥ sarvam idaṃ bhāvajātaṃ bodhagagane pratibimbamātraṃ pratibimbalakṣaṇopetatvāt idaṃ hi pratibimbasya lakṣaṇaṃ yat bhedena bhāsitam aśaktam anyavyāmiśratvenaiva bhāti tat pratibimbam mukharūpam iva darpaṇe rasa iva dantodake gandha iva ghrāṇa mithunasparśa iva ānandendriye śūlakuntādisparśo vā antaḥsparśanendriye pratiśrutkeva vyomni
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah3.b2"
    devanagari: |-
      न हि स रसो मुख्यः तत्कार्यव्याधिशमनाद्यदृष्टेः
    iast: |-
      na hi sa raso mukhyaḥ tatkāryavyādhiśamanādyadṛṣṭeḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah3.b3"
    devanagari: |-
      नापि गन्धस्पर्शौ मुख्यौ गुणिनः तत्र अभावे तयोर् अयोगात् कार्यपरम्परानारम्भात् च
    iast: |-
      nāpi gandhasparśau mukhyau guṇinaḥ tatra abhāve tayor ayogāt kāryaparamparānārambhāt ca
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah3.b4"
    devanagari: |-
      न च तौ न स्तः देहोद्धूलनविसर्गादिदर्शनात्
    iast: |-
      na ca tau na staḥ dehoddhūlanavisargādidarśanāt
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah3.b5"
    devanagari: |-
      शब्दो ऽपि न मुख्यः को ऽपि वक्ति इति आगच्छन्त्या इव प्रतिश्रुत्कायाः श्रवणात्
    iast: |-
      śabdo 'pi na mukhyaḥ ko 'pi vakti iti āgacchantyā iva pratiśrutkāyāḥ śravaṇāt
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah3.b6"
    devanagari: |-
      एवं यथा एतत् प्रतिबिम्बितं भाति तथैव विश्वं परमेश्वरप्रकाशे
    iast: |-
      evaṃ yathā etat pratibimbitaṃ bhāti tathaiva viśvaṃ parameśvaraprakāśe
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah3.b7"
    devanagari: |-
      ननु अत्र बिम्बं किं स्यात् माभूत् किञ्चित्
    iast: |-
      nanu atra bimbaṃ kiṃ syāt mābhūt kiñcit
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah3.b8"
    devanagari: |-
      ननु किम् अकारणकं तत् हन्त तर्हि हेतुप्रश्नः तत् किं बिम्बवाचोयुक्त्या हेतुश् च परमेश्वरशक्तिर् एव स्वातन्त्र्यापरपर्याया भविष्यति विश्वप्रतिबिम्बधारित्वाच् च विश्वात्मकत्वं भगवतः संविन्मयं हि विश्वं चैतन्यस्य व्यक्तिस्थानम् इति तद् एव हि विश्वम् अत्र प्रतीपम् इति प्रतिबिम्बधारित्वम् अस्य तच् च तावत् विश्वात्मकत्वं परमेश्वरस्य स्वरूपं न अनामृष्टं भवति चित्स्वभावस्य स्वरूपानामर्शनानुपपत्तेः
    iast: |-
      nanu kim akāraṇakaṃ tat hanta tarhi hetupraśnaḥ tat kiṃ bimbavācoyuktyā hetuś ca parameśvaraśaktir eva svātantryāparaparyāyā bhaviṣyati viśvapratibimbadhāritvāc ca viśvātmakatvaṃ bhagavataḥ saṃvinmayaṃ hi viśvaṃ caitanyasya vyaktisthānam iti tad eva hi viśvam atra pratīpam iti pratibimbadhāritvam asya tac ca tāvat viśvātmakatvaṃ parameśvarasya svarūpaṃ na anāmṛṣṭaṃ bhavati citsvabhāvasya svarūpānāmarśanānupapatteḥ
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah3.b9"
    devanagari: |-
      स्वरूपानामर्शने हि वस्तुतो जडतैव स्यात् आमर्शश् च अयं न साकेतिकः अपि तु चित्स्वभावतामात्रनान्तरीयकः परनादगर्भ उक्तः स च यावान् विश्वव्यवस्थापकः परमेश्वरस्य शक्तिकलापः तावन्तम् आमृशति
    iast: |-
      svarūpānāmarśane hi vastuto jaḍataiva syāt āmarśaś ca ayaṃ na sāketikaḥ api tu citsvabhāvatāmātranāntarīyakaḥ paranādagarbha uktaḥ sa ca yāvān viśvavyavasthāpakaḥ parameśvarasya śaktikalāpaḥ tāvantam āmṛśati
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah3.b10"
    devanagari: |-
      तत्र मुख्यास् तावत् तिस्रः परमेश्वरस्य शक्तयः अनुत्तरेच्छोन्मेष इति तद् एव परामर्शत्रयम् अ इ उ इति एतस्माद् एव त्रितयात् सर्वः शक्तिप्रपञ्चः चर्यते अनुत्तर एव हि विश्रान्तिर् आनन्दः इच्छायाम् एव विश्रान्तिः ईशनम् उन्मेष एव हि विश्रान्तिर् ऊर्मिः यः क्रियाशक्तेः प्रारम्भः तद् एव परामर्शत्रयम् आ ई ऊ इति
    iast: |-
      tatra mukhyās tāvat tisraḥ parameśvarasya śaktayaḥ anuttarecchonmeṣa iti tad eva parāmarśatrayam a i u iti etasmād eva tritayāt sarvaḥ śaktiprapañcaḥ caryate anuttara eva hi viśrāntir ānandaḥ icchāyām eva viśrāntiḥ īśanam unmeṣa eva hi viśrāntir ūrmiḥ yaḥ kriyāśakteḥ prārambhaḥ tad eva parāmarśatrayam ā ī ū iti
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah3.b11"
    devanagari: |-
      अत्र च प्राच्यं परामर्शत्रयं प्रकाशभागसारत्वात् सूर्यात्मकं चरमं परामर्शत्रयं विश्रान्तिस्वभावाह्लादप्राधान्यात् सोमात्मकम् इयति यावत् कर्मांशस्य अनुप्रवेशो नास्ति
    iast: |-
      atra ca prācyaṃ parāmarśatrayaṃ prakāśabhāgasāratvāt sūryātmakaṃ caramaṃ parāmarśatrayaṃ viśrāntisvabhāvāhlādaprādhānyāt somātmakam iyati yāvat karmāṃśasya anupraveśo nāsti
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah3.b12"
    devanagari: |-
      यदा तु इच्छायाम् ईशने च कर्म अनुप्रविशति यत् तत् इष्यमाणम् ईश्यमाणम् इति च उच्यते तदा अस्य द्वौ भेदौ प्रकाशमात्रेण रश्रुतिः विश्रान्त्या लश्रुतिः रलयोः प्रकाशस्तम्भस्वभावत्वात् इष्यमाणं च न बाह्यवत् स्फुटम् स्फुटरूपत्वे तद् एव निर्माणं स्यात् न इच्छा ईशनं वा अतः अस्फुटत्वात् एव श्रुतिमात्रं रलयोः न व्यञ्जनवत् स्थितिः
    iast: |-
      yadā tu icchāyām īśane ca karma anupraviśati yat tat iṣyamāṇam īśyamāṇam iti ca ucyate tadā asya dvau bhedau prakāśamātreṇa raśrutiḥ viśrāntyā laśrutiḥ ralayoḥ prakāśastambhasvabhāvatvāt iṣyamāṇaṃ ca na bāhyavat sphuṭam sphuṭarūpatve tad eva nirmāṇaṃ syāt na icchā īśanaṃ vā ataḥ asphuṭatvāt eva śrutimātraṃ ralayoḥ na vyañjanavat sthitiḥ
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah3.b13"
    devanagari: |-
      तद् एतद् वर्णचतुष्टयम् उभयच्छायाधारित्वात् नपुंसकम् ऋ ॠ ऌ ॡ इति
    iast: |-
      tad etad varṇacatuṣṭayam ubhayacchāyādhāritvāt napuṃsakam ṛ ṝ ḷ ḹ iti
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah3.b14"
    devanagari: |-
      अनुत्तरानन्दयोः इच्छादिषु यदा प्रसरः तदा वर्णद्वयम् ए ॐ इति
    iast: |-
      anuttarānandayoḥ icchādiṣu yadā prasaraḥ tadā varṇadvayam e oṃ iti
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah3.b15"
    devanagari: |-
      तत्रापि पुनर् अनुत्तरानन्दसङ्घट्टात् वर्णद्वयम् ऐ औ इति
    iast: |-
      tatrāpi punar anuttarānandasaṅghaṭṭāt varṇadvayam ai au iti
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah3.b16"
    devanagari: |-
      सा इयं क्रियाशक्तिः तद् एव च वर्णचतुष्टयम् ए ऐ ओ औ इति
    iast: |-
      sā iyaṃ kriyāśaktiḥ tad eva ca varṇacatuṣṭayam e ai o au iti
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah3.b17"
    devanagari: |-
      ततः पुनः क्रियाशक्त्यन्ते सर्वं कार्यभूतं यावत् अनुत्तरे प्रवेक्ष्यति तावद् एव पूर्वं संवेदनसारतया प्रकाशमात्रत्वेन बिन्दुतया आस्ते अम् इति
    iast: |-
      tataḥ punaḥ kriyāśaktyante sarvaṃ kāryabhūtaṃ yāvat anuttare pravekṣyati tāvad eva pūrvaṃ saṃvedanasāratayā prakāśamātratvena bindutayā āste am iti
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah3.b18"
    devanagari: |-
      ततस् तत्रैव अनुत्तरस्य विसर्गो जायते अः इति
    iast: |-
      tatas tatraiva anuttarasya visargo jāyate aḥ iti
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah3.b19"
    devanagari: |-
      एवं षोडशकं परामर्शानां बीजस्वरूपम् उच्यते
    iast: |-
      evaṃ ṣoḍaśakaṃ parāmarśānāṃ bījasvarūpam ucyate
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah3.b20"
    devanagari: |-
      तदुत्थं व्यञ्जनात्मकं योनिरूपम्
    iast: |-
      tadutthaṃ vyañjanātmakaṃ yonirūpam
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah3.b21"
    devanagari: |-
      तत्र अनुत्तरात् कवर्गः श्रद्धायाः इच्छायाः चवर्गः सकर्मिकाया इच्छाया द्वौ टवर्गस् तवर्गश् च उन्मेषात् पवर्गः शक्तिपञ्चकयोगात् पञ्चकत्वम्
    iast: |-
      tatra anuttarāt kavargaḥ śraddhāyāḥ icchāyāḥ cavargaḥ sakarmikāyā icchāyā dvau ṭavargas tavargaś ca unmeṣāt pavargaḥ śaktipañcakayogāt pañcakatvam
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah3.b22"
    devanagari: |-
      इच्छाया एव त्रिविधाया य र लाः उन्मेषात् वकारः इच्छाया एव त्रिविधायाः श ष साः विसर्गात् हकारः योनिसंयोगजः क्षकारः
    iast: |-
      icchāyā eva trividhāyā ya ra lāḥ unmeṣāt vakāraḥ icchāyā eva trividhāyāḥ śa ṣa sāḥ visargāt hakāraḥ yonisaṃyogajaḥ kṣakāraḥ
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah3.b23"
    devanagari: |-
      इत्य् एव एष भगवान् अनुत्तर एव कुलेश्वररूपः
    iast: |-
      ity eva eṣa bhagavān anuttara eva kuleśvararūpaḥ
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah3.b24"
    devanagari: |-
      तस्य च एकैव कौलिकी विसर्गशक्तिः यया आनन्दरूपात् प्रभृति इयता बहिःसृष्टिपर्यन्तेन प्रस्पन्दतः वर्गादिपरामर्शा एव बहिस् तत्त्वरूपतां प्राप्ताः
    iast: |-
      tasya ca ekaiva kaulikī visargaśaktiḥ yayā ānandarūpāt prabhṛti iyatā bahiḥsṛṣṭiparyantena praspandataḥ vargādiparāmarśā eva bahis tattvarūpatāṃ prāptāḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah3.b25"
    devanagari: |-
      स च एष विसर्गस् त्रिधा आणवः चित्तविश्रान्तिरूपः शाक्तः चित्तसम्बोधलक्षणः शाम्भवः चित्तप्रलयरूपः इति
    iast: |-
      sa ca eṣa visargas tridhā āṇavaḥ cittaviśrāntirūpaḥ śāktaḥ cittasambodhalakṣaṇaḥ śāmbhavaḥ cittapralayarūpaḥ iti
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah3.b26"
    devanagari: |-
      एवं विसर्ग एव विश्वजनने भगवतः शक्तिः
    iast: |-
      evaṃ visarga eva viśvajanane bhagavataḥ śaktiḥ
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah3.b27"
    devanagari: |-
      इत्य् एवम् इयतो यदा निर्विभागतया एव परामर्शः तदा एक एव भगवान् बीजयोनितया भागशः परामर्शे शक्तिमान् शक्तिश् च
    iast: |-
      ity evam iyato yadā nirvibhāgatayā eva parāmarśaḥ tadā eka eva bhagavān bījayonitayā bhāgaśaḥ parāmarśe śaktimān śaktiś ca
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah3.b28"
    devanagari: |-
      पृथक् अष्टकपरामर्शे चक्रेश्वरसाहित्येन नववर्गः एकैकपरामर्शप्राधान्ये पञ्चाशदात्मकता
    iast: |-
      pṛthak aṣṭakaparāmarśe cakreśvarasāhityena navavargaḥ ekaikaparāmarśaprādhānye pañcāśadātmakatā
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah3.b29"
    devanagari: |-
      तत्रापि सम्भवद्भागभेदपरामर्शने एकाशीतिरूपत्वम्
    iast: |-
      tatrāpi sambhavadbhāgabhedaparāmarśane ekāśītirūpatvam
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah3.b30"
    devanagari: |-
      वस्तुतस् तु षट् एव परामर्शाः प्रसरणप्रतिसञ्चरणयोगेन द्वादश भवन्तः परमेश्वरस्य विश्वशक्तिपूर्णत्वं पुष्णन्ति
    iast: |-
      vastutas tu ṣaṭ eva parāmarśāḥ prasaraṇapratisañcaraṇayogena dvādaśa bhavantaḥ parameśvarasya viśvaśaktipūrṇatvaṃ puṣṇanti
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah3.b31"
    devanagari: |-
      ता एव एताः परामर्शरूपत्वात् शक्तयो भगवत्यः श्रीकालिका इति निरुक्ताः
    iast: |-
      tā eva etāḥ parāmarśarūpatvāt śaktayo bhagavatyaḥ śrīkālikā iti niruktāḥ
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah3.b32"
    devanagari: |-
      एते च शक्तिरूपा एव शुद्धाः परामर्शाः शुद्धविद्यायां परापररूपत्वेन मायोन्मेषमात्रसङ्कोचात् विद्याविद्येश्वररूपतां भजन्ते
    iast: |-
      ete ca śaktirūpā eva śuddhāḥ parāmarśāḥ śuddhavidyāyāṃ parāpararūpatvena māyonmeṣamātrasaṅkocāt vidyāvidyeśvararūpatāṃ bhajante
  - verse_num: 33
    section_type: prose
    prose_block_ref: "ah3.b33"
    devanagari: |-
      मायायां पुनः स्फटीभूतभेदविभागा मायीयवर्णतां भजन्ते ये पश्यन्तीमध्यमावैखरीषु व्यावहारिकत्वम् आसाद्य बहीरूपतत्त्वस्वभावतापत्तिपर्यन्ताः ते च मायीया अपि शरीरकल्पत्वेन यदा दृश्यन्ते यदा च तेषाम् उक्तनयैर् एतैः जीवितस्थानीयैः शुद्धैः परामर्शैः प्रत्युज्जीवनं क्रियते तदा ते सवीर्या भवन्ति ते च तादृशा भोगमोक्षप्रदाः इत्य् एवं सकलपरामर्शविश्रान्तिमात्ररूपं प्रतिबिम्बितसमस्ततत्त्वभूतभुवनभेदम् आत्मानं पश्यतो निर्विकल्पतया शाम्भवेन समावेशेन जीवन्मुक्तता
    iast: |-
      māyāyāṃ punaḥ sphaṭībhūtabhedavibhāgā māyīyavarṇatāṃ bhajante ye paśyantīmadhyamāvaikharīṣu vyāvahārikatvam āsādya bahīrūpatattvasvabhāvatāpattiparyantāḥ te ca māyīyā api śarīrakalpatvena yadā dṛśyante yadā ca teṣām uktanayair etaiḥ jīvitasthānīyaiḥ śuddhaiḥ parāmarśaiḥ pratyujjīvanaṃ kriyate tadā te savīryā bhavanti te ca tādṛśā bhogamokṣapradāḥ ity evaṃ sakalaparāmarśaviśrāntimātrarūpaṃ pratibimbitasamastatattvabhūtabhuvanabhedam ātmānaṃ paśyato nirvikalpatayā śāmbhavena samāveśena jīvanmuktatā
  - verse_num: 34
    section_type: prose
    prose_block_ref: "ah3.b34"
    devanagari: |-
      अत्रापि पूर्ववत् न मन्त्रादियन्त्रणा काचिद् इति
    iast: |-
      atrāpi pūrvavat na mantrādiyantraṇā kācid iti
- chapter: 4
  title_sa: तन्त्रसार, चतुर्थम् आह्निकम्
  title_iast: "tantrasāra, caturtham āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah4.b1"
    devanagari: |-
      तत्र यदा विकल्पं क्रमेण संस्कुरुते समनन्तरोक्तस्वरूपप्रवेशाय तदा भावनाक्रमस्य सत्तर्कसदागमसद्गुरूपदेशपूर्वकस्य अस्ति उपयोगः
    iast: |-
      tatra yadā vikalpaṃ krameṇa saṃskurute samanantaroktasvarūpapraveśāya tadā bhāvanākramasya sattarkasadāgamasadgurūpadeśapūrvakasya asti upayogaḥ
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah4.b2"
    devanagari: |-
      तथा हि विकल्पबलात् एव जन्तवो बद्धम् आत्मानम् अभिमन्यन्ते स अभिमानः संसारप्रतिबन्धहेतुः अतः प्रतिद्वन्द्विरूपो विकल्प उदितः संसारहेतुं विकल्पं दलयति इति अभ्युदयहेतुः
    iast: |-
      tathā hi vikalpabalāt eva jantavo baddham ātmānam abhimanyante sa abhimānaḥ saṃsārapratibandhahetuḥ ataḥ pratidvandvirūpo vikalpa uditaḥ saṃsārahetuṃ vikalpaṃ dalayati iti abhyudayahetuḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah4.b3"
    devanagari: |-
      स च एवंरूपः समस्तेभ्यः परिच्छिन्नस्वभावेभ्यः शिवान्तेभ्यः तत्त्वेभ्यो यत् उत्तीर्णम् अपरिच्छिन्नसंविन्मात्ररूपं तद् एव च परमार्थः तत् वस्तुव्यवस्थास्थानं तत् विश्वस्य ओजः तेन प्राणिति विश्वम् तद् एव च अहम् अतो विश्वोत्तीर्णो विश्वात्मा च अहम् इति
    iast: |-
      sa ca evaṃrūpaḥ samastebhyaḥ paricchinnasvabhāvebhyaḥ śivāntebhyaḥ tattvebhyo yat uttīrṇam aparicchinnasaṃvinmātrarūpaṃ tad eva ca paramārthaḥ tat vastuvyavasthāsthānaṃ tat viśvasya ojaḥ tena prāṇiti viśvam tad eva ca aham ato viśvottīrṇo viśvātmā ca aham iti
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah4.b4"
    devanagari: |-
      स च अयं मायान्धानां न उत्पद्यते सत्तर्कादीनाम् अभावात्
    iast: |-
      sa ca ayaṃ māyāndhānāṃ na utpadyate sattarkādīnām abhāvāt
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah4.b5"
    devanagari: |-
      वैष्णवाद्या हि तावन्मात्र एव आगमे रागतत्त्वेन नियमिता इति न ऊर्ध्वदर्शने ऽपि तदुन्मुखतां भजन्ते ततः सत्तर्कसदागमसद्गुरूपदेशद्वेषिण एव
    iast: |-
      vaiṣṇavādyā hi tāvanmātra eva āgame rāgatattvena niyamitā iti na ūrdhvadarśane 'pi tadunmukhatāṃ bhajante tataḥ sattarkasadāgamasadgurūpadeśadveṣiṇa eva
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah4.b6"
    devanagari: |-
      यथोक्तं पारमेश्वरे वैष्णवाद्याः समस्तास् ते विद्यारागेण रञ्जिताः
    iast: |-
      yathoktaṃ pārameśvare vaiṣṇavādyāḥ samastās te vidyārāgeṇa rañjitāḥ
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah4.b7"
    devanagari: |-
      न विन्दन्ति परं तत्त्वं सर्वज्ञज्ञानवर्जिताः इति
    iast: |-
      na vindanti paraṃ tattvaṃ sarvajñajñānavarjitāḥ iti
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah4.b8"
    devanagari: |-
      तस्मात् शाम्भवदृड्ःअशक्तिपाताविद्धा एव सदागमादिक्रमेण विकल्पं संस्कृत्य परं स्वरूपं प्रविशन्ति
    iast: |-
      tasmāt śāmbhavadṛḍḥaśaktipātāviddhā eva sadāgamādikrameṇa vikalpaṃ saṃskṛtya paraṃ svarūpaṃ praviśanti
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah4.b9"
    devanagari: |-
      ननु इत्थं परं तत्त्वं विकल्प्यरूपं स्यात् मैवम् विकल्पस्य द्वैताधिवासभङ्गमात्रे चरितार्थत्वात् परं तत्त्वं तु सर्वत्र सर्वरूपतया स्वप्रकाशम् एव इति न तत्र विकल्पः कस्यैचित् उपक्रियायै खण्डनायै वा
    iast: |-
      nanu itthaṃ paraṃ tattvaṃ vikalpyarūpaṃ syāt maivam vikalpasya dvaitādhivāsabhaṅgamātre caritārthatvāt paraṃ tattvaṃ tu sarvatra sarvarūpatayā svaprakāśam eva iti na tatra vikalpaḥ kasyaicit upakriyāyai khaṇḍanāyai vā
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah4.b10"
    devanagari: |-
      तत्र अतिदृढशक्तिपाताविद्धस्य स्वयम् एव सांसिद्धिकतया सत्तर्क उदेति यो ऽसौ देवीभिः दीक्षित इति उच्यते
    iast: |-
      tatra atidṛḍhaśaktipātāviddhasya svayam eva sāṃsiddhikatayā sattarka udeti yo 'sau devībhiḥ dīkṣita iti ucyate
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah4.b11"
    devanagari: |-
      अन्यस्य आगमक्रमेण इत्यादि सविस्तरं शक्तिपातप्रकाशने वक्ष्यामः
    iast: |-
      anyasya āgamakrameṇa ityādi savistaraṃ śaktipātaprakāśane vakṣyāmaḥ
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah4.b12"
    devanagari: |-
      किं तु गुरोर् आगमनिरूपणे व्यापारः आगमस्य च निःशङ्कसजातीयतत्प्रबन्धप्रसवनिबन्धनसमुचितविकल्पोदये व्यापारः तथाविधविकल्पप्रबन्ध एव सत्तर्क इति उक्तः स एव च भावना भण्यते अस्फुटत्वात् भूतम् अपि अर्थम् अभूतम् इव स्फुटत्वापादनेन भाव्यते यया इति
    iast: |-
      kiṃ tu guror āgamanirūpaṇe vyāpāraḥ āgamasya ca niḥśaṅkasajātīyatatprabandhaprasavanibandhanasamucitavikalpodaye vyāpāraḥ tathāvidhavikalpaprabandha eva sattarka iti uktaḥ sa eva ca bhāvanā bhaṇyate asphuṭatvāt bhūtam api artham abhūtam iva sphuṭatvāpādanena bhāvyate yayā iti
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah4.b13"
    devanagari: |-
      न च अत्र सत्तर्कात् शुद्धविद्याप्रकाशरूपात् ऋते अन्यत् योगाङ्गं साक्षात् उपायः तपःप्रभृतेः नियमवर्गस्य अहिंसादेश् च यमप्रकारस्य पूरकादेः प्राणायामवर्गस्य वेद्यमात्रनिष्ठत्वेन क इव संविदि व्यापारः
    iast: |-
      na ca atra sattarkāt śuddhavidyāprakāśarūpāt ṛte anyat yogāṅgaṃ sākṣāt upāyaḥ tapaḥprabhṛteḥ niyamavargasya ahiṃsādeś ca yamaprakārasya pūrakādeḥ prāṇāyāmavargasya vedyamātraniṣṭhatvena ka iva saṃvidi vyāpāraḥ
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah4.b14"
    devanagari: |-
      प्रत्याहारो ऽपि करणभूमिम् एव सातिशयां कुर्यात् ध्यानधारणासमाधयो ऽपि यथोत्तरम् अभ्यासक्रमेण निर्वर्त्यमाना ध्येयवस्तुतादात्म्यं ध्यातुः वितरेयुः
    iast: |-
      pratyāhāro 'pi karaṇabhūmim eva sātiśayāṃ kuryāt dhyānadhāraṇāsamādhayo 'pi yathottaram abhyāsakrameṇa nirvartyamānā dhyeyavastutādātmyaṃ dhyātuḥ vitareyuḥ
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah4.b15"
    devanagari: |-
      अभ्यासश् च परे तत्त्वे शिवात्मनि स्वस्वभावे न सम्भवत्य् एव
    iast: |-
      abhyāsaś ca pare tattve śivātmani svasvabhāve na sambhavaty eva
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah4.b16"
    devanagari: |-
      संविद्रूढस्य प्राणबुद्धिदेहनिष्ठीकरणरूपो हि अभ्यासः भारोद्वहनशास्त्रार्थबोधनृत्ताभ्यासवत् संविद्रूपे तु न किञ्चित् आदातव्यं न अपसरणीयम् इति कथम् अभ्यासः
    iast: |-
      saṃvidrūḍhasya prāṇabuddhidehaniṣṭhīkaraṇarūpo hi abhyāsaḥ bhārodvahanaśāstrārthabodhanṛttābhyāsavat saṃvidrūpe tu na kiñcit ādātavyaṃ na apasaraṇīyam iti katham abhyāsaḥ
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah4.b17"
    devanagari: |-
      किं तर्केणापि इति चेत् उक्तम् अत्र द्वैताधिवासनिरासप्रकार एव अयं न तु अन्यत् किञ्चिद् इति
    iast: |-
      kiṃ tarkeṇāpi iti cet uktam atra dvaitādhivāsanirāsaprakāra eva ayaṃ na tu anyat kiñcid iti
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah4.b18"
    devanagari: |-
      लौकिके ऽपि वा अभ्यासे चिदात्मत्वेन सर्वरूपस्य तस्य तस्य देहादेः अभिमतरूपताप्रकटीकरणं तदितररूपन्यग्भावनं च इति एष एव अभ्यासार्थः
    iast: |-
      laukike 'pi vā abhyāse cidātmatvena sarvarūpasya tasya tasya dehādeḥ abhimatarūpatāprakaṭīkaraṇaṃ taditararūpanyagbhāvanaṃ ca iti eṣa eva abhyāsārthaḥ
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah4.b19"
    devanagari: |-
      परतत्त्वे तु न किञ्चित् अपास्यम् इति उक्तम्
    iast: |-
      paratattve tu na kiñcit apāsyam iti uktam
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah4.b20"
    devanagari: |-
      द्वैताधिवासो ऽपि नाम न कश्चन पृथक् वस्तुभूतः अपि तु स्वरूपाख्यातिमात्रं तत् अतो द्वैतापासनं विकल्पेन क्रियत इत्य् उक्तेः
    iast: |-
      dvaitādhivāso 'pi nāma na kaścana pṛthak vastubhūtaḥ api tu svarūpākhyātimātraṃ tat ato dvaitāpāsanaṃ vikalpena kriyata ity ukteḥ
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah4.b21"
    devanagari: |-
      अयं परमार्थः स्वरूपं प्रकाशमानम् अख्यातिरूपत्वं स्वयं स्वातन्त्र्यात् गृहीतं क्रमेण प्रोज्झ्य विकासोन्मुखम् अथ विकसत् अथ विकसितम् इत्य् अनेन क्रमेण प्रकाशते तथा प्रकाशनम् अपि परमेश्वरस्य स्वरूपम् एव तस्मात् न अत्र योगाङ्गानि साक्षात् उपायः
    iast: |-
      ayaṃ paramārthaḥ svarūpaṃ prakāśamānam akhyātirūpatvaṃ svayaṃ svātantryāt gṛhītaṃ krameṇa projjhya vikāsonmukham atha vikasat atha vikasitam ity anena krameṇa prakāśate tathā prakāśanam api parameśvarasya svarūpam eva tasmāt na atra yogāṅgāni sākṣāt upāyaḥ
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah4.b22"
    devanagari: |-
      तर्कं तु अनुगृह्णीयुर् अपि सत्तर्क एव साक्षात् तत्र उपायः स एव च शुद्धविद्या स च बहुप्रकारतया संस्कृतो भवति तद्यथा यागो होमो जपो व्रतं योग इति तत्र भावानां सर्वेषां परमेश्वर एव स्थितिः नान्यत् व्यतिरिक्तम् अस्ति इति विकल्परूढिसिद्धये परमेश्वर एव सर्वभावार्पणं यागः स च हृद्यत्वात् ये संविदनुप्रवेशं स्वयम् एव भजन्ते तेषां सुशकं परमेश्वरे अर्पणम् इत्य् अभिप्रायेण हृद्यानां कुसुमतर्पणगन्धादीनां बहिर् उपयोग उक्तः
    iast: |-
      tarkaṃ tu anugṛhṇīyur api sattarka eva sākṣāt tatra upāyaḥ sa eva ca śuddhavidyā sa ca bahuprakāratayā saṃskṛto bhavati tadyathā yāgo homo japo vrataṃ yoga iti tatra bhāvānāṃ sarveṣāṃ parameśvara eva sthitiḥ nānyat vyatiriktam asti iti vikalparūḍhisiddhaye parameśvara eva sarvabhāvārpaṇaṃ yāgaḥ sa ca hṛdyatvāt ye saṃvidanupraveśaṃ svayam eva bhajante teṣāṃ suśakaṃ parameśvare arpaṇam ity abhiprāyeṇa hṛdyānāṃ kusumatarpaṇagandhādīnāṃ bahir upayoga uktaḥ
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah4.b23"
    devanagari: |-
      सर्वे भावाः परमेश्वरतेजोमया इति रूढविकल्पप्राप्त्यै परमेशसंविदनलतेजसि समस्तभावग्रासरसिकताभिमते तत्तेजोमात्रावशेषत्वसहसमस्तभावविलापनं होमः
    iast: |-
      sarve bhāvāḥ parameśvaratejomayā iti rūḍhavikalpaprāptyai parameśasaṃvidanalatejasi samastabhāvagrāsarasikatābhimate tattejomātrāvaśeṣatvasahasamastabhāvavilāpanaṃ homaḥ
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah4.b24"
    devanagari: |-
      तथा उभयात्मकपरामर्शोदयार्थं बाह्याभ्यन्तरादिप्रमेयरूपभिन्नभावानपेक्षयैव एवंविधं तत् परं तत्त्वं स्वस्वभावभूतम् इति अन्तः परामर्शनं जपः
    iast: |-
      tathā ubhayātmakaparāmarśodayārthaṃ bāhyābhyantarādiprameyarūpabhinnabhāvānapekṣayaiva evaṃvidhaṃ tat paraṃ tattvaṃ svasvabhāvabhūtam iti antaḥ parāmarśanaṃ japaḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah4.b25"
    devanagari: |-
      सर्वत्र सर्वदा निरुपायपरमेश्वराभिमानलाभाय परमेश्वरसमताभिमानेन देहस्यापि घटादेर् अपि अवलोकनं व्रतम्
    iast: |-
      sarvatra sarvadā nirupāyaparameśvarābhimānalābhāya parameśvarasamatābhimānena dehasyāpi ghaṭāder api avalokanaṃ vratam
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah4.b26"
    devanagari: |-
      यथोक्तं श्रीनन्दिशिखायाम् सर्वसाम्यं परं व्रतम् इति
    iast: |-
      yathoktaṃ śrīnandiśikhāyām sarvasāmyaṃ paraṃ vratam iti
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah4.b27"
    devanagari: |-
      इत्थं विचित्रैः शुद्धविद्यांशरूपैः विकल्पैः यत् अनपेक्षितविकल्पं स्वाभाविकं परमार्थतत्त्वं प्रकाशते तस्यैव सनातनतथाविधप्रकाशमात्रतारूढये तत्स्वरूपानुसन्धानात्मा विकल्पविशेषो योगः
    iast: |-
      itthaṃ vicitraiḥ śuddhavidyāṃśarūpaiḥ vikalpaiḥ yat anapekṣitavikalpaṃ svābhāvikaṃ paramārthatattvaṃ prakāśate tasyaiva sanātanatathāvidhaprakāśamātratārūḍhaye tatsvarūpānusandhānātmā vikalpaviśeṣo yogaḥ
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah4.b28"
    devanagari: |-
      तत्र परमेश्वरः पूर्णसंवित्स्वभावः पूर्णतैव अस्य शक्तिः कुलं सामर्थ्यम् ऊर्मिः हृदयं सारं स्पन्दः विभूतिः त्रीशिका काली कर्षणी चण्डी वाणी भोगो दृक् नित्या इत्यादिभिः आगमभाषाभिः तत्तदन्वर्थप्रवृत्ताभिः अभिधीयते तेन तेन रूपेण ध्यायिनां हृदि आस्ताम् इति
    iast: |-
      tatra parameśvaraḥ pūrṇasaṃvitsvabhāvaḥ pūrṇataiva asya śaktiḥ kulaṃ sāmarthyam ūrmiḥ hṛdayaṃ sāraṃ spandaḥ vibhūtiḥ trīśikā kālī karṣaṇī caṇḍī vāṇī bhogo dṛk nityā ityādibhiḥ āgamabhāṣābhiḥ tattadanvarthapravṛttābhiḥ abhidhīyate tena tena rūpeṇa dhyāyināṃ hṛdi āstām iti
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah4.b29"
    devanagari: |-
      सा च समग्रशक्तितादर्शनेन पूर्णतासंवित् प्रकाशते
    iast: |-
      sā ca samagraśaktitādarśanena pūrṇatāsaṃvit prakāśate
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah4.b30"
    devanagari: |-
      शक्तयश् च अस्य असङ्ख्येयाः
    iast: |-
      śaktayaś ca asya asaṅkhyeyāḥ
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah4.b31"
    devanagari: |-
      किं बहुना यत् विश्वं ता अस्य शक्तयः ताः कथम् उपदेष्टुं शक्याः इति
    iast: |-
      kiṃ bahunā yat viśvaṃ tā asya śaktayaḥ tāḥ katham upadeṣṭuṃ śakyāḥ iti
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah4.b32"
    devanagari: |-
      तिसृषु तावत् विश्वं समाप्यते यया इदं शिवादिधरण्यन्तम् अविकल्प्यसंविन्मात्ररूपतया बिभर्ति च पश्यति च भासयति च परमेश्वरः सा अस्य श्रीपरशक्तिः
    iast: |-
      tisṛṣu tāvat viśvaṃ samāpyate yayā idaṃ śivādidharaṇyantam avikalpyasaṃvinmātrarūpatayā bibharti ca paśyati ca bhāsayati ca parameśvaraḥ sā asya śrīparaśaktiḥ
  - verse_num: 33
    section_type: prose
    prose_block_ref: "ah4.b33"
    devanagari: |-
      यया च दर्पणहस्त्यादिवत् भेदाभेदाभ्यां सा अस्य श्रीपरापरशक्तिः
    iast: |-
      yayā ca darpaṇahastyādivat bhedābhedābhyāṃ sā asya śrīparāparaśaktiḥ
  - verse_num: 34
    section_type: prose
    prose_block_ref: "ah4.b34"
    devanagari: |-
      यया परस्परविविक्तात्मना भेदेनैव सा अस्य श्रीमदपरशक्तिः
    iast: |-
      yayā parasparaviviktātmanā bhedenaiva sā asya śrīmadaparaśaktiḥ
  - verse_num: 35
    section_type: prose
    prose_block_ref: "ah4.b35"
    devanagari: |-
      एतत् त्रिविधं यया धारणम् आत्मन्य् एव क्रोडीकारेण अनुसन्धानात्मना ग्रसते सा अस्य भगवती श्रीपरैव श्रीमन्मातृसद्भावकालकर्षिण्यादिशब्दान्तरनिरुक्ता
    iast: |-
      etat trividhaṃ yayā dhāraṇam ātmany eva kroḍīkāreṇa anusandhānātmanā grasate sā asya bhagavatī śrīparaiva śrīmanmātṛsadbhāvakālakarṣiṇyādiśabdāntaraniruktā
  - verse_num: 36
    section_type: prose
    prose_block_ref: "ah4.b36"
    devanagari: |-
      ता एताः चतस्रः शक्तयः स्वातन्त्र्यात् प्रत्येकं त्रिधैव वर्तन्ते
    iast: |-
      tā etāḥ catasraḥ śaktayaḥ svātantryāt pratyekaṃ tridhaiva vartante
  - verse_num: 37
    section_type: prose
    prose_block_ref: "ah4.b37"
    devanagari: |-
      सृष्टौ स्थितौ संहारे च इति द्वादश भवन्ति
    iast: |-
      sṛṣṭau sthitau saṃhāre ca iti dvādaśa bhavanti
  - verse_num: 38
    section_type: prose
    prose_block_ref: "ah4.b38"
    devanagari: |-
      तथा हि संवित् पूर्वम् अन्तर् एव भावं कलयति ततो बहिर् अपि स्फुटतया कलयति तत्रैव रक्तिमयतां गृहीत्वा ततः तम् एव भावम् अन्तर् उपसञ्जिहीर्षया कलयति ततश् च तदुपसंहारविघ्नभूतां शङ्कां निर्मिणोति च ग्रसते च ग्रस्तशङ्कांशं भावभागम् आत्मनि उपसंहारेण कलयति तत उपसंहर्तृत्वं ममेदं रूपम् इत्य् अपि स्वभावम् एव कलयति तत उपसंहर्तृस्वभावकलने कस्यचिद् भावस्य वासनात्मना अवस्थितिं कस्यचित् तु संविन्मात्रावशेषतां कलयति ततः स्वरूपकलनानान्तरीयकत्वेनैव करणचक्रं कलयति ततः करणेश्वरम् अपि कलयति ततः कल्पितं मायीयं प्रमातृरूपम् अपि कलयति सङ्कोचत्यागोन्मुखविकासग्रहणरसिकम् अपि प्रमातारं कलयति अतो विकसितम् अपि रूपं कलयति इति एता द्वादश भगवत्यः संविदः प्रमातॄन् एकं वापि उद्दिश्य युगपत् क्रमेण द्विशः त्रिश इत्यादिस्थित्यापि उदयभागिन्यः चक्रवद् आवर्तमाना बहिर् अपि मासकलाराश्यादिक्रमेण अन्ततो वा घटपटादिक्रमेणापि भासमानाः चक्रेश्वरस्य स्वातन्त्र्यं पुष्णत्यः श्रीकालीशब्दवाच्याः
    iast: |-
      tathā hi saṃvit pūrvam antar eva bhāvaṃ kalayati tato bahir api sphuṭatayā kalayati tatraiva raktimayatāṃ gṛhītvā tataḥ tam eva bhāvam antar upasañjihīrṣayā kalayati tataś ca tadupasaṃhāravighnabhūtāṃ śaṅkāṃ nirmiṇoti ca grasate ca grastaśaṅkāṃśaṃ bhāvabhāgam ātmani upasaṃhāreṇa kalayati tata upasaṃhartṛtvaṃ mamedaṃ rūpam ity api svabhāvam eva kalayati tata upasaṃhartṛsvabhāvakalane kasyacid bhāvasya vāsanātmanā avasthitiṃ kasyacit tu saṃvinmātrāvaśeṣatāṃ kalayati tataḥ svarūpakalanānāntarīyakatvenaiva karaṇacakraṃ kalayati tataḥ karaṇeśvaram api kalayati tataḥ kalpitaṃ māyīyaṃ pramātṛrūpam api kalayati saṅkocatyāgonmukhavikāsagrahaṇarasikam api pramātāraṃ kalayati ato vikasitam api rūpaṃ kalayati iti etā dvādaśa bhagavatyaḥ saṃvidaḥ pramātṝn ekaṃ vāpi uddiśya yugapat krameṇa dviśaḥ triśa ityādisthityāpi udayabhāginyaḥ cakravad āvartamānā bahir api māsakalārāśyādikrameṇa antato vā ghaṭapaṭādikrameṇāpi bhāsamānāḥ cakreśvarasya svātantryaṃ puṣṇatyaḥ śrīkālīśabdavācyāḥ
  - verse_num: 39
    section_type: prose
    prose_block_ref: "ah4.b39"
    devanagari: |-
      कलनं च गतिः क्षेपो ज्ञानं गणनं भोगीकरणं शब्दनं स्वात्मलयीकरणं च
    iast: |-
      kalanaṃ ca gatiḥ kṣepo jñānaṃ gaṇanaṃ bhogīkaraṇaṃ śabdanaṃ svātmalayīkaraṇaṃ ca
  - verse_num: 40
    section_type: prose
    prose_block_ref: "ah4.b40"
    devanagari: |-
      यद् आहुः श्रीभूतिराजगुरवः क्षेपाज् ज्ञानाच् च काली कलनवशतयाथ इति
    iast: |-
      yad āhuḥ śrībhūtirājaguravaḥ kṣepāj jñānāc ca kālī kalanavaśatayātha iti
  - verse_num: 41
    section_type: prose
    prose_block_ref: "ah4.b41"
    devanagari: |-
      एष च अर्थः तत्र तत्र मद्विरचिते विवरणे प्रकरणस्तोत्रादौ वितत्य वीक्ष्यः
    iast: |-
      eṣa ca arthaḥ tatra tatra madviracite vivaraṇe prakaraṇastotrādau vitatya vīkṣyaḥ
  - verse_num: 42
    section_type: prose
    prose_block_ref: "ah4.b42"
    devanagari: |-
      न अतिरहस्यम् एकत्र ख्याप्यं न च सर्वथा गोप्यम् इति हि अस्मद्गुरवः
    iast: |-
      na atirahasyam ekatra khyāpyaṃ na ca sarvathā gopyam iti hi asmadguravaḥ
  - verse_num: 43
    section_type: prose
    prose_block_ref: "ah4.b43"
    devanagari: |-
      तद् एवम् यद् उक्तं यागहोमादि तत् एवंविधे महेश्वर एव मन्तव्यम्
    iast: |-
      tad evam yad uktaṃ yāgahomādi tat evaṃvidhe maheśvara eva mantavyam
  - verse_num: 44
    section_type: prose
    prose_block_ref: "ah4.b44"
    devanagari: |-
      सर्वे हि हेयम् एव उपादेयभूमिरूपं विष्णुतः प्रभृति शिवान्तं परमशिवतया पश्यन्ति तच् च मिथ्यादर्शनम् अवश्यत्याज्यम् अनुत्तरयोगिभिर् इति तदर्थम् एव विद्याधिपतेः अनुभवस्तोत्रे महान् संरम्भः एवंविधे यागादौ योगान्ते च पञ्चके प्रत्येकं बहुप्रकारं निरूढिः यथा यथा भवति तथैव आचरेत् न तु भक्ष्याभक्ष्यशुद्ध्यशुद्ध्यादिविवेचनया वस्तुधर्मोज्झितया कल्पनामात्रसारया स्वात्मा खेदनीय इति उक्तं श्रीपूर्वादौ न हि शुद्धिः वस्तुनो रूपं नीलत्ववत् अन्यत्र तस्यैव अशुद्धिचोदनात् दानस्येव दीक्षितत्वे चोदनातः तस्य तत् तत्र अशुद्धम् इति चेत् चोदनान्तरे ऽपि तुल्यं चोदनान्तरम् असत् तद्बाधितत्वात् इति चेत् न शिवचोदनाया एव बाधकत्वं युक्तिसिद्धं सर्वज्ञानोत्तराद्यनन्तागमसिद्धं च इति वक्ष्यामः
    iast: |-
      sarve hi heyam eva upādeyabhūmirūpaṃ viṣṇutaḥ prabhṛti śivāntaṃ paramaśivatayā paśyanti tac ca mithyādarśanam avaśyatyājyam anuttarayogibhir iti tadartham eva vidyādhipateḥ anubhavastotre mahān saṃrambhaḥ evaṃvidhe yāgādau yogānte ca pañcake pratyekaṃ bahuprakāraṃ nirūḍhiḥ yathā yathā bhavati tathaiva ācaret na tu bhakṣyābhakṣyaśuddhyaśuddhyādivivecanayā vastudharmojjhitayā kalpanāmātrasārayā svātmā khedanīya iti uktaṃ śrīpūrvādau na hi śuddhiḥ vastuno rūpaṃ nīlatvavat anyatra tasyaiva aśuddhicodanāt dānasyeva dīkṣitatve codanātaḥ tasya tat tatra aśuddham iti cet codanāntare 'pi tulyaṃ codanāntaram asat tadbādhitatvāt iti cet na śivacodanāyā eva bādhakatvaṃ yuktisiddhaṃ sarvajñānottarādyanantāgamasiddhaṃ ca iti vakṣyāmaḥ
  - verse_num: 45
    section_type: prose
    prose_block_ref: "ah4.b45"
    devanagari: |-
      तस्मात् वैदिकात् प्रभृति पारमेश्वरसिद्धान्ततन्त्रकुलोच्छुष्मादिशास्त्रोक्तो ऽपि यो नियमो विधिः वा निषेधो वा सो ऽत्र यावद् अकिञ्चित्कर एव इति सिद्धम्
    iast: |-
      tasmāt vaidikāt prabhṛti pārameśvarasiddhāntatantrakulocchuṣmādiśāstrokto 'pi yo niyamo vidhiḥ vā niṣedho vā so 'tra yāvad akiñcitkara eva iti siddham
  - verse_num: 46
    section_type: prose
    prose_block_ref: "ah4.b46"
    devanagari: |-
      तथैव च उक्तं श्रीपूर्वादौ वितत्य तन्त्रालोकात् अन्वेष्यम्
    iast: |-
      tathaiva ca uktaṃ śrīpūrvādau vitatya tantrālokāt anveṣyam
- chapter: 5
  title_sa: तन्त्रसार, पञ्चमम् आह्निकम्
  title_iast: "tantrasāra, pañcamam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah5.b1"
    devanagari: |-
      तत्र यदा विकल्पः स्वयम् एव संस्कारम् आत्मनि उपायान्तरनिरपेक्षतयैव कर्तुं प्रभवति तदा असौ पाशवव्यापारात् प्रच्युतः शुद्धविद्यानुग्रहेण परमेशशक्तिरूपताम् आपन्न उपायतया अवलम्ब्यमानः शाक्तं ज्ञानम् आविर्भावयति
    iast: |-
      tatra yadā vikalpaḥ svayam eva saṃskāram ātmani upāyāntaranirapekṣatayaiva kartuṃ prabhavati tadā asau pāśavavyāpārāt pracyutaḥ śuddhavidyānugraheṇa parameśaśaktirūpatām āpanna upāyatayā avalambyamānaḥ śāktaṃ jñānam āvirbhāvayati
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah5.b2"
    devanagari: |-
      तद् एतच् च निर्णीतम् अनन्तर एव आह्निके
    iast: |-
      tad etac ca nirṇītam anantara eva āhnike
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah5.b3"
    devanagari: |-
      यदा तु उपायान्तरम् असौ स्वसंस्कारार्थं विकल्पो ऽपेक्षते तदा बुद्धिप्राणदेहघटादिकान् परिमितरूपान् उपायत्वेन गृह्णन् अणुत्वं प्राप्त आणवं ज्ञानम् आविर्भावयति तत्र बुद्धिः ध्यानात्मिका प्राणः स्थूलः सूक्ष्मश् च आद्य उच्चारणात्मा उच्चारणं च नाम पञ्च प्राणाद्या वृत्तयः सूक्ष्मस् तु वर्णशब्दवाच्यो वक्ष्यते देहः सन्निवेशविशेषात्मा करणशब्दवाच्यः घटादयो बाह्याः कुम्भस्थण्डिललिङ्गपूजाद्युपायतया कीर्तयिष्यमाणाः
    iast: |-
      yadā tu upāyāntaram asau svasaṃskārārthaṃ vikalpo 'pekṣate tadā buddhiprāṇadehaghaṭādikān parimitarūpān upāyatvena gṛhṇan aṇutvaṃ prāpta āṇavaṃ jñānam āvirbhāvayati tatra buddhiḥ dhyānātmikā prāṇaḥ sthūlaḥ sūkṣmaś ca ādya uccāraṇātmā uccāraṇaṃ ca nāma pañca prāṇādyā vṛttayaḥ sūkṣmas tu varṇaśabdavācyo vakṣyate dehaḥ sanniveśaviśeṣātmā karaṇaśabdavācyaḥ ghaṭādayo bāhyāḥ kumbhasthaṇḍilaliṅgapūjādyupāyatayā kīrtayiṣyamāṇāḥ
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah5.b4"
    devanagari: |-
      तत्र ध्यानं तावत् इह उचितम् उपदेक्ष्यामः यत् एतत् स्वप्रकाशं सर्वतत्त्वान्तर्भूतं परं तत्त्वम् उक्तं तद् एव निजहृदयबोधे ध्यात्वा तत्र प्रमातृप्रमाणप्रमेयरूपस्य वह्न्यर्कसोमत्रितयस्य सङ्घट्टं ध्यायेत् यावत् असौ महाभैरवाग्निः ध्यानवातसमिद्धाकारः सम्पद्यते तस्य प्राक्तनशक्तिज्वालाद्वादशकपरिवृतस्य चक्रात्मनः चक्षुरादीनाम् अन्यतमसुषिरद्वारेण निःसृतस्य बाह्ये ग्राह्यात्मनि विश्रान्तं चिन्तयेत् तेन च विश्रान्तेन प्रथमं तद्बाह्यं सोमरूपतया सृष्टिक्रमेण प्रपूरितं ततः अर्करूपतया स्थित्या अवभासितं ततो ऽपि संहारवह्निरूपतया विलापितं ततः अनुत्तरात्मताम् आपादितं ध्यायेत्
    iast: |-
      tatra dhyānaṃ tāvat iha ucitam upadekṣyāmaḥ yat etat svaprakāśaṃ sarvatattvāntarbhūtaṃ paraṃ tattvam uktaṃ tad eva nijahṛdayabodhe dhyātvā tatra pramātṛpramāṇaprameyarūpasya vahnyarkasomatritayasya saṅghaṭṭaṃ dhyāyet yāvat asau mahābhairavāgniḥ dhyānavātasamiddhākāraḥ sampadyate tasya prāktanaśaktijvālādvādaśakaparivṛtasya cakrātmanaḥ cakṣurādīnām anyatamasuṣiradvāreṇa niḥsṛtasya bāhye grāhyātmani viśrāntaṃ cintayet tena ca viśrāntena prathamaṃ tadbāhyaṃ somarūpatayā sṛṣṭikrameṇa prapūritaṃ tataḥ arkarūpatayā sthityā avabhāsitaṃ tato 'pi saṃhāravahnirūpatayā vilāpitaṃ tataḥ anuttarātmatām āpāditaṃ dhyāyet
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah5.b5"
    devanagari: |-
      एवं तच् चक्रं समस्तबाह्यवस्त्वभेदपरिपूर्णं सम्पद्यते
    iast: |-
      evaṃ tac cakraṃ samastabāhyavastvabhedaparipūrṇaṃ sampadyate
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah5.b6"
    devanagari: |-
      ततो वासनाशेषान् अपि भावान् तेन चक्रेण इत्थं कृतान् ध्यायेत्
    iast: |-
      tato vāsanāśeṣān api bhāvān tena cakreṇa itthaṃ kṛtān dhyāyet
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah5.b7"
    devanagari: |-
      एवम् अस्य अनवरतं ध्यायिनः स्वसंविन्मात्रपरमार्थान् सृष्टिस्थितिसंहारप्रबन्धान् सृष्ट्यादिस्वातन्त्र्यपरमार्थत्वं च स्वसंविदो निश्चिन्वतः सद्य एव भैरवीभावः
    iast: |-
      evam asya anavarataṃ dhyāyinaḥ svasaṃvinmātraparamārthān sṛṣṭisthitisaṃhāraprabandhān sṛṣṭyādisvātantryaparamārthatvaṃ ca svasaṃvido niścinvataḥ sadya eva bhairavībhāvaḥ
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah5.b8"
    devanagari: |-
      अभ्यासात् तु सर्वेप्सितसिद्ध्यादयो ऽपि
    iast: |-
      abhyāsāt tu sarvepsitasiddhyādayo 'pi
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah5.b9"
    devanagari: |-
      स्वप्रकाशं समस्तात्मतत्त्वं मात्रादिकं त्रयम्
    iast: |-
      svaprakāśaṃ samastātmatattvaṃ mātrādikaṃ trayam
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah5.b10"
    devanagari: |-
      अन्तःकृत्य स्थितं ध्यायेद् धृदयानन्दधामनि
    iast: |-
      antaḥkṛtya sthitaṃ dhyāyed dhṛdayānandadhāmani
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah5.b11"
    devanagari: |-
      तद् द्वादशमहाशक्तिरश्मिचक्रेश्वरं विभुम्
    iast: |-
      tad dvādaśamahāśaktiraśmicakreśvaraṃ vibhum
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah5.b12"
    devanagari: |-
      व्योमभिर् निःसरद् बाह्ये ध्यायेत् सृष्ट्यादिभावकम्
    iast: |-
      vyomabhir niḥsarad bāhye dhyāyet sṛṣṭyādibhāvakam
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah5.b13"
    devanagari: |-
      तद् ग्रस्तसर्वबाह्यान्तर्भावमण्डलम् आत्मनि
    iast: |-
      tad grastasarvabāhyāntarbhāvamaṇḍalam ātmani
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah5.b14"
    devanagari: |-
      विश्राम्यन् भावयेद् योगी स्याद् एवम् आत्मनः प्रथा
    iast: |-
      viśrāmyan bhāvayed yogī syād evam ātmanaḥ prathā
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah5.b15"
    devanagari: |-
      इति सङ्ग्रहश्लोकाः
    iast: |-
      iti saṅgrahaślokāḥ
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah5.b16"
    devanagari: |-
      इति ध्यानम्
    iast: |-
      iti dhyānam
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah5.b17"
    devanagari: |-
      तत्र प्राणम् उच्चिचारयिषुः पूर्वं हृदय एव शून्ये विश्राम्यति ततो बाह्ये प्राणोदयात् ततो ऽपि बाह्यं प्रति अपानचन्द्रापूरणेन सर्वात्मतां पश्यति ततः अन्यनिराकाङ्क्षो भवति ततः समानोदयात् सङ्घट्टविश्रान्तिम् अनुभवति तत उदानवह्न्युदये मातृमेयादिकलनां ग्रसते
    iast: |-
      tatra prāṇam uccicārayiṣuḥ pūrvaṃ hṛdaya eva śūnye viśrāmyati tato bāhye prāṇodayāt tato 'pi bāhyaṃ prati apānacandrāpūraṇena sarvātmatāṃ paśyati tataḥ anyanirākāṅkṣo bhavati tataḥ samānodayāt saṅghaṭṭaviśrāntim anubhavati tata udānavahnyudaye mātṛmeyādikalanāṃ grasate
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah5.b18"
    devanagari: |-
      तद्ग्रासकवह्निप्रशमे व्यानोदये सर्वावच्छेदवन्ध्यः स्फुरति
    iast: |-
      tadgrāsakavahnipraśame vyānodaye sarvāvacchedavandhyaḥ sphurati
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah5.b19"
    devanagari: |-
      एवं शून्यात् प्रभृति व्यानान्तं या एता विश्रान्तयः ता एव निजानन्दो निरानन्दः परानन्दो ब्रह्मानन्दो महानन्दः चिदानन्द इति षट् आनन्दभूमय उपदिष्टाः यासाम् एकः अनुसन्धाता उदयास्तमयविहीनः अन्तर्विश्रान्तिपरमार्थरूपो जगदानन्दः
    iast: |-
      evaṃ śūnyāt prabhṛti vyānāntaṃ yā etā viśrāntayaḥ tā eva nijānando nirānandaḥ parānando brahmānando mahānandaḥ cidānanda iti ṣaṭ ānandabhūmaya upadiṣṭāḥ yāsām ekaḥ anusandhātā udayāstamayavihīnaḥ antarviśrāntiparamārtharūpo jagadānandaḥ
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah5.b20"
    devanagari: |-
      तत् एतासु उच्चारभूमिषु प्रत्येकं द्व्यादिशः सर्वशो वा विश्राम्य अन्यत् तद्देहप्राणादिव्यतिरिक्तं विश्रान्तितत्त्वम् आसादयति
    iast: |-
      tat etāsu uccārabhūmiṣu pratyekaṃ dvyādiśaḥ sarvaśo vā viśrāmya anyat taddehaprāṇādivyatiriktaṃ viśrāntitattvam āsādayati
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah5.b21"
    devanagari: |-
      तद् एव सृष्टिसंहारबीजोच्चारणरहस्यम् अनुसन्दधत् विकल्पं संस्कुर्यात् आसु च विश्रान्तिषु प्रत्येकं पञ्च अवस्था भवन्ति प्रवेशतारतम्यात्
    iast: |-
      tad eva sṛṣṭisaṃhārabījoccāraṇarahasyam anusandadhat vikalpaṃ saṃskuryāt āsu ca viśrāntiṣu pratyekaṃ pañca avasthā bhavanti praveśatāratamyāt
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah5.b22"
    devanagari: |-
      तत्र प्राग् आनन्दः पूर्णतांशस्पर्शात् तत उद्भवः क्षणं निःशरीरतायां रूढेः ततः कम्पः स्वबलाक्रान्तौ देहतादात्म्यशैथिल्यात् ततो निद्रा बहिर्मुखत्वविलयात्
    iast: |-
      tatra prāg ānandaḥ pūrṇatāṃśasparśāt tata udbhavaḥ kṣaṇaṃ niḥśarīratāyāṃ rūḍheḥ tataḥ kampaḥ svabalākrāntau dehatādātmyaśaithilyāt tato nidrā bahirmukhatvavilayāt
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah5.b23"
    devanagari: |-
      इत्थम् अनात्मनि आत्मभावे लीने स्वात्मनः सर्वमयत्वात् आत्मनि अनात्मभावो विलीयते इति अतो घूर्णिः महाव्याप्त्युदयात्
    iast: |-
      ittham anātmani ātmabhāve līne svātmanaḥ sarvamayatvāt ātmani anātmabhāvo vilīyate iti ato ghūrṇiḥ mahāvyāptyudayāt
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah5.b24"
    devanagari: |-
      ता एता जाग्रदादिभूमयः तुर्यातीतान्ताः
    iast: |-
      tā etā jāgradādibhūmayaḥ turyātītāntāḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah5.b25"
    devanagari: |-
      एताश् च भूमयः त्रिकोणकन्दहृत्तालूर्ध्वकुण्डलिनीचक्रप्रवेशे भवन्ति
    iast: |-
      etāś ca bhūmayaḥ trikoṇakandahṛttālūrdhvakuṇḍalinīcakrapraveśe bhavanti
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah5.b26"
    devanagari: |-
      एवम् उच्चारविश्रान्तौ यत् परं स्पन्दनं गलिताशेषवेद्यं यच् च उन्मिषद् वेद्यं यच् च उन्मिषितवेद्यं तद् एव लिङ्गत्रयम् इति वक्ष्यामः स्वावसरे
    iast: |-
      evam uccāraviśrāntau yat paraṃ spandanaṃ galitāśeṣavedyaṃ yac ca unmiṣad vedyaṃ yac ca unmiṣitavedyaṃ tad eva liṅgatrayam iti vakṣyāmaḥ svāvasare
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah5.b27"
    devanagari: |-
      परं चात्र लिङ्गं योगिनीहृदयम्
    iast: |-
      paraṃ cātra liṅgaṃ yoginīhṛdayam
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah5.b28"
    devanagari: |-
      तत्र मुख्या स्पन्दनरूपता सङ्कोचविकासात्मतया यामलरूपतोदयेन विसर्गकलाविश्रान्तिलाभात् इत्य् अलम्
    iast: |-
      tatra mukhyā spandanarūpatā saṅkocavikāsātmatayā yāmalarūpatodayena visargakalāviśrāntilābhāt ity alam
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah5.b29"
    devanagari: |-
      अप्रकाशः अत्र अनुप्रवेशः
    iast: |-
      aprakāśaḥ atra anupraveśaḥ
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah5.b30"
    devanagari: |-
      पूर्वं स्वबोधे तदनु प्रमेये विश्रम्य मेयं परिपूरयेत
    iast: |-
      pūrvaṃ svabodhe tadanu prameye viśramya meyaṃ paripūrayeta
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah5.b31"
    devanagari: |-
      पूर्णे ऽत्र विश्राम्यति मातृमेयविभागम् आश्व् एव स संहरेत
    iast: |-
      pūrṇe 'tra viśrāmyati mātṛmeyavibhāgam āśv eva sa saṃhareta
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah5.b32"
    devanagari: |-
      व्याप्त्याथ विश्राम्यति ता इमाः स्युः शून्येन साकं षडुपायभूम्यः
    iast: |-
      vyāptyātha viśrāmyati tā imāḥ syuḥ śūnyena sākaṃ ṣaḍupāyabhūmyaḥ
  - verse_num: 33
    section_type: prose
    prose_block_ref: "ah5.b33"
    devanagari: |-
      प्राणादयो व्याननपश्चिमास् तल्लीनश् च जाग्रत् प्रभृति प्रपञ्चः
    iast: |-
      prāṇādayo vyānanapaścimās tallīnaś ca jāgrat prabhṛti prapañcaḥ
  - verse_num: 34
    section_type: prose
    prose_block_ref: "ah5.b34"
    devanagari: |-
      अभ्यासनिष्ठो ऽत्र तु सृष्टिसंहृद्विमर्शधामन्य् अचिरेण रोहेत्
    iast: |-
      abhyāsaniṣṭho 'tra tu sṛṣṭisaṃhṛdvimarśadhāmany acireṇa rohet
  - verse_num: 35
    section_type: prose
    prose_block_ref: "ah5.b35"
    devanagari: |-
      इति आन्तरश्लोकाः
    iast: |-
      iti āntaraślokāḥ
  - verse_num: 36
    section_type: prose
    prose_block_ref: "ah5.b36"
    devanagari: |-
      इति उच्चारणम्
    iast: |-
      iti uccāraṇam
  - verse_num: 37
    section_type: prose
    prose_block_ref: "ah5.b37"
    devanagari: |-
      अस्मिन् एव उच्चारे स्फुरन् अव्यक्तानुकृतिप्रायो ध्वनिः वर्णः तस्य सृष्टिसंहारबीजे मुख्यं रूपं तदभ्यासात् परसंवित्तिलाभः तथाहि कादौ मान्ते साच्के अनच्के वा अन्तरुच्चारिते स्मृते वा समविशिष्टः संवित्स्पन्दस्पर्शः समयानपेक्षित्वात् परिपूर्णः समयोपेक्षिणो ऽपि शब्दाः तदर्थभावका मनोराज्यादिवत् अनुत्तरसंवित्स्पर्शात् एकीकृतहृत्कण्ठोष्ठो द्वादशान्तद्वयं हृदयं च एकीकुर्यात् इति वर्णरहस्यम्
    iast: |-
      asmin eva uccāre sphuran avyaktānukṛtiprāyo dhvaniḥ varṇaḥ tasya sṛṣṭisaṃhārabīje mukhyaṃ rūpaṃ tadabhyāsāt parasaṃvittilābhaḥ tathāhi kādau mānte sācke anacke vā antaruccārite smṛte vā samaviśiṣṭaḥ saṃvitspandasparśaḥ samayānapekṣitvāt paripūrṇaḥ samayopekṣiṇo 'pi śabdāḥ tadarthabhāvakā manorājyādivat anuttarasaṃvitsparśāt ekīkṛtahṛtkaṇṭhoṣṭho dvādaśāntadvayaṃ hṛdayaṃ ca ekīkuryāt iti varṇarahasyam
  - verse_num: 38
    section_type: prose
    prose_block_ref: "ah5.b38"
    devanagari: |-
      अन्तःस्पर्शद्विमर्शानन्तरसमुद्भूतं सितपीताद्यान्तरं वर्णम् उद्भाव्यमानं संविदम् अनुभावयति इति केचित्
    iast: |-
      antaḥsparśadvimarśānantarasamudbhūtaṃ sitapītādyāntaraṃ varṇam udbhāvyamānaṃ saṃvidam anubhāvayati iti kecit
  - verse_num: 39
    section_type: prose
    prose_block_ref: "ah5.b39"
    devanagari: |-
      वाच्यविरहेण संवित्स्पन्दाद् इन्द्वर्कगतिनिरोधाभ्याम्
    iast: |-
      vācyaviraheṇa saṃvitspandād indvarkagatinirodhābhyām
  - verse_num: 40
    section_type: prose
    prose_block_ref: "ah5.b40"
    devanagari: |-
      यस्य तु समसम्प्रवेशात् पूर्णां चिद्बीजपिण्डवर्णविधौ
    iast: |-
      yasya tu samasampraveśāt pūrṇāṃ cidbījapiṇḍavarṇavidhau
  - verse_num: 41
    section_type: prose
    prose_block_ref: "ah5.b41"
    devanagari: |-
      इति आन्तरश्लोकः
    iast: |-
      iti āntaraślokaḥ
  - verse_num: 42
    section_type: prose
    prose_block_ref: "ah5.b42"
    devanagari: |-
      इति वर्णविधिः
    iast: |-
      iti varṇavidhiḥ
  - verse_num: 43
    section_type: prose
    prose_block_ref: "ah5.b43"
    devanagari: |-
      करणं तु मुद्राप्रकाशने वक्ष्यामः
    iast: |-
      karaṇaṃ tu mudrāprakāśane vakṣyāmaḥ
- chapter: 6
  title_sa: तन्त्रसार, षष्ठम् आह्निकम्
  title_iast: "tantrasāra, ṣaṣṭham āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah6.b1"
    devanagari: |-
      स एव स्थानप्रकल्पनशब्देन उक्तः तत्र त्रिधा स्थानं प्राणवायुः शरीरं बाह्यं च तत्र प्राणे तावत् विधिः सर्वः असौ वक्ष्यमाणः अध्वा प्राणस्थः कल्यते तस्य क्रमाक्रमकलनैव कालः स च परमेश्वर एव अन्तर्भाति तद्भासनं च देवस्य काली नाम शक्तिः भेदेन तु तदाभासनं क्रमाक्रमयोः प्राणवृत्तिः
    iast: |-
      sa eva sthānaprakalpanaśabdena uktaḥ tatra tridhā sthānaṃ prāṇavāyuḥ śarīraṃ bāhyaṃ ca tatra prāṇe tāvat vidhiḥ sarvaḥ asau vakṣyamāṇaḥ adhvā prāṇasthaḥ kalyate tasya kramākramakalanaiva kālaḥ sa ca parameśvara eva antarbhāti tadbhāsanaṃ ca devasya kālī nāma śaktiḥ bhedena tu tadābhāsanaṃ kramākramayoḥ prāṇavṛttiḥ
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah6.b2"
    devanagari: |-
      संविद् एव हि प्रमेयेभ्यो विभक्तं रूपं गृह्णाति अत एव च अवच्छेदयोगात् वेद्यतां यान्ती नभः ततः स्वातन्त्र्यात् मेये स्वीकारौत्सुक्येन निपतन्ती क्रियाशक्तिप्रधाना प्राणनारूपा जीवस्वभावा पञ्चभी रूपैः देहं यतः पूरयति ततो ऽसौ चेतन इव भाति
    iast: |-
      saṃvid eva hi prameyebhyo vibhaktaṃ rūpaṃ gṛhṇāti ata eva ca avacchedayogāt vedyatāṃ yāntī nabhaḥ tataḥ svātantryāt meye svīkārautsukyena nipatantī kriyāśaktipradhānā prāṇanārūpā jīvasvabhāvā pañcabhī rūpaiḥ dehaṃ yataḥ pūrayati tato 'sau cetana iva bhāti
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah6.b3"
    devanagari: |-
      तत्र क्रिया शक्तौ कालाध्वा प्राच्यभागे उत्तरे तु मूर्तिवैचित्र्यरूपो देशाध्वा तत्र वर्णमन्त्रपदाध्वनः कालाध्वनि स्थितिः परसूक्ष्मस्थूलरूपत्वात्
    iast: |-
      tatra kriyā śaktau kālādhvā prācyabhāge uttare tu mūrtivaicitryarūpo deśādhvā tatra varṇamantrapadādhvanaḥ kālādhvani sthitiḥ parasūkṣmasthūlarūpatvāt
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah6.b4"
    devanagari: |-
      देशाध्वस्थितिस् तु तत्त्वपुरकलात्मना इति भविष्यति स्वावसरे
    iast: |-
      deśādhvasthitis tu tattvapurakalātmanā iti bhaviṣyati svāvasare
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah6.b5"
    devanagari: |-
      तत्र यद्य् अपि देहे सबाह्याभ्यन्तरम् ओतप्रोतरूपः प्राणः तथापि प्रस्फुटसंवेद्यप्रयत्नः असौ हृदयात् प्रभृति इति तत एव अयं निरूपणीयः
    iast: |-
      tatra yady api dehe sabāhyābhyantaram otaprotarūpaḥ prāṇaḥ tathāpi prasphuṭasaṃvedyaprayatnaḥ asau hṛdayāt prabhṛti iti tata eva ayaṃ nirūpaṇīyaḥ
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah6.b6"
    devanagari: |-
      तत्र प्रभुशक्तिः आत्मशक्तिः यत्न इति त्रितयं प्राणेरणे हेतुः गुणमुख्यभावात्
    iast: |-
      tatra prabhuśaktiḥ ātmaśaktiḥ yatna iti tritayaṃ prāṇeraṇe hetuḥ guṇamukhyabhāvāt
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah6.b7"
    devanagari: |-
      तत्र हृदयात् द्वादशान्तान्तं स्वाङ्गुलैः सर्वस्य षट्त्रिंशदङ्गुलः प्राणचारः निर्गमे प्रवेशे च स्वोचितबलयत्नदेहत्वात् सर्वस्य
    iast: |-
      tatra hṛdayāt dvādaśāntāntaṃ svāṅgulaiḥ sarvasya ṣaṭtriṃśadaṅgulaḥ prāṇacāraḥ nirgame praveśe ca svocitabalayatnadehatvāt sarvasya
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah6.b8"
    devanagari: |-
      तत्र घटिका तिथिः मासो वर्षं च वर्षसमूहात्मा इति समस्तः कालः परिसमाप्यते । तत्र सपञ्चांशे अङ्गुले चषक इति स्थित्या घटिकोदयः घटिका हि षष्ट्या चषकैः तस्मात् द्वासप्तत्यङ्गुला भवति
    iast: |-
      tatra ghaṭikā tithiḥ māso varṣaṃ ca varṣasamūhātmā iti samastaḥ kālaḥ parisamāpyate | tatra sapañcāṃśe aṅgule caṣaka iti sthityā ghaṭikodayaḥ ghaṭikā hi ṣaṣṭyā caṣakaiḥ tasmāt dvāsaptatyaṅgulā bhavati
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah6.b9"
    devanagari: |-
      अथ तिथ्युदयः
    iast: |-
      atha tithyudayaḥ
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah6.b10"
    devanagari: |-
      सपादम् अङ्गुलद्वयं तुटिः उच्यते तासु चतसृषु प्रहरः तुट्यर्धं तुट्यर्धं तत्र सन्ध्या एवं निर्गमे दिनं प्रवेशे रात्रिः इति तिथ्युदयः
    iast: |-
      sapādam aṅguladvayaṃ tuṭiḥ ucyate tāsu catasṛṣu praharaḥ tuṭyardhaṃ tuṭyardhaṃ tatra sandhyā evaṃ nirgame dinaṃ praveśe rātriḥ iti tithyudayaḥ
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah6.b11"
    devanagari: |-
      अथ मासोदयः
    iast: |-
      atha māsodayaḥ
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah6.b12"
    devanagari: |-
      तत्र दिनं कृष्णपक्षः रात्रिः शुक्लः तत्र पूर्वं तुट्यर्धम् अन्त्यं च तुट्यर्धं विश्रान्तिः अकालकलिताः मध्यास् तु पञ्चदश तुटय एव तिथयः तत्र प्रकाशो विश्रान्तिश् च इति एते एव दिननिशे
    iast: |-
      tatra dinaṃ kṛṣṇapakṣaḥ rātriḥ śuklaḥ tatra pūrvaṃ tuṭyardham antyaṃ ca tuṭyardhaṃ viśrāntiḥ akālakalitāḥ madhyās tu pañcadaśa tuṭaya eva tithayaḥ tatra prakāśo viśrāntiś ca iti ete eva dinaniśe
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah6.b13"
    devanagari: |-
      तत्र वेद्यमयताप्रकाशो दिनं वेद्यस्य विचारयितरि लयो रात्रिः ते च प्रकाशविश्रान्ती चिराचिरवैचित्र्यात् अनन्तभेदे तत्साम्ये तु विषुवत्
    iast: |-
      tatra vedyamayatāprakāśo dinaṃ vedyasya vicārayitari layo rātriḥ te ca prakāśaviśrāntī cirāciravaicitryāt anantabhede tatsāmye tu viṣuvat
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah6.b14"
    devanagari: |-
      तत्र कृष्णपक्षे प्राणार्के अपानचन्द्र आप्यायिकाम् एकाम् एकां कलाम् अर्पयति यावत् पञ्चदश्यां तुटौ द्वादशान्तसमीपे क्षीणपृथग्भूतकलाप्रसरः चन्द्रमाः प्राणार्क एव लीयते
    iast: |-
      tatra kṛṣṇapakṣe prāṇārke apānacandra āpyāyikām ekām ekāṃ kalām arpayati yāvat pañcadaśyāṃ tuṭau dvādaśāntasamīpe kṣīṇapṛthagbhūtakalāprasaraḥ candramāḥ prāṇārka eva līyate
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah6.b15"
    devanagari: |-
      तदनन्तरं यत् तुट्यर्धं स पक्षसन्धिः
    iast: |-
      tadanantaraṃ yat tuṭyardhaṃ sa pakṣasandhiḥ
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah6.b16"
    devanagari: |-
      तस्य च तुट्यर्धस्य प्राच्यम् अर्धम् आमावस्यं द्वितीयं प्रातिपदम्
    iast: |-
      tasya ca tuṭyardhasya prācyam ardham āmāvasyaṃ dvitīyaṃ prātipadam
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah6.b17"
    devanagari: |-
      तत्र प्रातिपदे तस्मिन् भागे स आमावस्यो भागो यदा कासप्रयत्नावधानादिकृतात् तिथिच्छेदात् विशति तदा तत्र ग्रहणम् तत्र च वेद्यरूपसोमसहभूतो मायाप्रमातृराहुः स्वभावतया विलापनाशक्तः केवलम् आच्छादनमात्रसमर्थः सूर्यगतं चान्द्रम् अमृतं पिबति इति
    iast: |-
      tatra prātipade tasmin bhāge sa āmāvasyo bhāgo yadā kāsaprayatnāvadhānādikṛtāt tithicchedāt viśati tadā tatra grahaṇam tatra ca vedyarūpasomasahabhūto māyāpramātṛrāhuḥ svabhāvatayā vilāpanāśaktaḥ kevalam ācchādanamātrasamarthaḥ sūryagataṃ cāndram amṛtaṃ pibati iti
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah6.b18"
    devanagari: |-
      प्रमातृप्रमाणप्रमेयत्रितयाविभागकारित्वात् स पुण्यः कालः पारलौकिकफलप्रदः
    iast: |-
      pramātṛpramāṇaprameyatritayāvibhāgakāritvāt sa puṇyaḥ kālaḥ pāralaukikaphalapradaḥ
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah6.b19"
    devanagari: |-
      ततः प्रविशति प्राणे चिदर्क एकैकया कलया अपानचन्द्रम् आपूरयति यावत् पञ्चदशी तुटिः पूर्णिमा तदनन्तरं पक्षसन्धिः ग्रहणं च इति प्राग्वत् एतत् तु ऐहिकफलप्रदम् इति मासोदयः
    iast: |-
      tataḥ praviśati prāṇe cidarka ekaikayā kalayā apānacandram āpūrayati yāvat pañcadaśī tuṭiḥ pūrṇimā tadanantaraṃ pakṣasandhiḥ grahaṇaṃ ca iti prāgvat etat tu aihikaphalapradam iti māsodayaḥ
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah6.b20"
    devanagari: |-
      अथ वर्षोदयः
    iast: |-
      atha varṣodayaḥ
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah6.b21"
    devanagari: |-
      तत्र कृष्णपक्ष एव उत्तरायणं षट्सु षट्सु अङ्गुलेषु सङ्क्रान्तिः मकरात् मिथुनान्ताम्
    iast: |-
      tatra kṛṣṇapakṣa eva uttarāyaṇaṃ ṣaṭsu ṣaṭsu aṅguleṣu saṅkrāntiḥ makarāt mithunāntām
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah6.b22"
    devanagari: |-
      तत्र प्रत्यङ्गुलं पञ्च तिथयः तत्रापि दिनरात्रिविभागः एवं प्रवेशे दक्षिणायनं गर्भत्वम् उद्भवेच्छा उद्बुभूषुता उद्भविष्यत्वम् उद्भवारम्भः उद्भवत्ता जन्मादिविकारषट्कं च इति क्रमात् मकरादिषु इति
    iast: |-
      tatra pratyaṅgulaṃ pañca tithayaḥ tatrāpi dinarātrivibhāgaḥ evaṃ praveśe dakṣiṇāyanaṃ garbhatvam udbhavecchā udbubhūṣutā udbhaviṣyatvam udbhavārambhaḥ udbhavattā janmādivikāraṣaṭkaṃ ca iti kramāt makarādiṣu iti
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah6.b23"
    devanagari: |-
      तथैव उपासा अत्र फलं समुचितं करोति
    iast: |-
      tathaiva upāsā atra phalaṃ samucitaṃ karoti
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah6.b24"
    devanagari: |-
      अत्र च दक्षाद्याः पितामहान्ता रुद्राः शक्तयश् च द्वादशाधिपतय इति वर्षोदयः
    iast: |-
      atra ca dakṣādyāḥ pitāmahāntā rudrāḥ śaktayaś ca dvādaśādhipataya iti varṣodayaḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah6.b25"
    devanagari: |-
      प्रत्यङ्गुलं षष्टिः तिथय इति क्रमेण सङ्क्रान्तौ वर्षम् इत्य् अनेन क्रमेण प्रवेशनिर्गमयोः द्वादशाब्दोदयः प्रत्यङ्गुलं तिथीनां शतत्रयं सपञ्चांशे ऽङ्गुले वर्षं यत्र प्राक् चषकम् उक्तम् इति गणनया सङ्क्रान्तौ पञ्च वर्षाणि इति अनया परिपाट्या एकस्मिन् प्राणनिर्गमप्रवेशकाले षष्ट्यब्दोदयः अत्र एकविंशतिसहस्राणि षट् शतानि इति तिथीनां सङ्ख्या
    iast: |-
      pratyaṅgulaṃ ṣaṣṭiḥ tithaya iti krameṇa saṅkrāntau varṣam ity anena krameṇa praveśanirgamayoḥ dvādaśābdodayaḥ pratyaṅgulaṃ tithīnāṃ śatatrayaṃ sapañcāṃśe 'ṅgule varṣaṃ yatra prāk caṣakam uktam iti gaṇanayā saṅkrāntau pañca varṣāṇi iti anayā paripāṭyā ekasmin prāṇanirgamapraveśakāle ṣaṣṭyabdodayaḥ atra ekaviṃśatisahasrāṇi ṣaṭ śatāni iti tithīnāṃ saṅkhyā
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah6.b26"
    devanagari: |-
      तावती एव अहोरात्रे प्राणसङ्ख्या इति न षष्ट्यब्दोदयात् अधिकं परीक्ष्यते आनन्त्यात्
    iast: |-
      tāvatī eva ahorātre prāṇasaṅkhyā iti na ṣaṣṭyabdodayāt adhikaṃ parīkṣyate ānantyāt
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah6.b27"
    devanagari: |-
      तत्र मानुषं वर्षं देवानां तिथिः अनेन क्रमेण दिव्यानि द्वादशवर्षसहस्राणि चतुर्युगम्
    iast: |-
      tatra mānuṣaṃ varṣaṃ devānāṃ tithiḥ anena krameṇa divyāni dvādaśavarṣasahasrāṇi caturyugam
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah6.b28"
    devanagari: |-
      चत्वारि त्रीणि द्वे एकम् इति कृतात् प्रभृति तावद्भिः शतैः अष्टौ सन्ध्याः
    iast: |-
      catvāri trīṇi dve ekam iti kṛtāt prabhṛti tāvadbhiḥ śataiḥ aṣṭau sandhyāḥ
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah6.b29"
    devanagari: |-
      चतुर्युगानाम् एकसप्तत्या मन्वन्तरम् मन्वन्तरैः चतुर्दशभिः ब्राह्मं दिनं ब्रह्मदिनान्ते कालाग्निदग्धे लोकत्रये अन्यत्र च लोकत्रये धूमप्रस्वापिते सर्वे जना वेगवद् अग्निप्रेरिता जनलोके प्रलयाकलीभूय तिष्ठन्ति
    iast: |-
      caturyugānām ekasaptatyā manvantaram manvantaraiḥ caturdaśabhiḥ brāhmaṃ dinaṃ brahmadinānte kālāgnidagdhe lokatraye anyatra ca lokatraye dhūmaprasvāpite sarve janā vegavad agnipreritā janaloke pralayākalībhūya tiṣṭhanti
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah6.b30"
    devanagari: |-
      प्रबुद्धास् तु कूष्माण्डहाटकेशाद्या महोलोके क्रीडन्ति
    iast: |-
      prabuddhās tu kūṣmāṇḍahāṭakeśādyā maholoke krīḍanti
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah6.b31"
    devanagari: |-
      ततो निशासमाप्तौ ब्राह्मी सृष्टिः
    iast: |-
      tato niśāsamāptau brāhmī sṛṣṭiḥ
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah6.b32"
    devanagari: |-
      अनेन मानेन वर्षशतं ब्रह्मायुः
    iast: |-
      anena mānena varṣaśataṃ brahmāyuḥ
  - verse_num: 33
    section_type: prose
    prose_block_ref: "ah6.b33"
    devanagari: |-
      तत् विष्णोः दिनं तावती च रात्रिः तस्यापि शतम् आयुः
    iast: |-
      tat viṣṇoḥ dinaṃ tāvatī ca rātriḥ tasyāpi śatam āyuḥ
  - verse_num: 34
    section_type: prose
    prose_block_ref: "ah6.b34"
    devanagari: |-
      तत् दिनं तदूर्ध्वे रुद्रलोकप्रभो रुद्रस्य तावती रात्रिः प्राग्वत् वर्षं तच्छतम् अपि च अवधिः
    iast: |-
      tat dinaṃ tadūrdhve rudralokaprabho rudrasya tāvatī rātriḥ prāgvat varṣaṃ tacchatam api ca avadhiḥ
  - verse_num: 35
    section_type: prose
    prose_block_ref: "ah6.b35"
    devanagari: |-
      तत्र रुद्रस्य तदवसितौ शिवत्वगतिः रुद्रस्य उक्ताधिकारावधिः ब्रह्माण्डधारकाणां तत् दिनं शतरुद्राणां निशा तावती तेषाम् अपि च शतम् आयुः
    iast: |-
      tatra rudrasya tadavasitau śivatvagatiḥ rudrasya uktādhikārāvadhiḥ brahmāṇḍadhārakāṇāṃ tat dinaṃ śatarudrāṇāṃ niśā tāvatī teṣām api ca śatam āyuḥ
  - verse_num: 36
    section_type: prose
    prose_block_ref: "ah6.b36"
    devanagari: |-
      शतरुद्रक्षये ब्रह्माण्डविनाशः
    iast: |-
      śatarudrakṣaye brahmāṇḍavināśaḥ
  - verse_num: 37
    section_type: prose
    prose_block_ref: "ah6.b37"
    devanagari: |-
      एवं जलतत्त्वात् अव्यक्तान्तम् एतद् एव क्रमेण रुद्राणाम् आयुः
    iast: |-
      evaṃ jalatattvāt avyaktāntam etad eva krameṇa rudrāṇām āyuḥ
  - verse_num: 38
    section_type: prose
    prose_block_ref: "ah6.b38"
    devanagari: |-
      पूर्वस्यायुर् उत्तरस्य दिनम् इति
    iast: |-
      pūrvasyāyur uttarasya dinam iti
  - verse_num: 39
    section_type: prose
    prose_block_ref: "ah6.b39"
    devanagari: |-
      ततश् च ब्रह्मा रुद्राश् च अबाद्यधिकारिणः अव्यक्ते तिष्ठन्ति इति
    iast: |-
      tataś ca brahmā rudrāś ca abādyadhikāriṇaḥ avyakte tiṣṭhanti iti
  - verse_num: 40
    section_type: prose
    prose_block_ref: "ah6.b40"
    devanagari: |-
      श्रीकण्ठनाथश् च तदा संहर्ता
    iast: |-
      śrīkaṇṭhanāthaś ca tadā saṃhartā
  - verse_num: 41
    section_type: prose
    prose_block_ref: "ah6.b41"
    devanagari: |-
      एषो ऽवान्तरप्रलयः तत्क्षये सृष्टिः
    iast: |-
      eṣo 'vāntarapralayaḥ tatkṣaye sṛṣṭiḥ
  - verse_num: 42
    section_type: prose
    prose_block_ref: "ah6.b42"
    devanagari: |-
      तत्र शास्त्रान्तरम् उक्ता अपि सृज्यन्ते
    iast: |-
      tatra śāstrāntaram uktā api sṛjyante
  - verse_num: 43
    section_type: prose
    prose_block_ref: "ah6.b43"
    devanagari: |-
      यत् तु श्रीकण्ठनाथस्य स्वम् आयुः तत् कञ्चुकवासिनां रुद्राणां दिनं तावती रजनी तेषां यद् आयुः तत् गहनेशदिनं तावती एव क्षपा तस्यां च समस्तम् एव मायायां विलीयते
    iast: |-
      yat tu śrīkaṇṭhanāthasya svam āyuḥ tat kañcukavāsināṃ rudrāṇāṃ dinaṃ tāvatī rajanī teṣāṃ yad āyuḥ tat gahaneśadinaṃ tāvatī eva kṣapā tasyāṃ ca samastam eva māyāyāṃ vilīyate
  - verse_num: 44
    section_type: prose
    prose_block_ref: "ah6.b44"
    devanagari: |-
      पुनः गहनेशः सृजति
    iast: |-
      punaḥ gahaneśaḥ sṛjati
  - verse_num: 45
    section_type: prose
    prose_block_ref: "ah6.b45"
    devanagari: |-
      एवं यः अव्यक्तकालः तं दशभिः परार्धैः गुणयित्वा मायादिनं कथयेत् तावती रात्रिः
    iast: |-
      evaṃ yaḥ avyaktakālaḥ taṃ daśabhiḥ parārdhaiḥ guṇayitvā māyādinaṃ kathayet tāvatī rātriḥ
  - verse_num: 46
    section_type: prose
    prose_block_ref: "ah6.b46"
    devanagari: |-
      स एव प्रलयः
    iast: |-
      sa eva pralayaḥ
  - verse_num: 47
    section_type: prose
    prose_block_ref: "ah6.b47"
    devanagari: |-
      मायाकालः परार्धशतेन गुणित ऐश्वरतत्त्वे दिनम्
    iast: |-
      māyākālaḥ parārdhaśatena guṇita aiśvaratattve dinam
  - verse_num: 48
    section_type: prose
    prose_block_ref: "ah6.b48"
    devanagari: |-
      अत्र प्राणो जगत् सृजति तावती रात्रिः यत्र प्राणप्रशमः प्राणे च ब्रह्मबिलधाम्नि शान्ते ऽपि या संवित् तत्राप्य् अस्ति क्रमः
    iast: |-
      atra prāṇo jagat sṛjati tāvatī rātriḥ yatra prāṇapraśamaḥ prāṇe ca brahmabiladhāmni śānte 'pi yā saṃvit tatrāpy asti kramaḥ
  - verse_num: 49
    section_type: prose
    prose_block_ref: "ah6.b49"
    devanagari: |-
      ऐश्वरे काले परार्धशतगुणिते या सङ्ख्या तत् सादाशिवं दिनं तावती निशा स एव महाप्रलयः
    iast: |-
      aiśvare kāle parārdhaśataguṇite yā saṅkhyā tat sādāśivaṃ dinaṃ tāvatī niśā sa eva mahāpralayaḥ
  - verse_num: 50
    section_type: prose
    prose_block_ref: "ah6.b50"
    devanagari: |-
      सदाशिवः स्वकालपरिक्षये बिन्द्वर्धचन्द्रनिरोधिका आक्रम्य नादे लीयते नादः शक्तितत्त्वे तत् व्यापिन्यां सा च अनाश्रिते
    iast: |-
      sadāśivaḥ svakālaparikṣaye bindvardhacandranirodhikā ākramya nāde līyate nādaḥ śaktitattve tat vyāpinyāṃ sā ca anāśrite
  - verse_num: 51
    section_type: prose
    prose_block_ref: "ah6.b51"
    devanagari: |-
      शक्तिकालेन परार्धकोटिगुणितेन अनाश्रितदिनम्
    iast: |-
      śaktikālena parārdhakoṭiguṇitena anāśritadinam
  - verse_num: 52
    section_type: prose
    prose_block_ref: "ah6.b52"
    devanagari: |-
      अनाश्रितः सामनसे पदे यत् तत् सामनस्यं साम्यं तत् ब्रह्म
    iast: |-
      anāśritaḥ sāmanase pade yat tat sāmanasyaṃ sāmyaṃ tat brahma
  - verse_num: 53
    section_type: prose
    prose_block_ref: "ah6.b53"
    devanagari: |-
      अस्मात् सामनस्यात् अकल्यात् कालात् निमेषोन्मेषमात्रतया प्रोक्ताशेषकालप्रसरप्रविलयचक्रभ्रमोदयः
    iast: |-
      asmāt sāmanasyāt akalyāt kālāt nimeṣonmeṣamātratayā proktāśeṣakālaprasarapravilayacakrabhramodayaḥ
  - verse_num: 54
    section_type: prose
    prose_block_ref: "ah6.b54"
    devanagari: |-
      एकं दश शतं सहस्रम् अयुतं लक्षं नियुतं कोटिः अर्बुदं वृन्दं खर्वं निखर्वं पद्मं शङ्कुः समुद्रम् अन्त्यं मध्यम् परार्धम् इति क्रमेण दशगुणितानि अष्टादश इति गणितविधिः
    iast: |-
      ekaṃ daśa śataṃ sahasram ayutaṃ lakṣaṃ niyutaṃ koṭiḥ arbudaṃ vṛndaṃ kharvaṃ nikharvaṃ padmaṃ śaṅkuḥ samudram antyaṃ madhyam parārdham iti krameṇa daśaguṇitāni aṣṭādaśa iti gaṇitavidhiḥ
  - verse_num: 55
    section_type: prose
    prose_block_ref: "ah6.b55"
    devanagari: |-
      एवम् असङ्ख्याः सृष्टिप्रलयाः एकस्मिन् महासृष्टिरूपे प्राणे सो ऽपि संविदि सा उपाधौ स चिन्मात्रे चिन्मात्रस्यैव अयं स्पन्दो यद् अयं कालोदयो नाम
    iast: |-
      evam asaṅkhyāḥ sṛṣṭipralayāḥ ekasmin mahāsṛṣṭirūpe prāṇe so 'pi saṃvidi sā upādhau sa cinmātre cinmātrasyaiva ayaṃ spando yad ayaṃ kālodayo nāma
  - verse_num: 56
    section_type: prose
    prose_block_ref: "ah6.b56"
    devanagari: |-
      तत एव स्वप्नसङ्कल्पादौ वैचित्र्यम् अस्य न विरोधावहम्
    iast: |-
      tata eva svapnasaṅkalpādau vaicitryam asya na virodhāvaham
  - verse_num: 57
    section_type: prose
    prose_block_ref: "ah6.b57"
    devanagari: |-
      एवं यथा प्राणे कालोदयः तथा अपाने ऽपि हृदयात् मूलपीठपर्यन्तम्
    iast: |-
      evaṃ yathā prāṇe kālodayaḥ tathā apāne 'pi hṛdayāt mūlapīṭhaparyantam
  - verse_num: 58
    section_type: prose
    prose_block_ref: "ah6.b58"
    devanagari: |-
      यथा च हृत्कण्ठतालुललाटरन्ध्रद्वादशान्तेषु ब्रह्मविष्णुरुद्रेशसदाशिवानाश्रिताख्यं कारणषट्कम् तथैव अपाने ऽपि हृत्कन्दानन्दसङ्कोचविकासद्वादशान्तेषु बाल्ययौवनवार्द्धकनिधनपुनर्भवमुक्त्यधिपतय एते
    iast: |-
      yathā ca hṛtkaṇṭhatālulalāṭarandhradvādaśānteṣu brahmaviṣṇurudreśasadāśivānāśritākhyaṃ kāraṇaṣaṭkam tathaiva apāne 'pi hṛtkandānandasaṅkocavikāsadvādaśānteṣu bālyayauvanavārddhakanidhanapunarbhavamuktyadhipataya ete
  - verse_num: 59
    section_type: prose
    prose_block_ref: "ah6.b59"
    devanagari: |-
      अथ समाने कालोदयः
    iast: |-
      atha samāne kālodayaḥ
  - verse_num: 60
    section_type: prose
    prose_block_ref: "ah6.b60"
    devanagari: |-
      समानो हार्दीषु दशासु नाडीषु सञ्चरन् समस्ते देहे साम्येन रसादीन् वाहयति । तत्र दिगष्टके सञ्चरन् तद्दिक्पतिचेष्टाम् इव प्रमातुः अनुकारयति
    iast: |-
      samāno hārdīṣu daśāsu nāḍīṣu sañcaran samaste dehe sāmyena rasādīn vāhayati | tatra digaṣṭake sañcaran taddikpaticeṣṭām iva pramātuḥ anukārayati
  - verse_num: 61
    section_type: prose
    prose_block_ref: "ah6.b61"
    devanagari: |-
      ऊर्ध्वाधस् तु सञ्चरन् तिसृषु नाडीषु गतागतं करोति
    iast: |-
      ūrdhvādhas tu sañcaran tisṛṣu nāḍīṣu gatāgataṃ karoti
  - verse_num: 62
    section_type: prose
    prose_block_ref: "ah6.b62"
    devanagari: |-
      तत्र विषुवद्दिने बाह्ये प्रभातकाले सपादां घटिकां मध्यमार्गे वहति
    iast: |-
      tatra viṣuvaddine bāhye prabhātakāle sapādāṃ ghaṭikāṃ madhyamārge vahati
  - verse_num: 63
    section_type: prose
    prose_block_ref: "ah6.b63"
    devanagari: |-
      ततो नवशतानि प्राणविक्षेपाणाम् इति गणनया बहिः सार्धघटिकाद्वयं वामे दक्षिणे वामे दक्षिणे वामे इति पञ्च सङ्क्रान्तयः
    iast: |-
      tato navaśatāni prāṇavikṣepāṇām iti gaṇanayā bahiḥ sārdhaghaṭikādvayaṃ vāme dakṣiṇe vāme dakṣiṇe vāme iti pañca saṅkrāntayaḥ
  - verse_num: 64
    section_type: prose
    prose_block_ref: "ah6.b64"
    devanagari: |-
      ततः सङ्क्रान्तिपञ्चके वृत्ते पादोनासु चतुर्दशसु घटिकासु अतिक्रान्तासु दक्षिणं शारदं विषुवन्मध्याह्ने नव प्राणशतानि
    iast: |-
      tataḥ saṅkrāntipañcake vṛtte pādonāsu caturdaśasu ghaṭikāsu atikrāntāsu dakṣiṇaṃ śāradaṃ viṣuvanmadhyāhne nava prāṇaśatāni
  - verse_num: 65
    section_type: prose
    prose_block_ref: "ah6.b65"
    devanagari: |-
      ततो ऽपि दक्षिणे वामे दक्षिणे वामे दक्षिणे इति सङ्क्रान्तिपञ्चकं प्रत्येकं नवशतानि इत्य् एवं रात्राव् अपि इति
    iast: |-
      tato 'pi dakṣiṇe vāme dakṣiṇe vāme dakṣiṇe iti saṅkrāntipañcakaṃ pratyekaṃ navaśatāni ity evaṃ rātrāv api iti
  - verse_num: 66
    section_type: prose
    prose_block_ref: "ah6.b66"
    devanagari: |-
      एवं विषुवद्दिवसे तद्रात्रौ च द्वादश द्वादश सङ्क्रान्तयः
    iast: |-
      evaṃ viṣuvaddivase tadrātrau ca dvādaśa dvādaśa saṅkrāntayaḥ
  - verse_num: 67
    section_type: prose
    prose_block_ref: "ah6.b67"
    devanagari: |-
      ततो दिनवृद्धिक्षयेषु सङ्क्रान्तिवृद्धिक्षयः
    iast: |-
      tato dinavṛddhikṣayeṣu saṅkrāntivṛddhikṣayaḥ
  - verse_num: 68
    section_type: prose
    prose_block_ref: "ah6.b68"
    devanagari: |-
      एवम् एकस्मिन् समानमरुति वर्षद्वयं श्वासप्रश्वासयोगाभावात्
    iast: |-
      evam ekasmin samānamaruti varṣadvayaṃ śvāsapraśvāsayogābhāvāt
  - verse_num: 69
    section_type: prose
    prose_block_ref: "ah6.b69"
    devanagari: |-
      अत्रापि द्वादशाब्दोदयादि पूर्ववत्
    iast: |-
      atrāpi dvādaśābdodayādi pūrvavat
  - verse_num: 70
    section_type: prose
    prose_block_ref: "ah6.b70"
    devanagari: |-
      उदाने तु द्वादशान्तावधिश् चारः स्पन्दमात्रात्मनः कालस्य
    iast: |-
      udāne tu dvādaśāntāvadhiś cāraḥ spandamātrātmanaḥ kālasya
  - verse_num: 71
    section_type: prose
    prose_block_ref: "ah6.b71"
    devanagari: |-
      अत्रापि पूर्ववत् विधिः
    iast: |-
      atrāpi pūrvavat vidhiḥ
  - verse_num: 72
    section_type: prose
    prose_block_ref: "ah6.b72"
    devanagari: |-
      व्याने तु व्यापकत्वात् अक्रमे ऽपि सूक्ष्मोच्छलत्तायोगेन कालोदयः
    iast: |-
      vyāne tu vyāpakatvāt akrame 'pi sūkṣmocchalattāyogena kālodayaḥ
  - verse_num: 73
    section_type: prose
    prose_block_ref: "ah6.b73"
    devanagari: |-
      अथ वर्णोदयः
    iast: |-
      atha varṇodayaḥ
  - verse_num: 74
    section_type: prose
    prose_block_ref: "ah6.b74"
    devanagari: |-
      तत्र अर्धप्रहरे अर्धप्रहरे वर्गोदयो विषुवति समः वर्णस्य वर्णस्य द्वे शते षोडशाधिके प्राणानाम् बहिः षट्त्रिंशत् चषकाणि इति उदयः अयम् अयत्नजो वर्णोदयः
    iast: |-
      tatra ardhaprahare ardhaprahare vargodayo viṣuvati samaḥ varṇasya varṇasya dve śate ṣoḍaśādhike prāṇānām bahiḥ ṣaṭtriṃśat caṣakāṇi iti udayaḥ ayam ayatnajo varṇodayaḥ
  - verse_num: 75
    section_type: prose
    prose_block_ref: "ah6.b75"
    devanagari: |-
      यत्नजस् तु मन्त्रोदयः अरघट्टघटीयन्त्रवाहनवत् एकानुसन्धिबलात् चित्रं मन्त्रोदयं दिवानिशम् अनुसन्दधत् मन्त्रदेवतया सह तादात्म्यम् एति
    iast: |-
      yatnajas tu mantrodayaḥ araghaṭṭaghaṭīyantravāhanavat ekānusandhibalāt citraṃ mantrodayaṃ divāniśam anusandadhat mantradevatayā saha tādātmyam eti
  - verse_num: 76
    section_type: prose
    prose_block_ref: "ah6.b76"
    devanagari: |-
      तत्र सदोदिते प्राणचारसङ्ख्ययैव उदयसङ्ख्या व्याख्याता तद्द्विगुणिते तदर्धम् इत्यादि क्रमेण अष्टोत्तरशते चक्रे द्विशत उदयः इति क्रमेण स्थूलसूक्ष्मे चारस्वरूपे विश्रान्तस्य प्राणचारे क्षीणे कालग्रासे वृत्ते सम्पूर्णाम् एकम् एवेदं संवेदनं चित्रशक्तिनिर्भरं भासते
    iast: |-
      tatra sadodite prāṇacārasaṅkhyayaiva udayasaṅkhyā vyākhyātā taddviguṇite tadardham ityādi krameṇa aṣṭottaraśate cakre dviśata udayaḥ iti krameṇa sthūlasūkṣme cārasvarūpe viśrāntasya prāṇacāre kṣīṇe kālagrāse vṛtte sampūrṇām ekam evedaṃ saṃvedanaṃ citraśaktinirbharaṃ bhāsate
  - verse_num: 77
    section_type: prose
    prose_block_ref: "ah6.b77"
    devanagari: |-
      कालभेद एव संवेदनभेदकः न वेद्यभेदः शिखरस्थज्ञानवत् ज्ञानस्य यावान् अवस्थितिकालः स एव क्षणः प्राणोदये च एकस्मिन् एकम् एव ज्ञानम् अवश्यं चैतत् अन्यथा विकल्पज्ञानम् एकं न किञ्चित् स्यात् क्रमिकशब्दारूषितत्वात् मात्राया अपि क्रमिकत्वात्
    iast: |-
      kālabheda eva saṃvedanabhedakaḥ na vedyabhedaḥ śikharasthajñānavat jñānasya yāvān avasthitikālaḥ sa eva kṣaṇaḥ prāṇodaye ca ekasmin ekam eva jñānam avaśyaṃ caitat anyathā vikalpajñānam ekaṃ na kiñcit syāt kramikaśabdārūṣitatvāt mātrāyā api kramikatvāt
  - verse_num: 78
    section_type: prose
    prose_block_ref: "ah6.b78"
    devanagari: |-
      यद् आह तस्यादित उदात्तम् अर्धह्रस्वम् इति
    iast: |-
      yad āha tasyādita udāttam ardhahrasvam iti
  - verse_num: 79
    section_type: prose
    prose_block_ref: "ah6.b79"
    devanagari: |-
      तस्मात् स्पन्दान्तरं यावत् न उदितं तावत् एकम् एव ज्ञानम्
    iast: |-
      tasmāt spandāntaraṃ yāvat na uditaṃ tāvat ekam eva jñānam
  - verse_num: 80
    section_type: prose
    prose_block_ref: "ah6.b80"
    devanagari: |-
      अत एव एकाशीति पदस्मरणसमये विविधधर्मानुप्रवेशमुखेन एक एव असौ परमेश्वरविषयो विकल्पः कालग्रासे न अविकल्पात्मा एव सम्पद्यते इति
    iast: |-
      ata eva ekāśīti padasmaraṇasamaye vividhadharmānupraveśamukhena eka eva asau parameśvaraviṣayo vikalpaḥ kālagrāse na avikalpātmā eva sampadyate iti
  - verse_num: 81
    section_type: prose
    prose_block_ref: "ah6.b81"
    devanagari: |-
      एवम् अखिलं कालाध्वानं प्राणोदय एव पश्यन् सृष्टिसंहारांश् च विचित्रान् निःसङ्ख्यान् तत्रैव आकलयन् आत्मन एव पारमेश्वर्यं प्रत्यभिजानन् मुक्त एव भवति इति
    iast: |-
      evam akhilaṃ kālādhvānaṃ prāṇodaya eva paśyan sṛṣṭisaṃhārāṃś ca vicitrān niḥsaṅkhyān tatraiva ākalayan ātmana eva pārameśvaryaṃ pratyabhijānan mukta eva bhavati iti
  - verse_num: 82
    section_type: prose
    prose_block_ref: "ah6.b82"
    devanagari: |-
      संविद्रूपस्यात्मनः प्राणशक्तिं पश्यन् रूपं तत्रगं चातिकालम् । साकं सृष्टिस्थेमसंहारचक्रैर् नित्योद्युक्तो भैरवीभावम् एति
    iast: |-
      saṃvidrūpasyātmanaḥ prāṇaśaktiṃ paśyan rūpaṃ tatragaṃ cātikālam | sākaṃ sṛṣṭisthemasaṃhāracakrair nityodyukto bhairavībhāvam eti
- chapter: 7
  title_sa: तन्त्रसार, सप्तमम् आह्निकम्
  title_iast: "tantrasāra, saptamam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah7.b1"
    devanagari: |-
      तत्र समस्त एव अयं मूर्तिवैचित्र्याभासनशक्तिजो देशाध्वा संविदि विश्रान्तः तद्द्वारेण शून्ये बुद्धौ प्राणे नाडीचक्रानुचक्रेषु बहिः शरीरे यावल् लिङ्गस्थण्डिलप्रतिमादौ समस्तो ऽध्वा परिनिष्ठितः तं समस्तम् अध्वानं देहे विलाप्य देहं च प्राणे तं धियि तां शून्ये तत्संवेदने निर्भरपरिपूर्णसंवित् सम्पद्यते षट्त्रिंशत्तत्त्वस्वरूपज्ञः तदुत्तीर्णां संविदं परमशिवरूपां पश्यन् विश्वमयीम् अपि संवेदयेत अपरथा वेद्यभागम् एव कञ्चित् परत्वेन गृह्णीयान् मायागर्भाधिकारिणं विष्णुब्रह्मादिकं वा तस्माद् अवश्यं प्रक्रियाज्ञानपरेण भवितव्यम्
    iast: |-
      tatra samasta eva ayaṃ mūrtivaicitryābhāsanaśaktijo deśādhvā saṃvidi viśrāntaḥ taddvāreṇa śūnye buddhau prāṇe nāḍīcakrānucakreṣu bahiḥ śarīre yāval liṅgasthaṇḍilapratimādau samasto 'dhvā pariniṣṭhitaḥ taṃ samastam adhvānaṃ dehe vilāpya dehaṃ ca prāṇe taṃ dhiyi tāṃ śūnye tatsaṃvedane nirbharaparipūrṇasaṃvit sampadyate ṣaṭtriṃśattattvasvarūpajñaḥ taduttīrṇāṃ saṃvidaṃ paramaśivarūpāṃ paśyan viśvamayīm api saṃvedayeta aparathā vedyabhāgam eva kañcit paratvena gṛhṇīyān māyāgarbhādhikāriṇaṃ viṣṇubrahmādikaṃ vā tasmād avaśyaṃ prakriyājñānapareṇa bhavitavyam
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah7.b2"
    devanagari: |-
      तद् उक्तं न प्रक्रियापरं ज्ञानम् इति
    iast: |-
      tad uktaṃ na prakriyāparaṃ jñānam iti
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah7.b3"
    devanagari: |-
      तत्र पृथिवीतत्त्वं शतकोटिप्रविस्तीर्णं ब्रह्माण्डगोलकरूपम्
    iast: |-
      tatra pṛthivītattvaṃ śatakoṭipravistīrṇaṃ brahmāṇḍagolakarūpam
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah7.b4"
    devanagari: |-
      तस्य अन्तः कालाग्निर् नरकाः पातालानि पृथिवी स्वर्गो यावद् ब्रह्मलोक इति
    iast: |-
      tasya antaḥ kālāgnir narakāḥ pātālāni pṛthivī svargo yāvad brahmaloka iti
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah7.b5"
    devanagari: |-
      ब्रह्माण्डबाह्ये रुद्राणां शतम्
    iast: |-
      brahmāṇḍabāhye rudrāṇāṃ śatam
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah7.b6"
    devanagari: |-
      न च ब्रह्माण्डानां सङ्ख्या विद्यते
    iast: |-
      na ca brahmāṇḍānāṃ saṅkhyā vidyate
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah7.b7"
    devanagari: |-
      ततो धरातत्त्वाद् दशगुणं जलतत्त्वम्
    iast: |-
      tato dharātattvād daśaguṇaṃ jalatattvam
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah7.b8"
    devanagari: |-
      तत उत्तरोत्तरं दशगुणम् अहङ्कारान्तम्
    iast: |-
      tata uttarottaraṃ daśaguṇam ahaṅkārāntam
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah7.b9"
    devanagari: |-
      तद् यथा जलं तेजो वायुर् नभः तन्मात्रपञ्चकाक्षैकादशगर्भो ऽहङ्कारश् चेति
    iast: |-
      tad yathā jalaṃ tejo vāyur nabhaḥ tanmātrapañcakākṣaikādaśagarbho 'haṅkāraś ceti
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah7.b10"
    devanagari: |-
      अहङ्कारात् शतगुणं बुद्धितत्त्वम्
    iast: |-
      ahaṅkārāt śataguṇaṃ buddhitattvam
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah7.b11"
    devanagari: |-
      ततः सहस्रधा प्रकृतितत्त्वम् एतावत् प्रकृत्यण्डम्
    iast: |-
      tataḥ sahasradhā prakṛtitattvam etāvat prakṛtyaṇḍam
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah7.b12"
    devanagari: |-
      तच् च ब्रह्माण्डवद् असङ्ख्यम्
    iast: |-
      tac ca brahmāṇḍavad asaṅkhyam
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah7.b13"
    devanagari: |-
      प्रकृतितत्त्वात् पुरुषतत्त्वं च दशसहस्रधा
    iast: |-
      prakṛtitattvāt puruṣatattvaṃ ca daśasahasradhā
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah7.b14"
    devanagari: |-
      पुरुषान् नियतिः लक्षधा
    iast: |-
      puruṣān niyatiḥ lakṣadhā
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah7.b15"
    devanagari: |-
      नियतेर् उत्तरोत्तरं दशलक्षधा कलातत्त्वान्तम्
    iast: |-
      niyater uttarottaraṃ daśalakṣadhā kalātattvāntam
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah7.b16"
    devanagari: |-
      तद् यथा नियतिः रागो ऽशुद्धविद्या कालः कला चेति
    iast: |-
      tad yathā niyatiḥ rāgo 'śuddhavidyā kālaḥ kalā ceti
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah7.b17"
    devanagari: |-
      कलातत्त्वात् कोटिधा माया एतावत् मायाण्डम्
    iast: |-
      kalātattvāt koṭidhā māyā etāvat māyāṇḍam
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah7.b18"
    devanagari: |-
      मायातत्त्वात् शुद्धविद्या दशकोटिगुणिता
    iast: |-
      māyātattvāt śuddhavidyā daśakoṭiguṇitā
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah7.b19"
    devanagari: |-
      विद्यातत्त्वाद् ईश्वरतत्त्वं शतकोटिधा
    iast: |-
      vidyātattvād īśvaratattvaṃ śatakoṭidhā
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah7.b20"
    devanagari: |-
      ईश्वरतत्त्वात् सादाख्यं सहस्रकोटिधा
    iast: |-
      īśvaratattvāt sādākhyaṃ sahasrakoṭidhā
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah7.b21"
    devanagari: |-
      सादाख्यात् वृन्दगुणितं शक्तितत्त्वम् इति शक्त्यण्डम्
    iast: |-
      sādākhyāt vṛndaguṇitaṃ śaktitattvam iti śaktyaṇḍam
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah7.b22"
    devanagari: |-
      सा शक्तिर् व्याप्य यतो विश्वम् अध्वानम् अन्तर्बहिर् आस्ते तस्माद् व्यापिनी
    iast: |-
      sā śaktir vyāpya yato viśvam adhvānam antarbahir āste tasmād vyāpinī
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah7.b23"
    devanagari: |-
      एवम् एतानि उत्तरोत्तरम् आवरणतया वर्तमानानि तत्त्वान्य् उत्तरं व्यापकं पूर्वं व्याप्यम् इति स्थित्या वर्तन्ते
    iast: |-
      evam etāni uttarottaram āvaraṇatayā vartamānāni tattvāny uttaraṃ vyāpakaṃ pūrvaṃ vyāpyam iti sthityā vartante
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah7.b24"
    devanagari: |-
      यावद् अशेषशक्तितत्त्वान्तो ऽध्वा शिवतत्त्वेन व्याप्तः
    iast: |-
      yāvad aśeṣaśaktitattvānto 'dhvā śivatattvena vyāptaḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah7.b25"
    devanagari: |-
      शिवतत्त्वं पुनर् अपरिमेयं सर्वाध्वोत्तीर्णं सर्वाध्वव्यापकं च
    iast: |-
      śivatattvaṃ punar aparimeyaṃ sarvādhvottīrṇaṃ sarvādhvavyāpakaṃ ca
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah7.b26"
    devanagari: |-
      एतत् तत्त्वान्तरालवर्तीनि यानि भुवनानि तत्पतय एव अत्र पृथिव्यां स्थिता इति
    iast: |-
      etat tattvāntarālavartīni yāni bhuvanāni tatpataya eva atra pṛthivyāṃ sthitā iti
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah7.b27"
    devanagari: |-
      तेष्व् आयतनेषु ये म्रियन्ते तेषां तत्र तत्र गतिं ते वितरन्ति
    iast: |-
      teṣv āyataneṣu ye mriyante teṣāṃ tatra tatra gatiṃ te vitaranti
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah7.b28"
    devanagari: |-
      क्रमाच् च ऊर्ध्वोर्ध्वं प्रेरयन्ति दीक्षाक्रमेण
    iast: |-
      kramāc ca ūrdhvordhvaṃ prerayanti dīkṣākrameṇa
- chapter: 8
  title_sa: तन्त्रसार, अष्टमम् आह्निकम्
  title_iast: "tantrasāra, aṣṭamam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah8.b1"
    devanagari: |-
      यद् इदं विभवात्मकं भुवनजातम् उक्तं गर्भीकृतानन्तविचित्रभोक्तृभोग्यं तत्र यद् अनुगतं महाप्रकाशरूपं तत् महासामान्यकल्पं परमशिवरूपम्
    iast: |-
      yad idaṃ vibhavātmakaṃ bhuvanajātam uktaṃ garbhīkṛtānantavicitrabhoktṛbhogyaṃ tatra yad anugataṃ mahāprakāśarūpaṃ tat mahāsāmānyakalpaṃ paramaśivarūpam
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah8.b2"
    devanagari: |-
      यत् तु कतिपयकतिपयभेदानुगतं रूपं तत् तत्त्वं यथा पृथिवी नाम द्युतिकाठिन्यस्थौल्यादिरूपा कालाग्निप्रभृतिवीरभद्रान्तभुवनेशाधिष्ठितसमस्तब्रह्माण्डानुगता
    iast: |-
      yat tu katipayakatipayabhedānugataṃ rūpaṃ tat tattvaṃ yathā pṛthivī nāma dyutikāṭhinyasthaulyādirūpā kālāgniprabhṛtivīrabhadrāntabhuvaneśādhiṣṭhitasamastabrahmāṇḍānugatā
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah8.b3"
    devanagari: |-
      तत्र एषां तत्त्वानां कार्यकारणभावो दर्श्यते स च द्विविधः
    iast: |-
      tatra eṣāṃ tattvānāṃ kāryakāraṇabhāvo darśyate sa ca dvividhaḥ
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah8.b4"
    devanagari: |-
      पारमार्थिकः सृष्टेश् च
    iast: |-
      pāramārthikaḥ sṛṣṭeś ca
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah8.b5"
    devanagari: |-
      तत्र पारमार्थिक एतावान् कार्यकारणभावो यद् उत कर्तृस्वभावस्य स्वतन्त्रस्य भगवत एवंविधेन शिवादिधरान्तेन वपुषा स्वरूपभिन्नेन स्वरूपविश्रान्तेन च प्रथनम्
    iast: |-
      tatra pāramārthika etāvān kāryakāraṇabhāvo yad uta kartṛsvabhāvasya svatantrasya bhagavata evaṃvidhena śivādidharāntena vapuṣā svarūpabhinnena svarūpaviśrāntena ca prathanam
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah8.b6"
    devanagari: |-
      कल्पितस् तु कार्यकारणभावः परमेशेच्छया नियतिप्राणया निर्मितः स च यावति यदा नियतपौर्वापर्यावभासनं सत्य् अपि अधिके स्वरूपानुगतम् एतावत्य् एव तेन योगीच्छातो ऽपि अङ्कुरो बीजाद् अपि स्वप्नादौ घटादेर् अपीति
    iast: |-
      kalpitas tu kāryakāraṇabhāvaḥ parameśecchayā niyatiprāṇayā nirmitaḥ sa ca yāvati yadā niyatapaurvāparyāvabhāsanaṃ saty api adhike svarūpānugatam etāvaty eva tena yogīcchāto 'pi aṅkuro bījād api svapnādau ghaṭāder apīti
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah8.b7"
    devanagari: |-
      तत्रापि च परमेश्वरस्य कर्तृत्वानपाय इति अकल्पितो ऽपि असौ पारमार्थिकः स्थित एव
    iast: |-
      tatrāpi ca parameśvarasya kartṛtvānapāya iti akalpito 'pi asau pāramārthikaḥ sthita eva
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah8.b8"
    devanagari: |-
      पारमार्थिके हि भित्तिस्थानीये स्थिते रूपे सर्वम् इदम् उल्लिख्यमानं घटते न अन्यथा अत एव सामग्र्या एव कारुणत्वं युक्तम्
    iast: |-
      pāramārthike hi bhittisthānīye sthite rūpe sarvam idam ullikhyamānaṃ ghaṭate na anyathā ata eva sāmagryā eva kāruṇatvaṃ yuktam
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah8.b9"
    devanagari: |-
      सा हि समस्तभावसन्दर्भमयी स्वतन्त्रसंवेदनमहिम्ना तथा नियतनिजनिजदेशकालभावराशिस्वभावा प्रत्येकं वस्तुस्वरूपनिष्पत्तिसमये तथाभूता तथाभूताया हि अन्यथाभावो यथा यथा अधिकीभवति तथा तथा कार्यस्यापि विजातीयत्वं तारतम्येन पुष्यति
    iast: |-
      sā hi samastabhāvasandarbhamayī svatantrasaṃvedanamahimnā tathā niyatanijanijadeśakālabhāvarāśisvabhāvā pratyekaṃ vastusvarūpaniṣpattisamaye tathābhūtā tathābhūtāyā hi anyathābhāvo yathā yathā adhikībhavati tathā tathā kāryasyāpi vijātīyatvaṃ tāratamyena puṣyati
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah8.b10"
    devanagari: |-
      इत्य् एवं संवेदनस्वातन्त्र्यस्वभावः परमेश्वर एव विश्वभावशरीरो घटादेर् निर्माता कुम्भकारसंविदस् ततो ऽनधिकत्वात् कुम्भकारशरीरस्य च भावराशिमध्ये निक्षेपात् कथं कुम्भकारशरीरस्य कर्तृत्वाभिमानः इति चेत् परमेश्वरकृत एवासौ घटादिवत् भविष्यति
    iast: |-
      ity evaṃ saṃvedanasvātantryasvabhāvaḥ parameśvara eva viśvabhāvaśarīro ghaṭāder nirmātā kumbhakārasaṃvidas tato 'nadhikatvāt kumbhakāraśarīrasya ca bhāvarāśimadhye nikṣepāt kathaṃ kumbhakāraśarīrasya kartṛtvābhimānaḥ iti cet parameśvarakṛta evāsau ghaṭādivat bhaviṣyati
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah8.b11"
    devanagari: |-
      तस्मात् सामग्रीवादो ऽपि विश्वशरीरस्य संवेदनस्यैव कर्तृतायाम् उपोद्बलकः
    iast: |-
      tasmāt sāmagrīvādo 'pi viśvaśarīrasya saṃvedanasyaiva kartṛtāyām upodbalakaḥ
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah8.b12"
    devanagari: |-
      मेरौ हि तत्रस्थे न भवेत् तथाविधो घटः
    iast: |-
      merau hi tatrasthe na bhavet tathāvidho ghaṭaḥ
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah8.b13"
    devanagari: |-
      एवं कल्पिते ऽस्मिन् कार्यत्वे शास्त्रेषु तत्त्वानां कार्यकारणभावं प्रति यत् बहुप्रकारत्वं तद् अपि सङ्गतं गोमयात् कीटात् योगीच्छातो मन्त्राद् औषधात् वृश्चिकोदयवत्
    iast: |-
      evaṃ kalpite 'smin kāryatve śāstreṣu tattvānāṃ kāryakāraṇabhāvaṃ prati yat bahuprakāratvaṃ tad api saṅgataṃ gomayāt kīṭāt yogīcchāto mantrād auṣadhāt vṛścikodayavat
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah8.b14"
    devanagari: |-
      तत्र निजतन्त्रदृशा तं कल्पितं दर्शयामः
    iast: |-
      tatra nijatantradṛśā taṃ kalpitaṃ darśayāmaḥ
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah8.b15"
    devanagari: |-
      तत्र परमेश्वरः पञ्चभिः शक्तिभिः निर्भर इत्य् उक्तम् स स्वातन्त्र्यात् शक्तिं तां तां मुख्यतया प्रकटयन् पञ्चधा तिष्ठति
    iast: |-
      tatra parameśvaraḥ pañcabhiḥ śaktibhiḥ nirbhara ity uktam sa svātantryāt śaktiṃ tāṃ tāṃ mukhyatayā prakaṭayan pañcadhā tiṣṭhati
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah8.b16"
    devanagari: |-
      चित्प्राधान्ये शिवतत्त्वम् आनन्दप्राधान्ये शक्तितत्त्वम् इच्छाप्राधान्ये सदाशिवतत्त्वम् इच्छाया हि ज्ञानक्रिययोः साम्यरूपाभ्युपगमात्मकत्वात् ज्ञानशक्तिप्राधान्ये ईश्वरतत्त्वम् क्रियाशक्तिप्राधान्ये विद्यातत्त्वम् इति
    iast: |-
      citprādhānye śivatattvam ānandaprādhānye śaktitattvam icchāprādhānye sadāśivatattvam icchāyā hi jñānakriyayoḥ sāmyarūpābhyupagamātmakatvāt jñānaśaktiprādhānye īśvaratattvam kriyāśaktiprādhānye vidyātattvam iti
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah8.b17"
    devanagari: |-
      अत्र च तत्त्वेश्वराः शिवशक्तिसदाशिवेश्वरानन्ताः ब्रह्मेव निवृत्तौ एषां सामान्यरूपाणां विशेषा अनुगतिविषयाः पञ्च तद्यथा शाम्भवाः शाक्ताः मन्त्रमहेश्वराः मन्त्रेश्वराः मन्त्रा इति शुद्धाध्वा
    iast: |-
      atra ca tattveśvarāḥ śivaśaktisadāśiveśvarānantāḥ brahmeva nivṛttau eṣāṃ sāmānyarūpāṇāṃ viśeṣā anugativiṣayāḥ pañca tadyathā śāmbhavāḥ śāktāḥ mantramaheśvarāḥ mantreśvarāḥ mantrā iti śuddhādhvā
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah8.b18"
    devanagari: |-
      इयति साक्षात् शिवः कर्ता अशुद्धं पुनर् अध्वानम् अनन्तापरनामाघोरेशः सृजति ईश्वरेच्छावशेन प्रक्षुब्धभोगलोलिकानाम् अणूनां भोगसिद्ध्यर्थम्
    iast: |-
      iyati sākṣāt śivaḥ kartā aśuddhaṃ punar adhvānam anantāparanāmāghoreśaḥ sṛjati īśvarecchāvaśena prakṣubdhabhogalolikānām aṇūnāṃ bhogasiddhyartham
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah8.b19"
    devanagari: |-
      तत्र लोलिको ऽपूर्णम् अन्यतारूपः परिस्पन्दः अकर्मकम् अभिलाषमात्रम् एव भविष्यद् अवच्छेदयोग्यतेति न मलः पुंसस् तत्त्वान्तरम्
    iast: |-
      tatra loliko 'pūrṇam anyatārūpaḥ parispandaḥ akarmakam abhilāṣamātram eva bhaviṣyad avacchedayogyateti na malaḥ puṃsas tattvāntaram
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah8.b20"
    devanagari: |-
      रागतत्त्वं तु कर्मावच्छिन्नो ऽभिलाषः
    iast: |-
      rāgatattvaṃ tu karmāvacchinno 'bhilāṣaḥ
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah8.b21"
    devanagari: |-
      कर्म तु तत्र कर्ममात्रं बुद्धिधर्मस् तु रागः कर्मभेदचित्र इति विभागो वक्ष्यते
    iast: |-
      karma tu tatra karmamātraṃ buddhidharmas tu rāgaḥ karmabhedacitra iti vibhāgo vakṣyate
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah8.b22"
    devanagari: |-
      सो ऽयं मलः परमेश्वरस्य स्वात्मप्रच्छादनेच्छातः नान्यत् किञ्चित् वस्त्व् अपि च तत्परमेश्वरेच्छात्मनैव धरादेर् अपि वस्तुत्वात्
    iast: |-
      so 'yaṃ malaḥ parameśvarasya svātmapracchādanecchātaḥ nānyat kiñcit vastv api ca tatparameśvarecchātmanaiva dharāder api vastutvāt
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah8.b23"
    devanagari: |-
      स च मलो विज्ञानकेवले विद्यमानो ध्वंसोन्मुख इति न स्वकार्यं कर्म आप्यायति
    iast: |-
      sa ca malo vijñānakevale vidyamāno dhvaṃsonmukha iti na svakāryaṃ karma āpyāyati
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah8.b24"
    devanagari: |-
      प्रलयकेवलस्य तु जृम्भमाण एव आस्त इति मलोपोद्बलितं कर्म संसारवैचित्र्यभोगे निमित्तम् इति तद्भोगवासनानुविद्धानाम् अणूनां भोगसिद्धये श्रीमान् अघोरेशः सृजति इति युक्तम् उक्तं मलस्य च प्रक्षोभ ईश्वरेच्छाबलाद् एव जडस्य स्वतः कुत्रचिद् अपि असामर्थ्यात्
    iast: |-
      pralayakevalasya tu jṛmbhamāṇa eva āsta iti malopodbalitaṃ karma saṃsāravaicitryabhoge nimittam iti tadbhogavāsanānuviddhānām aṇūnāṃ bhogasiddhaye śrīmān aghoreśaḥ sṛjati iti yuktam uktaṃ malasya ca prakṣobha īśvarecchābalād eva jaḍasya svataḥ kutracid api asāmarthyāt
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah8.b25"
    devanagari: |-
      अणुर् नाम किल चिदचिद्रूपावभास एव तस्य चिद्रूपम् ऐश्वर्यम् एव अचिद्रूपतैव मलः तस्य च सृजतः परमेश्वरेच्छामयं तत एव च नित्यं स्रक्ष्यमाणवस्तुगतस्य रूपस्य जडतयाभासयिष्यमाणत्वात् जडं सकलकार्यव्यापनादिरूपत्वाच् च व्यापकं मायाख्यं तत्त्वम् उपादानकारणं तदवभासकारिणी च परमेश्वरस्य माया नाम शक्तिस् ततो ऽन्यैव
    iast: |-
      aṇur nāma kila cidacidrūpāvabhāsa eva tasya cidrūpam aiśvaryam eva acidrūpataiva malaḥ tasya ca sṛjataḥ parameśvarecchāmayaṃ tata eva ca nityaṃ srakṣyamāṇavastugatasya rūpasya jaḍatayābhāsayiṣyamāṇatvāt jaḍaṃ sakalakāryavyāpanādirūpatvāc ca vyāpakaṃ māyākhyaṃ tattvam upādānakāraṇaṃ tadavabhāsakāriṇī ca parameśvarasya māyā nāma śaktis tato 'nyaiva
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah8.b26"
    devanagari: |-
      एवं कलादितत्त्वानां धरान्तानाम् अपि द्वैरूप्यं निरूप्यम्
    iast: |-
      evaṃ kalāditattvānāṃ dharāntānām api dvairūpyaṃ nirūpyam
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah8.b27"
    devanagari: |-
      अत्र च द्वैरूप्ये प्रमाणम् अपि आहुर् अभिनवगुप्तगुरवः
    iast: |-
      atra ca dvairūpye pramāṇam api āhur abhinavaguptaguravaḥ
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah8.b28"
    devanagari: |-
      यत् सङ्कल्पे भाति तत् पृथग्भूतं बहिर् अपि अस्ति स्फुटेन वपुषा घट इव
    iast: |-
      yat saṅkalpe bhāti tat pṛthagbhūtaṃ bahir api asti sphuṭena vapuṣā ghaṭa iva
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah8.b29"
    devanagari: |-
      तथा च मायाकलादिखपुष्पादेर् अपि एषैव वर्तनी इति केवलान्वयी हेतुः
    iast: |-
      tathā ca māyākalādikhapuṣpāder api eṣaiva vartanī iti kevalānvayī hetuḥ
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah8.b30"
    devanagari: |-
      अनेन च मायाकलाप्रकृतिबुद्ध्यादिविषयं साक्षात्काररूपं ज्ञानं ये भजन्ते ते ऽपि सिद्धाः सिद्धा एव
    iast: |-
      anena ca māyākalāprakṛtibuddhyādiviṣayaṃ sākṣātkārarūpaṃ jñānaṃ ye bhajante te 'pi siddhāḥ siddhā eva
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah8.b31"
    devanagari: |-
      एवं स्थिते मायातत्त्वात् विश्वप्रसवः
    iast: |-
      evaṃ sthite māyātattvāt viśvaprasavaḥ
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah8.b32"
    devanagari: |-
      स च यद्य् अपि अक्रमम् एव तथापि उक्तदृशा क्रमो ऽवभासते इति
    iast: |-
      sa ca yady api akramam eva tathāpi uktadṛśā kramo 'vabhāsate iti
  - verse_num: 33
    section_type: prose
    prose_block_ref: "ah8.b33"
    devanagari: |-
      सो ऽपि उच्यते तत्र प्रत्यात्म कलादिवर्गो भिन्नः
    iast: |-
      so 'pi ucyate tatra pratyātma kalādivargo bhinnaḥ
  - verse_num: 34
    section_type: prose
    prose_block_ref: "ah8.b34"
    devanagari: |-
      तत्कार्यस्य कर्तृत्वोपोद्बलनादेः प्रत्यात्मभेदेन उपलम्भात् स तु वर्गः कदाचित् एकीभवेत् अपि ईश्वरेच्छया सामाजिकात्मनाम् इव तत्र सर्वो ऽयं कलादिवर्गः शुद्धः यः परमेश्वरविषयतया तत्स्वरूपलाभानुगुणनिजकार्यकारी संसारप्रतिद्वन्द्वित्वात्
    iast: |-
      tatkāryasya kartṛtvopodbalanādeḥ pratyātmabhedena upalambhāt sa tu vargaḥ kadācit ekībhavet api īśvarecchayā sāmājikātmanām iva tatra sarvo 'yaṃ kalādivargaḥ śuddhaḥ yaḥ parameśvaraviṣayatayā tatsvarūpalābhānuguṇanijakāryakārī saṃsārapratidvandvitvāt
  - verse_num: 35
    section_type: prose
    prose_block_ref: "ah8.b35"
    devanagari: |-
      स च परमेश्वरशक्तिपातवशात् तथा भवति इति वक्ष्यामस् तत्प्रकाशने
    iast: |-
      sa ca parameśvaraśaktipātavaśāt tathā bhavati iti vakṣyāmas tatprakāśane
  - verse_num: 36
    section_type: prose
    prose_block_ref: "ah8.b36"
    devanagari: |-
      अशुद्धस् तु तद्विपरीतः
    iast: |-
      aśuddhas tu tadviparītaḥ
  - verse_num: 37
    section_type: prose
    prose_block_ref: "ah8.b37"
    devanagari: |-
      तत्र मायातः कला जाता या सुप्तस्थानीयम् अणुं किञ्चित्कर्तृत्वेन युनक्ति सा च उच्छूनतेव संसारबीजस्य मायाण्वोर् उभयोः संयोगात् उत्पन्नापि मायां विकरोति न अविकार्यम् अणुम् इति मायाकार्यत्वम् अस्याः
    iast: |-
      tatra māyātaḥ kalā jātā yā suptasthānīyam aṇuṃ kiñcitkartṛtvena yunakti sā ca ucchūnateva saṃsārabījasya māyāṇvor ubhayoḥ saṃyogāt utpannāpi māyāṃ vikaroti na avikāryam aṇum iti māyākāryatvam asyāḥ
  - verse_num: 38
    section_type: prose
    prose_block_ref: "ah8.b38"
    devanagari: |-
      एवम् अन्योन्यश्लेषात् अलक्षणीयान्तरत्वं पुंस्कलयोः
    iast: |-
      evam anyonyaśleṣāt alakṣaṇīyāntaratvaṃ puṃskalayoḥ
  - verse_num: 39
    section_type: prose
    prose_block_ref: "ah8.b39"
    devanagari: |-
      मायागर्भाधिकारिणस् तु कस्यचिद् ईश्वरस्य प्रसादात् सर्वकर्मक्षये मायापुरुषविवेको भवति येन मायोर्ध्वे विज्ञानाकल आस्ते न जातुचित् मायाधः कलापुंविवेको वा येन कलोर्ध्वे तिष्ठति
    iast: |-
      māyāgarbhādhikāriṇas tu kasyacid īśvarasya prasādāt sarvakarmakṣaye māyāpuruṣaviveko bhavati yena māyordhve vijñānākala āste na jātucit māyādhaḥ kalāpuṃviveko vā yena kalordhve tiṣṭhati
  - verse_num: 40
    section_type: prose
    prose_block_ref: "ah8.b40"
    devanagari: |-
      प्रकृतिपुरुषविवेको वा येन प्रधानाधो न संसरेत्
    iast: |-
      prakṛtipuruṣaviveko vā yena pradhānādho na saṃsaret
  - verse_num: 41
    section_type: prose
    prose_block_ref: "ah8.b41"
    devanagari: |-
      मलपुरुषविवेके तु शिवसमानत्वम्
    iast: |-
      malapuruṣaviveke tu śivasamānatvam
  - verse_num: 42
    section_type: prose
    prose_block_ref: "ah8.b42"
    devanagari: |-
      पुरुषपूर्णतादृष्टौ तु शिवत्वम् एवेति
    iast: |-
      puruṣapūrṇatādṛṣṭau tu śivatvam eveti
  - verse_num: 43
    section_type: prose
    prose_block_ref: "ah8.b43"
    devanagari: |-
      एवं कलातत्त्वम् एव किञ्चित्कर्तृत्वदायि न च
    iast: |-
      evaṃ kalātattvam eva kiñcitkartṛtvadāyi na ca
  - verse_num: 44
    section_type: prose
    prose_block_ref: "ah8.b44"
    devanagari: |-
      कर्तृत्वम् अज्ञस्य इति
    iast: |-
      kartṛtvam ajñasya iti
  - verse_num: 45
    section_type: prose
    prose_block_ref: "ah8.b45"
    devanagari: |-
      किञ्चिज्ज्ञत्वदायिन्य् अशुद्धविद्या कलातो जाता सा च विद्या बुद्धिं पश्यति तद्गतांश् च सुखादीन् विवेकेन गृह्णाति
    iast: |-
      kiñcijjñatvadāyiny aśuddhavidyā kalāto jātā sā ca vidyā buddhiṃ paśyati tadgatāṃś ca sukhādīn vivekena gṛhṇāti
  - verse_num: 46
    section_type: prose
    prose_block_ref: "ah8.b46"
    devanagari: |-
      बुद्धेर् गुणसङ्कीर्णाकाराया विवेकेन ग्रहीतुम् असामर्थ्यात्
    iast: |-
      buddher guṇasaṅkīrṇākārāyā vivekena grahītum asāmarthyāt
  - verse_num: 47
    section_type: prose
    prose_block_ref: "ah8.b47"
    devanagari: |-
      तस्मात् बुद्धिप्रतिबिम्बितो भावो विद्यया विविच्यते
    iast: |-
      tasmāt buddhipratibimbito bhāvo vidyayā vivicyate
  - verse_num: 48
    section_type: prose
    prose_block_ref: "ah8.b48"
    devanagari: |-
      किञ्चित्कर्तृत्वं किञ्चिद्भागसिद्धये क्वचिद् एव कर्तृत्वम् इत्य् अत्र अर्थे पर्यवस्यति क्वचिद् एव च इत्य् अत्र भागे रागतत्त्वस्य व्यापारः
    iast: |-
      kiñcitkartṛtvaṃ kiñcidbhāgasiddhaye kvacid eva kartṛtvam ity atra arthe paryavasyati kvacid eva ca ity atra bhāge rāgatattvasya vyāpāraḥ
  - verse_num: 49
    section_type: prose
    prose_block_ref: "ah8.b49"
    devanagari: |-
      न च अवैराग्यकृतं तत् अवैराग्यस्यापि अरक्तिदर्शनात्
    iast: |-
      na ca avairāgyakṛtaṃ tat avairāgyasyāpi araktidarśanāt
  - verse_num: 50
    section_type: prose
    prose_block_ref: "ah8.b50"
    devanagari: |-
      वैराग्ये धर्मादाव् अपि रक्तिर् दृश्यते
    iast: |-
      vairāgye dharmādāv api raktir dṛśyate
  - verse_num: 51
    section_type: prose
    prose_block_ref: "ah8.b51"
    devanagari: |-
      तृप्तस्य च अन्नादौ अवैराग्याभावे ऽपि अन्तःस्थरागानपायात्
    iast: |-
      tṛptasya ca annādau avairāgyābhāve 'pi antaḥstharāgānapāyāt
  - verse_num: 52
    section_type: prose
    prose_block_ref: "ah8.b52"
    devanagari: |-
      तेन विना पुनर् अवैराग्यानुत्पत्तिप्रसङ्गात्
    iast: |-
      tena vinā punar avairāgyānutpattiprasaṅgāt
  - verse_num: 53
    section_type: prose
    prose_block_ref: "ah8.b53"
    devanagari: |-
      कालश् च कार्यं कलयंस् तदवच्छिन्नं कर्तृत्वम् अपि कलयति तुल्ये क्वचित्त्वे अस्मिन्न् एव कर्तृत्वम् इत्य् अत्रार्थे नियतेर् व्यापारः
    iast: |-
      kālaś ca kāryaṃ kalayaṃs tadavacchinnaṃ kartṛtvam api kalayati tulye kvacittve asminn eva kartṛtvam ity atrārthe niyater vyāpāraḥ
  - verse_num: 54
    section_type: prose
    prose_block_ref: "ah8.b54"
    devanagari: |-
      कार्यकारणभावे ऽपि अस्या एव व्यापारः तेन कलात एव एतच् चतुष्कं जातम् इदम् एव किञ्चिद् अधुना जानन् अभिष्वक्तः करोमि इत्य् एवंरूपा संविद् देहपुर्यष्टकादिगता पशुर् इत्य् उच्यते
    iast: |-
      kāryakāraṇabhāve 'pi asyā eva vyāpāraḥ tena kalāta eva etac catuṣkaṃ jātam idam eva kiñcid adhunā jānan abhiṣvaktaḥ karomi ity evaṃrūpā saṃvid dehapuryaṣṭakādigatā paśur ity ucyate
  - verse_num: 55
    section_type: prose
    prose_block_ref: "ah8.b55"
    devanagari: |-
      तद् इदं मायादिषट्कं कञ्चुकषट्कम् उच्यते
    iast: |-
      tad idaṃ māyādiṣaṭkaṃ kañcukaṣaṭkam ucyate
  - verse_num: 56
    section_type: prose
    prose_block_ref: "ah8.b56"
    devanagari: |-
      संविदो मायया अपहस्तितत्वेन कलादीनाम् उपरिपातिनां कञ्चुकवत् अवस्थानात्
    iast: |-
      saṃvido māyayā apahastitatvena kalādīnām uparipātināṃ kañcukavat avasthānāt
  - verse_num: 57
    section_type: prose
    prose_block_ref: "ah8.b57"
    devanagari: |-
      एवं किञ्चित्कर्तृत्वं यत् मायाकार्यं तत्र किञ्चित् त्व् अविशिष्टं यत् कर्तृत्वं विशेष्यं तत्र व्याप्रियमाणा कला विद्यादिप्रसवहेतुः इति निरूपितम्
    iast: |-
      evaṃ kiñcitkartṛtvaṃ yat māyākāryaṃ tatra kiñcit tv aviśiṣṭaṃ yat kartṛtvaṃ viśeṣyaṃ tatra vyāpriyamāṇā kalā vidyādiprasavahetuḥ iti nirūpitam
  - verse_num: 58
    section_type: prose
    prose_block_ref: "ah8.b58"
    devanagari: |-
      इदानीं विशेषणभागो यः किञ्चिद् इत्य् उक्तो ज्ञेयः कार्यश् च तं यावत् सा कला स्वात्मनः पृथक् कुरुते तावत् एष एव सुखदुःखमोहात्मकभोग्यविशेषानुस्यूतस्य सामान्यमात्रस्य तद्गुणसाम्यापरनाम्नः प्रकृतितत्त्वस्य सर्गः इति भोक्तृभोग्ययुगलस्य समम् एव कलातत्त्वायत्ता सृष्टिः
    iast: |-
      idānīṃ viśeṣaṇabhāgo yaḥ kiñcid ity ukto jñeyaḥ kāryaś ca taṃ yāvat sā kalā svātmanaḥ pṛthak kurute tāvat eṣa eva sukhaduḥkhamohātmakabhogyaviśeṣānusyūtasya sāmānyamātrasya tadguṇasāmyāparanāmnaḥ prakṛtitattvasya sargaḥ iti bhoktṛbhogyayugalasya samam eva kalātattvāyattā sṛṣṭiḥ
  - verse_num: 59
    section_type: prose
    prose_block_ref: "ah8.b59"
    devanagari: |-
      अत्र चैषां वास्तवेन पथा क्रमवन्ध्यैव सृष्टिर् इत्य् उक्तं क्रमावभासो ऽपि चास्तीत्य् अपि उक्तम् एव
    iast: |-
      atra caiṣāṃ vāstavena pathā kramavandhyaiva sṛṣṭir ity uktaṃ kramāvabhāso 'pi cāstīty api uktam eva
  - verse_num: 60
    section_type: prose
    prose_block_ref: "ah8.b60"
    devanagari: |-
      क्रमश् च विद्यारागादीनां विचित्रो ऽपि दृष्टः कश्चिद् रज्यन् वेत्ति को ऽपि विदन् रज्यते इत्यादि
    iast: |-
      kramaś ca vidyārāgādīnāṃ vicitro 'pi dṛṣṭaḥ kaścid rajyan vetti ko 'pi vidan rajyate ityādi
  - verse_num: 61
    section_type: prose
    prose_block_ref: "ah8.b61"
    devanagari: |-
      तेन भिन्नक्रमनिरूपणम् अपि रौरवादिषु शास्त्रेषु अविरुद्धं मन्तव्यं तद् एव तु भोग्यसामान्यं प्रक्षोभगतं गुणतत्त्वम्
    iast: |-
      tena bhinnakramanirūpaṇam api rauravādiṣu śāstreṣu aviruddhaṃ mantavyaṃ tad eva tu bhogyasāmānyaṃ prakṣobhagataṃ guṇatattvam
  - verse_num: 62
    section_type: prose
    prose_block_ref: "ah8.b62"
    devanagari: |-
      यत्र सुखं भोग्यरूपप्रकाशः सत्त्वम् दुःखं प्रकाशाप्रकाशान्दोलनात्मकम् अत एव क्रियारूपं रजः मोहः प्रकाशाभावरूपस् तमः
    iast: |-
      yatra sukhaṃ bhogyarūpaprakāśaḥ sattvam duḥkhaṃ prakāśāprakāśāndolanātmakam ata eva kriyārūpaṃ rajaḥ mohaḥ prakāśābhāvarūpas tamaḥ
  - verse_num: 63
    section_type: prose
    prose_block_ref: "ah8.b63"
    devanagari: |-
      त्रितयम् अपि एतत् भोग्यरूपम्
    iast: |-
      tritayam api etat bhogyarūpam
  - verse_num: 64
    section_type: prose
    prose_block_ref: "ah8.b64"
    devanagari: |-
      एवं क्षुब्धात् प्रधानात् कर्तव्यान्तरोदयः न अक्षुब्धाद् इति
    iast: |-
      evaṃ kṣubdhāt pradhānāt kartavyāntarodayaḥ na akṣubdhād iti
  - verse_num: 65
    section_type: prose
    prose_block_ref: "ah8.b65"
    devanagari: |-
      क्षोभः अवश्यम् एव अन्तराले अभ्युपगन्तव्य इति सिद्धं साङ्ख्यापरिदृष्टं पृथग्भूतं गुणतत्त्वम्
    iast: |-
      kṣobhaḥ avaśyam eva antarāle abhyupagantavya iti siddhaṃ sāṅkhyāparidṛṣṭaṃ pṛthagbhūtaṃ guṇatattvam
  - verse_num: 66
    section_type: prose
    prose_block_ref: "ah8.b66"
    devanagari: |-
      स च क्षोभः प्रकृतेस् तत्त्वेशाधिष्ठानाद् एव अन्यथा नियतं पुरुषं प्रति इति न सिध्येत्
    iast: |-
      sa ca kṣobhaḥ prakṛtes tattveśādhiṣṭhānād eva anyathā niyataṃ puruṣaṃ prati iti na sidhyet
  - verse_num: 67
    section_type: prose
    prose_block_ref: "ah8.b67"
    devanagari: |-
      ततो गुणतत्त्वात् बुद्धितत्त्वं यत्र पुम्प्रकाशो विषयश् च प्रतिबिम्बम् अर्पयतः
    iast: |-
      tato guṇatattvāt buddhitattvaṃ yatra pumprakāśo viṣayaś ca pratibimbam arpayataḥ
  - verse_num: 68
    section_type: prose
    prose_block_ref: "ah8.b68"
    devanagari: |-
      बुद्धितत्त्वात् अहङ्कारो येन बुद्धिप्रतिबिम्बिते वेद्यसम्पर्के कलुषे पुम्प्रकाशे अनात्मनि आत्माभिमानः शुक्तौ रजताभिमानवत्
    iast: |-
      buddhitattvāt ahaṅkāro yena buddhipratibimbite vedyasamparke kaluṣe pumprakāśe anātmani ātmābhimānaḥ śuktau rajatābhimānavat
  - verse_num: 69
    section_type: prose
    prose_block_ref: "ah8.b69"
    devanagari: |-
      अत एव कार इत्य् अनेन कृतकत्वम् अस्य उक्तं साङ्ख्यस्य तु तत् न युज्यते स हि न आत्मनो ऽहंविमर्शमयताम् इच्छति वयं तु कर्तृत्वम् अपि तस्य इच्छामः
    iast: |-
      ata eva kāra ity anena kṛtakatvam asya uktaṃ sāṅkhyasya tu tat na yujyate sa hi na ātmano 'haṃvimarśamayatām icchati vayaṃ tu kartṛtvam api tasya icchāmaḥ
  - verse_num: 70
    section_type: prose
    prose_block_ref: "ah8.b70"
    devanagari: |-
      तच् च शुद्धं विमर्श एव अप्रतियोगि स्वात्मचमत्काररूपो ऽहम् इति
    iast: |-
      tac ca śuddhaṃ vimarśa eva apratiyogi svātmacamatkārarūpo 'ham iti
  - verse_num: 71
    section_type: prose
    prose_block_ref: "ah8.b71"
    devanagari: |-
      एषो ऽस्य अहङ्कारस्य करणस्कन्धः
    iast: |-
      eṣo 'sya ahaṅkārasya karaṇaskandhaḥ
  - verse_num: 72
    section_type: prose
    prose_block_ref: "ah8.b72"
    devanagari: |-
      प्रकृतिस्कन्धस् तु तस्यैव त्रिविधः सत्त्वादिभेदात्
    iast: |-
      prakṛtiskandhas tu tasyaiva trividhaḥ sattvādibhedāt
  - verse_num: 73
    section_type: prose
    prose_block_ref: "ah8.b73"
    devanagari: |-
      तत्र सात्त्विको यस्मात् मनश् च बुद्धीन्द्रियपञ्चकं च तत्र मनसि जन्ये सर्वतन्मात्रजननसामर्थ्ययुक्तः स जनकः
    iast: |-
      tatra sāttviko yasmāt manaś ca buddhīndriyapañcakaṃ ca tatra manasi janye sarvatanmātrajananasāmarthyayuktaḥ sa janakaḥ
  - verse_num: 74
    section_type: prose
    prose_block_ref: "ah8.b74"
    devanagari: |-
      श्रोत्रे तु शब्दजननसामर्थ्यविशिष्ट इति यावत् घ्राणे गन्धजननयोग्यतायुक्त इति भौतिकम् अपि न युक्तम् अहं शृणोमि इत्याद्यनुगमाच् च स्फुटम् आहङ्कारिकत्वम् करणत्वेन च अवश्यं कर्त्रंशस्पर्शित्वम् अन्यथा करणान्तरयोजनायाम् अनवस्थाद्यापातात्
    iast: |-
      śrotre tu śabdajananasāmarthyaviśiṣṭa iti yāvat ghrāṇe gandhajananayogyatāyukta iti bhautikam api na yuktam ahaṃ śṛṇomi ityādyanugamāc ca sphuṭam āhaṅkārikatvam karaṇatvena ca avaśyaṃ kartraṃśasparśitvam anyathā karaṇāntarayojanāyām anavasthādyāpātāt
  - verse_num: 75
    section_type: prose
    prose_block_ref: "ah8.b75"
    devanagari: |-
      कर्त्रंशश् च अहङ्कार एव तेन मुख्ये करणे द्वे पुंसः ज्ञाने विद्या क्रियायां कला अन्धस्य पङ्गोश् च अहन्तारूपज्ञानक्रियानपगमात् उद्रिक्ततन्मात्रभागविशिष्टात् तु सात्त्विकाद् एव अहङ्कारात् कर्मेन्द्रियपञ्चकम् अहं गच्छामि इति अहङ्कारविशिष्टः कार्यकरणक्षमः पादेन्द्रियं तस्य मुख्याधिष्ठानं बाह्यम् अन्यत्रापि तद् अस्त्य् एव इति रुग्णस्यापि न गतिविच्छेदः
    iast: |-
      kartraṃśaś ca ahaṅkāra eva tena mukhye karaṇe dve puṃsaḥ jñāne vidyā kriyāyāṃ kalā andhasya paṅgoś ca ahantārūpajñānakriyānapagamāt udriktatanmātrabhāgaviśiṣṭāt tu sāttvikād eva ahaṅkārāt karmendriyapañcakam ahaṃ gacchāmi iti ahaṅkāraviśiṣṭaḥ kāryakaraṇakṣamaḥ pādendriyaṃ tasya mukhyādhiṣṭhānaṃ bāhyam anyatrāpi tad asty eva iti rugṇasyāpi na gativicchedaḥ
  - verse_num: 76
    section_type: prose
    prose_block_ref: "ah8.b76"
    devanagari: |-
      न च कर्तव्यसाङ्कर्यमुक्ताद् एव हेतोः क्रिया करणकार्या मुख्यं च गमनादीनां क्रियात्वं न रूपाद्युपलम्भस्य तस्य काणादतन्त्रे गुणत्वात् तस्मात् अवश्याभ्युपेयः कर्मेन्द्रियवर्गः
    iast: |-
      na ca kartavyasāṅkaryamuktād eva hetoḥ kriyā karaṇakāryā mukhyaṃ ca gamanādīnāṃ kriyātvaṃ na rūpādyupalambhasya tasya kāṇādatantre guṇatvāt tasmāt avaśyābhyupeyaḥ karmendriyavargaḥ
  - verse_num: 77
    section_type: prose
    prose_block_ref: "ah8.b77"
    devanagari: |-
      स च पञ्चकः अनुसन्धेस् तावत्त्वात्
    iast: |-
      sa ca pañcakaḥ anusandhes tāvattvāt
  - verse_num: 78
    section_type: prose
    prose_block_ref: "ah8.b78"
    devanagari: |-
      तथा हि बहिस् तावत् त्यागाय वा अनुसन्धिः आदानाय वा द्वयाय वा उभयरहितत्वेन स्वरूपविश्रान्तये वा तत्र क्रमेण पायुः पाणिः पाद उपस्थ इति
    iast: |-
      tathā hi bahis tāvat tyāgāya vā anusandhiḥ ādānāya vā dvayāya vā ubhayarahitatvena svarūpaviśrāntaye vā tatra krameṇa pāyuḥ pāṇiḥ pāda upastha iti
  - verse_num: 79
    section_type: prose
    prose_block_ref: "ah8.b79"
    devanagari: |-
      अन्तः प्राणाश्रयकर्मानुसन्धेस् तु वागिन्द्रियम् तेन इन्द्रियाधिष्ठाने हस्ते यत् गमनं तद् अपि पादेन्द्रियस्यैव कर्म इति मन्तव्यम् तेन कर्मानन्त्यम् अपि न इन्द्रियानन्त्यम् आवहेत् इयति राजसस्य उपश्लेषकत्वम् इत्य् आहुः
    iast: |-
      antaḥ prāṇāśrayakarmānusandhes tu vāgindriyam tena indriyādhiṣṭhāne haste yat gamanaṃ tad api pādendriyasyaiva karma iti mantavyam tena karmānantyam api na indriyānantyam āvahet iyati rājasasya upaśleṣakatvam ity āhuḥ
  - verse_num: 80
    section_type: prose
    prose_block_ref: "ah8.b80"
    devanagari: |-
      अन्ये तु राजसान् मन इत्य् आहुः
    iast: |-
      anye tu rājasān mana ity āhuḥ
  - verse_num: 81
    section_type: prose
    prose_block_ref: "ah8.b81"
    devanagari: |-
      अन्ये तु सात्त्विकात् मनो राजसाच् च इन्द्रियाणि इति
    iast: |-
      anye tu sāttvikāt mano rājasāc ca indriyāṇi iti
  - verse_num: 82
    section_type: prose
    prose_block_ref: "ah8.b82"
    devanagari: |-
      भोक्त्रंशाच् छादकात् तु तमःप्रधानाहङ्कारात् तन्मात्राणि वेद्यैकरूपाणि पञ्च
    iast: |-
      bhoktraṃśāc chādakāt tu tamaḥpradhānāhaṅkārāt tanmātrāṇi vedyaikarūpāṇi pañca
  - verse_num: 83
    section_type: prose
    prose_block_ref: "ah8.b83"
    devanagari: |-
      शब्दविशेषाणां हि क्षोभात्मनां यद् एकम् अक्षोभात्मकं प्राग्भावि सामान्यम् अविशेषात्मकं तत् शब्दतन्मात्रम्
    iast: |-
      śabdaviśeṣāṇāṃ hi kṣobhātmanāṃ yad ekam akṣobhātmakaṃ prāgbhāvi sāmānyam aviśeṣātmakaṃ tat śabdatanmātram
  - verse_num: 84
    section_type: prose
    prose_block_ref: "ah8.b84"
    devanagari: |-
      एवं गन्धान्ते ऽपि वाच्यम्
    iast: |-
      evaṃ gandhānte 'pi vācyam
  - verse_num: 85
    section_type: prose
    prose_block_ref: "ah8.b85"
    devanagari: |-
      तत्र शब्दतन्मात्रात् क्षुभितात् अवकाशदानव्यापारं नभः शब्दस्य वाच्याध्यासावकाशसहत्वात्
    iast: |-
      tatra śabdatanmātrāt kṣubhitāt avakāśadānavyāpāraṃ nabhaḥ śabdasya vācyādhyāsāvakāśasahatvāt
  - verse_num: 86
    section_type: prose
    prose_block_ref: "ah8.b86"
    devanagari: |-
      शब्दतन्मात्रं क्षुभितं वायुः शब्दस् तु अस्य नभसा विरहाभावात्
    iast: |-
      śabdatanmātraṃ kṣubhitaṃ vāyuḥ śabdas tu asya nabhasā virahābhāvāt
  - verse_num: 87
    section_type: prose
    prose_block_ref: "ah8.b87"
    devanagari: |-
      रूपं क्षुभितं तेजः पूर्वगुणौ तु पूर्ववत्
    iast: |-
      rūpaṃ kṣubhitaṃ tejaḥ pūrvaguṇau tu pūrvavat
  - verse_num: 88
    section_type: prose
    prose_block_ref: "ah8.b88"
    devanagari: |-
      रसः क्षुभित आपः पूर्वे त्रयः पूर्ववत्
    iast: |-
      rasaḥ kṣubhita āpaḥ pūrve trayaḥ pūrvavat
  - verse_num: 89
    section_type: prose
    prose_block_ref: "ah8.b89"
    devanagari: |-
      गन्धः क्षुभितो धरा पूर्वे चत्वारः पूर्ववत्
    iast: |-
      gandhaḥ kṣubhito dharā pūrve catvāraḥ pūrvavat
  - verse_num: 90
    section_type: prose
    prose_block_ref: "ah8.b90"
    devanagari: |-
      अन्ये शब्दस्पर्शाभ्यां वायुः इत्यादिक्रमेण पञ्चभ्यो धरणी इति मन्यन्ते
    iast: |-
      anye śabdasparśābhyāṃ vāyuḥ ityādikrameṇa pañcabhyo dharaṇī iti manyante
  - verse_num: 91
    section_type: prose
    prose_block_ref: "ah8.b91"
    devanagari: |-
      गुणसमुदायमात्रं च पृथिवी नान्यो गुणी कश्चित्
    iast: |-
      guṇasamudāyamātraṃ ca pṛthivī nānyo guṇī kaścit
  - verse_num: 92
    section_type: prose
    prose_block_ref: "ah8.b92"
    devanagari: |-
      अस्मिंश् च तत्त्वकलापे ऊर्ध्वोर्ध्वगुणं व्यापकं निकृष्टगुणं तु व्याप्यम्
    iast: |-
      asmiṃś ca tattvakalāpe ūrdhvordhvaguṇaṃ vyāpakaṃ nikṛṣṭaguṇaṃ tu vyāpyam
  - verse_num: 93
    section_type: prose
    prose_block_ref: "ah8.b93"
    devanagari: |-
      स एव गुणस्य उत्कर्षो यत् तेन विना गुणान्तरं न उपपद्यते तेन पृथिवीतत्त्वं शिवतत्त्वात् प्रभृति जलतत्त्वेन व्याप्तम् एवं जलं तेजसा इत्यादि यावच् छक्तितत्त्वम्
    iast: |-
      sa eva guṇasya utkarṣo yat tena vinā guṇāntaraṃ na upapadyate tena pṛthivītattvaṃ śivatattvāt prabhṛti jalatattvena vyāptam evaṃ jalaṃ tejasā ityādi yāvac chaktitattvam
- chapter: 9
  title_sa: तन्त्रसार, नवमम् आह्निकम्
  title_iast: "tantrasāra, navamam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah9.b1"
    devanagari: |-
      स च सप्तधा षडर्धशास्त्र एव परं परमेशेन उक्तः
    iast: |-
      sa ca saptadhā ṣaḍardhaśāstra eva paraṃ parameśena uktaḥ
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah9.b2"
    devanagari: |-
      तत्र शिवाः मन्त्रमहेशाः मन्त्रेशाः मन्त्राः विज्ञानाकलाः प्रलयाकलाः सकला इति सप्त शक्तिमन्तः
    iast: |-
      tatra śivāḥ mantramaheśāḥ mantreśāḥ mantrāḥ vijñānākalāḥ pralayākalāḥ sakalā iti sapta śaktimantaḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah9.b3"
    devanagari: |-
      एषां सप्तैव शक्तयः तद्भेदात् पृथिव्यादिप्रधानतत्त्वान्तं चतुर्दशभिर् भेदैः प्रत्येकं स्वं रूपं पञ्चदशम्
    iast: |-
      eṣāṃ saptaiva śaktayaḥ tadbhedāt pṛthivyādipradhānatattvāntaṃ caturdaśabhir bhedaiḥ pratyekaṃ svaṃ rūpaṃ pañcadaśam
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah9.b4"
    devanagari: |-
      तत्र स्वं रूपं प्रमेयतायोग्यं स्वात्मनिष्ठम् अपराभट्टारिकानुग्रहात् प्रमातृषु उद्रिक्तशक्तिषु यत् विश्रान्तिभाजनं तत् तस्यैव शाक्तं रूपं श्रीमत्परापरानुग्रहात् तच् च सप्तविधं शक्तीनां तावत्त्वात्
    iast: |-
      tatra svaṃ rūpaṃ prameyatāyogyaṃ svātmaniṣṭham aparābhaṭṭārikānugrahāt pramātṛṣu udriktaśaktiṣu yat viśrāntibhājanaṃ tat tasyaiva śāktaṃ rūpaṃ śrīmatparāparānugrahāt tac ca saptavidhaṃ śaktīnāṃ tāvattvāt
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah9.b5"
    devanagari: |-
      शक्तिमद्रूपप्रधाने तु प्रमातृवर्गे यत् विश्रान्तं तच् छक्तिमच् छिवरूपं श्रीमत्पराभट्टारिकानुग्रहात् तद् अपि सप्तविधम्
    iast: |-
      śaktimadrūpapradhāne tu pramātṛvarge yat viśrāntaṃ tac chaktimac chivarūpaṃ śrīmatparābhaṭṭārikānugrahāt tad api saptavidham
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah9.b6"
    devanagari: |-
      प्रमातॄणां शिवात् प्रभृति सकलान्तानां तावताम् उक्तत्वात्
    iast: |-
      pramātṝṇāṃ śivāt prabhṛti sakalāntānāṃ tāvatām uktatvāt
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah9.b7"
    devanagari: |-
      तत्र शक्तिभेदाद् एव प्रमातॄणां भेदः स च स्फुटीकरणार्थं सकलादिक्रमेण भण्यते तत्र सकलस्य विद्याकले शक्तिः तद्विशेषरूपत्वात् बुद्धिकर्माक्षशक्तीनां प्रलयाकलस्य तु ते एव निर्विषयत्वात् अस्फुटे
    iast: |-
      tatra śaktibhedād eva pramātṝṇāṃ bhedaḥ sa ca sphuṭīkaraṇārthaṃ sakalādikrameṇa bhaṇyate tatra sakalasya vidyākale śaktiḥ tadviśeṣarūpatvāt buddhikarmākṣaśaktīnāṃ pralayākalasya tu te eva nirviṣayatvāt asphuṭe
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah9.b8"
    devanagari: |-
      विज्ञानाकलस्य ते एव विगलत्कल्पे तत्संस्कारसचिवा प्रबुध्यमाना शुद्धविद्या मन्त्रस्य
    iast: |-
      vijñānākalasya te eva vigalatkalpe tatsaṃskārasacivā prabudhyamānā śuddhavidyā mantrasya
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah9.b9"
    devanagari: |-
      तत्संस्कारहीना सैव प्रबुद्धा मन्त्रेशस्य
    iast: |-
      tatsaṃskārahīnā saiva prabuddhā mantreśasya
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah9.b10"
    devanagari: |-
      सैव इच्छाशक्तिरूपतां स्वातन्त्र्यस्वभावां जिघृक्षन्ती मन्त्रमहेश्वरस्य
    iast: |-
      saiva icchāśaktirūpatāṃ svātantryasvabhāvāṃ jighṛkṣantī mantramaheśvarasya
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah9.b11"
    devanagari: |-
      इच्छात्मिका स्फुटस्वातन्त्र्यात्मिका शिवस्य इति शक्तिभेदाः सप्त मुख्याः
    iast: |-
      icchātmikā sphuṭasvātantryātmikā śivasya iti śaktibhedāḥ sapta mukhyāḥ
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah9.b12"
    devanagari: |-
      तदुपरागकृतश् च शक्तिमत्सु प्रमातृषु भेदः करणभेदस्य कर्तृभेदपर्यवसानात् शक्तेर् एव च अव्यतिरिक्तायाः करणीकर्तुं शक्यत्वात् न अन्यस्य अनवस्थाद्यापत्तेः
    iast: |-
      taduparāgakṛtaś ca śaktimatsu pramātṛṣu bhedaḥ karaṇabhedasya kartṛbhedaparyavasānāt śakter eva ca avyatiriktāyāḥ karaṇīkartuṃ śakyatvāt na anyasya anavasthādyāpatteḥ
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah9.b13"
    devanagari: |-
      वस्तुतः पुनर् एक एव चित्स्वातन्त्र्यानन्दविश्रान्तः प्रमाता तत्र पृथिवी स्वरूपमात्रविश्रान्ता यदा वेद्यते तदा स्वरूपम् अस्याः केवलं भाति चैत्रचक्षुर्दृष्टं चैत्रविदितं जानामीति तत्र सकलशक्तिकृतं सकलशक्तिमद्रूपकृतं स्वरूपान्तरं भात्य् एव एवं शिवान्तम् अपि वाच्यं शिवशक्तिनिष्ठं शिवस्वभावविश्रान्तं च विश्वं जानामि इति प्रत्ययस्य विलक्षणस्य भावात्
    iast: |-
      vastutaḥ punar eka eva citsvātantryānandaviśrāntaḥ pramātā tatra pṛthivī svarūpamātraviśrāntā yadā vedyate tadā svarūpam asyāḥ kevalaṃ bhāti caitracakṣurdṛṣṭaṃ caitraviditaṃ jānāmīti tatra sakalaśaktikṛtaṃ sakalaśaktimadrūpakṛtaṃ svarūpāntaraṃ bhāty eva evaṃ śivāntam api vācyaṃ śivaśaktiniṣṭhaṃ śivasvabhāvaviśrāntaṃ ca viśvaṃ jānāmi iti pratyayasya vilakṣaṇasya bhāvāt
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah9.b14"
    devanagari: |-
      ननु भावस्य चेत् वेद्यता स्वं वपुः तत् सर्वान् प्रति वेद्यत्वं वेद्यत्वम् अपि वेद्यम् इत्य् अनवस्था तया च जगतो ऽन्धसुप्तत्वं सुप्रकाशम् एव तया च वेद्यत्वावेद्यत्वे विरुद्धधर्मयोग इति दोषः अत्र उच्यते
    iast: |-
      nanu bhāvasya cet vedyatā svaṃ vapuḥ tat sarvān prati vedyatvaṃ vedyatvam api vedyam ity anavasthā tayā ca jagato 'ndhasuptatvaṃ suprakāśam eva tayā ca vedyatvāvedyatve viruddhadharmayoga iti doṣaḥ atra ucyate
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah9.b15"
    devanagari: |-
      न तत् स्वं वपुः स्वरूपस्य पृथगुक्तत्वात् किं तर्हि तत् प्रमातृशक्तौ प्रमातरि च यत् विश्रान्तिभाजनं यत् रूपं तत् खलु तत् तत् स्वप्रकाशम् एव तत् प्रकाशते न तु किञ्चिद् अपि प्रति इति सर्वज्ञत्वम् अनवस्थाविरुद्धधर्मयोगश् च इति दूरापास्तम्
    iast: |-
      na tat svaṃ vapuḥ svarūpasya pṛthaguktatvāt kiṃ tarhi tat pramātṛśaktau pramātari ca yat viśrāntibhājanaṃ yat rūpaṃ tat khalu tat tat svaprakāśam eva tat prakāśate na tu kiñcid api prati iti sarvajñatvam anavasthāviruddhadharmayogaś ca iti dūrāpāstam
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah9.b16"
    devanagari: |-
      अनन्तप्रमातृसंवेद्यम् अपि एकम् एव तत् तस्य रूपं तावति तेषाम् एकाभासरूपत्वात् इति न प्रमात्रन्तरसंवेदनानुमानविघ्नः कश्चित् तच् च तस्य रूपं सत्यम् अर्थक्रियाकारित्वात् तथैव परदृश्यमानां कान्तां दृष्ट्वा तस्यै समीर्ष्यति शिवस्वभावं विश्रान्तिकुम्भं पश्यन् समाविशति समस्तानन्तप्रमातृविश्रान्तं वस्तु पश्यन् पूर्णीभवति नर्तकीप्रेक्षणवत् तस्यैव नीलस्य तद्रूपं प्रमातरि यत् विश्रान्तं तथैव स्वप्रकाशस्य विमर्शस्योदयात् इति पञ्चदशात्मकत्वं पृथिव्याः प्रभृति प्रधानतत्त्वपर्यन्तम्
    iast: |-
      anantapramātṛsaṃvedyam api ekam eva tat tasya rūpaṃ tāvati teṣām ekābhāsarūpatvāt iti na pramātrantarasaṃvedanānumānavighnaḥ kaścit tac ca tasya rūpaṃ satyam arthakriyākāritvāt tathaiva paradṛśyamānāṃ kāntāṃ dṛṣṭvā tasyai samīrṣyati śivasvabhāvaṃ viśrāntikumbhaṃ paśyan samāviśati samastānantapramātṛviśrāntaṃ vastu paśyan pūrṇībhavati nartakīprekṣaṇavat tasyaiva nīlasya tadrūpaṃ pramātari yat viśrāntaṃ tathaiva svaprakāśasya vimarśasyodayāt iti pañcadaśātmakatvaṃ pṛthivyāḥ prabhṛti pradhānatattvaparyantam
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah9.b17"
    devanagari: |-
      तावत्य् उद्रिक्तरागादिकञ्चुकस्य सकलस्य प्रमातृत्वात् सकलस्यापि एवं पाञ्चदश्यं तस्यापि तावद् वेद्यत्वात्
    iast: |-
      tāvaty udriktarāgādikañcukasya sakalasya pramātṛtvāt sakalasyāpi evaṃ pāñcadaśyaṃ tasyāpi tāvad vedyatvāt
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah9.b18"
    devanagari: |-
      वितत्य चैतत् निर्णीतं तन्त्रालोके
    iast: |-
      vitatya caitat nirṇītaṃ tantrāloke
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah9.b19"
    devanagari: |-
      पुंसः प्रभृति कलातत्त्वान्तं त्रयोदशधा
    iast: |-
      puṃsaḥ prabhṛti kalātattvāntaṃ trayodaśadhā
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah9.b20"
    devanagari: |-
      सकलस्य तत्र प्रमातृतायोगेन तच्छक्तिशक्तिमदात्मनो भेदद्वयस्य प्रत्यस्तमयात् तथा च सकलस्य स्वरूपत्वम् एव केवलं प्रलयाकलस्य स्वरूपत्वे पञ्चानां प्रमातृत्वे एकादश भेदाः
    iast: |-
      sakalasya tatra pramātṛtāyogena tacchaktiśaktimadātmano bhedadvayasya pratyastamayāt tathā ca sakalasya svarūpatvam eva kevalaṃ pralayākalasya svarūpatve pañcānāṃ pramātṛtve ekādaśa bhedāḥ
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah9.b21"
    devanagari: |-
      विज्ञानाकलस्य स्वरूपत्वे चतुर्णां प्रमातृत्वे नव भेदाः
    iast: |-
      vijñānākalasya svarūpatve caturṇāṃ pramātṛtve nava bhedāḥ
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah9.b22"
    devanagari: |-
      मन्त्रस्य स्वरूपत्वे त्रयाणां प्रमातृत्वे सप्त
    iast: |-
      mantrasya svarūpatve trayāṇāṃ pramātṛtve sapta
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah9.b23"
    devanagari: |-
      मन्त्रेशस्य स्वरूपत्वे द्वयोः प्रमातृत्वे पञ्च
    iast: |-
      mantreśasya svarūpatve dvayoḥ pramātṛtve pañca
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah9.b24"
    devanagari: |-
      मन्त्रमहेशस्य स्वरूपत्वे भगवत एकस्यैव प्रमातृत्वे शक्तिशक्तिमद्भेदात् त्रयः
    iast: |-
      mantramaheśasya svarūpatve bhagavata ekasyaiva pramātṛtve śaktiśaktimadbhedāt trayaḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah9.b25"
    devanagari: |-
      शिवस्य तु प्रकाशैकचित्स्वातन्त्र्यनिर्भरस्य न को ऽपि भेदः परिपूर्णत्वात्
    iast: |-
      śivasya tu prakāśaikacitsvātantryanirbharasya na ko 'pi bhedaḥ paripūrṇatvāt
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah9.b26"
    devanagari: |-
      एवम् अयं तत्त्वभेद एव परमेश्वरानुत्तरनयैकाख्ये निरूपितः भुवनभेदवैचित्र्यं करोति नरकस्वर्गरुद्रभुवनानां पार्थिवत्वे समाने ऽपि दूरतरस्य स्वभावभेदस्य उक्तत्वात्
    iast: |-
      evam ayaṃ tattvabheda eva parameśvarānuttaranayaikākhye nirūpitaḥ bhuvanabhedavaicitryaṃ karoti narakasvargarudrabhuvanānāṃ pārthivatve samāne 'pi dūratarasya svabhāvabhedasya uktatvāt
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah9.b27"
    devanagari: |-
      अत्र च परस्परं भेदकलनया अवान्तरभेदज्ञानकुतूहली तन्त्रालोकम् एव अवधारयेत्
    iast: |-
      atra ca parasparaṃ bhedakalanayā avāntarabhedajñānakutūhalī tantrālokam eva avadhārayet
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah9.b28"
    devanagari: |-
      एवम् एकैकघटाद्यनुसारेणापि पृथिव्यादीनां तत्त्वानां भेदो निरूपितः
    iast: |-
      evam ekaikaghaṭādyanusāreṇāpi pṛthivyādīnāṃ tattvānāṃ bhedo nirūpitaḥ
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah9.b29"
    devanagari: |-
      अधुना समस्तं पृथिवीतत्त्वं प्रमातृप्रमेयरूपम् उद्दिश्य निरूप्यते यो धरातत्त्वाभेदेन प्रकाशः स शिवः
    iast: |-
      adhunā samastaṃ pṛthivītattvaṃ pramātṛprameyarūpam uddiśya nirūpyate yo dharātattvābhedena prakāśaḥ sa śivaḥ
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah9.b30"
    devanagari: |-
      यथा श्रुतिः पृथिव्य् एवेदं ब्रह्म इति
    iast: |-
      yathā śrutiḥ pṛthivy evedaṃ brahma iti
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah9.b31"
    devanagari: |-
      धरातत्त्वसिद्धिप्रदान् प्रेरयति स धरामन्त्रमहेश्वरः प्रेर्यो धरामन्त्रेशः तस्यैवाभिमानिकविग्रहतात्मको वाचको मन्त्रः साङ्ख्यादिपाशवविद्योत्तीर्णशिवविद्याक्रमेण अभ्यस्तपार्थिवयोगो ऽप्राप्तध्रुवपदः धराविज्ञानाकलः
    iast: |-
      dharātattvasiddhipradān prerayati sa dharāmantramaheśvaraḥ preryo dharāmantreśaḥ tasyaivābhimānikavigrahatātmako vācako mantraḥ sāṅkhyādipāśavavidyottīrṇaśivavidyākrameṇa abhyastapārthivayogo 'prāptadhruvapadaḥ dharāvijñānākalaḥ
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah9.b32"
    devanagari: |-
      पाशवविद्याक्रमेण अभ्यस्तपार्थिवयोगः कल्पान्ते मरणे वा धराप्रलयकेवलः
    iast: |-
      pāśavavidyākrameṇa abhyastapārthivayogaḥ kalpānte maraṇe vā dharāpralayakevalaḥ
  - verse_num: 33
    section_type: prose
    prose_block_ref: "ah9.b33"
    devanagari: |-
      सौषुप्ते हि तत्त्वावेशवशाद् एव चित्रस्य स्वप्नस्य उदयः स्यात् गृहीतधराभिमानस् तु धरासकलः
    iast: |-
      sauṣupte hi tattvāveśavaśād eva citrasya svapnasya udayaḥ syāt gṛhītadharābhimānas tu dharāsakalaḥ
  - verse_num: 34
    section_type: prose
    prose_block_ref: "ah9.b34"
    devanagari: |-
      अत्रापि शक्त्युद्रेकन्यग्भावाभ्यां चतुर्दशत्वम् इति प्रमातृतापन्नस्य धरातत्त्वस्य भेदाः स्वरूपं तु शुद्धं प्रमेयम् इति एवम् अपरत्रापि
    iast: |-
      atrāpi śaktyudrekanyagbhāvābhyāṃ caturdaśatvam iti pramātṛtāpannasya dharātattvasya bhedāḥ svarūpaṃ tu śuddhaṃ prameyam iti evam aparatrāpi
  - verse_num: 35
    section_type: prose
    prose_block_ref: "ah9.b35"
    devanagari: |-
      अथ एकस्मिन् प्रमातरि प्राणप्रतिष्ठिततया भेदनिरूपणम् इह नीलं गृह्णतः प्राणः तुटिषोडशकात्मा वेद्यावेशपर्यन्तम् उदेति तत्र आद्या तुटिर् अविभागैकरूपा द्वितीया ग्राहकोल्लासरूपा अन्त्या तु ग्राह्याभिन्ना तन्मयी उपान्त्या तु स्फुटीभूतग्राहकरूपा मध्ये तु यत् तुटिद्वादशक तन्मध्यात् आद्यं षट्कं निर्विकल्पस्वभावं विकल्पाच् छादकं षट्त्वं च अस्य स्वरूपेण एका तुटिः आच्छादनीये च विकल्पे पञ्चरूपत्वम् उन्मिमिषा उन्मिषत्ता सा च इयं स्फुटक्रियारूपत्वात् तुटिद्वयात्मिका स्पन्दनस्य एकक्षणरूपत्वाभावात् उन्मिषितता स्वकार्यकर्तृत्वं च इत्य् एवम् आच्छादनीयविकल्पपाञ्चविध्यात् स्वरूपाच् च षट् क्षणा निर्विकल्पकाः ततो ऽपि निर्विकल्पस्य ध्वंसमानता ध्वंसो विकल्पस्य उन्मिमिषा उन्मिषत्ता तुटिद्वयात्मिका उन्मिषितता च इति षट् तुटयः
    iast: |-
      atha ekasmin pramātari prāṇapratiṣṭhitatayā bhedanirūpaṇam iha nīlaṃ gṛhṇataḥ prāṇaḥ tuṭiṣoḍaśakātmā vedyāveśaparyantam udeti tatra ādyā tuṭir avibhāgaikarūpā dvitīyā grāhakollāsarūpā antyā tu grāhyābhinnā tanmayī upāntyā tu sphuṭībhūtagrāhakarūpā madhye tu yat tuṭidvādaśaka tanmadhyāt ādyaṃ ṣaṭkaṃ nirvikalpasvabhāvaṃ vikalpāc chādakaṃ ṣaṭtvaṃ ca asya svarūpeṇa ekā tuṭiḥ ācchādanīye ca vikalpe pañcarūpatvam unmimiṣā unmiṣattā sā ca iyaṃ sphuṭakriyārūpatvāt tuṭidvayātmikā spandanasya ekakṣaṇarūpatvābhāvāt unmiṣitatā svakāryakartṛtvaṃ ca ity evam ācchādanīyavikalpapāñcavidhyāt svarūpāc ca ṣaṭ kṣaṇā nirvikalpakāḥ tato 'pi nirvikalpasya dhvaṃsamānatā dhvaṃso vikalpasya unmimiṣā unmiṣattā tuṭidvayātmikā unmiṣitatā ca iti ṣaṭ tuṭayaḥ
  - verse_num: 36
    section_type: prose
    prose_block_ref: "ah9.b36"
    devanagari: |-
      स्वकार्यकर्तृता तु ग्राहकरूपता इति उक्तं न सा भूयो गण्यते इत्य् एवं विवेकधना गुरूपवेशानुशीलिनः सर्वत्र पाञ्चदश्यं प्रविभागेन विविञ्चते
    iast: |-
      svakāryakartṛtā tu grāhakarūpatā iti uktaṃ na sā bhūyo gaṇyate ity evaṃ vivekadhanā gurūpaveśānuśīlinaḥ sarvatra pāñcadaśyaṃ pravibhāgena viviñcate
  - verse_num: 37
    section_type: prose
    prose_block_ref: "ah9.b37"
    devanagari: |-
      विकल्पन्यूनत्वे तु तुटिन्यूनता सुखादिसंवित्ताव् इव यावत् अविकल्पतैव
    iast: |-
      vikalpanyūnatve tu tuṭinyūnatā sukhādisaṃvittāv iva yāvat avikalpataiva
  - verse_num: 38
    section_type: prose
    prose_block_ref: "ah9.b38"
    devanagari: |-
      लोकास् तु विकल्पविश्रान्त्या ताम् अहन्तामयीम् अहन्ताच्छादितेदम्भावविकल्पप्रसरां निर्विकल्पां विमर्शभुवम् अप्रकाशिताम् इव मन्यन्ते दुःखावस्थां सुखविश्रान्ता इव विकल्पनिर्ह्रासेन तु सा प्रकाशत एव इति इयम् असौ सम्बन्धे ग्राह्यग्राहकयोः सावधानता इति अभिनवगुप्तगुरवः
    iast: |-
      lokās tu vikalpaviśrāntyā tām ahantāmayīm ahantācchāditedambhāvavikalpaprasarāṃ nirvikalpāṃ vimarśabhuvam aprakāśitām iva manyante duḥkhāvasthāṃ sukhaviśrāntā iva vikalpanirhrāsena tu sā prakāśata eva iti iyam asau sambandhe grāhyagrāhakayoḥ sāvadhānatā iti abhinavaguptaguravaḥ
  - verse_num: 39
    section_type: prose
    prose_block_ref: "ah9.b39"
    devanagari: |-
      एवं च पाञ्चदश्ये स्थिते यावत् स्फुटेदन्तात्मनो भेदस्य न्यूनता तावत् द्वयं द्वयं ह्रसति यावत् द्वितुटिकः शिवावेशः तत्र आद्या तुटिः सर्वतः पूर्णा द्वितीया सर्वज्ञानकरणाविष्टाभ्यस्यमाना सर्वज्ञत्वसर्वकर्तृत्वाय कल्पते न तु आद्या
    iast: |-
      evaṃ ca pāñcadaśye sthite yāvat sphuṭedantātmano bhedasya nyūnatā tāvat dvayaṃ dvayaṃ hrasati yāvat dvituṭikaḥ śivāveśaḥ tatra ādyā tuṭiḥ sarvataḥ pūrṇā dvitīyā sarvajñānakaraṇāviṣṭābhyasyamānā sarvajñatvasarvakartṛtvāya kalpate na tu ādyā
  - verse_num: 40
    section_type: prose
    prose_block_ref: "ah9.b40"
    devanagari: |-
      यद् आह श्रीकल्लटः तुटिपात इति अत्र पातशब्दं सैव भगवती श्रीमत्काली मातृसद्भावो भैरवः प्रतिभा इत्य् अलं रहस्यारहस्यनेन
    iast: |-
      yad āha śrīkallaṭaḥ tuṭipāta iti atra pātaśabdaṃ saiva bhagavatī śrīmatkālī mātṛsadbhāvo bhairavaḥ pratibhā ity alaṃ rahasyārahasyanena
  - verse_num: 41
    section_type: prose
    prose_block_ref: "ah9.b41"
    devanagari: |-
      एवं मन्त्रमहेशतुटेः प्रभृति तत्तदभ्यासात् तत्तत्सिद्धिः
    iast: |-
      evaṃ mantramaheśatuṭeḥ prabhṛti tattadabhyāsāt tattatsiddhiḥ
  - verse_num: 42
    section_type: prose
    prose_block_ref: "ah9.b42"
    devanagari: |-
      अथात्रैव जाग्रदाद्यवस्था निरूप्यन्ते तत्र वेद्यस्य तद्विषयायाश् च संविदो यत् वैचित्र्यम् अन्योन्यापेक्षं सत् सा अवस्था न वेद्यस्य केवलस्य न चापि केवलायाः संविदो न चापि पृथक् पृथक् द्वे
    iast: |-
      athātraiva jāgradādyavasthā nirūpyante tatra vedyasya tadviṣayāyāś ca saṃvido yat vaicitryam anyonyāpekṣaṃ sat sā avasthā na vedyasya kevalasya na cāpi kevalāyāḥ saṃvido na cāpi pṛthak pṛthak dve
  - verse_num: 43
    section_type: prose
    prose_block_ref: "ah9.b43"
    devanagari: |-
      तत्र यदाधिष्ठेयतया बहीरूपतया भानं तदा जाग्रदवस्था मेये मातरि माने च
    iast: |-
      tatra yadādhiṣṭheyatayā bahīrūpatayā bhānaṃ tadā jāgradavasthā meye mātari māne ca
  - verse_num: 44
    section_type: prose
    prose_block_ref: "ah9.b44"
    devanagari: |-
      यदा तु तत्रैव अधिष्ठानरूपतया भानं सङ्कल्पः तदा स्वप्नावस्था
    iast: |-
      yadā tu tatraiva adhiṣṭhānarūpatayā bhānaṃ saṅkalpaḥ tadā svapnāvasthā
  - verse_num: 45
    section_type: prose
    prose_block_ref: "ah9.b45"
    devanagari: |-
      यदा तु तत्रैव अधिष्ठातृरूपतया बीजात्मतयैव भानं तदा सुषुप्तावस्था
    iast: |-
      yadā tu tatraiva adhiṣṭhātṛrūpatayā bījātmatayaiva bhānaṃ tadā suṣuptāvasthā
  - verse_num: 46
    section_type: prose
    prose_block_ref: "ah9.b46"
    devanagari: |-
      इमा एव तिस्रः प्रमेयप्रमाणप्रमात्रवस्थाः प्रत्येकं जाग्रदादिभेदात् चतुर्विधा उक्ताः
    iast: |-
      imā eva tisraḥ prameyapramāṇapramātravasthāḥ pratyekaṃ jāgradādibhedāt caturvidhā uktāḥ
  - verse_num: 47
    section_type: prose
    prose_block_ref: "ah9.b47"
    devanagari: |-
      यदा तु तस्मिन्न् एव प्रमातृविश्रान्तिगते प्रमातुः पूर्णतौन्मुख्यात् तद्द्वारेण पूर्णतोन्मुखतया भानं तदा तुर्यावस्था सा च रूपं दृशाहम् इत्य् एवंविधम् अंशत्रयम् उत्तीर्य पश्यामीति अनुपायिका प्रमातृता स्वातन्त्र्यसारा नैकट्यमध्यत्वदूरत्वैः प्रमातृप्रमाणप्रमेयताभिषेकं ददती तदवस्थात्रयानुग्राहकत्वात् त्रिभेदा
    iast: |-
      yadā tu tasminn eva pramātṛviśrāntigate pramātuḥ pūrṇataunmukhyāt taddvāreṇa pūrṇatonmukhatayā bhānaṃ tadā turyāvasthā sā ca rūpaṃ dṛśāham ity evaṃvidham aṃśatrayam uttīrya paśyāmīti anupāyikā pramātṛtā svātantryasārā naikaṭyamadhyatvadūratvaiḥ pramātṛpramāṇaprameyatābhiṣekaṃ dadatī tadavasthātrayānugrāhakatvāt tribhedā
  - verse_num: 48
    section_type: prose
    prose_block_ref: "ah9.b48"
    devanagari: |-
      एतद् एव अवस्थाचतुष्टयं पिण्डस्थपदस्थरूपस्थरूपातीतशब्दैर् योगिनो व्यवहरन्ति प्रसङ्ख्यानधनास् तु सर्वतोभद्रं व्याप्तिः महाव्याप्तिः प्रचय इति शब्दैः
    iast: |-
      etad eva avasthācatuṣṭayaṃ piṇḍasthapadastharūpastharūpātītaśabdair yogino vyavaharanti prasaṅkhyānadhanās tu sarvatobhadraṃ vyāptiḥ mahāvyāptiḥ pracaya iti śabdaiḥ
  - verse_num: 49
    section_type: prose
    prose_block_ref: "ah9.b49"
    devanagari: |-
      अन्वर्थं चात्र दर्शितं तन्त्रालोके श्लोकवार्त्तिके च
    iast: |-
      anvarthaṃ cātra darśitaṃ tantrāloke ślokavārttike ca
  - verse_num: 50
    section_type: prose
    prose_block_ref: "ah9.b50"
    devanagari: |-
      यच् च सर्वान्तर्भूतं पूर्णरूपं तत् तुर्यातीतं सर्वातीतं महाप्रचयं च निरूपयन्ति
    iast: |-
      yac ca sarvāntarbhūtaṃ pūrṇarūpaṃ tat turyātītaṃ sarvātītaṃ mahāpracayaṃ ca nirūpayanti
  - verse_num: 51
    section_type: prose
    prose_block_ref: "ah9.b51"
    devanagari: |-
      किं च यस्य यद् यदा रूपं स्फुटं स्थिरम् अनुबन्धि तत् जाग्रत् तस्यैव तद्विपर्ययः स्वप्नः यः लयाकलस्य भोगः सर्वावेदनं सुषुप्तं यो विज्ञानाकलस्य भोगः भोग्याभिन्नीकरणं तुर्यं मन्त्रादीनां स भोगः भावानां शिवाभेदस् तुर्यातीतं सर्वातीतम्
    iast: |-
      kiṃ ca yasya yad yadā rūpaṃ sphuṭaṃ sthiram anubandhi tat jāgrat tasyaiva tadviparyayaḥ svapnaḥ yaḥ layākalasya bhogaḥ sarvāvedanaṃ suṣuptaṃ yo vijñānākalasya bhogaḥ bhogyābhinnīkaraṇaṃ turyaṃ mantrādīnāṃ sa bhogaḥ bhāvānāṃ śivābhedas turyātītaṃ sarvātītam
  - verse_num: 52
    section_type: prose
    prose_block_ref: "ah9.b52"
    devanagari: |-
      तत्र स्वरूपसकलौ १ प्रलयाकलः २ विज्ञानाकलः ३ मन्त्रतदीशतन्महेशवर्गः ४ शिवः ५ इति पञ्चदशभेदे पञ्च अवस्थाः
    iast: |-
      tatra svarūpasakalau 1 pralayākalaḥ 2 vijñānākalaḥ 3 mantratadīśatanmaheśavargaḥ 4 śivaḥ 5 iti pañcadaśabhede pañca avasthāḥ
  - verse_num: 53
    section_type: prose
    prose_block_ref: "ah9.b53"
    devanagari: |-
      स्वरूपं प्रलयाकल इत्यादिक्रमेण त्रयोदशभेदे स्वरूपं विज्ञानाकलशक्तिः विज्ञानाकल इत्य् एकादशभेदे स्वरूपं मन्त्राः तदीशाः महेशाः शिवः इति नवभेदे स्वरूपं मन्त्रेशाः महेशः शक्तिः शिव इति सप्तभेदे स्वरूपं महेशशक्तिः महेशः शक्तिः शिव इति पञ्चभेदे स्वरूपं क्रियाशक्तिः ज्ञानशक्तिः इच्छाशक्तिः शिव इति त्रिभेदे अभिन्ने ऽपि शिवतत्त्वे क्रियाज्ञानेच्छानन्दचिद्रूपकॢप्त्या प्रसङ्ख्यानयोगधनाः पञ्चपदत्वम् आहुः
    iast: |-
      svarūpaṃ pralayākala ityādikrameṇa trayodaśabhede svarūpaṃ vijñānākalaśaktiḥ vijñānākala ity ekādaśabhede svarūpaṃ mantrāḥ tadīśāḥ maheśāḥ śivaḥ iti navabhede svarūpaṃ mantreśāḥ maheśaḥ śaktiḥ śiva iti saptabhede svarūpaṃ maheśaśaktiḥ maheśaḥ śaktiḥ śiva iti pañcabhede svarūpaṃ kriyāśaktiḥ jñānaśaktiḥ icchāśaktiḥ śiva iti tribhede abhinne 'pi śivatattve kriyājñānecchānandacidrūpakḷptyā prasaṅkhyānayogadhanāḥ pañcapadatvam āhuḥ
- chapter: 10
  title_sa: तन्त्रसार, दशमम् आह्निकम्
  title_iast: "tantrasāra, daśamam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah10.b1"
    devanagari: |-
      उक्तस् तावत् तत्त्वाध्वा
    iast: |-
      uktas tāvat tattvādhvā
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah10.b2"
    devanagari: |-
      कलाद्यध्वा तु निरूप्यते तत्र यथा भुवनेषु अनुगामि किञ्चिद् रूपं तत्त्वम् इत्य् उक्तम् तथा तत्त्वेषु वर्गशो यत् अनुगामि रूपं तत् कला एकरूपकलनासहिष्णुत्वात्
    iast: |-
      kalādyadhvā tu nirūpyate tatra yathā bhuvaneṣu anugāmi kiñcid rūpaṃ tattvam ity uktam tathā tattveṣu vargaśo yat anugāmi rūpaṃ tat kalā ekarūpakalanāsahiṣṇutvāt
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah10.b3"
    devanagari: |-
      तद् यथा पृथिव्यां निवृत्तिः निवर्तते यतस् तत्त्वसर्ग इति
    iast: |-
      tad yathā pṛthivyāṃ nivṛttiḥ nivartate yatas tattvasarga iti
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah10.b4"
    devanagari: |-
      जलादिप्रधानान्ते वर्गे प्रतिष्ठा कारणतयाप्यायनपूरणकारित्वात्
    iast: |-
      jalādipradhānānte varge pratiṣṭhā kāraṇatayāpyāyanapūraṇakāritvāt
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah10.b5"
    devanagari: |-
      पुमादिमायान्ते विद्या वेद्यतिरोभावे संविदाधिक्यात्
    iast: |-
      pumādimāyānte vidyā vedyatirobhāve saṃvidādhikyāt
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah10.b6"
    devanagari: |-
      शुद्धविद्यादिशक्त्यन्ते शान्ता कञ्चुकतरङ्गोपशमात्
    iast: |-
      śuddhavidyādiśaktyante śāntā kañcukataraṅgopaśamāt
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah10.b7"
    devanagari: |-
      एतद् एव अण्डचतुष्टयं पार्थिवप्राकृतमायीयशाक्ताभिधम्
    iast: |-
      etad eva aṇḍacatuṣṭayaṃ pārthivaprākṛtamāyīyaśāktābhidham
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah10.b8"
    devanagari: |-
      पृथिव्यादिशक्तीनाम् अत्र अवस्थानेन शक्तितत्त्वे यावत् परस्पर्शो विद्यते स्पर्शस्य च सप्रतिघत्वम् इति तावति युक्तम् अण्डत्वम्
    iast: |-
      pṛthivyādiśaktīnām atra avasthānena śaktitattve yāvat parasparśo vidyate sparśasya ca sapratighatvam iti tāvati yuktam aṇḍatvam
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah10.b9"
    devanagari: |-
      शिवतत्त्वे शान्तातीता तस्योपदेशभावनार्चादौ कल्यमानत्वात्
    iast: |-
      śivatattve śāntātītā tasyopadeśabhāvanārcādau kalyamānatvāt
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah10.b10"
    devanagari: |-
      स्वतन्त्रं तु परं तत्त्वं तत्रापि यत् अप्रमेयं तत् कलातीतम्
    iast: |-
      svatantraṃ tu paraṃ tattvaṃ tatrāpi yat aprameyaṃ tat kalātītam
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah10.b11"
    devanagari: |-
      एवं पञ्चैव कलाः षट्त्रिंशत्तत्त्वानि
    iast: |-
      evaṃ pañcaiva kalāḥ ṣaṭtriṃśattattvāni
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah10.b12"
    devanagari: |-
      तथाहि प्रमेयत्वं द्विधा स्थूलसूक्ष्मत्वेन इति दश
    iast: |-
      tathāhi prameyatvaṃ dvidhā sthūlasūkṣmatvena iti daśa
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah10.b13"
    devanagari: |-
      करणत्वं द्विधा शुद्धं कर्तृतास्पर्शि च इति दश
    iast: |-
      karaṇatvaṃ dvidhā śuddhaṃ kartṛtāsparśi ca iti daśa
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah10.b14"
    devanagari: |-
      करणतोपसर्जनकर्तृभावस्फुटत्वात् पञ्च शुद्धकर्तृभावात् पञ्च विगलितविभागतया विकासोन्मुखत्वे पञ्च सर्वावच्छेदशून्यं शिवतत्त्वं षट्त्रिंशम्
    iast: |-
      karaṇatopasarjanakartṛbhāvasphuṭatvāt pañca śuddhakartṛbhāvāt pañca vigalitavibhāgatayā vikāsonmukhatve pañca sarvāvacchedaśūnyaṃ śivatattvaṃ ṣaṭtriṃśam
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah10.b15"
    devanagari: |-
      तद् यदा उपदिश्यते भाव्यते वा यत् तत्प्रतिष्ठापदम् तत् सप्तत्रिंशम् तस्मिन्न् अपि भाव्यमाने अष्टात्रिंशम् न च अनवस्था तस्य भाव्यमानस्य अनवच्छिन्नस्वातन्त्र्ययोगिनो वेद्यीकरणे सप्तत्रिम्श एव पर्यवसानात् षट्त्रिंशं तु सर्वतत्त्वोत्तीर्णतया सम्भाव्यावच्छेदम् इति पञ्चकलाविधिः
    iast: |-
      tad yadā upadiśyate bhāvyate vā yat tatpratiṣṭhāpadam tat saptatriṃśam tasminn api bhāvyamāne aṣṭātriṃśam na ca anavasthā tasya bhāvyamānasya anavacchinnasvātantryayogino vedyīkaraṇe saptatrimśa eva paryavasānāt ṣaṭtriṃśaṃ tu sarvatattvottīrṇatayā sambhāvyāvacchedam iti pañcakalāvidhiḥ
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah10.b16"
    devanagari: |-
      विज्ञानाकलपर्यन्तम् आत्मकला ईशान्तं विद्याकला शिष्टं शिवकला इति त्रितत्त्वविधिः
    iast: |-
      vijñānākalaparyantam ātmakalā īśāntaṃ vidyākalā śiṣṭaṃ śivakalā iti tritattvavidhiḥ
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah10.b17"
    devanagari: |-
      एवं नवतत्त्वाद्य् अपि ऊहयेत् इति
    iast: |-
      evaṃ navatattvādy api ūhayet iti
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah10.b18"
    devanagari: |-
      मेयांशगामी स्थूलसूक्ष्मपररूपत्वात् त्रिविधो भुवनतत्त्वकलात्माध्वभेदः मातृविश्रान्त्या तथैव त्रिविधः तत्र प्रमाणतायां पदाध्वा प्रमाणस्यैव क्षोभतरङ्गशाम्यत्तायां मन्त्राध्वा तत्प्रशमे पूर्णप्रमातृतायां वर्णाध्वा स एव च असौ तावति विश्रान्त्या लब्धस्वरूपो भवति इति एकस्यैव षड्विधत्वं युक्तम्
    iast: |-
      meyāṃśagāmī sthūlasūkṣmapararūpatvāt trividho bhuvanatattvakalātmādhvabhedaḥ mātṛviśrāntyā tathaiva trividhaḥ tatra pramāṇatāyāṃ padādhvā pramāṇasyaiva kṣobhataraṅgaśāmyattāyāṃ mantrādhvā tatpraśame pūrṇapramātṛtāyāṃ varṇādhvā sa eva ca asau tāvati viśrāntyā labdhasvarūpo bhavati iti ekasyaiva ṣaḍvidhatvaṃ yuktam
- chapter: 11
  title_sa: तन्त्रसार, एकादशम् आह्निकम्
  title_iast: "tantrasāra, ekādaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah11.b1"
    devanagari: |-
      तत्र यावत् इदम् उक्तम् तत् साक्षात् कस्यचित् अपवर्गाप्तये यथोक्तसङ्ग्रहनीत्या भवति कस्यचित् वक्ष्यमाणदीक्षायाम् उपयोगगमनात् इति दीक्षादिकं वक्तव्यम्
    iast: |-
      tatra yāvat idam uktam tat sākṣāt kasyacit apavargāptaye yathoktasaṅgrahanītyā bhavati kasyacit vakṣyamāṇadīkṣāyām upayogagamanāt iti dīkṣādikaṃ vaktavyam
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah11.b2"
    devanagari: |-
      तत्र कः अधिकारी इति निरूपणार्थं शक्तिपातो विचार्यते
    iast: |-
      tatra kaḥ adhikārī iti nirūpaṇārthaṃ śaktipāto vicāryate
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah11.b3"
    devanagari: |-
      तत्र केचित् आहुः ज्ञानाभावात् अज्ञानमूलः संसारः तदपगमे ज्ञानोदयात् शक्तिपात इति तेषां सम्यक् ज्ञानोदय एव विकृत इति वाच्यम् कर्मजन्यत्वे कर्मफलवत् भोगत्वप्रसङ्गे भोगिनि च शक्तिपाताभ्युपगतौ अतिप्रसङ्गः ईश्वरेच्छानिमित्तत्वे तु ज्ञानोदयस्य अन्योन्याश्रयता वैयर्थ्यं च ईश्वरे रागादिप्रसङ्गः विरुद्धयोः कर्मणोः समबलयोः अन्योन्यप्रतिबन्धे कर्मसाम्यं ततः शक्तिपात इति चेत् न क्रमिकत्वे विरोधायोगात् विरोधे ऽपि अन्यस्य अविरुद्धस्य कर्मणो भोगदानप्रसङ्गात् अविरुद्धकर्माप्रवृत्तौ तदैव देहपातप्रसङ्गात् जात्यायुष्प्रदं कर्म न प्रतिबध्यते भोगप्रदम् एव तु प्रतिबध्यते इति चेत् कुतः तत्कर्मसद्भावे यदि शक्तिः पतेत् तर्हि सा भोगप्रदात् किं बिभियात्
    iast: |-
      tatra kecit āhuḥ jñānābhāvāt ajñānamūlaḥ saṃsāraḥ tadapagame jñānodayāt śaktipāta iti teṣāṃ samyak jñānodaya eva vikṛta iti vācyam karmajanyatve karmaphalavat bhogatvaprasaṅge bhogini ca śaktipātābhyupagatau atiprasaṅgaḥ īśvarecchānimittatve tu jñānodayasya anyonyāśrayatā vaiyarthyaṃ ca īśvare rāgādiprasaṅgaḥ viruddhayoḥ karmaṇoḥ samabalayoḥ anyonyapratibandhe karmasāmyaṃ tataḥ śaktipāta iti cet na kramikatve virodhāyogāt virodhe 'pi anyasya aviruddhasya karmaṇo bhogadānaprasaṅgāt aviruddhakarmāpravṛttau tadaiva dehapātaprasaṅgāt jātyāyuṣpradaṃ karma na pratibadhyate bhogapradam eva tu pratibadhyate iti cet kutaḥ tatkarmasadbhāve yadi śaktiḥ patet tarhi sā bhogapradāt kiṃ bibhiyāt
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah11.b4"
    devanagari: |-
      अथ मलपरिपाके शक्तिपातः सो ऽपि किंस्वरूपः किं च तस्य निमित्तम् इति एतेन वैराग्यं धर्मविशेषो विवेकः सत्सेवा सत्प्राप्तिः देवपूजा इत्यादिहेतुः प्रत्युक्त इति भेदवादिनां सर्वम् असमञ्जसम्
    iast: |-
      atha malaparipāke śaktipātaḥ so 'pi kiṃsvarūpaḥ kiṃ ca tasya nimittam iti etena vairāgyaṃ dharmaviśeṣo vivekaḥ satsevā satprāptiḥ devapūjā ityādihetuḥ pratyukta iti bhedavādināṃ sarvam asamañjasam
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah11.b5"
    devanagari: |-
      स्वतन्त्रपरमेशाद्वयवादे तु उपपद्यते एतत् यथाहि परमेश्वरः स्वरूपाच्छादनक्रीडया पशुः पुद्गलो ऽणुः सम्पन्नः न च तस्य देशकालस्वरूपभेदविरोधः तद्वत् स्वरूपस्थगनविनिवृत्त्या स्वरूपप्रत्यापत्तिं झटिति वा क्रमेण वा समाश्रयन् शक्तिपातपात्रम् अणुः उच्यते स्वातन्त्र्यमात्रसारश् च असौ परमशिवः शक्तेः पातयिता इति निरपेक्ष एव शक्तिपातो यः स्वरूपप्रथाफलः यस् तु भोगोत्सुकस्य स कर्मापेक्षः लोकोत्तररूपभोगोत्सुकस्य तु स एव शक्तिपातः परमेश्वरेच्छाप्रेरितमायागर्भाधिकारीयरुद्रविष्णुब्रह्मादिद्वारेण मन्त्रादिरूपत्वं मायापुंविवेकं पुंस्कलाविवेकं पुम्प्रकृतिविवेकं पुम्बुद्धिविवेकम् अन्यच् च फलं प्रस्नुवानः तदधरतत्त्वभोगं प्रतिबध्नाति भोगमोक्षोभयोत्सुकस्य भोगे कर्मापेक्षो मोक्षे तु तन्निरपेक्षः इति सापेक्षनिरपेक्षः
    iast: |-
      svatantraparameśādvayavāde tu upapadyate etat yathāhi parameśvaraḥ svarūpācchādanakrīḍayā paśuḥ pudgalo 'ṇuḥ sampannaḥ na ca tasya deśakālasvarūpabhedavirodhaḥ tadvat svarūpasthaganavinivṛttyā svarūpapratyāpattiṃ jhaṭiti vā krameṇa vā samāśrayan śaktipātapātram aṇuḥ ucyate svātantryamātrasāraś ca asau paramaśivaḥ śakteḥ pātayitā iti nirapekṣa eva śaktipāto yaḥ svarūpaprathāphalaḥ yas tu bhogotsukasya sa karmāpekṣaḥ lokottararūpabhogotsukasya tu sa eva śaktipātaḥ parameśvarecchāpreritamāyāgarbhādhikārīyarudraviṣṇubrahmādidvāreṇa mantrādirūpatvaṃ māyāpuṃvivekaṃ puṃskalāvivekaṃ pumprakṛtivivekaṃ pumbuddhivivekam anyac ca phalaṃ prasnuvānaḥ tadadharatattvabhogaṃ pratibadhnāti bhogamokṣobhayotsukasya bhoge karmāpekṣo mokṣe tu tannirapekṣaḥ iti sāpekṣanirapekṣaḥ
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah11.b6"
    devanagari: |-
      न च वाच्यं कस्मात् कस्मिंश्चिद् एव पुंसि शक्तिपात इति स एव परमेश्वरः तथा भाति इति सतत्त्वे को ऽसौ पुमान् नाम यदुद्देशेन विषयकृता चोदना इयम्
    iast: |-
      na ca vācyaṃ kasmāt kasmiṃścid eva puṃsi śaktipāta iti sa eva parameśvaraḥ tathā bhāti iti satattve ko 'sau pumān nāma yaduddeśena viṣayakṛtā codanā iyam
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah11.b7"
    devanagari: |-
      स चायं शक्तिपातो नवधा तीव्रमध्यमन्दस्य उत्कर्षमाध्यस्थ्यनिकर्षैः पुनस् त्रैविध्यात् तत्र उत्कृष्टतीव्रात् तदैव देहपाते परमेशता मध्यतीव्रात् शास्त्राचार्यानपेक्षिणः स्वप्रत्ययस्य प्रातिभज्ञानोदयः यदुदये बाह्यसंस्कारं विनैव भोगापवर्गप्रदः प्रातिभो गुरुर् इत्य् उच्यते तस्य हि न समय्यादिकल्पना काचित् अत्रापि तारतम्यसद्भावः इच्छावैचित्र्यात् इति सत्य् अपि प्रातिभत्वे शास्त्राद्यपेक्षा संवादाय स्याद् अपि इति निर्भित्तिसभित्त्यादिबहुभेदत्वम् आचार्यस्य प्रातिभस्यागमेषु उक्तम् सर्वथा प्रतिभांशो बलीयान् तत्सन्निधौ अन्येषाम् अनधिकारात्
    iast: |-
      sa cāyaṃ śaktipāto navadhā tīvramadhyamandasya utkarṣamādhyasthyanikarṣaiḥ punas traividhyāt tatra utkṛṣṭatīvrāt tadaiva dehapāte parameśatā madhyatīvrāt śāstrācāryānapekṣiṇaḥ svapratyayasya prātibhajñānodayaḥ yadudaye bāhyasaṃskāraṃ vinaiva bhogāpavargapradaḥ prātibho gurur ity ucyate tasya hi na samayyādikalpanā kācit atrāpi tāratamyasadbhāvaḥ icchāvaicitryāt iti saty api prātibhatve śāstrādyapekṣā saṃvādāya syād api iti nirbhittisabhittyādibahubhedatvam ācāryasya prātibhasyāgameṣu uktam sarvathā pratibhāṃśo balīyān tatsannidhau anyeṣām anadhikārāt
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah11.b8"
    devanagari: |-
      भेददर्शन इव अनादिशिवसन्निधौ मुक्तशिवानां सृष्टिलयादिकृत्येषु मन्दतीव्रात् शक्तिपातात् सद्गुरुविषया यियासा भवति असद्गुरुविषयायां तु तिरोभाव एव असद्गुरुतस् तु सद्गुरुगमनं शक्तिपाताद् एव
    iast: |-
      bhedadarśana iva anādiśivasannidhau muktaśivānāṃ sṛṣṭilayādikṛtyeṣu mandatīvrāt śaktipātāt sadguruviṣayā yiyāsā bhavati asadguruviṣayāyāṃ tu tirobhāva eva asadgurutas tu sadgurugamanaṃ śaktipātād eva
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah11.b9"
    devanagari: |-
      सद्गुरुस् तु समस्तैतच्छास्त्रतत्त्वज्ञानपूर्णः साक्षात् भगवद्भैरवभट्टारक एव योगिनो ऽपि स्वभ्यस्तज्ञानतयैव मोचकत्वे तत्र योग्यत्वस्य सौभाग्यलावण्यादिमत्त्वस्येवानुपयोगात्
    iast: |-
      sadgurus tu samastaitacchāstratattvajñānapūrṇaḥ sākṣāt bhagavadbhairavabhaṭṭāraka eva yogino 'pi svabhyastajñānatayaiva mocakatve tatra yogyatvasya saubhāgyalāvaṇyādimattvasyevānupayogāt
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah11.b10"
    devanagari: |-
      असद्गुरुस् तु अन्यः सर्व एव
    iast: |-
      asadgurus tu anyaḥ sarva eva
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah11.b11"
    devanagari: |-
      एवं यियासुः गुरोः ज्ञानलक्षणां दीक्षां प्राप्नोति यया सद्य एव मुक्तो भवति जीवन्न् अपि अत्र अवलोकनात् कथनात् शास्त्रसम्बोधनात् चर्यादर्शनात् चरुदानात् इत्यादयो भेदाः
    iast: |-
      evaṃ yiyāsuḥ guroḥ jñānalakṣaṇāṃ dīkṣāṃ prāpnoti yayā sadya eva mukto bhavati jīvann api atra avalokanāt kathanāt śāstrasambodhanāt caryādarśanāt carudānāt ityādayo bhedāḥ
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah11.b12"
    devanagari: |-
      अभ्यासवतो वा तदानीं सद्य एव प्राणवियोजिकां दीक्षां लभते सा तु मरणक्षण एव कार्या इति वक्ष्याम इति
    iast: |-
      abhyāsavato vā tadānīṃ sadya eva prāṇaviyojikāṃ dīkṣāṃ labhate sā tu maraṇakṣaṇa eva kāryā iti vakṣyāma iti
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah11.b13"
    devanagari: |-
      तीव्रास् त्रिधा उत्कृष्टमध्यात् शक्तिपातात् कृतदीक्षाको ऽपि स्वात्मनः शिवतायां न तथा दृढप्रतिपत्तिः भवति प्रतिपत्तिपरिपाकक्रमेण तु देहान्ते शिव एव मध्यमध्यात् तु शिवतोत्सुको ऽपि भोगप्रेप्सुः भवति इति तथैव दीक्षायां ज्ञानभाजनम् स च योगाभ्यासलब्धम् अनेनैव देहेन भोगं भुक्त्वा देहान्ते शिव एव
    iast: |-
      tīvrās tridhā utkṛṣṭamadhyāt śaktipātāt kṛtadīkṣāko 'pi svātmanaḥ śivatāyāṃ na tathā dṛḍhapratipattiḥ bhavati pratipattiparipākakrameṇa tu dehānte śiva eva madhyamadhyāt tu śivatotsuko 'pi bhogaprepsuḥ bhavati iti tathaiva dīkṣāyāṃ jñānabhājanam sa ca yogābhyāsalabdham anenaiva dehena bhogaṃ bhuktvā dehānte śiva eva
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah11.b14"
    devanagari: |-
      निकृष्टमध्यात् तु देहान्तरेण भोगं भुक्त्वा शिवत्वम् एति इति
    iast: |-
      nikṛṣṭamadhyāt tu dehāntareṇa bhogaṃ bhuktvā śivatvam eti iti
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah11.b15"
    devanagari: |-
