  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah11.b13"
    devanagari: |-
      तीव्रास् त्रिधा उत्कृष्टमध्यात् शक्तिपातात् कृतदीक्षाको ऽपि स्वात्मनः शिवतायां न तथा दृढप्रतिपत्तिः भवति प्रतिपत्तिपरिपाकक्रमेण तु देहान्ते शिव एव मध्यमध्यात् तु शिवतोत्सुको ऽपि भोगप्रेप्सुः भवति इति तथैव दीक्षायां ज्ञानभाजनम् स च योगाभ्यासलब्धम् अनेनैव देहेन भोगं भुक्त्वा देहान्ते शिव एव
    iast: |-
      tīvrās tridhā utkṛṣṭamadhyāt śaktipātāt kṛtadīkṣāko 'pi svātmanaḥ śivatāyāṃ na tathā dṛḍhapratipattiḥ bhavati pratipattiparipākakrameṇa tu dehānte śiva eva madhyamadhyāt tu śivatotsuko 'pi bhogaprepsuḥ bhavati iti tathaiva dīkṣāyāṃ jñānabhājanam sa ca yogābhyāsalabdham anenaiva dehena bhogaṃ bhuktvā dehānte śiva eva
  - verse_num: 14
