      तत्र स्वास्तिकं मण्डलं कृत्वा तत्र सौवर्णं पीठं दत्त्वा तत्र समस्तम् अध्वानं पूजयित्वा तत्पीठं तेन अधिष्ठाप्य तस्मै पूजां कृत्वा तर्पणं भोजनं दक्षिणाम् आत्मानम् इति निवेद्य नैवेद्योच्छिष्टं प्रार्थ्य वन्दित्वा स्वयं प्राश्य चक्रपूजां कुर्यात्
    iast: |-
      tatra svāstikaṃ maṇḍalaṃ kṛtvā tatra sauvarṇaṃ pīṭhaṃ dattvā tatra samastam adhvānaṃ pūjayitvā tatpīṭhaṃ tena adhiṣṭhāpya tasmai pūjāṃ kṛtvā tarpaṇaṃ bhojanaṃ dakṣiṇām ātmānam iti nivedya naivedyocchiṣṭaṃ prārthya vanditvā svayaṃ prāśya cakrapūjāṃ kuryāt
  - verse_num: 65
    section_type: prose
    prose_block_ref: "ah20.b65"
    devanagari: |-
      इत गुरुपूजाविधिः
    iast: |-
      ita gurupūjāvidhiḥ
- chapter: 21
  title_sa: तन्त्रसार, एकविंशम् आह्निकम्
  title_iast: "tantrasāra, ekaviṃśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah21.b1"
    devanagari: |-
      एवं समस्तं नित्यं नैमित्तिकं कर्म निरूपितम्
    iast: |-
      evaṃ samastaṃ nityaṃ naimittikaṃ karma nirūpitam
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah21.b2"
    devanagari: |-
      अधुना अस्यैव आगमस्य प्रामाण्यम् उच्यते
    iast: |-
      adhunā asyaiva āgamasya prāmāṇyam ucyate
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah21.b3"
    devanagari: |-
      तत्र संविन्मात्रमये विश्वस्मिन् संविदि च विमर्शात्मिकायां विमर्शस्य च शब्दनात्मकतायां सिद्धायां सकलजगन्निष्ठवस्तुनः तद्गतस्य च कर्मफलसम्बन्धवैचित्र्यस्य यत् विमर्शनं तद् एव शास्त्रम् इति परमेश्वरस्वभावाभिन्न एव समस्तः शास्त्रसन्दर्भो वस्तुत एकफलप्रापकः एकाधिकार्युद्देशेनैव तत्र तु परमेश्वरनियतिशक्तिमहिम्नैव भागे भागे रूढिः लोकानाम् इति
    iast: |-
      tatra saṃvinmātramaye viśvasmin saṃvidi ca vimarśātmikāyāṃ vimarśasya ca śabdanātmakatāyāṃ siddhāyāṃ sakalajaganniṣṭhavastunaḥ tadgatasya ca karmaphalasambandhavaicitryasya yat vimarśanaṃ tad eva śāstram iti parameśvarasvabhāvābhinna eva samastaḥ śāstrasandarbho vastuta ekaphalaprāpakaḥ ekādhikāryuddeśenaiva tatra tu parameśvaraniyatiśaktimahimnaiva bhāge bhāge rūḍhiḥ lokānām iti
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah21.b4"
    devanagari: |-
      केचित् मायोचितभेदपरामर्शात्मनि वेदागमादिशास्त्रे रूढाः अन्ये तथाविध एव मोक्षाभिमानेन साङ्ख्यवैष्णवशास्त्रादौ परे तु विविक्तशिवस्वभावामर्शनसारे शैवसिद्धान्तादौ अन्ये सर्वमयपरमेश्वरतामर्शनसारे मतङ्गादिशास्त्रे केचित् तु विरलविरलाः समस्तावच्छेदवन्ध्यस्वातन्त्र्यानन्दपरमार्थसंविन्मयपरमेश्वरस्वरूपामर्शनात्मनि श्रीत्रिकशास्त्रक्रमे केचित् तु पूर्वपूर्वत्यागक्रमेण लङ्घनेन वा इत्य् एवम् एकफलसिद्धिः एकस्माद् एव आगमात्
    iast: |-
      kecit māyocitabhedaparāmarśātmani vedāgamādiśāstre rūḍhāḥ anye tathāvidha eva mokṣābhimānena sāṅkhyavaiṣṇavaśāstrādau pare tu viviktaśivasvabhāvāmarśanasāre śaivasiddhāntādau anye sarvamayaparameśvaratāmarśanasāre mataṅgādiśāstre kecit tu viralaviralāḥ samastāvacchedavandhyasvātantryānandaparamārthasaṃvinmayaparameśvarasvarūpāmarśanātmani śrītrikaśāstrakrame kecit tu pūrvapūrvatyāgakrameṇa laṅghanena vā ity evam ekaphalasiddhiḥ ekasmād eva āgamāt
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah21.b5"
    devanagari: |-
      भेदवादे ऽपि समस्तागमानाम् एकेश्वरकार्यत्वे ऽपि प्रामाण्यं तावत् अवस्थितम् प्रामाण्यनिबन्धनस्य एकदेशसंवादस्य अविगीतताया अनिदन्ताप्रवृत्तेश् च तुल्यत्वात् परस्परबाधो विषयभेदात् अकिञ्चित्करः
    iast: |-
      bhedavāde 'pi samastāgamānām ekeśvarakāryatve 'pi prāmāṇyaṃ tāvat avasthitam prāmāṇyanibandhanasya ekadeśasaṃvādasya avigītatāyā anidantāpravṛtteś ca tulyatvāt parasparabādho viṣayabhedāt akiñcitkaraḥ
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah21.b6"
    devanagari: |-
      ब्रह्महननतन्निषेधवत् संस्कारभेदः संस्कारातिशयः तदभावे क्वचित् अनधिकृतत्वम् इति समानम् आश्रमभेदवत् फलोत्कर्षाच् च उत्कर्षः तत्रैव उपनिषद्भागवत् भिन्नकर्तृकत्वे ऽपि सर्वसर्वज्ञकृतत्वम् अत्र सम्भाव्यते तदुक्ततदतिरिक्तयुक्तार्थयोगात् नित्यत्वे ऽपि आगमानां प्रसिद्धिः तावत् अवश्योपगम्या अन्वयव्यतिरेकाध्यक्षादीनां तत्प्रामाण्यस्य तन्मूलत्वात् सत्यं रजतं पश्यामि इति हि सौवर्णिकादिपरप्रसिद्ध्यैव प्रसिद्धिर् एव आगमः सा काचित् दृष्टफला बुभुक्षितो भुङ्क्ते इति बालस्य प्रसिद्धित एव तत्र तत्र प्रवृत्तिः नान्वयव्यतिरेकाभ्यां तदा तयोः अभावात् यौवनावस्थायां तद्भावो ऽपि अकिञ्चित्करः प्रसिद्धिं तु मूलीकृत्य सो ऽस्तु कस्मैचित् कार्याय काचित् अदृष्टवैदेह्यप्रकृतिलयपुरुषकैवल्यफलदा काचित् शिवसमानत्वफलदा काचित् ऐक्यपर्यवसायिनी सा च प्रत्येकम् अनेकविधा इत्य् एवं बहुतरप्रसिद्धिपूर्णे जगति यो यादृशो भविष्यन् स तादृशीम् एव प्रसिद्धिं बलाद् एव हृदयपर्यवसायिनीम् अभिमन्यते
    iast: |-
      brahmahananatanniṣedhavat saṃskārabhedaḥ saṃskārātiśayaḥ tadabhāve kvacit anadhikṛtatvam iti samānam āśramabhedavat phalotkarṣāc ca utkarṣaḥ tatraiva upaniṣadbhāgavat bhinnakartṛkatve 'pi sarvasarvajñakṛtatvam atra sambhāvyate taduktatadatiriktayuktārthayogāt nityatve 'pi āgamānāṃ prasiddhiḥ tāvat avaśyopagamyā anvayavyatirekādhyakṣādīnāṃ tatprāmāṇyasya tanmūlatvāt satyaṃ rajataṃ paśyāmi iti hi sauvarṇikādiparaprasiddhyaiva prasiddhir eva āgamaḥ sā kācit dṛṣṭaphalā bubhukṣito bhuṅkte iti bālasya prasiddhita eva tatra tatra pravṛttiḥ nānvayavyatirekābhyāṃ tadā tayoḥ abhāvāt yauvanāvasthāyāṃ tadbhāvo 'pi akiñcitkaraḥ prasiddhiṃ tu mūlīkṛtya so 'stu kasmaicit kāryāya kācit adṛṣṭavaidehyaprakṛtilayapuruṣakaivalyaphaladā kācit śivasamānatvaphaladā kācit aikyaparyavasāyinī sā ca pratyekam anekavidhā ity evaṃ bahutaraprasiddhipūrṇe jagati yo yādṛśo bhaviṣyan sa tādṛśīm eva prasiddhiṃ balād eva hṛdayaparyavasāyinīm abhimanyate
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah21.b7"
    devanagari: |-
      इति रिक्तस्य जन्तोः अतिरिक्ता वाचोयुक्तिः तासां काञ्चन प्रसिद्धिं प्रमाणीकुर्वता अभ्युपगन्तव्यम् एव आगमप्रामाण्यम् इति स आगम आश्रयणीयो यत्र उत्कृष्टं फलम् इत्य् अलम् अन्येन
    iast: |-
      iti riktasya jantoḥ atiriktā vācoyuktiḥ tāsāṃ kāñcana prasiddhiṃ pramāṇīkurvatā abhyupagantavyam eva āgamaprāmāṇyam iti sa āgama āśrayaṇīyo yatra utkṛṣṭaṃ phalam ity alam anyena
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah21.b8"
    devanagari: |-
      संवित्प्रकाशपरमार्थतया यथैव भात्य् आमृशत्य् अपि तथेति विवेचयन्तः
    iast: |-
      saṃvitprakāśaparamārthatayā yathaiva bhāty āmṛśaty api tatheti vivecayantaḥ
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah21.b9"
    devanagari: |-
      सन्तः समस्तमयचित्प्रतिभाविमर्शसारं समाश्रयत शास्त्रम् अनुत्तरात्म
    iast: |-
      santaḥ samastamayacitpratibhāvimarśasāraṃ samāśrayata śāstram anuttarātma
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah21.b10"
    devanagari: |-
      जिस्स दढपसिद्धिघडिए ववहारे सोइ अस्मि णीसङ्को
    iast: |-
      jissa daḍhapasiddhighaḍie vavahāre soi asmi ṇīsaṅko
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah21.b11"
    devanagari: |-
      तह होहि जहुत्तिण पसिद्धिरूढिए परमसिवो
    iast: |-
      taha hohi jahuttiṇa pasiddhirūḍhie paramasivo
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah21.b12"
    devanagari: |-
      निजदृढप्रसिद्धिघटिते व्यवहारे लोक अस्ति निःशङ्कः
    iast: |-
      nijadṛḍhaprasiddhighaṭite vyavahāre loka asti niḥśaṅkaḥ
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah21.b13"
    devanagari: |-
      तदा भवति जनोत्तीर्णप्रसिद्धिरूढः परमशिवः
    iast: |-
      tadā bhavati janottīrṇaprasiddhirūḍhaḥ paramaśivaḥ
- chapter: 22
  title_sa: तन्त्रसार, द्वाविंशम् आह्निकम्
  title_iast: "tantrasāra, dvāviṃśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah22.b1"
    devanagari: |-
      अथ समस्ता इयम् उपासा समुन्मिषत्तादृशदृढवासनारूढान् अधिकारिणः प्रति श्रीमत्कौलिकप्रक्रियया निरूप्यते तत्र उक्तं योगसञ्चारादौ आनन्दं ब्रह्म तद्देहे त्रिधौष्ट्यान्त्यव्यवस्थितम्
    iast: |-
      atha samastā iyam upāsā samunmiṣattādṛśadṛḍhavāsanārūḍhān adhikāriṇaḥ prati śrīmatkaulikaprakriyayā nirūpyate tatra uktaṃ yogasañcārādau ānandaṃ brahma taddehe tridhauṣṭyāntyavyavasthitam
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah22.b2"
    devanagari: |-
      अब्रह्मचारिणस् तस्य त्यागाद् आनन्दवर्जिताः
    iast: |-
      abrahmacāriṇas tasya tyāgād ānandavarjitāḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah22.b3"
    devanagari: |-
      आनन्दकृत्रिमाहारवर्जं चक्रस्य याजकाः
    iast: |-
      ānandakṛtrimāhāravarjaṃ cakrasya yājakāḥ
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah22.b4"
    devanagari: |-
      द्वये ऽपि नरके घोरे तस्माद् एनां स्थितिं भजेत्
    iast: |-
      dvaye 'pi narake ghore tasmād enāṃ sthitiṃ bhajet
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah22.b5"
    devanagari: |-
      तद् अनया स्थित्या कुलयागः स च षोढा बाह्ये शक्तौ स्वदेहे यामले प्राणे संविदि च इति
    iast: |-
      tad anayā sthityā kulayāgaḥ sa ca ṣoḍhā bāhye śaktau svadehe yāmale prāṇe saṃvidi ca iti
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah22.b6"
    devanagari: |-
      तत्र च उत्तर उत्तर उत्कृष्टः पूर्वः पूर्वस् तद्रुच्यर्थम्
    iast: |-
      tatra ca uttara uttara utkṛṣṭaḥ pūrvaḥ pūrvas tadrucyartham
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah22.b7"
    devanagari: |-
      सिद्धिकामस्य द्वितीयतुर्यपञ्चमाः सर्वथा निर्वर्त्याः षष्ठस् तु मुमुक्षोः मुख्यः तस्यापि द्वितीयाद्या नैमित्तिके यथासम्भवम् अनुष्ठेया एव विधिपूरणार्थं च
    iast: |-
      siddhikāmasya dvitīyaturyapañcamāḥ sarvathā nirvartyāḥ ṣaṣṭhas tu mumukṣoḥ mukhyaḥ tasyāpi dvitīyādyā naimittike yathāsambhavam anuṣṭheyā eva vidhipūraṇārthaṃ ca
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah22.b8"
    devanagari: |-
      तत्र बाह्यं स्थण्डिलम् आनन्दपूर्णं वीरपात्रम् अरुणः पटः पूर्वोक्तम् अपि वा लिङ्गादि
    iast: |-
      tatra bāhyaṃ sthaṇḍilam ānandapūrṇaṃ vīrapātram aruṇaḥ paṭaḥ pūrvoktam api vā liṅgādi
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah22.b9"
    devanagari: |-
      तत्र स्नानादिकर्तव्यानपेक्षयैव पूर्णानन्दविश्रान्त्यैव लब्धशुद्धिः प्रथमं प्राणसंविद्देहैकीभावं भावयित्वा संविदश् च परमशिवरूपत्वात् सप्तविंशतिवारं मन्त्रम् उच्चार्य मूर्धवक्त्रहृद्गुह्यमूर्तिषु अनुलोमविलोमाभ्यां विश्वाध्वपरिपूर्णता परमेश्वरे अपरत्वे परापरत्वे परत्वे ऽपि च
    iast: |-
      tatra snānādikartavyānapekṣayaiva pūrṇānandaviśrāntyaiva labdhaśuddhiḥ prathamaṃ prāṇasaṃviddehaikībhāvaṃ bhāvayitvā saṃvidaś ca paramaśivarūpatvāt saptaviṃśativāraṃ mantram uccārya mūrdhavaktrahṛdguhyamūrtiṣu anulomavilomābhyāṃ viśvādhvaparipūrṇatā parameśvare aparatve parāparatve paratve 'pi ca
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah22.b10"
    devanagari: |-
      तथाहि मायापुम्प्रकृतिगुणधीप्रभृति धरान्तं सप्तविंशतितत्त्वानि कलादीनां तत्रैव अन्तर्भावात् विद्याशक्ताव् अपि परापरत्वे ब्रह्मपञ्चकस्य सद्यस्त्वाजातत्वभवोद्भवत्वादीनां धर्माणां सप्तविंशतिरूपत्वम् एव उक्तं श्रीमल्लकुलेशादिपादैः
    iast: |-
      tathāhi māyāpumprakṛtiguṇadhīprabhṛti dharāntaṃ saptaviṃśatitattvāni kalādīnāṃ tatraiva antarbhāvāt vidyāśaktāv api parāparatve brahmapañcakasya sadyastvājātatvabhavodbhavatvādīnāṃ dharmāṇāṃ saptaviṃśatirūpatvam eva uktaṃ śrīmallakuleśādipādaiḥ
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah22.b11"
    devanagari: |-
      परत्वे ऽपि पञ्चशक्तिः हि परमेश्वरः प्रतिशक्ति च पञ्चरूपता एवं पञ्चविंशतिः शक्तयः ताश् च अन्योन्यम् अनुद्भिन्नविभागा इत्य् एका शक्तिः सा चानुद्भिन्नविभागा इत्य् एवं सप्तविंशतिरूपया व्याप्त्या संविदग्नेः शिखां बुद्धिप्राणरूपां सकृदुच्चारमात्रेणैव बद्धां कुर्यात् येन परमशिव एव प्रतिबद्धा तन्त्रातिरिक्तं न किञ्चिद् अभिधावति तथाविधबुद्ध्यधिष्ठितकरणचक्रानुवेधेन पुरोवर्तिनो यागद्रव्यगृहदिगाधारादीन् अपि तन्मयीभूतान् कुर्यात् ततो ऽर्घपात्रम् अपि शिखाबन्धव्याप्त्यैव पूरयेत् पूजयेच् च तद्विप्रुड्भिः स्थण्डिलान्य् अपि तद्रसेन वामानामाङ्गुष्ठयोगात् देहचक्रेषु मन्त्रचक्रं पूजयेत् तर्पयेत् च ततः प्राणान्तः ततः स्थण्डिले त्रिशूलात्मकं शक्तित्रयान्तम् आसनं कल्पयेत् मायान्तं हि सार्णे औकारे च शक्तित्रयान्तम् आसनं कल्पयेत् मायान्तं हि सार्णे औकारे च शक्तित्रयान्तं तदुपरि याज्या विमर्शरूपा शक्तिः इत्य् एवं सकृद् उच्चारेणैव आधाराधेयन्यासं कृत्वा तत्रैव आधेयभूतायाम् अपि संविदि विश्वं पश्येत् तद् अपि च संविन्मयम् इत्य् एवं विश्वस्य संविदा तेन च तस्याः सम्पुटीभावो भवति संविद उदितं तत्रैव पर्यवसितं यतो विश्वं वेद्याच् च संवित् उदेति तत्रैव च विश्राम्यति इति एतावत्त्वं संवित्तत्त्वं सम्पुटीभावद्वयात् लभ्यते
    iast: |-
      paratve 'pi pañcaśaktiḥ hi parameśvaraḥ pratiśakti ca pañcarūpatā evaṃ pañcaviṃśatiḥ śaktayaḥ tāś ca anyonyam anudbhinnavibhāgā ity ekā śaktiḥ sā cānudbhinnavibhāgā ity evaṃ saptaviṃśatirūpayā vyāptyā saṃvidagneḥ śikhāṃ buddhiprāṇarūpāṃ sakṛduccāramātreṇaiva baddhāṃ kuryāt yena paramaśiva eva pratibaddhā tantrātiriktaṃ na kiñcid abhidhāvati tathāvidhabuddhyadhiṣṭhitakaraṇacakrānuvedhena purovartino yāgadravyagṛhadigādhārādīn api tanmayībhūtān kuryāt tato 'rghapātram api śikhābandhavyāptyaiva pūrayet pūjayec ca tadvipruḍbhiḥ sthaṇḍilāny api tadrasena vāmānāmāṅguṣṭhayogāt dehacakreṣu mantracakraṃ pūjayet tarpayet ca tataḥ prāṇāntaḥ tataḥ sthaṇḍile triśūlātmakaṃ śaktitrayāntam āsanaṃ kalpayet māyāntaṃ hi sārṇe aukāre ca śaktitrayāntam āsanaṃ kalpayet māyāntaṃ hi sārṇe aukāre ca śaktitrayāntaṃ tadupari yājyā vimarśarūpā śaktiḥ ity evaṃ sakṛd uccāreṇaiva ādhārādheyanyāsaṃ kṛtvā tatraiva ādheyabhūtāyām api saṃvidi viśvaṃ paśyet tad api ca saṃvinmayam ity evaṃ viśvasya saṃvidā tena ca tasyāḥ sampuṭībhāvo bhavati saṃvida uditaṃ tatraiva paryavasitaṃ yato viśvaṃ vedyāc ca saṃvit udeti tatraiva ca viśrāmyati iti etāvattvaṃ saṃvittattvaṃ sampuṭībhāvadvayāt labhyate
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah22.b12"
    devanagari: |-
      तद् उक्तम् सृष्टिं तु सम्पुटीकृत्य इति
    iast: |-
      tad uktam sṛṣṭiṃ tu sampuṭīkṛtya iti
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah22.b13"
    devanagari: |-
      ततो गन्धधूपासवकुसुमादीन् आत्मप्रह्वीभावान्तान् अर्पयित्वा स्वविश्रान्त्या जप्त्वा उपसंहृत्य जले निक्षिपेत्
    iast: |-
      tato gandhadhūpāsavakusumādīn ātmaprahvībhāvāntān arpayitvā svaviśrāntyā japtvā upasaṃhṛtya jale nikṣipet
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah22.b14"
    devanagari: |-
      इति बाह्ययागः
    iast: |-
      iti bāhyayāgaḥ
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah22.b15"
    devanagari: |-
      अथ शक्तौ तत्र अन्योन्यं शक्तितालासावीराणाम् उभयेषाम् उभयात्मकत्वेन प्रोल्लासप्रारम्भसृष्ट्यन्तशिवशक्तिप्रबोधे परस्परं व्यापारात् परमेशनियत्या च शुद्धरूपतया तत्र प्राधान्यम् एतेन च विशिष्टचक्रस्यापि शक्तित्वं व्याख्यातम् तत्र शिखाबन्धव्याप्त्यैव पूजनं शक्तित्रयान्तम् आसनं कोणत्रये मध्ये विसर्गशक्तिः इति तु व्याप्तौ विशेषः
    iast: |-
      atha śaktau tatra anyonyaṃ śaktitālāsāvīrāṇām ubhayeṣām ubhayātmakatvena prollāsaprārambhasṛṣṭyantaśivaśaktiprabodhe parasparaṃ vyāpārāt parameśaniyatyā ca śuddharūpatayā tatra prādhānyam etena ca viśiṣṭacakrasyāpi śaktitvaṃ vyākhyātam tatra śikhābandhavyāptyaiva pūjanaṃ śaktitrayāntam āsanaṃ koṇatraye madhye visargaśaktiḥ iti tu vyāptau viśeṣaḥ
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah22.b16"
    devanagari: |-
      एवं स्वदेहे तत्रैव चक्रे ततो ब्रह्मरन्ध्राद्यनुचक्रेषु
    iast: |-
      evaṃ svadehe tatraiva cakre tato brahmarandhrādyanucakreṣu
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah22.b17"
    devanagari: |-
      अथ यामले शक्तेर् लक्षणम् एतत् तद्वद् अभेदस् ततो ऽनपेक्ष्य वयः । जात्यादींश् चासङ्गात् लोकेतरयुगलजं हि तादात्म्यम्
    iast: |-
      atha yāmale śakter lakṣaṇam etat tadvad abhedas tato 'napekṣya vayaḥ | jātyādīṃś cāsaṅgāt loketarayugalajaṃ hi tādātmyam
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah22.b18"
    devanagari: |-
      कार्यहेतुसहोत्थत्वात् त्रैधं साक्षाद् अथान्यथा । कॢप्तावतो मिथो ऽभ्यर्च्य तर्प्यानन्दान्तिकत्वतः
    iast: |-
      kāryahetusahotthatvāt traidhaṃ sākṣād athānyathā | kḷptāvato mitho 'bhyarcya tarpyānandāntikatvataḥ
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah22.b19"
    devanagari: |-
      चक्रम् अर्चेत् तदौचित्याद् अनुचक्रं तथानुगम् । बहिः पुष्पादिनान्तश् च गन्धभुक्त्यासवादिभिः
    iast: |-
      cakram arcet tadaucityād anucakraṃ tathānugam | bahiḥ puṣpādināntaś ca gandhabhuktyāsavādibhiḥ
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah22.b20"
    devanagari: |-
      एवम् आनन्दसन्दोहिततच्चेष्टोच्छलत्स्थितिः । अनुचक्रगणश् चक्रतादात्म्याद् अभिलीयते
    iast: |-
      evam ānandasandohitatacceṣṭocchalatsthitiḥ | anucakragaṇaś cakratādātmyād abhilīyate
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah22.b21"
    devanagari: |-
      निजनिजभोगाभोगप्रविकासमयस्वरूपपरिमर्शे । क्रमशो ऽनुचक्रदेव्यः संविच्चक्रं हि मध्यमं यान्ति
    iast: |-
      nijanijabhogābhogapravikāsamayasvarūpaparimarśe | kramaśo 'nucakradevyaḥ saṃviccakraṃ hi madhyamaṃ yānti
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah22.b22"
    devanagari: |-
      अनुचक्रदेवतात्मकमरीचिगणपूरणाधिगतवीर्यम् । तच्छक्तितद्वदात्मकम् अन्योन्यसमुन्मुखं भवति
    iast: |-
      anucakradevatātmakamarīcigaṇapūraṇādhigatavīryam | tacchaktitadvadātmakam anyonyasamunmukhaṃ bhavati
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah22.b23"
    devanagari: |-
      तद्युगलमूर्ध्वधामप्रवेशसस्पन्दजातसङ्क्षोभम् । क्षुभ्नात्य् अनुचक्राण्य् अपि तानि तदा तन्मयानि न पृथक् तु
    iast: |-
      tadyugalamūrdhvadhāmapraveśasaspandajātasaṅkṣobham | kṣubhnāty anucakrāṇy api tāni tadā tanmayāni na pṛthak tu
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah22.b24"
    devanagari: |-
      इत्थं यामलम् एतद् गलितभिदासङ्कथं यदैव तदा । क्रमतारतम्ययोगात् सैव हि संविद्विसर्गसङ्घट्टः
    iast: |-
      itthaṃ yāmalam etad galitabhidāsaṅkathaṃ yadaiva tadā | kramatāratamyayogāt saiva hi saṃvidvisargasaṅghaṭṭaḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah22.b25"
    devanagari: |-
      तद्ध्रुवधामानुत्तरम् उभयात्मकजगद् उदारम् आनन्दम् । नो शान्तं नाप्य् उदितं शान्तोदितसूतिकारणं परं कौलम्
    iast: |-
      taddhruvadhāmānuttaram ubhayātmakajagad udāram ānandam | no śāntaṃ nāpy uditaṃ śāntoditasūtikāraṇaṃ paraṃ kaulam
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah22.b26"
    devanagari: |-
      अनवच्छिन्नपदेप्सुस् तां संविदम् आत्मसात्कुर्यात् । शान्तोदितात्मकद्वयम् अथ युगपद् उदेति शक्तिशक्तिमतोः
    iast: |-
      anavacchinnapadepsus tāṃ saṃvidam ātmasātkuryāt | śāntoditātmakadvayam atha yugapad udeti śaktiśaktimatoḥ
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah22.b27"
    devanagari: |-
      स्वात्मान्योन्यावेशात् शान्तान्यत्वे द्वयोर् द्वयात्मत्वात् । शक्तिस् तु तद्वद् उदितां सृष्टिं पुष्णाति नो तद्वान्
    iast: |-
      svātmānyonyāveśāt śāntānyatve dvayor dvayātmatvāt | śaktis tu tadvad uditāṃ sṛṣṭiṃ puṣṇāti no tadvān
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah22.b28"
    devanagari: |-
      तस्यां चार्यं कुलम् अथ तया नृषु प्रोक्तयोगसङ्घट्टान् । अथ सृष्टे द्वितये ऽस्मिन् शान्तोदितधाम्नि ये ऽनुसन्दधते
    iast: |-
      tasyāṃ cāryaṃ kulam atha tayā nṛṣu proktayogasaṅghaṭṭān | atha sṛṣṭe dvitaye 'smin śāntoditadhāmni ye 'nusandadhate
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah22.b29"
    devanagari: |-
      प्राच्यां विसर्गसत्ताम् अनवच्छिदिते पदे रूढाः । उदितं च मिथो वक्त्रान् मुख्याद् वक्त्रे प्रगृह्यते च बहिः
    iast: |-
      prācyāṃ visargasattām anavacchidite pade rūḍhāḥ | uditaṃ ca mitho vaktrān mukhyād vaktre pragṛhyate ca bahiḥ
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah22.b30"
    devanagari: |-
      तृप्तं देवीचक्रं सिद्धिज्ञानापवर्गदं भवति । शान्ताभ्यासे शान्तं शिवम् एति यद् अत्र देवताचक्रम्
    iast: |-
      tṛptaṃ devīcakraṃ siddhijñānāpavargadaṃ bhavati | śāntābhyāse śāntaṃ śivam eti yad atra devatācakram
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah22.b31"
    devanagari: |-
      शून्यं निरानन्दमयं निर्वृतिनिजधामतो ऽर्घं च । रणरणकरसान् निजरसभरितबहिर्भावचर्वणरसेन
    iast: |-
      śūnyaṃ nirānandamayaṃ nirvṛtinijadhāmato 'rghaṃ ca | raṇaraṇakarasān nijarasabharitabahirbhāvacarvaṇarasena
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah22.b32"
    devanagari: |-
      आन्तरपूर्णसमुच्छलदनुचक्रं याति चक्रम् अथ तद् अपि । उच्छलति प्राग्वद् इति त्रिविधो ऽन्वर्थो विसर्गो ऽयम्
    iast: |-
      āntarapūrṇasamucchaladanucakraṃ yāti cakram atha tad api | ucchalati prāgvad iti trividho 'nvartho visargo 'yam
  - verse_num: 33
    section_type: prose
    prose_block_ref: "ah22.b33"
    devanagari: |-
      एतद् विसर्गधामनि परिमर्शनतस् त्रिधैव मनुवीर्यम् । तत्तत्संविद्गर्भे मन्त्रस् तत्तत्फलं सूते
    iast: |-
      etad visargadhāmani parimarśanatas tridhaiva manuvīryam | tattatsaṃvidgarbhe mantras tattatphalaṃ sūte
  - verse_num: 34
    section_type: prose
    prose_block_ref: "ah22.b34"
    devanagari: |-
      कोणत्रयान्तराश्रितनित्योदितमङ्गलच्छदे कमले । नित्यावियुतं नालं षोडशदलकमलसन्मूलम्
    iast: |-
      koṇatrayāntarāśritanityoditamaṅgalacchade kamale | nityāviyutaṃ nālaṃ ṣoḍaśadalakamalasanmūlam
  - verse_num: 35
    section_type: prose
    prose_block_ref: "ah22.b35"
    devanagari: |-
      मध्यस्थनालगुम्फितसरोजयुगघट्टनक्रमादग्नौ । मध्यस्थशशधरसुन्दरदिनकरकरौघसङ्घट्टात्
    iast: |-
      madhyasthanālagumphitasarojayugaghaṭṭanakramādagnau | madhyasthaśaśadharasundaradinakarakaraughasaṅghaṭṭāt
  - verse_num: 36
    section_type: prose
    prose_block_ref: "ah22.b36"
    devanagari: |-
      त्रिदलारुणवीर्यकलासङ्गान् मध्ये ऽङ्कुरसृष्टिः । इति शशधरवासरपतिचित्रगुषङ्घट्टमुद्रया झटिति
    iast: |-
      tridalāruṇavīryakalāsaṅgān madhye 'ṅkurasṛṣṭiḥ | iti śaśadharavāsarapaticitraguṣaṅghaṭṭamudrayā jhaṭiti
  - verse_num: 37
    section_type: prose
    prose_block_ref: "ah22.b37"
    devanagari: |-
      सृष्ट्यादिक्रमम् अन्तः कुर्वंस् तुर्ये स्थितिं लभते । एतत् खेचरमुद्रावेशे ऽन्योन्यं स्वशक्तिशक्तिमतोः
    iast: |-
      sṛṣṭyādikramam antaḥ kurvaṃs turye sthitiṃ labhate | etat khecaramudrāveśe 'nyonyaṃ svaśaktiśaktimatoḥ
  - verse_num: 38
    section_type: prose
    prose_block_ref: "ah22.b38"
    devanagari: |-
      पानोपभोगलीलाहासादिषु यो भवेद् विमर्शमयः । अव्यक्तध्वनिरावस्फोटश्रुतिनादनादान्तैः
    iast: |-
      pānopabhogalīlāhāsādiṣu yo bhaved vimarśamayaḥ | avyaktadhvanirāvasphoṭaśrutinādanādāntaiḥ
  - verse_num: 39
    section_type: prose
    prose_block_ref: "ah22.b39"
    devanagari: |-
      अव्युच्छिन्नानाहतपरमार्थैर् मन्त्रवीर्यं तत् । गमनागमविश्रान्तिषु कर्णे नयने द्विलक्ष्यसम्पर्के
    iast: |-
      avyucchinnānāhataparamārthair mantravīryaṃ tat | gamanāgamaviśrāntiṣu karṇe nayane dvilakṣyasamparke
  - verse_num: 40
    section_type: prose
    prose_block_ref: "ah22.b40"
    devanagari: |-
      तत्सम्मीलनयोगे देहान्ताख्ये च यामले चक्रे । कुचमध्यहृदयदेशाद् ओष्ठान्ते कण्ठगं यद् अव्यक्तम्
    iast: |-
      tatsammīlanayoge dehāntākhye ca yāmale cakre | kucamadhyahṛdayadeśād oṣṭhānte kaṇṭhagaṃ yad avyaktam
  - verse_num: 41
    section_type: prose
    prose_block_ref: "ah22.b41"
    devanagari: |-
      तच् चक्रद्वयमध्यगम् आकर्ण्य क्षोभविगमसमये यत् । निर्वान्ति तत्र चैवं यो ऽष्टविधो नादभैरवः परमः
    iast: |-
      tac cakradvayamadhyagam ākarṇya kṣobhavigamasamaye yat | nirvānti tatra caivaṃ yo 'ṣṭavidho nādabhairavaḥ paramaḥ
  - verse_num: 42
    section_type: prose
    prose_block_ref: "ah22.b42"
    devanagari: |-
      ज्योतिर् ध्वनिश् च यस्मात् सा मान्त्री व्याप्तिर् उच्यते परमा । कर्मणि कर्मणि विदुषः स्याज् जीवतो मुक्तिः
    iast: |-
      jyotir dhvaniś ca yasmāt sā māntrī vyāptir ucyate paramā | karmaṇi karmaṇi viduṣaḥ syāj jīvato muktiḥ
  - verse_num: 43
    section_type: prose
    prose_block_ref: "ah22.b43"
    devanagari: |-
      तज्ज्ञः शास्त्रे मुक्तः परकुलविज्ञानभाजनं गर्भः । शून्याशून्यालयं कुर्याद् एकदण्डे ऽनलानिलौ
    iast: |-
      tajjñaḥ śāstre muktaḥ parakulavijñānabhājanaṃ garbhaḥ | śūnyāśūnyālayaṃ kuryād ekadaṇḍe 'nalānilau
  - verse_num: 44
    section_type: prose
    prose_block_ref: "ah22.b44"
    devanagari: |-
      शूलं समरसीकृत्य रसे रसम् इव स्थितम् । त्यक्ताशङ्को निराचारो नाहम् अस्मीति भावयन्
    iast: |-
      śūlaṃ samarasīkṛtya rase rasam iva sthitam | tyaktāśaṅko nirācāro nāham asmīti bhāvayan
  - verse_num: 45
    section_type: prose
    prose_block_ref: "ah22.b45"
    devanagari: |-
      देहस्था देवताः पश्यन् ह्लादोद्वेगादि चिद्धने । कर्णाक्षिमुखनासादिचक्रस्थं देवतागणम्
    iast: |-
      dehasthā devatāḥ paśyan hlādodvegādi ciddhane | karṇākṣimukhanāsādicakrasthaṃ devatāgaṇam
  - verse_num: 46
    section_type: prose
    prose_block_ref: "ah22.b47"
    devanagari: |-
      ग्रहीतारं सदा पश्यन् खेचर्या सिध्यति ध्रुवम्
    iast: |-
      grahītāraṃ sadā paśyan khecaryā sidhyati dhruvam
  - verse_num: 47
    section_type: prose
    prose_block_ref: "ah22.b48"
    devanagari: |-
      श्वभ्रे सुदूरे झटिति स्वदेहं सम्पातयन् वासम् असाहसेन । आकुञ्च्य हस्तद्वितयं प्रपश्यन् मुद्राम् इमां व्योमचरीं भजेत
    iast: |-
      śvabhre sudūre jhaṭiti svadehaṃ sampātayan vāsam asāhasena | ākuñcya hastadvitayaṃ prapaśyan mudrām imāṃ vyomacarīṃ bhajeta
  - verse_num: 48
    section_type: prose
    prose_block_ref: "ah22.b49"
    devanagari: |-
      इत्य् एष यामलयागः
    iast: |-
      ity eṣa yāmalayāgaḥ
  - verse_num: 49
    section_type: prose
    prose_block_ref: "ah22.b50"
    devanagari: |-
      उक्तव्याप्तिके प्राणे विश्वमये प्रोक्तसंविद्व्याप्त्या तर्पणान्नगन्धधूपादिसमर्पणेन उपोद्बलनं प्राणयागः
    iast: |-
      uktavyāptike prāṇe viśvamaye proktasaṃvidvyāptyā tarpaṇānnagandhadhūpādisamarpaṇena upodbalanaṃ prāṇayāgaḥ
  - verse_num: 50
    section_type: prose
    prose_block_ref: "ah22.b51"
    devanagari: |-
      विश्रान्तिरूढिस् तु संविद्यागः प्राग् एव निरूपितः
    iast: |-
      viśrāntirūḍhis tu saṃvidyāgaḥ prāg eva nirūpitaḥ
  - verse_num: 51
    section_type: prose
    prose_block_ref: "ah22.b52"
    devanagari: |-
      एवम् एतेभ्यो यागेभ्यो ऽन्यतमं कृत्वा यदि तथाविधनिर्विचिकित्सतापचित्रितहृदयः शिष्यो भवति तदा तस्मै तद्यागदर्शनपूर्वकं तिलाज्याहुतिपूर्वकनिरपेक्षम् एव पूर्वोक्तव्याप्त्या अनुसन्धानक्रमेण अवलोकनया दीक्षां कुर्यात् परोक्षदीक्षादिके नैमित्तिकान्ते तु पूर्व एव विधिः
    iast: |-
      evam etebhyo yāgebhyo 'nyatamaṃ kṛtvā yadi tathāvidhanirvicikitsatāpacitritahṛdayaḥ śiṣyo bhavati tadā tasmai tadyāgadarśanapūrvakaṃ tilājyāhutipūrvakanirapekṣam eva pūrvoktavyāptyā anusandhānakrameṇa avalokanayā dīkṣāṃ kuryāt parokṣadīkṣādike naimittikānte tu pūrva eva vidhiḥ
  - verse_num: 52
    section_type: prose
    prose_block_ref: "ah22.b53"
    devanagari: |-
      केवलम् एतद् यागप्रधानतया इति
    iast: |-
      kevalam etad yāgapradhānatayā iti
  - verse_num: 53
    section_type: prose
    prose_block_ref: "ah22.b54"
    devanagari: |-
      गुरुशरीरे सप्तमः कुलयागः सर्वोत्तमः सो ऽपि प्राग् यागसाहित्येन सकृद् एव कृतः सर्वं पूरयति इति शिवम्
    iast: |-
      guruśarīre saptamaḥ kulayāgaḥ sarvottamaḥ so 'pi prāg yāgasāhityena sakṛd eva kṛtaḥ sarvaṃ pūrayati iti śivam
