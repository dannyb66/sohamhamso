      gloss_en: residing in the breath
      morph: nom. sg. m., adj.
    - word: क्रमाक्रमकलना
      iast: kramākramakalanā
      gloss_en: the measuring out of sequence and non-sequence
      morph: nom. sg. f.
    - word: कालः
      iast: kālaḥ
      gloss_en: Time
      morph: nom. sg. m.
    - word: परमेश्वरः
      iast: parameśvaraḥ
      gloss_en: the Supreme Lord
      morph: nom. sg. m.
    - word: अन्तर्भाति
      iast: antarbhāti
      gloss_en: shines within, is comprised within
      morph: 3sg. pres.
    - word: तद्भासनम्
      iast: tadbhāsanam
      gloss_en: that shining-forth (manifesting) of it
      morph: nom. sg. n.
    - word: काली
      iast: kālī
      gloss_en: Kālī (the power that measures/devours time)
      morph: nom. sg. f.
    - word: शक्तिः
      iast: śaktiḥ
      gloss_en: the power
      morph: nom. sg. f.
    - word: भेदेन
      iast: bhedena
      gloss_en: in differentiated mode
      morph: instr. sg. m.
    - word: प्राणवृत्तिः
      iast: prāṇavṛttiḥ
      gloss_en: the activity of the breath
      morph: nom. sg. f.
    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "That very locus is what was meant by the term \"the establishing of the locus.\" Therein the locus is threefold: the vital breath, the body, and the external world. Now, in the breath first — this entire procedure that will be set forth — the whole path of manifestation is computed as residing in the breath. Its measuring out of sequence and non-sequence is precisely Time; and that Time is comprised within the Supreme Lord himself. The shining-forth of it is the Lord's power named Kālī; but its manifesting in a differentiated mode, as sequence and non-sequence, is the activity of the breath."
