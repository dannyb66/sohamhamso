    iast: |-
      tatra adhivāsanaṃ śiṣyasya saṃskṛtayogyatādhānam amblīkaraṇam iva dantānāṃ devasya kartavyonmukhatvagrāhaṇam guros tadgrahaṇam
  - verse_num: 44
    section_type: prose
    prose_block_ref: "ah13.b44"
