      text: "And what means could there be here, since a means distinct from him too is untenable? Therefore this whole is the one principle of pure Consciousness alone — not measured by time, unbounded by space, untarnished by limiting adjuncts, unconstrained by forms, undesignated by words, unelaborated by the means of valid cognition; and it is, by its own will alone, the cause whereby everything from time up to the means of cognition gains its own nature — autonomous, a dense mass of bliss, that very principle. And that is \"I\"; and there, within me alone, the universe is reflected. For one who discriminates thus firmly, the immersion belonging to the Supreme Lord is perpetual and entirely means-less; and for him there is no regulation whatsoever by mantra, worship, meditation, observance, and the like."
