    iast: |-
      upakaraṇadravyāṇāṃ yāgagṛhāntarvartitayā parameśatejobṛṃhaṇena pūjopakaraṇayogyatārpaṇam iti
  - verse_num: 45
    section_type: prose
    prose_block_ref: "ah13.b45"
    devanagari: |-
      तत्र सर्वोपकरणपूर्णं यागगृहं विधाय भगवतीं मालिनीं मातृकां वा स्मृत्वा तद्वर्णतेजःपुञ्जभरितं गृहीतं भावयन् पुष्पाञ्जलिं क्षिपेत्
    iast: |-
      tatra sarvopakaraṇapūrṇaṃ yāgagṛhaṃ vidhāya bhagavatīṃ mālinīṃ mātṛkāṃ vā smṛtvā tadvarṇatejaḥpuñjabharitaṃ gṛhītaṃ bhāvayan puṣpāñjaliṃ kṣipet
  - verse_num: 46
    section_type: prose
    prose_block_ref: "ah13.b46"
    devanagari: |-
      तत उक्तास्त्रजप्तानि यथासम्भवं सिद्धार्थधान्याक्षतलाजादीनि तेजोरूपाणि विकीर्य ऐशान्यां दिशि क्रमेण सङ्घट्टयेत् इति भूपरिग्रहः
    iast: |-
      tata uktāstrajaptāni yathāsambhavaṃ siddhārthadhānyākṣatalājādīni tejorūpāṇi vikīrya aiśānyāṃ diśi krameṇa saṅghaṭṭayet iti bhūparigrahaḥ
  - verse_num: 47
    section_type: prose
    prose_block_ref: "ah13.b47"
    devanagari: |-
      ततः शुद्धविद्यान्तम् आसनं दत्त्वा गणपतेः पूजा ततः कुम्भम् आनन्दद्रव्यपूरितम् अलङ्कृतं पूजयेत् ततो याज्यम् अनु पूगं न्यस्य तत्र मुख्यं मन्त्रं सर्वाधिष्ठातृतया विधिपूर्वकत्वेन स्मरन् अष्टोत्तरशतमन्त्रितं तेन तं कुम्भं कुर्यात्
    iast: |-
      tataḥ śuddhavidyāntam āsanaṃ dattvā gaṇapateḥ pūjā tataḥ kumbham ānandadravyapūritam alaṅkṛtaṃ pūjayet tato yājyam anu pūgaṃ nyasya tatra mukhyaṃ mantraṃ sarvādhiṣṭhātṛtayā vidhipūrvakatvena smaran aṣṭottaraśatamantritaṃ tena taṃ kumbhaṃ kuryāt
  - verse_num: 48
    section_type: prose
    prose_block_ref: "ah13.b48"
    devanagari: |-
      द्वितीयकलशे विघ्नशमनाय अस्त्रं यजेत्
    iast: |-
      dvitīyakalaśe vighnaśamanāya astraṃ yajet
  - verse_num: 49
    section_type: prose
    prose_block_ref: "ah13.b49"
    devanagari: |-
      ततः स्वस्वदिक्षु लोकपालान् सास्त्रान् पूजयेत्
    iast: |-
      tataḥ svasvadikṣu lokapālān sāstrān pūjayet
  - verse_num: 50
    section_type: prose
    prose_block_ref: "ah13.b50"
    devanagari: |-
      ततः शिष्यस्य प्राक् दीक्षितस्य हस्ते अस्त्रकलशं दद्यात्
    iast: |-
      tataḥ śiṣyasya prāk dīkṣitasya haste astrakalaśaṃ dadyāt
  - verse_num: 51
    section_type: prose
    prose_block_ref: "ah13.b51"
    devanagari: |-
      स्वयं च गुरुः कुम्भम् आददीत
    iast: |-
      svayaṃ ca guruḥ kumbham ādadīta
  - verse_num: 52
    section_type: prose
    prose_block_ref: "ah13.b52"
    devanagari: |-
      ततः शिष्यं गृहपर्यन्तेषु विघ्नशमनाय धारां पातयन्तं सकुम्भो ऽनुगच्छेत् इमं मन्त्रं पठन् भो भोः शक्र त्वया स्वस्यां दिशि विघ्नप्रशान्तये
    iast: |-
      tataḥ śiṣyaṃ gṛhaparyanteṣu vighnaśamanāya dhārāṃ pātayantaṃ sakumbho 'nugacchet imaṃ mantraṃ paṭhan bho bhoḥ śakra tvayā svasyāṃ diśi vighnapraśāntaye
  - verse_num: 53
    section_type: prose
    prose_block_ref: "ah13.b53"
    devanagari: |-
      सावधानेन कर्मान्तं भवितव्यं शिवाज्ञया
    iast: |-
      sāvadhānena karmāntaṃ bhavitavyaṃ śivājñayā
  - verse_num: 54
    section_type: prose
    prose_block_ref: "ah13.b54"
    devanagari: |-
      त्र्यक्षरे नाम्नि भो इत्य् एकम् एव
    iast: |-
      tryakṣare nāmni bho ity ekam eva
  - verse_num: 55
    section_type: prose
    prose_block_ref: "ah13.b55"
    devanagari: |-
      तत ऐशान्यां दिशि कुम्भं स्थापयेत्
    iast: |-
      tata aiśānyāṃ diśi kumbhaṃ sthāpayet
  - verse_num: 56
    section_type: prose
    prose_block_ref: "ah13.b56"
    devanagari: |-
      विकिरोपरि अस्त्रकलशम्
    iast: |-
      vikiropari astrakalaśam
  - verse_num: 57
    section_type: prose
    prose_block_ref: "ah13.b57"
    devanagari: |-
      तत उभयपूजनम्
    iast: |-
      tata ubhayapūjanam
  - verse_num: 58
    section_type: prose
    prose_block_ref: "ah13.b58"
    devanagari: |-
      ततः स्थण्डिलमध्ये परमेशपूजनम्
    iast: |-
      tataḥ sthaṇḍilamadhye parameśapūjanam
  - verse_num: 59
    section_type: prose
    prose_block_ref: "ah13.b59"
    devanagari: |-
      ततः अग्निकुण्डं परमेश्वरशक्तिरूपतया भावयित्वा तत्र अग्निं प्रज्वाल्य हृदयान्तर्बोधाग्निना सह एकीकृत्य मन्त्रपरामर्शसाहित्येन ज्वलन्तं शिवाग्निं भावयित्वा तत्र न्यस्य अभ्यर्च्य मन्त्रान् तर्पयेत् आज्येन तिलैश् च
    iast: |-
      tataḥ agnikuṇḍaṃ parameśvaraśaktirūpatayā bhāvayitvā tatra agniṃ prajvālya hṛdayāntarbodhāgninā saha ekīkṛtya mantraparāmarśasāhityena jvalantaṃ śivāgniṃ bhāvayitvā tatra nyasya abhyarcya mantrān tarpayet ājyena tilaiś ca
  - verse_num: 60
    section_type: prose
    prose_block_ref: "ah13.b60"
    devanagari: |-
      अर्घपात्रेण च प्रोक्षणम् एव तिलाज्यादीनां संस्कारः
    iast: |-
      arghapātreṇa ca prokṣaṇam eva tilājyādīnāṃ saṃskāraḥ
  - verse_num: 61
    section_type: prose
    prose_block_ref: "ah13.b61"
    devanagari: |-
      स्रुक्स्रुवयोश् च परमेशाभेददृष्टिर् एव हि संस्कारः
    iast: |-
      sruksruvayoś ca parameśābhedadṛṣṭir eva hi saṃskāraḥ
  - verse_num: 62
    section_type: prose
    prose_block_ref: "ah13.b62"
    devanagari: |-
      ततो यथाशक्ति हुत्वा स्रुक्स्रुवौ ऊर्ध्वाधोमुखतया शक्तिशिवरूपौ परस्परोन्मुखौ विधाय समपादोत्थितो द्वादशान्तगगनोदितशिवपूर्णचन्द्रनिःसृतपतत्परामृतधाराभावनां कुर्वन् वौषडन्तं मन्त्रम् उच्चारयन् च आज्यक्षयान्तं तिष्ठेत् इति पूर्णाहुतिः मन्त्रचक्रसन्तर्पणी
    iast: |-
      tato yathāśakti hutvā sruksruvau ūrdhvādhomukhatayā śaktiśivarūpau parasparonmukhau vidhāya samapādotthito dvādaśāntagaganoditaśivapūrṇacandraniḥsṛtapatatparāmṛtadhārābhāvanāṃ kurvan vauṣaḍantaṃ mantram uccārayan ca ājyakṣayāntaṃ tiṣṭhet iti pūrṇāhutiḥ mantracakrasantarpaṇī
  - verse_num: 63
    section_type: prose
    prose_block_ref: "ah13.b63"
    devanagari: |-
      ततश् चरुं प्रोक्षितम् आनीय स्थण्डिलकलशकुम्भवह्निषु भागं भागं निवेद्य एकभागम् अवशेष्य शिष्याय भागं दद्यात्
    iast: |-
      tataś caruṃ prokṣitam ānīya sthaṇḍilakalaśakumbhavahniṣu bhāgaṃ bhāgaṃ nivedya ekabhāgam avaśeṣya śiṣyāya bhāgaṃ dadyāt
  - verse_num: 64
    section_type: prose
    prose_block_ref: "ah13.b64"
    devanagari: |-
      ततो दन्तकाष्ठम्
    iast: |-
      tato dantakāṣṭham
  - verse_num: 65
    section_type: prose
    prose_block_ref: "ah13.b65"
    devanagari: |-
      तत्पातो ऽग्नियमनिरृतिदिक्षु अधश् च न शुभ इति
    iast: |-
      tatpāto 'gniyamanirṛtidikṣu adhaś ca na śubha iti
  - verse_num: 66
    section_type: prose
    prose_block_ref: "ah13.b66"
    devanagari: |-
      तत्र होमो ऽस्त्रमन्त्रेण कार्यः
    iast: |-
      tatra homo 'stramantreṇa kāryaḥ
  - verse_num: 67
    section_type: prose
    prose_block_ref: "ah13.b67"
    devanagari: |-
      ततो विक्षेपपरिहारेण भाविमन्त्रदर्शनयोग्यतायै बद्धनेत्रं शिष्यं प्रवेश्य जानुस्थितं तं कृत्वा पुष्पाञ्जलिं क्षेपयेत्
    iast: |-
      tato vikṣepaparihāreṇa bhāvimantradarśanayogyatāyai baddhanetraṃ śiṣyaṃ praveśya jānusthitaṃ taṃ kṛtvā puṣpāñjaliṃ kṣepayet
  - verse_num: 68
    section_type: prose
    prose_block_ref: "ah13.b68"
    devanagari: |-
      ततः सहसा अपासितनेत्रबन्धो ऽसौ शक्तिपातानुगृहीतकरणत्वात् सन्निहितमन्त्रं तत्स्थानं साक्षात्कारेण पश्यन् तन्मयो भवति अनुगृहीतकरणानां मन्त्रसन्निधिः प्रत्यक्षः यतस् त्रस्यताम् इव भूतानाम्
    iast: |-
      tataḥ sahasā apāsitanetrabandho 'sau śaktipātānugṛhītakaraṇatvāt sannihitamantraṃ tatsthānaṃ sākṣātkāreṇa paśyan tanmayo bhavati anugṛhītakaraṇānāṃ mantrasannidhiḥ pratyakṣaḥ yatas trasyatām iva bhūtānām
  - verse_num: 69
    section_type: prose
    prose_block_ref: "ah13.b69"
    devanagari: |-
      ततः स्वदक्षिणहस्ते दीप्यतया देवताचक्रं पूजयित्वा तं हस्तं मूर्धहृन्नाभिषु शिष्यस्य पाशान् दहन्तं निक्षिपेत्
    iast: |-
      tataḥ svadakṣiṇahaste dīpyatayā devatācakraṃ pūjayitvā taṃ hastaṃ mūrdhahṛnnābhiṣu śiṣyasya pāśān dahantaṃ nikṣipet
  - verse_num: 70
    section_type: prose
    prose_block_ref: "ah13.b70"
    devanagari: |-
      ततो वामे सोम्यतया पूजयित्वा शुद्धतत्त्वाप्यायिनं ततः प्रणामं कुर्यात्
    iast: |-
      tato vāme somyatayā pūjayitvā śuddhatattvāpyāyinaṃ tataḥ praṇāmaṃ kuryāt
  - verse_num: 71
    section_type: prose
    prose_block_ref: "ah13.b71"
    devanagari: |-
      ततो भूतदेवतादिग्बलिं मद्यमांसजलादिपूर्णं बहिर् दद्यात् आचामेत
    iast: |-
      tato bhūtadevatādigbaliṃ madyamāṃsajalādipūrṇaṃ bahir dadyāt ācāmeta
  - verse_num: 72
    section_type: prose
    prose_block_ref: "ah13.b72"
    devanagari: |-
      ततः स्वयं चरुभोजनं कृत्वा शिष्यात्मना सह ऐक्यम् आपन्नः प्रबुद्धवृत्तिः तिष्ठेत्
    iast: |-
      tataḥ svayaṃ carubhojanaṃ kṛtvā śiṣyātmanā saha aikyam āpannaḥ prabuddhavṛttiḥ tiṣṭhet
  - verse_num: 73
    section_type: prose
    prose_block_ref: "ah13.b73"
    devanagari: |-
      स्वपन् अपि प्रभाते शिष्यः चेत् अशुभं स्वप्नं वदेत् तत् अस्मै न व्याकुर्यात्
    iast: |-
      svapan api prabhāte śiṣyaḥ cet aśubhaṃ svapnaṃ vadet tat asmai na vyākuryāt
  - verse_num: 74
    section_type: prose
    prose_block_ref: "ah13.b74"
    devanagari: |-
      शङ्कातङ्कौ हि तथास्य स्याताम् केवलम् अस्त्रेण तन्निष्कृतिं कुर्यात्
    iast: |-
      śaṅkātaṅkau hi tathāsya syātām kevalam astreṇa tanniṣkṛtiṃ kuryāt
  - verse_num: 75
    section_type: prose
    prose_block_ref: "ah13.b75"
    devanagari: |-
      ततस् तथैव परमेश्वरं पूजयित्वा तदग्रे शिष्यस्य प्राणक्रमेण प्रविश्य हृत्कण्ठतालुललाटरन्ध्रद्वादशान्तेषु षट्सु कारणषट्कस्पर्शं कुर्वन् प्रत्येकम् अष्टौ संस्कारान् चिन्तयन् कञ्चित् कालं शिष्यप्राणं तत्रैव विश्रमय्य पुनर् अवरोहेत्
    iast: |-
      tatas tathaiva parameśvaraṃ pūjayitvā tadagre śiṣyasya prāṇakrameṇa praviśya hṛtkaṇṭhatālulalāṭarandhradvādaśānteṣu ṣaṭsu kāraṇaṣaṭkasparśaṃ kurvan pratyekam aṣṭau saṃskārān cintayan kañcit kālaṃ śiṣyaprāṇaṃ tatraiva viśramayya punar avarohet
  - verse_num: 76
    section_type: prose
    prose_block_ref: "ah13.b76"
    devanagari: |-
      इत्य् एवापादिताष्टाचत्वारिंशत्संस्कारोपरिकृतरुद्रांशापत्तिः समयीभवति
    iast: |-
      ity evāpāditāṣṭācatvāriṃśatsaṃskāroparikṛtarudrāṃśāpattiḥ samayībhavati
  - verse_num: 77
    section_type: prose
    prose_block_ref: "ah13.b77"
    devanagari: |-
      ततः अस्मै पूज्यं मन्त्रं पुष्पाद्यैः सह अर्पयेत्
    iast: |-
      tataḥ asmai pūjyaṃ mantraṃ puṣpādyaiḥ saha arpayet
  - verse_num: 78
    section_type: prose
    prose_block_ref: "ah13.b78"
    devanagari: |-
      ततः समयान् अस्मै निरूपयेत्
    iast: |-
      tataḥ samayān asmai nirūpayet
  - verse_num: 79
    section_type: prose
    prose_block_ref: "ah13.b79"
    devanagari: |-
      गुरौ सर्वात्मना भक्तिः तथा शास्त्रे देवे तत्प्रतिद्वन्द्विनि पराङ्मुखता गुरुवत् गुरुपुत्रादेः विद्यासम्बन्धकृतस्य तत्पूर्वदीक्षितादेः सन्दर्शनम् यौनसम्बन्धस्य तदाराधनार्थम् न तु स्वत इति मन्तव्यम्
    iast: |-
      gurau sarvātmanā bhaktiḥ tathā śāstre deve tatpratidvandvini parāṅmukhatā guruvat guruputrādeḥ vidyāsambandhakṛtasya tatpūrvadīkṣitādeḥ sandarśanam yaunasambandhasya tadārādhanārtham na tu svata iti mantavyam
  - verse_num: 80
    section_type: prose
    prose_block_ref: "ah13.b80"
    devanagari: |-
      स्त्रियो वन्ध्यायास् तज्जुगुप्साहेतुं न कुर्यात्
    iast: |-
      striyo vandhyāyās tajjugupsāhetuṃ na kuryāt
  - verse_num: 81
    section_type: prose
    prose_block_ref: "ah13.b81"
    devanagari: |-
      देवतानाम गुरुनाम तथा मन्त्रं पूजाकालात् ऋते न उच्चारयेत्
    iast: |-
      devatānāma gurunāma tathā mantraṃ pūjākālāt ṛte na uccārayet
  - verse_num: 82
    section_type: prose
    prose_block_ref: "ah13.b82"
    devanagari: |-
      गुरूपभुक्तं शय्यादि न भुञ्जीत
    iast: |-
      gurūpabhuktaṃ śayyādi na bhuñjīta
  - verse_num: 83
    section_type: prose
    prose_block_ref: "ah13.b83"
    devanagari: |-
      यत् किञ्चित् लौकिकं क्रीडादि तत् गुरुसन्निधौ न कुर्यात्
    iast: |-
      yat kiñcit laukikaṃ krīḍādi tat gurusannidhau na kuryāt
  - verse_num: 84
    section_type: prose
    prose_block_ref: "ah13.b84"
    devanagari: |-
      तद्व्यतिरेकेण न अन्यत्र उत्कर्षबुद्धिं कुर्यात्
    iast: |-
      tadvyatirekeṇa na anyatra utkarṣabuddhiṃ kuryāt
  - verse_num: 85
    section_type: prose
    prose_block_ref: "ah13.b85"
    devanagari: |-
      सर्वत्र श्राद्धादौ गुरुम् एव पूजयेत्
    iast: |-
      sarvatra śrāddhādau gurum eva pūjayet
  - verse_num: 86
    section_type: prose
    prose_block_ref: "ah13.b86"
    devanagari: |-
      सर्वेषु च नैमित्तिकेषु शाकिनीत्यादिशब्दान् न वदेत्
    iast: |-
      sarveṣu ca naimittikeṣu śākinītyādiśabdān na vadet
  - verse_num: 87
    section_type: prose
    prose_block_ref: "ah13.b87"
    devanagari: |-
      पर्वदिनानि पूजयेत्
    iast: |-
      parvadināni pūjayet
  - verse_num: 88
    section_type: prose
    prose_block_ref: "ah13.b88"
    devanagari: |-
      वैष्णवाद्यैर् अधोदृष्टिभिः सह सङ्गतिं न कुर्यात्
    iast: |-
      vaiṣṇavādyair adhodṛṣṭibhiḥ saha saṅgatiṃ na kuryāt
  - verse_num: 89
    section_type: prose
    prose_block_ref: "ah13.b89"
    devanagari: |-
      एतच्छासनस्थान् पूर्वजातिबुद्ध्या न पश्येत्
    iast: |-
      etacchāsanasthān pūrvajātibuddhyā na paśyet
  - verse_num: 90
    section_type: prose
    prose_block_ref: "ah13.b90"
    devanagari: |-
      गुरुवर्गे गृहागते यथाशक्ति यागं कुर्यात्
    iast: |-
      guruvarge gṛhāgate yathāśakti yāgaṃ kuryāt
  - verse_num: 91
    section_type: prose
    prose_block_ref: "ah13.b91"
    devanagari: |-
      अधोमार्गस्थितं कञ्चित् वैष्णवाद्यं तच्छास्त्रकुलात् गुरूकृत्यापि त्यजेत्
    iast: |-
      adhomārgasthitaṃ kañcit vaiṣṇavādyaṃ tacchāstrakulāt gurūkṛtyāpi tyajet
  - verse_num: 92
    section_type: prose
    prose_block_ref: "ah13.b92"
    devanagari: |-
      तदापि न उत्कर्षबुद्ध्या पश्येत्
    iast: |-
      tadāpi na utkarṣabuddhyā paśyet
  - verse_num: 93
    section_type: prose
    prose_block_ref: "ah13.b93"
    devanagari: |-
      लिङ्गिभिः सह समाचारमेलनं न कुर्यात् तान् केवलं यथाशक्ति पूजयेत्
    iast: |-
      liṅgibhiḥ saha samācāramelanaṃ na kuryāt tān kevalaṃ yathāśakti pūjayet
  - verse_num: 94
    section_type: prose
    prose_block_ref: "ah13.b94"
    devanagari: |-
      शङ्कास् त्यजेत्
    iast: |-
      śaṅkās tyajet
  - verse_num: 95
    section_type: prose
    prose_block_ref: "ah13.b95"
    devanagari: |-
      चक्रे स्थितश् चरमाग्र्यादिविभागं जन्मकृतं न सङ्कल्पयेत्
    iast: |-
      cakre sthitaś caramāgryādivibhāgaṃ janmakṛtaṃ na saṅkalpayet
  - verse_num: 96
    section_type: prose
    prose_block_ref: "ah13.b96"
    devanagari: |-
      शरीरात् ऋते न अन्यत् आयतनतीर्थादिकं बहुमानेन पश्येत्
    iast: |-
      śarīrāt ṛte na anyat āyatanatīrthādikaṃ bahumānena paśyet
  - verse_num: 97
    section_type: prose
    prose_block_ref: "ah13.b97"
    devanagari: |-
      मन्त्रहृदयम् अनवरतं स्मरेत् इत्य् एवं शिष्यः श्रुत्वा प्रणम्य अभ्युपगम्य गुरुं धनदारशरीरपर्यन्तया दक्षिणया परितोष्य पूर्वदीक्षितांश् च दीनानाथादिकान् तर्पयेत्
    iast: |-
      mantrahṛdayam anavarataṃ smaret ity evaṃ śiṣyaḥ śrutvā praṇamya abhyupagamya guruṃ dhanadāraśarīraparyantayā dakṣiṇayā paritoṣya pūrvadīkṣitāṃś ca dīnānāthādikān tarpayet
  - verse_num: 98
    section_type: prose
    prose_block_ref: "ah13.b98"
    devanagari: |-
      भाविविधिना च मूर्तिचक्रं तर्पयेत्
    iast: |-
      bhāvividhinā ca mūrticakraṃ tarpayet
  - verse_num: 99
    section_type: prose
    prose_block_ref: "ah13.b99"
    devanagari: |-
      इत्थं समयीभवति
    iast: |-
      itthaṃ samayībhavati
  - verse_num: 100
    section_type: prose
    prose_block_ref: "ah13.b100"
    devanagari: |-
      मन्त्राभ्यासे नित्यपूजायां श्रवणे ऽध्ययने अधिकारी नैमित्तिके तु सर्वत्र गुरुम् एव अभ्यर्थयेत्
    iast: |-
      mantrābhyāse nityapūjāyāṃ śravaṇe 'dhyayane adhikārī naimittike tu sarvatra gurum eva abhyarthayet
  - verse_num: 101
    section_type: prose
    prose_block_ref: "ah13.b101"
    devanagari: |-
      इति सामयिको विधिः
    iast: |-
      iti sāmayiko vidhiḥ
- chapter: 14
  title_sa: तन्त्रसार, चतुर्दशम् आह्निकम्
  title_iast: "tantrasāra, caturdaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah14.b1"
    devanagari: |-
      अथ पुत्रकदीक्षाविधिः
    iast: |-
      atha putrakadīkṣāvidhiḥ
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah14.b2"
    devanagari: |-
      स च विस्तीर्णः तन्त्रालोकात् अवधार्यः
    iast: |-
      sa ca vistīrṇaḥ tantrālokāt avadhāryaḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah14.b3"
    devanagari: |-
      सङ्क्षिप्तस् तु उच्यते
    iast: |-
      saṅkṣiptas tu ucyate
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah14.b4"
    devanagari: |-
      समय्यन्तं विधिं कृत्वा तृतीये ऽह्नि त्रिशूलाब्जे मण्डले सामुदायिकं यागं पूजयेत् तत्र बाह्यपरिवारं द्वारदेवताचक्रं च बहिः पूजयेत् ततो मण्डलपूर्वभागे ऐशकोणात् आरभ्य आग्नेयान्तं पङ्क्तिक्रमेण गणपतिं गुरुं परमगुरुं परमेष्ठिनं पूर्वाचार्यान् योगिनीचक्रं वागीश्वरीं क्षेत्रपालं च पूजयेत्
    iast: |-
      samayyantaṃ vidhiṃ kṛtvā tṛtīye 'hni triśūlābje maṇḍale sāmudāyikaṃ yāgaṃ pūjayet tatra bāhyaparivāraṃ dvāradevatācakraṃ ca bahiḥ pūjayet tato maṇḍalapūrvabhāge aiśakoṇāt ārabhya āgneyāntaṃ paṅktikrameṇa gaṇapatiṃ guruṃ paramaguruṃ parameṣṭhinaṃ pūrvācāryān yoginīcakraṃ vāgīśvarīṃ kṣetrapālaṃ ca pūjayet
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah14.b5"
    devanagari: |-
      तत आज्ञां समुचिताम् आदाय शूलमूलात् प्रभृति सितकमलान्तं समस्तम् अध्वानं न्यस्य अर्चयेत् ततो मध्यमे त्रिशूले मध्यारायां भगवती श्रीपराभट्टारिका भैरवनाथेन सह वामारायां तथैव श्रीमदपरा दक्षिणारायां श्रीपरापरा दक्षिणे त्रिशूले मध्ये श्रीपरापरा वामे त्रिशूले मध्ये श्रीमदपरा द्वे तु यथास्वम्
    iast: |-
      tata ājñāṃ samucitām ādāya śūlamūlāt prabhṛti sitakamalāntaṃ samastam adhvānaṃ nyasya arcayet tato madhyame triśūle madhyārāyāṃ bhagavatī śrīparābhaṭṭārikā bhairavanāthena saha vāmārāyāṃ tathaiva śrīmadaparā dakṣiṇārāyāṃ śrīparāparā dakṣiṇe triśūle madhye śrīparāparā vāme triśūle madhye śrīmadaparā dve tu yathāsvam
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah14.b6"
    devanagari: |-
      एवं सर्वस्थानाधिष्ठातृत्वे भगवत्याः सर्वं पूर्णं तदधिष्ठानात् भवति इति
    iast: |-
      evaṃ sarvasthānādhiṣṭhātṛtve bhagavatyāḥ sarvaṃ pūrṇaṃ tadadhiṣṭhānāt bhavati iti
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah14.b7"
    devanagari: |-
      ततो मध्यशूलमध्यारायां समस्तं देवताचक्रं लोकपालास्त्रपर्यन्तम् अभिन्नतयैव पूजयेत् तदधिष्ठानात् सर्वत्र पूजितम्
    iast: |-
      tato madhyaśūlamadhyārāyāṃ samastaṃ devatācakraṃ lokapālāstraparyantam abhinnatayaiva pūjayet tadadhiṣṭhānāt sarvatra pūjitam
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah14.b8"
    devanagari: |-
      ततः कुम्भे कलशे मण्डले अग्नौ स्वात्मनि च अभेदभावनया पञ्चाधिकरणम् अनुसन्धिं कुर्यात् ततः परमेश्वराद्वयरसबृंहितेन पुष्पादिना विशेषपूजां कुर्यात्
    iast: |-
      tataḥ kumbhe kalaśe maṇḍale agnau svātmani ca abhedabhāvanayā pañcādhikaraṇam anusandhiṃ kuryāt tataḥ parameśvarādvayarasabṛṃhitena puṣpādinā viśeṣapūjāṃ kuryāt
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah14.b9"
    devanagari: |-
      किं बहुना तर्पणनैवेद्यपरिपूर्णं वित्तशाठ्यविरहितो यागस्थानं कुर्यात्
    iast: |-
      kiṃ bahunā tarpaṇanaivedyaparipūrṇaṃ vittaśāṭhyavirahito yāgasthānaṃ kuryāt
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah14.b10"
    devanagari: |-
      असति वित्ते तु महामण्डलयागो न कर्तव्य एव
    iast: |-
      asati vitte tu mahāmaṇḍalayāgo na kartavya eva
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah14.b11"
    devanagari: |-
      पशूंश् च जीवतो निवेदयेत्
    iast: |-
      paśūṃś ca jīvato nivedayet
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah14.b12"
    devanagari: |-
      ते ऽपि हि एवम् अनुगृहीता भवन्ति इति कारुणिकतया पशुविधौ न विचिकित्सेत्
    iast: |-
      te 'pi hi evam anugṛhītā bhavanti iti kāruṇikatayā paśuvidhau na vicikitset
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah14.b13"
    devanagari: |-
      ततो ऽग्नौ परमेश्वरं तिलाज्यादिभिः सन्तर्प्य तदग्रे ऽन्यं पशुं वपाहोमार्थं कुर्यात् देवताचक्रं तद्वपया तर्पयेत् पुनर् मण्डलं पूजयेत् ततः परमेश्वरं विज्ञप्य सर्वाभिन्नसमस्तषडध्वपरिपूर्णम् आत्मानं भावयित्वा शिष्यं पुरो ऽवस्थितं कुर्यात्
    iast: |-
      tato 'gnau parameśvaraṃ tilājyādibhiḥ santarpya tadagre 'nyaṃ paśuṃ vapāhomārthaṃ kuryāt devatācakraṃ tadvapayā tarpayet punar maṇḍalaṃ pūjayet tataḥ parameśvaraṃ vijñapya sarvābhinnasamastaṣaḍadhvaparipūrṇam ātmānaṃ bhāvayitvā śiṣyaṃ puro 'vasthitaṃ kuryāt
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah14.b14"
    devanagari: |-
      परोक्षदीक्षायां जीवन्मृतरूपायाम् अग्रे तं ध्यायेत् तदीयां वा प्रतिकृतिं दर्भगोमयादिमयीम् अग्रे स्थापयेत्
    iast: |-
      parokṣadīkṣāyāṃ jīvanmṛtarūpāyām agre taṃ dhyāyet tadīyāṃ vā pratikṛtiṃ darbhagomayādimayīm agre sthāpayet
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah14.b15"
    devanagari: |-
      तथाविधं शिष्यम् अर्घपात्रविप्रुट्प्रोक्षितं पुष्पादिभिश् च पूजितं कृत्वा समस्तम् अध्वानं तद्देहे न्यसेत्
    iast: |-
      tathāvidhaṃ śiṣyam arghapātravipruṭprokṣitaṃ puṣpādibhiś ca pūjitaṃ kṛtvā samastam adhvānaṃ taddehe nyaset
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah14.b16"
    devanagari: |-
      तत इत्थं विचारयेत् भोगेच्छोः शुभं न शोधयेत्
    iast: |-
      tata itthaṃ vicārayet bhogecchoḥ śubhaṃ na śodhayet
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah14.b17"
    devanagari: |-
      मुमुक्षोस् तु शुभाशुभम् उभयम् अपि
    iast: |-
      mumukṣos tu śubhāśubham ubhayam api
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah14.b18"
    devanagari: |-
      निर्बीजायां तु समयपाशान् अपि शोधयेत् सा च आसन्नमरणस्य अत्यन्तमूर्खस्यापि कर्तव्या इति परमेश्वराज्ञा तस्यापि तु गुरुदेवताग्निभक्तिनिष्ठत्वमात्रात् सिद्धिः
    iast: |-
      nirbījāyāṃ tu samayapāśān api śodhayet sā ca āsannamaraṇasya atyantamūrkhasyāpi kartavyā iti parameśvarājñā tasyāpi tu gurudevatāgnibhaktiniṣṭhatvamātrāt siddhiḥ
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah14.b19"
    devanagari: |-
      अत्र च सर्वत्र वासनाग्रहणम् एव भेदकम् मन्त्राणां वासनानुगुण्येन तत्तत्कार्यकारित्वात्
    iast: |-
      atra ca sarvatra vāsanāgrahaṇam eva bhedakam mantrāṇāṃ vāsanānuguṇyena tattatkāryakāritvāt
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah14.b20"
    devanagari: |-
      एवं वासनाभेदम् अनुसन्धाय मुख्यमन्त्रपरामर्शविशेषेण समस्तम् अध्वानं स्वदेहगतं शिवाद्वयभावनया शोधयेत्
    iast: |-
      evaṃ vāsanābhedam anusandhāya mukhyamantraparāmarśaviśeṣeṇa samastam adhvānaṃ svadehagataṃ śivādvayabhāvanayā śodhayet
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah14.b21"
    devanagari: |-
      एवं क्रमेण पादाङ्गुष्ठात् प्रभृति द्वादशान्तपर्यन्तं स्वात्मदेहस्वात्मचैतन्याभिन्नीकृतदेहचैतन्यस्य शिष्यस्य आसाद्य तत्रैव अनन्तानन्दसरसि स्वातन्त्र्यैश्वर्यसारे समस्तेच्छाज्ञानक्रियाशक्तिनिर्भरसमस्तदेवताचक्रेश्वरे समस्ताध्वभरिते चिन्मात्रावशेषविश्वभावमण्डले तथाविधरूपैकीकारेण शिष्यात्मना सह एकीभूतो विश्रान्तिम् आसादयेत् इत्य् एवं परमेश्वराभिन्नो ऽसौ भवति
    iast: |-
      evaṃ krameṇa pādāṅguṣṭhāt prabhṛti dvādaśāntaparyantaṃ svātmadehasvātmacaitanyābhinnīkṛtadehacaitanyasya śiṣyasya āsādya tatraiva anantānandasarasi svātantryaiśvaryasāre samastecchājñānakriyāśaktinirbharasamastadevatācakreśvare samastādhvabharite cinmātrāvaśeṣaviśvabhāvamaṇḍale tathāvidharūpaikīkāreṇa śiṣyātmanā saha ekībhūto viśrāntim āsādayet ity evaṃ parameśvarābhinno 'sau bhavati
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah14.b22"
    devanagari: |-
      ततो यदि भोगेच्छुः स्यात् ततो यत्रैव तत्त्वे भोगेच्छा अस्य भवति तत्रैव समस्तव्यस्ततया योजयेत्
    iast: |-
      tato yadi bhogecchuḥ syāt tato yatraiva tattve bhogecchā asya bhavati tatraiva samastavyastatayā yojayet
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah14.b23"
    devanagari: |-
      तदनन्तरं शेषवृत्तये परमेश्वरस्वभावात् झटिति प्रसृतं शुद्धतत्त्वमयं देहम् अस्मै चिन्तयेत् इत्य् एषा समस्तपाशवियोजिका दीक्षा
    iast: |-
      tadanantaraṃ śeṣavṛttaye parameśvarasvabhāvāt jhaṭiti prasṛtaṃ śuddhatattvamayaṃ deham asmai cintayet ity eṣā samastapāśaviyojikā dīkṣā
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah14.b24"
    devanagari: |-
      ततः शिष्यो गुरुं दक्षिणाभिः पूर्ववत् पूजयेत्
    iast: |-
      tataḥ śiṣyo guruṃ dakṣiṇābhiḥ pūrvavat pūjayet
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah14.b25"
    devanagari: |-
      ततो ऽग्नौ शिष्यस्य विधिं कुर्यात् श्रीपरामन्त्रः अमुकस्यामुकं तत्त्वं शोधयामि इति स्वाहान्तं प्रतितत्त्वं तिस्र आहुतयः अन्ते पूर्णा वौषडन्ता
    iast: |-
      tato 'gnau śiṣyasya vidhiṃ kuryāt śrīparāmantraḥ amukasyāmukaṃ tattvaṃ śodhayāmi iti svāhāntaṃ pratitattvaṃ tisra āhutayaḥ ante pūrṇā vauṣaḍantā
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah14.b26"
    devanagari: |-
      एवं शिवान्ततत्त्वशुद्धिः ततो योजनिकोक्तक्रमेण पूर्णाहुतिः
    iast: |-
      evaṃ śivāntatattvaśuddhiḥ tato yojanikoktakrameṇa pūrṇāhutiḥ
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah14.b27"
    devanagari: |-
      भोगेच्छोः भोगस्थाने योजनिकार्थम् अपरा शुद्धतत्त्वसृष्ट्यर्थम् अन्या
    iast: |-
      bhogecchoḥ bhogasthāne yojanikārtham aparā śuddhatattvasṛṣṭyartham anyā
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah14.b28"
    devanagari: |-
      ततो गुरोः दक्षिणाभिः पूजनम् इत्य् एषा पुत्रकदीक्षा
    iast: |-
      tato guroḥ dakṣiṇābhiḥ pūjanam ity eṣā putrakadīkṣā
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah14.b29"
    devanagari: |-
      यत्र वर्तमानम् एकं वर्जयित्वा भूतं भविष्यच् च कर्म शुध्यति
    iast: |-
      yatra vartamānam ekaṃ varjayitvā bhūtaṃ bhaviṣyac ca karma śudhyati
- chapter: 15
  title_sa: तन्त्रसार, पञ्चदशम् आह्निकम्
  title_iast: "tantrasāra, pañcadaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah15.b1"
    devanagari: |-
      यदा पुनर् आसन्नमरणस्य स्वयं वा बन्धुमुखेन शक्तिपात उपजायते तदा अस्मै सद्यः समुत्क्रमणदीक्षां कुर्यात्
    iast: |-
      yadā punar āsannamaraṇasya svayaṃ vā bandhumukhena śaktipāta upajāyate tadā asmai sadyaḥ samutkramaṇadīkṣāṃ kuryāt
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah15.b2"
    devanagari: |-
      समस्तम् अध्वानं शिष्ये न्यस्य तं च क्रमेण शोधयित्वा भगवतीं कालरात्रीम् मर्मकर्तनीं न्यस्य तया क्रमात् क्रमं मर्मपाशान् विभिद्य ब्रह्मरन्ध्रवर्ति शिष्यचैतन्यं कुर्यात्
    iast: |-
      samastam adhvānaṃ śiṣye nyasya taṃ ca krameṇa śodhayitvā bhagavatīṃ kālarātrīm marmakartanīṃ nyasya tayā kramāt kramaṃ marmapāśān vibhidya brahmarandhravarti śiṣyacaitanyaṃ kuryāt
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah15.b3"
    devanagari: |-
      ततः पूर्वोक्तक्रमेण योजनिकार्थं पूर्णाहुतिं दद्यात् यथा पूर्णाहुत्यन्ते जीवो निष्क्रान्तः परमशिवाभिन्नो भवति
    iast: |-
      tataḥ pūrvoktakrameṇa yojanikārthaṃ pūrṇāhutiṃ dadyāt yathā pūrṇāhutyante jīvo niṣkrāntaḥ paramaśivābhinno bhavati
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah15.b4"
    devanagari: |-
      बुभुक्षोस् तु द्वितीया पूर्णाहुतिः
    iast: |-
      bubhukṣos tu dvitīyā pūrṇāhutiḥ
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah15.b5"
    devanagari: |-
      भोगस्थाने योजनाय तत्काले च तस्य जीवलयः नात्र शेषवर्तनम् ब्रह्मविद्यां वा कर्णे पठेत् सा हि परामर्शस्वभावा सद्यः प्रबुद्धपशुचैतन्ये प्रबुद्धविमर्शं करोति
    iast: |-
      bhogasthāne yojanāya tatkāle ca tasya jīvalayaḥ nātra śeṣavartanam brahmavidyāṃ vā karṇe paṭhet sā hi parāmarśasvabhāvā sadyaḥ prabuddhapaśucaitanye prabuddhavimarśaṃ karoti
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah15.b6"
    devanagari: |-
      समय्यादेर् अपि च एतत्पाठे ऽधिकारः
    iast: |-
      samayyāder api ca etatpāṭhe 'dhikāraḥ
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah15.b7"
    devanagari: |-
      सप्रत्ययां निर्बीजां तु यदि दीक्षां मूढाय आयातशक्तिपाताय च दर्शयेत् तदा हि शिवहस्तदानकाले अयं विधिः त्रिकोणम् आग्नेयं ज्वालाकरालं रेफविस्फुलिङ्गं बहिर्वात्याचक्रध्यायमानं मण्डलं दक्षिणहस्ते चिन्तयित्वा तत्रैव हस्ते बीजं किञ्चित् निक्षिप्य ऊर्ध्वाधोरेफविबोधितफट्कारपरम्पराभिः अस्य तां जननशक्तिं दहेत् एवं कुर्वन् तं हस्तं शिष्यस्य मूर्धनि क्षिपेत् इति द्वयोर् अपि एषा दीक्षा निर्बीजा स्वकार्यकरणसामर्थ्यविध्वंसिनी भवति स्थावराणाम् अपि दीक्ष्यत्वेन उक्तत्वात् वायुपुरान्तर्व्यवस्थितं दोधूयमानं शिष्यं लघूभूतं चिन्तयेत् येन तुलया लघुः दृश्यते इति
    iast: |-
      sapratyayāṃ nirbījāṃ tu yadi dīkṣāṃ mūḍhāya āyātaśaktipātāya ca darśayet tadā hi śivahastadānakāle ayaṃ vidhiḥ trikoṇam āgneyaṃ jvālākarālaṃ rephavisphuliṅgaṃ bahirvātyācakradhyāyamānaṃ maṇḍalaṃ dakṣiṇahaste cintayitvā tatraiva haste bījaṃ kiñcit nikṣipya ūrdhvādhorephavibodhitaphaṭkāraparamparābhiḥ asya tāṃ jananaśaktiṃ dahet evaṃ kurvan taṃ hastaṃ śiṣyasya mūrdhani kṣipet iti dvayor api eṣā dīkṣā nirbījā svakāryakaraṇasāmarthyavidhvaṃsinī bhavati sthāvarāṇām api dīkṣyatvena uktatvāt vāyupurāntarvyavasthitaṃ dodhūyamānaṃ śiṣyaṃ laghūbhūtaṃ cintayet yena tulayā laghuḥ dṛśyate iti
- chapter: 16
  title_sa: तन्त्रसार, षोदशम् आह्निकम्
  title_iast: "tantrasāra, ṣodaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah16.b1"
    devanagari: |-
      अथ परोक्षस्य दीक्षा द्विविधश् च सः मृतो जीवंश् च
    iast: |-
      atha parokṣasya dīkṣā dvividhaś ca saḥ mṛto jīvaṃś ca
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah16.b2"
    devanagari: |-
      तत्र कृतगुरुसेव एव मृत उद्वासितो वा अभिचारादिहतो डिम्बाहतो मृत्युक्षणोदिततथारुचिः मुखान्तरायातशक्तिपातो वा तथा दीक्ष्य इत्य् आज्ञा
    iast: |-
      tatra kṛtaguruseva eva mṛta udvāsito vā abhicārādihato ḍimbāhato mṛtyukṣaṇoditatathāruciḥ mukhāntarāyātaśaktipāto vā tathā dīkṣya ity ājñā
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah16.b3"
    devanagari: |-
      अत्र च मृतदीक्षायाम् अधिवासादि न उपयुज्यते
    iast: |-
      atra ca mṛtadīkṣāyām adhivāsādi na upayujyate
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah16.b4"
    devanagari: |-
      मण्डले मन्त्रविशेषसन्निधये यत्र बहुला क्रिया उत्तमम् उपकरणं पुष्पादि स्थानं पीठादि मण्डलं त्रिशूलाब्जादि आकृतिः ध्येयविशेषः मन्त्रः स्वयं दीप्तश् च ध्यानपरस्य योगिनः तदेकभक्तिसमावेशशालिनो ज्ञानिनश् च सम्बन्धः इत्य् एते सन्निधानहेतवो यथोत्तरम् उक्ताः
    iast: |-
      maṇḍale mantraviśeṣasannidhaye yatra bahulā kriyā uttamam upakaraṇaṃ puṣpādi sthānaṃ pīṭhādi maṇḍalaṃ triśūlābjādi ākṛtiḥ dhyeyaviśeṣaḥ mantraḥ svayaṃ dīptaś ca dhyānaparasya yoginaḥ tadekabhaktisamāveśaśālino jñāninaś ca sambandhaḥ ity ete sannidhānahetavo yathottaram uktāḥ
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah16.b5"
    devanagari: |-
      समुदितत्वे तु का कथा स्यात् इति परमेश्वरेण उक्तम्
    iast: |-
      samuditatve tu kā kathā syāt iti parameśvareṇa uktam
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah16.b6"
    devanagari: |-
      ततो देवं पूजयित्वा तदाकृतिं कुशादिमयीम् अग्रे स्थापयित्वा गुर्वासादितज्ञानोपदेशक्रमेण तां पश्येत् स च मूलाधाराद् उदेत्य प्रसृतसुविततानन्तनाड्यध्वदण्डं वीर्येणाक्रम्य नासागगनपरिगतं विक्षिपन् व्याप्तुम् ईष्टे
    iast: |-
      tato devaṃ pūjayitvā tadākṛtiṃ kuśādimayīm agre sthāpayitvā gurvāsāditajñānopadeśakrameṇa tāṃ paśyet sa ca mūlādhārād udetya prasṛtasuvitatānantanāḍyadhvadaṇḍaṃ vīryeṇākramya nāsāgaganaparigataṃ vikṣipan vyāptum īṣṭe
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah16.b7"
    devanagari: |-
      यावद् धूमाभिरामप्रचिततरशिखाजालकेनाध्वचक्रं सञ्छाद्याभीष्टजीवानयनम् इति महाञ् जालनामा प्रयोगः
    iast: |-
      yāvad dhūmābhirāmapracitataraśikhājālakenādhvacakraṃ sañchādyābhīṣṭajīvānayanam iti mahāñ jālanāmā prayogaḥ
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah16.b8"
    devanagari: |-
      एतेनाच्छादनीयं व्रजति परवशं सम्मुखीनत्वम् आदौ पश्चाद् आनीयते चेत् सकलम् अथ ततो ऽप्य् अध्वमध्याद् यथेष्टम्
    iast: |-
      etenācchādanīyaṃ vrajati paravaśaṃ sammukhīnatvam ādau paścād ānīyate cet sakalam atha tato 'py adhvamadhyād yatheṣṭam
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah16.b9"
    devanagari: |-
      आकृष्टाव् उद्धतौ वा मृतजनविषये कर्षणीये ऽथ जीवे योगः श्रीशम्भुनाथागमपरिगमितो जालनामा मयोक्तः
    iast: |-
      ākṛṣṭāv uddhatau vā mṛtajanaviṣaye karṣaṇīye 'tha jīve yogaḥ śrīśambhunāthāgamaparigamito jālanāmā mayoktaḥ
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah16.b10"
    devanagari: |-
      बहिर् अपि इत्थं कथं न भवति आकर्षणादौ विनाभ्यासात् इति चेत् रागद्वेषादियोगवशेन तत्प्रवृत्तौ ऐश्वर्यावेशायोगात्
    iast: |-
      bahir api itthaṃ kathaṃ na bhavati ākarṣaṇādau vinābhyāsāt iti cet rāgadveṣādiyogavaśena tatpravṛttau aiśvaryāveśāyogāt
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah16.b11"
    devanagari: |-
      ततो नियतिनियन्त्रितत्वात् अभ्यासाद्यपेक्षा स्याद् एव
    iast: |-
      tato niyatiniyantritatvāt abhyāsādyapekṣā syād eva
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah16.b12"
    devanagari: |-
      इह तु अनुग्रहात्मकपरमेश्वरतावेशात् तथाभावः
    iast: |-
      iha tu anugrahātmakaparameśvaratāveśāt tathābhāvaḥ
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah16.b13"
    devanagari: |-
      परमेश्वर एव हि गुरुशरीराधिष्ठानद्वारेण अनुग्राह्यान् अनुगृह्णाति
    iast: |-
      parameśvara eva hi guruśarīrādhiṣṭhānadvāreṇa anugrāhyān anugṛhṇāti
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah16.b14"
    devanagari: |-
      स च अचिन्त्यमहिमा इति उक्तप्रायम्
    iast: |-
      sa ca acintyamahimā iti uktaprāyam
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah16.b15"
    devanagari: |-
      एवं जालप्रयोगाकृष्टो जीवो दार्भं जातीफलादि वा शरीरं समाविष्टो भवति न च स्पन्दते मनःप्रणादिसामग्र्यभावात् तदनुध्यानबलात् तु स्पन्दते ऽपि तादृशे ऽपि तस्मिन् पूर्ववत् प्रोक्षणादिसंस्कारः पूर्णाहुतियोजनिकान्तः
    iast: |-
      evaṃ jālaprayogākṛṣṭo jīvo dārbhaṃ jātīphalādi vā śarīraṃ samāviṣṭo bhavati na ca spandate manaḥpraṇādisāmagryabhāvāt tadanudhyānabalāt tu spandate 'pi tādṛśe 'pi tasmin pūrvavat prokṣaṇādisaṃskāraḥ pūrṇāhutiyojanikāntaḥ
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah16.b16"
    devanagari: |-
      अत्र परं पूर्णाहुत्या तस्य दार्भाद्याकारस्य परतेजसि लयः कर्तव्यः
    iast: |-
      atra paraṃ pūrṇāhutyā tasya dārbhādyākārasya paratejasi layaḥ kartavyaḥ
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah16.b17"
    devanagari: |-
      एवम् उद्धृतो ऽसौ पूर्णाहुत्यैव अपवृज्यते यदि स्वर्नरकप्रेततिर्यक्षु स्थितः
    iast: |-
      evam uddhṛto 'sau pūrṇāhutyaiva apavṛjyate yadi svarnarakapretatiryakṣu sthitaḥ
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah16.b18"
    devanagari: |-
      मनुष्यस् तु तदैव ज्ञानं योगं दीक्षां विवेकं वा लभते
    iast: |-
      manuṣyas tu tadaiva jñānaṃ yogaṃ dīkṣāṃ vivekaṃ vā labhate
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah16.b19"
    devanagari: |-
      अधिकारिशरीरत्वात् इति मृतोद्धरणम्
    iast: |-
      adhikāriśarīratvāt iti mṛtoddharaṇam
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah16.b20"
    devanagari: |-
      जीवतो ऽपि परोक्षस्य उत्पन्ने शक्तिपाते ऽयम् एव क्रमः दार्भाकृतिकल्पनजीवाकृष्टिवर्जम्
    iast: |-
      jīvato 'pi parokṣasya utpanne śaktipāte 'yam eva kramaḥ dārbhākṛtikalpanajīvākṛṣṭivarjam
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah16.b21"
    devanagari: |-
      ध्यानमात्रोपस्थापितस्यैव अस्य संस्कारः
    iast: |-
      dhyānamātropasthāpitasyaiva asya saṃskāraḥ
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah16.b22"
    devanagari: |-
      दीक्षा च भोगभोक्षोभयदायिनी
    iast: |-
      dīkṣā ca bhogabhokṣobhayadāyinī
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah16.b23"
    devanagari: |-
      स्ववासनाबलीयस्त्वात् भोगवासनाविच्छेदस्य च असम्भाव्यमानत्वात् बहुभिः दीक्षायाम् ऊर्ध्वशासनसंस्कारो बलवान् अन्यस् तु तत्संस्काराय स्यात्
    iast: |-
      svavāsanābalīyastvāt bhogavāsanāvicchedasya ca asambhāvyamānatvāt bahubhiḥ dīkṣāyām ūrdhvaśāsanasaṃskāro balavān anyas tu tatsaṃskārāya syāt
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah16.b24"
    devanagari: |-
      परोषस्यापि दीक्षितस्य तथैव ज्ञानाद्याविर्भावः इति
    iast: |-
      paroṣasyāpi dīkṣitasya tathaiva jñānādyāvirbhāvaḥ iti
- chapter: 17
  title_sa: तन्त्रसार, सप्तदशम् आह्निकम्
  title_iast: "tantrasāra, saptadaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah17.b1"
    devanagari: |-
      वैष्णवादिदक्षिणतन्त्रान्तेषु शासनेषु ये स्थिताः तद्गृहीतव्रता वा ये च उत्तमशासनस्था अपि अनधिकृताधरशासनगुरूपसेविनः ते यदा शक्तिपातेन पारमेश्वरेण उन्मुखीक्रियन्ते तदा तेषाम् अयं विधिः तत्र एनं कृतोपवासम् अन्यदिने साधारणमन्त्रपूजितस्य तदीयां चेष्टां श्रावितस्य भगवतो ऽग्रे प्रवेशयेत् तत्रास्य व्रतं गृहीत्वा अम्भसि क्षिपेत् ततो ऽसौ स्नायात् ततः प्रोक्ष्य चरुदन्तकाष्ठाभ्यां संस्कृत्य बद्धनेत्रं प्रवेश्य साधारणेन मन्त्रेण परमेश्वरपूजां कारयेत्
    iast: |-
      vaiṣṇavādidakṣiṇatantrānteṣu śāsaneṣu ye sthitāḥ tadgṛhītavratā vā ye ca uttamaśāsanasthā api anadhikṛtādharaśāsanagurūpasevinaḥ te yadā śaktipātena pārameśvareṇa unmukhīkriyante tadā teṣām ayaṃ vidhiḥ tatra enaṃ kṛtopavāsam anyadine sādhāraṇamantrapūjitasya tadīyāṃ ceṣṭāṃ śrāvitasya bhagavato 'gre praveśayet tatrāsya vrataṃ gṛhītvā ambhasi kṣipet tato 'sau snāyāt tataḥ prokṣya carudantakāṣṭhābhyāṃ saṃskṛtya baddhanetraṃ praveśya sādhāraṇena mantreṇa parameśvarapūjāṃ kārayet
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah17.b2"
    devanagari: |-
      ततः साधारणमन्त्रेण शिवीकृते अग्नौ व्रतशुद्धिं कुर्यात् तन्मन्त्रसम्पुटं नाम कृत्वा प्रायश्चित्तं शोधयामि इति स्वाहान्तं शतं जुहुयात्
    iast: |-
      tataḥ sādhāraṇamantreṇa śivīkṛte agnau vrataśuddhiṃ kuryāt tanmantrasampuṭaṃ nāma kṛtvā prāyaścittaṃ śodhayāmi iti svāhāntaṃ śataṃ juhuyāt
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah17.b3"
    devanagari: |-
      ततो ऽपि पूर्णाहुतिः वौषडन्तेन
    iast: |-
      tato 'pi pūrṇāhutiḥ vauṣaḍantena
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah17.b4"
    devanagari: |-
      ततो व्रतेश्वरम् आहूय पूजयित्वा तस्य शिवाज्ञया अकिञ्चित्करः त्वम् अस्य भव इति श्रावणां कृत्वा तं तर्पयित्वा विसृज्य अग्निं विसृजेत् इति लिङ्गोद्धारः
    iast: |-
      tato vrateśvaram āhūya pūjayitvā tasya śivājñayā akiñcitkaraḥ tvam asya bhava iti śrāvaṇāṃ kṛtvā taṃ tarpayitvā visṛjya agniṃ visṛjet iti liṅgoddhāraḥ
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah17.b5"
    devanagari: |-
      ततो ऽस्य अधिवासादि प्राग्वत्
    iast: |-
      tato 'sya adhivāsādi prāgvat
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah17.b6"
    devanagari: |-
      दीक्षा यथेच्छम्
    iast: |-
      dīkṣā yatheccham
- chapter: 18
  title_sa: तन्त्रसार, अष्टादशम् आह्निकम्
  title_iast: "tantrasāra, aṣṭādaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah18.b1"
    devanagari: |-
      स्वभ्यस्तज्ञानिनं साधकत्वे गुरुत्वे वा अभिषिञ्चेत् यतः सर्वलक्षणहीनो ऽपि ज्ञानवान् एव साधकत्वे अनुग्रहकरणे च अधिकृतः न अन्यः अभिषिक्तो ऽपि
    iast: |-
      svabhyastajñāninaṃ sādhakatve gurutve vā abhiṣiñcet yataḥ sarvalakṣaṇahīno 'pi jñānavān eva sādhakatve anugrahakaraṇe ca adhikṛtaḥ na anyaḥ abhiṣikto 'pi
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah18.b2"
    devanagari: |-
      स्वाधिकारसमर्पणे गुरुः दीक्षादि अकुर्वन् अपि न प्रत्यवैति पूर्वं तु प्रत्यवायेन अधिकारबन्धेन विद्येशपददायिना बन्ध एव अस्य दीक्षाद्यकरणम् सो ऽभिषिक्तो मन्त्रदेवतातादात्म्यसिद्धये षाण्मासिकं प्रत्यहं जपहोमविशेषपूजाचरणेन विद्याव्रतं कुर्यात् तदनन्तरं लब्धतन्मयीभावो दीक्षादौ अधिकृतः तत्र न अयोग्यान् दीक्षेत न च योग्यं परिहरेत् दीक्षितम् अपि ज्ञानदाने परीक्षेत छद्मगृहीतज्ञानम् अपि ज्ञात्वा उपेक्षेत अत्र च अभिषेकविभवेन देवपूजादिकम्
    iast: |-
      svādhikārasamarpaṇe guruḥ dīkṣādi akurvan api na pratyavaiti pūrvaṃ tu pratyavāyena adhikārabandhena vidyeśapadadāyinā bandha eva asya dīkṣādyakaraṇam so 'bhiṣikto mantradevatātādātmyasiddhaye ṣāṇmāsikaṃ pratyahaṃ japahomaviśeṣapūjācaraṇena vidyāvrataṃ kuryāt tadanantaraṃ labdhatanmayībhāvo dīkṣādau adhikṛtaḥ tatra na ayogyān dīkṣeta na ca yogyaṃ pariharet dīkṣitam api jñānadāne parīkṣeta chadmagṛhītajñānam api jñātvā upekṣeta atra ca abhiṣekavibhavena devapūjādikam
- chapter: 19
  title_sa: तन्त्रसार, एकोनविंशम् आह्निकम्
  title_iast: "tantrasāra, ekonaviṃśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah19.b1"
    devanagari: |-
      अथ अधरशासनस्थानां गुर्वन्तानाम् अपि मरणसमनन्तरं मृतोद्धारोदितशक्तिपातयोगाद् एव अन्त्यसंस्काराख्यां दीक्षां कुर्यात् ऊर्ध्वशासनस्थानाम् अपि लुप्तसमयानाम् अकृतप्रायश्चित्तानाम् इति परमेश्वराज्ञा
    iast: |-
      atha adharaśāsanasthānāṃ gurvantānām api maraṇasamanantaraṃ mṛtoddhāroditaśaktipātayogād eva antyasaṃskārākhyāṃ dīkṣāṃ kuryāt ūrdhvaśāsanasthānām api luptasamayānām akṛtaprāyaścittānām iti parameśvarājñā
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah19.b2"
    devanagari: |-
      तत्र यो मृतोद्धारे विधिः उक्तः स सर्व एव शरीरे कर्तव्यः पूर्णाहुत्या शवशरीरदाहः मूढानां तु प्रतीतिरूढये सप्रत्ययाम् अन्त्येष्टिं क्रियाज्ञानयोगबलात् कुर्यात् तत्र शवशरीरे संहारक्रमेण मन्त्रान् न्यस्य जालक्रमेण आकृष्य रोधनवेधनघट्टनादि कुर्यात् प्राणसञ्चारक्रमेण हृदि कण्ठे ललाटे च इत्य् एवं शवशरीरं कम्पते
    iast: |-
      tatra yo mṛtoddhāre vidhiḥ uktaḥ sa sarva eva śarīre kartavyaḥ pūrṇāhutyā śavaśarīradāhaḥ mūḍhānāṃ tu pratītirūḍhaye sapratyayām antyeṣṭiṃ kriyājñānayogabalāt kuryāt tatra śavaśarīre saṃhārakrameṇa mantrān nyasya jālakrameṇa ākṛṣya rodhanavedhanaghaṭṭanādi kuryāt prāṇasañcārakrameṇa hṛdi kaṇṭhe lalāṭe ca ity evaṃ śavaśarīraṃ kampate
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah19.b3"
    devanagari: |-
      ततः परमशिवे योजनिकां कृत्वा तत् दहेत् पूर्णाहुत्या अन्त्येष्ट्या शुद्धानाम् अन्येषाम् अपि वा श्राद्धदीक्षां त्र्यहं तुर्ये दिने मासि मासि संवत्सरे संवत्सरे कुर्यात्
    iast: |-
      tataḥ paramaśive yojanikāṃ kṛtvā tat dahet pūrṇāhutyā antyeṣṭyā śuddhānām anyeṣām api vā śrāddhadīkṣāṃ tryahaṃ turye dine māsi māsi saṃvatsare saṃvatsare kuryāt
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah19.b4"
    devanagari: |-
      तत्र होमान्तं विधिं कृत्वा नैवेद्यम् एकहस्ते कृत्वा तदीयां वीर्यरूपां शक्तिं भोग्याकारां पशुगतभोग्यशक्तितादात्म्यप्रतिपन्नां ध्यात्वा परमेश्वरे भोक्तरि अर्पयेत् इत्य् एवं भोग्यभावे निवृत्ते पतिर् एव भवति अन्त्येष्टिमृतोद्धरणश्राद्धदीक्षाणाम् अन्यतमेनापि यद्यपि कृतार्थता तथापि बुभुक्षोः क्रियाभूयस्त्वं फलभूयस्त्वाय इति सर्वम् आचरेत्
    iast: |-
      tatra homāntaṃ vidhiṃ kṛtvā naivedyam ekahaste kṛtvā tadīyāṃ vīryarūpāṃ śaktiṃ bhogyākārāṃ paśugatabhogyaśaktitādātmyapratipannāṃ dhyātvā parameśvare bhoktari arpayet ity evaṃ bhogyabhāve nivṛtte patir eva bhavati antyeṣṭimṛtoddharaṇaśrāddhadīkṣāṇām anyatamenāpi yadyapi kṛtārthatā tathāpi bubhukṣoḥ kriyābhūyastvaṃ phalabhūyastvāya iti sarvam ācaret
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah19.b5"
    devanagari: |-
      मुमुक्षोर् अपि तन्मयीभावसिद्धये अयम् जीवतः प्रत्यहम् अनुष्ठानाभ्यासवत्
    iast: |-
      mumukṣor api tanmayībhāvasiddhaye ayam jīvataḥ pratyaham anuṣṭhānābhyāsavat
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah19.b6"
    devanagari: |-
      तत्त्वज्ञानिनस् तु न को ऽप्य् अयम् अन्त्येष्ट्यादिश्राद्धान्तो विधिः उपयोगी तन्मरणं तद्विद्यासन्तानिनां पर्वदिनं संविदंशपूरणात् तावतः सन्तानस्य एकसंविन्मात्रपरमार्थत्वात् जीवतो ज्ञानलाभसन्तानदिवसवत्
    iast: |-
      tattvajñāninas tu na ko 'py ayam antyeṣṭyādiśrāddhānto vidhiḥ upayogī tanmaraṇaṃ tadvidyāsantānināṃ parvadinaṃ saṃvidaṃśapūraṇāt tāvataḥ santānasya ekasaṃvinmātraparamārthatvāt jīvato jñānalābhasantānadivasavat
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah19.b7"
    devanagari: |-
      सर्वत्र च अत्र श्राद्धादिविधौ मूर्तियागः प्रधानम् इति श्रीसिद्धामतम् तद्विधिश् च वक्ष्यते नैमित्तिकप्रकाशने
    iast: |-
      sarvatra ca atra śrāddhādividhau mūrtiyāgaḥ pradhānam iti śrīsiddhāmatam tadvidhiś ca vakṣyate naimittikaprakāśane
- chapter: 20
  title_sa: तन्त्रसार, विंशम् आह्निकम्
  title_iast: "tantrasāra, viṃśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah20.b1"
    devanagari: |-
      तत्र या दीक्षा संस्कारसिद्ध्यै ज्ञानयोग्यान् प्रति या च तदशक्तान् प्रति मोक्षदीक्षा सबीजा तस्यां कृतायाम् आजीवं शेषवर्तनं गुरुः उपदिशेत्
    iast: |-
      tatra yā dīkṣā saṃskārasiddhyai jñānayogyān prati yā ca tadaśaktān prati mokṣadīkṣā sabījā tasyāṃ kṛtāyām ājīvaṃ śeṣavartanaṃ guruḥ upadiśet
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah20.b2"
    devanagari: |-
      तत्र नित्यं नैमित्तिकं काम्यम् इति त्रिविधं शेषवर्तनम् अन्त्यं च साधकस्यैव तत् न इह निश्चेतव्यम्
    iast: |-
      tatra nityaṃ naimittikaṃ kāmyam iti trividhaṃ śeṣavartanam antyaṃ ca sādhakasyaiva tat na iha niścetavyam
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah20.b3"
    devanagari: |-
      तत्र नियतभवं नित्यं तन्मयीभाव एव नैमित्तिकं तदुपयोगि सन्ध्योपासनं प्रत्यहम् अनुष्ठानं पर्वदिनं पवित्रकम् इत्यादि
    iast: |-
      tatra niyatabhavaṃ nityaṃ tanmayībhāva eva naimittikaṃ tadupayogi sandhyopāsanaṃ pratyaham anuṣṭhānaṃ parvadinaṃ pavitrakam ityādi
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah20.b4"
    devanagari: |-
      तद् अपि नित्यं स्वकालनैयत्यात् इति केचित्
    iast: |-
      tad api nityaṃ svakālanaiyatyāt iti kecit
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah20.b5"
    devanagari: |-
      नैमित्तिकं तु तच्छासनस्थानाम् अपि अनियतम् तद्यथा गुरुतद्वर्गागमनं तत्पर्वदिनं ज्ञानलाभदिनम् इत्यादिकम् इति केचित्
    iast: |-
      naimittikaṃ tu tacchāsanasthānām api aniyatam tadyathā gurutadvargāgamanaṃ tatparvadinaṃ jñānalābhadinam ityādikam iti kecit
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah20.b6"
    devanagari: |-
      तत्र नियतपूजा सन्ध्योपासा गुरुपूजा पर्वपूजा पवित्रकम् इति अवश्यम्भावि
    iast: |-
      tatra niyatapūjā sandhyopāsā gurupūjā parvapūjā pavitrakam iti avaśyambhāvi
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah20.b7"
    devanagari: |-
      नैमित्तिकम् ज्ञानलाभः शास्त्रलाभो गुरुतद्वर्गगृहागमनं तदीयजन्मसंस्कारप्रायणदिनानि लौकिकोत्सवः शास्त्रव्याख्या आदिमध्यान्ता देवतादर्शनं मेलकं स्वप्नाज्ञा समयनिष्कृतिलाभः इत्य् एतत् नैमित्तिकं विशेषार्चनकारणम्
    iast: |-
      naimittikam jñānalābhaḥ śāstralābho gurutadvargagṛhāgamanaṃ tadīyajanmasaṃskāraprāyaṇadināni laukikotsavaḥ śāstravyākhyā ādimadhyāntā devatādarśanaṃ melakaṃ svapnājñā samayaniṣkṛtilābhaḥ ity etat naimittikaṃ viśeṣārcanakāraṇam
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah20.b8"
    devanagari: |-
