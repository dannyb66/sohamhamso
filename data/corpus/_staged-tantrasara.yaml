    hi: [तन्त्रसार, तन्त्रालोक, काश्मीर शैव, त्रिक, अभिनवगुप्त, अनुष्ठान, आह्निक]
    mr: [तन्त्रसार, तन्त्रालोक, काश्मीर शैव, त्रिक, अभिनवगुप्त, अनुष्ठान, आह्निक]
    bn: [তন্ত্রসার, তন্ত্রালোক, কাশ্মীর শৈব, ত্রিক, অভিনবগুপ্ত, অনুষ্ঠান, আহ্নিক]
    as: [তন্ত্ৰসাৰ, তন্ত্ৰালোক, কাশ্মীৰ শৈৱ, ত্ৰিক, অভিনৱগুপ্ত, অনুষ্ঠান, আহ্নিক]
    gu: [તંત્રસાર, તંત્રાલોક, કાશ્મીર શૈવ, ત્રિક, અભિનવગુપ્ત, અનુષ્ઠાન, આહ્નિક]
