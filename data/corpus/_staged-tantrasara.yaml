      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "To explain: consciousness first impels (kalayati) an entity inwardly; then it impels it outwardly with vividness; seizing upon a relish for it right there, it then impels that very entity inwardly with the wish to withdraw it. Next it both fashions and devours the doubt that obstructs that withdrawal; it impels into the Self, by withdrawal, the portion of the entity whose doubt-element has been consumed. Then it impels the very nature \"this withdrawing is my own form\"; then, in impelling the nature of the withdrawer, it impels the persistence of some entity as a latent impression, and of another the condition of pure consciousness alone remaining. Then, since it is inseparable from the impelling of its own nature, it impels the wheel of the sense-instruments; then it impels the lord of the instruments; then it impels even the māyā-fashioned form of the knower; it impels the knower relishing the grasping of expansion as it tends toward casting off contraction; and thence it impels even the fully expanded form. Thus these twelve Blessed Ones of consciousness, directed toward the knowers — even toward a single one — partaking of arising whether simultaneously or in sequence, by twos, by threes, and so on, revolving like a wheel, manifesting outwardly too in the sequence of months, lunar digits, zodiacal heaps, and the like, or finally in the sequence of pot, cloth, and the rest, nourishing the freedom of the Lord of the Wheel, are denoted by the word \"Kālī.\""
