    iast: |-
      evaṃ svātmasūryaparameśatritayaikībhāvanayā dikcarcā iti abhinavaguptaguravaḥ
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah13.b25"
    devanagari: |-
      एवं स्थिते उत्तराभिमुखम् उपविश्य देहपुर्यष्टकादौ अहम्भावत्यागेन देहतां दहेत् सन्निधाव् अपि परदेहवत् अदेहत्वात् ततो निस्तरङ्गध्रुवधामरूढस्य दृष्टिस्वाभाव्यात् या किल आद्या स्पन्दकला सैव मूर्तिः तदुपरि यथोपदिष्टयाज्यदेवताचक्रन्यासः प्राधान्येन च इह शक्तयो याज्याः
    iast: |-
      evaṃ sthite uttarābhimukham upaviśya dehapuryaṣṭakādau ahambhāvatyāgena dehatāṃ dahet sannidhāv api paradehavat adehatvāt tato nistaraṅgadhruvadhāmarūḍhasya dṛṣṭisvābhāvyāt yā kila ādyā spandakalā saiva mūrtiḥ tadupari yathopadiṣṭayājyadevatācakranyāsaḥ prādhānyena ca iha śaktayo yājyāḥ
  - verse_num: 26
    section_type: prose
    prose_block_ref: "ah13.b26"
    devanagari: |-
      तदासनत्वात् भगवन्नवात्मादीनां शक्तेर् एव च पूज्यत्वात् इति गुरवः
    iast: |-
      tadāsanatvāt bhagavannavātmādīnāṃ śakter eva ca pūjyatvāt iti guravaḥ
  - verse_num: 27
    section_type: prose
    prose_block_ref: "ah13.b27"
    devanagari: |-
      तत्र च पञ्च अवस्था जाग्रदाद्याः षष्ठी च अनुत्तरा नाम स्वभावदशा अनुसन्धेया
    iast: |-
      tatra ca pañca avasthā jāgradādyāḥ ṣaṣṭhī ca anuttarā nāma svabhāvadaśā anusandheyā
  - verse_num: 28
    section_type: prose
    prose_block_ref: "ah13.b28"
    devanagari: |-
      इति षोढा न्यासो भवति
    iast: |-
      iti ṣoḍhā nyāso bhavati
  - verse_num: 29
    section_type: prose
    prose_block_ref: "ah13.b29"
    devanagari: |-
      तत्र कारणानां ब्रह्मविष्णुरुद्रेशसदाशिवशक्तिरूपाणां प्रत्येकम् अधिष्ठानात् षट्त्रिंशत्तत्त्वकलापस्य लौकिकतत्त्वोत्तीर्णस्य भैरवभट्टारकाभेदवृत्ते न्यासे पूर्णत्वात् भैरवीभावः तेन एतत् अनवकाशम्
    iast: |-
      tatra kāraṇānāṃ brahmaviṣṇurudreśasadāśivaśaktirūpāṇāṃ pratyekam adhiṣṭhānāt ṣaṭtriṃśattattvakalāpasya laukikatattvottīrṇasya bhairavabhaṭṭārakābhedavṛtte nyāse pūrṇatvāt bhairavībhāvaḥ tena etat anavakāśam
  - verse_num: 30
    section_type: prose
    prose_block_ref: "ah13.b30"
    devanagari: |-
      यद् आहुः अतरङ्गरूढौ लब्धायां पुनः किं तत्त्वसृष्टिर् न्यासादिना इति
    iast: |-
      yad āhuḥ ataraṅgarūḍhau labdhāyāṃ punaḥ kiṃ tattvasṛṣṭir nyāsādinā iti
  - verse_num: 31
    section_type: prose
    prose_block_ref: "ah13.b31"
    devanagari: |-
