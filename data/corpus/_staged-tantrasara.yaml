    iast: |-
      sa ca daiśiko guruḥ ācāryo dīkṣakaḥ cumbakaḥ sa cāyaṃ pūrṇajñāna eva sarvottamaḥ tena vinā dīkṣādyasampatteḥ
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah11.b20"
    devanagari: |-
      योगी तु फलोत्सुकस्य युक्तो यदि उपायोपदेशेन अव्यवहितम् एव फलं दातुं शक्तः उपायोपदेशेन तु ज्ञाने एव युक्तो मोक्षे ऽपि अभ्युपायात् ज्ञानपूर्णताकाङ्क्षी च बहून् अपि गुरून् कुर्यात्
    iast: |-
      yogī tu phalotsukasya yukto yadi upāyopadeśena avyavahitam eva phalaṃ dātuṃ śaktaḥ upāyopadeśena tu jñāne eva yukto mokṣe 'pi abhyupāyāt jñānapūrṇatākāṅkṣī ca bahūn api gurūn kuryāt
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah11.b21"
    devanagari: |-
      उत्तमोत्तमादिज्ञानभेदापेक्षया तेषु वर्तेत सम्पूर्णज्ञानगुरुत्यागे तु प्रायश्चित्तम् एव
    iast: |-
      uttamottamādijñānabhedāpekṣayā teṣu varteta sampūrṇajñānagurutyāge tu prāyaścittam eva
  - verse_num: 22
    section_type: prose
    prose_block_ref: "ah11.b22"
    devanagari: |-
      ननु सो ऽपि अब्रुवन् विपरीतं वा ब्रुवन् किं न त्याज्यः नैव इति ब्रूमः तस्य हि पूर्णज्ञानत्वात् एव रागाद्यभाव इति अवचनादिकं शिष्यगतेनैव केनचित् अयोग्यत्वानाश्वस्तत्वादिना निमित्तेन स्यात् इति तदुपासने यतनीयं शिष्येण न तत्त्यागे
    iast: |-
      nanu so 'pi abruvan viparītaṃ vā bruvan kiṃ na tyājyaḥ naiva iti brūmaḥ tasya hi pūrṇajñānatvāt eva rāgādyabhāva iti avacanādikaṃ śiṣyagatenaiva kenacit ayogyatvānāśvastatvādinā nimittena syāt iti tadupāsane yatanīyaṃ śiṣyeṇa na tattyāge
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah11.b23"
    devanagari: |-
      एवम् अनुग्रहनिमित्तं शक्तिपातो निरपेक्ष एव कर्मादिनियत्यपेक्षणात्
    iast: |-
      evam anugrahanimittaṃ śaktipāto nirapekṣa eva karmādiniyatyapekṣaṇāt
  - verse_num: 24
    section_type: prose
    prose_block_ref: "ah11.b24"
    devanagari: |-
      तिरोभाव इति तिरोभावो हि कर्माद्यपेक्षगाढदुःखमोहभागित्वफलः यथाहि प्रकाशस्वातन्त्र्यात् प्रबुद्धो ऽपि मूढवत् चेष्टते हृदयेन च मूढचेष्टां निन्दति तथा मूढो ऽपि प्रबुद्धचेष्टां मन्त्राराधनादिकां कुर्यात् निन्देच् च यथा च अस्य मूढचेष्टा क्रियमाणापि प्रबुद्धस्य ध्वंसम् एति तथा अस्य प्रबुद्धचेष्टा सा तु निन्द्यमाना निषिद्धाचरणरूपत्वात् स्वयं च तयैव विशङ्कमानत्वात् एनं दुःखमोहपङ्के निमज्जयति न तु उत्पन्नशक्तिपातस्य तिरोभावो ऽस्ति अत्रापि च कर्माद्यपेक्षा पूर्ववत् निषेध्या तत्रापि च इच्छावैचित्र्यात् एतद् देहमात्रोपभोग्यदुःखफलत्वं वा दीक्षासमयचर्यागुरुदेवाग्न्यादौ सेवानिन्दनोभयप्रसक्तानाम् इव प्राक् शिवशासनस्थानां तत्त्यागिनाम् इव
    iast: |-
      tirobhāva iti tirobhāvo hi karmādyapekṣagāḍhaduḥkhamohabhāgitvaphalaḥ yathāhi prakāśasvātantryāt prabuddho 'pi mūḍhavat ceṣṭate hṛdayena ca mūḍhaceṣṭāṃ nindati tathā mūḍho 'pi prabuddhaceṣṭāṃ mantrārādhanādikāṃ kuryāt nindec ca yathā ca asya mūḍhaceṣṭā kriyamāṇāpi prabuddhasya dhvaṃsam eti tathā asya prabuddhaceṣṭā sā tu nindyamānā niṣiddhācaraṇarūpatvāt svayaṃ ca tayaiva viśaṅkamānatvāt enaṃ duḥkhamohapaṅke nimajjayati na tu utpannaśaktipātasya tirobhāvo 'sti atrāpi ca karmādyapekṣā pūrvavat niṣedhyā tatrāpi ca icchāvaicitryāt etad dehamātropabhogyaduḥkhaphalatvaṃ vā dīkṣāsamayacaryāgurudevāgnyādau sevānindanobhayaprasaktānām iva prāk śivaśāsanasthānāṃ tattyāginām iva
  - verse_num: 25
    section_type: prose
    prose_block_ref: "ah11.b25"
    devanagari: |-
      तत्रापि इच्छावैचित्र्यात् तिरोभूतो ऽपि स्वयं वा शक्तिपातेन युज्यते मृतो वा बन्धुगुर्वादिकृपामुखेन इत्य् एवं कृत्यभागित्वं स्वात्मनि अनुसन्दधत् परमेश्वर एव इति न खण्डितम् आत्मानं पश्येत्
    iast: |-
      tatrāpi icchāvaicitryāt tirobhūto 'pi svayaṃ vā śaktipātena yujyate mṛto vā bandhugurvādikṛpāmukhena ity evaṃ kṛtyabhāgitvaṃ svātmani anusandadhat parameśvara eva iti na khaṇḍitam ātmānaṃ paśyet
- chapter: 12
  title_sa: तन्त्रसार, द्वादशम् आह्निकम्
  title_iast: "tantrasāra, dvādaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah12.b1"
    devanagari: |-
      दीक्षादिकं वक्तव्यम् इति उक्तम् अतो दीक्षास्वरूपनिरूपणार्थं प्राक् कर्तव्यं स्नानम् उपदिश्यते
    iast: |-
      dīkṣādikaṃ vaktavyam iti uktam ato dīkṣāsvarūpanirūpaṇārthaṃ prāk kartavyaṃ snānam upadiśyate
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah12.b2"
    devanagari: |-
      स्नानं च शुद्धता उच्यते शुद्धता च परमेश्वरस्वरूपसमावेशः
    iast: |-
      snānaṃ ca śuddhatā ucyate śuddhatā ca parameśvarasvarūpasamāveśaḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah12.b3"
    devanagari: |-
      कालुष्यापगमो हि शुद्धिः कालुष्यं च तदेकरूपे ऽपि अतत्स्वभावरूपान्तरसंवलनाभिमानः
    iast: |-
      kāluṣyāpagamo hi śuddhiḥ kāluṣyaṃ ca tadekarūpe 'pi atatsvabhāvarūpāntarasaṃvalanābhimānaḥ
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah12.b4"
    devanagari: |-
      तद् इह स्वतन्त्रानन्दचिन्मात्रसारे स्वात्मनि विश्वत्रापि वा तदन्यरूपसंवलनाभिमानः अशुद्धिः सा च महाभैरवसमावेशेन व्यपोह्यते सो ऽपि कस्यचित् झटिति भवेत् कस्यापि उपायान्तरमुखप्रेक्षी
    iast: |-
      tad iha svatantrānandacinmātrasāre svātmani viśvatrāpi vā tadanyarūpasaṃvalanābhimānaḥ aśuddhiḥ sā ca mahābhairavasamāveśena vyapohyate so 'pi kasyacit jhaṭiti bhavet kasyāpi upāyāntaramukhaprekṣī
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah12.b5"
    devanagari: |-
      तत्रापि च एकद्वित्र्यादिभेदेन समस्तव्यस्ततया क्वचित् कस्यचित् कदाचित् च तथा आश्वासोपलब्धेः विचित्रो भेदः
    iast: |-
      tatrāpi ca ekadvitryādibhedena samastavyastatayā kvacit kasyacit kadācit ca tathā āśvāsopalabdheḥ vicitro bhedaḥ
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah12.b6"
    devanagari: |-
      स च अष्टधा क्षितिजलपवनहुताशनाकाशसोमसूर्यात्मरूपासु अष्टासु मूर्तिषु मन्त्रन्यासमहिम्ना परमेश्वररूपतया भावितासु तादात्म्येन च देहे परमेश्वरसमाविष्टे शरीरादिविभागवृत्तेः चैतन्यस्यापि परमेश्वरसमावेशप्राप्तिः कस्यापि तु स्नानवस्त्रादितुष्टिजनकत्वात् परमेशोपायताम् एतीति उक्तं च श्रीमदानन्दादौ धृतिः आप्यायो वीर्यं मलदाहो व्याप्तिः सृष्टिसामर्थ्यं स्थितिसामर्थ्यम् अभेदश् च इत्य् एतानि तेषु मुख्यफलानि तेषु तेषु उपाहितस्य मन्त्रस्य तत्तद्रूपधारित्वात्
    iast: |-
      sa ca aṣṭadhā kṣitijalapavanahutāśanākāśasomasūryātmarūpāsu aṣṭāsu mūrtiṣu mantranyāsamahimnā parameśvararūpatayā bhāvitāsu tādātmyena ca dehe parameśvarasamāviṣṭe śarīrādivibhāgavṛtteḥ caitanyasyāpi parameśvarasamāveśaprāptiḥ kasyāpi tu snānavastrādituṣṭijanakatvāt parameśopāyatām etīti uktaṃ ca śrīmadānandādau dhṛtiḥ āpyāyo vīryaṃ maladāho vyāptiḥ sṛṣṭisāmarthyaṃ sthitisāmarthyam abhedaś ca ity etāni teṣu mukhyaphalāni teṣu teṣu upāhitasya mantrasya tattadrūpadhāritvāt
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah12.b7"
    devanagari: |-
      वीरोद्देशेन तु विशेषः तद् यथा रणरेणुः वीराम्भः महामरुत् वीरभस्म श्मशाननभः तदुपहितौ चन्द्रार्कौ आत्मा निर्विकल्पकः
    iast: |-
      vīroddeśena tu viśeṣaḥ tad yathā raṇareṇuḥ vīrāmbhaḥ mahāmarut vīrabhasma śmaśānanabhaḥ tadupahitau candrārkau ātmā nirvikalpakaḥ
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah12.b8"
    devanagari: |-
      पुनर् अपि बाह्याभ्यन्तरतया द्वित्वम् बहिरुपास्यमन्त्रतादात्म्येन तन्मयीकृते तत्र तत्र निमज्जनम् इत्य् उक्तम्
    iast: |-
      punar api bāhyābhyantaratayā dvitvam bahirupāsyamantratādātmyena tanmayīkṛte tatra tatra nimajjanam ity uktam
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah12.b9"
    devanagari: |-
      विशेषस् तु आनन्दद्रव्यं वीराधारगतं निरीक्षणेन शिवमयीकृत्य तत्रैव मन्त्रचक्रपूजनम् ततः तेनैव देहप्राणोभयाश्रितदेवताचक्रतर्पणम् इति मुख्यं स्नानम्
    iast: |-
      viśeṣas tu ānandadravyaṃ vīrādhāragataṃ nirīkṣaṇena śivamayīkṛtya tatraiva mantracakrapūjanam tataḥ tenaiva dehaprāṇobhayāśritadevatācakratarpaṇam iti mukhyaṃ snānam
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah12.b10"
    devanagari: |-
      आभ्यन्तरं यथा तत्तद्धरादिरूपधारणया तत्र तत्र पार्थिवादौ चक्रे तन्मयीभावः
    iast: |-
      ābhyantaraṃ yathā tattaddharādirūpadhāraṇayā tatra tatra pārthivādau cakre tanmayībhāvaḥ
- chapter: 13
  title_sa: तन्त्रसार, त्रयोदशम् आह्निकम्
  title_iast: "tantrasāra, trayodaśam āhnikam"
  verses:
  - verse_num: 1
    section_type: prose
    prose_block_ref: "ah13.b1"
    devanagari: |-
      अथ प्रसन्नहृदयो यागस्थानं यायात् तच् च यत्रैव हृदयं प्रसादयुक्तं परमेश्वरसमावेशयोग्यं भवति तद् एव न तु अस्य अन्यल् लक्षणम् उक्ताव् अपि ध्येयतादात्म्यम् एव कारणम् तद् अपि भावप्रसादाद् एव इति नान्यत् स्थानम्
    iast: |-
      atha prasannahṛdayo yāgasthānaṃ yāyāt tac ca yatraiva hṛdayaṃ prasādayuktaṃ parameśvarasamāveśayogyaṃ bhavati tad eva na tu asya anyal lakṣaṇam uktāv api dhyeyatādātmyam eva kāraṇam tad api bhāvaprasādād eva iti nānyat sthānam
  - verse_num: 2
    section_type: prose
    prose_block_ref: "ah13.b2"
    devanagari: |-
      पीठपर्वताग्रम् इत्यादिस् तु शास्त्रे स्थानोद्देश एतत्पर एव बोद्धव्यः
    iast: |-
      pīṭhaparvatāgram ityādis tu śāstre sthānoddeśa etatpara eva boddhavyaḥ
  - verse_num: 3
    section_type: prose
    prose_block_ref: "ah13.b3"
    devanagari: |-
      तेषु तेषु पीठादिस्थानेषु परमेशनियत्या परमेश्वराविष्टानां शक्तीनां देहग्रहणात् आर्यदेशा इव धार्मिकाणां म्लेच्छदेशा इव अधार्मिकाणाम् पर्वताग्रादेश् चैकान्तत्वेन विक्षेपपरिहारात् ऐकाग्र्यपदत्वम् इति
    iast: |-
      teṣu teṣu pīṭhādisthāneṣu parameśaniyatyā parameśvarāviṣṭānāṃ śaktīnāṃ dehagrahaṇāt āryadeśā iva dhārmikāṇāṃ mlecchadeśā iva adhārmikāṇām parvatāgrādeś caikāntatvena vikṣepaparihārāt aikāgryapadatvam iti
  - verse_num: 4
    section_type: prose
    prose_block_ref: "ah13.b4"
    devanagari: |-
      तत्र यागगृहाग्रे बहिर् एव सामान्यन्यासं कुर्यात् करयोः पूर्वं ततो देहे
    iast: |-
      tatra yāgagṛhāgre bahir eva sāmānyanyāsaṃ kuryāt karayoḥ pūrvaṃ tato dehe
  - verse_num: 5
    section_type: prose
    prose_block_ref: "ah13.b5"
    devanagari: |-
      ह्रीं न फ ह्रीं ह्रीं आ क्ष ह्रीं इत्य् आभ्यां शक्तिशक्तिमद्वाचकाभ्यां मालिनीशब्दराशिमन्त्राभ्याम् एकेनैव आदौ शक्तिः ततः शक्तिमान् इति मुक्तौ पादाग्राच् छिरोऽन्तम् भुक्तौ तु सर्वो विपर्ययः
    iast: |-
      hrīṃ na pha hrīṃ hrīṃ ā kṣa hrīṃ ity ābhyāṃ śaktiśaktimadvācakābhyāṃ mālinīśabdarāśimantrābhyām ekenaiva ādau śaktiḥ tataḥ śaktimān iti muktau pādāgrāc chiro'ntam bhuktau tu sarvo viparyayaḥ
  - verse_num: 6
    section_type: prose
    prose_block_ref: "ah13.b6"
    devanagari: |-
      मालिनी हि भगवती मुख्यम् शाक्तं रूपं बीजयोनिसङ्घट्टेन समस्तकामदुघम्
    iast: |-
      mālinī hi bhagavatī mukhyam śāktaṃ rūpaṃ bījayonisaṅghaṭṭena samastakāmadugham
  - verse_num: 7
    section_type: prose
    prose_block_ref: "ah13.b7"
    devanagari: |-
      अन्वर्थं चैतन् नाम रुद्रशक्तिमालाभिर् युक्ता फलेषु पुष्पिता संसारशिशिरसंहारनादभ्रमरी सिद्धिमोक्षधारिणी दानादानशक्तियुक्ता इति रलयोर् एकत्वस्मृतेः
    iast: |-
      anvarthaṃ caitan nāma rudraśaktimālābhir yuktā phaleṣu puṣpitā saṃsāraśiśirasaṃhāranādabhramarī siddhimokṣadhāriṇī dānādānaśaktiyuktā iti ralayor ekatvasmṛteḥ
  - verse_num: 8
    section_type: prose
    prose_block_ref: "ah13.b8"
    devanagari: |-
      अत एव हि भ्रष्टविधिर् अपि मन्त्र एतन्न्यासात् पूर्णो भवति साञ्जनो ऽपि गारुडवैष्णवादिर् निरञ्जनताम् एत्य मोक्षप्रदो भवति
    iast: |-
      ata eva hi bhraṣṭavidhir api mantra etannyāsāt pūrṇo bhavati sāñjano 'pi gāruḍavaiṣṇavādir nirañjanatām etya mokṣaprado bhavati
  - verse_num: 9
    section_type: prose
    prose_block_ref: "ah13.b9"
    devanagari: |-
      देहन्यासानन्तरम् अर्घपात्रे अयम् एव न्यासः
    iast: |-
      dehanyāsānantaram arghapātre ayam eva nyāsaḥ
  - verse_num: 10
    section_type: prose
    prose_block_ref: "ah13.b10"
    devanagari: |-
      इह हि क्रियाकारकाणां परमेश्वराभेदप्रतिपत्तिदार्ढ्यसिद्धये पूजाक्रिया उदाहरणीकृता तत्र च सर्वकारकाणाम् इत्थं परमेश्वरीभावः तत्र यष्ट्राधारस्य स्थानशुद्ध्यापादानकरणयोर् अर्घपात्रशुद्धिन्यासाभ्याम् यष्टुर् देहन्यासात् याज्यस्य स्थण्डिलादिन्यासात्
    iast: |-
      iha hi kriyākārakāṇāṃ parameśvarābhedapratipattidārḍhyasiddhaye pūjākriyā udāharaṇīkṛtā tatra ca sarvakārakāṇām itthaṃ parameśvarībhāvaḥ tatra yaṣṭrādhārasya sthānaśuddhyāpādānakaraṇayor arghapātraśuddhinyāsābhyām yaṣṭur dehanyāsāt yājyasya sthaṇḍilādinyāsāt
  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah13.b11"
    devanagari: |-
      एवं क्रियाक्रमेणापि परमेश्वरीकृतसमस्तकारकः तयैव दृशा सर्वक्रियाः पश्यन् विनापि प्रमुखज्ञानयोगाभ्यां परमेश्वर एव भवति
    iast: |-
      evaṃ kriyākrameṇāpi parameśvarīkṛtasamastakārakaḥ tayaiva dṛśā sarvakriyāḥ paśyan vināpi pramukhajñānayogābhyāṃ parameśvara eva bhavati
  - verse_num: 12
    section_type: prose
    prose_block_ref: "ah13.b12"
    devanagari: |-
      एवम् अर्घपात्रे न्यस्य पुष्पधूपाद्यैः पूजयित्वा तद्विप्रुड्भिर् यागसारं पुष्पादि च प्रोक्षयेत्
    iast: |-
      evam arghapātre nyasya puṣpadhūpādyaiḥ pūjayitvā tadvipruḍbhir yāgasāraṃ puṣpādi ca prokṣayet
  - verse_num: 13
    section_type: prose
    prose_block_ref: "ah13.b13"
    devanagari: |-
      ततः प्रभामण्डले भूमौ खे वा ॐ बाह्यपरिवाराय नम इति पूजयेत्
    iast: |-
      tataḥ prabhāmaṇḍale bhūmau khe vā oṃ bāhyaparivārāya nama iti pūjayet
  - verse_num: 14
    section_type: prose
    prose_block_ref: "ah13.b14"
    devanagari: |-
      ततो द्वारस्थाने ॐ द्वारदेवताचक्राय नम इति पूजयेत्
    iast: |-
      tato dvārasthāne oṃ dvāradevatācakrāya nama iti pūjayet
  - verse_num: 15
    section_type: prose
    prose_block_ref: "ah13.b15"
    devanagari: |-
      अगुप्ते तु बहिःस्थाने सति प्रविश्य मण्डलस्थण्डिलाग्र एव बाह्यपरिवारद्वारदेवताचक्रपूजां पूर्वोक्तं च न्यासादि कुर्यात् न बहिः
    iast: |-
      agupte tu bahiḥsthāne sati praviśya maṇḍalasthaṇḍilāgra eva bāhyaparivāradvāradevatācakrapūjāṃ pūrvoktaṃ ca nyāsādi kuryāt na bahiḥ
  - verse_num: 16
    section_type: prose
    prose_block_ref: "ah13.b16"
    devanagari: |-
      ततो ऽपि फट् फट् फट् इति अस्त्रजप्तपुष्पं प्रक्षिप्य विघ्नान् अपसारितान् ध्यात्वा अन्तः प्रविश्य परमेश्वरकिरणेद्धया दृष्ट्या अभितो यागगृहं पश्येत्
    iast: |-
      tato 'pi phaṭ phaṭ phaṭ iti astrajaptapuṣpaṃ prakṣipya vighnān apasāritān dhyātvā antaḥ praviśya parameśvarakiraṇeddhayā dṛṣṭyā abhito yāgagṛhaṃ paśyet
  - verse_num: 17
    section_type: prose
    prose_block_ref: "ah13.b17"
    devanagari: |-
      तत्र मुमुक्षुर् उत्तराभिमुखस् तिष्ठेत् यथा भगवदघोरतेजसा झटित्य् एव प्रुष्टपाशो भवेत्
    iast: |-
      tatra mumukṣur uttarābhimukhas tiṣṭhet yathā bhagavadaghoratejasā jhaṭity eva pruṣṭapāśo bhavet
  - verse_num: 18
    section_type: prose
    prose_block_ref: "ah13.b18"
    devanagari: |-
      तत्र परमेश्वरस्वातन्त्र्यम् एव मूर्त्याभासनया दिक्तत्त्वम् अवभासयति
    iast: |-
      tatra parameśvarasvātantryam eva mūrtyābhāsanayā diktattvam avabhāsayati
  - verse_num: 19
    section_type: prose
    prose_block_ref: "ah13.b19"
    devanagari: |-
      तत्र चित्प्रकाश एव मध्यं तत इतरप्रविभागप्रवृत्तेः प्रकाशस्वीकार्यम् ऊर्ध्वम् अतथाभूतम् अधः प्रकाशनसम्मुखीनं पूर्वम् इतरत् अपरम् सम्मुखीभूतप्रकाशत्वात् अनन्तरं तत्प्रकाशधारारोहस्थानं दक्षिणम् आनुकूल्यात् तत्सम्मुखं तु अवभास्यत्वात् उत्तरम् इति दिक्चतुष्कम्
    iast: |-
      tatra citprakāśa eva madhyaṃ tata itarapravibhāgapravṛtteḥ prakāśasvīkāryam ūrdhvam atathābhūtam adhaḥ prakāśanasammukhīnaṃ pūrvam itarat aparam sammukhībhūtaprakāśatvāt anantaraṃ tatprakāśadhārārohasthānaṃ dakṣiṇam ānukūlyāt tatsammukhaṃ tu avabhāsyatvāt uttaram iti dikcatuṣkam
  - verse_num: 20
    section_type: prose
    prose_block_ref: "ah13.b20"
    devanagari: |-
      तत्र मध्ये भगवान् ऊर्ध्वे ऽस्य ऐशानं वक्त्रम् अधः पातालवक्त्रम् पूर्वादिदिक्चतुष्के श्रीतत्पुरुषाघोरसद्योवामाख्यं दिक्चतुष्कमध्ये अन्याश् चतस्रः
    iast: |-
      tatra madhye bhagavān ūrdhve 'sya aiśānaṃ vaktram adhaḥ pātālavaktram pūrvādidikcatuṣke śrītatpuruṣāghorasadyovāmākhyaṃ dikcatuṣkamadhye anyāś catasraḥ
  - verse_num: 21
    section_type: prose
    prose_block_ref: "ah13.b21"
    devanagari: |-
