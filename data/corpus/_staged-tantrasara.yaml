    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "Now, this entire course of space, born from the power that makes manifest the diversity of forms, comes to rest in consciousness. By way of that, the whole path stands fully established — in the void, in the intellect, in the vital breath, in the channels, wheels, and subsidiary wheels, outwardly in the body, and as far as the liṅga, the sacrificial ground, the image, and the like. Dissolving that entire path into the body, the body into the breath, that into the intellect, that into the void, and that into the consciousness thereof, one becomes the wholly full and perfect consciousness, a knower of the true nature of the thirty-six principles. Seeing the consciousness that transcends them, whose form is Supreme Śiva, one should experience it as comprising the universe as well. Otherwise one would grasp some mere portion of the knowable as the highest — such as a presiding agent contained within Māyā, or Viṣṇu, Brahmā, and the like. Therefore one must without fail become devoted to the knowledge of the cosmic procedure."
      ai_assisted: true
      status: draft
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
