seo:
  descriptions:
    en: "Tantrasāra: Abhinavagupta's prose digest of his Tantrāloka, the doctrinal and ritual summa of Trika Kashmir Śaivism across 22 āhnikas."
    hi: "तन्त्रसार: अभिनवगुप्त द्वारा अपने तन्त्रालोक का गद्य सार-संग्रह; २२ आह्निकों में त्रिक काश्मीर शैव की सैद्धान्तिक एवं अनुष्ठानिक सम्पूर्णता।"
    mr: "तन्त्रसार: अभिनवगुप्तांनी आपल्या तन्त्रालोकाचा केलेला गद्य सारसंग्रह; २२ आह्निकांत त्रिक काश्मीर शैवाची सैद्धान्तिक व अनुष्ठानिक संपूर्णता."
    bn: "তন্ত্রসার: অভিনবগুপ্ত-রচিত তাঁর তন্ত্রালোকের গদ্য সারসংগ্রহ; ২২ আহ্নিকে ত্রিক কাশ্মীর শৈবের তাত্ত্বিক ও আনুষ্ঠানিক সম্পূর্ণতা."
    as: "তন্ত্ৰসাৰ: অভিনৱগুপ্তই নিজৰ তন্ত্ৰালোকৰ ৰচনা কৰা গদ্য সাৰসংগ্ৰহ; ২২ আহ্নিকত ত্ৰিক কাশ্মীৰ শৈৱৰ তাত্ত্বিক আৰু আনুষ্ঠানিক সম্পূৰ্ণতা."
    gu: "તંત્રસાર: અભિનવગુપ્ત રચિત તેમના તંત્રાલોકનો ગદ્ય સારસંગ્રહ; ૨૨ આહ્નિકોમાં ત્રિક કાશ્મીર શૈવની સૈદ્ધાંતિક અને અનુષ્ઠાનિક પૂર્ણતા."
    pa: "ਤੰਤ੍ਰਸਾਰ: ਅਭਿਨਵਗੁਪਤ ਦੁਆਰਾ ਆਪਣੇ ਤੰਤ੍ਰਾਲੋਕ ਦਾ ਗੱਦ ਸਾਰਸੰਗ੍ਰਹ; ੨੨ ਆਹਨਿਕਾਂ ਵਿੱਚ ਤ੍ਰਿਕ ਕਾਸ਼ਮੀਰ ਸ਼ੈਵ ਦੀ ਸਿਧਾਂਤਕ ਤੇ ਅਨੁਸ਼ਠਾਨਕ ਪੂਰਨਤਾ।"
    kn: "ತಂತ್ರಸಾರ: ಅಭಿನವಗುಪ್ತರು ತಮ್ಮ ತಂತ್ರಾಲೋಕದ ಗದ್ಯ ಸಾರಸಂಗ್ರಹ; ೨೨ ಆಹ್ನಿಕಗಳಲ್ಲಿ ತ್ರಿಕ ಕಾಶ್ಮೀರ ಶೈವದ ಸೈದ್ಧಾಂತಿಕ ಮತ್ತು ಅನುಷ್ಠಾನಿಕ ಸಂಪೂರ್ಣತೆ."
    ml: "തന്ത്രസാരം: അഭിനവഗുപ്തന്റെ തന്ത്രാലോകത്തിന്റെ ഗദ്യ സംഗ്രഹം; 22 ആഹ്നികങ്ങളിൽ ത്രിക കാശ്മീര ശൈവത്തിന്റെ സൈദ്ധാന്തിക, അനുഷ്ഠാന സമ്പൂർണ്ണത."
    or: "ତନ୍ତ୍ରସାର: ଅଭିନବଗୁପ୍ତଙ୍କ ତନ୍ତ୍ରାଲୋକର ଗଦ୍ୟ ସାରସଂଗ୍ରହ; ୨୨ ଆହ୍ନିକରେ ତ୍ରିକ କାଶ୍ମୀର ଶୈବର ସୈଦ୍ଧାନ୍ତିକ ଓ ଅନୁଷ୍ଠାନିକ ସମ୍ପୂର୍ଣ୍ଣତା."
    ta: "தந்த்ரசாரம்: அபிநவகுப்தர் தம் தந்த்ராலோகத்தின் உரைநடைச் சுருக்கம்; 22 ஆஹ்னிகங்களில் திரிக காஷ்மீர சைவத்தின் கோட்பாட்டு மற்றும் சடங்கு முழுமை."
    te: "తంత్రసార: అభినవగుప్తుని తంత్రాలోకపు గద్య సారసంగ్రహం; 22 ఆహ్నికాలలో త్రిక కశ్మీర శైవం యొక్క సైద్ధాంతిక మరియు అనుష్ఠాన సంపూర్ణత."
