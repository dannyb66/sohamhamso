  - verse_num: 11
    section_type: prose
    prose_block_ref: "ah11.b11"
    devanagari: |-
      एवं यियासुः गुरोः ज्ञानलक्षणां दीक्षां प्राप्नोति यया सद्य एव मुक्तो भवति जीवन्न् अपि अत्र अवलोकनात् कथनात् शास्त्रसम्बोधनात् चर्यादर्शनात् चरुदानात् इत्यादयो भेदाः
    iast: |-
