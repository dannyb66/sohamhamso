    iast: |-
      yathā yathā ca svacchāyā laṅghayitum iṣṭā satī puraḥ puro bhavati tathā parameśvaramadhyatām eti sarvādhiṣṭhātṛtaiva mādhyasthyam ity uktam
  - verse_num: 23
    section_type: prose
    prose_block_ref: "ah13.b23"
    devanagari: |-
