    iast: |-
      khecarīyaṃ khasañcāramsthitibhyāṃ khāmṛtāśanāt
  - verse_num: 39
    section_type: prose
    prose_block_ref: "ah13.b39"
    devanagari: |-
      एवम् अन्तर्यागमात्राद् एव वस्तुतः कृतकृत्यता
    iast: |-
      evam antaryāgamātrād eva vastutaḥ kṛtakṛtyatā
  - verse_num: 40
    section_type: prose
    prose_block_ref: "ah13.b40"
    devanagari: |-
      सत्यतः तदाविष्टस्य तथापि बहिर् अपि कार्यो यागो ऽवच्छेदहानय एव यो ऽपि तथा समावेशभाक् न भवति तस्य मुख्यो बहिर्यागः तदभ्यासात् समावेशलाभो यतस् तस्यापि तु पशुतातिरोधानायान्तर्यागः तदरूढाव् अपि तत्सङ्कल्पबलस्य शुद्धिप्रदत्वात्
    iast: |-
      satyataḥ tadāviṣṭasya tathāpi bahir api kāryo yāgo 'vacchedahānaya eva yo 'pi tathā samāveśabhāk na bhavati tasya mukhyo bahiryāgaḥ tadabhyāsāt samāveśalābho yatas tasyāpi tu paśutātirodhānāyāntaryāgaḥ tadarūḍhāv api tatsaṅkalpabalasya śuddhipradatvāt
  - verse_num: 41
    section_type: prose
    prose_block_ref: "ah13.b41"
    devanagari: |-
      अथ यदा दीक्षां चिकीर्षेत् तदाधिवासनार्थं भूमिपरिग्रहं गणेशार्चनं कुम्भकलशयोः पूजां स्थण्डिलार्चनं हवनं च कुर्यात्
    iast: |-
      atha yadā dīkṣāṃ cikīrṣet tadādhivāsanārthaṃ bhūmiparigrahaṃ gaṇeśārcanaṃ kumbhakalaśayoḥ pūjāṃ sthaṇḍilārcanaṃ havanaṃ ca kuryāt
  - verse_num: 42
    section_type: prose
    prose_block_ref: "ah13.b42"
    devanagari: |-
