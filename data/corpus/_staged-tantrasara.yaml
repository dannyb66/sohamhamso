    iast: |-
      tāvat hi tad ataraṅgaṃ bhairavavapuḥ yat svātmani avabhāsitasṛṣṭisaṃhārāvaicitryakoṭi
  - verse_num: 32
    section_type: prose
    prose_block_ref: "ah13.b32"
    devanagari: |-
