    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "Here, then, one's own essential nature alone is the supreme thing to be embraced; and that is precisely the nature-of-Light of all entities, since being-an-essential-nature cannot belong to what is non-luminous. And it is not manifold, for were any nature other than Light to enter in, there would be no luminosity in it; hence there is no difference of natures. Space and time too are not differentiators of it, since they themselves have that Light for their nature. Thus there is one single Light, and that same Light is Awareness — for Awareness is of the form of the manifesting of objects; on this there is simply no dispute among anyone. And that Light is not dependent on another, for dependence is just being-an-object-to-be-illumined, and being-such-an-object requires some other light, yet there exists no other light at all. Therefore the one Light is autonomous; and by reason of that very autonomy, being free of any delimitation by space, time, or form, it is all-pervading, eternal, of a nature both all-formed and formless. And its autonomy is the power of bliss; the wonder of that bliss is the power of will; its being-of-the-form-of-Light is the power of consciousness; its character as reflective awareness is the power of knowledge; its connection with all forms is the power of action. Thus, though it is endowed with these principal powers, in reality it is the undelimited Light endowed with the powers of will, knowledge, and action, reposing in its own bliss, having the form of Śiva. That same Light, out of its autonomy, making the Self appear in a contracted form, is called the bound soul (aṇu). And again it manifests its own Self in its autonomous fashion, whereby it shines forth precisely as Śiva, the undelimited Light. There too, by force of its autonomy, it manifests its own Self either by the means-less path or by a path with a means; and even where there is a means, the expedient is either will, or knowledge, or action — hence the immersion is threefold, by the division into the Śāmbhava, Śākta, and Āṇava. So all four of these forms are taught here in due order. This Self, Śiva, whose body is Light, autonomous — having, in the exuberant play of his autonomy, veiled his own nature, and then once more unfolding it in fullness: that too proceeds by way of succession or non-succession, or else through the threefold division."
      ai_assisted: true
      status: draft
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
