    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-NC
      text: "Here knowledge is the cause of liberation, because it is the opponent of ignorance, which is the occasion of bondage. And ignorance is twofold: intellectual and personal. Of these, the intellectual is of the nature of non-ascertainment or of erroneous ascertainment; the personal, however, has the nature of conceptual construct and consists of a contracted manifestation — and this very thing is the root cause of transmigration, as we shall explain in the section on the taints. Now the personal ignorance may indeed be removed by initiation and the like; yet even initiation is not possible while intellectual ignorance, consisting of non-determination, persists — for the initiation whose form is the purification of the principles and union with Śiva is preceded by the ascertainment of what is to be rejected and what is to be accepted. Therefore the knowledge that consists of determinate ascertainment and is grounded in the intellect is primary; and this very knowledge, when cultivated, destroys even the personal ignorance, since the repeated practice of conceptual awareness culminates in non-conceptuality. For the Self, whose form is the light of an awareness uncontracted by concepts, has Śiva for its essential nature; thus in every way the knowledge that is grounded in all things and consists of right ascertainment is to be embraced. And that is founded upon scripture. And scripture, namely that which is spoken by the Supreme Lord, is alone the authority. Because the meanings stated in the lower scriptures are admitted there in a separate (qualified) way, and because what exceeds those meanings is established there by reasoning, the knowledge stated in a lower scripture liberates only from that much bondage, not from all. But the scripture of the Supreme Lord, consisting of the five streams and divided into ten, eighteen, and the eightfold of the Vasus, liberates from all. And the essence of all of these is the Trika scriptures; and the essence of even those is the Mālinīvijaya. The meaning contained within it cannot be set forth all gathered together at once. Nor does one whose reality has not been set forth attain liberation or become a liberator, since it is pure knowledge alone that has such a character. Because the highest human goal is rooted in well-practiced knowledge, this work is begun for its accomplishment. Ignorance, it is said, is declared in scripture to be the cause of bondage; that is remembered as the taint. At the dawning of the ray of perfect knowledge, that taint in its entirety goes to utter rootlessness; and liberation is the arising of Self-awareness with every taint destroyed. By means of this scripture, then, I shall make manifest the whole of the reality that is to be known."
      ai_assisted: true
      status: draft
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
