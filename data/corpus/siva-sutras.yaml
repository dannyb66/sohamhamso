text:
  id: siva-sutras
  slug: siva-sutras
  title_sa: शिवसूत्राणि
  title_en: Śiva Sūtras
  title_iast: Śivasūtrāṇi
  author: Vasugupta
  tradition: trika
  school: kashmir-shaivism
  era: "9th century CE"
  source: "GRETIL (Göttingen Register of Electronic Texts in Indian Languages)"
  source_url: "https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/6_sastra/3_phil/saiva/sivasutu.htm"
  source_revision: "GRETIL revision pending"
  license: CC-BY 4.0
  parent_text_id: null
  manuscript_url: null
  description: |
    The Śiva Sūtras are the foundational sūtras of the Trika school of Kashmir
    Shaivism, revealed to Vasugupta in the 9th century. Structured in three
    sections corresponding to the three means (upāyas) of liberation:
    Śāmbhavopāya, Śāktopāya, and Āṇavopāya.

chapters:
  - chapter: 1
    title_sa: शाम्भवोपायः
    title_iast: Śāmbhavopāyaḥ
    title_en: "Śāmbhavopāya — The Way of Śiva"
    verses:
      - verse: 1
        devanagari: चैतन्यमात्मा ॥१॥
        slp1: "caitanyamAtmA"
        iast: "caitanyam ātmā"
        meter: sūtra
        word_glosses:
          - word: caitanyam
            iast: caitanyam
            gloss_en: "pure consciousness, sentience"
            morph: "nom. sg. n."
          - word: ātmā
            iast: ātmā
            gloss_en: "the Self, true nature"
            morph: "nom. sg. m."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Consciousness is the Self."
            ai_assisted: false
            status: published

      - verse: 2
        devanagari: ज्ञानं बन्धः ॥२॥
        slp1: "jYAnaM banDaH"
        iast: "jñānaṃ bandhaḥ"
        meter: sūtra
        word_glosses:
          - word: jñānam
            iast: jñānam
            gloss_en: "(limited, dualistic) knowledge"
            morph: "nom. sg. n."
          - word: bandhaḥ
            iast: bandhaḥ
            gloss_en: "bondage"
            morph: "nom. sg. m."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "(Limited) knowledge is bondage."
            ai_assisted: false
            status: published

      - verse: 3
        devanagari: योनिवर्गः कलाशरीरम् ॥३॥
        slp1: "yonivargaH kalASarIram"
        iast: "yonivargaḥ kalāśarīram"
        meter: sūtra
        word_glosses:
          - word: yoni-vargaḥ
            iast: yoni-vargaḥ
            gloss_en: "the group/source of categories (māyā as womb of phenomena)"
            morph: "nom. sg. m., tatpuruṣa cpd."
          - word: kalā-śarīram
            iast: kalā-śarīram
            gloss_en: "the body composed of kalās (limiting phases of activity)"
            morph: "nom. sg. n., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The source-group (māyā) and the body of kalās (are also bondage)."
            ai_assisted: false
            status: published

      - verse: 4
        devanagari: ज्ञानाधिष्ठानं मातृका ॥४॥
        slp1: "jYAnADizWAnaM mAtRkA"
        iast: "jñānādhiṣṭhānaṃ mātṛkā"
        meter: sūtra
        word_glosses:
          - word: jñāna-adhiṣṭhānam
            iast: jñāna-adhiṣṭhānam
            gloss_en: "the basis/substratum of (limited) knowledge"
            morph: "nom. sg. n., tatpuruṣa cpd."
          - word: mātṛkā
            iast: mātṛkā
            gloss_en: "the (un-understood) Mother — the matrix of phonemes/letters"
            morph: "nom. sg. f."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The basis of (bound) knowledge is Mātṛkā (the un-understood matrix of phonemes)."
            ai_assisted: false
            status: published

      - verse: 5
        devanagari: उद्यमो भैरवः ॥५॥
        slp1: "udyamo BairavaH"
        iast: "udyamo bhairavaḥ"
        meter: sūtra
        word_glosses:
          - word: udyamaḥ
            iast: udyamaḥ
            gloss_en: "sudden rising/emergence (of awareness)"
            morph: "nom. sg. m."
          - word: bhairavaḥ
            iast: bhairavaḥ
            gloss_en: "Bhairava, the absolute Śiva"
            morph: "nom. sg. m."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The sudden upsurge (of pure awareness) is Bhairava."
            ai_assisted: false
            status: published

      - verse: 6
        devanagari: शक्तिचक्रसन्धाने विश्वसंहारः ॥६॥
        slp1: "SakticakrasanDAne viSvasaMhAraH"
        iast: "śakticakra-sandhāne viśva-saṃhāraḥ"
        meter: sūtra
        word_glosses:
          - word: śakti-cakra-sandhāne
            iast: śakti-cakra-sandhāne
            gloss_en: "in uniting with the wheel of (cognitive) powers"
            morph: "loc. sg. n., tatpuruṣa cpd."
          - word: viśva-saṃhāraḥ
            iast: viśva-saṃhāraḥ
            gloss_en: "dissolution of the universe (as separate)"
            morph: "nom. sg. m., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Through union with the wheel of śaktis, the (objective) universe is dissolved."
            ai_assisted: false
            status: published

      - verse: 7
        devanagari: जाग्रत्स्वप्नसुषुप्तभेदे तुर्याभोगसम्भवः ॥७॥
        slp1: "jAgratsvapnasuzuptaBede turyABogasamBavaH"
        iast: "jāgrat-svapna-suṣupta-bhede turyābhoga-sambhavaḥ"
        meter: sūtra
        word_glosses:
          - word: jāgrat-svapna-suṣupta-bhede
            iast: jāgrat-svapna-suṣupta-bhede
            gloss_en: "in the differentiation of waking, dreaming, and deep sleep"
            morph: "loc. sg. m., dvandva+tatpuruṣa"
          - word: turya-ābhoga-sambhavaḥ
            iast: turya-ābhoga-sambhavaḥ
            gloss_en: "arising of the enjoyment/expansion of the Fourth"
            morph: "nom. sg. m., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "(For the yogin) even amid the differences of waking, dream, and deep sleep, the bliss of the Fourth state arises."
            ai_assisted: false
            status: published

      - verse: 8
        devanagari: ज्ञानं जाग्रत् ॥८॥
        slp1: "jYAnaM jAgrat"
        iast: "jñānaṃ jāgrat"
        meter: sūtra
        word_glosses:
          - word: jñānam
            iast: jñānam
            gloss_en: "(empirical) knowledge"
            morph: "nom. sg. n."
          - word: jāgrat
            iast: jāgrat
            gloss_en: "the waking state"
            morph: "nom. sg. n., pres. part."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Empirical knowledge is the waking state."
            ai_assisted: false
            status: published

      - verse: 9
        devanagari: स्वप्नो विकल्पाः ॥९॥
        slp1: "svapno vikalpAH"
        iast: "svapno vikalpāḥ"
        meter: sūtra
        word_glosses:
          - word: svapnaḥ
            iast: svapnaḥ
            gloss_en: "the dream state"
            morph: "nom. sg. m."
          - word: vikalpāḥ
            iast: vikalpāḥ
            gloss_en: "mental constructs, conceptualizations"
            morph: "nom. pl. m."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Dream is (the play of) mental constructs."
            ai_assisted: false
            status: published

      - verse: 10
        devanagari: अविवेको मायासौषुप्तम् ॥१०॥
        slp1: "aviveko mAyAsauzuptam"
        iast: "aviveko māyāsauṣuptam"
        meter: sūtra
        word_glosses:
          - word: avivekaḥ
            iast: avivekaḥ
            gloss_en: "non-discrimination, lack of discernment"
            morph: "nom. sg. m."
          - word: māyā-sauṣuptam
            iast: māyā-sauṣuptam
            gloss_en: "the deep-sleep of māyā (illusion-induced unconsciousness)"
            morph: "nom. sg. n., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Non-discrimination is the deep sleep of māyā."
            ai_assisted: false
            status: published

      - verse: 11
        devanagari: त्रितयभोक्ता वीरेशः ॥११॥
        slp1: "tritayaBoktA vIreSaH"
        iast: "tritaya-bhoktā vīreśaḥ"
        meter: sūtra
        word_glosses:
          - word: tritaya-bhoktā
            iast: tritaya-bhoktā
            gloss_en: "enjoyer of the triad (of waking, dream, deep sleep)"
            morph: "nom. sg. m., tatpuruṣa cpd."
          - word: vīra-īśaḥ
            iast: vīra-īśaḥ
            gloss_en: "lord of the (sense-)heroes, master of the indriyas"
            morph: "nom. sg. m., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "(He who is) the enjoyer of the triad (of states) is the lord of the (sense-)heroes."
            ai_assisted: false
            status: published

      - verse: 12
        devanagari: विस्मयो योगभूमिकाः ॥१२॥
        slp1: "vismayo yogaBUmikAH"
        iast: "vismayo yoga-bhūmikāḥ"
        meter: sūtra
        word_glosses:
          - word: vismayaḥ
            iast: vismayaḥ
            gloss_en: "wonder, amazement"
            morph: "nom. sg. m."
          - word: yoga-bhūmikāḥ
            iast: yoga-bhūmikāḥ
            gloss_en: "the stages of yoga"
            morph: "nom. pl. f., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The stages of yoga are (states of) wonder."
            ai_assisted: false
            status: published

      - verse: 13
        devanagari: इच्छाशक्तिरुमा कुमारी ॥१३॥
        slp1: "icCASaktirumA kumArI"
        iast: "icchāśaktir umā kumārī"
        meter: sūtra
        word_glosses:
          - word: icchā-śaktiḥ
            iast: icchā-śaktiḥ
            gloss_en: "the power of will"
            morph: "nom. sg. f., tatpuruṣa cpd."
          - word: umā
            iast: umā
            gloss_en: "Umā (the goddess; here, supreme volition)"
            morph: "nom. sg. f."
          - word: kumārī
            iast: kumārī
            gloss_en: "the virgin maiden (unmodified, free of secondary aims)"
            morph: "nom. sg. f."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The Will-power (of the yogin) is Umā, the Virgin."
            ai_assisted: false
            status: published

      - verse: 14
        devanagari: दृश्यं शरीरम् ॥१४॥
        slp1: "dRSyaM SarIram"
        iast: "dṛśyaṃ śarīram"
        meter: sūtra
        word_glosses:
          - word: dṛśyam
            iast: dṛśyam
            gloss_en: "the (whole) visible/perceivable"
            morph: "nom. sg. n., fut. pass. part."
          - word: śarīram
            iast: śarīram
            gloss_en: "(his) body"
            morph: "nom. sg. n."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The whole of the perceivable (universe) is (his) body."
            ai_assisted: false
            status: published

      - verse: 15
        devanagari: हृदये चित्तसङ्घट्टाद्दृश्यस्वापदर्शनम् ॥१५॥
        slp1: "hRdaye cittasaNGawwAddRSyasvApadarSanam"
        iast: "hṛdaye citta-saṅghaṭṭād dṛśya-svāpa-darśanam"
        meter: sūtra
        word_glosses:
          - word: hṛdaye
            iast: hṛdaye
            gloss_en: "in the Heart (the core of consciousness)"
            morph: "loc. sg. n."
          - word: citta-saṅghaṭṭāt
            iast: citta-saṅghaṭṭāt
            gloss_en: "from the fusion/concentration of mind"
            morph: "abl. sg. m., tatpuruṣa cpd."
          - word: dṛśya-svāpa-darśanam
            iast: dṛśya-svāpa-darśanam
            gloss_en: "vision of the disappearance of the perceivable"
            morph: "nom. sg. n., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "By fixing the mind on the Heart, the vision of the (whole) perceivable as if asleep arises."
            ai_assisted: false
            status: published

      - verse: 16
        devanagari: शुद्धतत्त्वसन्धानाद्वापशुशक्तिः ॥१६॥
        slp1: "SudDatattvasanDAnAdvApaSuSaktiH"
        iast: "śuddha-tattva-sandhānād vā apaśu-śaktiḥ"
        meter: sūtra
        word_glosses:
          - word: śuddha-tattva-sandhānāt
            iast: śuddha-tattva-sandhānāt
            gloss_en: "from (continuous) union with the pure Principle"
            morph: "abl. sg. n., tatpuruṣa cpd."
          - word: vā
            iast: vā
            gloss_en: "or (alternatively)"
            morph: "indecl."
          - word: apaśu-śaktiḥ
            iast: apaśu-śaktiḥ
            gloss_en: "the power that frees from the state of paśu (bound creature)"
            morph: "nom. sg. f., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Or, by union with the pure Principle, one acquires the power that liberates from being a bound creature."
            ai_assisted: false
            status: published

      - verse: 17
        devanagari: वितर्क आत्मज्ञानम् ॥१७॥
        slp1: "vitarka AtmajYAnam"
        iast: "vitarka ātmajñānam"
        meter: sūtra
        word_glosses:
          - word: vitarkaḥ
            iast: vitarkaḥ
            gloss_en: "(firm) recognitive cognition, reflective certainty"
            morph: "nom. sg. m."
          - word: ātma-jñānam
            iast: ātma-jñānam
            gloss_en: "knowledge of the Self"
            morph: "nom. sg. n., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Right awareness (vitarka) is knowledge of the Self."
            ai_assisted: false
            status: published

      - verse: 18
        devanagari: लोकानन्दः समाधिसुखम् ॥१८॥
        slp1: "lokAnandaH samADisuKam"
        iast: "lokānandaḥ samādhi-sukham"
        meter: sūtra
        word_glosses:
          - word: loka-ānandaḥ
            iast: loka-ānandaḥ
            gloss_en: "bliss of (perceiving) the world"
            morph: "nom. sg. m., tatpuruṣa cpd."
          - word: samādhi-sukham
            iast: samādhi-sukham
            gloss_en: "the joy of samādhi"
            morph: "nom. sg. n., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "The bliss of (witnessing) the world is the joy of samādhi."
            ai_assisted: false
            status: published

      - verse: 19
        devanagari: शक्तिसन्धाने शरीरोत्पत्तिः ॥१९॥
        slp1: "SaktisanDAne SarIrotpattiH"
        iast: "śakti-sandhāne śarīrotpattiḥ"
        meter: sūtra
        word_glosses:
          - word: śakti-sandhāne
            iast: śakti-sandhāne
            gloss_en: "in union with (the divine) Śakti"
            morph: "loc. sg. n., tatpuruṣa cpd."
          - word: śarīra-utpattiḥ
            iast: śarīra-utpattiḥ
            gloss_en: "production of (any desired) body"
            morph: "nom. sg. f., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "By union with Śakti, (the yogin can effect) the production of (any) body (he wills)."
            ai_assisted: false
            status: published

      - verse: 20
        devanagari: भूतसन्धानभूतपृथक्त्वविश्वसङ्घट्टाः ॥२०॥
        slp1: "BUtasanDAnaBUtapRTaktvaviSvasaNGawwAH"
        iast: "bhūta-sandhāna-bhūta-pṛthaktva-viśva-saṅghaṭṭāḥ"
        meter: sūtra
        word_glosses:
          - word: bhūta-sandhāna
            iast: bhūta-sandhāna
            gloss_en: "joining (separated) elements/beings"
            morph: "n., tatpuruṣa cpd. (stem)"
          - word: bhūta-pṛthaktva
            iast: bhūta-pṛthaktva
            gloss_en: "separating (joined) elements/beings"
            morph: "n., tatpuruṣa cpd. (stem)"
          - word: viśva-saṅghaṭṭāḥ
            iast: viśva-saṅghaṭṭāḥ
            gloss_en: "and unifying the entire universe (with oneself)"
            morph: "nom. pl. m., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "(He acquires the powers of) joining elements, separating elements, and uniting the entire universe (with himself)."
            ai_assisted: false
            status: published

      - verse: 21
        devanagari: शुद्धविद्योदयाच्चक्रेशत्वसिद्धिः ॥२१॥
        slp1: "SudDavidyodayAccakreSatvasidDiH"
        iast: "śuddha-vidyodayāc cakreśatva-siddhiḥ"
        meter: sūtra
        word_glosses:
          - word: śuddha-vidyā-udayāt
            iast: śuddha-vidyā-udayāt
            gloss_en: "from the arising of Pure Wisdom (śuddhavidyā)"
            morph: "abl. sg. m., tatpuruṣa cpd."
          - word: cakra-īśatva-siddhiḥ
            iast: cakra-īśatva-siddhiḥ
            gloss_en: "attainment of lordship over the wheel (of śaktis)"
            morph: "nom. sg. f., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "By the arising of Pure Wisdom, mastery of the wheel of (śaktis) is attained."
            ai_assisted: false
            status: published

      - verse: 22
        devanagari: महाह्रदानुसन्धानान्मन्त्रवीर्यानुभवः ॥२२॥
        slp1: "mahAhradAnusanDAnAnmantravIryAnuBavaH"
        iast: "mahāhradānusandhānān mantra-vīryānubhavaḥ"
        meter: sūtra
        word_glosses:
          - word: mahā-hrada-anusandhānāt
            iast: mahā-hrada-anusandhānāt
            gloss_en: "from continuous union with the Great Lake (of supreme consciousness)"
            morph: "abl. sg. m., tatpuruṣa cpd."
          - word: mantra-vīrya-anubhavaḥ
            iast: mantra-vīrya-anubhavaḥ
            gloss_en: "experience of the potency of mantra"
            morph: "nom. sg. m., tatpuruṣa cpd."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "By continuous communion with the Great Lake (of supreme consciousness), one experiences the potency of mantra."
            ai_assisted: false
            status: published

  - chapter: 2
    title_sa: शाक्तोपायः
    title_iast: Śāktopāyaḥ
    title_en: "Śāktopāya — The Way of Śakti"
    verses:
      - verse: 1
        devanagari: चित्तं मन्त्रः ॥१॥
        slp1: "cittaM mantraH"
        iast: "cittaṃ mantraḥ"
        meter: sūtra
        word_glosses:
          - word: cittam
            iast: cittam
            gloss_en: "the mind (turned toward the highest reality)"
            morph: "nom. sg. n."
          - word: mantraḥ
            iast: mantraḥ
            gloss_en: "mantra"
            morph: "nom. sg. m."
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "(The yogin's) mind (intent on the supreme) is mantra."
