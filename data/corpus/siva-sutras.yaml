  description: |
    The Śiva Sūtras are the foundational sūtras of the Trika school of Kashmir
    Shaivism, revealed to Vasugupta in the 9th century. Structured in three
    sections corresponding to the three means (upāyas) of liberation:
    Śāmbhavopāya, Śāktopāya, and Āṇavopāya.

