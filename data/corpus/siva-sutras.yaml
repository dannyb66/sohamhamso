schema_version: 1

seo:
  descriptions:
    en: "Śiva Sūtras: 77 foundational sūtras of Trika Kashmir Śaivism revealed to Vasugupta (9th c. CE), mapping consciousness as Śiva."
    hi: "शिवसूत्र: वसुगुप्त को प्राप्त ७७ सूत्र, त्रिक काश्मीर शैवदर्शन का आधार-ग्रन्थ; चैतन्य को शिवरूप में प्रतिपादित करता है।"
    mr: "शिवसूत्रे: वसुगुप्तांना प्राप्त झालेली ७७ सूत्रे; काश्मीर शैव त्रिकदर्शनाचा मूळ ग्रंथ — चैतन्य हेच शिव."
    bn: "শিবসূত্র: বসুগুপ্তকে প্রাপ্ত ৭৭টি সূত্র, ত্রিক কাশ্মীর শৈবদর্শনের মূল গ্রন্থ; চৈতন্যকে শিবরূপে নির্দেশ করে।"
    as: "শিৱসূত্ৰ: বসুগুপ্তই লাভ কৰা ৭৭টা সূত্ৰ, ত্ৰিক কাশ্মীৰ শৈৱদৰ্শনৰ মূল গ্ৰন্থ; চৈতন্যকে শিৱৰূপে দেখুৱায়।"
    gu: "શિવસૂત્ર: વસુગુપ્તને પ્રાપ્ત ૭૭ સૂત્રો, ત્રિક કાશ્મીર શૈવદર્શનનો મૂળ ગ્રંથ; ચૈતન્યને શિવસ્વરૂપ રૂપે દર્શાવે છે."
    pa: "ਸ਼ਿਵਸੂਤ੍ਰ: ਵਸੁਗੁਪਤ ਨੂੰ ਪ੍ਰਾਪਤ ੭੭ ਸੂਤ੍ਰ, ਤ੍ਰਿਕ ਕਾਸ਼ਮੀਰ ਸ਼ੈਵ ਦਰਸ਼ਨ ਦਾ ਮੂਲ ਗ੍ਰੰਥ — ਚੈਤੰਨਯ ਹੀ ਸ਼ਿਵ ਹੈ।"
    kn: "ಶಿವಸೂತ್ರ: ವಸುಗುಪ್ತರಿಗೆ ಲಭಿಸಿದ ೭೭ ಸೂತ್ರಗಳು; ತ್ರಿಕ ಕಾಶ್ಮೀರ ಶೈವದರ್ಶನದ ಮೂಲಗ್ರಂಥ — ಚೈತನ್ಯವೇ ಶಿವ."
    ml: "ശിവസൂത്ര: വസുഗുപ്തന് ലഭിച്ച 77 സൂത്രങ്ങൾ; ത്രിക കാശ്മീര ശൈവദർശനത്തിന്റെ മൂലഗ്രന്ഥം — ചൈതന്യം തന്നെ ശിവം."
    or: "ଶିବସୂତ୍ର: ବସୁଗୁପ୍ତଙ୍କୁ ପ୍ରାପ୍ତ ୭୭ଟି ସୂତ୍ର; ତ୍ରିକ କାଶ୍ମୀର ଶୈବଦର୍ଶନର ମୂଳ ଗ୍ରନ୍ଥ — ଚୈତନ୍ୟ ହିଁ ଶିବ."
    ta: "சிவ சூத்திரம்: வசுகுப்தருக்கு வெளிப்பட்ட 77 சூத்திரங்கள்; திரிக காஷ்மீர சைவ தரிசனத்தின் அடிப்படை — சைதன்யமே சிவம்."
    te: "శివ సూత్రములు: వసుగుప్తునికి లభించిన 77 సూత్రములు; త్రిక కశ్మీర శైవదర్శనపు మూలగ్రంథం — చైతన్యమే శివుడు."
