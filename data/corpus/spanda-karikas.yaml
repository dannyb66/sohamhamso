text:
  id: spanda-karikas
  slug: spanda-karikas
  title_sa: स्पन्दकारिकाः
  title_en: Stanzas on the Divine Pulsation
  title_iast: Spandakārikāḥ
  author: "Bhaṭṭa Kallaṭa (attributed to Vasugupta)"
  tradition: trika
  school: kashmir-shaivism
  era: "9th century CE"
  source: "Muktabodha Indological Research Institute"
  source_url: "https://muktabodha.org"
  source_revision: pending
  license: PD
  parent_text_id:
  manuscript_url:
  description: |
    The Spandakārikās ("Stanzas on the Divine Pulsation") is one of the
    foundational texts of the Spanda branch of Kashmir Śaivism. Traditionally
    attributed in different lineages either to Vasugupta (the revealer of the
    Śivasūtras) or to his disciple Bhaṭṭa Kallaṭa (9th century CE), the work
    elaborates the doctrine of spanda — the ever-present subtle vibratory
    pulsation of Consciousness through which Śiva-śakti unfolds, sustains,
    and withdraws the universe. The text is divided into four niḥṣyandas
    ("outflows" or sections): Svarūpaspanda (the nature of spanda — 25 vv.),
    Sahajavidyodaya (arising of innate knowledge — 7 vv.),
    Vibhūtispanda (supernatural manifestations of spanda — 19 vv.), and a
    concluding epilogue (1 v.), totalling 52 verses.

chapters:
- chapter: 1
  title_sa: स्वरूपस्पन्दः
  title_iast: Svarūpaspanda
  title_en: The Nature of Spanda
