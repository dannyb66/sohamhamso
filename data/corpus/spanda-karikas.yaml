text:
  id: spanda-karikas
  slug: spanda-karikas
  title_sa: स्पन्दकारिकाः
  title_en: Stanzas on the Divine Pulsation
  title_iast: Spandakārikāḥ
  author: "Bhaṭṭa Kallaṭa (attributed to Vasugupta)"
  tradition: trika
  school: kashmir-shaivism
  era: "9th century CE"
  source: "Muktabodha Indological Research Institute"
  source_url: "https://muktabodha.org"
  source_revision: pending
  license: PD
  parent_text_id: null
  manuscript_url: null
  description: |
    The Spandakārikās ("Stanzas on the Divine Pulsation") is one of the
    foundational texts of the Spanda branch of Kashmir Śaivism. Traditionally
    attributed in different lineages either to Vasugupta (the revealer of the
    Śivasūtras) or to his disciple Bhaṭṭa Kallaṭa (9th century CE), the work
    elaborates the doctrine of spanda — the ever-present subtle vibratory
    pulsation of Consciousness through which Śiva-śakti unfolds, sustains,
    and withdraws the universe. The text is divided into four niḥṣyandas
    ("outflows" or sections): Svarūpaspanda (the nature of spanda — 25 vv.),
    Sahajavidyodaya (arising of innate knowledge — 7 vv.),
    Vibhūtispanda (supernatural manifestations of spanda — 19 vv.), and a
    concluding epilogue (1 v.), totalling 52 verses.

chapters:
  - chapter: 1
    title_sa: स्वरूपस्पन्दः
    title_iast: Svarūpaspanda
    title_en: The Nature of Spanda
    verses:
      - verse: 1
        devanagari: यस्योन्मेषनिमेषाभ्यां जगतः प्रलयोदयौ । तं शक्तिचक्रविभवप्रभवं शङ्करं स्तुमः ॥१॥
        slp1: "yasyonmezanimezAByAM jagataH pralayodayO . taM zakticakraviBavapraBavaM zaNkaraM stumaH"
        iast: "yasyonmeṣa-nimeṣābhyāṃ jagataḥ pralayodayau / taṃ śakti-cakra-vibhava-prabhavaṃ śaṅkaraṃ stumaḥ //"
        meter: anuṣṭubh
        word_glosses:
          - word: यस्य
            iast: yasya
            gloss_en: "of whom"
            morph: "m.gen.sg pron"
          - word: उन्मेषनिमेषाभ्याम्
            iast: unmeṣa-nimeṣābhyām
            gloss_en: "by opening and closing (of the eyes)"
            morph: "m.ins.du cpd"
          - word: जगतः
            iast: jagataḥ
            gloss_en: "of the world"
            morph: "n.gen.sg"
          - word: प्रलयोदयौ
            iast: pralaya-udayau
            gloss_en: "the dissolution and arising"
            morph: "m.nom.du cpd"
          - word: शक्तिचक्रविभवप्रभवम्
            iast: śakti-cakra-vibhava-prabhavam
            gloss_en: "the source of the glory of the wheel of powers"
            morph: "m.acc.sg cpd"
          - word: शङ्करम्
            iast: śaṅkaram
            gloss_en: "Śaṅkara (Śiva, the bestower of welfare)"
            morph: "m.acc.sg"
          - word: स्तुमः
            iast: stumaḥ
            gloss_en: "we praise"
            morph: "verb 1.pl.pres"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "We praise that Śaṅkara, the source of the glory of the wheel of powers, by whose opening and closing (of the eyes) the world is dissolved and arises."
            ai_assisted: false
            status: published

      - verse: 2
        devanagari: यत्र स्थितमिदं सर्वं कार्यं यस्माच्च निर्गतम् । तस्यानावृतरूपत्वान्न निरोधोऽस्ति कुत्रचित् ॥२॥
        slp1: "yatra sTitamidaM sarvaM kAryaM yasmAcca nirgatam . tasyAnAvftarUpatvAnna niroDo'sti kutracit"
        iast: "yatra sthitam idaṃ sarvaṃ kāryaṃ yasmāc ca nirgatam / tasyānāvṛta-rūpatvān na nirodho 'sti kutracit //"
        meter: anuṣṭubh
        word_glosses:
          - word: यत्र
            iast: yatra
            gloss_en: in whom
            morph: loc. rel.
          - word: स्थितम्
            iast: sthitam
            gloss_en: stands established
            morph: ppp. nom. sg. n.
          - word: इदं सर्वम्
            iast: idaṃ sarvam
            gloss_en: all this
            morph: nom. sg. n.
          - word: कार्यम्
            iast: kāryam
            gloss_en: effect, the to-be-done
            morph: nom. sg. n.
          - word: यस्मात्
            iast: yasmāt
            gloss_en: from whom
            morph: abl. rel.
          - word: च निर्गतम्
            iast: ca nirgatam
            gloss_en: and (everything) has issued forth
            morph: phrase
          - word: तस्य
            iast: tasya
            gloss_en: for him
            morph: gen. sg. m.
          - word: अनावृत-रूपत्वात्
            iast: anāvṛta-rūpatvāt
            gloss_en: owing to (his) uncovered nature
            morph: abl. sg. n. cpd.
          - word: न निरोधः अस्ति
            iast: na nirodhaḥ asti
            gloss_en: there is no obstruction
            morph: phrase
          - word: कुत्रचित्
            iast: kutracit
            gloss_en: anywhere
            morph: indef. adv.
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "That (Spanda principle) in which this whole world of effects rests and from which it issues forth — owing to its unveiled nature, can never be obstructed anywhere."
            ai_assisted: false
            status: published

      - verse: 3
        devanagari: जाग्रदादिविभेदेऽपि तदभिन्ने प्रसर्पति । निवर्तते निजान्नैव स्वभावादुपलब्धृतः ॥३॥
        slp1: "jAgradAdiviBede'pi tadaBinne prasarpati . nivartate nijAnnEva svaBAvAdupalabDftaH"
        iast: "jāgrad-ādi-vibhede 'pi tad-abhinne prasarpati / nivartate nijān naiva svabhāvād upalabdhṛtaḥ //"
        meter: anuṣṭubh
        word_glosses:
          - word: जाग्रदादिविभेदे
            iast: jāgrad-ādi-vibhede
            gloss_en: "in the differentiation of waking and the other states"
            morph: "m.loc.sg cpd"
          - word: तदभिन्ने
            iast: tad-abhinne
            gloss_en: "non-different from That"
            morph: "m.loc.sg cpd"
          - word: प्रसर्पति
            iast: prasarpati
            gloss_en: "though it spreads forth"
            morph: "verb 3.sg.pres"
          - word: निवर्तते
            iast: nivartate
            gloss_en: "departs, recedes"
            morph: "verb 3.sg.pres"
          - word: स्वभावात्
            iast: svabhāvāt
            gloss_en: "from its own nature"
            morph: "m.abl.sg"
          - word: उपलब्धृतः
            iast: upalabdhṛtaḥ
            gloss_en: "as the experiencer/perceiver"
            morph: "m.abl.sg"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Although it streams forth amid the differentiations of waking and the other states — non-different from itself — it never departs from its own nature as the Perceiver."
            ai_assisted: false
            status: published

      - verse: 4
        devanagari: अहं सुखी च दुःखी च रक्तश्चेत्यादिसंविदः । सुखाद्यवस्थानुस्यूते वर्तन्तेऽन्यत्र ताः स्फुटम् ॥४॥
        slp1: "ahaM suKI ca duHKI ca raktazcetyAdisaMvidaH . suKAdyavasTAnusyUte vartante'nyatra tAH sPuTam"
        iast: "ahaṃ sukhī ca duḥkhī ca raktaś cetyādi-saṃvidaḥ / sukhādy-avasthānusyūte vartante 'nyatra tāḥ sphuṭam //"
        meter: anuṣṭubh
        word_glosses:
          - word: अहं सुखी
            iast: ahaṃ sukhī
            gloss_en: "I am happy"
            morph: "phrase"
          - word: दुःखी
            iast: duḥkhī
            gloss_en: "miserable"
            morph: "m.nom.sg"
          - word: रक्तः
            iast: raktaḥ
            gloss_en: "attached"
            morph: "m.nom.sg"
          - word: संविदः
            iast: saṃvidaḥ
            gloss_en: "cognitions"
            morph: "f.nom.pl"
          - word: सुखाद्यवस्थानुस्यूते
            iast: sukhādy-avasthānusyūte
            gloss_en: "in (something) threaded through the states of pleasure etc."
            morph: "m.loc.sg cpd"
          - word: अन्यत्र
            iast: anyatra
            gloss_en: "elsewhere (i.e., in another substratum)"
            morph: "indecl"
          - word: स्फुटम्
            iast: sphuṭam
            gloss_en: "clearly"
            morph: "indecl"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Such cognitions as 'I am happy', 'I am miserable', 'I am attached', etc., clearly inhere in another (substratum — the Spanda Self) which is the thread running through the states of pleasure and the rest."
            ai_assisted: false
            status: published

      - verse: 5
        devanagari: न दुःखं न सुखं यत्र न ग्राह्यं ग्राहकं न च । न चास्ति मूढभावोऽपि तदस्ति परमार्थतः ॥५॥
        slp1: "na duHKaM na suKaM yatra na grAhyaM grAhakaM na ca . na cAsti mUDaBAvo'pi tadasti paramArTataH"
        iast: "na duḥkhaṃ na sukhaṃ yatra na grāhyaṃ grāhakaṃ na ca / na cāsti mūḍha-bhāvo 'pi tad asti paramārthataḥ //"
        meter: anuṣṭubh
        word_glosses:
          - word: दुःखम्
            iast: duḥkham
            gloss_en: "pain"
            morph: "n.nom.sg"
          - word: सुखम्
            iast: sukham
            gloss_en: "pleasure"
            morph: "n.nom.sg"
          - word: ग्राह्यम्
            iast: grāhyam
            gloss_en: "object of cognition"
            morph: "n.nom.sg"
          - word: ग्राहकम्
            iast: grāhakam
            gloss_en: "cognizing subject"
            morph: "n.nom.sg"
          - word: मूढभावः
            iast: mūḍha-bhāvaḥ
            gloss_en: "state of stupor/insentience"
            morph: "m.nom.sg"
          - word: परमार्थतः
            iast: paramārthataḥ
            gloss_en: "in highest truth"
            morph: "indecl"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "That alone exists in highest truth in which there is no pain, no pleasure, no object, no subject — not even a state of stupor."
            ai_assisted: false
            status: published

      - verse: 6
        devanagari: यतः करणवर्गोऽयं विमूढोऽमूढवत्स्वयम् । सहान्तरेण चक्रेण प्रवृत्तिस्थितिसंहृतीः ॥६॥
        slp1: "yataH karaRavargo'yaM vimUDo'mUDavatsvayam . sahAntareRa cakreRa pravfttisTitisaMhftIH"
        iast: "yataḥ karaṇa-vargo 'yaṃ vimūḍho 'mūḍha-vat svayam / sahāntareṇa cakreṇa pravṛtti-sthiti-saṃhṛtīḥ //"
        meter: anuṣṭubh
        word_glosses:
          - word: करणवर्गः
            iast: karaṇa-vargaḥ
            gloss_en: "the group of sense-instruments"
            morph: "m.nom.sg cpd"
          - word: विमूढः
            iast: vimūḍhaḥ
            gloss_en: "insentient"
            morph: "m.nom.sg adj"
          - word: अमूढवत्
            iast: amūḍha-vat
            gloss_en: "as if sentient"
            morph: "indecl"
          - word: अन्तरेण चक्रेण
            iast: antareṇa cakreṇa
            gloss_en: "together with the inner wheel (of antaḥkaraṇa)"
            morph: "n.ins.sg"
          - word: प्रवृत्तिस्थितिसंहृतीः
            iast: pravṛtti-sthiti-saṃhṛtīḥ
            gloss_en: "activities, maintenances, withdrawals"
            morph: "f.acc.pl cpd"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "From which this insentient set of sense-instruments, together with the inner wheel, behaves as if sentient — undertaking, sustaining, and withdrawing activities — (that is the Spanda principle)."
            ai_assisted: false
            status: published

      - verse: 7
        devanagari: लभते तत्प्रयत्नेन परीक्ष्यं तत्त्वमादरात् । यतः स्वतन्त्रता तस्य सर्वत्रेयमकृत्रिमा ॥७॥
        slp1: "laBate tatprayatnena parIkzyaM tattvamAdarAt . yataH svatantratA tasya sarvatreyamakftrimA"
        iast: "labhate tat-prayatnena parīkṣyaṃ tattvam ādarāt / yataḥ svatantratā tasya sarvatreyam akṛtrimā //"
        meter: anuṣṭubh
        word_glosses:
          - word: तत्प्रयत्नेन
            iast: tat-prayatnena
            gloss_en: "by effort directed at That"
            morph: "m.ins.sg cpd"
          - word: परीक्ष्यम्
            iast: parīkṣyam
            gloss_en: "to be investigated"
            morph: "n.acc.sg gerundive"
          - word: तत्त्वम्
            iast: tattvam
            gloss_en: "the Principle/Reality"
            morph: "n.acc.sg"
          - word: स्वतन्त्रता
            iast: svatantratā
            gloss_en: "absolute freedom"
            morph: "f.nom.sg"
          - word: अकृत्रिमा
            iast: akṛtrimā
            gloss_en: "innate, not contrived"
            morph: "f.nom.sg adj"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "One should investigate that Principle reverentially with sustained effort, for its innate, unconditioned freedom is found everywhere."
            ai_assisted: false
            status: published

      - verse: 8
        devanagari: न हीच्छानोदनस्यायं प्रेरकत्वेन वर्तते । अपि त्वात्मबलस्पर्शात्पुरुषस्तत्समो भवेत् ॥८॥
        slp1: "na hIcCAnodanasyAyaM prerakatvena vartate . api tvAtmabalasparzAtpuruzastatsamo Bavet"
        iast: "na hīcchā-nodanasyāyaṃ prerakatvena vartate / api tv ātma-bala-sparśāt puruṣas tat-samo bhavet //"
        meter: anuṣṭubh
        word_glosses:
          - word: इच्छानोदनस्य
            iast: icchā-nodanasya
            gloss_en: "of the urging of desire"
            morph: "n.gen.sg cpd"
          - word: प्रेरकत्वेन
            iast: prerakatvena
            gloss_en: "as the impeller"
            morph: "n.ins.sg"
          - word: आत्मबलस्पर्शात्
            iast: ātma-bala-sparśāt
            gloss_en: "from contact with the power of the Self"
            morph: "m.abl.sg cpd"
          - word: पुरुषः
            iast: puruṣaḥ
            gloss_en: "the (individual) person"
            morph: "m.nom.sg"
          - word: तत्समः
            iast: tat-samaḥ
            gloss_en: "equal to That"
            morph: "m.nom.sg cpd"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "He does not act as the mere impeller behind the urging of desire; rather, by contact with the power of the Self, the person becomes equal to That."
            ai_assisted: false
            status: published

      - verse: 9
        devanagari: निजाशुद्ध्यासमर्थस्य कर्तव्येष्वभिलाषिणः । यदा क्षोभः प्रलीयेत तदा स्यात्परमं पदम् ॥९॥
        slp1: "nijAzudDyAsamarTasya kartavyezvaBilAziRaH . yadA kzoBaH pralIyeta tadA syAtparamaM padam"
        iast: "nijāśuddhyāsamarthasya kartavyeṣv abhilāṣiṇaḥ / yadā kṣobhaḥ pralīyeta tadā syāt paramaṃ padam //"
        meter: anuṣṭubh
        word_glosses:
          - word: निजाशुद्धि
            iast: nijāśuddhi
            gloss_en: "innate impurity"
            morph: "f cpd-stem"
          - word: असमर्थस्य
            iast: asamarthasya
            gloss_en: "of one who is incapable"
            morph: "m.gen.sg adj"
          - word: कर्तव्येषु
            iast: kartavyeṣu
            gloss_en: "in things to be done"
            morph: "n.loc.pl gerundive"
          - word: अभिलाषिणः
            iast: abhilāṣiṇaḥ
            gloss_en: "of one who desires"
            morph: "m.gen.sg"
          - word: क्षोभः
            iast: kṣobhaḥ
            gloss_en: "agitation"
            morph: "m.nom.sg"
          - word: प्रलीयेत
            iast: pralīyeta
            gloss_en: "may dissolve"
            morph: "verb 3.sg.opt"
          - word: परमं पदम्
            iast: paramaṃ padam
            gloss_en: "the supreme state"
            morph: "n.nom.sg"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "When the agitation of one who, rendered incapable by innate impurity, yet hankers after actions — when that agitation dissolves, then the supreme state arises."
            ai_assisted: false
            status: published

      - verse: 10
        devanagari: तदास्याकृत्रिमो धर्मो ज्ञत्वकर्तृत्वलक्षणः । यतस्तदेप्सितं सर्वं जानाति च करोति च ॥१०॥
        slp1: "tadAsyAkftrimo Darmo jYatvakartftvalakzaRaH . yatastadepsitaM sarvaM jAnAti ca karoti ca"
        iast: "tadāsyākṛtrimo dharmo jñatva-kartṛtva-lakṣaṇaḥ / yatas tad epsitaṃ sarvaṃ jānāti ca karoti ca //"
        meter: anuṣṭubh
        word_glosses:
          - word: अकृत्रिमः
            iast: akṛtrimaḥ
            gloss_en: "innate"
            morph: "m.nom.sg adj"
          - word: धर्मः
            iast: dharmaḥ
            gloss_en: "nature, attribute"
            morph: "m.nom.sg"
          - word: ज्ञत्वकर्तृत्वलक्षणः
            iast: jñatva-kartṛtva-lakṣaṇaḥ
            gloss_en: "characterised by omniscience and omnipotence"
            morph: "m.nom.sg cpd"
          - word: एप्सितम्
            iast: epsitam
            gloss_en: "desired"
            morph: "n.acc.sg ppl"
          - word: जानाति
            iast: jānāti
            gloss_en: "knows"
            morph: "verb 3.sg.pres"
          - word: करोति
            iast: karoti
            gloss_en: "does"
            morph: "verb 3.sg.pres"
        translations:
          - lang: en
            translator: "public-domain composite"
            source: "synthesized from PD-era English renderings"
            license: PD
            text: "Then his innate nature — marked by omniscience and omnipotence — reveals itself, whereby he knows and accomplishes whatever he desires."
            ai_assisted: false
            status: published

      - verse: 11
        devanagari: तमधिष्ठातृभावेन स्वभावमवलोकयन् । स्मयमान इवास्ते यस्तस्येयं कुसृतिः कुतः ॥११॥
        slp1: "tamaDizWAtfBAvena svaBAvamavalokayan . smayamAna ivAste yastasyeyaM kusftiH kutaH"
        iast: "tam adhiṣṭhātṛ-bhāvena svabhāvam avalokayan / smayamāna ivāste yas tasyeyaṃ kusṛtiḥ kutaḥ //"
        meter: anuṣṭubh
        word_glosses:
          - word: अधिष्ठातृभावेन
            iast: adhiṣṭhātṛ-bhāvena
            gloss_en: "in the role of the presiding agent"
            morph: "m.ins.sg cpd"
          - word: स्वभावम्
            iast: svabhāvam
            gloss_en: "one's own nature"
            morph: "m.acc.sg"
          - word: अवलोकयन्
            iast: avalokayan
            gloss_en: "beholding"
            morph: "m.nom.sg ppl"
          - word: स्मयमानः
            iast: smayamānaḥ
            gloss_en: "wondering, smiling in amazement"
            morph: "m.nom.sg ppl"
          - word: कुसृतिः
