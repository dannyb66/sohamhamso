      gloss_mr: उन्मेष व निमेषामुळे (डोळ्यांच्या उघडण्या-मिटण्यामुळे)
      gloss_or: ଉନ୍ମେଷ ଓ ନିମେଷ ଦ୍ୱାରା (ଚକ୍ଷୁର ଖୋଲିବା ଓ ବନ୍ଦ କରିବାର)
