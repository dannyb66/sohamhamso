      gloss_hi: उन्मेष (नेत्र खोलना) और निमेष (नेत्र मूँदना) के द्वारा (द्विवचन, करण कारक — समासगत)
      gloss_kn: (ಕಣ್ಣುಗಳ) ತೆರೆಯುವಿಕೆ ಮತ್ತು ಮುಚ್ಚುವಿಕೆಯಿಂದ
