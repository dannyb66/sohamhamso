      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ते मी सांगतो, यात संशय नाही — जे तत्काळ कौलिक सिद्धी देते. हा कौलिक विधी, हे देवी, माझ्या हृदयाकाशात स्थित आहे.
      ai_assisted: true
      status: published
