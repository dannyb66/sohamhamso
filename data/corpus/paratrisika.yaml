      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ইনিই সর্ব তন্ত্রে সর্বদা যোনি (উৎস) বলিয়া সমাখ্যাত। চতুর্দশ (স্বর ঔ)-যুক্ত, হে ভদ্রে, তিথীশের অন্ত (বিসর্গ ঃ)-সমন্বিত — এই তৃতীয় ব্রহ্ম, হে সুশ্রোণি, ভৈরবাত্মার হৃদয়।
