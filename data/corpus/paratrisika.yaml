    - lang: or
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ମୁଁ ତାହା କହୁଅଛି, ସନ୍ଦେହ ନାହିଁ — ଯାହା ତତ୍‌କ୍ଷଣାତ୍ କୌଲିକ ସିଦ୍ଧି ପ୍ରଦାନ କରେ। ହେ ଦେବୀ, ଏହି କୌଲିକ ବିଧି ମୋ' ହୃଦୟ-ବ୍ୟୋମ (ହୃଦୟାକାଶ)ରେ ଅବସ୍ଥିତ ଅଟେ।
