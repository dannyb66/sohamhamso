      text: হে ভদ্ৰে, এই যোনি সকলো তন্ত্ৰত সদায় ঘোষিত হৈছে। হে সুশ্ৰোণী, চতুৰ্দশৰ (অৰ্থাৎ ঔ স্বৰৰ) সৈতে যুক্ত, তিথীশৰ অন্তেৰে (বিসৰ্গেৰে) সমন্বিত — এই তৃতীয় ব্ৰহ্ম ভৈৰৱাত্মাৰ হৃদয়।
