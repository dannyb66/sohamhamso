      text: અને દીક્ષા અસંદિગ્ધપણે થાય છે, તલ અને ઘીની આહુતિ વગર પણ — મસ્તકે, મુખે, હૃદયમાં, ગુહ્ય સ્થાને, અને એ જ રીતે મૂર્તિ (દેહ)માં.
