      text: అట్లే చరాచరమైన ఈ సమస్త జగత్తు హృదయబీజమునందు నిలిచియున్నది. ఇట్లు దీనిని తత్త్వతః ఎరిగినవానికి (ఆ దీక్ష) నిర్వాణగామిని (నిర్వాణమునకు తీసుకొనిపోవునది) అగును.
