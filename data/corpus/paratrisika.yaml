      license: CC-BY-SA
      text: यह योनि समस्त तन्त्रों में सदा भली प्रकार कही गई है। हे भद्रे, चौदहवें (स्वर औ) से युक्त, तिथीश के अन्त (विसर्ग) से समन्वित — हे सुश्रोणि, यह तृतीय ब्रह्म ही भैरव-स्वरूप का हृदय है।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ಇದನ್ನು ಎಲ್ಲ ತಂತ್ರಗಳಲ್ಲಿಯೂ ಸದಾ ಯೋನಿ (ಗರ್ಭ, ಮೂಲ) ಎಂದು ಸಮಾಖ್ಯಾತಗೊಂಡಿದೆ. ಎಲೈ ಭದ್ರೆಯೇ, ಹದಿನಾಲ್ಕನೆಯದರೊಡನೆ (ಔ ಕಾರದೊಡನೆ) ಕೂಡಿದ, ತಿಥೀಶನ ಅಂತ್ಯದೊಡನೆ (ವಿಸರ್ಗದೊಡನೆ) ಒಡಗೂಡಿದ — ಎಲೈ ಸುಶ್ರೋಣಿಯೇ, ಆ ಮೂರನೆಯ ಬ್ರಹ್ಮವೇ ಭೈರವಾತ್ಮನ (ಭೈರವಸ್ವರೂಪಿಯ) ಹೃದಯ.
