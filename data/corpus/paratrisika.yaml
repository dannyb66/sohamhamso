      text: और दीक्षा निःसंदेह तिल और घृत की आहुति के बिना भी हो जाती है — मूर्धा (शिर) पर, मुख पर, हृदय में, गुह्य-स्थान में, तथा इसी प्रकार मूर्ति (देह) में।
