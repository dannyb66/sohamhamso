      license: CC-BY-SA
      text: "And initiation, beyond doubt, takes place even without oblations of sesame and ghee — at the crown, the mouth, the heart, the secret place, and likewise in the body."
      ai_assisted: true
      status: published
      judge_score: 8
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: as
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: তিল আৰু ঘৃতৰ আহুতিবিহীন হ'লেও, দীক্ষা নিঃসন্দেহে হয় — মূৰ্ধাত, মুখত, হৃদয়ত, গুহ্যত আৰু তেনেদৰেই মূৰ্তিত (দেহত)।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: দীক্ষা অসন্দিগ্ধরূপে ঘটে, তিল ও ঘৃতের আহুতি ব্যতিরেকেও — মূর্ধায় (মস্তকে), মুখে, হৃদয়ে, গুহ্যে এবং তেমনই মূর্তিতে (দেহে)।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: gu
