      text: ಎಳ್ಳು ಮತ್ತು ತುಪ್ಪದ ಆಹುತಿಗಳಿಲ್ಲದೆಯೇ ದೀಕ್ಷೆಯು ಸಂದೇಹವಿಲ್ಲದೆ ನಡೆಯುತ್ತದೆ — ಶಿರದಲ್ಲಿ, ಮುಖದಲ್ಲಿ, ಹೃದಯದಲ್ಲಿ, ಗುಹ್ಯದಲ್ಲಿ (ಗುಪ್ತಾಂಗದಲ್ಲಿ), ಮತ್ತು ಹಾಗೆಯೇ ಮೂರ್ತಿಯಲ್ಲಿ (ದೇಹದಲ್ಲಿ).
