      license: CC-BY-SA
      text: ਮੈਂ ਉਸ ਨੂੰ ਦੱਸਦਾ ਹਾਂ — ਇਸ ਵਿੱਚ ਕੋਈ ਸੰਦੇਹ ਨਹੀਂ — ਜੋ ਤੁਰੰਤ ਹੀ ਕੌਲਿਕ ਸਿੱਧੀ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ। ਹੇ ਦੇਵੀ, ਇਹ ਕੌਲਿਕ ਵਿਧੀ ਮੇਰੇ ਹਿਰਦੇ ਦੇ ਆਕਾਸ਼ (ਹ੍ਰਿਦ੍-ਵ੍ਯੋਮ) ਵਿੱਚ ਸਥਿਤ ਹੈ।
