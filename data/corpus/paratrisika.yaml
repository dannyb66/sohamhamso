      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: वैसे ही यह सम्पूर्ण चराचर जगत् हृदय-बीज में स्थित है। जो इसे इस प्रकार तत्त्वतः जान लेता है, उसके लिए (दीक्षा) निर्वाण की ओर ले जाने वाली होती है।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ಹಾಗೆಯೇ ಈ ಚರಾಚರ ಜಗತ್ತೆಲ್ಲವೂ ಹೃದಯಬೀಜದಲ್ಲಿ ನೆಲೆಸಿದೆ. ಇದನ್ನು ಯಾರು ಹೀಗೆ ತತ್ತ್ವತಃ ತಿಳಿಯುತ್ತಾನೋ, ಅವನಿಗೆ (ಆ ದೀಕ್ಷೆಯು) ನಿರ್ವಾಣಗಾಮಿನಿ (ನಿರ್ವಾಣಕ್ಕೆ ಒಯ್ಯುವಂಥದು).
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (session-opus)
      license: CC-BY-SA
      text: അപ്രകാരംതന്നെ ചരാചരമായ ഈ ജഗത്തു മുഴുവൻ ഹൃദയബീജത്തിൽ സ്ഥിതിചെയ്യുന്നു. ഇപ്രകാരം ഇതിനെ തത്ത്വേന ആരറിയുന്നുവോ, അവന് (ദീക്ഷ) നിർവാണത്തിലേക്കു നയിക്കുന്നതാകുന്നു.
      ai_assisted: true
      status: published
      model: opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: तसे हे चराचर जग हृदयबीजात स्थित आहे. जो कोणी हे अशा प्रकारे तत्त्वतः जाणतो, त्याची (दीक्षा) निर्वाणाकडे नेणारी होते.
