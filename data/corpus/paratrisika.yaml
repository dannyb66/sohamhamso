      license: CC-BY-SA
      text: ദീക്ഷ, സന്ദേഹമെന്യേ, തിലത്തിന്റെയും ആജ്യത്തിന്റെയും (നെയ്യിന്റെയും) ആഹുതികൂടാതെതന്നെ സംഭവിക്കുന്നു — മൂർധാവിലും (ശിരസ്സിലും), വക്ത്രത്തിലും (മുഖത്തും), ഹൃദയത്തിലും, ഗുഹ്യസ്ഥാനത്തും, അപ്രകാരംതന്നെ മൂർത്തിയിലും (ദേഹത്തിലും).
