      license: CC-BY-SA
      text: তেনেকৈয়ে এই চৰাচৰ জগত হৃদয়-বীজত অৱস্থিত। যিয়ে এইদৰে তত্ত্বত (ইয়াক) জানে, তাৰ বাবে (দীক্ষা) নিৰ্বাণগামিনী হয়।
