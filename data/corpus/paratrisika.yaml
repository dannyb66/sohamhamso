      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: હે ભદ્રે, આ યોનિ (સ્રોત) સર્વ તંત્રોમાં સદા સમાખ્યાત (ઘોષિત) છે. હે સુશ્રોણિ, ચૌદમા (સ્વર ‘औ’)થી યુક્ત, તિથિ-ઈશના અંત (વિસર્ગ ઃ)થી સમન્વિત — એ ત્રીજું બ્રહ્મ ભૈરવાત્માનું હૃદય છે.
