    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: "This is proclaimed as the Womb (yoni) in all the tantras, ever (and everywhere). Joined with the fourteenth (au), O auspicious one, accompanied by the end of the tithi-lord (the visarga) — this third brahman, O fair-hipped one, is the Heart of Bhairava's very Self."
      ai_assisted: true
      status: published
      judge_score: 8
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: as
