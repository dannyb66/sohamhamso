      prompt_version: v1-sanskrit-grounded
    - lang: or
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ସେହିପରି ଏହି ଚରାଚର ଜଗତ ହୃଦୟ-ବୀଜରେ ସ୍ଥିତ। ଯେ ଏହିପରି ତତ୍ତ୍ୱତଃ (ସ୍ୱରୂପତଃ) ଜାଣେ, ତାହା ପକ୍ଷେ (ଦୀକ୍ଷା) ନିର୍ବାଣଗାମିନୀ ହୁଏ।
