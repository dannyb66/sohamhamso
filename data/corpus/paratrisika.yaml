    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: "Even one who has not seen the maṇḍala — whoever knows it thus, in truth — he would forever be a sharer in attainment; he is a yogin, and he is (truly) initiated."
      ai_assisted: true
      status: published
      judge_score: 8
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: as
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: মণ্ডল নেদেখা জনেও, এইদৰে, যিকোনোৱে যদি তত্ত্বত ইয়াক জানে, তেওঁ নিত্য সিদ্ধিভাগী হ'ব; তেওঁ যোগী, আৰু তেওঁ (প্ৰকৃততে) দীক্ষিত।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: যে মণ্ডল দর্শন করে নাই সেও — এইরূপে যে কেহ ইহা তত্ত্বতঃ (যথার্থরূপে) জানে — সে নিত্য সিদ্ধিভাগী হয়; সে-ই যোগী, এবং সে-ই দীক্ষিত।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: જેણે માંડલ જોયું નથી તે પણ — જે કોઈ આ રીતે તેને તત્ત્વતઃ (યથાર્થ રૂપે) જાણે છે — તે સદા સિદ્ધિનો ભાગી થાય; તે જ યોગી છે, અને તે જ દીક્ષિત છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: मण्डल को बिना देखे भी, जो कोई इस प्रकार इसे तत्त्वतः जान लेता है, वह सदा सिद्धि का भागी हो; वही योगी है और वही (वस्तुतः) दीक्षित है।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ಮಂಡಲವನ್ನು ಕಾಣದವನೂ ಸಹ — ಯಾರಾದರೂ ಇದನ್ನು ಹೀಗೆ ತತ್ತ್ವತಃ (ಯಥಾರ್ಥವಾಗಿ) ತಿಳಿದಿದ್ದರೆ — ಅವನು ಸದಾ ಸಿದ್ಧಿಭಾಗಿಯಾಗುತ್ತಾನೆ; ಅವನೇ ಯೋಗಿ, ಅವನೇ ದೀಕ್ಷಿತ.
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (session-opus)
      license: CC-BY-SA
      text: മണ്ഡലം കാണാത്തവനായാലും, ഇപ്രകാരം ഇതിനെ തത്ത്വതഃ ആരെങ്കിലും അറിയുന്നുവോ, അവൻ എപ്പോഴും സിദ്ധിഭാഗിയായി (സിദ്ധിയുള്ളവനായി) ഭവിക്കും; അവൻതന്നെ യോഗി, അവൻതന്നെ (യഥാർഥത്തിൽ) ദീക്ഷിതൻ.
      ai_assisted: true
      status: published
      model: opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: mr
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: मंडल न पाहिलेला असूनही, जो कोणी ह्याला अशा प्रकारे तत्त्वतः जाणतो, तो सदा सिद्धीचा भागी होईल; तोच योगी, आणि तोच (खरा) दीक्षित.
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: or
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ମଣ୍ଡଳ ନ ଦେଖିଥିଲେ ସୁଦ୍ଧା, ଯେ କେହି ଏହିପରି ତତ୍ତ୍ୱତଃ (ସ୍ୱରୂପତଃ) ଏହାକୁ ଜାଣେ, ସେ ସର୍ବଦା ସିଦ୍ଧିଭାଗୀ ହୁଏ; ସେ ହିଁ ଯୋଗୀ, ଏବଂ ସେ ହିଁ (ପ୍ରକୃତ) ଦୀକ୍ଷିତ।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: pa
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ਜਿਸ ਨੇ ਮੰਡਲ ਨਹੀਂ ਵੀ ਵੇਖਿਆ, ਉਹ ਵੀ — ਜੋ ਕੋਈ ਇਸ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਤੱਤ ਰੂਪ ਵਿੱਚ ਜਾਣਦਾ ਹੈ — ਉਹ ਸਦਾ ਸਿੱਧੀ ਦਾ ਭਾਗੀ ਹੁੰਦਾ ਹੈ; ਉਹੀ ਯੋਗੀ ਹੈ ਅਤੇ ਉਹੀ (ਸੱਚਮੁੱਚ) ਦੀਖਿਅਤ (ਦੀਖਿਆ-ਪ੍ਰਾਪਤ) ਹੈ।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: ta
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: மண்டலத்தைக் காணாதவனாயினும், இவ்வாறு எவன் இதனை உண்மையில் அறிகிறானோ, அவன் என்றும் சித்திக்கு உரியவனாவான்; அவனே யோகி, அவனே (உண்மையில்) தீட்சை பெற்றவன்.
      ai_assisted: true
