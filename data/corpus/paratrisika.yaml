      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: તેમ આ ચરાચર (ચલ-અચલ) જગત હૃદય-બીજમાં રહેલું છે. જે આ રીતે તેને તત્ત્વતઃ જાણે છે, તેને માટે (દીક્ષા) નિર્વાણ ભણી લઈ જનારી છે.
