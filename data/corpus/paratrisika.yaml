  description: |
    The Parātrīśikā (also transmitted as Parātriṃśikā, "the Thirty Verses
    on the Supreme") is a short Trika tantra of 36 verses, framed as a
    dialogue between the Goddess and Bhairava and traditionally regarded
    as the essence of the Rudrayāmala Tantra (its closing verse says
    "ity etad rudrayāmalam"). It is the root text of Abhinavagupta's
    Parātrīśikā-Vivaraṇa and Laghuvṛtti commentaries; the sibling slug
    paratrisika-vivarana is reserved for the Vivaraṇa. This file ingests
    the mūla verses only, verbatim from GRETIL's e-text; two
    legacy-encoding artifacts in the upstream transcription (verse 19
    "ma.ṅdalo", verse 29 "stha.ṅdilaṃ") are preserved as-is rather than
    emended.

