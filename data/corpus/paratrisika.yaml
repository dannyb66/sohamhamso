      license: CC-BY-SA
      text: அவ்வாறே அசையும்-அசையா இந்த உலகம் முழுவதும் இதயவிதையில் (ஹ்ருதயபீஜத்தில்) அமைந்துள்ளது. இவ்வாறு எவன் இதனை உண்மையில் அறிகிறானோ, அவனுக்கு (தீட்சை) நிர்வாணத்திற்கு வழிநடத்துகிறது.
