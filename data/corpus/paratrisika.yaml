    translations:
    - lang: en
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: "I shall declare it — no doubt of it — that which at once bestows the kaulika attainment. This kaulika method, O Goddess, abides in the sky of my heart."
      ai_assisted: true
      status: published
      judge_score: 9
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: as
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: মই ক'ম, ইয়াত সন্দেহ নাই — যিয়ে তৎক্ষণাৎ কৌলিক সিদ্ধি দিয়ে। হে দেৱী, এই কৌলিক বিধি মোৰ হৃদয়-ব্যোমত (হৃদয়ৰ আকাশত) অৱস্থিত।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: bn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: আমি কহিতেছি — ইহাতে সন্দেহ নাই — যাহা তৎক্ষণাৎ কৌলিক সিদ্ধি দান করে। হে দেবী, এই কৌলিক বিধি আমার হৃদয়-ব্যোমে (হৃদয়ের আকাশে) অবস্থিত।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: gu
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: હું તે કહું છું, એમાં કોઈ સંદેહ નથી — એ જે તરત જ કૌલિક સિદ્ધિ આપે છે. હે દેવી, આ કૌલિક વિધિ મારા હૃદયરૂપી આકાશ (હૃદ્-વ્યોમ)માં અવસ્થિત છે.
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: hi
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: मैं (उसे) कहता हूँ, इसमें कोई संदेह नहीं — वह जो तत्काल कौलिक सिद्धि देता है। हे देवी, यह कौलिक विधि मेरे हृदयाकाश में स्थित है।
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: kn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ತಕ್ಷಣವೇ ಕೌಲಿಕಸಿದ್ಧಿಯನ್ನು ನೀಡುವ ಅದನ್ನು ನಾನು ಹೇಳುತ್ತೇನೆ — ಇದರಲ್ಲಿ ಸಂದೇಹವಿಲ್ಲ. ಎಲೈ ದೇವಿಯೇ, ಈ ಕೌಲಿಕ ವಿಧಿಯು ನನ್ನ ಹೃದಯವೆಂಬ ವ್ಯೋಮದಲ್ಲಿ (ಆಕಾಶದಲ್ಲಿ) ನೆಲೆಸಿದೆ.
      ai_assisted: true
      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: ml
      translator: sohamhamso (session-opus)
      license: CC-BY-SA
      text: ഞാൻ (അതിനെ) പറയുന്നു, സന്ദേഹമില്ല — തത്ക്ഷണം കൗലികസിദ്ധിയെ പ്രദാനംചെയ്യുന്ന അതിനെ. ഹേ ദേവി, ഈ കൗലികവിധി എന്റെ ഹൃദയാകാശത്തിൽ (ഹൃദ്-വ്യോമത്തിൽ) സ്ഥിതിചെയ്യുന്നു.
