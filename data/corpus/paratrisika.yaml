    - lang: bn
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: তেমনই এই চরাচর জগৎ হৃদয়-বীজে অধিষ্ঠিত। যে কেহ ইহা এইরূপে তত্ত্বতঃ জানে, তাহার (দীক্ষা) নির্বাণগামিনী।
