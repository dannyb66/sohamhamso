      status: published
      model: claude-opus-4-8
      prompt_version: v1-sanskrit-grounded
    - lang: pa
      translator: sohamhamso (claude-opus-4-8)
      license: CC-BY-SA
      text: ਉਸੇ ਤਰ੍ਹਾਂ ਇਹ ਸਾਰਾ ਚਰਾਚਰ (ਚੱਲਣ ਵਾਲਾ ਤੇ ਨਾ ਚੱਲਣ ਵਾਲਾ) ਜਗਤ ਹਿਰਦੇ-ਬੀਜ ਵਿੱਚ ਸਥਿਤ ਹੈ। ਜੋ ਇਸ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਤੱਤ-ਰੂਪ ਵਿੱਚ ਜਾਣਦਾ ਹੈ, ਉਸ ਲਈ (ਦੀਖਿਆ) ਨਿਰਵਾਣ ਵੱਲ ਲੈ ਜਾਣ ਵਾਲੀ ਹੁੰਦੀ ਹੈ।
