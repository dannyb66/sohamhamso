# ============================================================
# YouTube Shorts pipeline config (Phase 1)
#
# Zod-validated by pipeline/youtube/config.ts::loadYoutubeConfig().
# Style routes off text slug -> preset (kula is config-only — no
# kula/school driver exists in the corpus or DB; see reconciled plan).
#
# Palettes researched from scholarly publications (SUNY Shaiva
# Traditions, Motilal, hareesh.org, Dyczkowski, Kinsley UC Press) —
# deliberately distinct from saffron-political / wellness-slop register.
# A preset change (rename / bg tweak / footer wording) MUST bump
# TEMPLATE_VERSION in pipeline/youtube/versions.ts.
# ============================================================

style_presets:
  trika-classic:
    bg: "#0E1B2E"                # midnight-indigo (Kashmiri winter sky)
    accent: "#C9A961"            # aged-gold (manuscript leaf)
    text: "#E8E4D8"             # manuscript-cream
    headline_font: "EB Garamond"
    body_font: "EB Garamond"
    devanagari_font: "Noto Serif Devanagari"
    footer_line: "Trika Śaiva canon · sohamhamso.org"
    ornament: "none"

  trika-recognition:
    bg: "#13192B"               # cooler indigo, distinguishes from base Trika
    accent: "#C9A961"
    text: "#E8E4D8"
    headline_font: "EB Garamond"
    body_font: "EB Garamond"
    devanagari_font: "Noto Serif Devanagari"
    footer_line: "Pratyabhijñā lineage · sohamhamso.org"
    ornament: "none"

  trika-pulse:
    bg: "#0E2024"               # deep slate, hint of teal for Spanda's "pulse"
    accent: "#C9A961"
    text: "#E8E4D8"
    headline_font: "EB Garamond"
    body_font: "EB Garamond"
    devanagari_font: "Noto Serif Devanagari"
    footer_line: "Spanda lineage · sohamhamso.org"
    ornament: "none"

  shakta-kali:
    bg: "#0A0507"               # cremation near-black (Kinsley UC Press)
    accent: "#8B1A1A"           # oxblood crimson
    text: "#F2EDE4"             # bone-white
    headline_font: "EB Garamond"
    body_font: "EB Garamond"
    devanagari_font: "Noto Serif Devanagari"
    footer_line: "Śākta canon · sohamhamso.org"
    ornament: "none"

texts:
  siva-sutras:
    kula: trika
    style_preset: trika-classic
    youtube_eligible: true
    min_translation_status: reviewed
  pratyabhijna-hrdayam:
    kula: trika-pratyabhijna
    style_preset: trika-recognition
    youtube_eligible: true
    min_translation_status: reviewed
  spanda-karikas:
    kula: trika-spanda
    style_preset: trika-pulse
    youtube_eligible: true
    min_translation_status: reviewed
  vijnana-bhairava-tantra:
    kula: trika
    style_preset: trika-classic
    youtube_eligible: false
    reason: "Muktabodha — permission pending"
  karpuradi-stotra:
    kula: shakta
    style_preset: shakta-kali
    youtube_eligible: false
    reason: "license verification pending"

voices:
  en:
    provider: google
    voice_id: "en-US-Studio-O"
  hi:
    provider: google
    voice_id: "hi-IN-Chirp3-HD-Leda"
  ta:
    provider: google
    voice_id: "ta-IN-Chirp3-HD-Leda"
  te:
    provider: google
    voice_id: "te-IN-Chirp3-HD-Leda"
  kn:
    provider: google
    voice_id: "kn-IN-Chirp3-HD-Leda"
  ml:
    provider: google
    voice_id: "ml-IN-Chirp3-HD-Leda"
  bn:
    provider: google
    voice_id: "bn-IN-Chirp3-HD-Leda"
  mr:
    provider: google
    voice_id: "mr-IN-Chirp3-HD-Leda"
  gu:
    provider: google
    voice_id: "gu-IN-Chirp3-HD-Leda"
  pa:
    provider: google
    voice_id: "pa-IN-Chirp3-HD-Leda"
  # Odia (or-IN) and Assamese (as-IN) have full corpus translations but NO
  # Google Cloud TTS voice, so they narrate via Azure Cognitive Services Speech.
  # Voice short-names verified against Microsoft Learn "Language and Voice
  # Support for Azure Speech" (GA Indian voices). Requires AZURE_SPEECH_KEY +
  # AZURE_SPEECH_REGION (see scripts/youtube/README.md → Azure TTS setup).
  or:
    provider: azure
    voice_id: "or-IN-SubhasiniNeural" # Odia, female (alt: or-IN-SukantNeural, male)
  as:
    provider: azure
    voice_id: "as-IN-YashicaNeural" # Assamese, female (alt: as-IN-PriyomNeural, male)

defaults:
  channel_handle: "@sohamhamso"
  visibility: "unlisted"
  fps: 30
  duration_s: 18
  speaking_rate: 0.75   # shorts narration speed (slower = clearer audio); chapters stay at 1.0

# Per-language YouTube channels (brand accounts under one Google account).
# The upload DESTINATION is the per-channel OAuth refresh token
# (env YT_REFRESH_TOKEN_<LANG>); the handle here is the audit/quota key
# (youtube_quota) + the operator-facing label. en = the existing @sohamhamso;
# set the real @handles for the others AFTER creating the brand channels.
channels:
  en: { channel_handle: "@sohamhamso" }
  hi: { channel_handle: "@sohamhamso-hi" }
  ta: { channel_handle: "@sohamhamso-ta" }
  te: { channel_handle: "@sohamhamso-te" }
  kn: { channel_handle: "@sohamhamso-kn" }
  ml: { channel_handle: "@sohamhamso-ml" }
  bn: { channel_handle: "@sohamhamso-bn" }
  mr: { channel_handle: "@sohamhamso-mr" }
  gu: { channel_handle: "@sohamhamso-gu" }
  pa: { channel_handle: "@sohamhamso-pa" }
  or: { channel_handle: "@sohamhamso-or" }
  as: { channel_handle: "@sohamhamso-as" }

# Chapter-format videos (16:9 full-chapter, verse_num=0 rows). English-only
# v1 — expanding langs is config + backfill, not code. Pacing knobs here so
# the M1 sample gate iterates by config-edit + re-run (never code-edit).
# min_translation_status is the PER-FORMAT floor (draft, per plan D1 — no
# corpus mutation); uploads_enabled stays false until the 30-day shorts
# measurement window closes (enforced upload hold, not policy).
chapters:
  # All 12 translated languages. en + 9 Indic narrate via Google (Chirp 3 HD
  # Leda); or/as via Azure (need AZURE_SPEECH_KEY/REGION — render fails loudly
  # without them). Each lang uploads to its own channel (see channels:).
  langs: [en, hi, ta, te, kn, ml, bn, mr, gu, pa, or, as]
  fps: 30
  title_card_s: 5
  outro_s: 9
  min_translation_status: draft
  uploads_enabled: false
  min_seg_s: 4     # narration-driven floor; kills the dead air the old 10s floor caused on short sutras
  seg_lead_in_s: 0.8   # tight breathing room before each verse
  seg_tail_s: 0.6      # tight breathing room after each verse
  group_max_verses: 3   # fold ≤3 short verses per YouTube chapter marker so every marker is ≥10s (YouTube drops chapters otherwise)
  speaking_rate: 0.75   # contemplative native narration speed (Google TTS speakingRate)
  encode: cbr8   # cbr8 | crf18

# Rejected at the youtube-validate-config gate. Saffron is additionally
# enforced in code as ±15% RGB-distance around #FF9933 (see
# pipeline/youtube/config.ts::isForbiddenColor / SAFFRON_HEX).
forbidden_colors:
  - "#FF9933"   # saffron-orange (BJP/Hindu-nationalist flag); ±15% range enforced in code
  - "#FF6600"   # bright saffron variant
  - "#FF00FF"   # magenta — "sacred feminine" neo-tantra signal
  - "#FF1493"   # hot-pink — neo-tantra signal
  - "#7B2FBE"   # purple — Sadhguru / New-Age purple-gold register
  - "#9B59B6"   # purple variant
  - "#40E0D0"   # turquoise — "om water bottle" appropriation flag

forbidden_iconography:
  - "om-motif"
  - "stylized-kali"
  - "deity-image"
