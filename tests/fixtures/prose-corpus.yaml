        devanagari: |-
          चितिप्रसरणमेव जगत् । सा हि भगवती विश्वस्य सिद्धौ हेतुः । स्वातन्त्र्यात् सृष्टिसंहारौ करोति । न हि चित्त्वव्यतिरेकेण किञ्चित् सम्भवति । अत एव सर्वं चिन्मयम् ।

